<main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdfDoc=null,currentPage=1,totalPages=0,canvas=null,ctx=null;
var currentTool='view';
var annotations=[];
var isDrawing=false,drawStart={x:0,y:0};

document.getElementById('uploadZone').addEventListener('click',function(){document.getElementById('fileInput').click()});
document.getElementById('uploadZone').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
document.getElementById('uploadZone').addEventListener('dragleave',function(){this.classList.remove('dragover')});
document.getElementById('uploadZone').addEventListener('drop',function(e){
  e.preventDefault();this.classList.remove('dragover');
  if(e.dataTransfer.files.length)loadPDF(e.dataTransfer.files[0]);
});
document.getElementById('fileInput').addEventListener('change',function(e){
  if(e.target.files.length)loadPDF(e.target.files[0]);
});

function loadPDF(file){
  var reader=new FileReader();
  reader.onload=function(e){
    pdfjsLib.getDocument({data:e.target.result}).promise.then(function(pdf){
      pdfDoc=pdf;totalPages=pdf.numPages;currentPage=1;
      document.getElementById('uploadZone').style.display='none';
      document.getElementById('editorArea').style.display='block';
      canvas=document.getElementById('pdfCanvas');
      ctx=canvas.getContext('2d');
      renderPage();
    });
  };
  reader.readAsArrayBuffer(file);
}

function renderPage(){
  pdfDoc.getPage(currentPage).then(function(page){
    var scale=Math.min(700/page.getViewport({scale:1}).width,1.5);
    var viewport=page.getViewport({scale:scale});
    canvas.width=viewport.width;canvas.height=viewport.height;
    page.render({canvasContext:ctx,viewport:viewport}).promise.then(function(){
      redrawAnnotations();
    });
    document.getElementById('pageInfo').textContent=currentPage+' / '+totalPages;
  });
}

function redrawAnnotations(){
  annotations.filter(function(a){return a.page===currentPage}).forEach(function(a){
    if(a.type==='text'){
      ctx.font='16px sans-serif';ctx.fillStyle=a.color||'#ef4444';
      ctx.fillText(a.text,a.x,a.y);
    }else if(a.type==='draw'){
      ctx.strokeStyle=a.color||'#ef4444';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
    }
  });
}

document.getElementById('btnPrev').addEventListener('click',function(){if(currentPage>1){currentPage--;renderPage()}});
document.getElementById('btnNext').addEventListener('click',function(){if(currentPage<totalPages){currentPage++;renderPage()}});

document.querySelectorAll('.tool-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tool-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    currentTool=btn.dataset.tool;
  });
});

canvas=document.getElementById('pdfCanvas');
canvas.addEventListener('click',function(e){
  if(currentTool==='text'){
    var rect=canvas.getBoundingClientRect();
    var x=e.clientX-rect.left,y=e.clientY-rect.top;
    var text=prompt('输入文字：');
    if(text){
      annotations.push({type:'text',page:currentPage,x:x,y:y,text:text,color:'#ef4444'});
      redrawAnnotations();
    }
  }
});

canvas.addEventListener('mousedown',function(e){
  if(currentTool==='draw'){
    isDrawing=true;
    var rect=canvas.getBoundingClientRect();
    drawStart={x:e.clientX-rect.left,y:e.clientY-rect.top};
  }
});
canvas.addEventListener('mousemove',function(e){
  if(!isDrawing)return;
  var rect=canvas.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  ctx.strokeStyle='#ef4444';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(drawStart.x,drawStart.y);ctx.lineTo(x,y);ctx.stroke();
  drawStart={x:x,y:y};
});
canvas.addEventListener('mouseup',function(){
  if(isDrawing){isDrawing=false;annotations.push({type:'draw',page:currentPage,x1:drawStart.x,y1:drawStart.y,x2:drawStart.x,y2:drawStart.y,color:'#ef4444'})}
});

document.getElementById('btnExport').addEventListener('click',function(){
  var link=document.createElement('a');
  link.download='pdf-page-'+currentPage+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
});
document.getElementById('btnReset').addEventListener('click',function(){
  annotations=[];renderPage();
});
</script>
</body>
