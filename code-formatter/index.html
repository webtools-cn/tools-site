  css: 'body{margin:0;padding:0;font-family:Arial,sans-serif}.container{max-width:1200px;margin:0 auto;padding:20px}h1{font-size:2rem;color:#e2e8f0}p{line-height:1.6;margin-bottom:1rem}ul{list-style:none;padding:0}li{padding:8px 0;border-bottom:1px solid #334155}',
  js: 'function fibonacci(n){if(n<=1)return n;return fibonacci(n-1)+fibonacci(n-2)}class Person{constructor(name,age){this.name=name;this.age=age}greet(){return `Hello, I\'m ${this.name}`}}const arr=[1,2,3,4,5];const doubled=arr.map(x=>x*2);console.log(doubled)'
};

// Tab switching
document.querySelectorAll('.lang-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    currentLang = this.dataset.lang;
    codeInput.placeholder = currentLang === 'html' ? '在此粘贴HTML代码...' :
                           currentLang === 'css' ? '在此粘贴CSS代码...' :
                           '在此粘贴JavaScript代码...';
    // Auto-format if there's content
    if (codeInput.value.trim()) {
      clearTimeout(fmtDebounce);
      fmtDebounce = setTimeout(doFormat, 300);

  });
});

// HTML Formatter
function formatHTML(html, indentStr) {
  // Remove existing whitespace between tags
  html = html.replace(/>\s+</g, '><');
  html = html.replace(/^\s+|\s+$/gm, '');
  
  let result = '';
  let indent = 0;
  let i = 0;
  const len = html.length;
  
  // Self-closing and void elements
  const voidElements = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr','!doctype']);
  
  while (i < len) {
    if (html[i] === '<') {
      // Check for closing tag
      if (html[i+1] === '/') {
        indent = Math.max(0, indent - 1);
        if (result && result[result.length-1] !== '\n') result += '\n';
        result += indentStr.repeat(indent);
        let j = i;
        while (j < len && html[j] !== '>') j++;
        result += html.substring(i, j+1);
        i = j + 1;
        continue;
      }
      
      // Check for comment
      if (html.substring(i, i+4) === '<!--') {
        if (result && result[result.length-1] !== '\n') result += '\n';
        result += indentStr.repeat(indent);
        let j = html.indexOf('-->', i);
        if (j === -1) j = len;
        else j += 3;
        result += html.substring(i, j);
        i = j;
        continue;
      }
      
      // Opening tag
      if (result && result[result.length-1] !== '\n') result += '\n';
      result += indentStr.repeat(indent);
      
      // Extract tag name
      let j = i + 1;
      while (j < len && html[j] !== '>' && html[j] !== ' ' && html[j] !== '\t' && html[j] !== '\n') j++;
      let tagName = html.substring(i+1, j).toLowerCase();
      
      // Find end of tag
      let k = i;
      while (k < len && html[k] !== '>') k++;
      
      result += html.substring(i, k+1);
      i = k + 1;
      
      // Check if void element or self-closing
      const isSelfClosing = html[k-1] === '/' || voidElements.has(tagName);
      if (!isSelfClosing) {
        indent++;
      }
    } else if (html[i] === '\n' || html[i] === '\r') {
      i++;
    } else {
      // Text content
      if (result && result[result.length-1] !== '\n') result += '\n';
      result += indentStr.repeat(indent);
      let j = i;
      while (j < len && html[j] !== '<') j++;
      let text = html.substring(i, j).trim();
      if (text) {
        result += text;
      }
      i = j;
    }
  }
  
  return result.trim();
}

// CSS Formatter
function formatCSS(css, indentStr) {
  // Remove comments
  css = css.replace(/\/\*[\s\S]*?\*\//g, '');
  
  let result = '';
  let indent = 0;
  let i = 0;
  const len = css.length;
  let inString = false;
  let stringChar = '';
  
  while (i < len) {
    const ch = css[i];
    
    // Handle strings
    if ((ch === '"' || ch === "'") && (i === 0 || css[i-1] !== '\\')) {
      if (!inString) {
        inString = true;
        stringChar = ch;
        result += ch;
        i++;
        continue;
      } else if (ch === stringChar) {
        inString = false;
        result += ch;
        i++;
        continue;
      }
    }
    
    if (inString) {
      result += ch;
      i++;
      continue;
    }
    
    if (ch === '{') {
      result += ' {\n';
      indent++;
      result += indentStr.repeat(indent);
      i++;
      // Skip whitespace after {
      while (i < len && /\s/.test(css[i])) i++;
      continue;
    }
    
    if (ch === '}') {
      indent = Math.max(0, indent - 1);
      result = result.trimEnd();
      result += '\n' + indentStr.repeat(indent) + '}\n';
      i++;
      // Skip whitespace after }
      while (i < len && /\s/.test(css[i])) i++;
      if (i < len) result += indentStr.repeat(indent);
      continue;
    }
    
    if (ch === ';') {
      result += ';\n';
      result += indentStr.repeat(indent);
      i++;
      // Skip whitespace after ;
      while (i < len && /\s/.test(css[i])) i++;
      continue;
    }
    
    if (ch === ':') {
      result += ': ';
      i++;
      while (i < len && /\s/.test(css[i])) i++;
      continue;
    }
    
    if (ch === ',') {
      result += ', ';
      i++;
      continue;
    }
    
    if (/\s/.test(ch)) {
      // Collapse multiple whitespace to single space
      if (result[result.length-1] !== ' ' && result[result.length-1] !== '\n') {
        result += ' ';
      }
      i++;
      continue;
    }
    
    result += ch;
    i++;
  }
  
  return result.trim();
}

// JS Formatter
function formatJS(js, indentStr) {
  let result = '';
  let indent = 0;
  let i = 0;
  const len = js.length;
  let inString = false;
  let stringChar = '';
  let inTemplate = false;
  let inComment = false;
  
  while (i < len) {
    const ch = js[i];
    
    // Handle comments
    if (!inString && !inTemplate && ch === '/' && js[i+1] === '/') {
      // Single line comment
      let j = i;
      while (j < len && js[j] !== '\n') j++;
      result += js.substring(i, j);
      i = j;
      continue;
    }
    if (!inString && !inTemplate && ch === '/' && js[i+1] === '*') {
      // Block comment
      let j = js.indexOf('*/', i+2);
      if (j === -1) j = len;
      else j += 2;
      result += js.substring(i, j);
      i = j;
      continue;
    }
    
    // Handle template strings
    if (ch === '`' && (i === 0 || js[i-1] !== '\\')) {
      inTemplate = !inTemplate;
      result += ch;
      i++;
      continue;
    }
    
    // Handle regular strings
    if (!inTemplate && (ch === '"' || ch === "'") && (i === 0 || js[i-1] !== '\\')) {
      if (!inString) {
        inString = true;
        stringChar = ch;
        result += ch;
        i++;
        continue;
      } else if (ch === stringChar) {
        inString = false;
        result += ch;
        i++;
        continue;
      }
    }
    
    if (inString || inTemplate) {
      result += ch;
      i++;
      continue;
    }
    
    if (ch === '{') {
      result += ' {\n';
      indent++;
      result += indentStr.repeat(indent);
      i++;
      while (i < len && /\s/.test(js[i])) i++;
      continue;
    }
    
    if (ch === '}') {
      indent = Math.max(0, indent - 1);
      result = result.trimEnd();
      result += '\n' + indentStr.repeat(indent) + '}';
      i++;
      // Check if next char is not ; or )
      while (i < len && /\s/.test(js[i])) i++;
      if (i < len && js[i] !== ';' && js[i] !== ')' && js[i] !== ',') {
        result += '\n' + indentStr.repeat(indent);
      }
      continue;
    }
    
    if (ch === ';') {
      result += ';\n';
      result += indentStr.repeat(indent);
      i++;
      while (i < len && /\s/.test(js[i])) i++;
      continue;
    }
    
    if (ch === ',') {
      result += ', ';
      i++;
      continue;
    }
    
    if (/\s/.test(ch)) {
      if (result[result.length-1] !== ' ' && result[result.length-1] !== '\n') {
        result += ' ';
      }
      i++;
      continue;
    }
    
    result += ch;
    i++;
  }
  
  return result.trim();
}

// Minify
function minifyCode(code, lang) {
  if (lang === 'html') {
    return code
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/>\s+</g, '><')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }
  if (lang === 'css') {
    return code
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/\s+/g, ' ')
      .replace(/\s*{\s*/g, '{')
      .replace(/\s*}\s*/g, '}')
      .replace(/\s*;\s*/g, ';')
      .replace(/\s*:\s*/g, ':')
      .replace(/\s*,\s*/g, ',')
      .trim();
  }
  // JS
  return code
    .replace(/\/\/[^\n]*/g, '')
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/\s+/g, ' ')
    .replace(/\s*{\s*/g, '{')
    .replace(/\s*}\s*/g, '}')
    .replace(/\s*;\s*/g, ';')
    .replace(/\s*\(\s*/g, '(')
    .replace(/\s*\)\s*/g, ')')
    .replace(/\s*,\s*/g, ',')
    .replace(/\s*:\s*/g, ':')
    .trim();
}

function doFormat() {
  const code = codeInput.value.trim();
  if (!code) {
    codeOutput.innerHTML = '<span style="color:#64748b">请在上方输入代码</span>';
    statsBar.style.display = 'none';
    return;
  }
  
  const indentStr = indentSize.value === 'tab' ? '\t' : ' '.repeat(parseInt(indentSize.value));
  const mode = modeSelect.value;
  
  try {
    let result;
    if (mode === 'minify') {
      result = minifyCode(code, currentLang);
    } else {
      // Format
      if (currentLang === 'html') {
        result = formatHTML(code, indentStr);
      } else if (currentLang === 'css') {
        result = formatCSS(code, indentStr);
      } else {
        result = formatJS(code, indentStr);
      }
    }
    
    // Escape HTML for display
    codeOutput.innerHTML = escapeHTML(result);
    statsBar.style.display = 'flex';
    document.getElementById('origLen').textContent = code.length;
    document.getElementById('fmtLen').textContent = result.length;
    document.getElementById('lineCount').textContent = result.split('\n').length;
  } catch(e) {
    codeOutput.innerHTML = '<span style="color:#ef4444">格式化出错: ' + escapeHTML(e.message) + '</span>';
    statsBar.style.display = 'none';
  }
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function doMinify() {
  const code = codeInput.value.trim();
  if (!code) {
    codeOutput.innerHTML = '<span style="color:#64748b">请在上方输入代码</span>';
    statsBar.style.display = 'none';
    return;
  }
  
  try {
    const result = minifyCode(code, currentLang);
    codeOutput.textContent = result;
    statsBar.style.display = 'flex';
    document.getElementById('origLen').textContent = code.length;
    document.getElementById('fmtLen').textContent = result.length;
    document.getElementById('lineCount').textContent = '1';
  } catch(e) {
    codeOutput.innerHTML = '<span style="color:#ef4444">压缩出错: ' + escapeHTML(e.message) + '</span>';
    statsBar.style.display = 'none';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function copyResult() {
  const text = codeOutput.textContent;
  if (!text || text.includes('等待输入') || text.includes('请在上方')) {
    showToast('⚠️ 没有可复制的内容');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('✅ 已复制到剪贴板');
  } catch(e) {
    showToast('⚠️ 复制失败，请手动选择');
  }
}

function downloadResult() {
  const text = codeOutput.textContent;
  if (!text || text.includes('等待输入') || text.includes('请在上方')) {
    showToast('⚠️ 没有可下载的内容');
    return;
  }
  const ext = currentLang === 'html' ? '.html' : currentLang === 'css' ? '.css' : '.js';
  const blob = new Blob([text], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'formatted' + ext;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✅ 已下载 formatted' + ext);
}

// Event bindings
document.getElementById('formatBtn').addEventListener('click', doFormat);
document.getElementById('minifyBtn').addEventListener('click', doMinify);
document.getElementById('copyBtn').addEventListener('click', copyResult);
document.getElementById('downloadBtn').addEventListener('click', downloadResult);
document.getElementById('clearBtn').addEventListener('click', () => {
  codeInput.value = '';
  codeOutput.innerHTML = '<span style="color:#64748b">等待输入代码...</span>';
  statsBar.style.display = 'none';
  codeInput.focus();
});
document.getElementById('sampleBtn').addEventListener('click', () => {
  codeInput.value = samples[currentLang];
  doFormat();
});

// Real-time format on input (debounced)
codeInput.addEventListener('input', () => {
  clearTimeout(fmtDebounce);
  fmtDebounce = setTimeout(doFormat, 500);
});

// Option changes trigger re-format
[indentSize, modeSelect].forEach(el => {
  el.addEventListener('change', doFormat);
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    doFormat();
  }
});
})();
</script>
