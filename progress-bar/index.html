<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进度条生成器 - Free ToolBase</title>
  <meta name="description" content="在线进度条CSS生成器，可视化设计进度条样式，实时预览并生成HTML+CSS代码。">
  <meta property="og:title" content="进度条生成器 - Free ToolBase">
  <meta property="og:description" content="在线进度条CSS生成器，可视化设计进度条样式，实时预览并生成HTML+CSS代码。">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"进度条生成器","applicationCategory":"DeveloperApplication","operatingSystem":"Web","description":"在线进度条CSS生成器"}</script>
  <style>
    :root{--primary:#4F46E5;--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}
    .lang-switch a{color:var(--sub);font-size:14px;text-decoration:none;padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
    .lang-switch a:hover{color:var(--primary);border-color:var(--primary)}
    main{flex:1;max-width:800px;margin:0 auto;padding:40px 20px;width:100%}
    h1{font-size:28px;margin-bottom:8px;text-align:center}
    .subtitle{text-align:center;color:var(--sub);margin-bottom:32px}
    .card{background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--border);margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
    .form-group input[type=range]{width:100%}
    .form-group input[type=color]{width:60px;height:36px;border:2px solid var(--border);border-radius:6px;cursor:pointer}
    .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    .preview-box{background:#f1f5f9;border-radius:8px;padding:30px;margin:20px 0}
    .preview-bar-bg{background:#e2e8f0;border-radius:10px;height:24px;overflow:hidden}
    .preview-bar-fill{height:100%;border-radius:10px;transition:all .3s}
    .preview-label{text-align:center;margin-top:10px;font-size:14px;font-weight:600}
    .code-block{background:#1e293b;color:#e2e8f0;border-radius:8px;padding:16px;font-family:monospace;font-size:13px;overflow-x:auto;position:relative}
    .btn{margin-top:8px;padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:var(--primary);color:#fff}
    .btn:hover{opacity:.9}
    footer{text-align:center;padding:24px;color:var(--sub);font-size:13px;border-top:1px solid var(--border);margin-top:auto}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:22px}}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>
</head>
<body>
<header><a href="/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/en/progress-bar/">English</a></div></header>
<main>
  <h1>📊 进度条生成器</h1>
  <p class="subtitle">可视化设计进度条，实时生成HTML+CSS代码</p>
  <div class="card">
    <div class="row">
      <div class="form-group" style="flex:1"><label>📊 进度 (%)</label><input type="range" id="percent" min="0" max="100" value="65" oninput="update()"></div>
      <div class="form-group"><label>进度值</label><span style="font-size:24px;font-weight:700;color:var(--primary)" id="percentVal">65%</span></div>
    </div>
    <div class="row">
      <div class="form-group"><label>🎨 进度条颜色</label><input type="color" id="barColor" value="#4F46E5" onchange="update()"></div>
      <div class="form-group"><label>⬜ 背景颜色</label><input type="color" id="bgColor" value="#e2e8f0" onchange="update()"></div>
    </div>
    <div class="row">
      <div class="form-group" style="flex:1"><label>📏 高度 (px)</label><input type="range" id="height" min="8" max="60" value="24" oninput="update()"></div>
      <div class="form-group" style="flex:1"><label>🔄 圆角 (px)</label><input type="range" id="radius" min="0" max="30" value="10" oninput="update()"></div>
    </div>
    <div class="form-group"><label>🏷️ 进度条标签</label>
      <div class="row"><label class="checkbox" style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" id="showPercent" checked onchange="update()"> 显示百分比</label>
      <label class="checkbox" style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" id="striped" onchange="update()"> 条纹动画</label></div>
    </div>
    <div class="preview-box" id="previewBox">
      <div class="preview-bar-bg" id="previewBg"><div class="preview-bar-fill" id="previewFill"></div></div>
      <div class="preview-label" id="previewLabel">65%</div>
    </div>
    <div class="code-block" id="codeBlock"></div>
    <button class="btn" id="btnCopy">📋 复制代码</button>
  </div>
</main>
<footer>© 2024 Free ToolBase · 纯前端工具</footer>
<script>
function update(){
  const p=parseInt(document.getElementById('percent').value);
  const barColor=document.getElementById('barColor').value;
  const bgColor=document.getElementById('bgColor').value;
  const h=parseInt(document.getElementById('height').value);
  const r=parseInt(document.getElementById('radius').value);
  const showP=document.getElementById('showPercent').checked;
  const striped=document.getElementById('striped').checked;
  document.getElementById('percentVal').textContent=p+'%';
  const bg=document.getElementById('previewBg');
  bg.style.height=h+'px';bg.style.borderRadius=r+'px';bg.style.background=bgColor;
  const fill=document.getElementById('previewFill');
  fill.style.width=p+'%';fill.style.background=barColor;fill.style.borderRadius=r+'px';
  if(striped){
    fill.style.backgroundImage='linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent)';
    fill.style.backgroundSize='20px 20px';
    fill.style.animation='stripes 1s linear infinite';
  }else{
    fill.style.backgroundImage='';fill.style.animation='';fill.style.background=barColor;
  }
  document.getElementById('previewLabel').textContent=showP?p+'%':'';
  const css=`.progress-bar{background:${bgColor};border-radius:${r}px;height:${h}px;overflow:hidden}\n.progress-fill{background:${barColor};width:${p}%;height:100%;border-radius:${r}px;transition:width .3s}${striped?'\n.progress-fill{background-image:linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);background-size:20px 20px;animation:stripes 1s linear infinite}':''}`;
  document.getElementById('codeBlock').textContent=css;
  if(striped){
    if(!document.getElementById('animStyle')){
      const s=document.createElement('style');s.id='animStyle';
      s.textContent='@keyframes stripes{0%{background-position:0 0}100%{background-position:20px 0}}';
      document.head.appendChild(s);
    }
  }
}
document.getElementById('btnCopy').addEventListener('click',()=>{
  navigator.clipboard.writeText(document.getElementById('codeBlock').textContent).then(()=>{
    const btn=document.getElementById('btnCopy');btn.textContent='✅ 已复制';setTimeout(()=>btn.textContent='📋 复制代码',1500);
  });
});
update();
</script>
</body>
</html>
