    <h1>🔊 白噪音发生器</h1>
    <p class="subtitle">帮助专注工作、放松睡眠、屏蔽环境噪音</p>

    <div class="visualizer"><canvas id="visCanvas"></canvas></div>

    <div class="control-card">
      <div class="vol-display" id="volDisplay">50%</div>
      <div class="control-row">
        <div class="control-group" style="flex:2">
          <label>音量</label>
          <input type="range" id="volSlider" min="0" max="100" value="50">
        </div>
      </div>
      <button class="btn-play" id="playBtn">▶</button>
    </div>

    <div class="info-card">
      <h2>什么是白噪音？</h2>
      <p>白噪音是包含所有频率（20Hz-20kHz）且各频率能量均匀分布的随机信号。听起来像收音机没调台时的"嘶嘶"声，能有效掩盖背景噪声，帮助提高注意力和改善睡眠质量。</p>
    </div>

  <script>
    let audioCtx = null, noiseNode = null, gainNode = null, isPlaying = false, animId = null;
    const playBtn = document.getElementById('playBtn');
    const volSlider = document.getElementById('volSlider');
    const volDisplay = document.getElementById('volDisplay');
    const visCanvas = document.getElementById('visCanvas');

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function createWhiteNoise() {
      const bufferSize = 2 * audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = volSlider.value / 100;
      noiseNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      noiseNode.start();
    }

    function startNoise() {
      initAudio();
      if (noiseNode) stopNoise();
      createWhiteNoise();
      isPlaying = true;
      playBtn.textContent = '⏸';
      playBtn.classList.add('playing');
      drawVisualizer();
    }

    function stopNoise() {
      if (noiseNode) { try { noiseNode.stop(); } catch(e){} noiseNode.disconnect(); noiseNode = null; }
      if (gainNode) { gainNode.disconnect(); gainNode = null; }
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      isPlaying = false;
      playBtn.textContent = '▶';
      playBtn.classList.remove('playing');
    }

    function drawVisualizer() {
      if (!isPlaying || !audioCtx) { animId = null; return; }
      const canvas = visCanvas, ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth * 2; canvas.height = canvas.offsetHeight * 2;
      ctx.scale(2,2);
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);
      const bars = 64;
      const barW = w / bars;
      for (let i = 0; i < bars; i++) {
        const val = Math.random();
        const barH = val * (h * 0.9);
        const gradient = ctx.createLinearGradient(0, h - barH, 0, h);
        gradient.addColorStop(0, '#818cf8'); gradient.addColorStop(1, '#4F46E5');
        ctx.fillStyle = gradient;
        ctx.fillRect(i * barW + 1, h - barH, barW - 2, barH);
      }
      animId = requestAnimationFrame(drawVisualizer);
    }

    playBtn.addEventListener('click', () => isPlaying ? stopNoise() : startNoise());
    volSlider.addEventListener('input', () => {
      volDisplay.textContent = volSlider.value + '%';
      if (gainNode) gainNode.gain.value = volSlider.value / 100;
    });
    window.addEventListener('beforeunload', stopNoise);
  </script>
