<body>
  <header><a href="/">← Free ToolBase</a></header>
  <main>
    <h1>⏱️ 倒计时器</h1>
    <p class="subtitle">设置目标日期和时间，实时追踪剩余的天、时、分、秒。</p>
    <div class="card">
      <div class="form-group">
        <label>倒计时标题（可选）</label>
        <input type="text" id="titleInput" placeholder="例如：新年倒计时">
      </div>
      <div class="form-group">
        <label>目标日期</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>目标时间</label>
        <input type="time" id="timeInput" value="00:00">
      </div>
      <button class="btn btn-primary btn-block" id="startBtn">开始倒计时</button>
    </div>
    <div class="preset-buttons">
      <span style="font-size:13px;color:var(--text2);margin-right:4px">快捷：</span>
      <button class="preset-btn" data-days="1">明天</button>
      <button class="preset-btn" data-days="7">一周后</button>
      <button class="preset-btn" data-days="30">30天后</button>
      <button class="preset-btn" data-days="100">100天后</button>
      <button class="preset-btn" data-days="365">一年后</button>
    </div>
    <div id="resultArea" style="display:none">
      <div class="card">
        <div class="countdown-title" id="displayTitle"></div>
        <div class="countdown-display">
          <div class="countdown-box"><div class="countdown-value" id="days">0</div><div class="countdown-label">天</div></div>
          <div class="countdown-box"><div class="countdown-value" id="hours">0</div><div class="countdown-label">时</div></div>
          <div class="countdown-box"><div class="countdown-value" id="minutes">0</div><div class="countdown-label">分</div></div>
          <div class="countdown-box"><div class="countdown-value" id="seconds">0</div><div class="countdown-label">秒</div></div>
        </div>
        <div class="expired" id="expiredMsg" style="display:none">⏰ 时间到！</div>
        <button class="btn btn-danger btn-block" id="stopBtn" style="margin-top:16px">停止倒计时</button>
      </div>
    </div>
  </main>
  <footer>© 2025 <a href="/">Free ToolBase</a> · 所有工具免费使用</footer>
  <div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>
  <script>
    let countdownInterval = null;
    let targetDate = null;

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function updateCountdown() {
      if (!targetDate) return;
      var now = new Date().getTime();
      var dist = targetDate.getTime() - now;
      if (dist <= 0) {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '0';
        document.getElementById('minutes').textContent = '0';
        document.getElementById('seconds').textContent = '0';
        document.getElementById('expiredMsg').style.display = 'block';
        clearInterval(countdownInterval);
        countdownInterval = null;
        return;
      }
      document.getElementById('expiredMsg').style.display = 'none';
      var d = Math.floor(dist / (1000 * 60 * 60 * 24));
      var h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
      var s = Math.floor((dist % (1000 * 60)) / 1000);
      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = h;
      document.getElementById('minutes').textContent = m;
      document.getElementById('seconds').textContent = s;
    }

    function startCountdown(dateObj, title) {
      if (countdownInterval) clearInterval(countdownInterval);
      targetDate = dateObj;
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('displayTitle').textContent = title || '倒计时';
    }

    document.getElementById('startBtn').addEventListener('click', function() {
      var dateVal = document.getElementById('dateInput').value;
      var timeVal = document.getElementById('timeInput').value || '00:00';
      if (!dateVal) {
        showToast('请选择目标日期');
        return;
      }
      var target = new Date(dateVal + 'T' + timeVal);
      if (target.getTime() <= Date.now()) {
        showToast('目标时间已过，请选择未来的时间');
        return;
      }
      var title = document.getElementById('titleInput').value.trim();
      startCountdown(target, title);
      showToast('倒计时已启动');
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = null;
      document.getElementById('resultArea').style.display = 'none';
      targetDate = null;
      showToast('倒计时已停止');
    });

    document.querySelectorAll('.preset-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var days = parseInt(this.dataset.days);
        var d = new Date();
        d.setDate(d.getDate() + days);
        d.setHours(0, 0, 0, 0);
        var dateStr = d.toISOString().split('T')[0];
        document.getElementById('dateInput').value = dateStr;
        document.getElementById('timeInput').value = '00:00';
      });
    });

    // 默认设为明天
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('dateInput').value = tomorrow.toISOString().split('T')[0];
  </script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
