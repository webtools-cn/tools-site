<script>
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000);}
function fmt(n){if(n===undefined||n===null||isNaN(n))return'-';if(Math.abs(n)>=1e8)return (n/1e8).toFixed(2)+'亿';if(Math.abs(n)>=1e4)return (n/1e4).toFixed(1)+'万';return n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

function calculate(){
var age=parseInt(document.getElementById('currentAge').value)||30;
var savings=parseFloat(document.getElementById('currentSavings').value)||0;
var monthly=parseFloat(document.getElementById('monthlySavings').value)||0;
var rate=parseFloat(document.getElementById('returnRate').value)/100||0.07;
var target=parseFloat(document.getElementById('targetAmount').value)||0;
var inflation=parseFloat(document.getElementById('inflationRate').value)/100||0;

if(target<=0){showToast('请输入目标退休资产');return;}
if(savings>=target){showToast('当前资产已超过目标！');return;}

var monthRate=rate/12;
var balance=savings;
var yearCount=0;
var yearData=[];
var realTarget=target;

while(balance<target&&yearCount<80){
var startBalance=balance;
var annualDeposit=monthly*12;
for(var m=0;m<12;m++){
balance+=monthly;
balance*=(1+monthRate);
}
var investmentReturn=balance-startBalance-annualDeposit;
yearData.push({
year:yearCount+1,
age:age+yearCount+1,
start:startBalance,
deposit:annualDeposit,
return:Math.max(0,investmentReturn),
end:balance
});
yearCount++;
// Adjust target for inflation
if(inflation>0)target=target*(1+inflation);
}

var retireAge=age+yearCount;
var today=new Date();
var retireDate=new Date(today.getFullYear()+yearCount,today.getMonth(),today.getDate());
var dateStr=retireDate.getFullYear()+'年'+(retireDate.getMonth()+1)+'月'+retireDate.getDate()+'日';

var progressPct=savings>=realTarget?100:Math.min(99,Math.round(savings/realTarget*100));

document.getElementById('retireAge').textContent=retireAge+'岁';
document.getElementById('retireDate').textContent='预计退休日期：'+dateStr+'（约'+yearCount+'年后）';
document.getElementById('progressBar').style.width=progressPct+'%';
document.getElementById('progressText').textContent=progressPct+'%';
document.getElementById('resultCard').style.display='block';
document.getElementById('yearsCard').style.display='block';

// Build summary
var summary='<table><tr><td>当前资产</td><td style="text-align:right">¥'+fmt(savings)+'</td></tr>'+
'<tr><td>目标资产</td><td style="text-align:right">¥'+fmt(realTarget)+'</td></tr>'+
'<tr><td>年储蓄额</td><td style="text-align:right">¥'+fmt(monthly*12)+'</td></tr>'+
'<tr><td>还需年数</td><td style="text-align:right">'+yearCount+'年</td></tr>'+
'<tr><td>65岁可达资产</td><td style="text-align:right">¥'+fmt(projectToAge(savings,monthly,rate,65-age))+'</td></tr>'+
'</table>';
document.getElementById('summaryTable').innerHTML=summary;

// Build year table (show first 10 and last 5)
var tbody='';
var showYears=yearData.length<=20?yearData:yearData.slice(0,12).concat([{year:'...',age:'...',start:'...',deposit:'...',return:'...',end:'...'}]).concat(yearData.slice(-5));
for(var i=0;i<showYears.length;i++){
var d=showYears[i];
tbody+='<tr><td>'+d.year+'</td><td>'+d.age+'</td><td>¥'+fmt(d.start)+'</td><td>¥'+fmt(d.deposit)+'</td><td>¥'+fmt(d.return)+'</td><td>¥'+fmt(d.end)+'</td></tr>';
}
document.querySelector('#yearTable tbody').innerHTML=tbody;
}

function projectToAge(savings,monthly,rate,years){
if(years<=0)return savings;
var monthRate=rate/12;
var balance=savings;
for(var m=0;m<years*12;m++){
balance+=monthly;
balance*=(1+monthRate);
}
return balance;
}

function clearAll(){
document.getElementById('currentAge').value=30;
document.getElementById('currentSavings').value=100000;
document.getElementById('monthlySavings').value=5000;
document.getElementById('returnRate').value=7;
document.getElementById('targetAmount').value=5000000;
document.getElementById('inflationRate').value=3;
document.getElementById('resultCard').style.display='none';
document.getElementById('yearsCard').style.display='none';
showToast('已重置为默认值');
}
</script>
