{flex:1;min-width:160px}.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-primary{background:var(--primary);color:#fff;width:100%}.btn-primary:hover{background:#6366f1}.btn-outline{background:transparent;border:1px solid rgba(148,163,184,.3);color:var(--muted)}.btn-outline:hover{background:rgba(148,163,184,.1);color:var(--text)}.btn-sm{padding:6px 14px;font-size:.8rem}.result-card{background:var(--bg);border-radius:10px;padding:20px;margin-top:14px;text-align:center}.result-value{font-size:2.5rem;font-weight:700;color:var(--accent)}.result-unit{font-size:.85rem;color:var(--muted);margin-top:4px}.result-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}.result-tag{padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}.tag-low{background:rgba(16,185,129,.15);color:var(--green)}.tag-mid{background:rgba(245,158,11,.15);color:var(--yellow)}.tag-high{background:rgba(239,68,68,.15);color:var(--red)}.info-section{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid rgba(148,163,184,.1)}.info-section h2{font-size:1.05rem;color:var(--gold);margin-bottom:10px}.info-section p{color:var(--muted);font-size:.9rem;margin-bottom:8px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:10px 24px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:999;border:1px solid rgba(148,163,184,.2);pointer-events:none}.gauge{margin:16px auto;width:200px;height:100px;position:relative;overflow:hidden}.gauge-bg{width:200px;height:100px;border-radius:100px 100px 0 0;background:linear-gradient(90deg,#ef4444,#f59e0b 33%,#10b981 66%)}.gauge-mask{position:absolute;bottom:0;left:10px;width:180px;height:90px;border-radius:90px 90px 0 0;background:var(--bg)}.gauge-needle{position:absolute;bottom:0;left:50%;width:3px;height:45p <body>
<div class="container">
<div class="header"><h1>📈 ROIC计算器</h1><div class="lang-switch"><a href="index.html" class="active">中文</a><a href="../en/roic-calculator/">EN</a></div></div>
<p class="nav-back"><a href="../index.html">首页</a> &rsaquo; <a href="../index.html#tools">工具</a> &rsaquo; ROIC计算器</p>
<div class="hero"><p>免费在线ROIC（投入资本回报率）计算器，输入NOPAT和投入资本，快速评估企业资本使用效率。纯前端本地计算。</p><span class="badge">零依赖 · 可离线使用</span></div>

<div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="1234567890" data-ad-format="auto"></ins></div>

<div class="section">
  <h2>📋 输入参数</h2>
  <div class="form-row">
    <div class="form-group">
      <label>税后净营业利润 NOPAT ($)</label>
      <input type="number" id="nopat" placeholder="例如：15000000" min="1" step="0.01" value="15000000">
    </div>
    <div class="form-group">
      <label>投入资本 ($)</label>
      <input type="number" id="investedCapital" placeholder="例如：100000000" min="1" step="0.01" value="100000000">
    </div>
  </div>
  <div class="form-group">
    <label>WACC (%) - 可选对比参考</label>
    <input type="number" id="wacc" placeholder="例如：8" min="0" step="0.1" value="8">
  </div>
  <button class="btn btn-primary" onclick="calculate()">📊 计算ROIC</button>

  <div id="results" style="display:none;">
    <div class="result-card">
      <div class="result-value" id="roicValue">-</div>
      <div class="result-unit">ROIC (投入资本回报率)</div>
      <div class="gauge">
        <div class="gauge-bg"></div>
        <div class="gauge-mask"></div>
        <div class="gauge-needle" id="needle" style="transform:rotate(-90deg)"></div>
      </div>
      <div class="result-meta" id="roicTags"></div>
      <div style="font-size:.85rem;color:var(--muted);margin-top:8px" id="roicDetail"></div>
    </div>
  </div>

  <div style="margin-top:16px;display:flex;gap:8px;">
    <button class="btn btn-outline btn-sm" onclick="copyResult()">📋 复制结果</button>
    <button class="btn btn-outline btn-sm" onclick="resetForm()">🔄 清空重算</button>
  </div>
</div>

<div class="info-section">
  <h2>📖 关于ROIC</h2>
  <p>ROIC = NOPAT ÷ 投入资本。衡量企业使用所有资本（股权+债务）创造利润的效率，是评估企业护城河的核心指标。</p>
  <p><strong>标准参考：</strong> &gt;15% 优秀 | 10-15% 良好 | &lt;10% 关注。ROIC > WACC 表示创造价值。</p>
</div>

<div id="toast" class="toast"></div>
</div>

<script>
function calculate() {
  var nopat = parseFloat(document.getElementById('nopat').value) || 0;
  var ic = parseFloat(document.getElementById('investedCapital').value) || 0;
  if (ic <= 0) { showToast('投入资本必须大于0'); return; return; }

  var roic = Math.round(nopat / ic * 10000) / 100;

  document.getElementById('roicValue').textContent = roic + '%';

  var needleAngle = -90 + Math.min(Math.max(roic / 30, 0), 1) * 180;
  document.getElementById('needle').style.transform = 'rotate(' + needleAngle + 'deg)';

  var tags = document.getElementById('roicTags');
  var detail = document.getElementById('roicDetail');
  var vr = document.getElementById('roicValue');

  var wacc = parseFloat(document.getElementById('wacc').value) || 0;
  var waccNote = wacc > 0 ? ' (WACC: ' + wacc + '%)' : '';

  if (roic >= 15) {
    tags.innerHTML = '<span class="result-tag tag-low">🟢 优秀</span>';
    vr.style.color = 'var(--green)';
    detail.textContent = 'ROIC≥15%，企业资本运用效率优秀' + waccNote + '。';
  } else if (roic >= 10) {
    tags.innerHTML = '<span class="result-tag tag-mid">🟡 良好</span>';
    vr.style.color = 'var(--yellow)';
    detail.textContent = 'ROIC在10-15%之间，资本运用效率良好' + waccNote + '。';
  } else {
    tags.innerHTML = '<span class="result-tag tag-high">🔴 需关注</span>';
    vr.style.color = 'var(--red)';
    detail.textContent = 'ROIC<10%，资本运用效率偏低' + waccNote + '。需分析是否足以覆盖资本成本。';
  }

  if (wacc > 0) {
    if (roic > wacc) {
      detail.textContent += ' ROIC>WACC，企业正在创造价值。';
    } else {
      detail.textContent += ' ROIC<WACC，企业可能正在摧毁价值。';
    }
  }

  document.getElementById('results').style.display = 'block';
}

function copyResult() {
  var r = document.getElementById('roicValue').textContent;
  navigator.clipboard.writeText('ROIC: ' + r).then(function(){showToast('已复制');}).catch(function(){});
}

function resetForm() {
  document.getElementById('nopat').value='15000000';document.getElementById('investedCapital').value='100000000';
  document.getElementById('wacc').value='8';document.getElementById('results').style.display='none';
}

function showToast(msg) {
  var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';},2000);
}
</script>

</body>
