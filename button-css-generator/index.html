<script>
const state = {
  text: '点击我预览效果',
  bgColor: '#4F46E5',
  textColor: '#ffffff',
  borderColor: '#4F46E5',
  hoverBg: '#3730a3',
  fontSize: 16,
  borderRadius: 8,
  borderWidth: 2,
  paddingX: 24,
  paddingY: 12,
  shadow: 0,
  fontWeight: 600
};

const ids = ['btnText','bgColor','textColor','borderColor','hoverBg','fontSize','borderRadius','borderWidth','paddingX','paddingY','shadow','fontWeight'];
const valIds = {fontSize:'fsVal',borderRadius:'brVal',borderWidth:'bwVal',paddingX:'pxVal',paddingY:'pyVal',shadow:'shVal',fontWeight:'fwVal',bgColor:'bgVal',textColor:'textVal',borderColor:'borderVal',hoverBg:'hoverBgVal'};

function updatePreview() {
  const btn = document.getElementById('previewBtn');
  const s = state;
  btn.textContent = s.text;
  btn.style.cssText = `
    background: ${s.bgColor};
    color: ${s.textColor};
    border: ${s.borderWidth}px solid ${s.borderColor};
    border-radius: ${s.borderRadius}px;
    font-size: ${s.fontSize}px;
    font-weight: ${s.fontWeight};
    padding: ${s.paddingY}px ${s.paddingX}px;
    box-shadow: 0 ${s.shadow}px ${s.shadow*2}px rgba(0,0,0,.15);
    cursor: pointer;
    transition: all .2s;
    display: inline-block;
    line-height: 1.4;
  `;
  updateCode();
}

function updateCode() {
  const s = state;
  const css = `.btn {
  background: ${s.bgColor};
  color: ${s.textColor};
  border: ${s.borderWidth}px solid ${s.borderColor};
  border-radius: ${s.borderRadius}px;
  font-size: ${s.fontSize}px;
  font-weight: ${s.fontWeight};
  padding: ${s.paddingY}px ${s.paddingX}px;
  box-shadow: 0 ${s.shadow}px ${s.shadow*2}px rgba(0,0,0,.15);
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover {
  background: ${s.hoverBg};
  transform: translateY(-1px);
}`;
  document.getElementById('cssOutput').textContent = css;
  document.getElementById('htmlOutput').textContent = `<button class="btn">${s.text}</button>`;
}

// 绑定所有控件
ids.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', function() {
    if (this.type === 'range' || this.type === 'color') {
      state[id] = this.type === 'range' ? parseInt(this.value) : this.value;
      if (valIds[id]) document.getElementById(valIds[id]).textContent = this.value + (id.includes('font')||id.includes('Size')?'':id.includes('Color')||id.includes('Bg')?'':id==='fontWeight'?'':'px');
      if (id.endsWith('Color') || id.endsWith('Bg')) document.getElementById(valIds[id]).textContent = this.value;
    } else {
      state.text = this.value;
    }
    updatePreview();
  });
});

document.getElementById('copyCSS').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('cssOutput').textContent).then(() => {
    document.getElementById('copyCSS').textContent = '✅';
    setTimeout(() => document.getElementById('copyCSS').textContent = '📋 复制', 2000);
  });
});
document.getElementById('copyHTML').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('htmlOutput').textContent).then(() => {
    document.getElementById('copyHTML').textContent = '✅';
    setTimeout(() => document.getElementById('copyHTML').textContent = '📋 复制', 2000);
  });
});

updatePreview();
</script>
