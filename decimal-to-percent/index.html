<script>
(function(){
  const decInput = document.getElementById('decimal');
  const pctInput = document.getElementById('percent');

  function showToast(msg){alert(msg)}

  decInput.addEventListener('input', function(){
    const v = parseFloat(decInput.value);
    if(!isNaN(v)){
      pctInput.value = (v*100).toFixed(4).replace(/\.?0+$/,'') + '%';
    }else if(decInput.value===''){
      pctInput.value = '';
    }
  });

  pctInput.addEventListener('input', function(){
    const raw = pctInput.value.replace(/%/g,'').trim();
    const v = parseFloat(raw);
    if(!isNaN(v)){
      decInput.value = (v/100).toFixed(8).replace(/\.?0+$/,'');
    }else if(raw===''){
      decInput.value = '';
    }
  });

  document.querySelector('.examples').addEventListener('click', function(e){
    if(e.target.dataset.dec){
      decInput.value = e.target.dataset.dec;
      decInput.dispatchEvent(new Event('input'));
    }
  });
})();
</script>
