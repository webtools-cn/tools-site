<body>
<div class="container">
<div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="9876543210" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <header class="header">
    <h1>📈 同比增长率计算器</h1>
    <div class="lang-switch"><a href="/en/year-over-year-calculator/">English</a></div>
  </header>

  <div class="card">
    <h2>数据输入</h2>
    <div class="input-row">
      <div class="form-group">
        <label>今年本期值</label>
        <input type="number" id="current" placeholder="例如 1200000" min="0" step="1">
      </div>
      <div class="form-group">
        <label>去年同期值</label>
        <input type="number" id="lastYear" placeholder="例如 1000000" min="0" step="1">
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="calculate()">📊 计算</button>
      <button class="btn btn-secondary" onclick="clearAll()">🔄 清空</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>同比增长分析</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="label">同比增长率</div>
        <div class="value" id="yoyRate">0%</div>
      </div>
      <div class="result-item">
        <div class="label">增长绝对值</div>
        <div class="value" id="absoluteChange">0</div>
      </div>
      <div class="result-item">
        <div class="label">增长趋势</div>
        <div class="value" id="trend">-</div>
      </div>
    </div>
    <div class="visual-bar" id="visualBar" style="display:none">
      <div class="bar-last" id="barLast" style="width:50%"></div>
      <div class="bar-current" id="barCurrent" style="width:50%"></div>
    </div>
    <div class="legend" id="legend" style="display:none">
      <span><span class="dot" style="background:var(--text-secondary);opacity:0.6"></span> 去年同期</span>
      <span><span class="dot" style="background:var(--primary)"></span> 今年本期</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary btn-sm" onclick="copyResult()">📋 复制结果</button>
    </div>
  </div>

  <footer class="footer">
    &copy; 2024 Free ToolBase - 所有工具免费使用
  </footer>
</div>
<div class="toast" id="toast"></div>
<script>
function calculate(){
  const current = parseFloat(document.getElementById('current').value) || 0;
  const lastYear = parseFloat(document.getElementById('lastYear').value) || 0;
  if(lastYear === 0 && current === 0){showToast('⚠️ 请输入有效数值');return;}

  const absChange = current - lastYear;
  let yoyRate;
  if(lastYear === 0){
    yoyRate = current > 0 ? Infinity : 0;
  } else {
    yoyRate = (absChange / lastYear) * 100;
  }

  const rateEl = document.getElementById('yoyRate');
  const absEl = document.getElementById('absoluteChange');
  const trendEl = document.getElementById('trend');

  if(yoyRate === Infinity){
    rateEl.textContent = '∞ (从0增长)';
    rateEl.className = 'value positive';
    trendEl.textContent = '📈 从无到有';
    trendEl.className = 'value positive';
  } else {
    const sign = yoyRate >= 0 ? '+' : '';
    rateEl.textContent = sign + yoyRate.toFixed(2) + '%';
    if(yoyRate > 0){
      rateEl.className = 'value positive';
      trendEl.textContent = '📈 同比增长';
      trendEl.className = 'value positive';
    } else if(yoyRate < 0){
      rateEl.className = 'value negative';
      trendEl.textContent = '📉 同比下降';
      trendEl.className = 'value negative';
    } else {
      rateEl.className = 'value neutral';
      trendEl.textContent = '➡️ 持平';
      trendEl.className = 'value neutral';
    }
  }

  absEl.textContent = (absChange >= 0 ? '+' : '') + absChange.toLocaleString();

  // Visual bar
  const maxVal = Math.max(current, lastYear, 1);
  const lastPct = (lastYear / maxVal) * 100;
  const currPct = (current / maxVal) * 100;
  document.getElementById('barLast').style.width = lastPct + '%';
  document.getElementById('barCurrent').style.width = currPct + '%';
  document.getElementById('barCurrent').className = 'bar-current ' + (yoyRate > 0 ? 'positive' : yoyRate < 0 ? 'negative' : '');
  document.getElementById('visualBar').style.display = 'flex';
  document.getElementById('legend').style.display = 'flex';
  document.getElementById('resultCard').style.display = 'block';
}

function clearAll(){
  document.getElementById('current').value = '';
  document.getElementById('lastYear').value = '';
  document.getElementById('resultCard').style.display = 'none';
}

function copyResult(){
  const rate = document.getElementById('yoyRate').textContent;
  const abs = document.getElementById('absoluteChange').textContent;
  const trend = document.getElementById('trend').textContent;
  const text = '同比增长分析\n同比增长率: '+rate+'\n增长绝对值: '+abs+'\n趋势: '+trend;
  navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板'));
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
</script>
</body>
