<header><h1>🏆 域名权重检测器</h1>
<p style="color:#f59e0b;font-size:.85rem;margin:8px 0;padding:8px 12px;background:rgba(245,158,11,.1);border-radius:6px;border:1px solid rgba(245,158,11,.2)">⚠️ 纯前端限制：此功能需要服务端支持，浏览器无法直接实现。本页面仅作展示用途。</p><p>综合评估网站权威度 · 1-100分制</p><div class="nav-back"><a href="/">← 返回首页</a></div></header>
<div class="container">
  <div class="section">
    <h2>🔍 输入域名</h2>
    <div class="input-row">
      <div class="form-group"><label>网站域名</label><input type="text" id="domainInput" placeholder="example.com" value="free-toolbase.com"></div>
      <div class="btn-wrap"><button class="btn" id="checkBtn">检测</button></div>
    </div>
  </div>
  <div class="section" id="resultsCard" style="display:none">
    <h2>📊 权重评估</h2>

<!-- AdSense -->

<footer>Free ToolBase © 2025 · 免费在线SEO工具<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a>
</footer>
<script>
(function() {
  const domainEl = document.getElementById('domainInput');
  const checkBtn = document.getElementById('checkBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');

  function hashScore(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
    return Math.abs(hash);
  }

  function check() {
    let domain = domainEl.value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '').toLowerCase();
    if (!domain) return;

    const h = hashScore(domain);
    const scores = {
      domainAge: Math.min(h % 40 + 20, 40),        // 20-40
      backlinks: Math.min(h % 30 + 10, 30),         // 10-30
      traffic: Math.min(h % 25 + 5, 25),             // 5-25
      content: Math.min(h % 20 + 10, 20),            // 10-20
      social: Math.min(h % 15 + 5, 15),              // 5-15
      technical: Math.min(h % 20 + 10, 20),          // 10-20
    };

    const total = Object.values(scores).reduce((a, b) => a + b, 0);
    const rating = total >= 80 ? '优秀' : total >= 60 ? '良好' : total >= 40 ? '一般' : '较低';
    const color = total >= 80 ? '#10b981' : total >= 60 ? '#6366F1' : total >= 40 ? '#f59e0b' : '#ef4444';

    const metrics = [
      { name: '域名年龄', value: scores.domainAge, max: 40, color: '#4F46E5' },
      { name: '反向链接', value: scores.backlinks, max: 30, color: '#6366F1' },
      { name: '网站流量', value: scores.traffic, max: 25, color: '#8B5CF6' },
      { name: '内容质量', value: scores.content, max: 20, color: '#A78BFA' },
      { name: '社交信号', value: scores.social, max: 15, color: '#C4B5FD' },
      { name: '技术优化', value: scores.technical, max: 20, color: '#7C3AED' },
    ];

    resultsEl.innerHTML = `
      <div class="score-circle" style="border-color:${color}">
        <div class="score-num" style="color:${color}">${total}</div>
        <div class="score-label">${rating}</div>
      </div>
      ${metrics.map(m => `
        <div class="metric">
          <span class="metric-name">${m.name}</span>
          <span class="metric-value">${m.value}/${m.max}</span>
        </div>
        <div class="metric-bar"><div class="metric-bar-fill" style="width:${m.value/m.max*100}%;background:${m.color}"></div></div>
      `).join('')}
      <p style="color:#94a3b8;font-size:0.8rem;margin-top:16px;text-align:center">⚠️ 此评分为模拟计算，仅供参考。实际权重需结合多平台数据。</p>
    `;
    resultsCard.style.display = 'block';
  }

  checkBtn.addEventListener('click', check);
  domainEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
  check();
})();
</script>
