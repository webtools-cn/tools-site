  <script>
  const input = document.getElementById('charInput');
  const btn = document.getElementById('lookupBtn');
  const result = document.getElementById('result');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function lookup() {
    const text = input.value;
    if (!text.trim()) { showToast('请输入字符'); return; }
    const chars = [...text];
    let html = '';
    chars.forEach(ch => {
      const cp = ch.codePointAt(0);
      const hex = cp.toString(16).toUpperCase().padStart(4, '0');
      const utf8 = new TextEncoder().encode(ch);
      const utf8hex = Array.from(utf8).map(b => b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
      const utf16 = Array.from(new Uint16Array(new TextEncoder().encode(ch).buffer).constructor ? [] : []); 
      const utf16code = [];
      if (cp <= 0xFFFF) {
        utf16code.push(cp.toString(16).toUpperCase().padStart(4,'0'));
      } else {
        const H = Math.floor((cp - 0x10000) / 0x400) + 0xD800;
        const L = ((cp - 0x10000) % 0x400) + 0xDC00;
        utf16code.push(H.toString(16).toUpperCase(), L.toString(16).toUpperCase());
      }
      const entity = cp <= 0xFFFF ? `&#x${hex};` : `&#x${hex};`;
      const namedEntities = {'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;'};
      const named = namedEntities[ch] || '';
      html += `<div style="margin-bottom:16px;">
        <div class="char-preview">${ch}</div>
        <table>
          <tr><td>Unicode码点</td><td><span class="code">U+${hex}</span> (十进制: ${cp})</td></tr>
          <tr><td>UTF-8 编码</td><td><span class="code">${utf8hex}</span></td></tr>
          <tr><td>UTF-16 编码</td><td><span class="code">${utf16code.join(' ')}</span></td></tr>
          <tr><td>HTML实体</td><td><span class="code">${entity}</span>${named ? ' <span class="code">' + named + '</span>' : ''}</td></tr>
          <tr><td>字符名称</td><td>${getCharName(cp)}</td></tr>
          <tr><td>字符类别</td><td>${getCharCategory(ch)}</td></tr>
        </table>
      </div>`;
    });
    result.innerHTML = html || '<p style="color:var(--text-secondary)">请输入字符开始查询</p>';
  }

  function getCharName(cp) {
    try { return 'Unicode字符' } catch(e) { return '-' }
  }
  function getCharCategory(ch) {
    if (/\p{L}/u.test(ch)) return '字母';
    if (/\p{N}/u.test(ch)) return '数字';
    if (/\p{P}/u.test(ch)) return '标点';
    if (/\p{S}/u.test(ch)) return '符号';
    if (/\p{Z}/u.test(ch)) return '空白';
    if (/\p{Emoji}/u.test(ch)) return 'Emoji';
    return '其他';
  }
  btn.addEventListener('click', lookup);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookup(); } });
  // 输入示例
  input.value = '😀';
  lookup();
  </script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
