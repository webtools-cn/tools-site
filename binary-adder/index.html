<main>
  <h1>➕ 二进制加法器</h1>
  <p class="subtitle">每行输入一个二进制数，自动求和</p>
  <div class="card">
    <label for="bins">输入二进制数（每行一个）</label>
    <textarea id="bins" placeholder="1010&#10;1100&#10;111"></textarea>
    <div class="row" style="margin-top:12px;">
      <div>
        <label for="outBase">输出进制</label>
        <select id="outBase">
          <option value="2">二进制</option>
          <option value="10" selected>十进制</option>
          <option value="16">十六进制</option>
        </select>
      </div>
      <button class="btn" id="calcBtn">➕ 计算</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
  <div class="card">
    <h3>使用说明</h3>
    <p>每行输入一个二进制数（只能包含0和1），工具会自动对齐并求和。可以选择以二进制、十进制或十六进制显示结果。支持最多50行输入。</p>
  </div>
</main>

<div id="toast"></div>
<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

document.getElementById('calcBtn').addEventListener('click', function(){
  var lines = document.getElementById('bins').value.trim().split('\n').filter(function(l){return l.trim()});
  if (lines.length === 0) { toast('请输入二进制数'); return; }
  if (lines.length > 50) { toast('最多支持50行'); return; }
  var valid = true;
  var nums = [];
  lines.forEach(function(line){
    line = line.trim();
    if (!/^[01]+$/.test(line)) { valid = false; return; }
    nums.push(parseInt(line, 2));
  });
  if (!valid) { toast('输入包含无效字符，只能包含0和1'); return; }

  var sum = nums.reduce(function(a,b){return a+b}, 0);
  var base = parseInt(document.getElementById('outBase').value);
  var resultHtml = '<div>求和结果:</div>';
  if (base === 2) resultHtml += '<div class="result-box"><span class="result-box" style="font-size:1.4rem;font-weight:700;color:var(--success)">' + sum.toString(2) + '</span> <span style="font-size:.9rem;color:var(--text-secondary)">(二进制)</span></div>';
  else if (base === 16) resultHtml += '<div class="result-box"><span style="font-size:1.4rem;font-weight:700;color:var(--success)">' + sum.toString(16).toUpperCase() + '</span> <span style="font-size:.9rem;color:var(--text-secondary)">(十六进制)</span></div>';
  else resultHtml += '<div class="result-box"><span style="font-size:1.4rem;font-weight:700;color:var(--success)">' + sum + '</span> <span style="font-size:.9rem;color:var(--text-secondary)">(十进制)</span></div>';
  resultHtml += '<div class="steps">输入: ' + lines.join(' + ') + '</div>';
  document.getElementById('result').innerHTML = resultHtml;
});
</script>
