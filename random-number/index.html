<body>
<div class="container">
<div class="header"><h1>🎲 随机数生成器</h1><div class="lang-switch"><a href="../en/random-number/" class="active">中文</a><a href="../en/random-number/">EN</a></div></div>
<p class="nav-back"><a href="../index.html">首页</a> &rsaquo; <a href="../#tools">工具</a> &rsaquo; 随机数生成器</p>
<div class="hero"><p>免费在线随机数生成器，使用密码学安全算法。支持整数/小数随机数生成，自定义范围和数量，支持去重。适合抽奖、游戏、随机分配等场景。 <span class="badge">🔐 安全随机 · 无需注册</span></p></div>

<div class="panel">
  <div class="panel-title">⚙️ 参数设置</div>
  <div class="input-group">
    <div><label>类型</label><select id="numType"><option value="int">整数</option><option value="float">小数</option></select></div>
    <div><label>最小值</label><input type="number" id="minVal" value="1"></div>
    <div><label>最大值</label><input type="number" id="maxVal" value="100"></div>
    <div><label>生成数量</label><input type="number" id="count" value="5" min="1" max="1000"></div>
    <div id="decimalGroup"><label>小数位数</label><input type="number" id="decimals" value="2" min="1" max="10"></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:0"><input type="checkbox" id="noRepeat"> 不允许重复</label>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:0"><input type="checkbox" id="sortResult"> 排序输出</label>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary btn-large" id="genBtn">🎲 生成随机数</button>
    <button class="btn btn-secondary" id="copyBtn">📋 一键复制</button>
    <button class="btn btn-secondary" id="refreshBtn">🔄 重新生成</button>
  </div>
</div>

<div class="panel">
  <div class="panel-title">📊 生成结果 <span style="font-weight:400;font-size:.8rem;color:#64748b" id="resultCount"></span></div>
  <div class="result-area" id="resultArea"><span style="color:#94a3b8">点击上方按钮生成随机数</span></div>
</div>

<footer><p>© 2025 Free ToolBase · 纯前端计算，数据不上传服务器 · <a href="../">首页</a></p></footer>
<div class="toast" id="toast"></div>
</div>

<script>
const numType=document.getElementById('numType'),minVal=document.getElementById('minVal'),
  maxVal=document.getElementById('maxVal'),count=document.getElementById('count'),
  decimals=document.getElementById('decimals'),noRepeat=document.getElementById('noRepeat'),
  sortResult=document.getElementById('sortResult'),resultArea=document.getElementById('resultArea'),
  resultCount=document.getElementById('resultCount'),decimalGroup=document.getElementById('decimalGroup');

function showToast(msg) {
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function getSecureRandom() {
  var arr=new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0]/4294967295;
}

numType.addEventListener('change',function(){
  decimalGroup.style.display=numType.value==='float'?'block':'none';
});

function generate() {
  var min=parseFloat(minVal.value)||0,max=parseFloat(maxVal.value)||100,
    n=parseInt(count.value)||5,isFloat=numType.value==='float',
    dp=parseInt(decimals.value)||2,unique=noRepeat.checked,sort=sortResult.checked;
  if(min>=max){showToast('最小值必须小于最大值');return;}
  if(unique){
    if(isFloat){showToast('小数不支持去重模式');return;}
    var range=Math.floor(max)-Math.ceil(min)+1;
    if(n>range){showToast('不重复数量('+n+')不能超过范围大小('+range+')');return;}
  }
  var results=[];
  if(unique){
    var pool=[];
    for(var i=Math.ceil(min);i<=Math.floor(max);i++)pool.push(i);
    for(var j=pool.length-1;j>0;j--){
      var ri=Math.floor(getSecureRandom()*(j+1));
      var tmp=pool[j];pool[j]=pool[ri];pool[ri]=tmp;
    }
    results=pool.slice(0,n);
  }else{
    for(var k=0;k<n;k++){
      var r=getSecureRandom()*(max-min)+min;
      if(!isFloat)r=Math.floor(r);
      else r=parseFloat(r.toFixed(dp));
      results.push(r);
    }
  }
  if(sort)results.sort(function(a,b){return a-b;});
  resultArea.innerHTML=results.map(function(v){return '<span class="result-tag">'+v+'</span>';}).join('');
  resultCount.textContent='（共'+results.length+'个）';
}

function copyAll() {
  var tags=resultArea.querySelectorAll('.result-tag');
  if(tags.length===0){showToast('请先生成随机数');return;}
  var text=Array.from(tags).map(function(t){return t.textContent;}).join(', ');
  navigator.clipboard.writeText(text).then(function(){showToast('已复制 '+tags.length+' 个随机数');});
}

document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('copyBtn').addEventListener('click',copyAll);
document.getElementById('refreshBtn').addEventListener('click',generate);
generate();
</script>
