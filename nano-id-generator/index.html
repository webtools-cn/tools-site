<body>
<header><div class="container"><div class="header-left"><span class="logo">🔑 Free ToolBase</span><a href="/" class="back-link">← 返回首页</a></div></div></header>
<main><div class="container">
<h1>Nano ID 生成器</h1>
<p class="subtitle">生成紧凑、URL安全、防碰撞的唯一ID</p>
<div class="controls">
  <div class="control-item">
    <label>长度</label>
    <input type="number" id="idLength" value="21" min="1" max="100" />
  </div>
  <div class="control-item">
    <label>字符集</label>
    <select id="charset">
      <option value="default">默认 (A-Za-z0-9_-)</option>
      <option value="alpha">字母 (A-Za-z)</option>
      <option value="lowercase">小写字母 (a-z)</option>
      <option value="uppercase">大写字母 (A-Z)</option>
      <option value="numeric">数字 (0-9)</option>
      <option value="alphanumeric">字母数字</option>
      <option value="hex">十六进制 (0-9a-f)</option>
      <option value="nolookalikes">无易混淆字符</option>
    </select>
  </div>
  <div class="control-item">
    <label>批量</label>
    <input type="number" id="batchCount" value="1" min="1" max="100" />
  </div>
  <button class="btn" id="generateBtn">生成</button>
</div>
<div class="result-card" id="resultCard">
  <div class="nano-id" id="nanoIdDisplay">点击"生成"按钮</div>
  <div class="meta">
    <span id="idMeta">长度: - | 字符集: -</span>
  </div>
  <div class="action-btns">
    <button onclick="copyNanoId()">复制</button>
    <button id="copyAllBtn" style="display:none">复制全部</button>
  </div>
</div>
<div id="listContainer" style="display:none;margin-top:20px">
  <h3 style="color:#f1f5f9;margin-bottom:12px">批量结果</h3>
  <ul class="id-list" id="idList"></ul>
</div>
</div></main>
<footer><div class="container"><p>&copy; 2025 Free ToolBase. 所有工具均免费使用。</p></div></footer>
<div id="toast"></div>
<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}

var charsetMap = {
  default: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_',
  alpha: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
  lowercase: 'abcdefghijklmnopqrstuvwxyz',
  uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  numeric: '0123456789',
  alphanumeric: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',
  hex: '0123456789abcdef',
  nolookalikes: 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'
};

function generateNanoId(len, charset){
  var chars = charsetMap[charset] || charsetMap.default;
  var mask = (2 << (Math.log(chars.length - 1) / Math.LN2)) - 1;
  var step = Math.ceil(1.6 * mask * len / chars.length);
  var id = '';
  while(id.length < len){
    var bytes = new Uint8Array(step);
    crypto.getRandomValues(bytes);
    for(var i=0; i<step; i++){
      var idx = bytes[i] & mask;
      if(idx < chars.length){
        id += chars[idx];
        if(id.length >= len) break;
      }
    }
  }
  return id;
}

var currentIds = [];

document.getElementById('generateBtn').addEventListener('click', function(){
  var len = parseInt(document.getElementById('idLength').value) || 21;
  len = Math.max(1, Math.min(100, len));
  var charset = document.getElementById('charset').value;
  var count = parseInt(document.getElementById('batchCount').value) || 1;
  count = Math.max(1, Math.min(100, count));

  currentIds = [];
  for(var i=0; i<count; i++){
    currentIds.push(generateNanoId(len, charset));
  }

  var charsetName = document.getElementById('charset').selectedOptions[0].text;

  if(count === 1){
    document.getElementById('nanoIdDisplay').textContent = currentIds[0];
    document.getElementById('idMeta').textContent = '长度: '+len+' | 字符集: '+charsetName;
    document.getElementById('copyAllBtn').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('listContainer').style.display = 'none';
  } else {
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('listContainer').style.display = 'block';
    document.getElementById('copyAllBtn').style.display = 'inline-block';
    var listEl = document.getElementById('idList');
    listEl.innerHTML = currentIds.map(function(id, idx){
      return '<li><span>'+(idx+1)+'. '+id+'</span><button style="padding:4px 12px;background:#334155;color:#e2e8f0;border:none;border-radius:4px;cursor:pointer;font-size:.8em" onclick="copySingle(\''+id.replace(/'/g,"\\'")+'\')">复制</button></li>';
    }).join('');
  }
});

function copyNanoId(){
  var text = currentIds.length === 1 ? currentIds[0] : currentIds.join('\n');
  navigator.clipboard.writeText(text).then(function(){showToast("已复制")})["catch"](function(){showToast("复制失败")});
}

function copySingle(id){
  navigator.clipboard.writeText(id).then(function(){showToast("已复制: "+id)})["catch"](function(){showToast("复制失败")});
}

document.getElementById('copyAllBtn').addEventListener('click', function(){
  navigator.clipboard.writeText(currentIds.join('\n')).then(function(){showToast("已复制 "+currentIds.length+" 个ID")})["catch"](function(){showToast("复制失败")});
});
</script>
</body>
