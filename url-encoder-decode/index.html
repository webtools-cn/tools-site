<script>
(function(){
var input=document.getElementById('inputText');
var output=document.getElementById('outputText');
var charCount=document.getElementById('charCount');
var toast=document.getElementById('toast');

function showToast(msg){
toast.textContent=msg;toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show');},2000);
}

function updateCount(){
charCount.textContent='字符数: '+input.value.length;
}

document.getElementById('btnEncode').addEventListener('click',function(){
try{
output.value=encodeURIComponent(input.value);
updateCount();
}catch(e){showToast('编码失败: '+e.message);}
});

document.getElementById('btnDecode').addEventListener('click',function(){
try{
output.value=decodeURIComponent(input.value.replace(/\+/g,' '));
updateCount();
}catch(e){showToast('解码失败，请检查输入是否为有效的URL编码格式');}
});

document.getElementById('btnSwap').addEventListener('click',function(){
var tmp=input.value;
input.value=output.value;
output.value=tmp;
updateCount();
});

document.getElementById('btnClear').addEventListener('click',function(){
input.value='';
output.value='';
updateCount();
});

document.getElementById('btnCopy').addEventListener('click',function(){
if(!output.value){showToast('没有可复制的内容');return;}
navigator.clipboard.writeText(output.value).then(function(){
showToast('已复制到剪贴板');
}).catch(function(){
output.select();
document.execCommand('copy');
showToast('已复制到剪贴板');
});
});

input.addEventListener('input',updateCount);
})();
</script>
