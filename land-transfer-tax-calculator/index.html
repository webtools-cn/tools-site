<body>

  <p class="hero">免费在线土地转让税计算器。支持安大略省、多伦多市、BC省等多地区。输入房价，一键计算应缴土地转让税。</p>

  <div class="card">
    <div class="form-group">
      <label for="region">选择地区</label>
      <select id="region">
        <option value="ontario" selected>安大略省 (Ontario)</option>
        <option value="toronto">多伦多市 (Toronto)</option>
        <option value="bc">BC省 (British Columbia)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="homePrice">房屋购买价格（加元）</label>
      <input type="number" id="homePrice" placeholder="如 800000" value="800000" min="0" step="1000">
    </div>
    <div class="form-group">
      <label for="firstTime">是否首次购房者</label>
      <select id="firstTime">
        <option value="yes">是 (首次购房)</option>
        <option value="no" selected>否</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="calculate()">计算税费</button>
      <button class="btn btn-outline" onclick="copyResults()">📋 复制结果</button>
      <button class="btn btn-outline" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="card" id="results" style="display:none;">

      <div class="result-item" id="muniResult" style="display:none;">
        <div class="label">市级土地转让税</div>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3);"></div>

<script>
// 税率表：[区间上限, 税率%]
var rates = {
  ontario: [[55000,0.5],[250000,1.0],[400000,1.5],[2000000,2.0],[Infinity,2.5]],
  toronto: [[55000,0.5],[250000,1.0],[400000,1.5],[2000000,2.0],[Infinity,2.5]],
  bc: [[200000,1.0],[2000000,2.0],[3000000,3.0],[Infinity,5.0]]
};
// 多伦多市级税率
var torontoMuni = [[55000,0.5],[250000,1.0],[400000,1.5],[2000000,2.0],[Infinity,2.5]];
// 首次购房退税上限
var rebateMax = {ontario: 4000, toronto: 4475, bc: 8000};

function calcTiered(price, brackets) {
  var tax = 0, remaining = price, prevCap = 0;
  for (var i = 0; i < brackets.length; i++) {
    var cap = brackets[i][0], rate = brackets[i][1];
    var tierUpper = cap - prevCap;
    var taxable = Math.min(remaining, tierUpper);
    if (taxable > 0) tax += taxable * rate / 100;
    remaining -= taxable;
    prevCap = cap;
    if (remaining <= 0) break;
  }
  return tax;
}

function fmt(n) {
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function calculate() {
  var region = document.getElementById('region').value;
  var price = parseFloat(document.getElementById('homePrice').value) || 0;
  var isFirstTime = document.getElementById('firstTime').value === 'yes';

  var provTax = calcTiered(price, rates[region]);
  var muniTax = 0;
  if (region === 'toronto') {
    muniTax = calcTiered(price, torontoMuni);
  }

  var rebate = 0;
  if (isFirstTime) {
    rebate = Math.min(provTax + muniTax, rebateMax[region]);
  }

  var total = provTax + muniTax - rebate;

  document.getElementById('resPrice').textContent = fmt(price);
  document.getElementById('resProv').textContent = fmt(provTax);
  document.getElementById('resMuni').textContent = fmt(muniTax);
  document.getElementById('resRebate').textContent = rebate > 0 ? ('-' + fmt(rebate)) : '$0.00';
  document.getElementById('resTotal').textContent = fmt(Math.max(0, total));
  document.getElementById('muniResult').style.display = (region === 'toronto') ? '' : 'none';
  document.getElementById('results').style.display = 'block';

  showToast('计算完成');
}

function clearAll() {
  document.getElementById('homePrice').value = '';
  document.getElementById('results').style.display = 'none';
  showToast('已清空');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}

document.querySelectorAll('input').forEach(function(el) {
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') calculate();
  });
});

function copyResults() {
  var res = document.getElementById('results');
  if (!res || res.style.display === 'none') { showToast('请先计算'); return; }
  var text = '';
  var items = res.querySelectorAll('.result-item');
  for (var i = 0; i < items.length; i++) {
    if (items[i].style.display === 'none') continue;
    var label = items[i].querySelector('.label');
    var value = items[i].querySelector('.value');
    if (label && value) text += label.textContent + ': ' + value.textContent + '\n';
  }
  navigator.clipboard.writeText(text).then(function() { showToast('已复制'); }).catch(function() { showToast('复制失败'); });
}
</script>
