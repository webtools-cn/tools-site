<body>
<header><a href="/" class="logo">Free ToolBase</a><nav><a href="/">首页</a><a href="/en/">English</a></nav></header>
<div class="container">
  <h1>GraphQL Schema 差异对比</h1>
  <p class="subtitle">并排比较两个 GraphQL Schema (SDL 格式)，高亮显示新增、删除和修改的类型及字段。</p>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn btn-primary" onclick="compare()">对比 Schema</button>
    <button class="btn" onclick="swapSchemas()">⇄ 交换</button>
    <button class="btn" onclick="clearAll()">清空</button>
  </div>

  <div class="editor-wrap">
    <div class="panel">
      <div class="panel-label">旧版本 Schema (Old)</div>
      <textarea id="oldSchema" placeholder="粘贴旧的 GraphQL Schema...
type User {
  id: ID!
  name: String!
  email: String!
  role: String
}"></textarea>
    </div>
    <div class="panel">
      <div class="panel-label">新版本 Schema (New)</div>
      <textarea id="newSchema" placeholder="粘贴新的 GraphQL Schema...
type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole
  avatar: String
}

enum UserRole {
  ADMIN
  USER
}"></textarea>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat"><span class="stat-dot" style="background:var(--added);"></span> 新增: <strong id="addedCount">0</strong></div>
    <div class="stat"><span class="stat-dot" style="background:var(--removed);"></span> 删除: <strong id="removedCount">0</strong></div>
    <div class="stat"><span class="stat-dot" style="background:var(--changed);"></span> 变更: <strong id="changedCount">0</strong></div>
  </div>

  <div class="diff-output" id="diffOutput" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>
<footer>Free ToolBase &copy; 2024 — 纯前端处理，数据不上传</footer>

<script>
function parseSchema(text) {
  const types = {};
  const lines = text.split('\n');
  let currentType = null;
  let currentKind = null;
  
  for (let line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    
    const typeMatch = trimmed.match(/^(type|input|enum|interface|union|scalar)\s+(\w+)/);
    if (typeMatch) {
      currentType = typeMatch[2];
      currentKind = typeMatch[1];
      types[currentType] = { kind: currentKind, fields: [], interfaces: [] };
      continue;
    }
    
    if (currentType && trimmed === '{') continue;
    if (currentType && trimmed === '}') { currentType = null; currentKind = null; continue; }
    
    if (currentType) {
      const fieldMatch = trimmed.match(/^(\w+)\s*(\([^)]*\))?\s*:\s*(.+?)(!?)\s*$/);
      if (fieldMatch) {
        const name = fieldMatch[1];
        const args = fieldMatch[2] || '';
        let typeStr = fieldMatch[3].trim();
        const required = fieldMatch[4] === '!';
        types[currentType].fields.push({ name, type: typeStr, required, args });
      }
      
      const implMatch = trimmed.match(/^implements\s+(.+)$/);
      if (implMatch && currentKind === 'type') {
        types[currentType].interfaces = implMatch[1].split('&').map(s => s.trim());
      }
    }
  }
  return types;
}

function compare() {
  const oldText = document.getElementById('oldSchema').value.trim();
  const newText = document.getElementById('newSchema').value.trim();
  
  if (!oldText && !newText) { showToast('请至少输入一个Schema'); return; }
  if (!oldText) { showToast('请输入旧版本Schema'); return; }
  if (!newText) { showToast('请输入新版本Schema'); return; }

  const oldSchema = parseSchema(oldText);
  const newSchema = parseSchema(newText);
  
  const oldTypes = Object.keys(oldSchema);
  const newTypes = Object.keys(newSchema);
  
  const added = newTypes.filter(t => !oldTypes.includes(t));
  const removed = oldTypes.filter(t => !newTypes.includes(t));
  const common = oldTypes.filter(t => newTypes.includes(t));
  
  let changed = [];
  common.forEach(typeName => {
    const oldFields = oldSchema[typeName].fields;
    const newFields = newSchema[typeName].fields;
    const oldFieldNames = oldFields.map(f => f.name);
    const newFieldNames = newFields.map(f => f.name);
    
    const addedF = newFieldNames.filter(f => !oldFieldNames.includes(f));
    const removedF = oldFieldNames.filter(f => !newFieldNames.includes(f));
    const commonF = oldFieldNames.filter(f => newFieldNames.includes(f));
    
    // 检查相同字段的类型变化
    const modifiedF = commonF.filter(f => {
      const of = oldFields.find(x => x.name === f);
      const nf = newFields.find(x => x.name === f);
      return of.type !== nf.type || of.required !== nf.required;
    });
    
    if (addedF.length > 0 || removedF.length > 0 || modifiedF.length > 0) {
      changed.push({ type: typeName, added: addedF, removed: removedF, modified: modifiedF });
    }
  });

  document.getElementById('addedCount').textContent = added.length;
  document.getElementById('removedCount').textContent = removed.length;
  document.getElementById('changedCount').textContent = changed.length;
  document.getElementById('stats').style.display = 'flex';
  
  let html = '';
  
  if (added.length > 0) {
    html += '<div class="diff-section added"><strong>🟢 新增类型 (' + added.length + '):</strong><br>';
    added.forEach(t => {
      html += '  + ' + t;
      const fields = newSchema[t].fields;
      if (fields.length > 0) {
        html += ' { ' + fields.map(f => f.name + ': ' + f.type + (f.required ? '!' : '')).join(', ') + ' }';
      }
      html += '<br>';
    });
    html += '</div>';
  }
  
  if (removed.length > 0) {
    html += '<div class="diff-section removed"><strong>🔴 删除类型 (' + removed.length + '):</strong><br>';
    removed.forEach(t => {
      html += '  - ' + t;
      const fields = oldSchema[t].fields;
      if (fields.length > 0) {
        html += ' { ' + fields.map(f => f.name + ': ' + f.type + (f.required ? '!' : '')).join(', ') + ' }';
      }
      html += '<br>';
    });
    html += '</div>';
  }
  
  if (changed.length > 0) {
    html += '<div class="diff-section changed"><strong>🟡 变更类型 (' + changed.length + '):</strong><br>';
    changed.forEach(c => {
      html += '  ~ ' + c.type + '<br>';
      c.added.forEach(f => { html += '    <span class="diff-added">+ ' + f + '</span><br>'; });
      c.removed.forEach(f => { html += '    <span class="diff-removed">- ' + f + '</span><br>'; });
      c.modified.forEach(f => { html += '    <span class="diff-changed">~ ' + f + '</span><br>'; });
    });
    html += '</div>';
  }
  
  if (!html) {
    html = '<div style="padding:12px;color:var(--text-secondary);">✅ 两个Schema完全一致，没有差异</div>';
  }
  
  document.getElementById('diffOutput').innerHTML = html;
  document.getElementById('diffOutput').style.display = 'block';
  showToast('对比完成');
}

function swapSchemas() {
  const oldEl = document.getElementById('oldSchema');
  const newEl = document.getElementById('newSchema');
  const tmp = oldEl.value; oldEl.value = newEl.value; newEl.value = tmp;
}

function clearAll() {
  document.getElementById('oldSchema').value = '';
  document.getElementById('newSchema').value = '';
  document.getElementById('diffOutput').innerHTML = '';
  document.getElementById('diffOutput').style.display = 'none';
  document.getElementById('stats').style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
