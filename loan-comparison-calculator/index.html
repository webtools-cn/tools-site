<header><h1>💰 贷款比较计算器</h1><p>同时对比多个贷款方案 · 选出最优</p></header>
<div class="container">
  <div class="card">
    <h2>📋 配置贷款方案</h2>
    <div id="plansContainer">
      <div class="loan-plan">
        <div class="plan-header"><span class="plan-name">方案 A</span><button class="btn-sm" onclick="this.closest('.loan-plan').remove();compare()">删除</button></div>
        <div class="row">
          <div class="form-group"><label>贷款金额 (元)</label><input type="number" class="amount" value="500000" min="1000"></div>
          <div class="form-group"><label>年利率 (%)</label><input type="number" class="rate" value="4.5" min="0.1" step="0.01"></div>
          <div class="form-group"><label>贷款期限 (月)</label><input type="number" class="months" value="240" min="1"></div>
        </div>
        <div class="result-grid" style="display:none" data-results></div>
      </div>
      <div class="loan-plan">
        <div class="plan-header"><span class="plan-name">方案 B</span><button class="btn-sm" onclick="this.closest('.loan-plan').remove();compare()">删除</button></div>
        <div class="row">
          <div class="form-group"><label>贷款金额 (元)</label><input type="number" class="amount" value="500000" min="1000"></div>
          <div class="form-group"><label>年利率 (%)</label><input type="number" class="rate" value="3.8" min="0.1" step="0.01"></div>
          <div class="form-group"><label>贷款期限 (月)</label><input type="number" class="months" value="240" min="1"></div>
        </div>
        <div class="result-grid" style="display:none" data-results></div>
      </div>
    </div>
    <button class="btn" id="addPlanBtn" style="margin-top:8px;background:var(--text-secondary)">+ 添加贷款方案</button>
    <button class="btn" id="compareBtn" style="margin-left:8px">🔍 开始比较</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 比较结果</h2>
    <div style="overflow-x:auto"><table id="resultTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
    <div style="margin-top:12px;padding:10px;background:#f0fdf4;border-radius:8px;font-size:0.85rem">
      <strong>🥇 最优方案：</strong><span id="bestPlan"></span>
    </div>
  </div>
</div>

<script>
(function() {
  const plansContainer = document.getElementById('plansContainer');
  const addPlanBtn = document.getElementById('addPlanBtn');
  const compareBtn = document.getElementById('compareBtn');
  const resultsCard = document.getElementById('resultsCard');
  const tableHead = document.getElementById('tableHead');
  const tableBody = document.getElementById('tableBody');
  const bestPlanEl = document.getElementById('bestPlan');
  let planCount = 2;

  function calcMonthly(amount, annualRate, months) {
    if (months <= 0 || annualRate <= 0) return { monthly: amount/months, totalInterest: 0, totalPayment: amount };
    const monthlyRate = annualRate / 100 / 12;
    const monthly = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
    const totalPayment = monthly * months;
    const totalInterest = totalPayment - amount;
    return { monthly, totalInterest, totalPayment };
  }

  function compare() {
    const plans = [];
    document.querySelectorAll('#plansContainer .loan-plan').forEach((plan, i) => {
      const amount = parseFloat(plan.querySelector('.amount').value) || 0;
      const rate = parseFloat(plan.querySelector('.rate').value) || 0;
      const months = parseInt(plan.querySelector('.months').value) || 0;
      if (amount > 0 && rate > 0 && months > 0) {
        const r = calcMonthly(amount, rate, months);
        plans.push({ name: String.fromCharCode(65 + i), amount, rate, months, ...r });
      }
    });

    if (plans.length < 2) { resultsCard.style.display = 'none'; return; }

    const best = plans.reduce((a, b) => a.totalInterest < b.totalInterest ? a : b);

    tableHead.innerHTML = '<th>指标</th>' + plans.map(p => `<th class="${p.name===best.name?'best-col':''}">方案 ${p.name}</th>`).join('');
    const rows = [
      ['贷款金额', 'amount', '¥'],
      ['年利率', 'rate', '%'],
      ['贷款期限', 'months', '个月'],
      ['月供', 'monthly', '¥'],
      ['总利息', 'totalInterest', '¥'],
      ['总还款额', 'totalPayment', '¥'],
    ];
    tableBody.innerHTML = rows.map(([label, key, suffix]) =>
      `<tr><td>${label}</td>${plans.map(p => `<td class="${p.name===best.name?'best-col':''}">${suffix==='¥'?p[key].toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):suffix==='%'?p[key].toFixed(2):p[key]} ${suffix}</td>`).join('')}</tr>`
    ).join('');

    bestPlanEl.textContent = `方案 ${best.name} - 年利率${best.rate}%，总利息最低 ¥${best.totalInterest.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    resultsCard.style.display = 'block';
  }

  function addPlan() {
    const name = String.fromCharCode(65 + planCount);
    planCount++;
    const div = document.createElement('div');
    div.className = 'loan-plan';
    div.innerHTML = `
      <div class="plan-header"><span class="plan-name">方案 ${name}</span><button class="btn-sm" onclick="this.closest('.loan-plan').remove();compare()">删除</button></div>
      <div class="row">
        <div class="form-group"><label>贷款金额 (元)</label><input type="number" class="amount" value="500000" min="1000"></div>
        <div class="form-group"><label>年利率 (%)</label><input type="number" class="rate" value="4.0" min="0.1" step="0.01"></div>
        <div class="form-group"><label>贷款期限 (月)</label><input type="number" class="months" value="240" min="1"></div>
      </div>
    `;
    plansContainer.appendChild(div);
    div.querySelectorAll('input').forEach(el => el.addEventListener('input', compare));
    compare();
  }

  addPlanBtn.addEventListener('click', addPlan);
  compareBtn.addEventListener('click', compare);
  document.querySelectorAll('#plansContainer input').forEach(el => el.addEventListener('input', compare));
  compare();
})();
</script>
