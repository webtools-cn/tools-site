<script>
(function(){
const $=id=>document.getElementById(id);
const templates={
card_list:{name:'📋 卡片列表',items:[
{w:100,h:16},{w:60,h:12},{w:100,h:16},{w:60,h:12},{w:100,h:16},{w:60,h:12}
]},
article:{name:'📄 文章',items:[
{w:100,h:22},{w:60,h:14},{w:100,h:14},{w:90,h:14},{w:80,h:14},{w:100,h:14},{w:70,h:14}
]},
table:{name:'📊 表格',items:[
{w:100,h:16},{w:100,h:14},{w:100,h:14},{w:100,h:14},{w:100,h:14},{w:100,h:14}
]},
profile:{name:'👤 用户资料',items:[
{w:80,h:80,circle:true},{w:60,h:20},{w:40,h:14},{w:100,h:14},{w:90,h:14},{w:80,h:14}
]},
dashboard:{name:'📈 仪表板',items:[
{w:100,h:14},{w:48,h:80},{w:48,h:80},{w:48,h:80},{w:100,h:14},{w:32,h:60},{w:32,h:60},{w:32,h:60}
]},
product_grid:{name:'🛍 商品网格',items:[
{w:48,h:100},{w:48,h:14},{w:30,h:12},{w:48,h:100},{w:48,h:14},{w:30,h:12},{w:48,h:100},{w:48,h:14},{w:30,h:12}
]}
};

let currentTemplate='card_list';
let currentDevice='desktop';
let currentFormat='html';
let currentAnim='pulse';
let currentBg='#1e293b';
let currentSkel='#334155';
let currentHighlight='#475569';
let currentRadius=4;
let currentGap=12;
let currentCount=3;

function hexToRgb(hex){
const r=parseInt(hex.slice(1,3),16);
const g=parseInt(hex.slice(3,5),16);
const b=parseInt(hex.slice(5,7),16);
return `${r},${g},${b}`;
}

function buildSkeletonItems(){
const tpl=templates[currentTemplate];
const items=[];
const colors={bg:currentBg,skel:currentSkel,highlight:currentHighlight};
for(let i=0;i<currentCount;i++){
tpl.items.forEach(item=>{
items.push({...item,anim:currentAnim,radius:currentRadius,gap:currentGap,colors});
});
}
return items;
}

function renderPreview(){
const items=buildSkeletonItems();
const inner=$('previewInner');
const maxW=currentDevice==='mobile'?320:500;
inner.style.maxWidth=maxW+'px';
inner.style.background=currentBg;
inner.style.padding=currentGap+'px';
inner.style.borderRadius=currentRadius+'px';
let html='<div style="display:flex;flex-direction:column;gap:'+currentGap+'px;flex-wrap:wrap;">';
let rowItems=[];
items.forEach(item=>{
const w=item.w*(maxW/100);
const hPx=item.h;
if(item.circle){
rowItems.push('<div class="skel circle '+currentAnim+'" style="width:'+hPx+'px;height:'+hPx+'px;border-radius:50%;background-color:'+currentSkel+';flex-shrink:0;"></div>');
}else{
rowItems.push('<div class="skel '+currentAnim+'" style="width:'+w+'px;height:'+hPx+'px;border-radius:'+currentRadius+'px;background-color:'+currentSkel+';flex-shrink:0;"></div>');
}
});
html+=rowItems.join('');
html+='</div>';
inner.innerHTML=html;

updateCodeBlock();
}

function updateCodeBlock(){
const items=buildSkeletonItems();
const maxW=currentDevice==='mobile'?320:500;
const skelRgb=hexToRgb(currentSkel);
const bgRgb=hexToRgb(currentBg);
const highlightRgb=hexToRgb(currentHighlight);

let cssAnim='';
if(currentAnim==='pulse'){
cssAnim=`@keyframes skeleton-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.skeleton{animation:skeleton-pulse 1.5s ease-in-out infinite}`;
}else if(currentAnim==='wave'){
cssAnim=`@keyframes skeleton-wave{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skeleton{background:linear-gradient(90deg,rgba(${skelRgb},.4) 25%,rgba(${highlightRgb},.5) 37%,rgba(${skelRgb},.4) 63%);background-size:200px 100%;animation:skeleton-wave 1.5s ease-in-out infinite}`;
}else if(currentAnim==='shine'){
cssAnim=`@keyframes skeleton-shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.skeleton{position:relative;overflow:hidden;background:rgba(${skelRgb},.6)}
.skeleton::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:skeleton-shine 1.5s ease-in-out infinite}`;
}else{
cssAnim=`.skeleton{background:rgba(${skelRgb},.6)}`;
}

const cssCode=`.skeleton-container{background:#${currentBg.slice(1)};padding:${currentGap}px;border-radius:${currentRadius}px;display:flex;flex-direction:column;gap:${currentGap}px}
.skeleton{border-radius:${currentRadius}px}
${cssAnim}`;

let htmlItems=[];
items.forEach(item=>{
const w=item.w*(maxW/100);
const h=item.h;
if(item.circle){
htmlItems.push(`<div class="skeleton" style="width:${h}px;height:${h}px;border-radius:50%"></div>`);
}else{
htmlItems.push(`<div class="skeleton" style="width:${w}px;height:${h}px"></div>`);
}
});

let code='';
if(currentFormat==='html'){
code=`<!-- Skeleton Loader - 骨架屏 -->
<style>
${cssCode}
</style>
<div class="skeleton-container">
  ${htmlItems.join('\n  ')}
</div>`;
}else if(currentFormat==='react'){
code=`// SkeletonLoader.jsx
import React from 'react';

const styles = {
  container: {
    background: '#${currentBg.slice(1)}',
    padding: '${currentGap}px',
    borderRadius: '${currentRadius}px',
    display: 'flex',
    flexDirection: 'column',
    gap: '${currentGap}px'
  },
  skeleton: {
    borderRadius: '${currentRadius}px'
  }
};

export default function SkeletonLoader() {
  return (
    <div style={styles.container}>
      ${htmlItems.map(i=>i.replace(/class="skeleton"/,'style={styles.skeleton}').replace(/style="([^"]+)"/,'style={{$1}}')).join('\n      ')}
    </div>
  );
}`;
}else if(currentFormat==='vue'){
code=`<!-- SkeletonLoader.vue -->
<template>
  <div class="skeleton-container">
    ${htmlItems.join('\n    ')}
  </div>
</template>

<style scoped>
${cssCode}
</style>`;
}else if(currentFormat==='css'){
code=`/* Skeleton Loader CSS */
${cssCode}`;
}
$('codeBlock').textContent=code;
}

function showToast(msg){
const t=$('toast');
t.textContent=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

function copyCode(){
const code=$('codeBlock').textContent;
navigator.clipboard.writeText(code).then(()=>{
showToast('✅ 代码已复制到剪贴板！');
}).catch(()=>{
showToast('❌ 复制失败，请手动选择复制');
});
}

// Init template buttons
const templateGrid=$('templateGrid');
Object.entries(templates).forEach(([key,val])=>{
const btn=document.createElement('button');
btn.className='template-btn'+(key===currentTemplate?' active':'');
btn.textContent=val.name;
btn.dataset.tpl=key;
btn.addEventListener('click',()=>{
currentTemplate=key;
templateGrid.querySelectorAll('.template-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderPreview();
});
templateGrid.appendChild(btn);
});

// Device toggle
document.querySelectorAll('.device-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
currentDevice=btn.dataset.device;
document.querySelectorAll('.device-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderPreview();
});
});

// Export tabs
document.querySelectorAll('.export-tab').forEach(tab=>{
tab.addEventListener('click',()=>{
currentFormat=tab.dataset.format;
document.querySelectorAll('.export-tab').forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
updateCodeBlock();
});
});

// Controls
$('animType').addEventListener('change',function(){
currentAnim=this.value;
renderPreview();
});
$('bgColor').addEventListener('input',function(){
currentBg=this.value;
renderPreview();
});
$('skelColor').addEventListener('input',function(){
currentSkel=this.value;
renderPreview();
});
$('highlightColor').addEventListener('input',function(){
currentHighlight=this.value;
renderPreview();
});
