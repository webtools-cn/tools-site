  <main>
    <h1>📝 在线文本去重工具</h1>
    <p class="subtitle">快速移除文本中的重复行和重复内容。支持多种匹配模式，实时统计，一键复制结果。纯前端处理，数据不上传。</p>

    <div class="tool-card">
      <div class="options-bar">
        <div class="option-group">
          <input type="checkbox" id="ignoreCase" checked>
          <label for="ignoreCase">忽略大小写</label>
        </div>
        <div class="option-group">
          <input type="checkbox" id="ignoreWhitespace">
          <label for="ignoreWhitespace">忽略首尾空白</label>
        </div>
        <div class="option-group">
          <input type="checkbox" id="ignoreEmpty" checked>
          <label for="ignoreEmpty">忽略空行</label>
        </div>
        <div class="option-group">
          <input type="checkbox" id="sortOutput">
          <label for="sortOutput">排序输出</label>
        </div>
      </div>

      <textarea id="input" placeholder="在此粘贴文本，每行一条记录...&#10;&#10;示例：&#10;苹果&#10;香蕉&#10;苹果&#10;橙子&#10;香蕉&#10;&#10;工具将自动检测并移除重复的"苹果"和"香蕉""></textarea>

      <div class="btn-row">
        <button class="btn btn-primary" id="btnDedup">🔍 执行去重</button>
        <button class="btn btn-secondary" id="btnClear">🗑️ 清空</button>
        <button class="btn btn-success" id="btnCopy">📋 复制结果</button>
      </div>

      <div class="stats-row" id="statsRow" style="display:none;">
        <div class="stat-item">
          <span class="stat-label">原始行数</span>
          <span class="stat-value" id="statOriginal">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">重复行数</span>
          <span class="stat-value warn" id="statDuplicate">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">去重后行数</span>
          <span class="stat-value highlight" id="statUnique">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">去重率</span>
          <span class="stat-value highlight" id="statRate">0%</span>
        </div>
      </div>

      <div class="output-area" id="outputArea" style="display:none;">
        <div class="output-label">✅ 去重结果</div>
        <textarea id="output" readonly placeholder="去重结果将显示在这里..."></textarea>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Free ToolBase · 纯前端处理，保障数据隐私</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const input = document.getElementById('input');
      const output = document.getElementById('output');
      const statsRow = document.getElementById('statsRow');
      const outputArea = document.getElementById('outputArea');
      const toast = document.getElementById('toast');

      const ignoreCase = document.getElementById('ignoreCase');
      const ignoreWhitespace = document.getElementById('ignoreWhitespace');
      const ignoreEmpty = document.getElementById('ignoreEmpty');
      const sortOutput = document.getElementById('sortOutput');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
      }

      function dedup() {
        var raw = input.value;
        if (!raw.trim()) {
          statsRow.style.display = 'none';
          outputArea.style.display = 'none';
          return;
        }

        var lines = raw.split('\n');

        // 预处理
        var processed = lines.map(function(line) {
          var l = line;
          if (ignoreWhitespace.checked) l = l.trim();
          if (ignoreCase.checked) l = l.toLowerCase();
          return l;
        });

        // 过滤空行
        var originalLines = lines;
        if (ignoreEmpty.checked) {
          var filtered = [];
          var filteredProcessed = [];
          for (var i = 0; i < lines.length; i++) {
            if (processed[i] !== '') {
              filtered.push(lines[i]);
              filteredProcessed.push(processed[i]);
            }
          }
          originalLines = filtered;
          processed = filteredProcessed;
        }

        // 去重 - 保持第一次出现的顺序
        var seen = {};
        var uniqueLines = [];
        var duplicateCount = 0;

        for (var i = 0; i < originalLines.length; i++) {
          var key = processed[i];
          if (!seen.hasOwnProperty(key)) {
            seen[key] = true;
            uniqueLines.push(originalLines[i]);
          } else {
            duplicateCount++;
          }
        }

        // 排序
        if (sortOutput.checked) {
          uniqueLines.sort(function(a, b) {
            var ka = ignoreCase.checked ? a.toLowerCase() : a;
            var kb = ignoreCase.checked ? b.toLowerCase() : b;
            if (ka < kb) return -1;
            if (ka > kb) return 1;
            return 0;
          });
        }

        // 计算总原始行数（不含空行如果勾选忽略空行）
        var totalOriginal = ignoreEmpty.checked ? originalLines.length : lines.length;

        // 更新统计
        document.getElementById('statOriginal').textContent = totalOriginal;
        document.getElementById('statDuplicate').textContent = duplicateCount;
        document.getElementById('statUnique').textContent = uniqueLines.length;
        var rate = totalOriginal > 0 ? Math.round((duplicateCount / totalOriginal) * 100) : 0;
        document.getElementById('statRate').textContent = rate + '%';

        statsRow.style.display = 'flex';
        outputArea.style.display = 'block';
        output.value = uniqueLines.join('\n');
      }

      // 实时去重（debounced）
      var debounceTimer;
      function autoDedup() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(dedup, 300);
      }

      input.addEventListener('input', autoDedup);
      ignoreCase.addEventListener('change', autoDedup);
      ignoreWhitespace.addEventListener('change', autoDedup);
      ignoreEmpty.addEventListener('change', autoDedup);
      sortOutput.addEventListener('change', autoDedup);

      document.getElementById('btnDedup').addEventListener('click', dedup);

      document.getElementById('btnClear').addEventListener('click', function() {
        input.value = '';
        output.value = '';
        statsRow.style.display = 'none';
        outputArea.style.display = 'none';
        input.focus();
      });

      document.getElementById('btnCopy').addEventListener('click', function() {
        var text = output.value;
        if (!text) {
          showToast('⚠️ 请先执行去重获得结果');
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            showToast('✅ 已复制到剪贴板！');
          }).catch(function() {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          showToast('✅ 已复制到剪贴板！');
        } catch(e) {
          showToast('⚠️ 复制失败，请手动选择复制');
        }
        document.body.removeChild(ta);
      }
    })();
  </script>
