<body>
<div class="container">
<div class="nav-back"><a href="/">← 返回首页</a></div>
<div class="header">
<h1>Markdown表格编辑器</h1>
<div class="lang-switch"><a class="active" href="/markdown-table-editor/">中文</a><a href="/en/markdown-table-editor/">English</a></div>
</div>
<div class="tool-section">
<h2>表格编辑</h2>
<div class="toolbar">
<button class="btn btn-primary" id="addRowBtn">+ 行</button>
<button class="btn btn-primary" id="addColBtn">+ 列</button>
<button class="btn btn-danger" id="delRowBtn">- 行</button>
<button class="btn btn-danger" id="delColBtn">- 列</button>
<button class="btn btn-secondary" id="alignLeftBtn">左对齐</button>
<button class="btn btn-secondary" id="alignCenterBtn">居中</button>
<button class="btn btn-secondary" id="alignRightBtn">右对齐</button>
<button class="btn btn-secondary" id="copyMdBtn">复制Markdown</button>
</div>
<div class="table-wrapper"><table class="md-table" id="mdTable"><thead><tr id="headerRow"><th>列1</th><th>列2</th><th>列3</th></tr></thead><tbody id="tableBody"><tr><td><input value=""></td><td><input value=""></td><td><input value=""></td></tr><tr><td><input value=""></td><td><input value=""></td><td><input value=""></td></tr></tbody></table></div>
</div>
<div class="tool-section">
<h2>Markdown代码</h2>
<div class="code-block" id="codeBlock"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
let alignments=['left','left','left'];
function getHeaders(){return [...document.querySelectorAll('#headerRow th')].map(h=>h.textContent);}
function getData(){return [...document.querySelectorAll('#tableBody tr')].map(tr=>[...tr.querySelectorAll('td input')].map(inp=>inp.value));}
function generateMd(){
  const headers=getHeaders(),data=getData();
  let md='| '+headers.join(' | ')+' |\n';
  md+='| '+alignments.map(a=>a==='center'?':---:':a==='right'?'---:':':---').join(' | ')+' |\\n';
  data.forEach(row=>{md+='| '+row.join(' | ')+' |\\n';});
  document.getElementById('codeBlock').textContent=md;
}
function renderTable(){
  const headers=getHeaders(),data=getData();
  const ths=document.querySelectorAll('#headerRow th');
  ths.forEach((th,i)=>{th.textContent=headers[i];th.style.textAlign=alignments[i];});
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML=data.map(row=>'<tr>'+row.map((cell,i)=>'<td style="text-align:'+alignments[i]+'"><input value="'+cell.replace(/"/g,'&quot;')+'"></td>').join('')+'</tr>').join('');
  document.querySelectorAll('#tableBody input').forEach(inp=>inp.addEventListener('input',generateMd));
}
document.getElementById('addRowBtn').addEventListener('click',()=>{
  const cols=alignments.length;
  const tr=document.createElement('tr');
  tr.innerHTML=Array(cols).fill('<td><input value=""></td>').join('');
  document.getElementById('tableBody').appendChild(tr);
  tr.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',generateMd));
  generateMd();
});
document.getElementById('addColBtn').addEventListener('click',()=>{
  alignments.push('left');
  const th=document.createElement('th');th.textContent='列'+(alignments.length);th.style.cursor='pointer';
  th.addEventListener('click',function(){const i=[...this.parentElement.children].indexOf(this);alignments[i]=alignments[i]==='left'?'center':alignments[i]==='center'?'right':'left';renderTable();generateMd();});
  document.getElementById('headerRow').appendChild(th);
  document.querySelectorAll('#tableBody tr').forEach(tr=>{const td=document.createElement('td');td.innerHTML='<input value="">';tr.appendChild(td);td.querySelector('input').addEventListener('input',generateMd);});
  renderTable();generateMd();
});
document.getElementById('delRowBtn').addEventListener('click',()=>{
  const rows=document.querySelectorAll('#tableBody tr');
  if(rows.length>1){rows[rows.length-1].remove();generateMd();}
});
document.getElementById('delColBtn').addEventListener('click',()=>{
  if(alignments.length>1){alignments.pop();document.querySelectorAll('#headerRow th').forEach((th,i)=>{if(i===alignments.length)th.remove();});document.querySelectorAll('#tableBody tr').forEach(tr=>{const tds=tr.querySelectorAll('td');if(tds.length>alignments.length)tds[tds.length-1].remove();});renderTable();generateMd();}
});
document.getElementById('alignLeftBtn').addEventListener('click',()=>{alignments=alignments.map(()=>'left');renderTable();generateMd();});
document.getElementById('alignCenterBtn').addEventListener('click',()=>{alignments=alignments.map(()=>'center');renderTable();generateMd();});
document.getElementById('alignRightBtn').addEventListener('click',()=>{alignments=alignments.map(()=>'right');renderTable();generateMd();});
document.getElementById('copyMdBtn').addEventListener('click',()=>{navigator.clipboard.writeText(document.getElementById('codeBlock').textContent).then(()=>showToast('已复制到剪贴板'));});
document.querySelectorAll('#headerRow th').forEach((th,i)=>{th.addEventListener('click',function(){alignments[i]=alignments[i]==='left'?'center':alignments[i]==='center'?'right':'left';renderTable();generateMd();});});
document.querySelectorAll('#tableBody input').forEach(inp=>inp.addEventListener('input',generateMd));
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
generateMd();
</script>
</body>
