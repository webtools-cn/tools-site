<body>
<div class="container">
<header>
  <a href="/" class="home">← Free ToolBase</a>
  <div class="lang-switch">
    <a href="/octal-calculator/" class="active">中文</a>
    <a href="/en/octal-calculator/">English</a>
  </div>
</header>
<main>
  <h1>八进制计算器</h1>
  <p>输入两个八进制数（0-7），选择运算符，实时计算八进制结果。同时显示十进制对照值。</p>
  <div class="calc-grid">
    <div class="input-group">
      <label>八进制数 ①</label>
      <input type="text" id="num1" placeholder="如 77" maxlength="20" inputmode="numeric">
    </div>
    <div class="op-buttons">
      <button id="op-add" class="active" title="加法">+</button>
      <button id="op-sub" title="减法">−</button>
      <button id="op-mul" title="乘法">×</button>
      <button id="op-div" title="除法">÷</button>
    </div>
    <div class="input-group">
      <label>八进制数 ②</label>
      <input type="text" id="num2" placeholder="如 32" maxlength="20" inputmode="numeric">
    </div>
  </div>
  <div class="result-area">
    <div class="label">八进制结果</div>
    <div class="octal-result" id="result">—</div>
    <div class="decimal-hint" id="decimalHint"></div>
  </div>
  <div style="text-align:center">
    <button class="copy-btn" id="copyBtn">📋 复制八进制结果</button>
  </div>
  <div class="error-msg" id="error"></div>
</main>
<footer>
  <p>© 2026 Free ToolBase · 纯前端运行，数据不上传服务器 · <a href="/">返回首页</a></p>
</footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var num1 = document.getElementById('num1');
  var num2 = document.getElementById('num2');
  var op = '+';
  var resultEl = document.getElementById('result');
  var decimalHint = document.getElementById('decimalHint');
  var errorEl = document.getElementById('error');
  var copyBtn = document.getElementById('copyBtn');
  var toast = document.getElementById('toast');

  function filterOctal(s){
    s = s.replace(/[^0-7\-]/g, '');
    // allow only one leading minus
    if(s.indexOf('-') > 0) s = s.replace(/\-/g, '').replace(/^/, '-');
    return s;
  }

  num1.addEventListener('input', function(){
    var pos = this.selectionStart;
    this.value = filterOctal(this.value);
    this.setSelectionRange(pos, pos);
    calc();
  });
  num2.addEventListener('input', function(){
    var pos = this.selectionStart;
    this.value = filterOctal(this.value);
    this.setSelectionRange(pos, pos);
    calc();
  });

  function setOp(o){
    op = o;
    document.querySelectorAll('.op-buttons button').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById('op-'+o).classList.add('active');
    calc();
  }

  document.getElementById('op-add').addEventListener('click', function(){ setOp('add'); });
  document.getElementById('op-sub').addEventListener('click', function(){ setOp('sub'); });
  document.getElementById('op-mul').addEventListener('click', function(){ setOp('mul'); });
  document.getElementById('op-div').addEventListener('click', function(){ setOp('div'); });

  function toDec(octStr){
    if(!octStr || octStr==='-' || octStr==='-0') return NaN;
    return parseInt(octStr, 8);
  }

  function toOct(dec){
    if(isNaN(dec) || !isFinite(dec)) return null;
    if(dec < 0) return '-' + dec.toString(8).replace('-','');
    return dec.toString(8);
  }

  function calc(){
    errorEl.textContent = '';
    decimalHint.textContent = '';
    resultEl.textContent = '—';
    var a = toDec(num1.value.trim());
    var b = toDec(num2.value.trim());
    if(isNaN(a) || isNaN(b)){
      if(num1.value.trim() && num2.value.trim()) errorEl.textContent = '请输入有效的八进制数（仅0-7）';
      return;
    }
    var r;
    switch(op){
      case 'add': r = a + b; break;
      case 'sub': r = a - b; break;
      case 'mul': r = a * b; break;
      case 'div':
        if(b === 0){ errorEl.textContent = '除数不能为零'; return; }
        r = Math.floor(a / b);
        var remainder = a % b;
        break;
    }
    var octR = toOct(r);
    if(octR === null){ errorEl.textContent = '计算结果超出范围'; return; }
    resultEl.textContent = octR;
    decimalHint.textContent = '十进制: ' + r;
    if(op === 'div' && typeof remainder !== 'undefined'){
      if(remainder !== 0){
        var remOct = toOct(Math.abs(remainder));
        decimalHint.textContent += ' (余数八进制: ' + remOct + ', 十进制: ' + remainder + ')';
      }
    }
  }

  copyBtn.addEventListener('click', function(){
    var txt = resultEl.textContent;
    if(txt === '—') return;
    navigator.clipboard.writeText(txt).then(function(){
      showToast('已复制: ' + txt);
    });
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  // init: set op-add active
  document.getElementById('op-add').classList.add('active');
})();
</script>
</body>
</html>
