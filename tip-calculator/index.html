    .history { margin-top: 20px; }

      .country-preset { padding: 6px 2px; font-size: 0.7rem; }
      .tip-pct-btn { font-size: 0.8rem; padding: 8px 4px; }
      .result-value { font-size: 1.1rem; }
      .result-value.highlight { font-size: 1.3rem; }

<body>
  <div class="container">
    <header>

        <button class="country-preset" data-tip="10" data-country="de"><span class="flag">🇩🇪</span>德国<span class="rate">5-10%</span></button>
        <button class="country-preset" data-tip="0" data-country="jp"><span class="flag">🇯🇵</span>日本<span class="rate">不需要</span></button>
        <button class="country-preset" data-tip="0" data-country="cn"><span class="flag">🇨🇳</span>中国<span class="rate">不需要</span></button>

    <!-- 账单输入 -->
    <div class="card">

        <div class="input-group">
          <label for="customTipPct">自定义小费 %</label>
          <input type="number" id="customTipPct" placeholder="15" step="0.5" min="0" max="100" value="15" inputmode="decimal">

    <!-- 服务满意度滑块 -->
    <div class="card">

      <div class="satisfaction-slider">
        <div class="slider-labels">
          <span id="lblPoor">😞 差</span>
          <span id="lblAvg">😐 一般</span>

          <span id="lblGreat">😊 很好</span>
          <span id="lblExcellent">🤩 极好</span>

        <input type="range" id="satisfactionSlider" min="1" max="5" value="3" step="1">

    <!-- 小费百分比快速选择 -->
    <div class="card">
      <div class="card-title">🔢 小费百分比</div>
      <div class="tip-pct-buttons" id="tipPctButtons">
        <button class="tip-pct-btn" data-pct="10">10%</button>
        <button class="tip-pct-btn" data-pct="12">12%</button>
        <button class="tip-pct-btn active" data-pct="15">15%</button>
        <button class="tip-pct-btn" data-pct="18">18%</button>
        <button class="tip-pct-btn" data-pct="20">20%</button>
        <button class="tip-pct-btn" data-pct="25">25%</button>

      <div class="round-options" id="roundOptions">
        <button class="round-btn" data-round="none">不取整</button>
        <button class="round-btn active" data-round="total">总额取整</button>
        <button class="round-btn" data-round="tip">小费取整</button>
      </div>
    </div>

    <!-- 计算结果 -->
    <div class="card" id="resultsCard">
      <div class="card-title">📊 计算结果</div>
      <div class="results" id="results">
        <div class="result-row">
          <span class="result-label">小费金额</span>
          <div style="text-align:right;">
            <div class="result-value accent" id="tipAmount">$0.00</div>
            <div class="result-sub" id="tipPercentLabel">(15%)</div>
          </div>
        </div>
        <div class="result-row">
          <span class="result-label">账单总额</span>
          <div class="result-value highlight" id="totalAmount">$0.00</div>
        </div>
        <div class="result-row" id="splitRow" style="display:none;">
          <span class="result-label">👤 每人应付</span>
          <div style="text-align:right;">
            <div class="result-value highlight" id="perPersonAmount">$0.00</div>

    <!-- 历史记录 -->

  <div class="toast" id="toast"></div>

  <script>
    // ─── Toast ───
    function showToast(msg, duration) {
      duration = duration || 2000;
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(function(){ t.classList.remove('show'); }, duration);
    }

    // ─── DOM Refs ───
    var $ = function(id){ return document.getElementById(id); };
    var billInput = $('billAmount');
    var splitInput = $('splitCount');
    var customTipInput = $('customTipPct');
    var satisfactionSlider = $('satisfactionSlider');
    var resultsDiv = $('results');
    var splitRow = $('splitRow');

    // ─── State ───
    var currentTipPct = 15;
    var currentRound = 'total';
    var currentCountry = 'us';

    // ─── Satisfaction → Tip % mapping ───
    var satisfactionMap = { 1: 10, 2: 12, 3: 15, 4: 18, 5: 22 };

    // ─── Country Presets ───
    var countryPresets = $('countryPresets');
    countryPresets.addEventListener('click', function(e) {
      var btn = e.target.closest('.country-preset');
      if (!btn) return;
      var tip = parseFloat(btn.getAttribute('data-tip'));
      currentCountry = btn.getAttribute('data-country');
      // Update active
      var all = countryPresets.querySelectorAll('.country-preset');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      btn.classList.add('active');
      setTipPercent(tip);
    });

    // ─── Tip % buttons ───
    var tipPctBtns = $('tipPctButtons');
    tipPctBtns.addEventListener('click', function(e) {
      var btn = e.target.closest('.tip-pct-btn');
      if (!btn) return;
      var pct = parseFloat(btn.getAttribute('data-pct'));
      setTipPercent(pct);
    });

    function setTipPercent(pct) {
      currentTipPct = pct;
      customTipInput.value = pct;
      // Update active button
      var all = tipPctBtns.querySelectorAll('.tip-pct-btn');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      // Try to match preset
      var matched = tipPctBtns.querySelector('[data-pct="' + pct + '"]');
      if (matched) matched.classList.add('active');
      // Update satisfaction
      var closestSat = 3;
      var minDiff = Infinity;
      for (var k in satisfactionMap) {
        var diff = Math.abs(satisfactionMap[k] - pct);
        if (diff < minDiff) { minDiff = diff; closestSat = parseInt(k); }
      }
      satisfactionSlider.value = closestSat;
      updateSatLabels();
      calculate();
    }

    // ─── Satisfaction Slider ───
    satisfactionSlider.addEventListener('input', function() {
      updateSatLabels();
      var sat = parseInt(this.value);
      var pct = satisfactionMap[sat];
      setTipPercent(pct);
    });

    function updateSatLabels() {
      var sat = parseInt(satisfactionSlider.value);
      var labels = ['lblPoor', 'lblAvg', 'lblGood', 'lblGreat', 'lblExcellent'];
      for (var i = 0; i < labels.length; i++) {
        var el = $(labels[i]);
        if (i + 1 === sat) el.classList.add('active-label');
        else el.classList.remove('active-label');
      }
    }

    // ─── Round options ───
    var roundOpts = $('roundOptions');
    roundOpts.addEventListener('click', function(e) {
      var btn = e.target.closest('.round-btn');
      if (!btn) return;
      currentRound = btn.getAttribute('data-round');
      var all = roundOpts.querySelectorAll('.round-btn');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      btn.classList.add('active');
      calculate();
    });

    // ─── Custom Tip % input ───
    customTipInput.addEventListener('input', function() {
      var pct = parseFloat(this.value);
      if (isNaN(pct) || pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      currentTipPct = pct;
      // Clear preset active
      var all = tipPctBtns.querySelectorAll('.tip-pct-btn');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      // Match if exact
      var matched = tipPctBtns.querySelector('[data-pct="' + pct + '"]');
      if (matched) matched.classList.add('active');
      calculate();
    });

    // ─── Input changes → recalculate ───
    billInput.addEventListener('input', calculate);
    splitInput.addEventListener('input', calculate);

    // ─── Calculate ───
    function calculate() {
      var bill = parseFloat(billInput.value) || 0;
      var split = parseInt(splitInput.value) || 1;
      if (split < 1) split = 1;
      var tipPct = currentTipPct;
      var tipAmount = bill * (tipPct / 100);
      var total = bill + tipAmount;
      var perPerson = total / split;

      // Rounding
      if (currentRound === 'total') {
        total = Math.ceil(total);
        tipAmount = total - bill;
        perPerson = total / split;
      } else if (currentRound === 'tip') {
        tipAmount = Math.ceil(tipAmount);
        total = bill + tipAmount;
        perPerson = total / split;
      }

      function fmt(v) { return '$' + v.toFixed(2); }

      $('tipAmount').textContent = fmt(tipAmount);
      $('tipPercentLabel').textContent = '(' + tipPct + '%)';
      $('totalAmount').textContent = fmt(total);
      $('perPersonAmount').textContent = fmt(perPerson);

      var ppLabel = split > 1 ? (split + '人分摊') : '';
      $('perPersonLabel').textContent = ppLabel;

      if (split > 1) {
        splitRow.style.display = 'flex';
      } else {
        splitRow.style.display = 'none';
      }

      // Store last result for copy and history
      resultsDiv._lastData = {
        bill: bill,
        tipPct: tipPct,
        tipAmount: tipAmount,
        total: total,
        split: split,
        perPerson: perPerson,
        round: currentRound,
        country: currentCountry,
        time: new Date().toISOString()
      };
    }

    // ─── Copy Results ───
    $('copyResults').addEventListener('click', function() {
      var d = resultsDiv._lastData;
      if (!d || d.bill === 0) { showToast('请先输入账单金额'); return; }
      var text = '账单: $' + d.bill.toFixed(2) + '\n';
      text += '小费(' + d.tipPct + '%): $' + d.tipAmount.toFixed(2) + '\n';
      text += '总额: $' + d.total.toFixed(2);
      if (d.split > 1) text += '\n每人(' + d.split + '人): $' + d.perPerson.toFixed(2);

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('结果已复制到剪贴板');
          addHistory(d);
        });
      } else {
        // Fallback
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('结果已复制到剪贴板');
        addHistory(d);
      }
    });

    // ─── History ───
    var STORAGE_KEY = 'tip-calc-history';
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch(e) { return []; }
    }
    function saveHistory(h) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
    }
    function addHistory(d) {
      var h = getHistory();
      h.unshift(d);
      if (h.length > 20) h = h.slice(0, 20);
      saveHistory(h);
      renderHistory();
    }
    function renderHistory() {
      var h = getHistory();
      var container = $('historyContainer');
      var list = $('historyList');
      if (h.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';
      var html = '';
      for (var i = 0; i < h.length; i++) {
        var item = h[i];
        var countryFlag = { us: '🇺🇸', ca: '🇨🇦', uk: '🇬🇧', fr: '🇫🇷', de: '🇩🇪', jp: '🇯🇵', cn: '🇨🇳' };
        var flag = countryFlag[item.country] || '';
        html += '<div class="history-item">';
        html += '<div><strong>' + flag + ' $' + item.total.toFixed(2) + '</strong>';
        html += '<div class="hi-detail">账单 $' + item.bill.toFixed(2) + ' · 小费 ' + item.tipPct + '%';
        if (item.split > 1) html += ' · ' + item.split + '人';
        html += '</div></div>';
        html += '<span style="color:var(--text-secondary);">$' + item.tipAmount.toFixed(2) + '</span>';
        html += '</div>';
      }
      list.innerHTML = html;
    }

    $('clearHistory').addEventListener('click', function() {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
      showToast('历史已清除');
    });

    // ─── Init ───
    document.addEventListener('DOMContentLoaded', function() {
      calculate();
      renderHistory();
      updateSatLabels();
    });
  </script>
</body>
</html>
