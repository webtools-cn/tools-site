  <script>
    let heads = 0, tails = 0;
    const coin = document.getElementById('coin');
    const coinContainer = document.getElementById('coinContainer');
    const resultText = document.getElementById('resultText');
    const headsCount = document.getElementById('headsCount');
    const tailsCount = document.getElementById('tailsCount');
    const totalCount = document.getElementById('totalCount');
    const headsPercent = document.getElementById('headsPercent');
    const batchInput = document.getElementById('batchCount');
    const batchBtn = document.getElementById('batchBtn');

    function updateStats() {
      const total = heads + tails;
      headsCount.textContent = heads;
      tailsCount.textContent = tails;
      totalCount.textContent = total;
      headsPercent.textContent = total > 0 ? Math.round(heads / total * 100) + '%' : '50%';
    }

    function flip() {
      coin.classList.remove('flipping');
      void coin.offsetWidth;
      coin.classList.add('flipping');
      const isHeads = Math.random() < 0.5;
      if (isHeads) { heads++; resultText.innerHTML = '<span class="heads">🪙 正面！</span>'; }
      else { tails++; resultText.innerHTML = '<span class="tails">🪙 反面！</span>'; }
      updateStats();
    }

    function batchFlip(n) {
      let h = 0;
      for (let i = 0; i < n; i++) { if (Math.random() < 0.5) h++; }
      heads += h;
      tails += n - h;
      updateStats();
    }

    coinContainer.addEventListener('click', flip);
    batchBtn.addEventListener('click', () => {
      const n = parseInt(batchInput.value);
      if (isNaN(n) || n < 1 || n > 10000) { document.getElementById('toast').textContent = '请输入1-10000之间的数字'; document.getElementById('toast').classList.add('show'); setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000); return; }
      batchFlip(n);
    });
  </script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
