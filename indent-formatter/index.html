    <textarea id="input-code" rows="10" placeholder="在此粘贴代码..." style="width:100%;font-family:monospace;font-size:.85rem;"></textarea>

<script>
(function() {
  'use strict';
  const input = document.getElementById('input-code');
  const output = document.getElementById('output-code');
  const indentType = document.getElementById('indent-type');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function getIndentStr(type, count) {
    if (type === 'tab') return '\t'.repeat(count);
    return ' '.repeat(parseInt(type) * count);
  }

  function detectIndentUnit(code) {
    const lines = code.split('\n').filter(l => l.trim().length > 0);
    for (const line of lines) {
      const m = line.match(/^(\t|\s+)/);
      if (m) {
        if (m[1][0] === '\t') return { type: 'tab', unit: 1 };
        return { type: 'space', unit: m[1].length };
      }
    }
    return { type: 'space', unit: 4 };
  }

  document.getElementById('format-btn').addEventListener('click', function() {
    const code = input.value;
    if (!code.trim()) { showToast('请先粘贴代码'); return; }

    const targetUnit = indentType.value;
    const src = detectIndentUnit(code);
    const lines = code.split('\n');

    const result = lines.map(line => {
      // 计算当前缩进层级
      const m = line.match(/^(\t|\s+)/);
      if (!m) return line.trimStart();
      const indent = m[1];
      const rest = line.slice(m[0].length);
      
      // 计算缩进级数
      let level = 0;
      if (src.type === 'tab') {
        level = indent.length;
      } else {
        level = Math.round(indent.length / src.unit);
      }

      // 按目标格式输出
      if (targetUnit === 'tab') {
        return '\t'.repeat(level) + rest;
      } else {
        return ' '.repeat(parseInt(targetUnit) * level) + rest;
      }
    }).join('\n');

    output.value = result;
    showToast('格式化完成');
  });

  document.getElementById('copy-btn').addEventListener('click', function() {
    const txt = output.value;
    if (!txt.trim()) { showToast('没有可复制的内容'); return; }
    navigator.clipboard.writeText(txt).then(() => showToast('已复制到剪贴板'));
  });
}());
</script>
