<div class="container">
<div class="header"><h1>🎯 随机抽奖器</h1><div class="lang-switch"><a href="index.html" class="active">中文</a><a href="../en/random-winner/">EN</a></div></div>

<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function getNames(){
  const raw=document.getElementById('nameList').value.trim();
  if(!raw)return[];
  return raw.split('\n').map(n=>n.trim()).filter(Boolean);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function drawWinners(names,count){
  const shuffled=shuffle(names);
  return shuffled.slice(0,Math.min(count,shuffled.length));
}

async function animateDraw(names,count){
  const resultBox=document.getElementById('resultBox');
  // Animate scrolling names
  const animationMs=2000;
  const startTime=Date.now();
  const shuffled=shuffle(names);
  let idx=0;
  
  return new Promise(resolve=>{
    const interval=setInterval(()=>{
      if(Date.now()-startTime>=animationMs){
        clearInterval(interval);
        resolve();
        return;
      }
      resultBox.innerHTML=`<div class="winner-name" style="animation:spin .1s linear infinite">🎰</div><div style="font-size:1.5rem;color:#22d3ee">${shuffled[idx%shuffled.length]}</div>`;
      idx++;
    },80);
  });
}

async function doDraw(){
  const names=getNames();
  if(names.length===0){showToast('请先输入参与者名单');return;}
  const count=parseInt(document.getElementById('pickCount').value)||1;
  if(count<1||count>names.length){showToast(`抽取人数需在1-${names.length}之间`);return;}
  
  await animateDraw(names,count);
  const winners=drawWinners(names,count);
  const resultBox=document.getElementById('resultBox');
  if(count===1){
    resultBox.innerHTML=`<div class="winner-name">🏆 ${winners[0]}</div><div style="color:#94a3b8;margin-top:8px">恭喜获得！</div>`;
  }else{
    resultBox.innerHTML=`<div style="color:#94a3b8;margin-bottom:12px">🏆 获奖名单</div><div class="winner-list">${winners.map((w,i)=>`<span class="winner-tag">${i+1}. ${w}</span>`).join('')}</div>`;
  }
}

document.getElementById('btnDraw').addEventListener('click',doDraw);

document.getElementById('btnLoadSample').addEventListener('click',()=>{
  document.getElementById('nameList').value='张三\n李四\n王五\n赵六\n陈七\n周八\n吴九\n郑十\n冯十一\n陈十二\n褚十三\n卫十四\n蒋十五\n沈十六\n韩十七\n杨十八';
  document.getElementById('pickCount').value='3';
  document.getElementById('resultBox').innerHTML='<div style="color:#64748b;padding:20px">✅ 已加载示例名单，点击"开始抽取"</div>';
});

document.getElementById('btnClear').addEventListener('click',()=>{
  document.getElementById('nameList').value='';
  document.getElementById('resultBox').innerHTML='<div style="color:#64748b;padding:20px">👆 输入名单后点击"开始抽取"</div>';
});
</script>
