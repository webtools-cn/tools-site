<html lang="zh-CN">
<head>

  <meta property="og:title" content="季度计算器 - Free ToolBase">

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"季度计算器","description":"查看任意日期所属季度及季度起止日期","applicationCategory":"UtilityApplication","operatingSystem":"Any","url":"https://free-toolbase.com/quarter-calculator/"}</script>
  <style>:root{--primary:#4F46E5;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--q1:#6366f1;--q2:#22c55e;--q3:#f59e0b;--q4:#ef4444}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px}header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}main{max-width:640px;margin:0 auto;padding:32px 16px 64px}h1{font-size:28px;margin-bottom:8px}.subtitle{color:var(--text2);margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:var(--text)}.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;transition:border-color .2s}.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{opacity:.9}.btn-block{width:100%;justify-content:center}.quarter-highlight{text-align:center;font-size:48px;font-weight:800;margin:12px 0}.quarter-highlight.q1{color:var(--q1)}.quarter-highlight.q2{color:var(--q2)}.quarter-highlight.q3{color:var(--q3)}.quarter-highlight.q4{color:var(--q4)}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.info-item{background:var(--bg);padding:12px;border-radius:8px;text-align:center}.info-label{font-size:12px;color:var(--text2);margin-bottom:4px}.info-value{font-size:18px;font-weight:600}.year-quarters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.q-box{padding:10px;border-radius:8px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid var(--border)}.q-box:hover{border-color:var(--primary)}.q-box.active{border-color:var(--primary);font-weight:700}.q-box.q1{border-left:4px solid var(--q1)}.q-box.q2{border-left:4px solid var(--q2)}.q-box.q3{border-left:4px solid var(--q3)}.q-box.q4{border-left:4px solid var(--q4)}.q-box .q-num{font-size:20px;font-weight:700}.q-box .q-range{font-size:11px;color:var(--text2)}footer{text-align:center;padding:24px;color:var(--text2);font-size:13px;border-top:1px solid var(--border)}footer a{color:var(--primary);text-decoration:none}@media(max-width:375px){main{padding:24px 12px 48px}h1{font-size:22px}.quarter-highlight{font-size:36px}.info-grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <header><a href="/">← Free ToolBase</a></header>
  <main>
    <h1>📊 季度计算器</h1>
    <p class="subtitle">查看任意日期属于第几季度、季度起止日期和进度。</p>
    <div class="card">
      <div class="form-group">
        <label>选择日期</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>财年起始月份（默认1月）</label>
        <select id="fiscalStart">
          <option value="1">1月（标准季度）</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月（常见财年）</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="calcBtn">立即计算</button>
      <div id="resultArea" style="display:none;margin-top:16px">
        <div class="quarter-highlight" id="quarterDisplay"></div>
        <div class="info-grid">
          <div class="info-item"><div class="info-label">季度起始</div><div class="info-value" id="qStart"></div></div>
          <div class="info-item"><div class="info-label">季度结束</div><div class="info-value" id="qEnd"></div></div>
          <div class="info-item"><div class="info-label">已过天数</div><div class="info-value" id="qElapsed"></div></div>
          <div class="info-item"><div class="info-label">剩余天数</div><div class="info-value" id="qRemaining"></div></div>
        </div>
        <div style="margin-top:12px;font-size:14px;color:var(--text2);text-align:center" id="progressLabel"></div>
        <div style="height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden"><div id="progressFill" style="height:100%;background:var(--primary);border-radius:3px;transition:width .5s;width:0%"></div></div>
        <div class="year-quarters" style="margin-top:16px">
          <div class="q-box q1" data-q="0"><div class="q-num">Q1</div><div class="q-range"></div></div>
          <div class="q-box q2" data-q="1"><div class="q-num">Q2</div><div class="q-range"></div></div>
          <div class="q-box q3" data-q="2"><div class="q-num">Q3</div><div class="q-range"></div></div>
          <div class="q-box q4" data-q="3"><div class="q-num">Q4</div><div class="q-range"></div></div>
        </div>
      </div>
    </div>
  </main>
  <footer>© 2025 <a href="/">Free ToolBase</a> · 所有工具免费使用</footer>
  <div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>
  <script>
    var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function getQuarter(date, fiscalStart) {
      var m = date.getMonth() + 1;
      var offset = m - fiscalStart;
      if (offset < 0) offset += 12;
      return Math.floor(offset / 3);
    }

    function getQuarterDates(year, quarter, fiscalStart) {
      var startMonth = fiscalStart + quarter * 3;
      if (startMonth > 12) { year++; startMonth -= 12; }
      var endMonth = startMonth + 2;
      var endYear = year;
      if (endMonth > 12) { endYear++; endMonth -= 12; }
      var start = new Date(year, startMonth - 1, 1);
      var end = new Date(endYear, endMonth, 0);
      return { start: start, end: end };
    }

    function formatDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function calc() {
      var dateVal = document.getElementById('dateInput').value;
      if (!dateVal) { showToast('请选择日期'); return; }
      var fiscalStart = parseInt(document.getElementById('fiscalStart').value);
      var d = new Date(dateVal + 'T00:00:00');
      var q = getQuarter(d, fiscalStart);
      var qd = getQuarterDates(d.getFullYear(), q, fiscalStart);
      var elapsed = Math.floor((d - qd.start) / (1000*60*60*24)) + 1;
      var total = Math.floor((qd.end - qd.start) / (1000*60*60*24)) + 1;
      var remaining = total - elapsed;
      var pct = Math.round((elapsed / total) * 100);

      var qColors = ['q1','q2','q3','q4'];
      var qLabels = ['第一季度','第二季度','第三季度','第四季度'];
      var displayEl = document.getElementById('quarterDisplay');
      displayEl.textContent = qLabels[q];
      displayEl.className = 'quarter-highlight ' + qColors[q];

      document.getElementById('qStart').textContent = formatDate(qd.start);
      document.getElementById('qEnd').textContent = formatDate(qd.end);
      document.getElementById('qElapsed').textContent = elapsed + ' 天';
      document.getElementById('qRemaining').textContent = remaining + ' 天';
      document.getElementById('progressLabel').textContent = '季度进度 ' + pct + '%（' + elapsed + '/' + total + '）';
      document.getElementById('progressFill').style.width = pct + '%';

      // 更新四个季度范围
      var boxes = document.querySelectorAll('.q-box');
      boxes.forEach(function(box) {
        var qi = parseInt(box.dataset.q);
        var qdi = getQuarterDates(d.getFullYear(), qi, fiscalStart);
        box.querySelector('.q-range').textContent = formatDate(qdi.start) + ' ~ ' + formatDate(qdi.end);
        box.classList.remove('active');
      });
      boxes[q].classList.add('active');

      document.getElementById('resultArea').style.display = 'block';
    }

    document.getElementById('calcBtn').addEventListener('click', calc);
    document.querySelectorAll('.q-box').forEach(function(box) {
      box.addEventListener('click', function() {
        var qi = parseInt(this.dataset.q);
        var fiscalStart = parseInt(document.getElementById('fiscalStart').value);
        var d = new Date(document.getElementById('dateInput').value + 'T00:00:00');
        var qd = getQuarterDates(d.getFullYear(), qi, fiscalStart);
        document.getElementById('dateInput').value = formatDate(qd.start);
        calc();
      });
    });

    var today = new Date();
    document.getElementById('dateInput').value = today.toISOString().split('T')[0];
  </script>
</body>
</html>
