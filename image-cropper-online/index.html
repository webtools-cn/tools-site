<script>
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const cropContainer = document.getElementById('cropContainer');
const cropCanvas = document.getElementById('cropCanvas');
const ratioControls = document.getElementById('ratioControls');
const actionBtns = document.getElementById('actionBtns');
const aspectRatio = document.getElementById('aspectRatio');
const cropInfo = document.getElementById('cropInfo');
const toast = document.getElementById('toast');
const ctx = cropCanvas.getContext('2d');

let img = null;
let cropX = 0, cropY = 0, cropW = 200, cropH = 200;
let dragging = false, resizing = false;
let dragStartX = 0, dragStartY = 0;
let origCropX = 0, origCropY = 0, origCropW = 0, origCropH = 0;
let resizeCorner = '';
let displayScale = 1;

function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); });
uploadArea.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) loadImage(fileInput.files[0]); });

function loadImage(file) {
  if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    img = new Image();
    img.onload = initCrop;
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initCrop() {
  const maxW = Math.min(800, window.innerWidth - 64);
  displayScale = Math.min(1, maxW / img.width);
  cropCanvas.width = img.width;
  cropCanvas.height = img.height;
  cropCanvas.style.width = (img.width * displayScale) + 'px';
  cropCanvas.style.height = (img.height * displayScale) + 'px';
  cropW = Math.min(300, img.width * 0.6);
  cropH = Math.min(300, img.height * 0.6);
  cropX = (img.width - cropW) / 2;
  cropY = (img.height - cropH) / 2;
  uploadArea.style.display = 'none';
  cropContainer.style.display = 'block';
  ratioControls.style.display = 'flex';
  actionBtns.style.display = 'flex';
  draw();
}

function draw() {
  ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
  ctx.drawImage(img, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
  ctx.clearRect(cropX, cropY, cropW, cropH);
  ctx.drawImage(img, cropX, cropY, cropW, cropH, cropX, cropY, cropW, cropH);
  ctx.strokeStyle = '#06b6d4';
  ctx.lineWidth = 2;
  ctx.strokeRect(cropX, cropY, cropW, cropH);
  // resize handles
  ctx.fillStyle = '#06b6d4';
  [[cropX+cropW, cropY+cropH], [cropX+cropW, cropY], [cropX, cropY+cropH], [cropX, cropY]].forEach(([x, y]) => {
    ctx.fillRect(x - 6, y - 6, 12, 12);
  });
  cropInfo.textContent = `选区: ${Math.round(cropW)}×${Math.round(cropH)}px`;
}

function getMousePos(e) {
  const rect = cropCanvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / displayScale, y: (e.clientY - rect.top) / displayScale };
}

function getCorner(mx, my) {
  const threshold = 10 / displayScale;
  if (Math.abs(mx - (cropX + cropW)) < threshold && Math.abs(my - (cropY + cropH)) < threshold) return 'se';
  if (Math.abs(mx - (cropX + cropW)) < threshold && Math.abs(my - cropY) < threshold) return 'ne';
  if (Math.abs(mx - cropX) < threshold && Math.abs(my - (cropY + cropH)) < threshold) return 'sw';
  if (Math.abs(mx - cropX) < threshold && Math.abs(my - cropY) < threshold) return 'nw';
  return '';
}

cropCanvas.addEventListener('mousedown', e => {
  const { x, y } = getMousePos(e);
  resizeCorner = getCorner(x, y);
  if (resizeCorner) {
    resizing = true;
  } else if (x >= cropX && x <= cropX + cropW && y >= cropY && y <= cropY + cropH) {
    dragging = true;
  } else return;
  dragStartX = x; dragStartY = y;
  origCropX = cropX; origCropY = cropY; origCropW = cropW; origCropH = cropH;
});

cropCanvas.addEventListener('mousemove', e => {
  const { x, y } = getMousePos(e);
  const corner = getCorner(x, y);
  cropCanvas.style.cursor = corner ? 'nwse-resize' : (x >= cropX && x <= cropX+cropW && y >= cropY && y <= cropY+cropH ? 'move' : 'default');
  if (dragging) {
    let dx = x - dragStartX, dy = y - dragStartY;
    cropX = Math.max(0, Math.min(img.width - cropW, origCropX + dx));
    cropY = Math.max(0, Math.min(img.height - cropH, origCropY + dy));
  } else if (resizing) {
    let dx = x - dragStartX, dy = y - dragStartY;
    const ratio = getAspectRatio();
    if (resizeCorner === 'se') { cropW = Math.max(20, origCropW + dx); if (ratio) cropH = cropW / ratio; else cropH = Math.max(20, origCropH + dy); }
    else if (resizeCorner === 'ne') { cropW = Math.max(20, origCropW + dx); cropY = Math.min(origCropY + dy, origCropY + origCropH - 20); if (ratio) cropH = cropW / ratio; else cropH = Math.max(20, origCropH - dy); }
    else if (resizeCorner === 'sw') { cropX = Math.min(origCropX + dx, origCropX + origCropW - 20); if (ratio) { cropW = Math.max(20, origCropW - dx); cropH = cropW / ratio; } else { cropW = Math.max(20, origCropW - dx); cropH = Math.max(20, origCropH + dy); }}
    else if (resizeCorner === 'nw') { cropX = Math.min(origCropX + dx, origCropX + origCropW - 20); cropY = Math.min(origCropY + dy, origCropY + origCropH - 20); if (ratio) { cropW = Math.max(20, origCropW - dx); cropH = cropW / ratio; } else { cropW = Math.max(20, origCropW - dx); cropH = Math.max(20, origCropH - dy); }}
    cropX = Math.max(0, cropX); cropY = Math.max(0, cropY);
  }
  if (dragging || resizing) draw();
});

document.addEventListener('mouseup', () => { dragging = false; resizing = false; });

function getAspectRatio() {
  const val = aspectRatio.value;
  if (val === 'free') return 0;
  const [w, h] = val.split(':').map(Number);
  return w / h;
}

aspectRatio.addEventListener('change', () => {
  const ratio = getAspectRatio();
  if (ratio) { cropH = cropW / ratio; cropY = Math.max(0, Math.min(img.height - cropH, cropY)); }
  draw();
});

document.getElementById('btnCrop').addEventListener('click', () => {
  if (!img) return;
  const outCanvas = document.createElement('canvas');
  outCanvas.width = cropW;
  outCanvas.height = cropH;
  outCanvas.getContext('2d').drawImage(cropCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
  outCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'cropped.png'; a.click();
    URL.revokeObjectURL(url);
    showToast('下载中...');
  }, 'image/png');
});

document.getElementById('btnReset').addEventListener('click', () => {
  uploadArea.style.display = 'block';
  cropContainer.style.display = 'none';
  ratioControls.style.display = 'none';
  actionBtns.style.display = 'none';
  img = null;
});
</script>
