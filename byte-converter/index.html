<script>
(function() {
  const inputValue = document.getElementById('inputValue');
  const fromUnit = document.getElementById('fromUnit');
  const errorMsg = document.getElementById('errorMsg');
  const resultGrid = document.getElementById('resultGrid');
  const modeSwitch = document.getElementById('modeSwitch');

  let base = 1024;

  const units = [
    { key: 'bit', label: 'bit', toByte: function(v, b) { return v / 8; }, fromByte: function(v, b) { return v * 8; } },
    { key: 'Byte', label: 'Byte (B)', toByte: function(v, b) { return v; }, fromByte: function(v, b) { return v; } },
    { key: 'KB', label: 'KB', toByte: function(v, b) { return v * b; }, fromByte: function(v, b) { return v / b; } },
    { key: 'MB', label: 'MB', toByte: function(v, b) { return v * b * b; }, fromByte: function(v, b) { return v / (b * b); } },
    { key: 'GB', label: 'GB', toByte: function(v, b) { return v * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b); } },
    { key: 'TB', label: 'TB', toByte: function(v, b) { return v * b * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b * b); } },
    { key: 'PB', label: 'PB', toByte: function(v, b) { return v * b * b * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b * b * b); } },
  ];

  function format(val) {
    if (val === 0) return '0';
    if (Math.abs(val) < 1e-15) return '0';
    if (Math.abs(val) < 0.001) return val.toExponential(4);
    if (Math.abs(val) >= 1e15) return val.toExponential(4);
    var s = val.toPrecision(10);
    var parts = s.split('e');
    if (parts.length === 2) return val.toExponential(4);
    var dot = s.indexOf('.');
    if (dot === -1) return s;
    var dec = s.substring(dot + 1);
    var trimmed = s.substring(0, dot + 1 + Math.min(dec.length, 6));
    return parseFloat(trimmed).toString();
  }

  function convert() {
    errorMsg.style.display = 'none';
    var val = parseFloat(inputValue.value);
    if (isNaN(val)) {
      errorMsg.textContent = '请输入有效的数值。';
      errorMsg.style.display = 'block';
      return;
    }
    if (val < 0) {
      errorMsg.textContent = '请输入非负数值。';
      errorMsg.style.display = 'block';
      return;
    }

    var fromKey = fromUnit.value;
    var fromU = units.find(function(u) { return u.key === fromKey; });
    if (!fromU) return;

    var bytes = fromU.toByte(val, base);
    var html = '';
    units.forEach(function(u) {
      var result = u.fromByte(bytes, base);
      html += '<div class="result-item"><div class="val">' + format(result) + '</div><div class="lbl">' + u.label + '</div></div>';
    });
    resultGrid.innerHTML = html;
  }

  inputValue.addEventListener('input', convert);
  fromUnit.addEventListener('change', convert);

  modeSwitch.addEventListener('click', function(e) {
    var btn = e.target.closest('.mode-btn');
    if (!btn) return;
    modeSwitch.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    base = parseInt(btn.dataset.mode);
    convert();
  });

  convert();
})();
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
