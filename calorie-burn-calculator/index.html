  <div class="input-grid">
    <div class="input-group"><label for="activity">运动类型</label><select id="activity" size="8" style="height:auto;overflow-y:auto;"></select><div class="hint">选择您要计算的运动</div></div>
    <div>
      <div class="input-group"><label for="weight">体重 (kg)</label><input type="number" id="weight" value="70" min="30" max="200" step="0.1"><div class="hint">您的体重（千克）</div></div>
      <div class="input-group"><label for="duration">运动时长 (分钟)</label><input type="number" id="duration" value="30" min="1" max="600" step="1"><div class="hint">本次运动时长</div></div>

    <div class="result-card"><div class="label">每分钟消耗</div><div class="value" id="perMin">0 kcal</div><div class="sub">每分钟</div></div>
    <div class="result-card"><div class="label">MET值</div><div class="value" id="metVal">0</div><div class="sub">代谢当量</div></div>
  </div>

    <div class="item"><span>运动类型</span><span class="val" id="detailActivity">-</span></div>

<div class="toast" id="toast"></div>
<script>
var activities = [
  { name: '跑步 (8 km/h)', met: 8.3 }, { name: '跑步 (10 km/h)', met: 10.0 }, { name: '跑步 (12 km/h)', met: 12.5 },
  { name: '慢跑 (6 km/h)', met: 6.0 }, { name: '快走 (6.5 km/h)', met: 5.0 }, { name: '散步 (4 km/h)', met: 3.5 },
  { name: '爬楼梯', met: 8.0 }, { name: '跳绳 (慢速)', met: 8.8 }, { name: '跳绳 (快速)', met: 12.3 },
  { name: '骑行 (16-19 km/h)', met: 6.8 }, { name: '骑行 (20-22 km/h)', met: 8.0 }, { name: '骑行 (22-26 km/h)', met: 10.0 },
  { name: '游泳 (自由泳, 慢速)', met: 5.8 }, { name: '游泳 (蛙泳)', met: 7.0 }, { name: '游泳 (蝶泳)', met: 13.8 },
  { name: '瑜伽 (哈他)', met: 3.0 }, { name: '瑜伽 (力量)', met: 4.0 }, { name: '普拉提', met: 3.5 },
  { name: '举重 (中等强度)', met: 4.0 }, { name: '举重 (高强度)', met: 6.0 }, { name: '俯卧撑/仰卧起坐', met: 8.0 },
  { name: '篮球 (比赛)', met: 8.0 }, { name: '篮球 (投篮)', met: 4.5 }, { name: '足球 (比赛)', met: 10.0 },
  { name: '足球 (练习)', met: 7.0 }, { name: '羽毛球', met: 5.5 }, { name: '乒乓球', met: 4.0 },
  { name: '网球 (单打)', met: 8.0 }, { name: '网球 (双打)', met: 6.0 }, { name: '排球', met: 4.0 },
  { name: '高尔夫 (步行)', met: 4.8 }, { name: '高尔夫 (球车)', met: 3.5 }, { name: '保龄球', met: 3.0 },
  { name: '滑雪 (下坡)', met: 7.0 }, { name: '滑雪 (越野)', met: 9.0 }, { name: '溜冰', met: 7.0 },
  { name: '攀岩', met: 8.8 }, { name: '徒步 (有坡度)', met: 6.5 }, { name: '武术 (柔道/空手道)', met: 10.3 },
  { name: '拳击 (沙袋)', met: 5.5 }, { name: '拳击 (对打)', met: 10.0 }, { name: '跳操 (有氧)', met: 7.3 },
  { name: '跳操 (高强度)', met: 10.0 }, { name: '动感单车', met: 8.5 }, { name: 'HIIT训练', met: 12.0 },
  { name: '划船机 (中等)', met: 7.0 }, { name: '划船机 (高强度)', met: 12.0 }, { name: '椭圆机', met: 5.0 },
  { name: '踏步机', met: 5.5 }, { name: '家务 (清洁)', met: 3.3 }, { name: '园艺', met: 4.0 },
  { name: '搬家/搬重物', met: 6.0 }, { name: '太极', met: 3.0 }, { name: '舞蹈 (交谊舞)', met: 4.5 },
  { name: '舞蹈 (街舞)', met: 6.5 }, { name: '舞蹈 (芭蕾)', met: 6.0 }
];

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function populateSelect(filter) {
  var sel = document.getElementById('activity');
  sel.innerHTML = '';
  var f = (filter || '').toLowerCase();
  var count = 0;
  activities.forEach(function(a, i){
    if (!f || a.name.toLowerCase().indexOf(f) >= 0) {
      var opt = document.createElement('option');
      opt.value = i; opt.textContent = a.name + ' (MET ' + a.met + ')';
      sel.appendChild(opt);
      count++;
    }
  });
  if (count === 0) {
    var opt = document.createElement('option');
    opt.disabled = true; opt.textContent = '未找到匹配的运动';
    sel.appendChild(opt);
  }
  if (sel.options.length > 0) sel.selectedIndex = 0;
}

function filterMet() {
  var q = document.getElementById('metSearch').value;
  populateSelect(q);
}

function calculate() {
  var sel = document.getElementById('activity');
  if (sel.selectedIndex < 0 || !sel.options[sel.selectedIndex].value) { showToast('请选择一个运动类型'); return; }
  var idx = parseInt(sel.options[sel.selectedIndex].value);
  var act = activities[idx];
  var weight = parseFloat(document.getElementById('weight').value) || 0;
  var duration = parseFloat(document.getElementById('duration').value) || 0;

  if (weight < 30 || weight > 200) { showToast('体重请输入30-200公斤之间的值'); return; }
  if (duration < 1 || duration > 600) { showToast('运动时长请输入1-600分钟'); return; }

  var calories = (act.met * weight * 3.5 / 200) * duration;
  var perMin = calories / duration;

  document.getElementById('calories').textContent = Math.round(calories) + ' kcal';
  document.getElementById('perMin').textContent = perMin.toFixed(1) + ' kcal';
  document.getElementById('metVal').textContent = act.met;
  document.getElementById('detailActivity').textContent = act.name;
  document.getElementById('detailMET').textContent = act.met + ' MET';
  document.getElementById('detailWeight').textContent = weight + ' kg';
  document.getElementById('detailDuration').textContent = duration + ' 分钟';
  document.getElementById('detailTotal').textContent = Math.round(calories) + ' kcal';
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  var lines = ['卡路里消耗计算结果', '---'];
  var items = document.querySelectorAll('#resultSection .item');
  items.forEach(function(i){
    lines.push(i.children[0].textContent + ': ' + i.children[1].textContent);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    showToast('✅ 已复制到剪贴板');
  }, function(){
    showToast('❌ 复制失败，请手动选择');
  });
}

function clearAll() {
  document.getElementById('weight').value = '70';
  document.getElementById('duration').value = '30';
  document.getElementById('metSearch').value = '';
  populateSelect('');
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  showToast('已重置');
}

populateSelect('');
</script>
