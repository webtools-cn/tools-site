  <style>
    :root{--primary:#4F46E5;--primary-light:#EEF2FF;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header .logo{font-size:1.25rem;font-weight:700;color:var(--primary);text-decoration:none}
    header nav{display:flex;gap:16px}
    header nav a{color:var(--text-secondary);text-decoration:none;font-size:.9rem;transition:color .2s}
    header nav a:hover{color:var(--primary)}
    main{flex:1;max-width:800px;margin:0 auto;padding:32px 20px;width:100%}
    h1{font-size:1.75rem;margin-bottom:8px;color:var(--text)}
    .subtitle{color:var(--text-secondary);margin-bottom:28px;font-size:.95rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
    .card h2{font-size:1.1rem;margin-bottom:16px;color:var(--text)}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text)}
    input,select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;transition:border-color .2s}
    input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:500;cursor:pointer;transition:all .2s;gap:6px}
    .btn-primary{background:var(--primary);color:#fff;width:100%}
    .btn-primary:hover{background:#4338CA;transform:translateY(-1px)}
    .result-box{background:var(--primary-light);border-radius:var(--radius);padding:28px 20px;text-align:center;margin-top:16px}
    .result-box .big-day{font-size:3rem;font-weight:800;color:var(--primary);line-height:1.2}
    .result-box .info{font-size:.9rem;color:var(--text-secondary);margin-top:8px}
    .quick-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
    .quick-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:all .2s}
    .quick-card:hover{background:var(--primary-light);border-color:var(--primary)}

    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px}
    .calendar-grid .ch{text-align:center;font-size:.8rem;font-weight:600;color:var(--text-secondary);padding:6px}
    .calendar-grid .cd{text-align:center;padding:8px 4px;border-radius:6px;font-size:.85rem;cursor:default}
    .calendar-grid .cd.today{background:var(--primary);color:#fff;font-weight:700}
    .calendar-grid .cd.other{color:#cbd5e1}
    footer{background:var(--card);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.85rem;color:var(--text-secondary)}
    footer a{color:var(--primary);text-decoration:none}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:1.4rem}.quick-cards{grid-template-columns:repeat(2,1fr)}.result-box .big-day{font-size:2.2rem}}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>

<body>
<header>
  <a href="/" class="logo">Free ToolBase</a>
  <nav>
    <a href="/">首页</a>
    <a href="/en/day-of-week/">English</a>
  </nav>
</header>
<main>
  <h1>📆 星期几计算器</h1>
  <p class="subtitle">输入任意日期，快速查询是星期几。附带当月日历视图。</p>
  <div class="card">
    <label for="query-date">选择日期</label>
    <input type="date" id="query-date">
    <div class="result-box">
      <div class="big-day" id="big-day">--</div>
      <div class="info" id="date-info"></div>
    </div>
    <div class="quick-cards" id="quick-cards"></div>
  </div>
  <div class="card">
    <h2>📅 <span id="cal-month-title"></span></h2>
    <div class="calendar-grid" id="calendar"></div>
  </div>
</main>
<footer>
  <p>&copy; 2025 <a href="/">Free ToolBase</a> · 免费在线工具</p>
</footer>
<script>
(function(){
  var weekdays=['日','一','二','三','四','五','六'];
  var weekdaysFull=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var today=new Date();

  function fmtDate(d){return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();}

  document.getElementById('query-date').value=fmtDate(today);

  function updateResult(){
    var v=document.getElementById('query-date').value;
    if(!v)return;
    var d=new Date(v+'T00:00:00');
    var dw=d.getDay();
    document.getElementById('big-day').textContent=weekdaysFull[dw];
    document.getElementById('date-info').textContent=v+' · 第'+(Math.ceil((d-new Date(d.getFullYear(),0,0))/86400000))+'天 · '+(d.getTime()>today.getTime()?'距今':'已过去')+Math.abs(Math.round((today.getTime()-d.getTime())/86400000))+'天';
    updateCalendar(d);
  }

  function updateCalendar(ref){
    var y=ref.getFullYear(),m=ref.getMonth();
    document.getElementById('cal-month-title').textContent=y+'年'+(m+1)+'月';
    var html='';
    weekdays.forEach(function(w){html+='<div class="ch">'+w+'</div>';});
    var first=new Date(y,m,1);
    var last=new Date(y,m+1,0);
    var startDay=first.getDay();
    for(var i=0;i<startDay;i++)html+='<div class="cd other"></div>';
    for(var d=1;d<=last.getDate();d++){
      var cls='cd';
      if(ref.getDate()===d)cls+=' today';
      html+='<div class="'+cls+'">'+d+'</div>';
    }
    document.getElementById('calendar').innerHTML=html;
  }

  document.getElementById('query-date').addEventListener('input',updateResult);

  // Quick cards - recent days
  function buildQuickCards(){
    var html='';
    for(var i=-3;i<=3;i++){
      var d=new Date(today);
      d.setDate(d.getDate()+i);
      var label=i===0?'今天':(i>0?i+'天后':Math.abs(i)+'天前');
      html+='<div class="quick-card" data-date="'+fmtDate(d)+'"><div class="qd">'+(d.getMonth()+1)+'/'+d.getDate()+'</div><div class="qw">'+label+'</div></div>';
    }
    document.getElementById('quick-cards').innerHTML=html;
    document.querySelectorAll('.quick-card').forEach(function(c){
      c.addEventListener('click',function(){
        document.getElementById('query-date').value=this.dataset.date;
        updateResult();
      });
    });
  }

  buildQuickCards();
  updateResult();
})();
</script>
</body>
