<body>
<div class="container">
<div class="header"><h1>📈 函数图表绘制器</h1><div class="lang-switch"><a href="index.html" class="active">中文</a><a href="../en/graph-plotter/">EN</a></div></div>
<p class="nav-back"><a href="../index.html">首页</a> › <a href="../index.html#tools">工具</a> › 函数图表绘制器</p>
<div class="panel">
<div class="form-group">
<label>函数表达式（用逗号分隔多个函数）</label>
<input type="text" id="funcInput" value="sin(x), cos(x)" placeholder="例如: sin(x), x^2, exp(x)">
</div>
<div class="preset-row">
<span class="preset" data-expr="sin(x), cos(x)">sin+cos</span>
<span class="preset" data-expr="x^2">x²</span>
<span class="preset" data-expr="exp(x), log(x)">exp+log</span>
<span class="preset" data-expr="tan(x)">tan</span>
<span class="preset" data-expr="x^3 - 3*x">x³-3x</span>
<span class="preset" data-expr="abs(x), sqrt(abs(x))">abs+sqrt</span>
</div>
<div class="range-row">
<div class="form-group"><label>X最小</label><input type="number" id="xMin" value="-6"></div>
<div class="form-group"><label>X最大</label><input type="number" id="xMax" value="6"></div>
<div class="form-group"><label>Y最小</label><input type="number" id="yMin" value="-3"></div>
<div class="form-group"><label>Y最大</label><input type="number" id="yMax" value="3"></div>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="plotBtn">绘制</button>
<button class="btn btn-success" id="exportBtn">导出PNG</button>
<button class="btn btn-secondary" id="resetBtn">重置</button>
</div>
</div>
<canvas id="canvas" width="850" height="500"></canvas>
<div class="info-section">
<h2>关于函数图表绘制器</h2>
<p>支持常见数学函数：<code>sin</code> <code>cos</code> <code>tan</code> <code>asin</code> <code>acos</code> <code>atan</code> <code>exp</code> <code>log</code> <code>log10</code> <code>log2</code> <code>sqrt</code> <code>abs</code> <code>pow(x,n)</code> <code>floor</code> <code>ceil</code> <code>round</code>。用逗号分隔多个表达式绘制多条曲线，变量用x。</p>
<h3>运算符</h3>
<p><code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>^</code> 幂运算。例如：<code>x^2 + 2*x - 1</code></p>
</div>
<div class="footer"><p>© 2024 Free ToolBase · <a href="../">首页</a> · 数据不上传服务器</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
const colors = ['#22d3ee','#ef4444','#10b981','#f59e0b','#a78bfa','#ec4899','#84cc16','#f97316'];
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const toast = document.getElementById('toast');
let W = canvas.width, H = canvas.height;

function showToast(msg) { toast.textContent=msg; toast.classList.add('show'); setTimeout(function(){toast.classList.remove('show')},2000); }

function parseExpr(expr) {
  expr = expr.replace(/\^/g,'**');
  expr = expr.replace(/(\d)(x)/g,'$1*$2');
  expr = expr.replace(/\)(\d)/g,')*$1');
  expr = expr.replace(/\)x/g,')*x');
  return expr;
}

function plot() {
  const exprStr = document.getElementById('funcInput').value;
  const exprs = exprStr.split(',').map(function(s){return s.trim()}).filter(Boolean);
  const xMin = parseFloat(document.getElementById('xMin').value) || -6;
  const xMax = parseFloat(document.getElementById('xMax').value) || 6;
  const yMin = parseFloat(document.getElementById('yMin').value) || -3;
  const yMax = parseFloat(document.getElementById('yMax').value) || 3;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0f1a'; ctx.fillRect(0,0,W,H);

  const margin = 40;
  const pw = W - 2*margin, ph = H - 2*margin;

  function xToPx(x) { return margin + (x - xMin) / (xMax - xMin) * pw; }
  function yToPx(y) { return margin + (yMax - y) / (yMax - yMin) * ph; }

  // Grid
  ctx.strokeStyle='rgba(148,163,184,.08)'; ctx.lineWidth=0.5;
  const xStep = (xMax-xMin) > 20 ? 2 : 1;
  for (let x = Math.ceil(xMin); x <= xMax; x += xStep) {
    ctx.beginPath(); ctx.moveTo(xToPx(x), margin); ctx.lineTo(xToPx(x), margin+ph); ctx.stroke();
  }
  const yStep = (yMax-yMin) > 10 ? 2 : 1;
  for (let y = Math.ceil(yMin); y <= yMax; y += yStep) {
    ctx.beginPath(); ctx.moveTo(margin, yToPx(y)); ctx.lineTo(margin+pw, yToPx(y)); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle='rgba(148,163,184,.3)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(margin, yToPx(0)); ctx.lineTo(margin+pw, yToPx(0)); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(xToPx(0), margin); ctx.lineTo(xToPx(0), margin+ph); ctx.stroke();

  // Labels
  ctx.fillStyle='#64748b'; ctx.font='10px monospace'; ctx.textAlign='center';
  for (let x = Math.ceil(xMin); x <= xMax; x += xStep) {
    if (x !== 0) ctx.fillText(x, xToPx(x), yToPx(0)+14);
  }
  ctx.textAlign='right';
  for (let y = Math.ceil(yMin); y <= yMax; y += yStep) {
    if (y !== 0) ctx.fillText(y, xToPx(0)-6, yToPx(y)+4);
  }

  // Plot functions
  const steps = 800;
  for (let i = 0; i < exprs.length; i++) {
    const parsed = parseExpr(exprs[i]);
    ctx.strokeStyle = colors[i % colors.length];
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (let j = 0; j <= steps; j++) {
      const x = xMin + (xMax - xMin) * j / steps;
      let y;
      try {
        y = Function('x','return '+parsed)(x);
      } catch(e) { continue; }
      if (isNaN(y) || !isFinite(y)) { started = false; continue; }
      const px = xToPx(x), py = yToPx(y);
      if (py < margin - 100 || py > margin + ph + 100) { started = false; continue; }
      if (!started) { ctx.moveTo(px, py); started = true; }
      else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }

  // Legend
  ctx.font = '12px monospace'; ctx.textAlign = 'left';
  for (let i = 0; i < exprs.length; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(margin + 6, margin + 6 + i*20, 12, 12);
    ctx.fillText(exprs[i], margin + 24, margin + 16 + i*20);
  }
}

document.getElementById('plotBtn').addEventListener('click', plot);
document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('funcInput').value = 'sin(x), cos(x)';
  document.getElementById('xMin').value = -6;
  document.getElementById('xMax').value = 6;
  document.getElementById('yMin').value = -3;
  document.getElementById('yMax').value = 3;
  plot();
});
document.getElementById('exportBtn').addEventListener('click', function() {
  const link = document.createElement('a');
  link.download = 'graph.png';
  link.href = canvas.toDataURL();
  link.click();
  showToast('图表已导出');
});
document.querySelectorAll('.preset').forEach(function(el) {
  el.addEventListener('click', function() {
    document.getElementById('funcInput').value = this.dataset.expr;
    plot();
  });
});
document.getElementById('funcInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') plot();
});
plot();
</script>
</body>
