<script>
// DOM elements
var uploadArea = document.getElementById('uploadArea');
var fileInput = document.getElementById('fileInput');
var previewContainer = document.getElementById('previewContainer');
var previewCanvas = document.getElementById('previewCanvas');
var controlsPanel = document.getElementById('controlsPanel');
var toast = document.getElementById('toast');

// Filter sliders
var sliders = {
  grayscale: document.getElementById('grayscale'),
  sepia: document.getElementById('sepia'),
  invert: document.getElementById('invert'),
  hueRotate: document.getElementById('hueRotate'),
  saturate: document.getElementById('saturate'),
  brightness: document.getElementById('brightness'),
  contrast: document.getElementById('contrast'),
  blur: document.getElementById('blur'),
  sharpen: document.getElementById('sharpen')
};

// State
var originalImage = null;
var ctx = previewCanvas.getContext('2d');
var toastTimer = null;

// Presets
var presets = {
  vintage: {grayscale:0,sepia:70,invert:0,hueRotate:0,saturate:80,brightness:105,contrast:90,blur:0,sharpen:0},
  dramatic: {grayscale:0,sepia:20,invert:0,hueRotate:0,saturate:120,brightness:95,contrast:150,blur:0,sharpen:30},
  cool: {grayscale:0,sepia:0,invert:0,hueRotate:200,saturate:110,brightness:105,contrast:100,blur:0,sharpen:0},
  warm: {grayscale:0,sepia:30,invert:0,hueRotate:30,saturate:130,brightness:110,contrast:95,blur:0,sharpen:0},
  soft: {grayscale:0,sepia:10,invert:0,hueRotate:0,saturate:90,brightness:115,contrast:85,blur:2,sharpen:0},
  sharp: {grayscale:0,sepia:0,invert:0,hueRotate:0,saturate:105,brightness:100,contrast:120,blur:0,sharpen:60}
};

function showToast(msg, type) {
  if (toastTimer) clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'toast ' + (type || '') + ' show';
  toastTimer = setTimeout(function() {
    toast.classList.remove('show');
  }, 2000);
}

function applyPreset(name) {
  var p = presets[name];
  if (!p) return;
  for (var key in p) {
    if (sliders[key]) {
      sliders[key].value = p[key];
      updateValLabel(key);
    }
  }
  applyFilters();
}

function updateValLabel(key) {
  var val = sliders[key].value;
  var el = document.getElementById('val' + key.charAt(0).toUpperCase() + key.slice(1));
  if (!el) return;
  if (key === 'hueRotate') el.textContent = val + '°';
  else if (key === 'blur') el.textContent = val + 'px';
  else el.textContent = val + '%';
}

function getFilterString() {
  var parts = [];
  var g = parseInt(sliders.grayscale.value);
  var s = parseInt(sliders.sepia.value);
  var i = parseInt(sliders.invert.value);
  var h = parseInt(sliders.hueRotate.value);
  var sat = parseInt(sliders.saturate.value);
  var b = parseInt(sliders.brightness.value);
  var c = parseInt(sliders.contrast.value);
  var bl = parseInt(sliders.blur.value);
  var sh = parseInt(sliders.sharpen.value);

  if (g > 0) parts.push('grayscale(' + g + '%)');
  if (s > 0) parts.push('sepia(' + s + '%)');
  if (i > 0) parts.push('invert(' + i + '%)');
  if (h > 0) parts.push('hue-rotate(' + h + 'deg)');
  if (sat !== 100) parts.push('saturate(' + sat + '%)');
  if (b !== 100) parts.push('brightness(' + b + '%)');
  if (c !== 100) parts.push('contrast(' + c + '%)');
  if (bl > 0) parts.push('blur(' + bl + 'px)');
  if (sh > 0) parts.push('brightness(' + (100 + sh * 0.3) + '%) contrast(' + (100 + sh * 0.5) + '%)');

  return parts.join(' ');
}

function applyFilters() {
  if (!originalImage) return;
  var w = originalImage.width;
  var h = originalImage.height;
  previewCanvas.width = w;
  previewCanvas.height = h;
  ctx.filter = getFilterString();
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(originalImage, 0, 0, w, h);
  ctx.filter = 'none';
}

function loadImage(file) {
  if (!file || !file.type.match(/image\//)) {
    showToast('请选择有效的图片文件', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      originalImage = img;
      var maxW = 700;
      var scale = img.width > maxW ? maxW / img.width : 1;
      previewCanvas.width = img.width * scale;
      previewCanvas.height = img.height * scale;
      ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      ctx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);
      uploadArea.classList.add('has-image');
      uploadArea.querySelector('.upload-icon').textContent = '✅';
      uploadArea.querySelector('.upload-text').textContent = file.name;
      uploadArea.querySelector('.upload-hint').textContent = (img.width + '×' + img.height + ' px');
      previewContainer.classList.add('active');
      controlsPanel.style.opacity = '1';
      applyFilters();
      showToast('图片加载成功！调节右侧滤镜查看效果', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function downloadImage() {
  if (!originalImage) {
    showToast('请先上传图片', 'error');
    return;
  }
  applyFilters();
  var link = document.createElement('a');
  link.download = 'photo-effects-' + Date.now() + '.png';
  link.href = previewCanvas.toDataURL('image/png');
  link.click();
  showToast('图片下载成功！', 'success');
}

function resetFilters() {
  for (var key in sliders) {
    if (key === 'saturate' || key === 'brightness' || key === 'contrast') {
      sliders[key].value = 100;
    } else {
      sliders[key].value = 0;
    }
    updateValLabel(key);
  }
  applyFilters();
  showToast('所有滤镜已重置');
}

function handleNewImage() {
  originalImage = null;
  ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewContainer.classList.remove('active');
  uploadArea.classList.remove('has-image');
  uploadArea.querySelector('.upload-icon').textContent = '🖼️';
  uploadArea.querySelector('.upload-text').textContent = '点击上传图片 或 拖拽图片到此处';
  uploadArea.querySelector('.upload-hint').textContent = '支持 JPG、PNG、WebP、BMP、GIF';
  resetFilters();
}

// Event listeners
uploadArea.addEventListener('click', function(e) {
  if (e.target.tagName === 'INPUT') return;
  fileInput.click();
});

fileInput.addEventListener('change', function(e) {
  if (e.target.files && e.target.files[0]) {
    loadImage(e.target.files[0]);
  }
});

uploadArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = 'var(--primary-light)';
  uploadArea.style.background = 'rgba(124,58,237,.08)';
});

uploadArea.addEventListener('dragleave', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  uploadArea.style.background = '';
});

uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  uploadArea.style.background = '';
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    loadImage(e.dataTransfer.files[0]);
  }
});

// Slider events
for (var key in sliders) {
  sliders[key].addEventListener('input', function() {
    updateValLabel(this.id);
    applyFilters();
  });
}

// Buttons
document.getElementById('btnDownload').addEventListener('click', downloadImage);
document.getElementById('btnReset').addEventListener('click', resetFilters);
