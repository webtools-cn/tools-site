<main>
  <h1>数钱计算器</h1>
  <p class="subtitle">输入每种面额的数量，自动计算总金额</p>
  <div class="card">
    <div style="margin-bottom:12px;">
      <label style="font-weight:600;">选择币种</label>
      <select id="currency-select" style="width:auto;font-family:inherit;margin-left:8px;">
        <option value="CNY" selected>人民币 ¥</option>
        <option value="USD">美元 $</option>
        <option value="EUR">欧元 €</option>
        <option value="JPY">日元 ¥</option>
        <option value="GBP">英镑 £</option>
      </select>
    </div>
    <div id="denom-inputs" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;"></div>
    <div style="margin-top:16px;padding:16px;background:#f1f5f9;border-radius:8px;text-align:center;">
      <span style="font-size:.9rem;color:var(--text-secondary);">总计：</span>
      <span id="total-display" style="font-size:1.8rem;font-weight:700;color:var(--primary);">¥0.00</span>
    </div>
    <div style="margin-top:8px;text-align:center;">
      <button class="btn btn-secondary" id="reset-btn">清零</button>
    </div>
  </div>
  <div class="how-to">
    <h3>📖 如何使用</h3>
    <ol>
      <li>选择货币：从人民币、美元、欧元等货币中选择</li>
      <li>输入数量：填写每种面额纸币和硬币的张数/枚数</li>
      <li>查看总计：自动计算显示总金额</li>
    </ol>
  </div>

<script>
(function() {
  'use strict';
  const CURRENCIES = {
    CNY: { symbol: '¥', denoms: [100, 50, 20, 10, 5, 1, 0.5, 0.1], labels: ['100元', '50元', '20元', '10元', '5元', '1元', '5角', '1角'] },
    USD: { symbol: '$', denoms: [100, 50, 20, 10, 5, 1, 0.25, 0.10, 0.05, 0.01], labels: ['$100', '$50', '$20', '$10', '$5', '$1', '25¢', '10¢', '5¢', '1¢'] },
    EUR: { symbol: '€', denoms: [500, 200, 100, 50, 20, 10, 5, 2, 1, 0.50, 0.20, 0.10, 0.05, 0.02, 0.01], labels: ['€500', '€200', '€100', '€50', '€20', '€10', '€5', '€2', '€1', '50c', '20c', '10c', '5c', '2c', '1c'] },
    JPY: { symbol: '¥', denoms: [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1], labels: ['10000円', '5000円', '2000円', '1000円', '500円', '100円', '50円', '10円', '5円', '1円'] },
    GBP: { symbol: '£', denoms: [50, 20, 10, 5, 2, 1, 0.50, 0.20, 0.10, 0.05, 0.02, 0.01], labels: ['£50', '£20', '£10', '£5', '£2', '£1', '50p', '20p', '10p', '5p', '2p', '1p'] }
  };

  const container = document.getElementById('denom-inputs');
  const totalDisplay = document.getElementById('total-display');
  const currencySelect = document.getElementById('currency-select');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function renderDenoms(curr) {
    const c = CURRENCIES[curr];
    container.innerHTML = c.denoms.map((d, i) => 
      '<div style="padding:8px;border:1px solid var(--border);border-radius:8px;">' +
      '<label style="font-size:.8rem;color:var(--text-secondary);">' + c.labels[i] + '</label>' +
      '<input type="number" min="0" value="0" data-value="' + d + '" style="width:100%;font-family:inherit;font-size:.9rem;padding:6px;border:1px solid var(--border);border-radius:6px;">' +
      '</div>'
    ).join('');

    // 绑定事件
    container.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', updateTotal);
    });
  }

  function updateTotal() {
    const curr = currencySelect.value;
    const symbol = CURRENCIES[curr].symbol;
    let total = 0;
    container.querySelectorAll('input').forEach(inp => {
      const v = parseFloat(inp.value) || 0;
      const denom = parseFloat(inp.dataset.value);
      total += v * denom;
    });
    totalDisplay.textContent = symbol + total.toFixed(2);
  }

  currencySelect.addEventListener('change', function() {
    renderDenoms(this.value);
    updateTotal();
  });

  document.getElementById('reset-btn').addEventListener('click', function() {
    container.querySelectorAll('input').forEach(inp => { inp.value = 0; });
    updateTotal();
  });

  // 初始渲染
  renderDenoms('CNY');
  updateTotal();
}());
</script>
