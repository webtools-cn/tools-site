  <div class="card">
    <div class="row">
      <div class="input-group">
        <label for="radius">底面半径</label>
        <input type="number" id="radius" placeholder="例如：3" step="any" min="0.0001">
      </div>
      <div class="input-group">
        <label for="height">高度</label>

      </div>
    </div>
    <button id="calcBtn">计算</button>
    <div class="result" id="result" style="display:none">
      <div class="result-item"><div class="val" id="volume">-</div><div class="lbl">体积</div></div>
      <div class="result-item"><div class="val" id="lateral">-</div><div class="lbl">侧面积</div></div>

    <p style="font-size:14px;color:var(--text-secondary)">
      <strong>体积 V = π × r² × h</strong>（底面积 × 高）<br>
      <strong>侧面积 = 2 × π × r × h</strong>（底面周长 × 高）<br>

<script>
(function(){
  const rInput = document.getElementById('radius');
  const hInput = document.getElementById('height');
  const resultDiv = document.getElementById('result');
  const btn = document.getElementById('calcBtn');

  function showToast(msg){showToast(msg)}

  btn.addEventListener('click', function(){
    const r = parseFloat(rInput.value);
    const h = parseFloat(hInput.value);
    if(isNaN(r)||isNaN(h)||r<=0||h<=0){showToast('请输入有效的正数');return;}
    const vol = Math.PI * r*r * h;
    const lat = 2 * Math.PI * r * h;
    const sur = 2 * Math.PI * r*r + lat;
    resultDiv.style.display='grid';
    document.getElementById('volume').textContent = vol.toFixed(4);
    document.getElementById('lateral').textContent = lat.toFixed(4);
    document.getElementById('surface').textContent = sur.toFixed(4);
  });

  rInput.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
  hInput.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
})();
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
