<header><h1>🏠 房贷再融资计算器</h1><p>计算转贷节省金额 · 评估是否值得</p></header>
<div class="container">
  <div class="card">
    <h2>📋 当前贷款信息</h2>
    <div class="row">
      <div class="form-group"><label>剩余贷款额 (元)</label><input type="number" id="currentBalance" value="800000" min="1000"></div>
      <div class="form-group"><label>当前年利率 (%)</label><input type="number" id="currentRate" value="5.2" min="0.1" step="0.01"></div>
      <div class="form-group"><label>剩余期限 (月)</label><input type="number" id="currentMonths" value="240" min="1"></div>
    </div>
    <div class="divider"></div>
    <h2>📋 新贷款方案</h2>
    <div class="row">
      <div class="form-group"><label>新年利率 (%)</label><input type="number" id="newRate" value="3.8" min="0.1" step="0.01"></div>
      <div class="form-group"><label>新贷款期限 (月)</label><input type="number" id="newMonths" value="240" min="1"></div>
      <div class="form-group"><label>再融资费用 (元)</label><input type="number" id="refiCost" value="5000" min="0"></div>
    </div>
    <button class="btn" id="calcBtn">🔍 计算再融资节省</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 再融资分析</h2>
    <div id="results"></div>
  </div>
</div>

<script>
(function() {
  const inputs = ['currentBalance','currentRate','currentMonths','newRate','newMonths','refiCost'];
  const calcBtn = document.getElementById('calcBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');

  function calcMonthly(amount, annualRate, months) {
    if (months <= 0 || annualRate <= 0) return { monthly: amount/months, totalPayment: amount, totalInterest: 0 };
    const r = annualRate / 100 / 12;
    const mp = amount * r * Math.pow(1+r, months) / (Math.pow(1+r, months) - 1);
    return { monthly: mp, totalPayment: mp*months, totalInterest: mp*months - amount };
  }

  function calc() {
    const balance = parseFloat(document.getElementById('currentBalance').value) || 0;
    const cRate = parseFloat(document.getElementById('currentRate').value) || 0;
    const cMonths = parseInt(document.getElementById('currentMonths').value) || 0;
    const nRate = parseFloat(document.getElementById('newRate').value) || 0;
    const nMonths = parseInt(document.getElementById('newMonths').value) || 0;
    const refiCost = parseFloat(document.getElementById('refiCost').value) || 0;

    if (!balance || !cRate || !cMonths || !nRate || !nMonths) { resultsCard.style.display='none'; return; }

    const current = calcMonthly(balance, cRate, cMonths);
    const newLoan = calcMonthly(balance, nRate, nMonths);

    const monthlySaving = current.monthly - newLoan.monthly;
    const totalInterestSaving = current.totalInterest - newLoan.totalInterest;
    const netSaving = totalInterestSaving - refiCost;
    const breakEven = monthlySaving > 0 ? Math.ceil(refiCost / monthlySaving) : Infinity;

    const fmt = (n) => n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});

    resultsEl.innerHTML = `
      <div class="result-box">
        <div class="result-row"><span class="label">当前月供</span><span class="value">¥${fmt(current.monthly)}</span></div>
        <div class="result-row"><span class="label">新方案月供</span><span class="value ${monthlySaving>0?'saving':'cost'}">¥${fmt(newLoan.monthly)}</span></div>
        <div class="result-row"><span class="label">月供变化</span><span class="value ${monthlySaving>0?'saving':'cost'}">${monthlySaving>0?'↓':'↑'} ¥${fmt(Math.abs(monthlySaving))}</span></div>
        <div class="result-row"><span class="label">当前总利息</span><span class="value">¥${fmt(current.totalInterest)}</span></div>
        <div class="result-row"><span class="label">新方案总利息</span><span class="value ${totalInterestSaving>0?'saving':'cost'}">¥${fmt(newLoan.totalInterest)}</span></div>
        <div class="result-row"><span class="label">总利息节省</span><span class="value saving">¥${fmt(Math.max(0,totalInterestSaving))}</span></div>
        <div class="result-row"><span class="label">再融资费用</span><span class="value">-¥${fmt(refiCost)}</span></div>
        <div class="result-row"><span class="label">净节省</span><span class="value" style="font-size:1.1rem;color:${netSaving>0?'var(--success)':'var(--danger)'}">¥${fmt(netSaving)}</span></div>
      </div>
      <div class="highlight" style="background:${netSaving>0?'#f0fdf4':'#fef2f2'}">
        ${netSaving > 0 
          ? `✅ 建议再融资！净节省 ¥${fmt(netSaving)}，${breakEven}个月可收回成本。` 
          : `⚠️ 不建议再融资。净损失 ¥${fmt(Math.abs(netSaving))}。`}
      </div>
    `;
    resultsCard.style.display = 'block';
  }

  calcBtn.addEventListener('click', calc);
  document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));
  calc();
})();
</script>
