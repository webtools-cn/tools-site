<div style="margin-top:16px;padding:16px;background:rgba(99,102,241,.06);border:1px dashed rgba(99,102,241,.2);border-radius:8px">
  <input type="text" id="quickInput" placeholder="Type something..." style="padding:8px 12px;border:1px solid rgba(148,163,184,.3);border-radius:6px;background:rgba(15,23,42,.6);color:#e2e8f0;width:200px;font-size:.9rem;margin-right:8px">

  <div class="toast" id="toast"></div>
  <script>
    const urlInput = document.getElementById('urlInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultEl = document.getElementById('result');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    async function analyze() {
      let url = urlInput.value.trim();
      if (!url) { showToast('请输入网址'); return; }
      if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; }

      resultEl.innerHTML = '<p class="status-msg"><span class="loading"></span>正在分析...</p>';

      try {
        // Use allorigins as CORS proxy
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
        const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract meta tags
        const title = doc.querySelector('title');
        const titleText = title ? title.textContent.trim() : '';
        const descMeta = doc.querySelector('meta[name="description"]');
        const descContent = descMeta ? descMeta.getAttribute('content') || '' : '';
        const ogTitle = doc.querySelector('meta[property="og:title"]');
        const ogDesc = doc.querySelector('meta[property="og:description"]');
        const ogImage = doc.querySelector('meta[property="og:image"]');
        const ogType = doc.querySelector('meta[property="og:type"]');
        const ogUrl = doc.querySelector('meta[property="og:url"]');
        const twCard = doc.querySelector('meta[name="twitter:card"]');
        const twTitle = doc.querySelector('meta[name="twitter:title"]');
        const twDesc = doc.querySelector('meta[name="twitter:description"]');
        const twImage = doc.querySelector('meta[name="twitter:image"]');
        const canonical = doc.querySelector('link[rel="canonical"]');
        const robots = doc.querySelector('meta[name="robots"]');
        const viewport = doc.querySelector('meta[name="viewport"]');
        const charset = doc.querySelector('meta[charset]') || doc.querySelector('meta[http-equiv="Content-Type"]');
        const h1Tags = doc.querySelectorAll('h1');
        const keywords = doc.querySelector('meta[name="keywords"]');

        // Score
        let score = 0;
        const checks = [];
        if (titleText) { score += 15; checks.push(['标题', true, '✅', titleText.substring(0,80)]); }
        else { checks.push(['标题', false, '❌', '缺少标题']); }
        if (descContent) {
          score += 15;
          const len = descContent.length;
          if (len >= 50 && len <= 160) { score += 5; checks.push(['描述', true, '✅ 长度完美', descContent.substring(0,120)]); }
          else if (len < 50) { checks.push(['描述', true, '⚠️ 过短('+len+'字符)', descContent]); }
          else { checks.push(['描述', true, '⚠️ 过长('+len+'字符)', descContent.substring(0,120)]); }
        } else { checks.push(['描述', false, '❌', '缺少meta description']); }
        if (viewport) { score += 10; checks.push(['Viewport', true, '✅', viewport.getAttribute('content') || '']); }
        else { checks.push(['Viewport', false, '❌', '缺少viewport']); }
        if (charset) { score += 10; checks.push(['字符编码', true, '✅', charset.getAttribute('charset') || charset.getAttribute('content') || '']); }
        else { checks.push(['字符编码', false, '❌', '缺少字符编码声明']); }
        if (canonical) { score += 10; checks.push(['Canonical', true, '✅', canonical.getAttribute('href') || '']); }
        else { checks.push(['Canonical', false, '⚠️', '缺少canonical链接']); }
        if (ogTitle) { score += 8; } else { checks.push(['OG标题', false, '⚠️', '缺少og:title']); }
        if (ogDesc) { score += 8; } else { checks.push(['OG描述', false, '⚠️', '缺少og:description']); }
        if (ogImage) { score += 7; } else { checks.push(['OG图片', false, '⚠️', '缺少og:image']); }
        if (h1Tags.length === 1) { score += 10; checks.push(['H1标签', true, '✅', h1Tags[0].textContent.trim().substring(0,80)]); }
        else if (h1Tags.length === 0) { checks.push(['H1标签', false, '❌', '缺少H1标签']); }
        else { checks.push(['H1标签', false, '⚠️ ' + h1Tags.length + '个', '有多个H1标签']); }
        if (robots) { score += 5; checks.push(['Robots', true, '✅', robots.getAttribute('content') || '']); }
        else { checks.push(['Robots', false, '⚠️', '缺少robots meta']); }
        score = Math.min(score, 100);

        let html_out = '';

        // Score section
        const scoreColor = score >= 80 ? 'var(--success)' : score >= 50 ? 'var(--warning)' : 'var(--danger)';
        html_out += '<div class="result-section"><h3>📊 SEO评分 <span style="font-size:1.5rem;color:'+scoreColor+'">'+score+'/100</span></h3>';
        html_out += '<div class="score-bar"><div class="score-fill" style="width:'+score+'%;background:'+scoreColor+'"></div></div>';
        html_out += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">';
        for (const [name, ok, icon, value] of checks) {
          html_out += '<span class="badge '+(icon==='✅'?'badge-ok':icon.startsWith('⚠')?'badge-warn':'badge-err')+'" title="'+value+'">'+icon+' '+name+'</span>';
        }
        html_out += '</div></div>';

        // Basic SEO
        html_out += '<div class="result-section"><h3>📝 基础SEO</h3>';
        html_out += '<div class="tag-item"><span class="name">Title:</span> <span class="value">'+(titleText||'未设置')+' ('+(titleText.length)+'字符)</span></div>';
        html_out += '<div class="tag-item"><span class="name">Description:</span> <span class="value">'+(descContent||'未设置')+' ('+(descContent.length)+'字符)</span></div>';
        if (keywords) html_out += '<div class="tag-item"><span class="name">Keywords:</span> <span class="value">'+keywords.getAttribute('content')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">H1:</span> <span class="value">'+(h1Tags.length ? Array.from(h1Tags).map(h=>h.textContent.trim()).join(', ') : '未设置')+' (共'+h1Tags.length+'个)</span></div>';
        html_out += '<div class="tag-item"><span class="name">Canonical:</span> <span class="value">'+(canonical ? canonical.getAttribute('href') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">Robots:</span> <span class="value">'+(robots ? robots.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '</div>';

        // Open Graph
        html_out += '<div class="result-section"><h3>📱 Open Graph</h3>';
        html_out += '<div class="tag-item"><span class="name">og:title:</span> <span class="value">'+(ogTitle ? ogTitle.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">og:description:</span> <span class="value">'+(ogDesc ? ogDesc.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">og:image:</span> <span class="value">'+(ogImage ? ogImage.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">og:type:</span> <span class="value">'+(ogType ? ogType.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">og:url:</span> <span class="value">'+(ogUrl ? ogUrl.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '</div>';

        // Twitter Card
        html_out += '<div class="result-section"><h3>🐦 Twitter Card</h3>';
        html_out += '<div class="tag-item"><span class="name">twitter:card:</span> <span class="value">'+(twCard ? twCard.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">twitter:title:</span> <span class="value">'+(twTitle ? twTitle.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">twitter:description:</span> <span class="value">'+(twDesc ? twDesc.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '<div class="tag-item"><span class="name">twitter:image:</span> <span class="value">'+(twImage ? twImage.getAttribute('content') : '未设置')+'</span></div>';
        html_out += '</div>';

        // Other meta
        const otherMeta = doc.querySelectorAll('meta:not([name="description"]):not([name="viewport"]):not([name="robots"]):not([name="keywords"]):not([name="twitter:card"]):not([name="twitter:title"]):not([name="twitter:description"]):not([name="twitter:image"]):not([property^="og:"]):not([charset]):not([http-equiv="Content-Type"])');
        if (otherMeta.length > 0) {
          html_out += '<div class="result-section"><h3>🔧 其他Meta标签 ('+otherMeta.length+'个)</h3>';
          otherMeta.forEach(m => {
            const name = m.getAttribute('name') || m.getAttribute('property') || m.getAttribute('http-equiv') || 'unknown';
            const content = m.getAttribute('content') || '';
            if (content) html_out += '<div class="tag-item"><span class="name">'+name+':</span> <span class="value">'+content+'</span></div>';
          });
          html_out += '</div>';
        }

        resultEl.innerHTML = '<div class="result">'+html_out+'</div>';
      } catch (e) {
        resultEl.innerHTML = '<p class="status-msg error">❌ 分析失败: '+e.message+'<br><small>请检查网址是否正确，或尝试使用HTTPS协议</small></p>';
      }
    }

    analyzeBtn.addEventListener('click', analyze);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
  </script>
