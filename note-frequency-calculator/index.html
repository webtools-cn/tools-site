<script>
(function(){
  var notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var noteNames=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'];
  var noteSelect=document.getElementById('noteSelect');
  var octaveSelect=document.getElementById('octaveSelect');
  var tuningFreq=document.getElementById('tuningFreq');
  var calcBtn=document.getElementById('calcBtn');
  var resultArea=document.getElementById('resultArea');
  var noteName=document.getElementById('noteName');
  var freqResult=document.getElementById('freqResult');
  var midiNote=document.getElementById('midiNote');
  var wavelength=document.getElementById('wavelength');
  var playBtn=document.getElementById('playBtn');
  var stopBtn=document.getElementById('stopBtn');
  var copyBtn=document.getElementById('copyBtn');
  var pianoContainer=document.getElementById('pianoContainer');
  var freqTableBody=document.getElementById('freqTableBody');
  var toast=document.getElementById('toast');
  var audioCtx=null,currentOsc=null;

  function getFreq(noteIdx,octave,tuning){
    var midi=noteIdx+(octave+1)*12;
    return tuning*Math.pow(2,(midi-69)/12);
  }

  function getNoteByMidi(midi){
    var o=Math.floor(midi/12)-1;
    var n=midi%12;
    return {name:notes[n],octave:o};
  }

  function calcAndShow(){
    var ni=parseInt(noteSelect.value);
    var no=noteSelect.selectedIndex;
    var oct=parseInt(octaveSelect.value);
    var tuning=parseFloat(tuningFreq.value)||440;
    if(tuning<400||tuning>500){showToast('基准频率范围400-500Hz');return;}
    var freq=getFreq(no,oct,tuning);
    var midi=no+(oct+1)*12;
    noteName.textContent=noteNames[no]+oct;
    freqResult.textContent=freq.toFixed(2)+' Hz';
    midiNote.textContent='MIDI '+midi;
    wavelength.textContent=(343/freq*100).toFixed(1)+' cm';
    resultArea.style.display='block';
  }

  function playTone(freq,duration){
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    if(currentOsc){try{currentOsc.stop();}catch(e){}}
    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+duration);
    currentOsc=osc;
  }

  function stopTone(){
    if(currentOsc){try{currentOsc.stop();}catch(e){}currentOsc=null;}
  }

  function playCurrent(){
    var no=noteSelect.selectedIndex;
    var oct=parseInt(octaveSelect.value);
    var tuning=parseFloat(tuningFreq.value)||440;
    var freq=getFreq(no,oct,tuning);
    playTone(freq,1.5);
    showToast('🔊 播放 '+noteNames[no]+oct+' ('+freq.toFixed(1)+' Hz)');
  }

  function buildPiano(){
    var html='';
    var blackPositions=[0,1,3,4,5]; // C# D# F# G# A#
    var startMidi=21; // A0
    var endMidi=108; // C8
    var whiteKeys=[];
    for(var m=startMidi;m<=endMidi;m++){
      var n=m%12;
      if(n===0||n===2||n===4||n===5||n===7||n===9||n===11){
        whiteKeys.push(m);
      }
    }
    var idx=0;
    for(var i=0;i<whiteKeys.length;i++){
      var m=whiteKeys[i];
      var nb=getNoteByMidi(m);
      html+='<div class="piano-key" data-midi="'+m+'" onclick="playPianoKey('+m+')"><span class="key-label">'+nb.name+nb.octave+'</span></div>';
    }
    pianoContainer.innerHTML=html;

    // Add black keys as overlay via JS positioning
    setTimeout(function(){
      var whiteEls=pianoContainer.querySelectorAll('.piano-key');
      var wi=0;
      for(var m=startMidi;m<=endMidi;m++){
        var n=m%12;
        if(n===0||n===2||n===4||n===5||n===7||n===9||n===11){
          wi++;
        }else{
          // black key - find its position between white keys
          var blackIdx=wi; // position after the preceding white key
          if(whiteEls[blackIdx]){
            var rect=whiteEls[blackIdx].getBoundingClientRect();
            var containerRect=pianoContainer.getBoundingClientRect();
            var left=rect.right-containerRect.left-12;
            var black=document.createElement('div');
            black.className='black-key';
            black.style.left=left+'px';
            black.setAttribute('data-midi',m);
            black.title=notes[n]+Math.floor(m/12)-1;
            black.onclick=function(midi){return function(){playPianoKey(midi);};}(m);
            pianoContainer.appendChild(black);
          }
        }
      }
    },100);
  }

  window.playPianoKey=function(midi){
    var nb=getNoteByMidi(midi);
    noteSelect.value=nb.name;
    octaveSelect.value=nb.octave;
    noteSelect.selectedIndex=notes.indexOf(nb.name);
    calcAndShow();
    var tuning=parseFloat(tuningFreq.value)||440;
    var freq=getFreq(notes.indexOf(nb.name),nb.octave,tuning);
    playTone(freq,1.5);
    // Highlight
    var allKeys=pianoContainer.querySelectorAll('.piano-key,.black-key');
    for(var i=0;i<allKeys.length;i++){allKeys[i].classList.remove('active');}
    var active=pianoContainer.querySelector('[data-midi="'+midi+'"]');
    if(active)active.classList.add('active');
  };

  function buildFreqTable(){
    var tuning=parseFloat(tuningFreq.value)||440;
    var html='';
    for(var m=21;m<=108;m++){
      var nb=getNoteByMidi(m);
      var freq=getFreq(notes.indexOf(nb.name),nb.octave,tuning);
      html+='<tr><td>'+nb.name+'</td><td>'+nb.octave+'</td><td class="freq">'+freq.toFixed(2)+' Hz</td><td>'+m+'</td><td><button class="btn btn-outline btn-sm" onclick="selectNote('+m+')">查看</button> <button class="btn btn-outline btn-sm" onclick="playMidi('+m+')">🔊</button></td></tr>';
    }
    freqTableBody.innerHTML=html;
  }

  window.selectNote=function(midi){
    var nb=getNoteByMidi(midi);
    noteSelect.value=nb.name;
    octaveSelect.value=nb.octave;
    noteSelect.selectedIndex=notes.indexOf(nb.name);
    calcAndShow();
    window.scrollTo({top:0,behavior:'smooth'});
  };

  window.playMidi=function(midi){
    var nb=getNoteByMidi(midi);
    var tuning=parseFloat(tuningFreq.value)||440;
    var freq=getFreq(notes.indexOf(nb.name),nb.octave,tuning);
    playTone(freq,1);
  };

  function copyResult(){
    var text='音符频率\n'+noteName.textContent+': '+freqResult.textContent+'\n'+midiNote.textContent+'\n波长: '+wavelength.textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){showToast('✅ 已复制');});}
  }

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t=setTimeout(function(){toast.classList.remove('show');},2000);
  }

  calcBtn.addEventListener('click',calcAndShow);
  playBtn.addEventListener('click',playCurrent);
  stopBtn.addEventListener('click',stopTone);
  copyBtn.addEventListener('click',copyResult);
  tuningFreq.addEventListener('change',function(){
    buildFreqTable();
    if(resultArea.style.display!=='none')calcAndShow();
  });

  buildPiano();
  buildFreqTable();
  // Auto calc on load
  calcAndShow();
})();

// === 重写的函数实现 ===
function playMidi() {
  showToast('功能已触发');
}

function selectNote() {
  showToast('功能已触发');
}
</script>
