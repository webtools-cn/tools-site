<body>
<div class="container">
<header class="header">
<h1>💵 小费计算器</h1>
<div class="lang-switch"><a href="/tips-calculator/" class="active">中文</a><a href="/en/tips-calculator/">English</a></div>
</header>

<div class="section">
<h2>输入账单信息</h2>

<div class="form-row">
<div class="form-group">
<label>账单金额</label>
<input type="number" id="billAmount" placeholder="例如: 200" min="0" value="200" step="0.01">
</div>
<div class="form-group">
<label>分摊人数</label>
<input type="number" id="people" placeholder="例如: 4" min="1" max="100" value="4">
</div>
</div>

<div class="form-group">
<label>小费比例</label>
<div class="tip-presets" id="presets">
<span class="tip-preset active" data-tip="10">10%</span>
<span class="tip-preset" data-tip="15">15%</span>
<span class="tip-preset" data-tip="18">18%</span>
<span class="tip-preset" data-tip="20">20%</span>
<span class="tip-preset" data-tip="25">25%</span>
</div>
<input type="number" id="tipPercent" placeholder="自定义比例" min="0" max="100" value="15" step="0.1">
</div>

<button class="btn btn-primary btn-block" id="calculate">🔍 计算小费</button>

<div id="result"></div>
</div>

<div class="section">
<h2>💡 小费常识</h2>
<p style="color:var(--text-secondary);font-size:.9rem;line-height:1.8">
<strong>各国小费文化：</strong><br>
• 美国/加拿大：通常15%-20%，部分餐厅已含服务费<br>
• 英国：通常10%-15%，检查账单是否已含服务费<br>
• 日本/韩国：一般不收小费，给反而可能冒犯<br>
• 欧洲：服务费通常已包含在账单中，可额外给5%-10%<br>
<strong>AA制分摊：</strong>输入人数即可计算每人应付金额（含小费）。
</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var billEl=document.getElementById('billAmount');
var peopleEl=document.getElementById('people');
var tipPercentEl=document.getElementById('tipPercent');
var calcBtn=document.getElementById('calculate');
var resultDiv=document.getElementById('result');
var toast=document.getElementById('toast');

document.querySelectorAll('.tip-preset').forEach(function(p){
p.addEventListener('click',function(){
document.querySelectorAll('.tip-preset').forEach(function(x){x.classList.remove('active')});
this.classList.add('active');
tipPercentEl.value=this.dataset.tip;
calcBtn.click();
});
});

tipPercentEl.addEventListener('input',function(){
document.querySelectorAll('.tip-preset').forEach(function(x){x.classList.remove('active')});
calcBtn.click();
});

function showToast(msg){
toast.textContent=msg;toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show')},2000);
}

function formatMoney(n){
return '¥'+n.toFixed(2);
}

calcBtn.addEventListener('click',function(){
var bill=parseFloat(billEl.value)||0;
var people=parseInt(peopleEl.value)||1;
var tipPercent=parseFloat(tipPercentEl.value)||0;

if(bill<=0){showToast('请输入有效账单金额');return;}
if(people<1){showToast('请输入有效人数');return;}

var tipAmount=bill*(tipPercent/100);
var total=bill+tipAmount;
var perPerson=total/people;
var tipPerPerson=tipAmount/people;

var html='<div class="result-card">';
html+='<div class="big-number">'+formatMoney(total)+' <span class="unit">总金额</span></div>';
html+='<div style="color:var(--text-secondary);font-size:.85rem;margin-top:4px">小费：'+formatMoney(tipAmount)+' ('+tipPercent+'%)</div>';
html+='<div class="result-row">';
html+='<div class="result-item"><div class="label">账单金额</div><div class="value">'+formatMoney(bill)+'</div></div>';
html+='<div class="result-item"><div class="label">小费金额</div><div class="value">'+formatMoney(tipAmount)+'</div></div>';
html+='<div class="result-item highlight"><div class="label">每人应付</div><div class="value">'+formatMoney(perPerson)+'</div></div>';
if(people>1){
html+='<div class="result-item"><div class="label">每人均摊小费</div><div class="value">'+formatMoney(tipPerPerson)+'</div></div>';
}
html+='</div></div>';
resultDiv.innerHTML=html;
var existingBtn=resultDiv.querySelector('.copy-btn');
if(!existingBtn){
var copyBtn=document.createElement('button');
copyBtn.className='btn copy-btn btn-block';
copyBtn.textContent='📋 Copy Results';
copyBtn.addEventListener('click',function(){
var txt='';
resultDiv.querySelectorAll('.result-item .label,.result-item .value,.big-number').forEach(function(el){txt+=el.textContent+' ';});
navigator.clipboard.writeText(txt.trim()).then(function(){showToast('Copied!')});
});
resultDiv.appendChild(copyBtn);
}
});

calcBtn.click();
})();
</script>
</body>
