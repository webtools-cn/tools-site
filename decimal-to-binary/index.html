function decToBin(dec){
if(dec === '' || isNaN(dec)) return null;
var num = parseFloat(dec);
if(!isFinite(num)) return null;
var sign = num < 0 ? '-' : '';
num = Math.abs(num);
var intPart = Math.floor(num);
var fracPart = num - intPart;
var binInt = intPart === 0 ? '0' : '';
while(intPart > 0){
binInt = (intPart % 2) + binInt;
intPart = Math.floor(intPart / 2);
}
var binFrac = '';
var count = 0;
while(fracPart > 0 && count < 20){
fracPart *= 2;
var bit = Math.floor(fracPart);
binFrac += bit;
fracPart -= bit;
count++;
}
var result = sign + binInt;
if(binFrac) result += '.' + binFrac;
return result;
}

function binToDec(bin){
if(!bin || !/^[01]+(\.[01]+)?$/.test(bin.replace('-',''))) return null;
var sign = bin[0] === '-' ? -1 : 1;
var clean = bin.replace('-','');
var parts = clean.split('.');
var intPart = parts[0];
var fracPart = parts[1] || '';
var dec = 0;
for(var i = 0; i < intPart.length; i++){
dec = dec * 2 + parseInt(intPart[i]);
}
for(var j = 0; j < fracPart.length; j++){
dec += parseInt(fracPart[j]) * Math.pow(2, -(j+1));
}
return sign * dec;
}

function convertDecimalToBinary(){
var dec = document.getElementById("decimalInput").value.trim();
var resultDiv = document.getElementById("resultDisplay");
var detailDiv = document.getElementById("resultDetail");
if(!dec){resultDiv.textContent='请输入十进制数';detailDiv.textContent='';return;}
if(dec === '-'){resultDiv.textContent='-';detailDiv.textContent='';return;}
var bin = decToBin(dec);
if(bin === null){resultDiv.textContent='无效输入';detailDiv.textContent='请输入有效的十进制数字';}
else{
resultDiv.textContent = bin;
detailDiv.innerHTML = '<code>' + dec + '</code><sub>10</sub> = <code>' + bin + '</code><sub>2</sub>';
}
document.getElementById("binaryInput").value = bin || '';
}

function convertBinaryToDecimal(){
var bin = document.getElementById("binaryInput").value.trim();
var resultDiv = document.getElementById("resultDisplay");
var detailDiv = document.getElementById("resultDetail");
if(!bin){resultDiv.textContent='输入二进制数';detailDiv.textContent='';return;}
var dec = binToDec(bin);
if(dec === null){resultDiv.textContent='无效二进制';detailDiv.textContent='请输入有效的二进制数字（只含0和1）';}
else{
resultDiv.textContent = dec;
detailDiv.innerHTML = '<code>' + bin + '</code><sub>2</sub> = <code>' + dec + '</code><sub>10</sub>';
document.getElementById("decimalInput").value = dec;
}
}

function swapDirection(){
var d = document.getElementById("decimalInput").value;
var b = document.getElementById("binaryInput").value;
if(d && !b){convertDecimalToBinary();}
else if(b && !d){convertBinaryToDecimal();}
else{showToast('请先输入一个值再反转')}
}

function setDecimal(val){
document.getElementById("decimalInput").value = val;
convertDecimalToBinary();
}
