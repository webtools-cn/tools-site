<script>
(function(){
  const radiusInput = document.getElementById('radius');
  const resultDiv = document.getElementById('result');
  const btn = document.getElementById('calcBtn');

  function showToast(msg){alert(msg)}

  btn.addEventListener('click', function(){
    const r = parseFloat(radiusInput.value);
    if(isNaN(r)||r<=0){showToast('请输入有效的正数半径');return;}
    const vol = (4/3) * Math.PI * Math.pow(r,3);
    const sur = 4 * Math.PI * Math.pow(r,2);
    resultDiv.style.display='grid';
    document.getElementById('volume').textContent = vol.toFixed(4);
    document.getElementById('surface').textContent = sur.toFixed(4);
  });

  radiusInput.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
})();
</script>
