<script>// Free ToolBase - Calculator Common Utilities v1.0
// Shared by all calculator tools

function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function copyResult() {
    const card = document.getElementById('result-card');
    if (!card || card.style.display === 'none') { showToast('请先计算'); return; }
    const items = card.querySelectorAll('.result-item');
    let text = '';
    items.forEach(item => {
        const label = item.querySelector('.result-label')?.textContent?.trim() || '';
        const value = item.querySelector('.result-value')?.textContent?.trim() || '';
        if (label && value) text += label + ': ' + value + '\n';
    });
    if (text) {
        navigator.clipboard.writeText(text.trim()).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败'));
    }
}

function resetForm() {
    document.querySelectorAll('#input-area input').forEach(el => {
        if (el.type === 'number' || el.type === 'text') {
            el.value = el.dataset.default || '';
        }
    });
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('chart-container').style.display = 'none';
    if (window.chart) { window.chart.destroy(); window.chart = null; }
}

function formatNum(n, decimals) {
    if (decimals === undefined) decimals = 2;
    if (typeof n !== 'number' || isNaN(n)) return '0.00';
    return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function formatUSD(n) {
    if (typeof n !== 'number' || isNaN(n)) return '$0.00';
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function drawBarChart(canvasId, labels, datasets, title) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (window.chart) window.chart.destroy();
    
    const ctx = canvas.getContext('2d');
    const w = canvas.parentElement.clientWidth - 40;
    const h = 220;
    canvas.width = w * 2;
    canvas.height = h * 2;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(2, 2);
    
    const padding = { top: 30, right: 20, bottom: 50, left: 70 };
    const chartW = w - padding.left - padding.right;
    const chartH = h - padding.top - padding.bottom;
    
    // Find max value
    let maxVal = 0;
    datasets.forEach(ds => ds.data.forEach(v => { if (v > maxVal) maxVal = v; }));
    maxVal = Math.ceil(maxVal * 1.15);
    
    // Draw grid
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 0.5;
    const gridLines = 5;
    for (let i = 0; i <= gridLines; i++) {
        const y = padding.top + (chartH / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(w - padding.right, y);
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('$' + formatNum(maxVal * (1 - i / gridLines), 0), padding.left - 8, y + 4);
    }
    
    // Draw bars
    const barWidth = chartW / labels.length / (datasets.length + 1);
    const barGap = barWidth * 0.3;
    
    datasets.forEach((ds, di) => {
        ds.data.forEach((val, i) => {
            const barH = (val / maxVal) * chartH;
            const x = padding.left + (chartW / labels.length) * i + barWidth * di + barWidth * 0.5;
            const y = padding.top + chartH - barH;
            
            ctx.fillStyle = ds.color || COLORS[di % COLORS.length];
            ctx.fillRect(x - barWidth / 2 + barGap / 2, y, barWidth - barGap, barH);
            
            // Value on top
            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('$' + formatNum(val, 0), x, y - 4);
        });
    });
    
    // X-axis labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    labels.forEach((label, i) => {
        const x = padding.left + (chartW / labels.length) * i + chartW / labels.length / 2;
        ctx.fillText(label, x, h - padding.bottom + 20);
    });
    
    // Legend
    if (datasets.length > 1) {
        let lx = padding.left;
        datasets.forEach((ds, i) => {
            ctx.fillStyle = ds.color || COLORS[i % COLORS.length];
            ctx.fillRect(lx, 8, 12, 12);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(ds.label, lx + 16, 18);
            lx += ctx.measureText(ds.label).width + 40;
        });
    }
}

function drawLineChart(canvasId, labels, datasets) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (window.chart) window.chart.destroy();
    
    const ctx = canvas.getContext('2d');
    const w = canvas.parentElement.clientWidth - 40;
    const h = 250;
    canvas.width = w * 2;
    canvas.height = h * 2;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(2, 2);
    
    const padding = { top: 30, right: 20, bottom: 50, left: 70 };
    const chartW = w - padding.left - padding.right;
    const chartH = h - padding.top - padding.bottom;
    
    let maxVal = 0;
    datasets.forEach(ds => ds.data.forEach(v => { if (v > maxVal) maxVal = v; }));
    maxVal = Math.ceil(maxVal * 1.15);
    
    // Grid
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 0.5;
    const gridLines = 5;
    for (let i = 0; i <= gridLines; i++) {
        const y = padding.top + (chartH / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(w - padding.right, y);
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        const val = maxVal * (1 - i / gridLines);
        ctx.fillText(val >= 1000 ? '$' + formatNum(val, 0) : '$' + formatNum(val, 2), padding.left - 8, y + 4);
    }
    
    // Lines
    datasets.forEach((ds, di) => {
        ctx.strokeStyle = ds.color || COLORS[di % COLORS.length];
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ds.data.forEach((val, i) => {
            const x = padding.left + (chartW / (ds.data.length - 1)) * i;
            const y = padding.top + chartH - (val / maxVal) * chartH;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
        
        // Dots
        ds.data.forEach((val, i) => {
            const x = padding.left + (chartW / (ds.data.length - 1)) * i;
            const y = padding.top + chartH - (val / maxVal) * chartH;
            ctx.fillStyle = ds.color || COLORS[di % COLORS.length];
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
    });
    
    // X-axis
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.floor(labels.length / 12));
    labels.forEach((label, i) => {
        if (i % step === 0 || i === labels.length - 1) {
            const x = padding.left + (chartW / (labels.length - 1)) * i;
            ctx.fillText(label, x, h - padding.bottom + 20);
        }
    });
    
    // Legend
    let lx = padding.left;
    datasets.forEach((ds, i) => {
        ctx.fillStyle = ds.color || COLORS[i % COLORS.length];
        ctx.fillRect(lx, 8, 12, 12);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(ds.label, lx + 16, 18);
        lx += ctx.measureText(ds.label).width + 40;
    });
}</script>
<script>// Crypto Staking Calculator
(function() {
    const inputArea = document.getElementById('input-area');
    inputArea.innerHTML = '<div class="form-group"><label>质押数量 (Stake Amount)</label><input type="number" id="stake-amount" placeholder="例如: 1000" value="1000" min="0" step="any" data-default="1000"></div><div class="form-group"><label>币价 (Token Price USD)</label><input type="number" id="token-price" placeholder="例如: 3500" value="3500" min="0" step="any" data-default="3500"></div><div class="input-row"><div class="form-group"><label>年化率 (APR %)</label><input type="number" id="apr" placeholder="例如: 5" value="5" min="0" step="any" data-default="5"></div><div class="form-group"><label>质押期限 (月)</label><input type="number" id="duration-months" placeholder="例如: 12" value="12" min="1" max="120" step="1" data-default="12"></div></div><div class="form-group"><label>复利频率</label><select id="compound-freq"><option value="1">每年</option><option value="12" selected>每月</option><option value="365">每天</option><option value="0">不计算复利</option></select></div>';
})();
function calculate(){var a=parseFloat(document.getElementById('stake-amount').value)||0,p=parseFloat(document.getElementById('token-price').value)||0,r=parseFloat(document.getElementById('apr').value)||0,m=parseInt(document.getElementById('duration-months').value)||12,c=parseInt(document.getElementById('compound-freq').value)||12;if(a<=0){showToast('请输入质押数量');return;}if(p<=0){showToast('请输入币价');return;}var y=m/12,rate=r/100,ft,tr;if(c===0){tr=a*rate*y;ft=a+tr;}else{ft=a*Math.pow(1+rate/c,c*y);tr=ft-a;}var iu=a*p,fu=ft*p,ru=tr*p,apy=c===0?r:(Math.pow(1+rate/c,c)-1)*100,md=[],rt=a;for(var i=0;i<=m;i++){if(c===0)rt=a+a*rate*(i/12);else rt=a*Math.pow(1+rate/c,c*(i/12));md.push(rt*p);}var ml=Array.from({length:m+1},function(_,i){return 'M'+i;});document.getElementById('result-card').style.display='block';document.getElementById('result-card').innerHTML='<div class="result-item"><span class="result-label">质押期限</span><span class="result-value small">'+m+' 个月 ('+y.toFixed(1)+' 年)</span></div><div class="result-item"><span class="result-label">APR / APY</span><span class="result-value small">'+r.toFixed(2)+'% / '+apy.toFixed(2)+'%</span></div><div class="result-item"><span class="result-label">初始投资</span><span class="result-value small">'+formatNum(a,4)+' 币 ('+formatUSD(iu)+')</span></div><div class="result-item"><span class="result-label">最终资产</span><span class="result-value">'+formatNum(ft,4)+' 币</span></div><div class="result-item"><span class="result-label">最终价值</span><span class="result-value">'+formatUSD(fu)+'</span></div><div class="result-item"><span class="result-label">总收益</span><span class="result-value">'+formatNum(tr,4)+' 币 ('+formatUSD(ru)+')</span></div><div class="result-item"><span class="result-label">投资回报率</span><span class="result-value">'+formatNum((fu-iu)/iu*100,2)+'%</span></div><div class="result-item"><span class="result-label">日均收益</span><span class="result-value small">'+formatUSD(ru/(m*30.4375))+'</span></div>';document.getElementById('chart-container').style.display='block';drawLineChart('yieldChart',ml,[{label:'Portfolio Value',data:md,color:COLORS[0]}]);}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT')calculate();});
</script>
