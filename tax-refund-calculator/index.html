<body>
    <header>

        </div>

    <main>
        <h1>个税退税计算器</h1>
        <p class="subtitle">估算个人所得税退税金额。输入年收入和各项扣除，快速计算应退税款。基于中国个税累进税率或简易估算模式。</p>
        <div class="card">
            <h2>计算器</h2>
            <div class="form-group">
                <label>年收入总额</label>
                <input type="number" id="income" placeholder="输入年收入（元）" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label>专项附加扣除</label>
                <input type="number" id="deduction" placeholder="子女教育/房贷/租房等（元）" step="0.01" min="0" value="0">
            </div>
            <div class="form-group">
                <label>已预缴个税</label>
                <input type="number" id="prepaid" placeholder="已预扣预缴个税（元）" step="0.01" min="0">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">计算</button>
                <button class="btn btn-secondary" id="resetBtn">清空</button>
            </div>
            <div class="result" id="result">
                <span class="result-label">结果:</span>
                <span id="resultValue"></span>
            </div>
        </div>
    </main>
    <footer>
        <a href="/">首页</a>
        <a href="/privacy">隐私政策</a>
    </footer>
    <div class="toast" id="toast"></div>
    <script>
    
const toast = s => {{ const e = document.getElementById('toast'); e.textContent = s; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2000); }};
const copy = s => {{ navigator.clipboard.writeText(s).then(() => toast('已复制到剪贴板')).catch(() => toast('复制失败')); }};

function calcTax(income) {{
    // CN progressive rates (simplified, monthly basis)
    const taxable = income - 60000; // basic exemption
    if (taxable <= 0) return 0;
    const brackets = [
        [36000, 0.03, 0],
        [144000, 0.10, 2520],
        [300000, 0.20, 16920],
        [420000, 0.25, 31920],
        [660000, 0.30, 52920],
        [960000, 0.35, 85920],
        [Infinity, 0.45, 181920]
    ];
    for (const [limit, rate, ded] of brackets) {{
        if (taxable <= limit) return Math.max(0, taxable * rate - ded);
    }}
    return 0;
}}

document.getElementById('calcBtn').addEventListener('click', () => {{
    const income = parseFloat(document.getElementById('income').value);
    const deduction = parseFloat(document.getElementById('deduction').value) || 0;
    const prepaid = parseFloat(document.getElementById('prepaid').value);
    if (isNaN(income) || isNaN(prepaid)) {{ toast('请填写所有必填项'); return; }}
    const actualTax = calcTax(income - deduction);
    const refund = Math.max(0, prepaid - actualTax);
    const owe = Math.max(0, actualTax - prepaid);
    let msg;
    if (refund > 0) {{ msg = `应退税款: ¥${{refund.toFixed(2)}}（实缴 ${{prepaid.toFixed(2)}} - 应缴 ${{actualTax.toFixed(2)}}）`; }}
    else if (owe > 0) {{ msg = `需补缴: ¥${{owe.toFixed(2)}}（应缴 ${{actualTax.toFixed(2)}} - 已缴 ${{prepaid.toFixed(2)}}）`; }}
    else {{ msg = `已缴税额等于应缴税额，无需退税或补税`; }}
    document.getElementById('resultValue').textContent = msg;
    document.getElementById('result').classList.add('show');
    document.getElementById('resultValue').onclick = () => copy(msg);
    document.getElementById('resultValue').style.cursor = 'pointer';
    document.getElementById('resultValue').title = '点击复制结果';
}});

document.getElementById('resetBtn').addEventListener('click', () => {{
    document.getElementById('income').value = '';
    document.getElementById('deduction').value = '0';
    document.getElementById('prepaid').value = '';
    document.getElementById('result').classList.remove('show');
}});

    </script>
