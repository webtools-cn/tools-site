<body>
<div class="container">
<header class="header">
<h1>📋 API文档生成器</h1>

<a href="/api-doc-generator/" class="active">中文</a>

</div>

<div class="hero"><p>API文档生成器 - 免费在线工具，从JSON/OpenAPI快速生成API文档。</p></div>

<div class="input-section">
<h2>API文档生成</h2>
<label for="apiInput">粘贴OpenAPI JSON或端点定义</label>
<textarea id="apiInput" rows="10" placeholder='{"info": {"title": "My API", "version": "1.0.0"}, "paths": {"/users": {"get": {"summary": "获取用户列表", ...}}}}'></textarea>
<div class="btn-row">
<button class="btn-primary" onclick="generateDoc()">📄 生成文档</button>
<button class="btn-secondary" onclick="exportDoc('md')">📝 导出Markdown</button>
<button class="btn-secondary" onclick="exportDoc('html')">🌐 导出HTML</button>
</div>
<div id="docPreview" style="margin-top:12px"></div>
</div>

<div class="info-section">
<h2>常见问题</h2>
<h3>支持哪些格式？</h3>
<p>支持OpenAPI 3.0/Swagger 2.0 JSON格式，以及自定义JSON端点描述格式。</p>
<h3>可以导出吗？</h3>
<p>可以导出为Markdown和HTML格式，方便集成到项目中。</p>

<div class="toast" id="toast"></div>
<script>
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板');}).catch(function(){showToast('复制失败');});}
</script>
<script>
var lastDoc='';
function generateDoc(){
var input=document.getElementById('apiInput').value.trim();
var panel=document.getElementById('docPreview');
if(!input){panel.innerHTML='<div class="output-area" style="color:var(--warning)">请粘贴API定义</div>';return;}
try{
var spec=JSON.parse(input);
var md='# '+((spec.info||{}).title||'API')+' v'+((spec.info||{}).version||'1.0')+'\n\n';
md+='**基础URL:** '+(spec.servers&&spec.servers[0]?spec.servers[0].url:'/')+'\n\n';
md+='## 端点\n\n';
var paths=spec.paths||{};
Object.keys(paths).forEach(function(path){
var methods=paths[path];
Object.keys(methods).forEach(function(method){
if(method==='parameters')return;
var ep=methods[method];
md+='### '+method.toUpperCase()+' `'+path+'`\n\n';
if(ep.summary)md+=ep.summary+'\n\n';
if(ep.description)md+=ep.description+'\n\n';
if(ep.parameters&&ep.parameters.length){
md+='| 参数 | 类型 | 必填 | 描述 |\n';
md+='|------|------|------|------|\n';
ep.parameters.forEach(function(p){md+='| '+p.name+' | '+(p.schema?p.schema.type:p.type||'string')+' | '+(p.required?'Yes':'No')+' | '+(p.description||'')+' |\n';});
md+='\n';
}
if(ep.responses){Object.keys(ep.responses).forEach(function(code){var r=ep.responses[code];md+='> **'+code+'**: '+(r.description||'')+'\n\n';});}
});
});
lastDoc=md;
var html=md.replace(/\n/g,'<br>').replace(/### (.+)/g,'<strong>$1</strong>').replace(/## (.+)/g,'<h3>$1</h3>').replace(/# (.+)/g,'<h2>$1</h2>');
html=html.replace(/\| ([^|]+) \| ([^|]+) \| ([^|]+) \| ([^|]+) \|/g,'<table><tr><th>$1</th><th>$2</th><th>$3</th><th>$4</th></tr>');
panel.innerHTML='<div class="output-area">'+html+'</div>';
}catch(e){panel.innerHTML='<div class="output-area" style="color:var(--danger)">❌ JSON解析错误: '+e.message+'</div>';}
}
function exportDoc(format){
if(!lastDoc){showToast("请先生成文档");return;}
var blob,ext;
if(format==='md'){blob=new Blob([lastDoc],{type:'text/markdown'});ext='md';}
else{var h='<!DOCTYPE html><html><head><meta charset=UTF-8><title>API Docs</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6}code{background:#f0f0f0;padding:2px 6px;border-radius:4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body>'+lastDoc.replace(/\n/g,'<br>').replace(/### (.+)/g,'<h3>$1</h3>').replace(/## (.+)/g,'<h2>$1</h2>').replace(/# (.+)/g,'<h1>$1</h1>')+'</body></html>';blob=new Blob([h],{type:'text/html'});ext='html';}
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='api-docs.'+ext;a.click();showToast("已导出 "+ext);
}
</script>
</body>
</html>
