<body>
<header>
  <a href="/">🏠 Free ToolBase</a>
  <span>PWA Manifest生成器</span>
</header>
<div class="container">
  <h1>📱 PWA Manifest生成器</h1>
  <p class="subtitle">可视化配置Web应用清单文件，一键生成manifest.json</p>

  <div class="form-group">
    <label>应用名称 *</label>
    <input type="text" id="name" placeholder="例如：我的PWA应用" value="我的PWA应用">
  </div>
  <div class="form-group">
    <label>短名称</label>
    <input type="text" id="shortName" placeholder="例如：我的应用" value="我的应用">
    <div class="hint">显示在主屏幕图标下方</div>
  </div>
  <div class="row">
    <div class="form-group">
      <label>启动URL</label>
      <input type="text" id="startUrl" placeholder="/" value="/">
    </div>
    <div class="form-group">
      <label>作用域</label>
      <input type="text" id="scope" placeholder="/" value="/">
    </div>
  </div>
  <div class="row">
    <div class="form-group">
      <label>显示模式</label>
      <select id="display">
        <option value="standalone" selected>独立应用(standalone)</option>
        <option value="fullscreen">全屏(fullscreen)</option>
        <option value="minimal-ui">最小UI(minimal-ui)</option>
        <option value="browser">浏览器(browser)</option>
      </select>
    </div>
    <div class="form-group">
      <label>屏幕方向</label>
      <select id="orientation">
        <option value="any" selected>任意</option>
        <option value="portrait">竖屏</option>
        <option value="landscape">横屏</option>
        <option value="portrait-primary">竖屏(主)</option>
        <option value="landscape-primary">横屏(主)</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="form-group">
      <label>主题色</label>
      <input type="color" id="themeColor" value="#4F46E5">
    </div>
    <div class="form-group">
      <label>背景色</label>
      <input type="color" id="backgroundColor" value="#ffffff">
    </div>
  </div>
  <div class="form-group">
    <label>描述</label>
    <textarea id="description" placeholder="应用的简短描述...">一个PWA应用示例</textarea>
  </div>
  <div class="form-group">
    <label>图标列表 (JSON数组，可选)</label>
    <textarea id="icons" placeholder='[{"src":"/icon-192.png","sizes":"192x192","type":"image/png"},{"src":"/icon-512.png","sizes":"512x512","type":"image/png"}]'>[{"src":"/icon-192.png","sizes":"192x192","type":"image/png"},{"src":"/icon-512.png","sizes":"512x512","type":"image/png"}]</textarea>
    <div class="hint">留空则使用默认图标配置</div>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button class="btn" id="generateBtn">📄 生成manifest.json</button>
    <button class="btn btn-download" id="downloadBtn" disabled>⬇ 下载</button>
    <button class="btn btn-secondary" id="copyBtn" disabled>📋 复制</button>
  </div>
  <div class="output-area" id="output"></div>
  <div class="preview" id="preview" style="display:none;">
    <div class="app-icon">📱</div>
    <div class="app-name" id="previewName"></div>
    <div class="app-url" id="previewUrl"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<footer>
  <p>&copy; 2026 <a href="/">Free ToolBase</a> · 所有处理在浏览器本地完成</p>
</footer>
<script>
(function(){
  const nameEl = document.getElementById('name');
  const shortNameEl = document.getElementById('shortName');
  const startUrlEl = document.getElementById('startUrl');
  const scopeEl = document.getElementById('scope');
  const displayEl = document.getElementById('display');
  const orientationEl = document.getElementById('orientation');
  const themeColorEl = document.getElementById('themeColor');
  const backgroundColorEl = document.getElementById('backgroundColor');
  const descriptionEl = document.getElementById('description');
  const iconsEl = document.getElementById('icons');
  const outputEl = document.getElementById('output');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const preview = document.getElementById('preview');
  const toastEl = document.getElementById('toast');

  let manifestJson = '';

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function generate() {
    const name = nameEl.value.trim();
    if (!name) { showToast('请输入应用名称'); return; }

    const manifest = {
      name: name,
      short_name: shortNameEl.value.trim() || name.substring(0, 12),
      start_url: startUrlEl.value.trim() || '/',
      scope: scopeEl.value.trim() || '/',
      display: displayEl.value,
      orientation: orientationEl.value,
      theme_color: themeColorEl.value,
      background_color: backgroundColorEl.value,
      description: descriptionEl.value.trim() || '',
    };

    // Parse icons
    const iconsRaw = iconsEl.value.trim();
    if (iconsRaw) {
      try {
        manifest.icons = JSON.parse(iconsRaw);
      } catch(e) {
        showToast('⚠️ 图标JSON格式错误，已使用默认配置');
        manifest.icons = [
          {src: '/icon-192.png', sizes: '192x192', type: 'image/png'},
          {src: '/icon-512.png', sizes: '512x512', type: 'image/png'}
        ];
      }
    } else {
      manifest.icons = [
        {src: '/icon-192.png', sizes: '192x192', type: 'image/png'},
        {src: '/icon-512.png', sizes: '512x512', type: 'image/png'}
      ];
    }

    manifestJson = JSON.stringify(manifest, null, 2);
    outputEl.textContent = manifestJson;
    outputEl.classList.add('show');
    downloadBtn.disabled = false;
    copyBtn.disabled = false;

    // Show preview
    document.getElementById('previewName').textContent = manifest.short_name || manifest.name;
    document.getElementById('previewUrl').textContent = manifest.start_url;
    preview.style.display = 'block';

    showToast('✅ manifest.json 已生成');
  }

  function download() {
    if (!manifestJson) return;
    const blob = new Blob([manifestJson], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'manifest.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('⬇ 下载完成');
  }

  function copy() {
    if (!manifestJson) return;
    navigator.clipboard.writeText(manifestJson).then(() => showToast('📋 已复制'));
  }

  generateBtn.addEventListener('click', generate);
  downloadBtn.addEventListener('click', download);
  copyBtn.addEventListener('click', copy);
})();
</script>
</body>
</html>
