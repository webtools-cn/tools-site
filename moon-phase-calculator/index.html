  <header>

  <script>
    (function(){
      const J2000 = 2451545.0;
      const SYNODIC = 29.53058867;
      const NEW_MOON_EPOCH = 2451550.09766;
      const phaseNames = ['新月','蛾眉月','上弦月','盈凸月','满月','亏凸月','下弦月','残月'];
      const phaseEmoji = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

      function jdFromDate(date) {
        let y = date.getUTCFullYear(), m = date.getUTCMonth() + 1, d = date.getUTCDate();
        if (m <= 2) { y--; m += 12; }
        const a = Math.floor(y / 100), b = 2 - a + Math.floor(a / 4);
        return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5;
      }

      function getMoonPhase(jd) {
        const daysSinceNew = (jd - NEW_MOON_EPOCH) / SYNODIC;
        let phase = daysSinceNew - Math.floor(daysSinceNew);
        if (phase < 0) phase += 1;
        const age = phase * SYNODIC;
        const illumination = Math.round((1 - Math.cos(2 * Math.PI * phase)) / 2 * 100);
        let idx = Math.round(phase * 8) % 8;
        return { phase: idx, age: Math.round(age * 10) / 10, illumination, name: phaseNames[idx], emoji: phaseEmoji[idx] };
      }

      function getMoonRiseSet(jd, lat) {
        const phaseDays = (jd - NEW_MOON_EPOCH) / SYNODIC;
        const phase = phaseDays - Math.floor(phaseDays);
        const riseHour = (phase * 24 + 6) % 24;
        const setHour = (riseHour + 12.5) % 24;
        const fmt = h => { const hh = Math.floor(h) % 24, mm = Math.round((h % 1) * 60); return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0'); };
        return { rise: fmt(riseHour), set: fmt(setHour) };
      }

      function getNextPhaseDate(jd, targetPhase) {
        const daysSinceNew = (jd - NEW_MOON_EPOCH) / SYNODIC;
        const currentPhase = daysSinceNew - Math.floor(daysSinceNew);
        let daysToTarget = targetPhase - currentPhase;
        if (daysToTarget <= 0) daysToTarget += 1;
        const targetJD = jd + daysToTarget * SYNODIC;
        const d = new Date((targetJD - 2440587.5) * 86400000);
        return d.toISOString().slice(0,10);
      }

      function updateDisplay() {
        const dateStr = document.getElementById('dateInput').value;
        if (!dateStr) return;
        const date = new Date(dateStr + 'T12:00:00Z');
        const jd = jdFromDate(date);
        const mp = getMoonPhase(jd);
        const rs = getMoonRiseSet(jd, 35);
        document.getElementById('phaseName').textContent = mp.emoji + ' ' + mp.name;
        document.getElementById('moonAge').textContent = '月龄: ' + mp.age + ' 天';
        document.getElementById('moonIllum').textContent = '光照: ' + mp.illumination + '%';
        document.getElementById('moonrise').textContent = rs.rise;
        document.getElementById('moonset').textContent = rs.set;
        document.getElementById('nextFullMoon').textContent = getNextPhaseDate(jd, 0.5);
        document.getElementById('nextNewMoon').textContent = getNextPhaseDate(jd, 0);
        updateMoonVisual(mp.phase);
        document.querySelectorAll('.phase-chip').forEach(c => c.classList.remove('active'));
        document.querySelector('.phase-chip[data-phase="' + (mp.phase / 8) + '"]')?.classList.add('active');
      }

      function updateMoonVisual(idx) {
        const shadow = document.getElementById('moonShadow');
        const clips = [
          'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
          'polygon(0% 0%, 75% 0%, 75% 100%, 0% 100%)',
          'polygon(0% 0%, 50% 0%, 50% 100%, 0% 100%)',
          'polygon(0% 0%, 25% 0%, 25% 100%, 0% 100%)',
          'polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)',
          'polygon(100% 0%, 75% 0%, 75% 100%, 100% 100%)',
          'polygon(100% 0%, 50% 0%, 50% 100%, 100% 100%)',
          'polygon(100% 0%, 25% 0%, 25% 100%, 100% 100%)'
        ];
        shadow.style.clipPath = clips[idx] || clips[0];
      }

      document.getElementById('calcBtn').addEventListener('click', updateDisplay);
      document.getElementById('todayBtn').addEventListener('click', function(){
        document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
        updateDisplay();
      });
      document.getElementById('phaseList').addEventListener('click', function(e){
        const chip = e.target.closest('.phase-chip');
        if (!chip) return;
        const targetPhase = parseFloat(chip.dataset.phase);
        const dateStr = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
        const date = new Date(dateStr + 'T12:00:00Z');
        const jd = jdFromDate(date);
        const nextDate = getNextPhaseDate(jd, targetPhase);
        document.getElementById('dateInput').value = nextDate;
        updateDisplay();
      });

      const today = new Date().toISOString().slice(0,10);
      document.getElementById('dateInput').value = today;
      updateDisplay();
    })();
  </script>
