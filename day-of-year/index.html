  <div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>
  <script>
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function isLeapYear(y) {
      return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
    }

    function dayOfYear(date) {
      var start = new Date(date.getFullYear(), 0, 0);
      var diff = date - start;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    document.getElementById('calcBtn').addEventListener('click', function() {
      var dateVal = document.getElementById('dateInput').value;
      if (!dateVal) { showToast('请选择日期'); return; }
      var d = new Date(dateVal + 'T00:00:00');
      var year = d.getFullYear();
      var doy = dayOfYear(d);
      var leap = isLeapYear(year);
      var total = leap ? 366 : 365;
      var remaining = total - doy;

      document.getElementById('rDate').textContent = dateVal;
      document.getElementById('rDayOfYear').textContent = '第 ' + doy + ' 天';
      document.getElementById('rTotalDays').textContent = total + ' 天';
      document.getElementById('rRemaining').textContent = remaining + ' 天';
      var leapEl = document.getElementById('rLeap');
      if (leap) {
        leapEl.innerHTML = '<span class="leap-badge">是 · 闰年</span>';
      } else {
        leapEl.textContent = '否 · 平年';
        leapEl.style.fontWeight = '600';
        leapEl.style.color = 'var(--text)';
      }
      document.getElementById('resultArea').style.display = 'block';

      // 如果是当年，显示进度条
      var today = new Date();
      today.setHours(0,0,0,0);
      var isCurrentYear = (year === today.getFullYear());
      if (isCurrentYear) {
        var todayDOY = dayOfYear(today);
        var pct = Math.round((todayDOY / total) * 100);
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('progressLabel').style.display = 'flex';
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '% (' + todayDOY + '/' + total + ')';
      } else {
        document.getElementById('progressContainer').style.display = 'none';
        document.getElementById('progressLabel').style.display = 'none';
      }
    });

    // 默认今天
    var today = new Date();
    document.getElementById('dateInput').value = today.toISOString().split('T')[0];
  </script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
