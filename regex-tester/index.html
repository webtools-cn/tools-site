    const regexInput = document.getElementById('regexInput');
    const testText = document.getElementById('testText');
    const regexError = document.getElementById('regexError');
    const highlightArea = document.getElementById('highlightArea');
    const resultsDiv = document.getElementById('results');
    const replaceInput = document.getElementById('replaceInput');
    const replacePreview = document.getElementById('replacePreview');
    const explanation = document.getElementById('explanation');
    const stats = document.getElementById('stats');
    const toast = document.getElementById('toast');

    // === 标志按钮 ===
    const flagButtons = document.querySelectorAll('.flag-btn');
    flagButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
            updateAll();
        });
    });

    function getFlags() {
        const flags = [];
        flagButtons.forEach(b => { if (b.classList.contains('active')) flags.push(b.dataset.flag); });
        return flags.join('');
    }

    // === 核心：执行匹配 ===
    function updateAll() {
        const pattern = regexInput.value;
        const text = testText.value;
        const flags = getFlags();
        const replaceStr = replaceInput.value;

        if (!pattern) {
            regexError.textContent = '';
            regexError.className = 'regex-error';
            highlightArea.innerHTML = '<span style="color:var(--text-secondary)">匹配高亮将在这里显示...</span>';
            resultsDiv.innerHTML = '';
            replacePreview.innerHTML = '<span style="color:var(--text-secondary)">替换结果将在这里显示</span>';
            explanation.style.display = 'none';
            stats.innerHTML = '<span>匹配数: <strong>0</strong></span>';
            return;
        }

        let regex;
        try {
            regex = new RegExp(pattern, flags);
            regexError.textContent = '✅ 正则表达式有效';
            regexError.className = 'regex-error ok';
        } catch(e) {
            regexError.textContent = '❌ ' + e.message;
            regexError.className = 'regex-error';
            highlightArea.innerHTML = '<span style="color:var(--text-secondary)">匹配高亮将在这里显示...</span>';
            resultsDiv.innerHTML = '';
            replacePreview.innerHTML = '<span style="color:var(--text-secondary)">替换结果将在这里显示</span>';
            explanation.style.display = 'none';
            stats.innerHTML = '<span>匹配数: <strong>0</strong></span>';
            return;
        }

        // 匹配
        const matches = [];
        let match;
        if (flags.includes('g')) {
            while ((match = regex.exec(text)) !== null) {
                matches.push({ index: match.index, full: match[0], groups: match.slice(1) });
                if (match[0].length === 0) regex.lastIndex++;
            }
        } else {
            match = regex.exec(text);
            if (match) matches.push({ index: match.index, full: match[0], groups: match.slice(1) });
        }

        // 高亮
        if (matches.length === 0) {
            highlightArea.innerHTML = escapeHtml(text) || '<span style="color:var(--text-secondary)">无匹配</span>';
        } else {
            let html = '';
            let lastIdx = 0;
            for (const m of matches) {
                html += escapeHtml(text.slice(lastIdx, m.index));
                // 高亮整个匹配
                html += '<span class="match-group-0">' + escapeHtml(m.full) + '</span>';
                lastIdx = m.index + m.full.length;
            }
            html += escapeHtml(text.slice(lastIdx));
            highlightArea.innerHTML = html || '<span style="color:var(--text-secondary)">(空白文本)</span>';
        }

        // 结果列表
        if (matches.length === 0) {
            resultsDiv.innerHTML = '<div style="color:var(--text-secondary);padding:12px">未找到匹配</div>';
        } else {
            let resultsHtml = '';
            const groupColors = ['#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#6366f1'];
            matches.forEach((m, mi) => {
                resultsHtml += '<div class="result-item">';
                resultsHtml += '<div class="match-full">#' + (mi + 1) + ': ' + escapeHtml(m.full) + '</div>';
                if (m.groups.length > 0) {
                    resultsHtml += '<div class="match-groups">';
                    m.groups.forEach((g, gi) => {
                        const color = groupColors[gi % groupColors.length];
                        resultsHtml += '<span class="match-group" style="background:' + color + '22;border:1px solid ' + color + '44">';
                        resultsHtml += '<span class="group-tag" style="color:' + color + '">$' + (gi + 1) + '</span>';
                        resultsHtml += escapeHtml(g || '(空)');
                        resultsHtml += '</span>';
                    });
                    resultsHtml += '</div>';
                }
                resultsHtml += '</div>';
            });
            resultsDiv.innerHTML = resultsHtml;
        }

        // 替换预览
        if (replaceStr) {
            try {
                const replaced = text.replace(regex, replaceStr);
                replacePreview.innerHTML = escapeHtml(replaced) || '<span style="color:var(--text-secondary)">(替换后为空)</span>';
            } catch(e) {
                replacePreview.innerHTML = '<span style="color:var(--danger)">替换错误: ' + escapeHtml(e.message) + '</span>';
            }
        } else {
            replacePreview.innerHTML = '<span style="color:var(--text-secondary)">替换结果将在这里显示</span>';
        }

        // 解析正则
        try { explainRegex(pattern); } catch(e) { explanation.style.display = 'none'; }

        // 统计
        stats.innerHTML = '<span>匹配数: <strong>' + matches.length + '</strong></span>';
    }

    // === 正则解释 ===
    function explainRegex(pattern) {
        const tokens = [];
        let i = 0;
        while (i < pattern.length) {
            if (pattern[i] === '\\' && i + 1 < pattern.length) {
                const esc = pattern[i+1];
                const map = {
                    'd': '数字[0-9]', 'D': '非数字', 'w': '单词字符[a-zA-Z0-9_]', 'W': '非单词字符',
                    's': '空白字符', 'S': '非空白字符', 'b': '单词边界', 'B': '非单词边界',
                    'n': '换行符', 't': '制表符', 'r': '回车', 'f': '换页符', 'v': '垂直制表符',
                    '0': '空字符', '.': '字面点号', '*': '字面星号', '+': '字面加号',
                    '?': '字面问号', '^': '字面脱字符', '$': '字面美元号',
                    '|': '字面竖线', '(': '字面左括号', ')': '字面右括号',
                    '[': '字面左方括号', ']': '字面右方括号', '{': '字面左花括号', '}': '字面右花括号',
                };
                tokens.push({ raw: '\\' + esc, desc: map[esc] || '转义字符' });
                i += 2;
            } else if (pattern[i] === '^') { tokens.push({ raw: '^', desc: '行首锚定' }); i++; }
            else if (pattern[i] === '$') { tokens.push({ raw: '$', desc: '行尾锚定' }); i++; }
            else if (pattern[i] === '.') { tokens.push({ raw: '.', desc: '匹配任意字符(除换行)' }); i++; }
            else if (pattern[i] === '*') { tokens.push({ raw: '*', desc: '0次或多次' }); i++; }
            else if (pattern[i] === '+') { tokens.push({ raw: '+', desc: '1次或多次' }); i++; }
            else if (pattern[i] === '?') { tokens.push({ raw: '?', desc: '0次或1次 / 非贪婪' }); i++; }
            else if (pattern[i] === '|') { tokens.push({ raw: '|', desc: '或(alternation)' }); i++; }
            else if (pattern[i] === '(' && pattern[i+1] === '?') {
                let j = i+2, type = '';
                while (j < pattern.length && pattern[j] !== ')') { type += pattern[j]; j++; }
                tokens.push({ raw: pattern.slice(i, j+1), desc: '特殊分组(' + type + ')' });
                i = j + 1;
            } else if (pattern[i] === '(') { tokens.push({ raw: '(', desc: '捕获分组开始' }); i++; }
            else if (pattern[i] === ')') { tokens.push({ raw: ')', desc: '捕获分组结束' }); i++; }
            else if (pattern[i] === '[') {
                let j = i;
                while (j < pattern.length && pattern[j] !== ']') j++;
                tokens.push({ raw: pattern.slice(i, j+1), desc: '字符类' });
                i = j + 1;
            } else if (pattern[i] === '{') {
                let j = i;
                while (j < pattern.length && pattern[j] !== '}') j++;
                tokens.push({ raw: pattern.slice(i, j+1), desc: '量词/重复次数' });
                i = j + 1;
            } else {
                tokens.push({ raw: pattern[i], desc: '字面字符' });
                i++;
            }
        }
        if (tokens.length > 0) {
            let html = '<strong>🔍 正则解析:</strong><br>';
            for (const t of tokens) {
                html += '<span class="token">' + escapeHtml(t.raw) + '</span>';
                html += '<span class="token-desc">→ ' + t.desc + '</span><br>';
            }
            explanation.innerHTML = html;
            explanation.style.display = 'block';
        }
    }

    // === Helper ===
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // === Toast ===
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // === Event Listeners ===
    regexInput.addEventListener('input', updateAll);
    testText.addEventListener('input', updateAll);
    replaceInput.addEventListener('input', updateAll);
    document.getElementById('clearRegex').addEventListener('click', () => {
        regexInput.value = '';
        regexInput.dispatchEvent(new Event('input'));
        regexInput.focus();
    });
    document.getElementById('clearText').addEventListener('click', () => {
        testText.value = '';
        testText.dispatchEvent(new Event('input'));
        testText.focus();
    });
    document.getElementById('copyResults').addEventListener('click', () => {
        const resultsText = resultsDiv.textContent.trim();
        if (!resultsText || resultsText === '未找到匹配') {
            showToast('没有匹配结果可复制');
            return;
        }
        navigator.clipboard.writeText(resultsText).then(() => showToast('✅ 已复制结果到剪贴板'));
    });

    // 初始触发
    updateAll();
})();
</script>
</body>
</html>
