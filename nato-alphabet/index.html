  <meta property="og:type" content="website">

  <style>
    :root{--primary:#4F46E5;--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}
    .lang-switch a{color:var(--sub);font-size:14px;text-decoration:none;padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
    .lang-switch a:hover{color:var(--primary);border-color:var(--primary)}
    main{flex:1;max-width:900px;margin:0 auto;padding:40px 20px;width:100%}
    h1{font-size:28px;margin-bottom:8px;text-align:center}
    .subtitle{text-align:center;color:var(--sub);margin-bottom:32px}
    .card{background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--border);margin-bottom:20px}
    .card h3{font-size:16px;margin-bottom:12px}
    textarea{width:100%;min-height:120px;border:2px solid var(--border);border-radius:8px;padding:12px;font-size:16px;font-family:monospace;resize:vertical}
    textarea:focus{outline:none;border-color:var(--primary)}
    .btn-row{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
    .btn{padding:10px 24px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
    .btn-outline:hover{background:var(--primary);color:#fff}
    .output-box{min-height:80px;padding:16px;background:#f1f5f9;border-radius:8px;font-family:monospace;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:16px}
    .grid-item{background:#f1f5f9;padding:10px 12px;border-radius:8px;text-align:center;font-size:15px}
    .grid-item .letter{font-weight:700;color:var(--primary);font-size:20px}
    .grid-item .code{font-size:13px;color:var(--sub)}
    footer{text-align:center;padding:24px;color:var(--sub);font-size:13px;border-top:1px solid var(--border)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>
</head>
<body>
<header>
  <a href="/">🧰 Free ToolBase</a>
  <div class="lang-switch"><a href="/en/nato-alphabet/">English</a></div>
</header>
<main>
  <h1>📻 NATO音标字母表</h1>
  <p class="subtitle">将字母和数字转换为北约标准音标码，支持双向转换和快速查询</p>

  <div class="card">
    <h3>🔤 文本转换</h3>
    <textarea id="input" placeholder="输入文本，例如：Hello World"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnEncode">➡️ 转为音标码</button>
      <button class="btn btn-outline" id="btnDecode">⬅️ 音标码转文本</button>
      <button class="btn btn-outline" id="btnCopy">📋 复制结果</button>
      <button class="btn btn-outline" id="btnClear">🗑️ 清空</button>
    </div>
    <div class="output-box" id="output"></div>
  </div>

  <div class="card">
    <h3>📖 音标字母对照表</h3>
    <div class="grid" id="alphabetGrid"></div>
  </div>
</main>
<footer>© 2024 Free ToolBase · 纯前端工具，数据不上传服务器</footer>
<div class="toast" id="toast"></div>

<script>
const NATO = {
  'A':'Alfa','B':'Bravo','C':'Charlie','D':'Delta','E':'Echo','F':'Foxtrot',
  'G':'Golf','H':'Hotel','I':'India','J':'Juliett','K':'Kilo','L':'Lima',
  'M':'Mike','N':'November','O':'Oscar','P':'Papa','Q':'Quebec','R':'Romeo',
  'S':'Sierra','T':'Tango','U':'Uniform','V':'Victor','W':'Whiskey','X':'X-ray',
  'Y':'Yankee','Z':'Zulu',
  '0':'Zero','1':'One','2':'Two','3':'Three','4':'Four',
  '5':'Five','6':'Six','7':'Seven','8':'Eight','9':'Nine'
};
const REVERSE = {};
for (const [k,v] of Object.entries(NATO)) REVERSE[v.toLowerCase()] = k;

function encode(text) {
  return [...text.toUpperCase()].map(ch => NATO[ch] || ch).join(' ');
}

function decode(text) {
  return text.split(/\s+/).map(w => {
    const ch = REVERSE[w.toLowerCase()];
    return ch !== undefined ? ch : w;
  }).join('');
}

function renderGrid() {
  const grid = document.getElementById('alphabetGrid');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const numbers = '0123456789'.split('');
  const all = [...letters, ...numbers];
  grid.innerHTML = all.map(ch =>
    `<div class="grid-item"><div class="letter">${ch}</div><div class="code">${NATO[ch]}</div></div>`
  ).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('btnEncode').addEventListener('click', () => {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请先输入文本'); return; }
  document.getElementById('output').textContent = encode(input);
});

document.getElementById('btnDecode').addEventListener('click', () => {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请先输入音标码'); return; }
  document.getElementById('output').textContent = decode(input);
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('output').textContent;
  if (!text) { showToast('没有可复制的内容'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '';
});

renderGrid();
</script>
</body>
</html>
