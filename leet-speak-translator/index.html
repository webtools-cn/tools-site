<body>
<div class="container">
<nav class="nav-back"><a href="/">← 返回首页</a></nav>
<header class="header">
<h1>Leet语翻译器</h1>
<div class="lang-switch">
<a href="/leet-speak-translator/" class="active">中文</a>
<a href="/en/leet-speak-translator/">EN</a>
</div>
</header>
<div class="input-section" id="app">
<h2>文本 ↔ Leet语</h2>
<label>输入文本</label><textarea id="input-text" placeholder="在此输入文本..."></textarea>
<div class="row"><div class="field"><label>Leet风格</label><select id="leet-style" style="width:100%;padding:10px 12px;background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.2);border-radius:8px;font-size:.9rem;margin-bottom:12px"><option value="basic">基本 (a→4, e→3, i→1, o→0)</option><option value="advanced">高级 (全字母映射)</option><option value="extreme">极限 (含符号)</option></select></div></div>
<div class="btn-row">
<button class="btn btn-primary" id="btn-to-leet">→ Leet语</button>
<button class="btn btn-primary" id="btn-from-leet">← 还原文本</button>
<button class="btn btn-success" id="btn-copy">复制结果</button>
<button class="btn btn-warning" id="btn-clear">清除</button>
</div>
<label style="margin-top:12px">输出结果</label><div class="output-box" id="output"></div>
</div>
<footer><p>© Free ToolBase · 纯前端处理，数据不上传 · <a href="/privacy-policy/">隐私政策</a> · <a href="/terms-of-service/">服务条款</a></p></footer>
</div>
<div class="toast" id="toast"></div>
<script>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板 / Copied!')}).catch(function(){showToast('复制失败 / Copy failed')})}

var basic={a:'4',e:'3',i:'1',o:'0',s:'5',t:'7'};
var advanced={a:'4',b:'8',e:'3',g:'9',i:'1',o:'0',s:'5',t:'7',z:'2',l:'1'};
var extreme={a:'@',b:'|3',c:'<',d:'|)',e:'3',f:'|=',g:'6',h:'|-|',i:'!',j:'_|',k:'|<',l:'|_',m:'/\\/\\',n:'/\\/',o:'0',p:'|*',q:'(,)',r:'|2',s:'5',t:'7',u:'|_|',v:'\\/',w:'\\/\\/',x:'><',y:'`/',z:'2',A:'@',B:'|3',C:'<',D:'|)',E:'3',F:'|=',G:'6',H:'|-|',I:'!',J:'_|',K:'|<',L:'|_',M:'/\\/\\',N:'/\\/',O:'0',P:'|*',Q:'(,)',R:'|2',S:'5',T:'7',U:'|_|',V:'\\/',W:'\\/\\/',X:'><',Y:'`/',Z:'2'};
var revBasic={},revAdvanced={},revExtreme={};
Object.keys(basic).forEach(function(k){revBasic[basic[k]]=k});
Object.keys(advanced).forEach(function(k){revAdvanced[advanced[k]]=k});
Object.keys(extreme).forEach(function(k){revExtreme[extreme[k]]=k});

document.getElementById('btn-to-leet').addEventListener('click',function(){
  var text=document.getElementById('input-text').value;
  var style=document.getElementById('leet-style').value;
  var map=style==='basic'?basic:(style==='advanced'?advanced:extreme);
  var result='';
  for(var i=0;i<text.length;i++){result+=map[text[i]]||text[i]}
  document.getElementById('output').textContent=result;
});
document.getElementById('btn-from-leet').addEventListener('click',function(){
  var text=document.getElementById('input-text').value;
  var style=document.getElementById('leet-style').value;
  var revMap=style==='basic'?revBasic:(style==='advanced'?revAdvanced:revExtreme);
  var sorted=Object.keys(revMap).sort(function(a,b){return b.length-a.length});
  var result=text;
  for(var i=0;i<sorted.length;i++){result=result.split(sorted[i]).join(revMap[sorted[i]])}
  document.getElementById('output').textContent=result;
});
document.getElementById('btn-copy').addEventListener('click',function(){var v=document.getElementById('output').textContent;if(v)copyText(v);else showToast('无内容可复制')});
document.getElementById('btn-clear').addEventListener('click',function(){document.getElementById('input-text').value='';document.getElementById('output'.textContent=''};</script>
</body>
