<script>
// 全局数据
var fileBytes = null;
var fileName = '';
var searchResults = [];
var currentSearchIdx = -1;
var editedBytes = {}; // {offset: newValue}

// DOM元素
var fileInput = document.getElementById('fileInput');
var searchInput = document.getElementById('searchInput');
var searchBtn = document.getElementById('searchBtn');
var searchPrevBtn = document.getElementById('searchPrevBtn');
var exportBtn = document.getElementById('exportBtn');
var sampleBtn = document.getElementById('sampleBtn');
var fileInfo = document.getElementById('fileInfo');
var hexBody = document.getElementById('hexBody');
var toast = document.getElementById('toast');

// Toast通知
function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '') + ' show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(function(){ toast.className = 'toast'; }, 2500);
}

// 文件上传处理
fileInput.addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) {
    showToast('文件过大，建议小于50MB', true);
    return;
  }
  fileName = file.name;
  fileInfo.textContent = file.name + ' (' + formatSize(file.size) + ')';
  editedBytes = {};
  searchResults = [];
  currentSearchIdx = -1;
  var reader = new FileReader();
  reader.onload = function(ev) {
    fileBytes = new Uint8Array(ev.target.result);
    renderHex();
    showToast('已加载: ' + file.name);
  };
  reader.readAsArrayBuffer(file);
});

// 加载示例数据
sampleBtn.addEventListener('click', function() {
  // 创建一个包含常见文件头的示例数据
  var sampleData = new Uint8Array([
    0x50, 0x4B, 0x03, 0x04, 0x14, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x48, 0x65, 0x6C, 0x6C,
    0x6F, 0x20, 0x57, 0x6F, 0x72, 0x6C, 0x64, 0x21, 0x0A, 0x54, 0x68, 0x69, 0x73, 0x20, 0x69, 0x73,
    0x20, 0x61, 0x20, 0x73, 0x61, 0x6D, 0x70, 0x6C, 0x65, 0x20, 0x66, 0x69, 0x6C, 0x65, 0x20, 0x66,
    0x6F, 0x72, 0x20, 0x48, 0x45, 0x58, 0x20, 0x65, 0x64, 0x69, 0x74, 0x6F, 0x72, 0x20, 0x64, 0x65,
    0x6D, 0x6F, 0x2E, 0x0A, 0xFF, 0xD8, 0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0x00, 0x01,
    0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A, 0x00, 0x00, 0x00, 0x0D, 0x49, 0x48, 0x44, 0x52
  ]);
  fileName = 'sample.bin';
  fileBytes = sampleData;
  editedBytes = {};
  searchResults = [];
  currentSearchIdx = -1;
  fileInfo.textContent = 'sample.bin (' + formatSize(sampleData.length) + ')';
  renderHex();
  showToast('已加载示例数据 — 包含ZIP头、文本、JPEG头和PNG头');
});

// 格式化文件大小
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

// 渲染十六进制视图
function renderHex() {
  if (!fileBytes || fileBytes.length === 0) {
    hexBody.innerHTML = '<div class="empty-state"><div class="icon">📂</div><p>上传文件以查看十六进制内容</p><p style="font-size:.8rem;margin-top:8px">支持所有文件格式，纯浏览器端处理</p></div>';
    return;
  }
  var html = '';
  var bytesPerRow = 16;
  var totalRows = Math.ceil(fileBytes.length / bytesPerRow);
  
  for (var row = 0; row < totalRows; row++) {
    var offset = row * bytesPerRow;
    var offsetHex = offset.toString(16).toUpperCase().padStart(8, '0');
    html += '<div class="hex-row" data-offset="' + offset + '">';
    html += '<div class="offset">' + offsetHex + '</div>';
    
    // Hex字节
    html += '<div class="hex-bytes">';
    for (var col = 0; col < bytesPerRow; col++) {
      var idx = offset + col;
      if (idx >= fileBytes.length) {
        html += '<span></span>';
      } else {
        var byteVal = editedBytes.hasOwnProperty(idx) ? editedBytes[idx] : fileBytes[idx];
        var hexVal = byteVal.toString(16).toUpperCase().padStart(2, '0');
        var highlightClass = isByteHighlighted(idx) ? ' highlight' : '';
        var editClass = editedBytes.hasOwnProperty(idx) ? ' editing' : '';
        html += '<span class="hex-byte' + highlightClass + editClass + '" data-offset="' + idx + '" title="Offset: 0x' + offsetHex + ' + ' + col + '">' + hexVal + '</span>';
      }
    }
    html += '</div>';
    
    // ASCII
    html += '<div class="ascii">';
    for (var col2 = 0; col2 < bytesPerRow; col2++) {
      var idx2 = offset + col2;
      if (idx2 >= fileBytes.length) {
        html += '<span></span>';
      } else {
        var byteVal2 = editedBytes.hasOwnProperty(idx2) ? editedBytes[idx2] : fileBytes[idx2];
        var char = (byteVal2 >= 32 && byteVal2 <= 126) ? String.fromCharCode(byteVal2) : '.';
        var hlClass = isByteHighlighted(idx2) ? ' highlight' : '';
        html += '<span class="ascii-char' + hlClass + '" data-offset="' + idx2 + '">' + escapeHtml(char) + '</span>';
      }
    }
    html += '</div>';
    html += '</div>';
  }
  hexBody.innerHTML = html;
  bindHexEvents();
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 检查字节是否高亮（搜索结果）
function isByteHighlighted(offset) {
  if (searchResults.length === 0 || currentSearchIdx < 0) return false;
  var current = searchResults[currentSearchIdx];
  return offset >= current && offset < current + searchBytes.length;
}

// 绑定十六进制点击事件（编辑）
function bindHexEvents() {
  var hexBytes = hexBody.querySelectorAll('.hex-byte');
  hexBytes.forEach(function(span) {
    span.addEventListener('click', function() {
      var offset = parseInt(this.getAttribute('data-offset'));
      startEditHex(offset, this);
    });
  });
  
  var asciiChars = hexBody.querySelectorAll('.ascii-char');
  asciiChars.forEach(function(span) {
    span.addEventListener('click', function() {
      var offset = parseInt(this.getAttribute('data-offset'));
      startEditAscii(offset, this);
    });
  });
}

// 开始编辑HEX值
function startEditHex(offset, element) {
  var byteVal = editedBytes.hasOwnProperty(offset) ? editedBytes[offset] : fileBytes[offset];
  var oldHex = byteVal.toString(16).toUpperCase().padStart(2, '0');
  var input = document.createElement('input');
  input.type = 'text';
  input.value = oldHex;
  input.style.cssText = 'width:24px;background:#0f172a;color:#facc15;border:1px solid #facc15;border-radius:3px;text-align:center;font-family:monospace;font-size:inherit;padding:0';
  input.maxLength = 2;
  element.textContent = '';
  element.appendChild(input);
  input.focus();
  input.select();
  
  function finishEdit(save) {
    if (save) {
      var val = input.value.trim().toUpperCase();
      if (/^[0-9A-F]{1,2}$/.test(val)) {
        var newByte = parseInt(val, 16);
        if (newByte !== fileBytes[offset]) {
          editedBytes[offset] = newByte;
        } else {
          delete editedBytes[offset];
        }
      } else {
        showToast('无效的十六进制值', true);
      }
    }
    renderHex();
  }
  
  input.addEventListener('blur', function(){ finishEdit(true); });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { finishEdit(true); }
    else if (e.key === 'Escape') { finishEdit(false); }
  });
}

// 开始编辑ASCII字符
function startEditAscii(offset, element) {
  var byteVal = editedBytes.hasOwnProperty(offset) ? editedBytes[offset] : fileBytes[offset];
  var oldChar = (byteVal >= 32 && byteVal <= 126) ? String.fromCharCode(byteVal) : '';
  var input = document.createElement('input');
  input.type = 'text';
  input.value = oldChar;
  input.style.cssText = 'width:16px;background:#0f172a;color:#facc15;border:1px solid #facc15;border-radius:3px;text-align:center;font-family:monospace;font-size:inherit;padding:0';
  input.maxLength = 1;
  element.textContent = '';
  element.appendChild(input);
  input.focus();
  input.select();
  
  function finishEdit(save) {
    if (save) {
      var val = input.value;
      if (val.length === 1) {
        var newByte = val.charCodeAt(0);
        if (newByte >= 0 && newByte <= 255) {
          if (newByte !== fileBytes[offset]) {
            editedBytes[offset] = newByte;
          } else {
            delete editedBytes[offset];
          }
        } else {
          showToast('无效字符', true);
        }
      } else if (val.length === 0) {
        // 空输入视为不修改
      } else {
        showToast('请输入单个字符', true);
      }
    }
    renderHex();
  }
  
  input.addEventListener('blur', function(){ finishEdit(true); });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { finishEdit(true); }
    else if (e.key === 'Escape') { finishEdit(false); }
  });
}

// 搜索功能
var searchBytes = null;

searchBtn.addEventListener('click', function() {
  performSearch(true);
});

searchPrevBtn.addEventListener('click', function() {
  performSearch(false);
});

searchInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    performSearch(!e.shiftKey);
  }
});

function performSearch(forward) {
  if (!fileBytes || fileBytes.length === 0) {
    showToast('请先上传文件', true);
    return;
  }
  var query = searchInput.value.trim();
  if (!query) {
    showToast('请输入搜索内容', true);
    return;
  }
  
  // 解析搜索内容
  searchBytes = parseSearchQuery(query);
  if (!searchBytes || searchBytes.length === 0) {
    showToast('无效的搜索内容', true);
    return;
  }
  
  // 搜索
  var startOffset = 0;
  if (searchResults.length > 0 && currentSearchIdx >= 0) {
    if (forward) {
      startOffset = searchResults[currentSearchIdx] + 1;
    } else {
      startOffset = searchResults[currentSearchIdx] - 1;
    }
  }
  
  var found = -1;
  if (forward) {
    found = findBytes(searchBytes, startOffset);
  } else {
    found = findBytesReverse(searchBytes, startOffset);
  }
  
  if (found >= 0) {
    // 检查是否已存在于结果中
    var existingIdx = searchResults.indexOf(found);
    if (existingIdx >= 0) {
      currentSearchIdx = existingIdx;
    } else {
      searchResults.push(found);
      searchResults.sort(function(a, b) { return a - b; });
      currentSearchIdx = searchResults.indexOf(found);
    }
    scrollToOffset(found);
    renderHex();
    showToast('找到匹配，偏移: 0x' + found.toString(16).toUpperCase().padStart(8, '0') + ' (' + (currentSearchIdx + 1) + '/' + searchResults.length + ')');
  } else {
    if (searchResults.length > 0) {
      // 循环搜索
      if (forward) {
        found = findBytes(searchBytes, 0);
      } else {
        found = findBytesReverse(searchBytes, fileBytes.length - 1);
      }
      if (found >= 0) {
        var wrapIdx = searchResults.indexOf(found);
        if (wrapIdx >= 0) {
          currentSearchIdx = wrapIdx;
        }
        scrollToOffset(found);
        renderHex();
        showToast('已循环，偏移: 0x' + found.toString(16).toUpperCase().padStart(8, '0'));
        return;
      }
    }
    showToast('未找到匹配', true);
  }
}

function parseSearchQuery(query) {
  // 检测是否为HEX格式
  var hexPattern = /^[0-9A-Fa-f\s]+$/;
  if (hexPattern.test(query)) {
    var hexStr = query.replace(/\s+/g, '');
    if (hexStr.length % 2 !== 0) {
      return null;
    }
    var bytes = [];
    for (var i = 0; i < hexStr.length; i += 2) {
      bytes.push(parseInt(hexStr.substring(i, i + 2), 16));
    }
    return bytes;
  }
  // 否则作为ASCII文本
  var bytes = [];
  for (var i = 0; i < query.length; i++) {
    var code = query.charCodeAt(i);
    if (code > 255) {
      return null;
    }
    bytes.push(code);
  }
  return bytes;
}

function findBytes(searchBytes, startOffset) {
  var maxOffset = fileBytes.length - searchBytes.length;
  for (var i = startOffset; i <= maxOffset; i++) {
    var match = true;
    for (var j = 0; j < searchBytes.length; j++) {
      var byteVal = editedBytes.hasOwnProperty(i + j) ? editedBytes[i + j] : fileBytes[i + j];
      if (byteVal !== searchBytes[j]) {
        match = false;
        break;
      }
    }
    if (match) return i;
  }
  return -1;
}

function findBytesReverse(searchBytes, startOffset) {
  for (var i = startOffset; i >= 0; i--) {
    var match = true;
    for (var j = 0; j < searchBytes.length; j++) {
      var byteVal = editedBytes.hasOwnProperty(i + j) ? editedBytes[i + j] : fileBytes[i + j];
      if (byteVal !== searchBytes[j]) {
        match = false;
        break;
      }
    }
    if (match) return i;
  }
  return -1;
}

function scrollToOffset(offset) {
  var rowOffset = Math.floor(offset / 16) * 16;
  var rowEl = hexBody.querySelector('.hex-row[data-offset="' + rowOffset + '"]');
  if (rowEl) {
    rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// 导出功能
exportBtn.addEventListener('click', function() {
  if (!fileBytes || fileBytes.length === 0) {
    showToast('没有文件可导出', true);
    return;
  }
  
  var editedCount = Object.keys(editedBytes).length;
  var exportBytes = new Uint8Array(fileBytes.length);
  for (var i = 0; i < fileBytes.length; i++) {
    exportBytes[i] = editedBytes.hasOwnProperty(i) ? editedBytes[i] : fileBytes[i];
  }
  
  var blob = new Blob([exportBytes], { type: 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var exportName = fileName.replace(/(\.[^.]+)$/, '_modified$1');
  if (exportName === fileName) exportName = fileName + '.modified';
  a.href = url;
  a.download = exportName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  var msg = '已导出: ' + exportName;
  if (editedCount > 0) msg += ' (' + editedCount + ' 处修改)';
  showToast(msg);
});
