<body>
<div class="container">
  <div class="nav-back"><a href="/">← 返回首页</a></div>
  <div class="header">
    <h1>🏥 BEE基础能量消耗计算器</h1>
    <div class="lang-switch">
      <a href="/basal-energy-expenditure/" class="active">中文</a>
      <a href="/en/basal-energy-expenditure/">EN</a>
    </div>
  </div>

  <div class="section">
    <h2>📊 输入参数</h2>
    <div class="gender-row">
      <div class="gender-option selected" id="gender-male" onclick="setGender('male')">👨 男性</div>
      <div class="gender-option" id="gender-female" onclick="setGender('female')">👩 女性</div>
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>年龄 (岁)</label>
        <input type="number" id="age" value="40" min="10" max="120" step="1">
      </div>
      <div class="input-group">
        <label>身高 (cm)</label>
        <input type="number" id="height" value="170" min="100" max="250" step="0.1">
      </div>
      <div class="input-group">
        <label>体重 (kg)</label>
        <input type="number" id="weight" value="70" min="30" max="300" step="0.1">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="calculate()">🔍 计算</button>
      <button class="btn btn-secondary" onclick="clearAll()">🔄 清空</button>
    </div>
  </div>

  <div class="section" id="results" style="display:none">
    <h2>📈 计算结果</h2>
    <div class="result-grid">
      <div class="result-card">
        <div class="label">BEE 基础能量消耗</div>
        <div class="value" id="bee-value">0</div>
        <div class="sub">kcal/天</div>
      </div>
      <div class="result-card">
        <div class="label">每日总能量需求 (TEE)</div>
        <div class="value" id="tee-value">0</div>
        <div class="sub">kcal/天 (含活动+应激)</div>
      </div>
    </div>
    <h2 style="margin-top:16px;font-size:1rem;color:#f1f5f9">📋 应激因子调整后能量需求</h2>
    <table class="factor-table">
      <tr><td>🛌 卧床静养 (×1.1)</td><td id="tee-bed">0</td></tr>
      <tr><td>🤒 轻度应激/术后 (×1.2)</td><td id="tee-mild">0</td></tr>
      <tr><td>🏥 中度应激/感染 (×1.4)</td><td id="tee-moderate">0</td></tr>
      <tr><td>🔥 严重创伤/烧伤 (×1.6)</td><td id="tee-severe">0</td></tr>
      <tr><td>💪 重度应激/多器官衰竭 (×2.0)</td><td id="tee-critical">0</td></tr>
    </table>
    <div class="info-box" id="advice"></div>
  </div>
</div>

<script>
var gender="male";
function setGender(g){
  gender=g;
  document.getElementById("gender-male").className=g==="male"?"gender-option selected":"gender-option";
  document.getElementById("gender-female").className=g==="female"?"gender-option selected":"gender-option";
}
function calculate(){
  var age=parseFloat(document.getElementById("age").value)||40;
  var h=parseFloat(document.getElementById("height").value)||170;
  var w=parseFloat(document.getElementById("weight").value)||70;
  // Harris-Benedict
  var bee;
  if(gender==="male")bee=66.5+13.75*w+5.003*h-6.775*age;
  else bee=655.1+9.563*w+1.85*h-4.676*age;
  bee=Math.round(bee);
  document.getElementById("bee-value").textContent=bee.toLocaleString();
  document.getElementById("tee-value").textContent=Math.round(bee*1.4).toLocaleString();
  document.getElementById("tee-bed").textContent=Math.round(bee*1.1).toLocaleString()+" kcal";
  document.getElementById("tee-mild").textContent=Math.round(bee*1.2).toLocaleString()+" kcal";
  document.getElementById("tee-moderate").textContent=Math.round(bee*1.4).toLocaleString()+" kcal";
  document.getElementById("tee-severe").textContent=Math.round(bee*1.6).toLocaleString()+" kcal";
  document.getElementById("tee-critical").textContent=Math.round(bee*2.0).toLocaleString()+" kcal";
  document.getElementById("advice").textContent="💡 BEE代表基础状态下的能量消耗。临床营养中根据应激因子调整，通常使用×1.2-1.4倍。严重烧伤患者可达×2.0。本工具仅作参考，请遵医嘱。";
  document.getElementById("results").style.display="block";
}
function clearAll(){
  document.getElementById("age").value=40;
  document.getElementById("height").value=170;
  document.getElementById("weight").value=70;
  setGender("male");
  document.getElementById("results").style.display="none";
}
</script>
