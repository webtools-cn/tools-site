    <!-- 设置区 -->

        <div class="time-entry">

      </div>

        <button class="btn btn-outline btn-sm" onclick="addEntry()">+ 添加打卡段</button>
        <button class="btn btn-primary" onclick="calculate()">🔢 计算工时</button>
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 导出CSV</button>

  <div class="toast" id="toast"></div>

  <script>
    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTimeStr(totalMin) {
      const sign = totalMin < 0 ? '-' : '';
      const abs = Math.abs(totalMin);
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return sign + h + '小时' + (m > 0 ? m + '分钟' : '');
    }

    function addEntry() {
      const container = document.getElementById('timeEntries');
      const entry = document.createElement('div');
      entry.className = 'time-entry';
      entry.innerHTML = `
        <div class="field">
          <label>上班时间</label>
          <input type="time" class="time-start" value="09:00">
        </div>
        <div class="field">
          <label>下班时间</label>
          <input type="time" class="time-end" value="18:00">
        </div>
        <button class="btn btn-remove" onclick="removeEntry(this)" title="删除此行">✕</button>
      `;
      container.appendChild(entry);
    }

    function removeEntry(btn) {
      const entries = document.querySelectorAll('#timeEntries .time-entry');
      if (entries.length <= 1) {
        showToast('至少保留一条打卡记录');
        return;
      }
      btn.closest('.time-entry').remove();
      calculate();
    }

    function getBreakOverlap(sessionStart, sessionEnd, breakStart, breakEnd) {
      if (breakStart === undefined || breakEnd === undefined) return 0;
      const overlapStart = Math.max(sessionStart, breakStart);
      const overlapEnd = Math.min(sessionEnd, breakEnd);
      return Math.max(0, overlapEnd - overlapStart);
    }

    function calculate() {
      const starts = document.querySelectorAll('.time-start');
      const ends = document.querySelectorAll('.time-end');
      const standardHours = parseFloat(document.getElementById('standardHours').value) || 8;
      const breakMinutes = parseInt(document.getElementById('breakMinutes').value) || 0;
      const breakStartVal = document.getElementById('breakStart').value;
      const breakEndVal = document.getElementById('breakEnd').value;

      let breakStartMin = breakStartVal ? timeToMinutes(breakStartVal) : undefined;
      let breakEndMin = breakEndVal ? timeToMinutes(breakEndVal) : undefined;

      // 如果午休结束小于开始（跨天），加24小时
      if (breakStartMin !== undefined && breakEndMin !== undefined && breakEndMin <= breakStartMin) {
        breakEndMin += 24 * 60;
      }

      let totalWorkMin = 0;
      let totalBreakDeducted = 0;
      let sessionCount = 0;

      for (let i = 0; i < starts.length; i++) {
        const startVal = starts[i].value;
        const endVal = ends[i].value;
        if (!startVal || !endVal) continue;

        let startMin = timeToMinutes(startVal);
        let endMin = timeToMinutes(endVal);

        // 如果结束时间小于开始时间，视为跨天（夜班）
        if (endMin <= startMin) {
          endMin += 24 * 60;
        }

        const sessionMin = endMin - startMin;
        if (sessionMin <= 0) continue;

        // 计算午休重叠
        let breakOverlap = 0;
        if (breakStartMin !== undefined && breakEndMin !== undefined && breakMinutes > 0) {
          // 扩展午休窗口以覆盖可能的跨天
          breakOverlap = getBreakOverlap(startMin, endMin, breakStartMin, breakEndMin);
          if (breakEndMin > 24 * 60) {
            breakOverlap += getBreakOverlap(startMin, endMin, breakStartMin - 24 * 60, breakEndMin - 24 * 60);
          }
          breakOverlap = Math.min(breakOverlap, breakMinutes);
        }

        totalWorkMin += (sessionMin - breakOverlap);
        totalBreakDeducted += breakOverlap;
        sessionCount++;
      }

      const totalHours = (totalWorkMin / 60).toFixed(2);
      const standardMin = standardHours * 60;
      const overtimeMin = Math.max(0, totalWorkMin - standardMin);
      const overtimeHours = (overtimeMin / 60).toFixed(2);
      const efficiency = standardMin > 0 ? Math.round((totalWorkMin / standardMin) * 100) : 0;

      // 更新汇总栏
      document.getElementById('summaryBar').style.display = 'flex';
      document.getElementById('totalHours').textContent = totalHours;
      document.getElementById('overtimeHours').textContent = overtimeHours;
      document.getElementById('breakDeducted').textContent = totalBreakDeducted;

      // 更新结果卡片
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('rTotalHours').textContent = totalHours;
      document.getElementById('rTotalMinutes').textContent = totalWorkMin;
      document.getElementById('rOvertime').textContent = overtimeHours;
      document.getElementById('rSessions').textContent = sessionCount;
      document.getElementById('rBreakTime').textContent = totalBreakDeducted;
      document.getElementById('rEfficiency').textContent = efficiency + '%';
    }

    function exportCSV() {
      const starts = document.querySelectorAll('.time-start');
      const ends = document.querySelectorAll('.time-end');
      let csv = '段号,上班时间,下班时间,时长(分钟)\n';
      let hasData = false;

      for (let i = 0; i < starts.length; i++) {
        const startVal = starts[i].value;
        const endVal = ends[i].value;
        if (!startVal || !endVal) continue;
        let startMin = timeToMinutes(startVal);
        let endMin = timeToMinutes(endVal);
        if (endMin <= startMin) endMin += 24 * 60;
        const duration = endMin - startMin;
        csv += `${i + 1},${startVal},${endVal},${duration}\n`;
        hasData = true;
      }

      if (!hasData) {
        showToast('请先填写打卡时间');
        return;
      }

      const totalWorkMin = parseInt(document.getElementById('rTotalMinutes').textContent) || 0;
      const overtimeHours = document.getElementById('rOvertime').textContent;
      csv += `\n总工作时间(分钟),${totalWorkMin}\n`;
      csv += `加班时长(小时),${overtimeHours}\n`;

      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'work-hours-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV已下载');
    }

    function resetAll() {
      document.getElementById('standardHours').value = '8';
      document.getElementById('breakMinutes').value = '60';
      document.getElementById('breakStart').value = '12:00';
      document.getElementById('breakEnd').value = '13:00';

      const container = document.getElementById('timeEntries');
      container.innerHTML = `
        <div class="time-entry">
          <div class="field">
            <label>上班时间</label>
            <input type="time" class="time-start" value="09:00">
          </div>
          <div class="field">
            <label>下班时间</label>
            <input type="time" class="time-end" value="18:00">
          </div>
          <button class="btn btn-remove" onclick="removeEntry(this)" title="删除此行">✕</button>
        </div>
      `;

      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('summaryBar').style.display = 'none';
      showToast('已重置');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 页面加载时自动计算一次
    calculate();

    // 任何输入变化时自动计算
    document.addEventListener('input', function(e) {
      if (e.target.closest('#timeEntries') || e.target.closest('.settings-row') || e.target.closest('.card')) {
        calculate();
      }
    });
  </script>
