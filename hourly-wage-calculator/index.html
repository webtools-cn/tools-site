<main>
  <h1>⏰ 时薪计算器</h1>
  <p class="subtitle">月薪/年薪换算时薪，了解你的时间价值</p>
  <div class="card">
    <div class="form-group"><label>💼 薪资类型</label><select id="salaryType"><option value="monthly" selected>月薪</option><option value="annual">年薪</option></select></div>

<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
document.getElementById('salaryType').addEventListener('change',function(){
  var label = document.getElementById('salaryLabel');
  label.textContent = this.value === 'monthly' ? '💰 月薪（元）' : '💰 年薪（元）';
});

document.getElementById('btnCalc').addEventListener('click',function(){
  var salary = parseFloat(document.getElementById('salary').value) || 0;
  var type = document.getElementById('salaryType').value;
  var workDays = parseInt(document.getElementById('workDays').value) || 5;
  var workHours = parseInt(document.getElementById('workHours').value) || 8;

  if(salary <= 0){ showToast('请输入有效的薪资金额'); return; }

  var monthly = type === 'monthly' ? salary : salary / 12;
  var annual = type === 'annual' ? salary : salary * 12;
  var weekly = monthly / 4.345;
  var daily = weekly / workDays;
  var hourly = daily / workHours;
  var perMinute = hourly / 60;
  var perSecond = perMinute / 60;

  document.getElementById('finalResult').textContent = '¥' + hourly.toFixed(2);
  document.getElementById('detail').innerHTML =
    '月薪：¥' + monthly.toFixed(2) + ' | 年薪：¥' + annual.toFixed(2) +
    '<br>每周' + workDays + '天，每天' + workHours + '小时';
  document.getElementById('valDaily').textContent = '¥' + daily.toFixed(0);
  document.getElementById('valWeekly').textContent = '¥' + weekly.toFixed(0);
  document.getElementById('valMinute').textContent = '¥' + perMinute.toFixed(2);
  document.getElementById('valSecond').textContent = '¥' + perSecond.toFixed(3);
  document.getElementById('result').style.display = 'block';
});

document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('salary').value = '15000';
  document.getElementById('workDays').value = '5';
  document.getElementById('workHours').value = '8';
  document.getElementById('result').style.display = 'none';
});
</script>

<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
