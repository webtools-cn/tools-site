<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
function luhnChecksum(num){
  var arr=num.toString().split('').reverse();
  var sum=0;
  for(var i=0;i<arr.length;i++){
    var d=parseInt(arr[i]);
    if(i%2===1){d*=2;if(d>9)d-=9}
    sum+=d;
  }
  return (10-(sum%10))%10;
}
var prefixes={visa:['4'],mastercard:['51','52','53','54','55'],amex:['34','37'],discover:['6011']};
var lengths={visa:16,mastercard:16,amex:15,discover:16};
var brands={visa:'Visa',mastercard:'MasterCard',amex:'American Express',discover:'Discover'};
function generateCard(type){
  var pre=prefixes[type][Math.floor(Math.random()*prefixes[type].length)];
  var len=lengths[type];
  var num=pre;
  while(num.length<len-1){num+=Math.floor(Math.random()*10)}
  num+=luhnChecksum(num);
  return num;
}
document.getElementById('btnGen').addEventListener('click',function(){
  var type=document.getElementById('cardType').value;
  var cnt=parseInt(document.getElementById('count').value)||1;
  var cards=[];
  for(var i=0;i<cnt;i++)cards.push(generateCard(type));
  document.getElementById('cardNum').textContent=cards.join('\n');
  document.getElementById('cardBrand').textContent=brands[type];
  document.getElementById('cardLen').textContent=lengths[type]+'位';
  var now=new Date();
  var mm=now.getMonth()+1;mm=mm<10?'0'+mm:mm;
  document.getElementById('cardExp').textContent='有效期 '+mm+'/'+(now.getFullYear()+3);
  document.getElementById('result').style.display='block';
});
document.getElementById('btnCopy').addEventListener('click',function(){
  var t=document.getElementById('cardNum').textContent;
  navigator.clipboard.writeText(t).then(function(){showToast('已复制到剪贴板')});
});
</script>
