<body>
<header><h1>📋 过户费用计算器</h1><p>估算购房过户成本 · 契税/中介费/评估费</p></header>
<div class="container">
  <div class="card">
    <h2>📋 房产信息</h2>
    <div class="row">
      <div class="form-group"><label>房屋成交价 (元)</label><input type="number" id="housePrice" value="3000000" min="0" step="10000"></div>
      <div class="form-group"><label>房产类型</label><select id="propertyType"><option value="new">新房</option><option value="resale">二手房</option></select></div>
    </div>
    <div class="row">
      <div class="form-group"><label>是否首套房</label><select id="firstHome"><option value="yes">是 (首套)</option><option value="no">否 (二套及以上)</option></select></div>
      <div class="form-group"><label>房屋面积 (㎡)</label><input type="number" id="area" value="90" min="0" step="1"></div>
    </div>
    <button class="btn" id="calcBtn">🔍 计算过户费</button>
    <button class="btn-secondary" id="clearBtn" style="margin-left:8px">🗑 清空</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 过户费用明细</h2>
    <div id="results"></div>
  </div>
</div>

<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

<script>
(function() {
  var calcBtn = document.getElementById('calcBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultsCard = document.getElementById('resultsCard');
  var resultsEl = document.getElementById('results');

  function formatMoney(num) {
    if (Math.abs(num) >= 10000) return (num / 10000).toFixed(2) + ' 万';
    return num.toFixed(0);
  }

  function calculate() {
    var price = parseFloat(document.getElementById('housePrice').value) || 0;
    var pType = document.getElementById('propertyType').value;
    var firstHome = document.getElementById('firstHome').value;
    var area = parseFloat(document.getElementById('area').value) || 0;

    if (price <= 0) { resultsCard.style.display = 'block'; resultsEl.innerHTML = '<p style="text-align:center;color:#ef4444">⚠️ 请输入有效的房屋成交价</p>'; return; }

    // 契税: 首套≤90㎡: 1%, >90㎡: 1.5%; 二套: 3%
    var deedTaxRate;
    if (firstHome === 'yes') {
      deedTaxRate = area <= 90 ? 0.01 : 0.015;
    } else {
      deedTaxRate = 0.03;
    }
    var deedTax = price * deedTaxRate;

    // 中介费: ~2% (二手房更高)
    var agentRate = pType === 'resale' ? 0.025 : 0.015;
    var agentFee = price * agentRate;

    // 评估费: 0.1%-0.5%
    var appraisalFee = price * 0.002;

    // 登记费: 固定
    var regFee = 80;

    // 印花税: 0.05%
    var stampDuty = price * 0.0005;

    // 公证费: 0.3%
    var notaryFee = price * 0.003;

    // 贷款服务费: 贷款金额的0.5%-1%
    var loanServiceFee = price * 0.7 * 0.005;

    // 维修基金: ~50-100元/㎡
    var maintenanceFund = area * 70;

    var total = deedTax + agentFee + appraisalFee + regFee + stampDuty + notaryFee + loanServiceFee + maintenanceFund;
    var pctOfPrice = (total / price * 100).toFixed(2);

    resultsCard.style.display = 'block';
    resultsEl.innerHTML =
      '<div class="result-row"><span class="label">🏠 房屋总价</span><span class="value">¥' + formatMoney(price) + '</span></div>' +
      '<div class="result-row"><span class="label">📜 契税 (' + (deedTaxRate*100).toFixed(1) + '%)</span><span class="value">¥' + formatMoney(deedTax) + '</span></div>' +
      '<div class="result-row"><span class="label">🏢 中介费</span><span class="value">¥' + formatMoney(agentFee) + '</span></div>' +
      '<div class="result-row"><span class="label">📊 评估费</span><span class="value">¥' + formatMoney(appraisalFee) + '</span></div>' +
      '<div class="result-row"><span class="label">📝 登记费</span><span class="value">¥' + regFee.toFixed(0) + '</span></div>' +
      '<div class="result-row"><span class="label">📄 印花税</span><span class="value">¥' + formatMoney(stampDuty) + '</span></div>' +
      '<div class="result-row"><span class="label">⚖️ 公证费</span><span class="value">¥' + formatMoney(notaryFee) + '</span></div>' +
      '<div class="result-row"><span class="label">🏦 贷款服务费</span><span class="value">¥' + formatMoney(loanServiceFee) + '</span></div>' +
      '<div class="result-row"><span class="label">🔧 维修基金</span><span class="value">¥' + formatMoney(maintenanceFund) + '</span></div>' +
      '<div class="highlight">💰 过户总费用: ¥' + formatMoney(total) + ' (占房价 ' + pctOfPrice + '%)</div>';
  }

  function clearAll() {
    document.getElementById('housePrice').value = '3000000';
    document.getElementById('propertyType').value = 'new';
    document.getElementById('firstHome').value = 'yes';
    document.getElementById('area').value = '90';
    resultsCard.style.display = 'none';
  }

  calcBtn.addEventListener('click', calculate);
  clearBtn.addEventListener('click', clearAll);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') calculate();
  });
})();
</script>
</body>
