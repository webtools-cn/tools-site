<body>
<div class="container">
<header class="header">
<h1>💰 月总收入计算器</h1>

<div class="section">
<h2>输入您的收入信息</h2>

<div class="form-row">
<div class="form-group">
<label>收入金额</label>
<input type="number" id="amount" placeholder="例如: 5000" min="0" value="5000">
</div>
<div class="form-group">
<label>收入周期</label>
<select id="period">
<option value="hourly">时薪</option>
<option value="daily">日薪</option>
<option value="weekly">周薪</option>
<option value="monthly" selected>月薪</option>
<option value="yearly">年薪</option>
</select>
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>每周工作小时数</label>
<input type="number" id="hoursPerWeek" placeholder="例如: 40" min="1" max="168" value="40">
</div>
<div class="form-group">
<label>税率（可选）%</label>
<input type="number" id="taxRate" placeholder="例如: 20" min="0" max="100" value="0">
</div>
</div>

<button class="btn btn-primary btn-block" id="calculate">🔍 计算收入</button>

<div id="result"></div>
</div>

<div class="section">
<h2>💡 收入转换说明</h2>
<p style="color:var(--text-secondary);font-size:.9rem;line-height:1.8">
<strong>转换公式：</strong><br>
• 时薪 → 月薪：时薪 × 每周工作小时数 × 4.33（月平均周数）<br>
• 月薪 → 年薪：月薪 × 12<br>
• 年薪 → 月薪：年薪 ÷ 12<br>
• 日薪 → 月薪：日薪 × 21.67（月平均工作日）<br>
<strong>注意：</strong>以上为税前收入（毛收入），税后收入 = 税前收入 × (1 - 税率%)。
</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var amountEl=document.getElementById('amount');
var periodEl=document.getElementById('period');
var hoursEl=document.getElementById('hoursPerWeek');
var taxEl=document.getElementById('taxRate');
var calcBtn=document.getElementById('calculate');
var resultDiv=document.getElementById('result');
var toast=document.getElementById('toast');

function showToast(msg){
toast.textContent=msg;toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show')},2000);
}

function formatMoney(n){
return '¥'+Math.round(n).toLocaleString('zh-CN');
}

function formatMoneyEN(n){
return '$'+Math.round(n).toLocaleString('en-US');
}

calcBtn.addEventListener('click',function(){
var amount=parseFloat(amountEl.value)||0;
var period=periodEl.value;
var hoursPerWeek=parseFloat(hoursEl.value)||40;
var taxRate=(parseFloat(taxEl.value)||0)/100;

if(amount<=0){showToast('请输入有效收入金额');return;}
if(hoursPerWeek<1||hoursPerWeek>168){showToast('每周工作小时数需在1-168之间');return;}

var monthly;
switch(period){
case 'hourly': monthly=amount*hoursPerWeek*4.33;break;
case 'daily': monthly=amount*21.67;break;
case 'weekly': monthly=amount*4.33;break;
case 'monthly': monthly=amount;break;
case 'yearly': monthly=amount/12;break;
default: monthly=amount;
}

var yearly=monthly*12;
var weekly=monthly/4.33;
var daily=monthly/21.67;
var hourly=weekly/hoursPerWeek;

var netMonthly=monthly*(1-taxRate);
var netYearly=yearly*(1-taxRate);

var html='<div class="result-card">';
html+='<div class="big-number">'+formatMoney(monthly)+' <span class="unit">/月（税前）</span></div>';
if(taxRate>0){
html+='<div style="color:var(--text-secondary);font-size:.85rem;margin-top:4px">税后：'+formatMoney(netMonthly)+' /月</div>';
}
html+='<div class="result-row">';
html+='<div class="result-item"><div class="label">时薪</div><div class="value">'+formatMoney(hourly)+'</div></div>';
html+='<div class="result-item"><div class="label">日薪</div><div class="value">'+formatMoney(daily)+'</div></div>';
html+='<div class="result-item"><div class="label">周薪</div><div class="value">'+formatMoney(weekly)+'</div></div>';
html+='<div class="result-item"><div class="label">年薪</div><div class="value">'+formatMoney(yearly)+'</div></div>';
html+='</div></div>';
resultDiv.innerHTML=html;
var existingBtn=resultDiv.querySelector('.copy-btn');
if(!existingBtn){
var copyBtn=document.createElement('button');
copyBtn.className='btn copy-btn btn-block';
copyBtn.textContent='📋 Copy Results';
copyBtn.addEventListener('click',function(){
var txt='';
resultDiv.querySelectorAll('.result-item .label,.result-item .value,.big-number').forEach(function(el){txt+=el.textContent+' ';});
navigator.clipboard.writeText(txt.trim()).then(function(){showToast('Copied!')});
});
resultDiv.appendChild(copyBtn);
}
});

calcBtn.click();
})();
</script>
