  <h1>💸 AA制分账计算器</h1>
  <p class="subtitle">快速计算每人应付金额，支持小费和自定义分摊</p>
  <div class="card">
    <div class="form-group"><label>💰 账单总额（元）</label><input type="number" id="totalAmount" placeholder="输入账单金额" step="0.01" min="0"></div>
    <div class="row">

<script>
document.getElementById('btnCalc').addEventListener('click',()=>{
  const total=parseFloat(document.getElementById('totalAmount').value);
  const people=parseInt(document.getElementById('people').value);
  const tip=parseFloat(document.getElementById('tipPercent').value)||0;
  if(isNaN(total)||total<=0){alert('请输入有效账单金额');return}
  if(isNaN(people)||people<1){alert('人数至少为1');return}
  const withTip=total*(1+tip/100);
  const ratiosStr=document.getElementById('ratios').value.trim();
  let perPerson,detail;
  if(ratiosStr){
    const ratios=ratiosStr.split(',').map(Number);
    const sum=ratios.reduce((a,b)=>a+b,0);
    perPerson=0;
    detail='自定义分摊：<br>'+ratios.map((r,i)=>`第${i+1}人：¥${(withTip*r/sum).toFixed(2)} (${r}/${sum})`).join('<br>');
    document.getElementById('perPerson').textContent='自定义';
  }else{
    perPerson=withTip/people;
    detail=`总金额：¥${total.toFixed(2)} | 小费：${tip}% | 应付总额：¥${withTip.toFixed(2)}<br>${people}人均分，每人 ¥${perPerson.toFixed(2)}`;
    document.getElementById('perPerson').textContent='¥'+perPerson.toFixed(2);
  }
  document.getElementById('detail').innerHTML=detail;
  document.getElementById('result').style.display='block';
});
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
