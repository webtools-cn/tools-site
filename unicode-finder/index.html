<div id="toast"></div>
<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    this.classList.add('active');
    document.getElementById('charMode').style.display = this.dataset.mode === 'char' ? 'block' : 'none';
    document.getElementById('codeMode').style.display = this.dataset.mode === 'codepoint' ? 'block' : 'none';
  });
});

function lookup(cp){
  var c = String.fromCodePoint(cp);
  var hex = cp.toString(16).toUpperCase().padStart(4, '0');
  var uHex = 'U+' + hex;
  var utf8 = encodeURIComponent(c).replace(/%/g, '').toUpperCase();
  var htmlEntity = '&#' + cp + ';';
  var htmlHex = '&#x' + hex + ';';
  try {
    var jsEscape = JSON.stringify(c).slice(1,-1);
  } catch(e) { jsEscape = 'N/A'; }

  return {
    char: c,
    codepoint: uHex,
    decimal: cp,
    utf8: Array.from(new TextEncoder().encode(c)).map(function(b){return b.toString(16).toUpperCase().padStart(2,'0')}).join(' '),
    utf16: Array.from(c).length > 1 ? '超出BMP' : c.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0'),
    htmlEntity: htmlEntity,
    htmlHex: htmlHex,
    jsEscape: jsEscape
  };
}

function showResult(info){
  document.getElementById('result').innerHTML =
    '<div class="char-display">' + info.char + '</div>' +
    '<div class="info-grid">' +
    '<div class="info-item"><div class="key">Unicode码点</div><div class="val">' + info.codepoint + '</div></div>' +
    '<div class="info-item"><div class="key">十进制</div><div class="val">' + info.decimal + '</div></div>' +
    '<div class="info-item"><div class="key">UTF-8</div><div class="val">' + info.utf8 + '</div></div>' +
    '<div class="info-item"><div class="key">UTF-16</div><div class="val">' + info.utf16 + '</div></div>' +
    '<div class="info-item"><div class="key">HTML实体</div><div class="val">' + info.htmlEntity + '</div></div>' +
    '<div class="info-item"><div class="key">HTML十六进制</div><div class="val">' + info.htmlHex + '</div></div>' +
    '<div class="info-item"><div class="key">JS转义</div><div class="val">' + info.jsEscape + '</div></div>' +
    '</div>';
}

document.getElementById('lookupBtn').addEventListener('click', function(){
  var cp;
  if (document.querySelector('.tab.active').dataset.mode === 'char') {
    var c = document.getElementById('charInput').value;
    if (!c) { toast('请输入字符'); return; }
    cp = c.codePointAt(0);
  } else {
    var inp = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!inp) { toast('请输入码点'); return; }
    if (inp.startsWith('U+')) { cp = parseInt(inp.slice(2), 16); }
    else if (inp.startsWith('0X')) { cp = parseInt(inp, 16); }
    else if (/^[0-9]+$/.test(inp)) { cp = parseInt(inp, 10); }
    else { cp = parseInt(inp, 16); }
  }
  if (isNaN(cp) || cp < 0 || cp > 0x10FFFF) { toast('无效的码点'); return; }
  try { showResult(lookup(cp)); } catch(e) { toast('查找失败'); }
});

document.querySelectorAll('.range-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    var start = parseInt(this.dataset.start);
    var chars = [];
    for (var i = start; i <= Math.min(parseInt(this.dataset.end), start + 99); i++){
      try { chars.push(String.fromCodePoint(i)); } catch(e) { break; }
    }
    document.getElementById('result').innerHTML =
      '<h4>' + this.textContent + '字符 (' + parseInt(this.dataset.start).toString(16).toUpperCase() + '-' + parseInt(this.dataset.end).toString(16).toUpperCase() + ')</h4>' +
      '<div style="display:flex;flex-wrap:wrap;gap:4px;font-size:1.5rem;margin-top:8px;">' +
      chars.map(function(ch){return '<span style="cursor:pointer;padding:4px;" onclick="document.getElementById(\'charInput\').value=\''+ch+'\';document.getElementById(\'lookupBtn\').click()">'+ch+'</span>'}).join('') +
      '</div>';
  });
});
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
