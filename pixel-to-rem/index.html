    <h1>📐 像素转REM</h1>
<div style="background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);border-radius:8px;padding:12px 16px;margin:12px 0;color:#22d3ee;font-size:.9rem">📌 此工具已合并至 <a href="/pixel-converter/" style="color:#22d3ee;text-decoration:underline">pixel converter</a></div>
    <p class="desc">在线将像素(px)转换为rem单位。输入像素值和根字体大小（默认16px），自动计算对应的rem值，前端CSS开发必备工具。</p>
    <div class="section">
      <div class="row">
        <div class="input-group">
          <label for="pxInput">像素值 (px)</label>
          <input type="number" id="pxInput" value="16" min="0" step="0.1">
        </div>
        <div class="input-group">
          <label for="baseInput">根字体大小 (px)</label>
          <select id="baseInput">
            <option value="10">10px</option>
            <option value="16" selected>16px（默认）</option>
            <option value="20">20px</option>
          </select>
        </div>
      </div>
      <div class="result-display">
        <div class="big" id="remResult">1rem</div>
        <div class="small">计算公式: px ÷ 根字体大小 = rem</div>
      </div>
      <div class="conversion-table">
        <h4>常用换算参考（基准16px）</h4>
        <table>
          <thead><tr><th>像素</th><th>REM</th><th>像素</th><th>REM</th></tr></thead>
          <tbody id="refTable"></tbody>
        </table>
      </div>
    </div>
  </main>
<!-- AdSense -->

  <script>
    const pxInput = document.getElementById('pxInput');
    const baseInput = document.getElementById('baseInput');
    const remResult = document.getElementById('remResult');
    const refTable = document.getElementById('refTable');

    function update() {
      const px = parseFloat(pxInput.value);
      const base = parseFloat(baseInput.value);
      if (isNaN(px) || px < 0) { remResult.textContent = '—'; return; }
      const rem = px / base;
      remResult.textContent = Number.isInteger(rem) ? rem + 'rem' : rem.toFixed(4) + 'rem';
    }

    function buildRefTable() {
      const commonPx = [1,2,4,8,10,12,14,16,18,20,24,28,32,36,40,48,56,64,72,80,96,128];
      let html = '';
      for (let i = 0; i < commonPx.length; i += 2) {
        const px1 = commonPx[i];
        const rem1 = (px1 / 16).toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
        const px2 = commonPx[i+1] || '';
        const rem2 = px2 ? (px2 / 16).toFixed(4).replace(/0+$/,'').replace(/\.$/,'') : '';
        html += `<tr><td>${px1}px</td><td>${rem1}rem</td><td>${px2 ? px2+'px' : ''}</td><td>${rem2 ? rem2+'rem' : ''}</td></tr>`;
      }
      refTable.innerHTML = html;
    }

    pxInput.addEventListener('input', update);
    baseInput.addEventListener('change', update);
    buildRefTable();
    update();
  </script>
