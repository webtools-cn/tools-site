<script>
function luhn(nums){let sum=0,alt=false;for(let i=nums.length-1;i>=0;i--){let n=parseInt(nums[i]);if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
function genPrefix(type){if(type==='visa')return '4'+(Math.random()*1e15|0).toString().padStart(15,'0');if(type==='mc'){const p=['51','52','53','54','55'];return p[Math.random()*5|0]+(Math.random()*1e14|0).toString().padStart(14,'0')}if(type==='amex'){const p=Math.random()<0.5?'34':'37';return p+(Math.random()*1e13|0).toString().padStart(13,'0')}return '6011'+(Math.random()*1e12|0).toString().padStart(12,'0')}
function makeValid(type){let num=genPrefix(type);while(!luhn(num)){const digits=num.split('');digits[digits.length-1]=Math.random()*10|0;num=digits.join('')}return num}
function fmtNum(n,t){if(t==='amex')return n.replace(/(\d{4})(\d{6})(\d{5})/,'$1 $2 $3');return n.replace(/(\d{4})(?=\d)/g,'$1 ')}
function generate(){const type=document.getElementById('type').value,n=parseInt(document.getElementById('cnt').value);const labels={visa:'Visa',mc:'MasterCard',amex:'Amex',discover:'Discover'};let html='';for(let i=0;i<n;i++){const num=makeValid(type);const exp=`${String(Math.random()*12+1|0).padStart(2,'0')}/${(new Date().getFullYear()+2)%100}`;html+=`<div class="card"><span class="num">${fmtNum(num,type)}</span><span class="info">${labels[type]} | Exp: ${exp} | CVV: ${Math.random()*900+100|0}</span></div>`}document.getElementById('result').innerHTML=html}
function copyAll(){const cards=document.querySelectorAll('.card .num');let txt='';cards.forEach(c=>{txt+=c.textContent.replace(/\s/g,'')+'\n'});navigator.clipboard.writeText(txt.trim());document.getElementById('toast').textContent='已复制!';document.getElementById('toast').style.display='block';setTimeout(()=>document.getElementById('toast').style.display='none',2000)}
</script>
