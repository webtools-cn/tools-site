  <p class="subtitle">输入每笔债务信息，选择还款策略，查看还款计划</p>
  <div class="card">

<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
let debtCount=1;
function addDebtRow(){
  debtCount++;
  var div=document.createElement('div');
  div.className='debt-row';
  div.id='debt-row-'+debtCount;
  div.innerHTML='<button class="remove-btn" onclick="removeDebt('+debtCount+')">\u00d7</button>'+
    '<div class="row"><div class="form-group"><label>债务名称</label><input type="text" id="debt'+debtCount+'" placeholder="债务名称"></div>'+
    '<div class="form-group"><label>欠款金额（元）</label><input type="number" id="bal'+debtCount+'" min="0" step="0.01"></div></div>'+
    '<div class="row"><div class="form-group"><label>年利率 (%)</label><input type="number" id="rate'+debtCount+'" min="0" max="100" step="0.1"></div>'+
    '<div class="form-group"><label>每月最低还款（元）</label><input type="number" id="min'+debtCount+'" min="0" step="0.01"></div></div>';
  document.getElementById('debts-container').appendChild(div);
}
function removeDebt(id){
  var el=document.getElementById('debt-row-'+id);
  if(el)el.remove();
}
document.getElementById('btnCalc').addEventListener('click',function(){
  var method=document.getElementById('method').value;
  var extra=parseFloat(document.getElementById('extraPayment').value)||0;
  var debts=[];
  for(var i=1;i<=debtCount;i++){
    var row=document.getElementById('debt-row-'+i);
    if(!row)continue;
    var nameEl=document.getElementById('debt'+i);
    var name=nameEl?nameEl.value:'债务名称';
    var bal=parseFloat((document.getElementById('bal'+i)||{}).value)||0;
    var rate=parseFloat((document.getElementById('rate'+i)||{}).value)||0;
    var min=parseFloat((document.getElementById('min'+i)||{}).value)||0;
    if(bal>0)debts.push({name:name,bal:bal,rate:rate/100,min:min,orig:bal});
  }
  if(debts.length===0){showToast('请至少添加一笔债务');return;}
  var totalMin=debts.reduce(function(s,d){return s+d.min;},0)+extra;
  var months=0,totalPaid=0;
  var timeline=[];
  var maxMonths=Math.min(600,debts.reduce(function(s,d){return s+Math.ceil(d.bal/Math.max(d.min,1));},0)+100);
  while(debts.some(function(d){return d.bal>0.01;})&&months<600){
    months++;
    var paidThisMonth=0;
    for(var j=0;j<debts.length;j++){
      var d=debts[j];
      if(d.bal<=0.01)continue;
      var pay=Math.min(d.min,d.bal);
      d.bal-=pay;paidThisMonth+=pay;
    }
    var remaining=totalMin-paidThisMonth;
    if(method==='snowball'){
      debts.sort(function(a,b){return a.bal-b.bal;});
    }else{
      debts.sort(function(a,b){return b.rate-a.rate;});
    }
    for(var k=0;k<debts.length;k++){
      var dd=debts[k];
      if(dd.bal<=0.01||remaining<=0)continue;
      var pay2=Math.min(remaining,dd.bal);
      dd.bal-=pay2;remaining-=pay2;paidThisMonth+=pay2;
    }
    totalPaid+=paidThisMonth;
    if(months%4===0||months===1){
      var row2={month:months,total:totalPaid};
      debts.forEach(function(d){row2[d.name]=(d.orig-d.bal).toFixed(0);});
      timeline.push(row2);
    }
  }
  var names=debts.map(function(d){return d.name;});
  var totalOrig=debts.reduce(function(s,d){return s+d.orig;},0);
  var methodLabel=method==='snowball'?'雪球法（先还小债务）':'雪崩法（先还高利率）';
  var html='<div style="text-align:left"><div class="result-item"><span class="label">还款策略</span><span class="value">'+methodLabel+'</span></div>';
  html+='<div class="result-item"><span class="label">总还款月数</span><span class="value">'+months+' 个月</span></div>';
  html+='<div class="result-item"><span class="label">原始总债务</span><span class="value">¥'+totalOrig.toFixed(2)+'</span></div>';
  html+='<div class="result-item"><span class="label">总还款金额</span><span class="value highlight">¥'+totalPaid.toFixed(2)+'</span></div>';
  html+='<div class="result-item"><span class="label">额外月供</span><span class="value">¥'+extra.toFixed(2)+'</span></div>';
  html+='<table><tr><th>月份</th>'+names.map(function(n){return '<th>'+n+'</th>';}).join('')+'<th>累计还款</th></tr>';
  timeline.forEach(function(r){
    html+='<tr><td>'+r.month+'</td>'+names.map(function(n){return '<td>¥'+(r[n]||'0')+'</td>';}).join('')+'<td>¥'+r.total.toFixed(0)+'</td></tr>';
  });
  html+='</table></div>';
  document.getElementById('result').innerHTML=html;
  document.getElementById('result').style.display='block';
});
document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('result').style.display='none';
  document.getElementById('result').innerHTML='';
  document.getElementById('extraPayment').value='0';
  while(debtCount>1)removeDebt(debtCount--);
  document.getElementById('debt1').value='债务名称1_NAME';
  document.getElementById('bal1').value='10000';
  document.getElementById('rate1').value='18';
  document.getElementById('min1').value='200';
});
</script>
<script>
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
