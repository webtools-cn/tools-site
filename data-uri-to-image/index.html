<header><h1>🔗 Data URI 转图片</h1>
<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">在线Data URI转图片工具，将Base64编码的Data URI解码为图片文件，支持PNG/JPG/GIF/SVG/WebP格式下载</p></header>

  <div class="card">
    <h2>输入 Data URI</h2>

<div class="toast" id="toast"></div>
<script>
const uriInput = document.getElementById('uriInput');
const previewContainer = document.getElementById('preview-container');
const errorMsg = document.getElementById('errorMsg');
const infoMsg = document.getElementById('infoMsg');
const toast = document.getElementById('toast');

let currentBlob = null;
let currentExt = 'png';

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function decodeURI(uri) {
  errorMsg.textContent = '';
  const match = uri.match(/^data:(image\/\w+);base64,(.+)$/i);
  if (!match) {
    throw new Error('无效的 Data URI 格式，需要以 data:image/...;base64,... 开头');
  }
  const mimeType = match[1];
  const base64 = match[2].replace(/\s/g, '');
  const byteChars = atob(base64);
  const byteArr = new Uint8Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
  const extMap = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/svg+xml': 'svg', 'image/webp': 'webp', 'image/bmp': 'bmp', 'image/x-icon': 'ico' };
  return { blob: new Blob([byteArr], { type: mimeType }), ext: extMap[mimeType] || 'png' };
}

document.getElementById('btnDecode').addEventListener('click', () => {
  errorMsg.textContent = '';
  const val = uriInput.value.trim();
  if (!val) { showToast('请先输入 Data URI'); return; }
  try {
    const { blob, ext } = decodeURI(val);
    currentBlob = blob;
    currentExt = ext;
    const url = URL.createObjectURL(blob);
    previewContainer.innerHTML = `<img src="${url}" alt="预览图片">`;
    infoMsg.textContent = `格式: ${blob.type} | 大小: ${(blob.size / 1024).toFixed(1)} KB`;
  } catch(e) {
    errorMsg.textContent = '❌ ' + e.message;
    previewContainer.innerHTML = '<span style="color:var(--text2)">解码失败</span>';
  }
});

document.getElementById('btnDownload').addEventListener('click', () => {
  if (!currentBlob) { showToast('请先解码'); return; }
  const url = URL.createObjectURL(currentBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `image.${currentExt}`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('下载中...');
});

document.getElementById('btnClear').addEventListener('click', () => {
  uriInput.value = '';
  currentBlob = null;
  previewContainer.innerHTML = '<span style="color:var(--text2)">解码后在此预览</span>';
  errorMsg.textContent = '';
  infoMsg.textContent = '';
});
</script>
