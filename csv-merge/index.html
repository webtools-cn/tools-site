<body>
  <header>

  <main>
    <h1>CSV 合并工具</h1>
    <p class="desc">上传多个CSV文件，自动对齐列名并合并为一个文件。支持保留或去除重复表头。</p>
    <div class="card">
      <h2>📁 上传文件</h2>
      <div class="file-zone" id="dropZone">
        <p>点击选择或拖拽 CSV 文件到此处</p>
        <input type="file" id="fileInput" accept=".csv" multiple hidden>
      </div>
      <div class="file-list" id="fileList"></div>
      <div class="options">
        <label><input type="checkbox" id="removeHeaders" checked> 去除重复表头（仅保留第一个文件的表头）</label>
        <label><input type="checkbox" id="addSourceCol"> 添加来源列</label>
      </div>
      <button class="btn btn-primary" id="mergeBtn" disabled>合并并下载</button>
    </div>
    <div class="card" id="previewCard" style="display:none">
      <h2>📊 预览结果</h2>
      <div class="stats" id="stats"></div>
      <div style="overflow-x:auto;margin-top:12px">
        <table class="preview-table" id="previewTable"></table>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 Free ToolBase · 免费在线工具</p></footer>
  <div class="toast" id="toast"></div>
  <script>
    let files = [];
    const MAX_FILES = 20, MAX_SIZE = 10 * 1024 * 1024;

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'error' : '');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function parseCSV(text) {
      const rows = [], lines = text.split(/\r?\n/).filter(l => l.trim());
      for (const line of lines) {
        const cols = [], re = /(?:^|,)(\"(?:[^\"]+|\"\")*\"|[^,]*)/g, matches = line.matchAll(re);
        for (const m of matches) {
          let v = (m[1] || '').replace(/^\"|\"$/g, '').replace(/\"\"/g, '"');
          cols.push(v);
        }
        if (cols.length > 0) rows.push(cols);
      }
      return rows;
    }

    function mergeCSVs() {
      const removeHeaders = document.getElementById('removeHeaders').checked;
      const addSourceCol = document.getElementById('addSourceCol').checked;
      const allHeaders = new Set();
      const dataBlocks = [];

      for (let i = 0; i < files.length; i++) {
        const rows = parseCSV(files[i].text);
        if (rows.length === 0) continue;
        const header = rows[0];
        header.forEach(h => allHeaders.add(h));
        const body = rows.slice(1);
        if (addSourceCol) {
          header.push('_source_file');
          body.forEach(r => r.push(files[i].name));
        }
        dataBlocks.push({ header, body, name: files[i].name });
      }

      if (dataBlocks.length === 0) return null;

      // 构建统一表头
      const unifiedHeader = [...allHeaders];
      if (addSourceCol) unifiedHeader.push('_source_file');

      const mergedRows = [];
      for (let i = 0; i < dataBlocks.length; i++) {
        const { header, body } = dataBlocks[i];
        if (i === 0 || !removeHeaders) {
          mergedRows.push([...unifiedHeader]);
        }
        for (const row of body) {
          const newRow = unifiedHeader.map(h => {
            const idx = header.indexOf(h);
            return idx >= 0 && idx < row.length ? row[idx] : '';
          });
          mergedRows.push(newRow);
        }
      }

      return { header: unifiedHeader, rows: mergedRows };
    }

    function rowsToCSV(header, rows) {
      const esc = v => /[,"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      const lines = [header.map(esc).join(',')];
      rows.forEach(r => lines.push(r.map(esc).join(',')));
      return lines.join('\n');
    }

    function downloadCSV(csv, filename) {
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function renderFileList() {
      const el = document.getElementById('fileList');
      el.innerHTML = files.map((f, i) =>
        `<div class="file-item"><span>📄 ${f.name} (${(f.size/1024).toFixed(1)} KB)</span><button class="remove-btn" data-idx="${i}">×</button></div>`
      ).join('');
      document.getElementById('mergeBtn').disabled = files.length < 2;
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          files.splice(parseInt(btn.dataset.idx), 1);
          renderFileList();
          document.getElementById('previewCard').style.display = 'none';
        });
      });
    }

    function handleFiles(newFiles) {
      for (const f of newFiles) {
        if (files.length >= MAX_FILES) { showToast(`最多${MAX_FILES}个文件`, true); break; }
        if (f.size > MAX_SIZE) { showToast(`${f.name} 超过10MB限制`, true); continue; }
        if (!f.name.toLowerCase().endsWith('.csv')) { showToast(`${f.name} 不是CSV文件`, true); continue; }
        const reader = new FileReader();
        reader.onload = e => {
          files.push({ name: f.name, size: f.size, text: e.target.result });
          renderFileList();
        };
        reader.readAsText(f);
      }
    }

    document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));
    document.getElementById('dropZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--primary)'; });
    document.getElementById('dropZone').addEventListener('dragleave', e => { e.currentTarget.style.borderColor = 'var(--border)'; });
    document.getElementById('dropZone').addEventListener('drop', e => {
      e.preventDefault(); e.currentTarget.style.borderColor = 'var(--border)';
      handleFiles(e.dataTransfer.files);
    });

    document.getElementById('mergeBtn').addEventListener('click', () => {
      const result = mergeCSVs();
      if (!result) { showToast('没有可合并的数据', true); return; }
      const csv = rowsToCSV(result.header, result.rows);
      downloadCSV(csv, 'merged.csv');
      
      // preview
      const previewRows = result.rows.slice(0, 50);
      document.getElementById('previewTable').innerHTML =
        '<thead><tr>' + result.header.map(h => `<th>${h}</th>`).join('') + '</tr></thead>' +
        '<tbody>' + previewRows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody>';
      document.getElementById('stats').innerHTML =
        `<span>📋 ${result.header.length} 列</span><span>📝 ${result.rows.length} 行</span><span>📁 ${files.length} 个文件</span>`;
      document.getElementById('previewCard').style.display = 'block';
      showToast('合并完成，已下载！');
    });
  </script>
