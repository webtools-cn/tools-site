<body>
<div class="container">
<div class="nav-back"><a href="/">← 返回首页</a></div>
<div class="header">
<h1>实时字符计数器</h1>
<div class="lang-switch"><a class="active" href="/live-character-counter/">中文</a><a href="/en/live-character-counter/">English</a></div>
</div>
<div class="main-layout">
<div class="tool-section">
<h2>输入文本</h2>
<textarea id="inputText" placeholder="在此输入或粘贴文本，统计信息将实时更新..."></textarea>
<div class="actions">
<button class="btn btn-primary" onclick="copyText()">复制文本</button>
<button class="btn btn-secondary" onclick="clearAll()">清空</button>
</div>
</div>
<div class="tool-section">
<h2>统计结果</h2>
<div class="stat-item"><span class="stat-label">总字符数</span><span class="stat-value" id="charCount">0</span></div>
<div class="stat-item"><span class="stat-label">字符数（不含空格）</span><span class="stat-value" id="charNoSpace">0</span></div>
<div class="stat-item"><span class="stat-label">单词数</span><span class="stat-value" id="wordCount">0</span></div>
<div class="stat-item"><span class="stat-label">中文字数</span><span class="stat-value" id="cnWordCount">0</span></div>
<div class="stat-item"><span class="stat-label">行数</span><span class="stat-value" id="lineCount">0</span></div>
<div class="stat-item"><span class="stat-label">段落数</span><span class="stat-value" id="paraCount">0</span></div>
<div class="stat-item"><span class="stat-label">字节数 (UTF-8)</span><span class="stat-value" id="byteCount">0</span></div>
<div class="stat-item"><span class="stat-label">句子数</span><span class="stat-value" id="sentCount">0</span></div>
<div class="stat-item"><span class="stat-label">阅读时间</span><span class="stat-value" id="readTime">0 分钟</span></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<footer>&copy; 2026 Free ToolBase · <a href="/about/">关于</a> · <a href="/contact/">联系</a> · <a href="/privacy/">隐私</a> · <a href="/terms/">条款</a></footer>
<script>
const input=document.getElementById('inputText');
const stats={charCount:document.getElementById('charCount'),charNoSpace:document.getElementById('charNoSpace'),wordCount:document.getElementById('wordCount'),cnWordCount:document.getElementById('cnWordCount'),lineCount:document.getElementById('lineCount'),paraCount:document.getElementById('paraCount'),byteCount:document.getElementById('byteCount'),sentCount:document.getElementById('sentCount'),readTime:document.getElementById('readTime')};

function updateStats(){
  const t=input.value;
  stats.charCount.textContent=t.length;
  stats.charNoSpace.textContent=t.replace(/\s/g,'').length;
  stats.wordCount.textContent=(t.trim()?t.trim().split(/\s+/).length:0);
  stats.cnWordCount.textContent=(t.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  stats.lineCount.textContent=(t?t.split('\n').length:0);
  stats.paraCount.textContent=(t.trim()?t.trim().split(/\n\s*\n/).filter(p=>p.trim()).length:0);
  stats.byteCount.textContent=new TextEncoder().encode(t).length;
  stats.sentCount.textContent=(t.match(/[.!?。！？\n]+/g)||[]).length||(t.trim()?1:0);
  const wpm=200,words=stats.wordCount.textContent*1;
  stats.readTime.textContent=(words>0?Math.max(1,Math.ceil(words/wpm)):0)+' 分钟';
}
input.addEventListener('input',updateStats);

function copyText(){
  navigator.clipboard.writeText(input.value).then(()=>showToast('已复制到剪贴板'));
}
function clearAll(){input.value='';updateStats();showToast('已清空');}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
