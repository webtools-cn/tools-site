<body>
<header>
  <a href="/">🏠 Free ToolBase</a>
  <span>iCal日历事件生成器</span>
</header>
<div class="container">
  <h1>📅 iCal日历事件生成器</h1>
  <p class="subtitle">快速创建.ics日历文件，支持导入Google Calendar、Outlook、Apple Calendar</p>

  <div class="form-group">
    <label>事件标题 *</label>
    <input type="text" id="title" placeholder="例如：团队周会" required>
  </div>
  <div class="row">
    <div class="form-group">
      <label>开始时间 *</label>
      <input type="datetime-local" id="startTime">
    </div>
    <div class="form-group">
      <label>结束时间 *</label>
      <input type="datetime-local" id="endTime">
    </div>
  </div>
  <div class="form-group">
    <label>地点</label>
    <input type="text" id="location" placeholder="例如：会议室A / 线上Zoom链接">
  </div>
  <div class="form-group">
    <label>描述</label>
    <textarea id="description" placeholder="事件的详细描述..."></textarea>
  </div>
  <div class="row">
    <div class="form-group">
      <label>提醒</label>
      <select id="alarm">
        <option value="0">不提醒</option>
        <option value="5">5分钟前</option>
        <option value="15" selected>15分钟前</option>
        <option value="30">30分钟前</option>
        <option value="60">1小时前</option>
        <option value="1440">1天前</option>
      </select>
    </div>
    <div class="form-group">
      <label>重复规则</label>
      <select id="freq">
        <option value="">不重复</option>
        <option value="DAILY">每天</option>
        <option value="WEEKLY">每周</option>
        <option value="MONTHLY">每月</option>
        <option value="YEARLY">每年</option>
      </select>
    </div>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button class="btn" id="generateBtn">📄 生成.ics文件</button>
    <button class="btn btn-download" id="downloadBtn" disabled>⬇ 下载.ics文件</button>
    <button class="btn btn-secondary" id="copyBtn" disabled>📋 复制内容</button>
  </div>
  <div class="output-area" id="output"></div>
</div>
<div class="toast" id="toast"></div>
<footer>
  <p>&copy; 2026 <a href="/">Free ToolBase</a> · 所有处理在浏览器本地完成</p>
</footer>
<script>
(function(){
  const titleEl = document.getElementById('title');
  const startEl = document.getElementById('startTime');
  const endEl = document.getElementById('endTime');
  const locationEl = document.getElementById('location');
  const descEl = document.getElementById('description');
  const alarmEl = document.getElementById('alarm');
  const freqEl = document.getElementById('freq');
  const outputEl = document.getElementById('output');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const toastEl = document.getElementById('toast');

  // 默认开始/结束时间
  const now = new Date();
  now.setMinutes(0, 0, 0);
  const startDefault = new Date(now.getTime() + 3600000);
  const endDefault = new Date(startDefault.getTime() + 3600000);
  startEl.value = startDefault.toISOString().slice(0,16);
  endEl.value = endDefault.toISOString().slice(0,16);

  let icsContent = '';

  function formatICSDate(d) {
    return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  }

  function escapeICS(s) {
    return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function generate() {
    const title = titleEl.value.trim();
    const startVal = startEl.value;
    const endVal = endEl.value;
    const location = locationEl.value.trim();
    const desc = descEl.value.trim();
    const alarm = parseInt(alarmEl.value);
    const freq = freqEl.value;

    if (!title) { showToast('请输入事件标题'); return; }
    if (!startVal || !endVal) { showToast('请设置开始和结束时间'); return; }

    const start = new Date(startVal);
    const end = new Date(endVal);
    if (end <= start) { showToast('结束时间必须晚于开始时间'); return; }

    const now = new Date();
    const uid = Date.now() + '-' + Math.random().toString(36).substr(2,9) + '@freetoolbase.com';

    let lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Free ToolBase//iCal Generator//CN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + uid,
      'DTSTART:' + formatICSDate(start),
      'DTEND:' + formatICSDate(end),
      'DTSTAMP:' + formatICSDate(now),
      'SUMMARY:' + escapeICS(title),
    ];

    if (location) lines.push('LOCATION:' + escapeICS(location));
    if (desc) lines.push('DESCRIPTION:' + escapeICS(desc));

    if (freq) {
      lines.push('RRULE:FREQ=' + freq);
    }

    if (alarm > 0) {
      lines.push('BEGIN:VALARM');
      lines.push('TRIGGER:-PT' + alarm + 'M');
      lines.push('ACTION:DISPLAY');
      lines.push('DESCRIPTION:提醒: ' + escapeICS(title));
      lines.push('END:VALARM');
    }

    lines.push('END:VEVENT');
    lines.push('END:VCALENDAR');

    icsContent = lines.join('\r\n');
    outputEl.textContent = icsContent;
    outputEl.classList.add('show');
    downloadBtn.disabled = false;
    copyBtn.disabled = false;
    showToast('✅ .ics文件已生成');
  }

  function download() {
    if (!icsContent) return;
    const blob = new Blob([icsContent], {type: 'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const filename = (titleEl.value.trim() || 'event').replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_') + '.ics';
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    showToast('⬇ 下载完成');
  }

  function copy() {
    if (!icsContent) return;
    navigator.clipboard.writeText(icsContent).then(() => showToast('📋 已复制到剪贴板'));
  }

  generateBtn.addEventListener('click', generate);
  downloadBtn.addEventListener('click', download);
  copyBtn.addEventListener('click', copy);
})();
</script>
