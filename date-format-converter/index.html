  <main>
    <h1>日期格式转换器</h1>
    <p class="desc">在多种日期格式之间转换，支持ISO 8601、Unix时间戳、自定义格式。</p>
    <div class="card">
      <div class="row">
        <input type="datetime-local" id="datePicker">
        <button class="btn" id="nowBtn">使用当前时间</button>
      </div>
      <input type="text" id="tsInput" placeholder="或输入Unix时间戳 (秒)" style="margin-bottom:12px">
      <div class="result-item"><span class="label">ISO 8601</span><span class="value" id="iso8601">-</span></div>
      <div class="result-item"><span class="label">Unix时间戳(秒)</span><span class="value" id="unixSec">-</span></div>
      <div class="result-item"><span class="label">Unix时间戳(毫秒)</span><span class="value" id="unixMs">-</span></div>

      <div class="result-item"><span class="label">MM/DD/YYYY</span><span class="value" id="mdy">-</span></div>

  <script>
  const dp=document.getElementById('datePicker'),tsInput=document.getElementById('tsInput'),nowBtn=document.getElementById('nowBtn');
  function pad(n){return String(n).padStart(2,'0')}
  function update(d){const iso=d.toISOString();const sec=Math.floor(d.getTime()/1000);const ms=d.getTime();document.getElementById('iso8601').textContent=iso;document.getElementById('unixSec').textContent=sec;document.getElementById('unixMs').textContent=ms;document.getElementById('utc').textContent=d.toUTCString();document.getElementById('local').textContent=d.toString();document.getElementById('rfc2822').textContent=d.toUTCString().replace('GMT','+0000');document.getElementById('ymd').textContent=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;document.getElementById('mdy').textContent=`${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`;document.getElementById('dmy').textContent=`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`}
  function syncPicker(d){const iso=d.toISOString().slice(0,16);dp.value=iso;tsInput.value=Math.floor(d.getTime()/1000)}
  dp.addEventListener('input',()=>{if(dp.value)update(new Date(dp.value))})
  tsInput.addEventListener('input',()=>{const v=parseInt(tsInput.value);if(!isNaN(v)){update(new Date(v*1000));dp.value=new Date(v*1000).toISOString().slice(0,16)}})
  nowBtn.addEventListener('click',()=>{const now=new Date();update(now);syncPicker(now)})
  const now=new Date();update(now);syncPicker(now)
  </script>
