<div class="header">

<div class="hero">
<span class="badge">健康 · 孕期</span>
<p>基于Naegele规则计算孕周和预产期。输入末次月经第一天，自动推算当前孕周、预产期、已过天数、剩余天数和各孕期里程碑。注意：本工具仅供参考，请以医生诊断为准。</p>

<div class="section">
<h2>📅 输入日期</h2>
<div class="form-group">
<label>末次月经第一天 (LMP)</label>
<input type="date" id="lmpDate">
</div>
<div class="btn-row">
<button class="btn btn-primary" id="calcBtn">🧮 计算孕周</button>
<button class="btn btn-secondary" id="todayBtn">📆 用今天做LMP</button>
<button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
</div>
</div>

<div class="section" id="resultsSection" style="display:none">
<h2>📊 孕期信息</h2>
<div class="result-grid">
<div class="result-item"><div class="label">当前孕周</div><div class="value pink" id="currentWeek">-</div></div>
<div class="result-item"><div class="label">预产期 (EDD)</div><div class="value gold" id="edd">-</div></div>
<div class="result-item"><div class="label">已过天数</div><div class="value" id="daysElapsed">-</div></div>
<div class="result-item"><div class="label">剩余天数</div><div class="value green" id="daysRemaining">-</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="tip-box" id="tipBox" style="margin-top:12px"></div>
<ul class="milestone-list" id="milestones"></ul>
</div>

</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var lmpDateEl = document.getElementById('lmpDate');
  var calcBtn = document.getElementById('calcBtn');
  var todayBtn = document.getElementById('todayBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultsSection = document.getElementById('resultsSection');
  var toast = document.getElementById('toast');

  // Set default to 3 months ago for demo
  var d = new Date();
  d.setMonth(d.getMonth() - 3);
  lmpDateEl.value = d.toISOString().split('T')[0];

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  function addDays(date, days) {
    var r = new Date(date);
    r.setDate(r.getDate() + days);
    return r;
  }

  function daysBetween(d1, d2) {
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function formatDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function calc() {
    var lmpStr = lmpDateEl.value;
    if (!lmpStr) { showToast('请选择末次月经日期'); return; }

    var lmp = new Date(lmpStr + 'T00:00:00');
    var today = new Date();
    today.setHours(0,0,0,0);

    // Naegele's rule: EDD = LMP + 280 days
    var edd = addDays(lmp, 280);

    var daysElapsed = daysBetween(lmp, today);
    if (daysElapsed < 0) {
      showToast('末次月经日期不能晚于今天');
      return;
    }

    var daysRemaining = daysBetween(today, edd);
    var weeksElapsed = Math.floor(daysElapsed / 7);
    var daysExtra = daysElapsed % 7;
    var totalWeeks = 40;

    document.getElementById('currentWeek').textContent = weeksElapsed + '周' + daysExtra + '天';
    document.getElementById('edd').textContent = formatDate(edd);
    document.getElementById('daysElapsed').textContent = daysElapsed + ' 天';
    document.getElementById('daysRemaining').textContent = (daysRemaining > 0 ? daysRemaining : 0) + ' 天';

    // Progress
    var progress = Math.min(100, Math.max(0, daysElapsed / 280 * 100));
    document.getElementById('progressFill').style.width = progress.toFixed(1) + '%';

    // Trimester
    var trimester = weeksElapsed < 13 ? '第一孕期 (1-12周)' : weeksElapsed < 27 ? '第二孕期 (13-26周)' : '第三孕期 (27-40周)';
    var tip = '<strong>📍 当前阶段</strong>：' + trimester + ' | 孕期已过 ' + progress.toFixed(1) + '%';
    document.getElementById('tipBox').innerHTML = tip;

    // Milestones
    var milestones = [
      {week:4,text:'胚胎着床，可以检测到hCG'},
      {week:8,text:'胎心可见，主要器官开始形成'},
      {week:12,text:'第一孕期筛查（NT检查）'},
      {week:16,text:'可感知胎动，性别可辨'},
      {week:20,text:'B超大排畸筛查'},
      {week:24,text:'葡萄糖耐量测试（糖筛）'},
      {week:28,text:'进入第三孕期，开始数胎动'},
      {week:32,text:'胎位检查，准备分娩计划'},
      {week:36,text:'足月，随时可能分娩'},
      {week:40,text:'预产期'}
    ];

    var html = '';
    milestones.forEach(function(m){
      var done = weeksElapsed >= m.week ? '✅' : weeksElapsed === m.week - 1 ? '🔜' : '⭕';
      html += '<li><span class="icon">' + done + '</span> <strong>第' + m.week + '周</strong>：' + m.text + '</li>';
    });
    document.getElementById('milestones').innerHTML = html;

    resultsSection.style.display = 'block';
    resultsSection.scrollIntoView({behavior:'smooth'});
  }

  calcBtn.addEventListener('click', calc);
  todayBtn.addEventListener('click', function(){
    var d = new Date();
    lmpDateEl.value = d.toISOString().split('T')[0];
    calc();
  });
  clearBtn.addEventListener('click', function(){
    lmpDateEl.value = '';
    resultsSection.style.display = 'none';
    showToast('已清空');
  });

  // Auto calc on load
  calc();
})();
</script>
</body>
</html>
