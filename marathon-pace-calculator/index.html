  <script>
    (function() {
      // ─── Toast ───
      function showToast(msg, duration) {
        duration = duration || 2000;
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._tid);
        t._tid = setTimeout(function(){ t.classList.remove('show'); }, duration);
      }

      var $ = function(id) { return document.getElementById(id); };

      // ─── State ───
      var state = {
        mode: 'time-to-pace',
        distance: 5,
        unit: 'km',
        timeH: 0, timeM: 25, timeS: 0,
        paceM: 5, paceS: 0, paceUnit: 'km',
        negSplit: 0
      };

      // ─── Helpers ───
      function fmtTime(totalSec) {
        var h = Math.floor(totalSec / 3600);
        var m = Math.floor((totalSec % 3600) / 60);
        var s = Math.floor(totalSec % 60);
        if (h > 0) {
          return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        return m + ':' + String(s).padStart(2,'0');
      }

      function fmtPace(secPerUnit) {
        if (!isFinite(secPerUnit) || secPerUnit <= 0) return '--:--';
        var m = Math.floor(secPerUnit / 60);
        var s = Math.floor(secPerUnit % 60);
        return m + ':' + String(s).padStart(2,'0');
      }

      function kmToMile(km) { return km * 0.621371; }
      function mileToKm(mi) { return mi / 0.621371; }

      function getDistKm() {
        if (state.unit === 'km') return state.distance;
        return mileToKm(state.distance);
      }

      // ─── Calculations ───
      function calcTimeToPace() {
        var totalSec = state.timeH * 3600 + state.timeM * 60 + state.timeS;
        var distKm = getDistKm();
        var distMile = state.unit === 'mile' ? state.distance : kmToMile(state.distance);

        var paceSecKm = totalSec / distKm;
        var paceSecMile = totalSec / distMile;

        // Apply negative split
        var halfDistKm = distKm / 2;
        var firstHalfPaceSecKm = paceSecKm;
        var secondHalfPaceSecKm = paceSecKm;

        if (state.negSplit > 0 && distKm >= 1) {
          // avg_pace = (first_pace + second_pace) / 2
          // second_pace = first_pace - negSplit
          // avg = (first + first - negSplit) / 2 = first - negSplit/2
          firstHalfPaceSecKm = paceSecKm + state.negSplit / 2;
          secondHalfPaceSecKm = paceSecKm - state.negSplit / 2;
        }

        return {
          totalSec: totalSec,
          distKm: distKm,
          distMile: distMile,
          paceSecKm: paceSecKm,
          paceSecMile: paceSecMile,
          firstHalfPaceSecKm: firstHalfPaceSecKm,
          secondHalfPaceSecKm: secondHalfPaceSecKm
        };
      }

      function calcPaceToTime() {
        var paceSecPerUnit = state.paceM * 60 + state.paceS;
        var distKm = getDistKm();
        var distMile = state.unit === 'mile' ? state.distance : kmToMile(state.distance);

        var totalSec;
        if (state.paceUnit === 'km') {
          totalSec = paceSecPerUnit * distKm;
        } else {
          totalSec = paceSecPerUnit * distMile;
        }

        var paceSecKm, paceSecMile;
        if (state.paceUnit === 'km') {
          paceSecKm = paceSecPerUnit;
          paceSecMile = paceSecPerUnit * 1.60934;
        } else {
          paceSecMile = paceSecPerUnit;
          paceSecKm = paceSecPerUnit / 1.60934;
        }

        var firstHalfPaceSecKm = paceSecKm;
        var secondHalfPaceSecKm = paceSecKm;
        if (state.negSplit > 0 && distKm >= 1) {
          firstHalfPaceSecKm = paceSecKm + state.negSplit / 2;
          secondHalfPaceSecKm = paceSecKm - state.negSplit / 2;
        }

        return {
          totalSec: totalSec,
          distKm: distKm,
          distMile: distMile,
          paceSecKm: paceSecKm,
          paceSecMile: paceSecMile,
          firstHalfPaceSecKm: firstHalfPaceSecKm,
          secondHalfPaceSecKm: secondHalfPaceSecKm
        };
      }

      function calc() {
        if (state.mode === 'time-to-pace') return calcTimeToPace();
        return calcPaceToTime();
      }

      // ─── Render ───
      function render() {
        var r = calc();

        // Pace results
        $('paceKm').textContent = fmtPace(r.paceSecKm);
        $('paceMile').textContent = fmtPace(r.paceSecMile);
        $('finishTime').textContent = fmtTime(r.totalSec);

        // Update pace labels based on unit
        if (state.unit === 'mile') {
          $('paceKm').parentNode.querySelector('.pace-label').textContent = '配速 (min/km)';
          $('paceMile').parentNode.querySelector('.pace-label').textContent = '配速 (min/mi)';
        }

        // Splits
        var distKm = r.distKm;
        var numSplits = Math.ceil(distKm);
        var splitUnit = 'km';
        var splitDist = 1; // 1 km per split

        // If distance is in miles and >= 5 miles, show per-mile splits
        if (state.unit === 'mile' && state.distance >= 3) {
          numSplits = Math.ceil(state.distance);
          splitUnit = 'mi';
          splitDist = 1;
        }

        var html = '';
        var cumSec = 0;
        var halfDistKm = distKm / 2;

        for (var i = 1; i <= numSplits; i++) {
          var segStartKm = (i - 1) * splitDist;
          if (splitUnit === 'mi') segStartKm = mileToKm((i - 1) * splitDist);
          var segEndKm = i * splitDist;
          if (splitUnit === 'mi') segEndKm = mileToKm(i * splitDist);

          // Clamp to total distance
          if (segEndKm > distKm) segEndKm = distKm;
          var segDistKm = segEndKm - segStartKm;
          if (segDistKm <= 0) break;

          // Determine pace for this segment based on neg split
          var segMidKm = (segStartKm + segEndKm) / 2;
          var segPaceSecKm;
          if (state.negSplit > 0 && distKm >= 1) {
            // Linear interpolation between first half and second half pace
            var ratio = segMidKm / distKm;
            segPaceSecKm = r.firstHalfPaceSecKm + (r.secondHalfPaceSecKm - r.firstHalfPaceSecKm) * ratio;
          } else {
            segPaceSecKm = r.paceSecKm;
          }

          var segSec = segPaceSecKm * segDistKm;
          cumSec += segSec;

          var paceClass = '';
          if (state.negSplit > 0 && distKm >= 1) {
            if (segMidKm < halfDistKm) paceClass = ' split-slow';
            else paceClass = ' split-fast';
          }

          html += '<tr>';
          html += '<td>' + i + '</td>';
          html += '<td class="' + (paceClass ? paceClass.trim() : '') + '">' + fmtTime(segSec) + '</td>';
          html += '<td>' + fmtTime(cumSec) + '</td>';
          html += '<td class="' + (paceClass ? paceClass.trim() : '') + '">' + fmtPace(segPaceSecKm) + '</td>';
          html += '</tr>';
        }

        $('splitsBody').innerHTML = html;
      }

      // ─── Update State from UI ───
      function syncFromUI() {
        state.timeH = parseInt($('timeH').value) || 0;
        state.timeM = parseInt($('timeM').value) || 0;
        state.timeS = parseInt($('timeS').value) || 0;
        state.paceM = parseInt($('paceM').value) || 0;
        state.paceS = parseInt($('paceS').value) || 0;
        state.paceUnit = $('paceUnit').value;
        state.negSplit = parseInt($('negSplit').value) || 0;
        state.distance = parseFloat($('customDist').value) || 5;
      }

      function updateAll() {
        syncFromUI();
        render();
      }

      // ─── Mode Toggle ───
      $('modeToggle').addEventListener('click', function(e) {
        var btn = e.target.closest('.mode-btn');
        if (!btn) return;
        var mode = btn.getAttribute('data-mode');
        state.mode = mode;
        var all = $('modeToggle').querySelectorAll('.mode-btn');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
        btn.classList.add('active');

        $('timeInputSection').style.display = mode === 'time-to-pace' ? '' : 'none';
        $('paceInputSection').style.display = mode === 'pace-to-time' ? '' : 'none';
        updateAll();
      });

      // ─── Distance Presets ───
      $('distPresets').addEventListener('click', function(e) {
        var btn = e.target.closest('.dist-preset');
        if (!btn) return;
        var dist = parseFloat(btn.getAttribute('data-dist'));
        state.distance = dist;
        $('customDist').value = dist;
        var all = $('distPresets').querySelectorAll('.dist-preset');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
        btn.classList.add('active');

        // Auto-switch unit: half/full marathon default km
        if (dist >= 10) {
          setUnit('km');
        }
        updateAll();
      });

      // ─── Unit Toggle ───
      function setUnit(unit) {
        state.unit = unit;
        var all = $('unitToggle').querySelectorAll('.unit-btn');
        for (var i = 0; i < all.length; i++) {
          all[i].classList.toggle('active', all[i].getAttribute('data-unit') === unit);
        }
        // Update distance presets for mile mode
        updateDistPresetLabels();
      }

      function updateDistPresetLabels() {
        var presets = $('distPresets').querySelectorAll('.dist-preset');
        var labels = state.unit === 'km' ? ['5 公里', '10 公里', '21.1 公里', '42.2 公里'] : ['3.1 英里', '6.2 英里', '13.1 英里', '26.2 英里'];
        var vals = state.unit === 'km' ? ['5K', '10K', '半马', '全马'] : ['5K', '10K', '半马', '全马'];
        presets.forEach(function(p, i) {
          p.querySelector('.dist-label').textContent = labels[i];
        });
      }

      $('unitToggle').addEventListener('click', function(e) {
        var btn = e.target.closest('.unit-btn');
        if (!btn) return;
        setUnit(btn.getAttribute('data-unit'));
        updateAll();
      });

      // ─── Input Changes ───
      var inputs = ['customDist', 'timeH', 'timeM', 'timeS', 'paceM', 'paceS', 'negSplit'];
      inputs.forEach(function(id) {
        $('id').addEventListener('input', updateAll);
      });
      // Fix: use proper selectors
      $('customDist').addEventListener('input', updateAll);
      $('timeH').addEventListener('input', updateAll);
      $('timeM').addEventListener('input', updateAll);
      $('timeS').addEventListener('input', updateAll);
      $('paceM').addEventListener('input', updateAll);
      $('paceS').addEventListener('input', updateAll);
      $('paceUnit').addEventListener('change', updateAll);
      $('negSplit').addEventListener('input', updateAll);

      // ─── Copy Splits ───
      $('copySplits').addEventListener('click', function() {
        var rows = $('splitsBody').querySelectorAll('tr');
        var text = '公里\t分段时间\t累计时间\t配速\n';
        rows.forEach(function(row) {
          var cells = row.querySelectorAll('td');
          text += cells[0].textContent + '\t' + cells[1].textContent + '\t' + cells[2].textContent + '\t' + cells[3].textContent + '\n';
        });
        navigator.clipboard.writeText(text).then(function() {
          showToast('✅ 分段表已复制到剪贴板');
        }).catch(function() {
          showToast('❌ 复制失败，请手动选择复制');
        });
      });

      // ─── Init ───
      setUnit('km');
      updateAll();
    })();
  </script>
</body>
</html>
