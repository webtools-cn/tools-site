<body>
<div class="container">
<div class="nav-back"><a href="/">← 首页</a> / CSV转JSON数组</div>
<div class="header">
<h1>📊 CSV 转 JSON 数组</h1>
<div class="lang-switch"><a href="/csv-to-json-array/" class="active">中文</a><a href="/en/csv-to-json-array/">English</a></div>
</div>
<div class="card">
<h2>📥 CSV 输入</h2>
<textarea id="csvInput" rows="6" placeholder="name,age,city
张三,25,北京
李四,30,上海
王五,28,广州"></textarea>
<div class="options-row">
<label>分隔符:</label>
<select id="delimiter">
<option value=",">逗号 (,)</option>
<option value=";">分号 (;)</option>
<option value="\t">制表符 (Tab)</option>
<option value="|">竖线 (|)</option>
<option value="custom">自定义</option>
</select>
<input type="text" id="customDelimiter" placeholder="自定义" style="display:none" maxlength="3">
<label style="margin-left:12px"><input type="checkbox" id="trimValues" checked> 去除首尾空格</label>
<label style="margin-left:12px"><input type="checkbox" id="skipEmpty"> 跳过空行</label>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="convertBtn">🔄 转换为 JSON 数组</button>
<button class="btn btn-secondary" id="sampleBtn">📋 加载示例</button>
<button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
</div>
<div id="errorMsg" class="error-msg"></div>
</div>
<div class="card">
<h2>📤 JSON 输出</h2>
<textarea id="jsonOutput" class="output" readonly placeholder="转换结果将在这里显示..."></textarea>
<div class="char-count"><span id="outputCount">0</span> 字符</div>
<div class="btn-row">
<button class="btn btn-primary" id="copyBtn">📋 复制 JSON</button>
<button class="btn btn-secondary" id="downloadBtn">💾 下载 JSON</button>
<button class="btn btn-secondary" id="prettyBtn">✨ 美化 / 压缩</button>
</div>
</div>
<div class="card">
<h2>💡 使用说明</h2>
<p style="color:#94a3b8;font-size:.9rem;line-height:1.8">
CSV（逗号分隔值）数据将被转换为JSON对象数组。第一行作为字段名（key），后续每行作为一个对象。<br>
<strong>示例：</strong><br>
输入CSV：<code style="color:#22d3ee">name,age,city<br>张三,25,北京</code><br>
输出JSON：<code style="color:#22d3ee">[{"name":"张三","age":"25","city":"北京"}]</code>
</p>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
const csvInput=document.getElementById('csvInput');
const jsonOutput=document.getElementById('jsonOutput');
const delimiter=document.getElementById('delimiter');
const customDelimiter=document.getElementById('customDelimiter');
const trimValues=document.getElementById('trimValues');
const skipEmpty=document.getElementById('skipEmpty');
const errorMsg=document.getElementById('errorMsg');
const outputCount=document.getElementById('outputCount');
const toast=document.getElementById('toast');

delimiter.addEventListener('change',function(){
  customDelimiter.style.display=this.value==='custom'?'inline-block':'none';
});

function getDelimiter(){
  if(delimiter.value==='custom') return customDelimiter.value||',';
  if(delimiter.value==='\\t') return '\t';
  return delimiter.value;
}

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(function(){toast.classList.remove('show')},2000);
}

function convert(){
  errorMsg.style.display='none';
  var csv=csvInput.value.trim();
  if(!csv){
    errorMsg.textContent='请输入CSV数据';
    errorMsg.style.display='block';
    return;
  }
  var lines=csv.split('\n');
  if(skipEmpty.checked) lines=lines.filter(function(l){return l.trim()});
  if(lines.length<2){
    errorMsg.textContent='CSV至少需要2行（表头+数据行）';
    errorMsg.style.display='block';
    return;
  }
  var delim=getDelimiter();
  var headers=parseLine(lines[0],delim);
  if(trimValues.checked) headers=headers.map(function(h){return h.trim()});
  var result=[];
  for(var i=1;i<lines.length;i++){
    var values=parseLine(lines[i],delim);
    if(trimValues.checked) values=values.map(function(v){return v.trim()});
    var obj={};
    for(var j=0;j<headers.length;j++){
      obj[headers[j]]=values[j]!==undefined?values[j]:'';
    }
    result.push(obj);
  }
  var jsonStr=JSON.stringify(result,null,2);
  jsonOutput.value=jsonStr;
  outputCount.textContent=jsonStr.length;
}

function parseLine(line,delim){
  if(delim===','||delim===';'||delim==='|'||delim==='\t'){
    return line.split(delim);
  }
  return line.split(delim);
}

function prettyToggle(){
  var val=jsonOutput.value.trim();
  if(!val){showToast('没有JSON数据');return}
  try{
    var obj=JSON.parse(val);
    var isCompact=val.indexOf('\n')===-1;
    jsonOutput.value=JSON.stringify(obj,null,isCompact?2:0);
    outputCount.textContent=jsonOutput.value.length;
    showToast(isCompact?'已美化':'已压缩');
  }catch(e){
    showToast('JSON格式错误，无法美化');
  }
}

document.getElementById('convertBtn').addEventListener('click',convert);
document.getElementById('sampleBtn').addEventListener('click',function(){
  csvInput.value='name,age,city,email\n张三,25,北京,zhangsan@example.com\n李四,30,上海,lisi@example.com\n王五,28,广州,wangwu@example.com\n赵六,35,深圳,zhaoliu@example.com';
  convert();
});
document.getElementById('clearBtn').addEventListener('click',function(){
  csvInput.value='';
  jsonOutput.value='';
  outputCount.textContent='0';
  errorMsg.style.display='none';
});
document.getElementById('copyBtn').addEventListener('click',function(){
  var val=jsonOutput.value.trim();
  if(!val){showToast('没有可复制的内容');return}
  navigator.clipboard.writeText(val).then(function(){showToast('✅ 已复制到剪贴板')}).catch(function(){jsonOutput.select();document.execCommand('copy');showToast('✅ 已复制')});
});
document.getElementById('downloadBtn').addEventListener('click',function(){
  var val=jsonOutput.value.trim();
  if(!val){showToast('没有可下载的内容');return}
  var blob=new Blob([val],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✅ JSON文件已下载');
});
document.getElementById('prettyBtn').addEventListener('click',prettyToggle);
</script>
</body>
</html>
