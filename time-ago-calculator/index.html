<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}

function setDates(type){
var now = new Date();
var start = document.getElementById('startDate');
var end = document.getElementById('endDate');
if(type==='today'){start.valueAsDate=now;end.value='';}
else if(type==='yesterday'){start.valueAsDate=new Date(now-86400000);end.value='';}
else if(type==='week'){start.valueAsDate=new Date(now-7*86400000);end.value='';}
else if(type==='month'){start.valueAsDate=new Date(now-30*86400000);end.value='';}
else if(type==='year'){start.valueAsDate=new Date(now-365*86400000);end.value='';}
else if(type==='future'){start.value='';end.valueAsDate=new Date(now.getTime()+30*86400000);}
calc();
}

function calc(){
var startVal = document.getElementById('startDate').value;
var endVal = document.getElementById('endDate').value;
var result = document.getElementById('resultDisplay');
var detail = document.getElementById('resultDetail');

if(!startVal && !endVal){result.textContent='请选择日期';detail.textContent='';return;}

var startDate = startVal ? new Date(startVal + 'T00:00:00') : null;
var endDate = endVal ? new Date(endVal + 'T00:00:00') : new Date();
endDate.setHours(23,59,59,999);

if(startDate && isNaN(startDate.getTime())){result.textContent='无效的日期格式';return;}
if(endVal && isNaN(endDate.getTime())){result.textContent='无效的日期格式';return;}

var startMs = startDate ? startDate.getTime() : endDate.getTime();
var endMs = endDate.getTime();

var diffMs = endMs - startMs;
var isFuture = diffMs < 0;
var absMs = Math.abs(diffMs);

var totalSeconds = Math.floor(absMs/1000);
var totalMinutes = Math.floor(totalSeconds/60);
var totalHours = Math.floor(totalMinutes/60);
var days = Math.floor(totalHours/24);
var hours = totalHours % 24;
var minutes = totalMinutes % 60;

if(isFuture){
var parts = [];
if(days>0) parts.push(days+' 天');
if(hours>0) parts.push(hours+' 小时');
if(minutes>0||parts.length===0) parts.push(minutes+' 分钟');
result.textContent = '⏳ 还有 ' + parts.join(' ');
}else{
var parts = [];
if(days>0) parts.push(days+' 天');
if(hours>0) parts.push(hours+' 小时');
if(minutes>0||parts.length===0) parts.push(minutes+' 分钟');
result.textContent = '📅 已经过去 ' + parts.join(' ');
}

var details = [];
details.push('总天数: ' + days.toLocaleString() + ' 天');
details.push('总小时: ' + totalHours.toLocaleString() + ' 小时');
details.push('总分钟: ' + totalMinutes.toLocaleString() + ' 分钟');
details.push('总秒数: ' + totalSeconds.toLocaleString() + ' 秒');
if(!endVal) details.push('（截止当前时刻）');
detail.textContent = details.join(' | ');
}

document.addEventListener('DOMContentLoaded',function(){
document.getElementById('startDate').valueAsDate = new Date(Date.now()-86400000);
calc();
});
</script>
