    <h1>图片转 JPG</h1>
<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">在线图片转JPG工具，支持PNG、WebP、BMP等格式转为JPG，可调节质量，纯浏览器端处理，无需上传服务器。</p>
    <p class="desc">将 PNG、WebP、BMP 等格式的图片在线转换为 JPG 格式。所有处理在浏览器本地完成，无需上传。</p>
    <div class="card">
      <h2>📤 上传图片</h2>
      <div class="upload-zone" id="dropZone">
        <p>点击选择或拖拽图片到此处</p>
        <input type="file" id="fileInput" accept="image/png,image/webp,image/bmp,image/gif,image/tiff" hidden>
      </div>
      <div class="quality-row">
        <span>JPG 质量: <strong id="qualityVal">85</strong>%</span>
        <input type="range" id="qualityRange" min="10" max="100" value="85">
      </div>
      <button class="btn btn-primary" id="convertBtn" disabled>转换为 JPG 并下载</button>
    </div>
    <div class="card" id="previewCard" style="display:none">
      <h2>👁️ 预览对比</h2>
      <div class="preview-area">
        <div class="preview-box">
          <div class="label">原图</div>
          <img id="previewOriginal" alt="原图">
          <div id="originalInfo" style="font-size:12px;color:var(--text-secondary);margin-top:4px;"></div>
        </div>
        <div class="preview-box">
          <div class="label">转换后 (JPG)</div>
          <img id="previewResult" alt="转换结果">
          <div id="resultInfo" style="font-size:12px;color:var(--text-secondary);margin-top:4px;"></div>
        </div>
      </div>
    </div>

<section class="related-tools" style="margin:2rem 0;padding:1rem;background:#f8fafc;border-radius:8px;"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#374151;">🔗 相关工具推荐</h2><div style="display:flex;flex-wrap:wrap;gap:4px;"><a href="/acronym-generator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">🔤 缩写词生成器</a><a href="/add-watermark/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">🔏 图片添加水印工具</a><a href="/audio-crossfade/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">音频交叉渐变</a></div></section>

  <div class="toast" id="toast"></div>
  <script>
    let sourceImage = null, sourceName = '';

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'error' : '');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function loadImage(file) {
      if (file.size > 20 * 1024 * 1024) { showToast('图片不能超过20MB', true); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          sourceName = file.name.replace(/\.[^.]+$/, '');
          document.getElementById('convertBtn').disabled = false;
          document.getElementById('previewOriginal').src = e.target.result;
          document.getElementById('originalInfo').textContent =
            `${img.width}×${img.height} · ${(file.size/1024).toFixed(1)} KB · ${file.type}`;
          document.getElementById('previewCard').style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function convertToJPG() {
      if (!sourceImage) return;
      const quality = parseInt(document.getElementById('qualityRange').value) / 100;
      const canvas = document.createElement('canvas');
      canvas.width = sourceImage.width;
      canvas.height = sourceImage.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sourceImage, 0, 0);
      
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        document.getElementById('previewResult').src = url;
        document.getElementById('resultInfo').textContent =
          `${canvas.width}×${canvas.height} · ${(blob.size/1024).toFixed(1)} KB · image/jpeg`;
        
        const a = document.createElement('a');
        a.href = url;
        a.download = sourceName + '.jpg';
        a.click();
        showToast('转换完成，已下载！');
      }, 'image/jpeg', quality);
    }

    document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });
    document.getElementById('dropZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--primary)'; });
    document.getElementById('dropZone').addEventListener('dragleave', e => { e.currentTarget.style.borderColor = 'var(--border)'; });
    document.getElementById('dropZone').addEventListener('drop', e => {
      e.preventDefault(); e.currentTarget.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
    });
    document.getElementById('qualityRange').addEventListener('input', e => {
      document.getElementById('qualityVal').textContent = e.target.value;
    });
    document.getElementById('convertBtn').addEventListener('click', convertToJPG);
  </script>
