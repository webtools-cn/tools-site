  <style>
    :root {

      --primary-light: #EEF2FF;

    .search-bar select {

    /* 分类标签 */

    /* 统计 */

      display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px; margin-bottom: 24px;

    .char-cell {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 4px; text-align: center;
      cursor: pointer; transition: all .15s; position: relative;
      min-height: 72px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;

    .char-cell:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .char-cell .char-symbol { font-size: 1.5rem; line-height: 1.2; }
    .char-cell .char-code { font-size: .65rem; color: var(--text-secondary); margin-top: 4px; font-family: monospace; }
    .char-cell.copied { border-color: #22c55e; background: #f0fdf4; }

  <script>
(function(){
    // ============ Unicode 数据 ============
    const UNICODE_BLOCKS = [
      { name: '基本拉丁字母', range: [0x0020, 0x007F], key: 'basic-latin' },
      { name: '拉丁字母补充-1', range: [0x00A0, 0x00FF], key: 'latin-1' },
      { name: '拉丁字母扩展', range: [0x0100, 0x024F], key: 'latin-ext' },
      { name: '国际音标', range: [0x0250, 0x02AF], key: 'ipa' },
      { name: '间距修饰符', range: [0x02B0, 0x02FF], key: 'spacing-mod' },
      { name: '组合附加符号', range: [0x0300, 0x036F], key: 'combining' },
      { name: '希腊字母', range: [0x0370, 0x03FF], key: 'greek' },
      { name: '西里尔字母', range: [0x0400, 0x04FF], key: 'cyrillic' },
      { name: '希伯来字母', range: [0x0590, 0x05FF], key: 'hebrew' },
      { name: '阿拉伯字母', range: [0x0600, 0x06FF], key: 'arabic' },
      { name: '标点符号', range: [0x2000, 0x206F], key: 'punctuation' },
      { name: '货币符号', range: [0x20A0, 0x20CF], key: 'currency' },
      { name: '字母符号', range: [0x2100, 0x214F], key: 'letterlike' },
      { name: '箭头', range: [0x2190, 0x21FF], key: 'arrows' },
      { name: '数学运算符', range: [0x2200, 0x22FF], key: 'math-ops' },
      { name: '技术符号', range: [0x2300, 0x23FF], key: 'technical' },
      { name: '制表符', range: [0x2500, 0x257F], key: 'box-drawing' },
      { name: '方块元素', range: [0x2580, 0x259F], key: 'block-elements' },
      { name: '几何图形', range: [0x25A0, 0x25FF], key: 'geometric' },
      { name: '杂项符号', range: [0x2600, 0x26FF], key: 'misc-symbols' },
      { name: '装饰符号', range: [0x2700, 0x27BF], key: 'dingbats' },
      { name: '补充箭头', range: [0x2900, 0x297F], key: 'arrows-b' },
      { name: '数学符号补充', range: [0x2A00, 0x2AFF], key: 'math-b' },
      { name: 'CJK标点', range: [0x3000, 0x303F], key: 'cjk-punct' },
      { name: '平假名', range: [0x3040, 0x309F], key: 'hiragana' },
      { name: '片假名', range: [0x30A0, 0x30FF], key: 'katakana' },
      { name: '注音符号', range: [0x3100, 0x312F], key: 'bopomofo' },
      { name: 'CJK兼容', range: [0x3300, 0x33FF], key: 'cjk-comp' },
      { name: '全角ASCII', range: [0xFF00, 0xFFEF], key: 'fullwidth' },
      { name: '表情符号', range: [0x1F600, 0x1F64F], key: 'emoji-faces' },
      { name: '表情-物体', range: [0x1F300, 0x1F5FF], key: 'emoji-objects' },
      { name: '表情-交通', range: [0x1F680, 0x1F6FF], key: 'emoji-transport' },
      { name: '表情-符号', range: [0x1F700, 0x1F77F], key: 'emoji-symbols' },
      { name: '表情-补充', range: [0x1F900, 0x1F9FF], key: 'emoji-supp' },
    ];

    const HOT_CATEGORIES = [
      { label: '表情', blocks: ['emoji-faces','emoji-objects','emoji-transport','emoji-symbols','emoji-supp'] },
      { label: '箭头', blocks: ['arrows','arrows-b'] },
      { label: '数学', blocks: ['math-ops','math-b'] },
      { label: '货币', blocks: ['currency'] },
      { label: '几何', blocks: ['geometric','block-elements','box-drawing'] },
      { label: '字母', blocks: ['basic-latin','latin-1','latin-ext','greek','cyrillic'] },
      { label: 'CJK', blocks: ['cjk-punct','hiragana','katakana','bopomofo','cjk-comp','fullwidth'] },
      { label: '全部', blocks: [] },
    ];

    // 常用字符描述
    const CHAR_NAMES = {
      0x0020:'空格', 0x0021:'感叹号', 0x0022:'双引号', 0x0023:'井号', 0x0024:'美元符号',
      0x0025:'百分号', 0x0026:'和号', 0x0027:'单引号', 0x0028:'左括号', 0x0029:'右括号',
      0x002A:'星号', 0x002B:'加号', 0x002C:'逗号', 0x002D:'连字符', 0x002E:'句号',
      0x002F:'斜杠', 0x0030:'数字0', 0x0031:'数字1', 0x0032:'数字2', 0x0033:'数字3',
      0x0034:'数字4', 0x0035:'数字5', 0x0036:'数字6', 0x0037:'数字7', 0x0038:'数字8',
      0x0039:'数字9', 0x003A:'冒号', 0x003B:'分号', 0x003C:'小于号', 0x003D:'等号',
      0x003E:'大于号', 0x003F:'问号', 0x0040:'@符号', 0x005B:'左方括号', 0x005C:'反斜杠',
      0x005D:'右方括号', 0x005E:'抑扬符', 0x005F:'下划线', 0x0060:'重音符',
      0x007B:'左花括号', 0x007C:'竖线', 0x007D:'右花括号', 0x007E:'波浪号',
      0x00A0:'不换行空格', 0x00A9:'版权符号', 0x00AE:'注册商标', 0x00B0:'度',
      0x00B1:'正负号', 0x00B2:'上标2', 0x00B3:'上标3', 0x00B5:'微符号',
      0x00B7:'中点', 0x00D7:'乘号', 0x00F7:'除号',
      0x2013:'短破折号', 0x2014:'长破折号', 0x2018:'左单引号', 0x2019:'右单引号',
      0x201C:'左双引号', 0x201D:'右双引号', 0x2022:'项目符号', 0x2026:'省略号',
      0x2032:'分', 0x2033:'秒', 0x20AC:'欧元符号', 0x2122:'商标符号',
      0x2190:'左箭头', 0x2191:'上箭头', 0x2192:'右箭头', 0x2193:'下箭头',
      0x2194:'左右箭头', 0x21D2:'双右箭头', 0x2260:'不等于', 0x2264:'小于等于',
      0x2265:'大于等于', 0x221A:'根号', 0x221E:'无穷', 0x222B:'积分',
      0x2248:'约等于', 0x03C0:'π', 0x03A9:'Ω',
    };

    // ============ 状态 ============
    let currentBlock = 'all';
    let currentCategory = null;
    let searchQuery = '';
    let page = 1;
    const PAGE_SIZE = 120;

    // ============ 构建字符列表 ============
    function buildCharList() {
      const chars = [];
      for (const block of UNICODE_BLOCKS) {
        for (let cp = block.range[0]; cp <= block.range[1]; cp++) {
          // 跳过控制字符和代理对
          if ((cp >= 0x0000 && cp <= 0x001F) || (cp >= 0x007F && cp <= 0x009F)) continue;
          if (cp >= 0xD800 && cp <= 0xDFFF) continue;
          chars.push({
            cp: cp,
            char: String.fromCodePoint(cp),
            hex: cp.toString(16).toUpperCase().padStart(cp > 0xFFFF ? 5 : 4, '0'),
            blockKey: block.key,
            blockName: block.name,
            name: CHAR_NAMES[cp] || '',
          });
        }
      }
      return chars;
    }

    const ALL_CHARS = buildCharList();

    // ============ 过滤 ============
    function filterChars() {
      let filtered = ALL_CHARS;
      if (currentBlock !== 'all') {
        filtered = filtered.filter(c => c.blockKey === currentBlock);
      }
      if (currentCategory) {
        const catBlocks = HOT_CATEGORIES.find(c => c.label === currentCategory);
        if (catBlocks && catBlocks.blocks.length > 0) {
          filtered = filtered.filter(c => catBlocks.blocks.includes(c.blockKey));
        }
      }
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        // 支持 U+XXXX 格式搜索
        const uMatch = q.match(/^u\+([0-9a-fA-F]+)$/);
        if (uMatch) {
          const targetHex = uMatch[1].toUpperCase();
          filtered = filtered.filter(c => c.hex === targetHex || c.hex === targetHex.padStart(4,'0'));
        } else {
          filtered = filtered.filter(c =>
            c.name.toLowerCase().includes(q) ||
            c.blockName.toLowerCase().includes(q) ||
            c.char.toLowerCase().includes(q) ||
            c.hex.toLowerCase().includes(q) ||
            `U+${c.hex}`.toLowerCase().includes(q)
          );
        }
      }
      return filtered;
    }

    // ============ 渲染 ============
    function render() {
      const filtered = filterChars();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (page > totalPages) page = Math.max(1, totalPages);
      const start = (page - 1) * PAGE_SIZE;
      const pageChars = filtered.slice(start, start + PAGE_SIZE);

      // Stats
      document.getElementById('stats').textContent = `共 ${filtered.length} 个字符 · 第 ${page}/${Math.max(1,totalPages)} 页`;

      // Grid
      const grid = document.getElementById('charGrid');
      grid.innerHTML = '';
      if (pageChars.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">没有找到匹配的字符，试试其他关键词</div>';
      }
      pageChars.forEach(c => {
        const cell = document.createElement('div');
        cell.className = 'char-cell';
        cell.title = `U+${c.hex}${c.name ? ' — ' + c.name : ''} · ${c.blockName}`;
        cell.innerHTML = `<span class="char-symbol">${c.char}</span><span class="char-code">U+${c.hex}</span>`;
        cell.addEventListener('click', () => copyChar(c, cell));
        grid.appendChild(cell);
      });

      // Pagination
      renderPagination(totalPages);

      // Block select sync
      document.getElementById('blockSelect').value = currentBlock;
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      let html = `<button ${page===1?'disabled':''} id="btnFirst">««</button>`;
      html += `<button ${page===1?'disabled':''} id="btnPrev">«</button>`;
      const startPg = Math.max(1, page - 2);
      const endPg = Math.min(totalPages, page + 2);
      for (let i = startPg; i <= endPg; i++) {
        html += `<button class="${i===page?'active':''}" data-page="${i}">${i}</button>`;
      }
      html += `<button ${page===totalPages?'disabled':''} id="btnNext">»</button>`;
      html += `<button ${page===totalPages?'disabled':''} id="btnLast">»»</button>`;
      html += `<span class="page-info">/ ${totalPages}</span>`;
      container.innerHTML = html;

      document.getElementById('btnFirst')?.addEventListener('click',()=>{page=1;render();scrollTop();});
      document.getElementById('btnPrev')?.addEventListener('click',()=>{page--;render();scrollTop();});
      document.getElementById('btnNext')?.addEventListener('click',()=>{page++;render();scrollTop();});
      document.getElementById('btnLast')?.addEventListener('click',()=>{page=totalPages;render();scrollTop();});
      container.querySelectorAll('[data-page]').forEach(b => {
        b.addEventListener('click',()=>{page=parseInt(b.dataset.page);render();scrollTop();});
      });
    }

    function scrollTop() {
      document.getElementById('charGrid').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function copyChar(c, cell) {
      navigator.clipboard.writeText(c.char).then(() => {
        cell.classList.add('copied');
        setTimeout(() => cell.classList.remove('copied'), 1200);
        showToast(`已复制: ${c.char}  (U+${c.hex})`);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = c.char; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        cell.classList.add('copied');
        setTimeout(() => cell.classList.remove('copied'), 1200);
        showToast(`已复制: ${c.char}  (U+${c.hex})`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ============ 初始化UI ============
    function initUI() {
      // Block select
      const blockSelect = document.getElementById('blockSelect');
      UNICODE_BLOCKS.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.key;
        opt.textContent = b.name;
        blockSelect.appendChild(opt);
      });
      blockSelect.addEventListener('change', () => {
        currentBlock = blockSelect.value;
        currentCategory = null;
        page = 1;
        updateCategoryTags();
        render();
      });

      // Categories
      const catContainer = document.getElementById('categories');
      HOT_CATEGORIES.forEach(cat => {
        const tag = document.createElement('span');
        tag.className = 'category-tag';
        tag.textContent = cat.label;
        tag.addEventListener('click', () => {
          currentCategory = (currentCategory === cat.label) ? null : cat.label;
          currentBlock = 'all';
          document.getElementById('blockSelect').value = 'all';
          page = 1;
          updateCategoryTags();
          render();
        });
        catContainer.appendChild(tag);
      });

      // Search
      const searchInput = document.getElementById('searchInput');
      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchQuery = searchInput.value;
          page = 1;
          render();
        }, 250);
      });

      updateCategoryTags();
      render();
    }

    function updateCategoryTags() {
      document.querySelectorAll('.category-tag').forEach(tag => {
        tag.classList.toggle('active', tag.textContent === currentCategory);
      });
    }

    initUI();
  })();
  </script>
