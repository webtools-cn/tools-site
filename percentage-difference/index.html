  <h1>📊 百分比差异计算器</h1>
  <p class="subtitle">以平均值为基准，对称计算两个数值的百分比差异</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>数值 A</label><input type="number" id="valA" placeholder="输入数值A" step="any"></div>
      <div class="form-group"><label>数值 B</label><input type="number" id="valB" placeholder="输入数值B" step="any"></div>

    </div>

<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
document.getElementById('btnCalc').addEventListener('click',function(){
  var a=parseFloat(document.getElementById('valA').value);
  var b=parseFloat(document.getElementById('valB').value);
  if(isNaN(a)||isNaN(b)){showToast('请输入两个有效数值');return}
  var diff=Math.abs(a-b);
  var avg=(Math.abs(a)+Math.abs(b))/2;
  var pct=avg===0?0:(diff/avg*100);
  document.getElementById('diffResult').textContent=pct.toFixed(2)+'%';
  document.getElementById('detailResult').innerHTML='|A - B| = '+diff.toFixed(4)+'<br>平均值 = '+avg.toFixed(4)+'<br>A='+a+', B='+b;
  document.getElementById('formulaBox').textContent='公式: |A - B| / ((|A| + |B|) / 2) × 100%';
  document.getElementById('result').style.display='block';
});
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
