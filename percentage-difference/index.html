<main>
  <h1>📊 百分比差异计算器</h1>
  <p class="subtitle">以平均值为基准，对称计算两个数值的百分比差异</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>数值 A</label><input type="number" id="valA" placeholder="输入数值A" step="any"></div>
      <div class="form-group"><label>数值 B</label><input type="number" id="valB" placeholder="输入数值B" step="any"></div>
    </div>
    <button class="btn" id="btnCalc">📊 计算百分比差异</button>
    <div class="result" id="result" style="display:none">
      <div>百分比差异</div>
      <div class="diff" id="diffResult">0%</div>
      <div class="detail" id="detailResult"></div>
      <div class="formula" id="formulaBox"></div>
    </div>
  </div>
</main>

<script>
document.getElementById('btnCalc').addEventListener('click',function(){
  var a=parseFloat(document.getElementById('valA').value);
  var b=parseFloat(document.getElementById('valB').value);
  if(isNaN(a)||isNaN(b)){alert('请输入两个有效数值');return}
  var diff=Math.abs(a-b);
  var avg=(Math.abs(a)+Math.abs(b))/2;
  var pct=avg===0?0:(diff/avg*100);
  document.getElementById('diffResult').textContent=pct.toFixed(2)+'%';
  document.getElementById('detailResult').innerHTML='|A - B| = '+diff.toFixed(4)+'<br>平均值 = '+avg.toFixed(4)+'<br>A='+a+', B='+b;
  document.getElementById('formulaBox').textContent='公式: |A - B| / ((|A| + |B|) / 2) × 100%';
  document.getElementById('result').style.display='block';
});
</script>
