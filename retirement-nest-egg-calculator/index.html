  <main>

    <p class="subtitle">规划您的退休目标，了解需要多少储蓄才能安心退休。</p>

    <div class="card" id="input-card">
      <h2>📋 输入信息</h2>
      <div class="form-group">
        <label>当前年龄 <span class="hint">（岁）</span></label>
        <div class="input-row">
          <input type="number" id="currentAge" value="30" min="18" max="80" placeholder="30">

        </div>
      </div>
      <div class="form-group">
        <label>退休年龄 <span class="hint">（岁）</span></label>
        <div class="input-row">
          <input type="number" id="retireAge" value="60" min="30" max="90" placeholder="60">
          <span class="unit">岁</span>
        </div>
      </div>
      <div class="form-group">
        <label>预期寿命 <span class="hint">（岁）</span></label>
        <div class="input-row">

      <div class="form-group">
        <label>当前储蓄 <span class="hint">（元）</span></label>

        </div>

          <span class="unit">%</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnCalc">📊 计算</button>
        <button class="btn btn-secondary" id="btnClear">🔄 清空</button>
      </div>

  <div id="toast"></div>

  <script>
    function formatMoney(n) {
      if (Math.abs(n) >= 1e8) return '¥' + (n / 1e8).toFixed(2) + '亿';
      if (Math.abs(n) >= 1e4) return '¥' + (n / 1e4).toFixed(2) + '万';
      return '¥' + n.toLocaleString('zh-CN', {maximumFractionDigits: 2});
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }

    function calculate() {
      var currentAge = parseInt(document.getElementById('currentAge').value) || 30;
      var retireAge = parseInt(document.getElementById('retireAge').value) || 60;
      var lifeExpectancy = parseInt(document.getElementById('lifeExpectancy').value) || 85;
      var currentSavings = parseFloat(document.getElementById('currentSavings').value) || 0;
      var monthlyDeposit = parseFloat(document.getElementById('monthlyDeposit').value) || 0;
      var annualReturn = parseFloat(document.getElementById('annualReturn').value) || 6;

      if (retireAge <= currentAge) {
        showToast('退休年龄必须大于当前年龄');
        return;
      }
      if (lifeExpectancy <= retireAge) {
        showToast('预期寿命必须大于退休年龄');
        return;
      }

      var yearsToRetire = retireAge - currentAge;
      var monthsToRetire = yearsToRetire * 12;
      var monthlyRate = annualReturn / 100 / 12;

      // 退休时总储蓄 = currentSavings复利 + monthlyDeposit年金终值
      var futureSavings = currentSavings * Math.pow(1 + monthlyRate, monthsToRetire);
      if (monthlyRate > 0) {
        futureSavings += monthlyDeposit * (Math.pow(1 + monthlyRate, monthsToRetire) - 1) / monthlyRate;
      } else {
        futureSavings += monthlyDeposit * monthsToRetire;
      }

      // 本金总额
      var totalPrincipal = currentSavings + monthlyDeposit * monthsToRetire;
      var totalGains = futureSavings - totalPrincipal;

      // 退休后可支取年数
      var retirementYears = lifeExpectancy - retireAge;
      var retirementMonths = retirementYears * 12;

      // 每月可支取（继续增值：PMT公式）
      var monthlyWithdrawal = 0;
      if (monthlyRate > 0) {
        monthlyWithdrawal = futureSavings * monthlyRate * Math.pow(1 + monthlyRate, retirementMonths)
          / (Math.pow(1 + monthlyRate, retirementMonths) - 1);
      } else {
        monthlyWithdrawal = futureSavings / retirementMonths;
      }

      // 显示
      document.getElementById('result-total').querySelector('.result-value').textContent = formatMoney(futureSavings);
      document.getElementById('result-monthly').querySelector('.result-value').textContent = formatMoney(monthlyWithdrawal);
      document.getElementById('result-contributions').querySelector('.result-value').textContent = formatMoney(totalPrincipal);
      document.getElementById('result-gains').querySelector('.result-value').textContent = formatMoney(totalGains);

      var principalPct = futureSavings > 0 ? (totalPrincipal / futureSavings * 100) : 50;
      document.getElementById('bar-principal').style.width = principalPct + '%';
      document.getElementById('bar-principal').nextElementSibling || (function(){
        var gainBar = document.createElement('div');
        gainBar.className = 'bar-fill gains';
        gainBar.style.width = (100 - principalPct) + '%';
        document.getElementById('bar-principal').parentNode.appendChild(gainBar);
      })();

      var warningBox = document.getElementById('warning-box');
      if (monthlyWithdrawal < 3000) {
        warningBox.style.display = 'block';
        warningBox.textContent = '⚠️ 提示：退休后每月可支取金额较低，建议增加每月储蓄或延迟退休年龄。';
      } else {
        warningBox.style.display = 'none';
      }

      document.getElementById('results-card').classList.add('visible');
      window._lastResults = {
        futureSavings: futureSavings,
        monthlyWithdrawal: monthlyWithdrawal,
        totalPrincipal: totalPrincipal,
        totalGains: totalGains,
        yearsToRetire: yearsToRetire,
        retirementYears: retirementYears
      };
    }

    function clearAll() {
      document.getElementById('currentAge').value = '30';
      document.getElementById('retireAge').value = '60';
      document.getElementById('lifeExpectancy').value = '85';
      document.getElementById('currentSavings').value = '100000';
      document.getElementById('monthlyDeposit').value = '2000';
      document.getElementById('annualReturn').value = '6';
      document.getElementById('results-card').classList.remove('visible');
    }

    function copyResults() {
      if (!window._lastResults) return;
      var r = window._lastResults;
      var text = '退休储蓄计算结果\n' +
        '退休时总储蓄: ' + formatMoney(r.futureSavings) + '\n' +
        '退休后每月可支取: ' + formatMoney(r.monthlyWithdrawal) + '\n' +
        '本金总额: ' + formatMoney(r.totalPrincipal) + '\n' +
        '投资收益: ' + formatMoney(r.totalGains) + '\n' +
        '积累年限: ' + r.yearsToRetire + '年\n' +
        '退休生活年限: ' + r.retirementYears + '年\n';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){
          showToast('✅ 结果已复制到剪贴板');
        }).catch(function(){
          showToast('复制失败，请手动选择');
        });
      } else {
        showToast('复制失败，请手动选择');
      }
    }

    document.getElementById('btnCalc').addEventListener('click', calculate);
    document.getElementById('btnClear').addEventListener('click', clearAll);
    document.getElementById('btnCopy').addEventListener('click', copyResults);
  </script>
