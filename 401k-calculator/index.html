<script>
(function(){
const $=s=>document.getElementById(s);
const currentAge=$('currentAge'),retireAge=$('retireAge'),annualSalary=$('annualSalary'),
currentBalance=$('currentBalance'),contributePct=$('contributePct'),employerMatch=$('employerMatch'),
matchLimit=$('matchLimit'),annualReturn=$('annualReturn'),salaryGrowth=$('salaryGrowth'),
contributionLimit=$('contributionLimit');
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
const age=+currentAge.value,retire=+retireAge.value,salary=+annualSalary.value,
bal=+currentBalance.value,myPct=+contributePct.value/100,matchPct=+employerMatch.value/100,
limit=+matchLimit.value/100,ret=+annualReturn.value/100,grow=+salaryGrowth.value/100,
cap=+contributionLimit.value;
if(age>=retire){showToast('退休年龄必须大于当前年龄');return}
const years=retire-age;
let total=bal,totalMyContrib=0,totalMatch=0,totalGain=0;
let curSalary=salary;
for(let y=0;y<years;y++){
let myContrib=Math.min(curSalary*myPct,cap);
let match=Math.min(myContrib*matchPct,curSalary*limit);
totalMyContrib+=myContrib;
totalMatch+=match;
let yearContrib=myContrib+match;
total+=yearContrib;
total=total*(1+ret);
curSalary*=(1+grow);
}
totalGain=total-totalMyContrib-totalMatch-bal;
let taxRate=0.22;
$('totalValue').textContent=fmt(total);
$('yourContrib').textContent=fmt(totalMyContrib);
$('employerContrib').textContent=fmt(totalMatch);
$('investmentGain').textContent=fmt(totalGain);
$('taxSaving').textContent=fmt((totalMyContrib+totalMatch)*taxRate);
$('annualTotal').textContent=fmt(Math.min(salary*myPct,cap)+Math.min(Math.min(salary*myPct,cap)*matchPct,salary*limit));
drawChart(bal,totalMyContrib,totalMatch,totalGain,years);
}
function drawChart(init,your,match,gain,years){
const canvas=$('growthChart'),ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const w=canvas.parentElement.clientWidth-32,h=280;
canvas.width=w*dpr;canvas.height=h*dpr;
canvas.style.width=w+'px';canvas.style.height=h+'px';
ctx.scale(dpr,dpr);
ctx.clearRect(0,0,w,h);
const max=Math.max(init+your+match+gain,1);
const yrData=[];let v=init;
for(let i=0;i<=years;i++){yrData.push(v);v=(v+your/years+match/years)*(1+(+annualReturn.value/100))}
const scaleY=h/(max*1.1),barW=Math.max(2,(w-80)/years);
ctx.fillStyle='rgba(148,163,184,.15)';ctx.strokeStyle='rgba(148,163,184,.3)';
for(let i=0;i<=5;i++){const y=h-(max/5*i*scaleY);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.fillText('$'+(max/5*i).toFixed(0),2,y+4)}
ctx.fillStyle='rgba(34,211,238,.6)';
for(let i=0;i<years;i++){const x=40+i*barW,height=yrData[i]*scaleY;ctx.fillRect(x,h-height,barW-1,height)}
ctx.fillStyle='rgba(249,115,22,.4)';
for(let i=0;i<years;i++){const x=40+i*barW,height=(your+match)/years*i*scaleY;ctx.fillRect(x,h-height,barW-1,height)}
ctx.fillStyle='#22d3ee';ctx.font='12px sans-serif';ctx.fillText('📈 总值',w-80,20)
ctx.fillStyle='#f97316';ctx.fillText('🏢 贡献',w-80,40)
}
function reset(){
currentAge.value=30;retireAge.value=65;annualSalary.value=80000;currentBalance.value=20000;
contributePct.value=10;employerMatch.value=50;matchLimit.value=6;annualReturn.value=7;
salaryGrowth.value=3;contributionLimit.value=23000;
$('totalValue').textContent='-';$('yourContrib').textContent='-';
$('employerContrib').textContent='-';$('investmentGain').textContent='-';
$('taxSaving').textContent='-';$('annualTotal').textContent='-';
const canvas=$('growthChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height)
}
function copyResult(){
const lines=['=== 401k退休金预估 ===',
'退休时总额: '+$('totalValue').textContent,
'个人贡献: '+$('yourContrib').textContent,
'雇主匹配: '+$('employerContrib').textContent,
'投资收益: '+$('investmentGain').textContent,
'税前节省: '+$('taxSaving').textContent];
navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ 已复制到剪贴板')).catch(()=>showToast('复制失败'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
