<div class="container">
<div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="9876543210" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

    <div class="input-row">
      <div class="input-group">
        <label>每日热量目标 (kcal)</label>
        <input type="number" id="calories" value="2000" min="800" max="8000" step="50">
      </div>
      <div class="input-group">
        <label>饮食模式</label>
        <select id="diet-type">
          <option value="low">低碳饮食 (20%碳水)</option>
          <option value="balanced" selected>均衡饮食 (50%碳水)</option>
          <option value="high">高碳饮食 (65%碳水)</option>
          <option value="custom">自定义比例</option>
        </select>
      </div>
      <div class="input-group" id="custom-pct-group" style="display:none">
        <label>碳水占比 (%)</label>
        <input type="number" id="custom-pct" value="50" min="5" max="80" step="5">
      </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="calculate()">🔍 计算</button>

      <div class="result-card">
        <div class="label">每日碳水摄入</div>
        <div class="value" id="carb-g">0g</div>
        <div class="sub" id="carb-pct"></div>
      </div>
      <div class="result-card">
        <div class="label">碳水热量</div>
        <div class="value" id="carb-cal">0 kcal</div>
        <div class="sub">4 kcal/g</div>
      </div>
      <div class="result-card">
        <div class="label">每餐碳水 (按4餐)</div>
        <div class="value" id="per-meal">0g</div>
        <div class="sub">建议分餐摄入</div>
      </div>
    </div>
    <h2 style="margin-top:16px;font-size:1rem;color:#f1f5f9">🍽️ 常见食物碳水含量 (每100g)</h2>

      <div class="food-item"><div class="food-name">🍚 白米饭</div><div class="food-carb">28g</div></div>
      <div class="food-item"><div class="food-name">🍞 全麦面包</div><div class="food-carb">41g</div></div>
      <div class="food-item"><div class="food-name">🍠 红薯</div><div class="food-carb">20g</div></div>
      <div class="food-item"><div class="food-name">🍌 香蕉</div><div class="food-carb">23g</div></div>
      <div class="food-item"><div class="food-name">🥔 土豆</div><div class="food-carb">17g</div></div>
      <div class="food-item"><div class="food-name">🍝 意大利面</div><div class="food-carb">31g</div></div>

<script>
document.getElementById("diet-type").addEventListener("change",function(){
  document.getElementById("custom-pct-group").style.display=this.value==="custom"?"block":"none";
});
function calculate(){
  var cal=parseFloat(document.getElementById("calories").value)||2000;
  var diet=document.getElementById("diet-type").value;
  var pct;
  if(diet==="low")pct=20;
  else if(diet==="balanced")pct=50;
  else if(diet==="high")pct=65;
  else pct=parseFloat(document.getElementById("custom-pct").value)||50;
  var carbG=Math.round(cal*pct/100/4);
  var carbCal=Math.round(cal*pct/100);
  var perMeal=Math.round(carbG/4);
  document.getElementById("carb-g").textContent=carbG+"g";
  document.getElementById("carb-pct").textContent="占总热量"+pct+"%";
  document.getElementById("carb-cal").textContent=carbCal+" kcal";
  document.getElementById("per-meal").textContent=perMeal+"g";
  var adv;
  if(diet==="low")adv="💡 低碳模式适合减脂期，碳水仅占20%。注意补充膳食纤维和电解质，可能出现初期乏力（酮流感）。";
  else if(diet==="high")adv="💡 高碳模式适合高强度训练者/耐力运动员，碳水占65%提供充足糖原储备。选择低GI碳水更佳。";
  else adv="💡 均衡模式碳水占50%，适合大多数人群。建议选择全谷物、薯类等复合碳水，控制精制糖摄入。";
  document.getElementById("advice").textContent=adv;
  document.getElementById("results").style.display="block";
}
function clearAll(){
  document.getElementById("calories").value=2000;
  document.getElementById("diet-type").value="balanced";
  document.getElementById("custom-pct").value=50;
  document.getElementById("custom-pct-group").style.display="none";
  document.getElementById("results").style.display="none";
}

function copyResult(){
  let text = '';
  const cards = document.querySelectorAll('.result-card');
  cards.forEach(c => {
    const label = c.querySelector('.label');
    const value = c.querySelector('.value');
    if (label && value && value.textContent !== '-' && value.textContent !== '') {
      text += label.textContent.trim() + ': ' + value.textContent.trim() + '\n';
    }
  });
  if (!text) {
    const vals = document.querySelectorAll('.result-card .value');
    const lbls = document.querySelectorAll('.result-card .label');
    for (let i = 0; i < vals.length; i++) {
      if (vals[i].textContent !== '-' && vals[i].textContent !== '') {
        text += (lbls[i]?.textContent?.trim() || '') + ': ' + vals[i].textContent.trim() + '\n';
      }
    }
  }
  if (!text) { text = 'No results to copy'; }
  navigator.clipboard.writeText(text.trim()).then(() => {
    showToast?.('已复制到剪贴板') || showToast?.('Copied to clipboard');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text.trim();
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast?.('已复制到剪贴板') || showToast?.('Copied to clipboard');
  });
}

</script>
