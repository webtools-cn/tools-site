  <main>
    <h1>CSV转HTML表格</h1>
    <p class="subtitle">CSV数据一键转HTML表格代码，支持表头识别和自定义样式</p>
    <div class="tool-area">
      <label for="csvInput">粘贴CSV数据</label>
      <textarea id="csvInput" placeholder="姓名,年龄,城市\n张三,30,北京\n李四,25,上海"></textarea>
      <div class="row">
        <div><label><input type="checkbox" id="firstRowHeader" checked> 首行为表头</label></div>
        <div><label for="tableClass">表格CSS类</label><input type="text" id="tableClass" placeholder="表格样式"></div>
      </div>
      <div class="row">
        <button class="btn" id="convertBtn">转换</button>
        <button class="btn btn-secondary" id="copyBtn">复制HTML</button>
      </div>
      <label style="margin-top:16px">HTML代码</label>
      <textarea id="htmlOutput" readonly style="font-family:monospace;font-size:.85rem"></textarea>
      <label style="margin-top:12px">表格预览</label>
      <div id="tablePreview" class="output" style="overflow-x:auto"></div>
      <script>
      function parseCSV(text) {
        var rows = [], lines = text.trim().split(/\n/);
        lines.forEach(function(line) {
          var cols = [], inQuote = false, col = '';
          for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (ch === '"') { inQuote = !inQuote; }
            else if (ch === ',' && !inQuote) { cols.push(col.trim()); col = ''; }
            else { col += ch; }
          }
          cols.push(col.trim()); rows.push(cols);
        });
        return rows;
      }
      function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      document.getElementById('convertBtn').addEventListener('click', function() {
        var csv = document.getElementById('csvInput').value;
        if (!csv.trim()) { showToast('请粘贴CSV数据'); return; }
        var rows = parseCSV(csv);
        if (!rows.length) { showToast('CSV格式无效'); return; }
        var useHeader = document.getElementById('firstRowHeader').checked;
        var cls = document.getElementById('tableClass').value || '';
        var html = '<table' + (cls ? ' class="' + cls.replace(/"/g,'') + '"' : '') + '>\n';
        var startRow = 0;
        if (useHeader && rows.length > 0) {
          html += '  <thead>\n    <tr>\n';
          rows[0].forEach(function(cell) { html += '      <th>' + escapeHtml(cell) + '</th>\n'; });
          html += '    </tr>\n  </thead>\n  <tbody>\n';
          startRow = 1;
        } else { html += '  <tbody>\n'; }
        for (var i = startRow; i < rows.length; i++) {
          html += '    <tr>\n';
          rows[i].forEach(function(cell) { html += '      <td>' + escapeHtml(cell) + '</td>\n'; });
          html += '    </tr>\n';
        }
        html += '  </tbody>\n</table>';
        document.getElementById('htmlOutput').value = html;
        document.getElementById('tablePreview').innerHTML = html;
        showToast('转换完成！');
      });
      document.getElementById('copyBtn').addEventListener('click', function() {
        var html = document.getElementById('htmlOutput').value;
        if (!html) { showToast('请先转换'); return; }
        copyText(html);
      });
      </script>
    </div>

  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('已复制！')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制！');
    }
  }
  </script>
