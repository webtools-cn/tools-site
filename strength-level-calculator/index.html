<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
// Strength standards based on bodyweight ratio (simplified from common standards)
// Levels: Beginner, Novice, Intermediate, Advanced, Elite
var levels = ['新手', '入门', '中级', '高级', '精英'];
var levelColors = ['#94a3b8','#22c55e','#3b82f6','#a855f7','#ef4444'];

// Standards: ratios for bench/squat/deadlift by gender
var standards = {
  male: {
    bench:   [0.5, 0.75, 1.0, 1.25, 1.5],
    squat:   [0.75, 1.0, 1.25, 1.5, 1.75],
    deadlift:[0.9, 1.2, 1.5, 1.8, 2.1]
  },
  female: {
    bench:   [0.3, 0.45, 0.6, 0.8, 1.0],
    squat:   [0.5, 0.7, 0.9, 1.1, 1.3],
    deadlift:[0.6, 0.85, 1.1, 1.35, 1.6]
  }
};

function getLevel(weight, bw, stds){
  for(var i=0;i<stds.length;i++){
    if(weight/bw < stds[i]) return i;
  }
  return 5; // above elite
}

function getLevelLabel(lvl){
  if(lvl <= 0) return '新手';
  if(lvl >= 5) return '精英+';
  return levels[lvl-1];
}

document.getElementById('btnCalc').addEventListener('click',function(){
  var bw = parseFloat(document.getElementById('bodyweight').value) || 70;
  var gender = document.getElementById('gender').value;
  var bench = parseFloat(document.getElementById('bench').value) || 0;
  var squat = parseFloat(document.getElementById('squat').value) || 0;
  var deadlift = parseFloat(document.getElementById('deadlift').value) || 0;

  if(bw <= 0){ showToast('请输入有效体重'); return; }
  if(bench===0 && squat===0 && deadlift===0){ showToast('请至少输入一项力量数据'); return; }

  var std = standards[gender];
  var benchLvl = bench > 0 ? getLevel(bench, bw, std.bench) : -1;
  var squatLvl = squat > 0 ? getLevel(squat, bw, std.squat) : -1;
  var deadliftLvl = deadlift > 0 ? getLevel(deadlift, bw, std.deadlift) : -1;

  var lifts = [
    {name:'卧推', weight:bench, lvl:benchLvl, ratio:bench/bw, std:std.bench},
    {name:'深蹲', weight:squat, lvl:squatLvl, ratio:squat/bw, std:std.squat},
    {name:'硬拉', weight:deadlift, lvl:deadliftLvl, ratio:deadlift/bw, std:std.deadlift}
  ];

  var total = bench + squat + deadlift;
  var avgLvl = 0, cnt = 0;
  lifts.forEach(function(l){
    if(l.lvl >= 0){ avgLvl += l.lvl; cnt++; }
  });
  avgLvl = cnt > 0 ? Math.round(avgLvl / cnt) : 0;

  var html = '<div>综合力量等级</div>';
  html += '<div class="final">' + getLevelLabel(avgLvl) + '</div>';
  html += '<div class="level-bar"><div class="level-fill" style="width:' + (Math.min(avgLvl,5)*20) + '%;background:' + (levelColors[Math.min(avgLvl-1,4)]||levelColors[4]) + '"></div></div>';
  html += '<div class="detail">三项总重量：' + total.toFixed(1) + ' kg | 体重：' + bw + ' kg</div>';

  lifts.forEach(function(l){
    if(l.lvl < 0) return;
    var nextLvl = l.lvl <= 0 ? std[l.lvl] : (l.lvl < 5 ? std[l.lvl] : std[4]);
    var progress = l.lvl <= 0 ? 0 : Math.min((l.ratio - std[l.lvl-1])/(std[Math.min(l.lvl,4)] - std[l.lvl-1])*100, 100);
    html += '<div class="strength-row">';
    html += '<div class="lift-name">' + l.name + '：' + l.weight + ' kg （体重 ' + (l.ratio*100).toFixed(0) + '%）</div>';
    html += '<span class="level-tag" style="background:' + (levelColors[Math.min(l.lvl-1,4)]||'#94a3b8') + ';color:#fff">' + getLevelLabel(l.lvl) + '</span>';
    html += '<div class="level-bar"><div class="level-fill" style="width:' + progress + '%;background:' + (levelColors[Math.min(l.lvl-1,4)]||levelColors[4]) + '"></div></div>';
    html += '</div>';
  });

  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('result').style.display = 'block';
});

document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('bodyweight').value = '70';
  document.getElementById('bench').value = '80';
  document.getElementById('squat').value = '100';
  document.getElementById('deadlift').value = '120';
  document.getElementById('gender').value = 'male';
  document.getElementById('result').style.display = 'none';
});
</script>

<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
