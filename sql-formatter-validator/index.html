<script>
const SQL_KEYWORDS = new Set([
  'SELECT','FROM','WHERE','AND','OR','NOT','IN','IS','NULL','LIKE','BETWEEN','EXISTS',
  'INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','ADD','DROP',
  'COLUMN','INDEX','VIEW','TRIGGER','PROCEDURE','FUNCTION','DATABASE','SCHEMA','IF',
  'PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT','UNIQUE','CHECK','DEFAULT',
  'JOIN','LEFT','RIGHT','INNER','OUTER','CROSS','FULL','ON','AS','DISTINCT','ALL',
  'GROUP','BY','HAVING','ORDER','ASC','DESC','LIMIT','OFFSET','UNION','INTERSECT',
  'EXCEPT','CASE','WHEN','THEN','ELSE','END','BEGIN','COMMIT','ROLLBACK','TRANSACTION',
  'GRANT','REVOKE','WITH','RECURSIVE','RETURNING','REPLACE','TRUNCATE','MERGE',
  'COUNT','SUM','AVG','MAX','MIN','COALESCE','NULLIF','CAST','CONVERT','EXTRACT',
  'TRUE','FALSE','BOOLEAN','INT','INTEGER','BIGINT','SMALLINT','VARCHAR','TEXT',
  'CHAR','DATE','TIMESTAMP','TIME','DECIMAL','NUMERIC','FLOAT','DOUBLE','JSON','JSONB',
  'SERIAL','UUID','ENUM','ARRAY','CASCADE','RESTRICT','NO','ACTION','TEMPORARY','TEMP',
  'EXPLAIN','ANALYZE','VACUUM','PARTITION','OVER','WINDOW','LATERAL','ILIKE','SIMILAR',
  'NATURAL','USING','DO','NOTHING','CONFLICT','ONLY','MATERIALIZED','EXTENSION',
  'CONCURRENTLY','TABLESPACE','ROLE','USER','PASSWORD','LOGIN','SUPERUSER','CREATEDB',
  'ENCRYPTED','BYPASSRLS','REPLICATION','INHERIT','OWNER','PRIVILEGES','TYPE','DOMAIN',
  'SEQUENCE','GENERATED','ALWAYS','IDENTITY','STORED','VIRTUAL'
]);

const SQL_FUNCTIONS = new Set([
  'NOW','CURRENT_TIMESTAMP','CURRENT_DATE','CURRENT_TIME','LOCALTIME','LOCALTIMESTAMP',
  'UPPER','LOWER','TRIM','LTRIM','RTRIM','LENGTH','CHAR_LENGTH','SUBSTRING','SUBSTR',
  'REPLACE','CONCAT','CONCAT_WS','LEFT','RIGHT','REVERSE','REPEAT','POSITION','SPLIT_PART',
  'ABS','CEIL','CEILING','FLOOR','ROUND','TRUNC','MOD','POWER','SQRT','RANDOM','RAND',
  'DATE_TRUNC','DATE_PART','DATE_ADD','DATE_SUB','DATEDIFF','AGE','TO_CHAR','TO_DATE',
  'TO_TIMESTAMP','TO_NUMBER','STRING_AGG','ARRAY_AGG','JSON_AGG','JSON_BUILD_OBJECT',
  'JSONB_BUILD_OBJECT','ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD','FIRST_VALUE','LAST_VALUE',
  'NTH_VALUE','NTILE','CUME_DIST','PERCENT_RANK','REGEXP_REPLACE','REGEXP_MATCHES','MD5','SHA256',
  'GEN_RANDOM_UUID','UUID_GENERATE_V4','GREATEST','LEAST','NULLIF','COALESCE'
]);

function formatSQL() {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请输入SQL语句'); return; }
  const dialect = document.getElementById('dialect').value;
  const indentOpt = document.getElementById('indent').value;
  const indent = indentOpt === 'tab' ? '\t' : ' '.repeat(parseInt(indentOpt));

  let sql = input.replace(/\s+/g, ' ').trim();
  
  // 主要关键字前换行
  const majorKeywords = ['SELECT','FROM','WHERE','GROUP BY','HAVING','ORDER BY','LIMIT','OFFSET',
    'INSERT INTO','VALUES','UPDATE','SET','DELETE FROM','CREATE TABLE','ALTER TABLE','DROP',
    'JOIN','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN','CROSS JOIN','FULL JOIN',
    'UNION ALL','UNION','INTERSECT','EXCEPT','ON','RETURNING','WITH'];
  
  const reMajor = new RegExp('\\b(' + majorKeywords.map(k => k.replace(/\s/g, '\\s+')).join('|') + ')\\b', 'gi');
  
  sql = sql.replace(reMajor, '\n$1');
  
  // 清理开头换行
  sql = sql.replace(/^\n+/, '');
  
  // 缩进处理
  const lines = sql.split('\n');
  let formatted = [];
  let depth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    // 检测减少缩进的关键字（这些行的前一行应该减少缩进）
    const decIndent = /^(\)|\)\s*,|UNION|UNION ALL|INTERSECT|EXCEPT|RETURNING)/i;
    
    if (i > 0 && !decIndent.test(line)) {
      // 如果上一行以逗号结尾或是某些子句，保持深度
    }
    
    // 检测深度变化
    const openParen = (line.match(/\(/g) || []).length;
    const closeParen = (line.match(/\)/g) || []).length;
    
    if (closeParen > openParen) {
      depth = Math.max(0, depth - (closeParen - openParen));
    }
    
    formatted.push(indent.repeat(depth) + line);
    
    if (openParen > closeParen) {
      depth += (openParen - closeParen);
    }
    
    // 逗号结尾的 VALUES 项目特殊缩进
    if (/\bVALUES\b/i.test(line) && line.endsWith(',')) {
      depth = 1;
    }
  }
  
  let result = formatted.join('\n');
  
  // 语法高亮
  result = highlightSQL(result);
  
  document.getElementById('output').innerHTML = result;
  updateStats(input);
  document.getElementById('messages').innerHTML = '';
}

function highlightSQL(sql) {
  // 转义HTML
  let escaped = sql.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  
  // 注释
  escaped = escaped.replace(/(--[^\n]*)/g, '<span class="cmt">$1</span>');
  escaped = escaped.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>');
  
  // 字符串
  escaped = escaped.replace(/('(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>');
  
  // 数字
  escaped = escaped.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
  
  // 函数
  const fnPattern = new RegExp('\\b(' + [...SQL_FUNCTIONS].join('|') + ')\\s*\\(', 'gi');
  escaped = escaped.replace(fnPattern, '<span class="fn">$&</span>');
  
  // 关键字
  const kwPattern = new RegExp('\\b(' + [...SQL_KEYWORDS].join('|') + ')\\b', 'gi');
  escaped = escaped.replace(kwPattern, '<span class="kw">$1</span>');
  
  return escaped;
}

function validateSQL() {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请输入SQL语句'); return; }
  
  const errors = [];
  const dialect = document.getElementById('dialect').value;
  
  // 基本语法检查
  const upperInput = input.toUpperCase();
  
  // 括号匹配
  let depth = 0;
  for (let i = 0; i < input.length; i++) {
    if (input[i] === '(') depth++;
    if (input[i] === ')') depth--;
    if (depth < 0) {
      errors.push({line: getLineNumber(input, i), msg: '括号不匹配：多余的右括号'});
      depth = 0;
    }
  }
  if (depth > 0) {
    errors.push({line: getLineNumber(input, input.length-1), msg: `括号不匹配：缺少 ${depth} 个右括号`});
  }
  
  // 引号匹配
  const singleQuotes = (input.match(/'/g) || []).length;
  if (singleQuotes % 2 !== 0) {
    errors.push({line: getLineNumber(input, input.lastIndexOf("'")), msg: '单引号不匹配'});
  }
  
  // 常见语法检查
  if (/\bSELECT\b/i.test(upperInput) && !/\bFROM\b/i.test(upperInput) && !/SELECT\s+\*/.test(input)) {
    // SELECT通常需要FROM，除非是SELECT表达式
    if (!/SELECT\s+\d|SELECT\s+'|SELECT\s+NULL|SELECT\s+CURRENT/i.test(input)) {
      errors.push({line: 1, msg: 'SELECT语句可能缺少FROM子句（如果是表达式请忽略）'});
    }
  }
  
  if (/\bINSERT\b/i.test(upperInput) && !/\bINTO\b/i.test(upperInput)) {
    errors.push({line: 1, msg: 'INSERT语句缺少INTO关键字'});
  }
  
  if (/\bDELETE\b/i.test(upperInput) && !/\bFROM\b/i.test(upperInput)) {
    errors.push({line: 1, msg: 'DELETE语句缺少FROM关键字'});
  }
  
  // 分号检查
  if (!/;\s*$/.test(input.trim())) {
    errors.push({line: getLineNumber(input, input.length-1), msg: '提示：语句末尾缺少分号'});
  }
  
  // 逗号后检查
  const trailingComma = /,\s*(FROM|WHERE|GROUP|HAVING|ORDER|LIMIT|OFFSET|\))/i;
  if (trailingComma.test(input)) {
    errors.push({line: 1, msg: '可能存在多余的逗号（逗号后直接跟关键字）'});
  }
  
  const msgDiv = document.getElementById('messages');
  if (errors.length === 0) {
    msgDiv.innerHTML = '<div class="success-msg">✅ SQL语法验证通过，未发现明显错误</div>';
    showToast('验证通过');
  } else {
    msgDiv.innerHTML = '<div class="errors-list">' + 
      errors.map((e, i) => `<div class="error-item"><span class="line-num">行${e.line}</span>${e.msg}</div>`).join('') +
      '</div>';
    showToast(`发现 ${errors.length} 个问题`);
  }
}

function getLineNumber(text, pos) {
  return text.substring(0, pos).split('\n').length;
}

function updateStats(input) {
  const stmts = input.split(';').filter(s => s.trim()).length;
  document.getElementById('stmtCount').textContent = stmts;
  document.getElementById('charCount').textContent = input.length;
  const tables = (input.match(/\b(FROM|JOIN|INTO|UPDATE|TABLE)\s+([`"\[]?\w+[`"\]]?)/gi) || []).length;
  document.getElementById('tableCount').textContent = tables;
}

function copyOutput() {
  const output = document.getElementById('output').textContent;
  if (!output || output === '等待输入...') { showToast('请先格式化SQL'); return; }
  navigator.clipboard.writeText(output).then(() => showToast('已复制到剪贴板'));
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').innerHTML = '等待输入...';
  document.getElementById('messages').innerHTML = '';
  document.getElementById('stmtCount').textContent = '0';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('tableCount').textContent = '0';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// 示例加载
document.addEventListener('DOMContentLoaded', () => {
  const sample = `SELECT u.id, u.name, u.email, COUNT(o.id) AS order_count
FROM users u
LEFT JOIN orders o ON u.id = o.user_id
WHERE u.status = 'active'
  AND u.created_at > '2024-01-01'
GROUP BY u.id, u.name, u.email
HAVING COUNT(o.id) > 5
ORDER BY order_count DESC
LIMIT 20;`;
  document.getElementById('input').value = sample;
  updateStats(sample);
});
</script>
