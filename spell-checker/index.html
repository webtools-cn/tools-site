<script>
(function() {
  'use strict';
  // 常见拼写错误词典（correct: [misspellings]）
  const corrections = {
    'the': ['teh', 'hte', 'th e'],
    'and': ['adn', 'nad', 'an d'],
    'have': ['ahve', 'hvae', 'hava'],
    'that': ['taht', 'thta', 'tht'],
    'with': ['wiht', 'wtih', 'wit'],
    'you': ['yuo', 'oyu', 'yo u'],
    'this': ['tihs', 'thsi', 'tis'],
    'they': ['tehy', 'thye'],
    'their': ['thier', 'tehir', 'thei r'],
    'there': ['tehre', 'theer', 'ther'],
    'because': ['becuase', 'becasue', 'becuase', 'becouse'],
    'people': ['poeple', 'peopel', 'pepole'],
    'about': ['abotu', 'abuot', 'ab out'],
    'which': ['whcih', 'hwich', 'whic h'],
    'could': ['cuold', 'culd', 'coud'],
    'would': ['wuold', 'woudl', 'woul d'],
    'should': ['shuold', 'shoudl', 'shoul d'],
    'friend': ['freind', 'frend', 'firend'],
    'really': ['realy', 'relly', 'reall y'],
    'great': ['grate', 'gerat', 'grea t'],
    'know': ['kown', 'knwo', 'kno w'],
    'been': ['been', 'ebbe', 'en'],
    'right': ['rihgt', 'rigth', 'righ t'],
    'where': ['wher', 'wher e', 'hwre'],
    'between': ['betwen', 'betwene', 'betewen'],
    'always': ['alwasy', 'alwyas', 'al way s'],
    'another': ['anotehr', 'anothe r', 'anothre'],
    'different': ['differnt', 'differen t', 'diferent'],
    'together': ['togeher', 'togethe r', 'togther'],
    'beautiful': ['beatiful', 'beautful', 'beautifu l'],
    'receive': ['recieve', 'resive', 'rec eve'],
    'believe': ['beleive', 'belive', 'bel eve'],
    'necessary': ['necesary', 'neccessary', 'neccesary'],
    'separate': ['seperate', 'separet', 'seprate'],
    'definitely': ['definately', 'definetly', 'defiantly'],
    'accommodation': ['accomodation', 'acommodation', 'acomodation'],
    'environment': ['enviroment', 'enviro nment', 'enviromnent'],
    'government': ['goverment', 'governmen t', 'gover nment'],
    'information': ['informtion', 'informatin', 'infomation'],
    'experience': ['experiance', 'experence', 'expirence'],
    'opportunity': ['oportunity', 'oppurtunity', 'opertunity'],
    'important': ['importent', 'imporant', 'importan t'],
    'especially': ['especialy', 'expecialy', 'especial ly'],
    'probably': ['probaly', 'probbaly', 'probly']
  };

  // 构建反向映射：错误→正确
  const typos = {};
  for (const [correct, mispellings] of Object.entries(corrections)) {
    for (const m of mispellings) {
      typos[m.toLowerCase()] = correct;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.getElementById('spell-check-btn').addEventListener('click', function() {
    const text = document.getElementById('spell-input').value.trim();
    const resultDiv = document.getElementById('spell-result');
    
    if (!text) { resultDiv.innerHTML = '<span style="color:#ef4444;">请先输入文本</span>'; return; }

    const words = text.split(/\b/);
    let issues = [];
    let corrected = [];
    
    for (const segment of words) {
      const lower = segment.toLowerCase();
      if (typos[lower]) {
        issues.push({ original: segment, correction: typos[lower] });
        // 保持大小写
        const c = typos[lower];
        corrected.push(segment === lower ? c : (segment[0] === segment[0].toUpperCase() ? c[0].toUpperCase() + c.slice(1) : c));
      } else {
        corrected.push(segment);
      }
    }

    if (issues.length === 0) {
      resultDiv.innerHTML = '<span style="color:#22c55e;font-weight:600;">✅ 未发现拼写错误</span>';
      return;
    }

    // 构建结果
    let html = '<div style="margin-bottom:8px;color:#f59e0b;font-weight:600;">⚠️ 发现 ' + issues.length + ' 个拼写问题：</div>';
    for (const {original, correction} of issues) {
      html += '<div style="padding:6px 0;border-bottom:1px dotted var(--border);"><span style="color:#ef4444;text-decoration:line-through;margin-right:8px;">' + original + '</span>→ <span style="color:#22c55e;font-weight:600;">' + correction + '</span></div>';
    }
    html += '<div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--border);">修改后：<br><span style="color:var(--text);">' + corrected.join('') + '</span></div>';
    
    resultDiv.innerHTML = html;
  });
}());
</script>
