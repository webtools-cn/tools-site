<script>
const prefixes = {
  fierce: ['暗影','血月','龙魂','战','狂','弑','灭世','修罗','帝','霸','苍','九幽','天煞','无极','破军','裂天','焚天','冥','屠','荒'],

  esports: ['Pro','God','King','Ace','Elite','Master','Legend','Xx','i','FaZe','NRG','TSM','Sniper','Shadow','Fury','Blitz','Zero','Phantom','Storm','Viper'],
  fantasy: ['剑','仙','道','灵','青云','飞','无极','紫霄','碧落','天玄','玉虚','御','风','云','月','霜','冰','雪','鹤','龙'],
  dark: ['暗夜','深渊','亡灵','死神','影','冥','魂','魔','邪','血','黯','幽','蚀','亡','暗','黑','夜','寒','刃','刹'],
  tech: ['Cyber','Neon','Pixel','Code','Byte','Data','Alpha','Omega','Zero','Nano','Quantum','Cipher','Vector','Matrix','Signal','Core','Node','AI','Bot','Glitch'],
  funny: ['憨憨','沙雕','菜鸡','躺赢','白给','咕咕','猪猪','秃头','肥宅','摸鱼','干饭','摆烂','内卷','韭菜','咸鱼','社恐','熬夜','失眠','吃土','贫穷'],
  english: ['Phantom','Shadow','Dragon','Wolf','Raven','Storm','Blaze','Frost','Vortex','Nebula','Astral','Zenith','Nova','Eclipse','Apex','Reaper','Ghost','Titan','Rogue','Fury']
};
const suffixes = {
  fierce: ['之主','大帝','之神','王者','归来','降临','无双','传说','战神','魔尊'],
  cute: ['酱','宝贝','公主','殿下','天使','甜心','软糖','团子','布丁','奶盖'],
  esports: ['YT','TV','_','Playz','Gaming','OP','Clutch','Savage','Goat','YT_TV'],
  fantasy: ['真人','仙人','散人','居士','道人','掌门','仙子','剑圣','天尊','上仙'],
  dark: ['使者','领主','骑士','之王','之刃','之翼','之影','之魂','之怒','之殇'],
  tech: ['404','_dev','.exe','_bot','.ai','_v2','.js','_api','_io','.net'],
  funny: ['本憨','在此','今天也在','只会','专业','认证','本菜','选手','本咕','大师'],
  english: ['X','_','Pro','HD','YT','TV','OG','V2','FN','OP']
};
const nums = ['','123','007','666','777','888','999','_1','_X','01'];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function generateNames(style, count) {
  const pre = prefixes[style] || prefixes.fierce;
  const suf = suffixes[style] || suffixes.fierce;
  const names = new Set();
  while (names.size < count) {
    const p = pre[Math.floor(Math.random() * pre.length)];
    const s = suf[Math.floor(Math.random() * suf.length)];
    const n = nums[Math.floor(Math.random() * nums.length)];
    const sep = style === 'esports' ? '' : '';
    names.add(p + sep + s + n);
  }
  return [...names];
}

document.getElementById('btnGenerate').addEventListener('click', () => {
  const style = document.getElementById('styleSelect').value;
  const names = generateNames(style, 12);
  const box = document.getElementById('resultBox');
  box.innerHTML = names.map(n => `<span class="tag-item" onclick="copyTag(this)">${n}</span>`).join('');
});

function copyTag(el) {
  navigator.clipboard.writeText(el.textContent).then(() => {
    showToast('已复制: ' + el.textContent);
  });
}

document.getElementById('btnCopyAll').addEventListener('click', () => {
  const tags = document.querySelectorAll('.tag-item');
  if (!tags.length) { showToast('请先生成游戏名'); return; }
  const all = [...tags].map(t => t.textContent).join('\n');
  navigator.clipboard.writeText(all).then(() => showToast('已复制全部游戏名'));
});

// Generate on load
document.getElementById('btnGenerate').click();
</script>
