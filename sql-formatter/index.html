// SQL keywords list
const SQL_KEYWORDS = new Set([
'SELECT','FROM','WHERE','AND','OR','NOT','IN','IS','NULL','LIKE','BETWEEN','EXISTS',
'INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','ADD','DROP',
'INDEX','VIEW','TRIGGER','PROCEDURE','FUNCTION','RETURNS','DECLARE','BEGIN','END',
'JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','ON','USING','NATURAL',
'GROUP','BY','HAVING','ORDER','ASC','DESC','LIMIT','OFFSET','UNION','ALL','INTERSECT','EXCEPT',
'DISTINCT','AS','CASE','WHEN','THEN','ELSE','END','IF','ELSEIF','LOOP','WHILE','FOR',
'PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT','CHECK','DEFAULT','UNIQUE','CASCADE',
'GRANT','REVOKE','COMMIT','ROLLBACK','SAVEPOINT','TRANSACTION',
'WITH','RECURSIVE','RETURNING','OVER','PARTITION','WINDOW','ROWS','RANGE',
'TRUE','FALSE','BOOLEAN','INT','INTEGER','BIGINT','SMALLINT','TINYINT','FLOAT','DOUBLE',
'DECIMAL','NUMERIC','VARCHAR','CHAR','TEXT','BLOB','DATE','TIME','TIMESTAMP','DATETIME',
'ENUM','JSON','JSONB','UUID','SERIAL','AUTO_INCREMENT','IDENTITY',
'ANY','SOME','EXTRACT','CAST','COALESCE','NULLIF','GREATEST','LEAST',
'LATERAL','TEMPORARY','TEMP','IF','REPLACE','MERGE','TRUNCATE','EXPLAIN','ANALYZE',
'ASC','DESC','FIRST','LAST','NEXT','FETCH','ONLY','OFFSET',
'ILIKE','SIMILAR','REGEXP','RLIKE','GLOB',
]);

const SQL_CLAUSES = new Set([
'SELECT','FROM','WHERE','GROUP BY','HAVING','ORDER BY','LIMIT','OFFSET',
'SET','VALUES','JOIN','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN',
'FULL JOIN','CROSS JOIN','NATURAL JOIN','ON','UNION','UNION ALL',
'INTERSECT','EXCEPT','INSERT INTO','UPDATE','DELETE FROM','CREATE TABLE',
'ALTER TABLE','DROP TABLE','WITH','RETURNING','OVER','PARTITION BY',
]);

function tokenize(sql) {
const tokens = [];
let i = 0;
const len = sql.length;
while (i < len) {
// Skip whitespace (preserve as separator info)
if (/\s/.test(sql[i])) {
let ws = '';
while (i < len && /\s/.test(sql[i])) { ws += sql[i]; i++; }
tokens.push({ type: 'whitespace', value: ws, newlines: (ws.match(/\n/g)||[]).length });
continue;
}
// Single-line comment --
if (sql[i] === '-' && sql[i+1] === '-') {
let cmt = '--';
i += 2;
while (i < len && sql[i] !== '\n') { cmt += sql[i]; i++; }
tokens.push({ type: 'comment', value: cmt });
continue;
}
// Block comment /* */
if (sql[i] === '/' && sql[i+1] === '*') {
let cmt = '/*';
i += 2;
while (i < len && !(sql[i] === '*' && sql[i+1] === '/')) { cmt += sql[i]; i++; }
if (i < len) { cmt += '*/'; i += 2; }
tokens.push({ type: 'comment', value: cmt });
continue;
}
// String literal 'xxx' or "xxx" or `xxx`
if (sql[i] === "'" || sql[i] === '"' || sql[i] === '`') {
const quote = sql[i];
let str = quote;
i++;
while (i < len) {
if (sql[i] === '\\') { str += sql[i]; i++; if (i < len) str += sql[i]; i++; continue; }
if (sql[i] === quote) {
// Check for escaped quote ''
if (sql[i+1] === quote && quote === "'") { str += quote + quote; i += 2; continue; }
str += quote; i++; break;
}
str += sql[i]; i++;
}
tokens.push({ type: 'string', value: str });
continue;
}
// Number
if (/[0-9]/.test(sql[i]) || (sql[i]==='.' && i+1<len && /[0-9]/.test(sql[i+1]))) {
let num = '';
while (i < len && /[0-9.eE+\-]/.test(sql[i])) { num += sql[i]; i++; }
tokens.push({ type: 'number', value: num });
continue;
}
// Identifier or keyword (alphanumeric + _ + $)
if (/[a-zA-Z_$]/.test(sql[i])) {
let word = '';
while (i < len && /[a-zA-Z0-9_$]/.test(sql[i])) { word += sql[i]; i++; }
tokens.push({ type: 'word', value: word });
continue;
}
// Operators and punctuation
if (sql[i] === ',' || sql[i] === ';') {
tokens.push({ type: 'comma_semi', value: sql[i] });
i++;
continue;
}
if (sql[i] === '(') { tokens.push({ type: 'lparen', value: '(' }); i++; continue; }
if (sql[i] === ')') { tokens.push({ type: 'rparen', value: ')' }); i++; continue; }
// Other (operators etc)
let other = sql[i];
i++;
while (i < len && /[+\-*/<>=!&|^~%.:@#]/.test(sql[i]) && !/[a-zA-Z0-9_$'\"`\s,;()]/.test(sql[i])) {
other += sql[i]; i++;
}
tokens.push({ type: 'other', value: other });
}
return tokens;
}

function isClauseKeyword(word) {
return SQL_CLAUSES.has(word.toUpperCase());
}

function isKeyword(word) {
return SQL_KEYWORDS.has(word.toUpperCase());
}

function formatSQL(sql, opts) {
const tokens = tokenize(sql);
const indentStr = opts.indent === 'tab' ? '\t' : ' '.repeat(parseInt(opts.indent));
let result = '';
let indent = 0;
let prevType = null;
let prevValue = '';
let prevUpper = '';
let newlinePending = true;
let firstToken = true;
let parenDepth = 0;

// Track clause start for proper indentation
const clauseIndent = {
'SELECT': 0, 'INSERT': 0, 'UPDATE': 0, 'DELETE': 0, 'CREATE': 0,
'ALTER': 0, 'DROP': 0, 'WITH': 0, 'VALUES': 0
};

function emit(str) { result += str; }

function newline() { emit('\n'); emit(indentStr.repeat(indent)); newlinePending = false; }

function space() {
if (result.length > 0 && result[result.length-1] !== '\n' && result[result.length-1] !== ' ') {
emit(' ');
}
}

for (let ti = 0; ti < tokens.length; ti++) {
const t = tokens[ti];
const upper = t.value.toUpperCase();

if (t.type === 'whitespace') {
// Skip original whitespace; we manage our own
// But preserve intentional blank lines (2+ newlines)
if (t.newlines >= 2) {
emit('\n'); newlinePending = true;
}
continue;
}

if (t.type === 'comment') {
if (!newlinePending && result.length > 0 && result[result.length-1] !== '\n') {
space();
}
emit(t.value);
newlinePending = false;
prevType = 'comment';
prevValue = t.value;
prevUpper = upper;
continue;
}

// Clause keywords → new line, increase indent for sub-clauses
if (isClauseKeyword(upper)) {
if (!newlinePending) { emit('\n'); newlinePending = true; }
// Special: nested SELECT in subquery
if (upper === 'SELECT' && ti > 0) {
// Check if inside parentheses (subquery)
if (parenDepth > 0) {
indent = Math.max(0, indent);
}
}
newline();
emit(formatWord(t.value, opts));
space();
// After FROM, JOIN, WHERE etc → indent content
if (['FROM','JOIN','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN','FULL JOIN','CROSS JOIN',
'WHERE','HAVING','ON','SET','VALUES','AND','OR'].includes(upper)) {
indent++;
}
prevType = 'clause';
prevValue = t.value;
prevUpper = upper;
firstToken = false;
continue;
}

// Sub-clause keywords that decrease indent
if (upper === 'UNION' || upper === 'UNION ALL' || upper === 'INTERSECT' || upper === 'EXCEPT') {
// Check next token for ALL
if (upper === 'UNION' && ti+1 < tokens.length && tokens[ti+1].value.toUpperCase() === 'ALL') {
// Will be handled as combined
}
indent = Math.max(0, indent - 1);
if (!newlinePending) { emit('\n'); newlinePending = true; }
newline();
emit(formatWord(t.value, opts));
if (ti+1 < tokens.length && tokens[ti+1].value.toUpperCase() === 'ALL') {
space();
ti++;
emit(formatWord(tokens[ti].value, opts));
}
space();
prevType = 'clause';
prevValue = t.value;
prevUpper = upper;
firstToken = false;
continue;
}

// Handle GROUP BY, ORDER BY as single unit
if (upper === 'GROUP' || upper === 'ORDER') {
if (ti+1 < tokens.length && tokens[ti+1].value.toUpperCase() === 'BY') {
if (!newlinePending) { emit('\n'); newlinePending = true; }
newline();
emit(formatWord(t.value, opts));
space();
ti++;
emit(formatWord(tokens[ti].value, opts));
space();
prevType = 'clause';
prevValue = t.value + ' BY';
prevUpper = upper + ' BY';
firstToken = false;
continue;
}
}

// Parentheses
if (t.type === 'lparen') {
emit('(');
parenDepth++;
prevType = 'lparen';
prevValue = '(';
prevUpper = '(';
firstToken = false;
continue;
}
if (t.type === 'rparen') {
parenDepth = Math.max(0, parenDepth - 1);
emit(')');
prevType = 'rparen';
prevValue = ')';
prevUpper = ')';
firstToken = false;
continue;
}

// Commas
if (t.type === 'comma_semi' && t.value === ',') {
emit(',');
// After comma in SELECT list or VALUES → newline
newlinePending = false;
emit('\n');
emit(indentStr.repeat(indent));
newlinePending = false;
prevType = 'comma';
prevValue = ',';
prevUpper = ',';
firstToken = false;
continue;
}

// Semicolons
if (t.type === 'comma_semi' && t.value === ';') {
emit(';');
indent = 0;
emit('\n');
newlinePending = true;
prevType = 'semi';
prevValue = ';';
prevUpper = ';';
firstToken = false;
continue;
}

// Keywords (standalone, not clauses)
if (isKeyword(upper) && t.type === 'word') {
if (upper === 'AS') {
space(); emit(formatWord(t.value, opts)); space();
} else if (upper === 'ON') {
space(); emit(formatWord(t.value, opts)); space();
} else if (upper === 'AND' || upper === 'OR') {
if (!newlinePending) { emit('\n'); newlinePending = true; }
newline();
emit(formatWord(t.value, opts));
space();
} else {
if (!firstToken && prevType !== 'lparen' && prevType !== 'comma' && prevType !== 'clause') {
space();
}
emit(formatWord(t.value, opts));
if (upper === 'END' && indent > 0) { indent--; }
}
prevType = 'keyword';
prevValue = t.value;
prevUpper = upper;
firstToken = false;
continue;
}

// Strings
if (t.type === 'string') {
if (firstToken) { firstToken = false; }
else if (prevType !== 'lparen' && prevType !== 'comma' && prevType !== 'clause' && prevType !== 'keyword' && prevType !== 'other') {
space();
}
emit(t.value);
prevType = 'string';
prevValue = t.value;
prevUpper = upper;
continue;
}

// Numbers
if (t.type === 'number') {
if (firstToken) { firstToken = false; }
else if (prevType !== 'lparen' && prevType !== 'comma' && prevType !== 'clause' && prevType !== 'keyword' && prevType !== 'other') {
space();
}
emit(t.value);
prevType = 'number';
prevValue = t.value;
prevUpper = upper;
continue;
}

// Other (operators)
if (t.type === 'other') {
if (t.value === '.') {
emit('.');
} else {
space(); emit(t.value); space();
}
prevType = 'other';
prevValue = t.value;
prevUpper = upper;
firstToken = false;
continue;
}

// Default: word that is not a keyword
if (t.type === 'word') {
if (firstToken) { firstToken = false; }
else if (prevType !== 'lparen' && prevType !== 'comma' && prevType !== 'clause' && prevType !== 'keyword' && prevType !== 'other' && prevType !== 'dot') {
space();
}
emit(formatWord(t.value, opts));
prevType = 'word';
prevValue = t.value;
prevUpper = upper;
continue;
}

// Fallback
emit(t.value);
prevType = t.type;
prevValue = t.value;
prevUpper = upper;
firstToken = false;
}

return result.trim();
}

function formatWord(word, opts) {
const upper = word.toUpperCase();
if (isKeyword(upper)) {
if (opts.keywordCase === 'upper') return upper;
if (opts.keywordCase === 'lower') return word.toLowerCase();
if (opts.keywordCase === 'capitalize') return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
return word;
}
// Function names
if (isKeyword(upper) || /^[A-Z_][A-Z0-9_]*$/.test(word) && word.length > 1) {
if (opts.functionCase === 'upper') return upper;
}
return word;
}

function compressSQL(sql) {
return sql.replace(/--[^\n]*/g, '').replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s+/g, ' ').trim();
}

function highlightSQL(sql) {
return sql
.replace(/('(?:[^'\\]|\\.)*')/g, '<span class="sql-string">$1</span>')
.replace(/("(?:[^"\\]|\\.)*")/g, '<span class="sql-string">$1</span>')
.replace(/(`(?:[^`\\]|\\.)*`)/g, '<span class="sql-string">$1</span>')
.replace(/(--[^\n]*)/g, '<span class="sql-comment">$1</span>')
.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="sql-comment">$1</span>')
.replace(/\b(\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)\b/g, '<span class="sql-number">$1</span>')
.replace(/\b(COUNT|SUM|AVG|MAX|MIN|COALESCE|NULLIF|CAST|EXTRACT|CONCAT|SUBSTR|SUBSTRING|LENGTH|TRIM|UPPER|LOWER|REPLACE|NOW|CURDATE|CURRENT_DATE|CURRENT_TIMESTAMP|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|FIRST_VALUE|LAST_VALUE)\s*\(/gi,
'<span class="sql-function">$&</span>'.replace('(','').replace('</span>','') + '</span>(')
.replace(/\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|ON|AND|OR|NOT|IN|IS|NULL|LIKE|BETWEEN|EXISTS|GROUP|BY|HAVING|ORDER|ASC|DESC|LIMIT|OFFSET|UNION|ALL|DISTINCT|AS|CASE|WHEN|THEN|ELSE|END|WITH|RETURNING|OVER|PARTITION|PRIMARY|KEY|FOREIGN|REFERENCES|INDEX|VIEW|BEGIN|DECLARE|IF|ELSE|LOOP|WHILE|COMMIT|ROLLBACK|GRANT|REVOKE|TRUNCATE|EXPLAIN|MERGE|REPLACE)\b/gi,
'<span class="sql-keyword">$&</span>');
}

function doFormat() {
const sql = sqlInput.value.trim();
if (!sql) {
sqlOutput.innerHTML = '<span style="color:#64748b">请在输入框中粘贴SQL语句</span>';
statsBar.style.display = 'none';
return;
}
const opts = {
indent: indentSize.value,
keywordCase: keywordCase.value,
functionCase: functionCase.value
};
try {
const formatted = formatSQL(sql, opts);
sqlOutput.innerHTML = highlightSQL(formatted);
statsBar.style.display = 'flex';
document.getElementById('origLen').textContent = sql.length;
document.getElementById('fmtLen').textContent = formatted.length;
document.getElementById('lineCount').textContent = formatted.split('\n').length;
} catch(e) {
sqlOutput.innerHTML = '<span style="color:#ef4444">格式化出错: ' + e.message + '</span>';
statsBar.style.display = 'none';
}
}

function doCompress() {
const sql = sqlInput.value.trim();
if (!sql) return;
const compressed = compressSQL(sql);
sqlOutput.innerHTML = highlightSQL(compressed);
statsBar.style.display = 'flex';
document.getElementById('origLen').textContent = sql.length;
document.getElementById('fmtLen').textContent = compressed.length;
document.getElementById('lineCount').textContent = '1';
}

function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2000);
}

async function copyResult() {
const text = sqlOutput.textContent;
if (!text || text.includes('等待输入') || text.includes('请在上方')) {
showToast('⚠️ 没有可复制的内容');
return;
}
try {
await navigator.clipboard.writeText(text);
showToast('✅ 已复制到剪贴板');
} catch(e) {
showToast('⚠️ 复制失败，请手动选择');
}
}

function downloadSQL() {
const text = sqlOutput.textContent;
if (!text || text.includes('等待输入') || text.includes('请在上方')) {
showToast('⚠️ 没有可下载的内容');
return;
}
const blob = new Blob([text], {type: 'text/plain'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'formatted.sql';
a.click();
URL.revokeObjectURL(a.href);
showToast('✅ 已下载 formatted.sql');
}

const sampleSQL = `select u.id,u.name,o.order_id,o.total,o.created_at from users u inner join orders o on u.id=o.user_id where o.status='completed' and o.total>100 group by u.id,u.name having count(o.order_id)>2 order by o.created_at desc limit 50;`;

document.getElementById('formatBtn').addEventListener('click', doFormat);
document.getElementById('compressBtn').addEventListener('click', doCompress);
document.getElementById('copyBtn').addEventListener('click', copyResult);
document.getElementById('downloadBtn').addEventListener('click', downloadSQL);
document.getElementById('clearBtn').addEventListener('click', () => {
sqlInput.value = '';
sqlOutput.innerHTML = '<span style="color:#64748b">等待输入SQL...</span>';
statsBar.style.display = 'none';
sqlInput.focus();
});
document.getElementById('sampleBtn').addEventListener('click', () => {
sqlInput.value = sampleSQL;
doFormat();
});

// Real-time format on input (debounced)
sqlInput.addEventListener('input', () => {
clearTimeout(fmtDebounce);
fmtDebounce = setTimeout(doFormat, 500);
});

// Option changes trigger re-format
[indentSize, keywordCase, functionCase].forEach(el => {
el.addEventListener('change', doFormat);
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
e.preventDefault();
doFormat();
}
});
})();
</script>
