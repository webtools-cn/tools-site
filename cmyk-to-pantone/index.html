<body>
<div class="container">

<div class="header">

<div style="background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);border-radius:8px;padding:12px 16px;margin:12px 0;color:#22d3ee;font-size:.9rem">📌 此工具已合并至 <a href="/pantone-to-hex/" style="color:#22d3ee;text-decoration:underline">pantone to hex</a></div>
<div class="lang-switch"><a class="active" href="/cmyk-to-pantone/">中文</a><a href="/en/cmyk-to-pantone/">English</a></div>
</div>
<div class="tool-section">
<h2>输入CMYK值</h2>
<div class="series-select">
<button class="series-btn active" data-series="C">Coated (C)</button>
<button class="series-btn" data-series="U">Uncoated (U)</button>
</div>
<div class="input-group">
<div><label>C (青)</label><input type="range" id="cVal" min="0" max="100" value="0"><input type="number" id="cNum" min="0" max="100" value="0"></div>
<div><label>M (品红)</label><input type="range" id="mVal" min="0" max="100" value="0"><input type="number" id="mNum" min="0" max="100" value="0"></div>
<div><label>Y (黄)</label><input type="range" id="yVal" min="0" max="100" value="0"><input type="number" id="yNum" min="0" max="100" value="0"></div>
<div><label>K (黑)</label><input type="range" id="kVal" min="0" max="100" value="0"><input type="number" id="kNum" min="0" max="100" value="0"></div>
</div>
<div class="color-preview" id="cmykPreview"></div>
<button class="btn btn-primary" id="matchBtn">匹配Pantone色号</button>
</div>
<div class="tool-section">
<h2>匹配结果</h2>
<div id="results">调整CMYK值后点击"匹配Pantone色号"</div>
</div>
</div>

<script>
// Pantone C/U color library (subset of common colors)
const pantoneColors=[
{n:"100 C",c:5,m:5,y:20,k:0,r:243,g:237,b:203},{n:"101 C",c:0,m:10,y:60,k:0,r:255,g:230,b:102},{n:"102 C",c:0,m:5,y:80,k:0,r:255,g:242,b:51},{n:"103 C",c:0,m:15,y:100,k:5,r:242,g:206,b:0},{n:"104 C",c:0,m:20,y:100,k:15,r:217,g:173,b:0},{n:"105 C",c:0,m:10,y:100,k:25,r:191,g:172,b:0},
{n:"185 C",c:0,m:100,y:80,k:0,r:228,g:0,b:43},{n:"186 C",c:0,m:100,y:80,k:10,r:200,g:16,b:46},{n:"187 C",c:0,m:100,y:70,k:30,r:166,g:25,b:46},{n:"188 C",c:0,m:85,y:50,k:50,r:128,g:32,b:46},
{n:"286 C",c:100,m:70,y:0,k:0,r:0,g:51,b:160},{n:"287 C",c:100,m:70,y:0,k:10,r:0,g:51,b:141},{n:"288 C",c:100,m:70,y:0,k:30,r:0,g:40,b:104},{n:"289 C",c:100,m:60,y:0,k:60,r:0,g:32,b:70},
{n:"354 C",c:90,m:0,y:100,k:0,r:0,g:173,b:85},{n:"355 C",c:95,m:0,y:100,k:5,r:0,g:151,b:57},{n:"356 C",c:95,m:0,y:100,k:30,r:0,g:122,b:51},{n:"357 C",c:85,m:0,y:90,k:50,r:0,g:90,b:38},
{n:"Yellow C",c:0,m:0,y:100,k:0,r:254,g:221,b:0},{n:"Orange 021 C",c:0,m:70,y:100,k:0,r:254,g:80,b:0},{n:"Warm Red C",c:0,m:85,y:65,k:0,r:249,g:66,b:58},{n:"Red 032 C",c:0,m:90,y:70,k:0,r:239,g:51,b:64},
{n:"Rubine Red C",c:0,m:100,y:10,k:0,r:206,g:0,b:88},{n:"Rhodamine Red C",c:0,m:85,y:0,k:0,r:228,g:0,b:127},{n:"Purple C",c:40,m:90,y:0,k:0,r:187,g:38,b:164},{n:"Violet C",c:75,m:100,y:0,k:0,r:68,g:0,b:153},
{n:"Blue 072 C",c:100,m:85,y:0,k:0,r:16,g:6,b:159},{n:"Reflex Blue C",c:100,m:75,y:0,k:5,r:0,g:20,b:137},{n:"Process Blue C",c:100,m:0,y:5,k:0,r:0,g:133,b:202},{n:"Green C",c:100,m:0,y:70,k:0,r:0,g:171,b:132},
{n:"Black C",c:0,m:0,y:0,k:100,r:35,g:31,b:32},{n:"Warm Gray 1 C",c:0,m:2,y:5,k:5,r:242,g:237,b:230},{n:"Warm Gray 5 C",c:0,m:5,y:10,k:25,r:191,g:182,b:172},{n:"Warm Gray 11 C",c:0,m:8,y:15,k:65,r:89,g:82,b:76},
{n:"Cool Gray 1 C",c:2,m:0,y:0,k:5,r:237,g:242,b:242},{n:"Cool Gray 5 C",c:5,m:0,y:0,k:25,r:182,g:191,b:191},{n:"Cool Gray 11 C",c:8,m:0,y:0,k:65,r:82,g:89,b:89}
];
function cmykToRgb(c,m,y,k){
  const r=Math.round(255*(1-c/100)*(1-k/100));
  const g=Math.round(255*(1-m/100)*(1-k/100));
  const b=Math.round(255*(1-y/100)*(1-k/100));
  return[r,g,b];
}
function deltaE(rgb1,rgb2){
  return Math.sqrt((rgb1[0]-rgb2[0])**2+(rgb1[1]-rgb2[1])**2+(rgb1[2]-rgb2[2])**2);
}
function updatePreview(){
  const c=+document.getElementById('cNum').value,m=+document.getElementById('mNum').value;
  const y=+document.getElementById('yNum').value,k=+document.getElementById('kNum').value;
  const rgb=cmykToRgb(c,m,y,k);
  document.getElementById('cmykPreview').style.background='rgb('+rgb.join(',')+')';
}
function matchPantone(){
  const c=+document.getElementById('cNum').value,m=+document.getElementById('mNum').value;
  const y=+document.getElementById('yNum').value,k=+document.getElementById('kNum').value;
  const rgb=cmykToRgb(c,m,y,k);
  const series=document.querySelector('.series-btn.active').dataset.series;
  const filtered=pantoneColors.filter(p=>p.n.includes(series));
  const results=filtered.map(p=>({...p,delta:deltaE(rgb,[p.r,p.g,p.b])})).sort((a,b)=>a.delta-b.delta).slice(0,5);
  document.getElementById('results').innerHTML=results.map(r=>{
    const d=r.delta<20?'#22c55e':r.delta<50?'#eab308':'#ef4444';
    return '<div class="result-item"><div class="result-swatch" style="background:rgb('+r.r+','+r.g+','+r.b+')"></div><div class="result-info"><div class="result-name">'+r.n+'</div><div class="result-code">CMYK: '+r.c+','+r.m+','+r.y+','+r.k+' | RGB: '+r.r+','+r.g+','+r.b+'</div></div><div class="result-delta" style="color:'+d+'">ΔE: '+r.delta.toFixed(1)+'</div></div>';
  }).join('');
}
document.getElementById('matchBtn').addEventListener('click',matchPantone);
['c','m','y','k'].forEach(ch=>{
  document.getElementById(ch+'Val').addEventListener('input',function(){
    document.getElementById(ch+'Num').value=this.value;updatePreview();
  });
  document.getElementById(ch+'Num').addEventListener('input',function(){
    document.getElementById(ch+'Val').value=this.value;updatePreview();
  });
});
document.querySelectorAll('.series-btn').forEach(b=>b.addEventListener('click',function(){
  document.querySelectorAll('.series-btn').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');
}));
updatePreview();
</script>
</body>
