  <main>
    <h1>单价对比计算器</h1>
    <p class="subtitle">超市比价神器：不同规格商品单位价格对比，一眼看出哪个最划算</p>
    <div class="tool-area">
      <label>商品 1</label>
      <div class="row">
        <div><label for="price1">价格 (元/)</label><input type="number" id="price1" placeholder="15.9" step="0.01"></div>
        <div><label for="amount1">数量</label><input type="number" id="amount1" placeholder="500" step="0.1"></div>
        <div><label for="unit1">单位</label>
          <select id="unit1"><option value="g">克</option><option value="ml">毫升</option><option value="pcs">个</option><option value="m">米</option><option value="L">升</option></select>
        </div>
      </div>
      <label style="margin-top:16px">商品 2</label>
      <div class="row">
        <div><label for="price2">价格 (元/)</label><input type="number" id="price2" placeholder="25.9" step="0.01"></div>
        <div><label for="amount2">数量</label><input type="number" id="amount2" placeholder="1000" step="0.1"></div>
        <div><label for="unit2">单位</label>
          <select id="unit2"><option value="g">克</option><option value="ml">毫升</option><option value="pcs">个</option><option value="m">米</option><option value="L">升</option></select>
        </div>
      </div>
      <button class="btn" id="compareBtn" style="margin-top:16px">对比</button>
      <div id="compareResult" class="output"></div>
      <script>
      document.getElementById('compareBtn').addEventListener('click', function() {
        var p1 = parseFloat(document.getElementById('price1').value);
        var a1 = parseFloat(document.getElementById('amount1').value);
        var u1 = document.getElementById('unit1').value;
        var p2 = parseFloat(document.getElementById('price2').value);
        var a2 = parseFloat(document.getElementById('amount2').value);
        var u2 = document.getElementById('unit2').value;
        if (!p1 || !a1 || !p2 || !a2) { showToast('请填写所有字段'); return; }
        var up1 = p1 / a1;
        var up2 = p2 / a2;
        var cheaperIdx = up1 < up2 ? 1 : 2;
        var savings = Math.abs(up1 - up2);
        var html = '<div style="background:#fff;padding:20px;border-radius:8px;border:1px solid #e2e8f0">';
        html += '<div class="result-item"><strong>商品 1 单价:</strong> ' + up1.toFixed(4) + ' 元/' + u1 + '</div>';
        html += '<div class="result-item"><strong>商品 2 单价:</strong> ' + up2.toFixed(4) + ' 元/' + u2 + '</div>';
        html += '<div class="result-item" style="background:#ecfdf5;border:1px solid #a7f3d0"><strong>\u2705 ' + (lang==='en' ? 'Item ' : '商品') + cheaperIdx + '更划算！</strong> 每单位节省 ' + savings.toFixed(4) + ' 元/' + u1 + '</div>';
        var pctSave = (savings / Math.max(up1, up2) * 100);
        html += '<p style="margin-top:8px;color:#64748b">节省约 ' + pctSave.toFixed(1) + '%</p></div>';
        document.getElementById('compareResult').innerHTML = html;
      });
      var lang = 'cn';
      </script>
    </div>

  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('已复制！')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制！');
    }
  }
  </script>
