<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>符号选择器 - Free ToolBase</title>
  <meta name="description" content="免费在线特殊符号选择器，收录箭头、数学、货币、星形等各类Unicode符号，点击即可复制使用。">
  <meta property="og:title" content="符号选择器 - Free ToolBase">
  <meta property="og:description" content="免费在线特殊符号选择器，点击即可复制各类Unicode符号。">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "符号选择器",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "Any",
    "description": "免费在线特殊符号选择器，点击即可复制各类Unicode符号。"
  }
  </script>
  <style>
    :root{--primary:#4F46E5;--primary-light:#EEF2FF;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header .logo{font-size:1.25rem;font-weight:700;color:var(--primary);text-decoration:none}
    header nav{display:flex;gap:16px}
    header nav a{color:var(--text-secondary);text-decoration:none;font-size:.9rem;transition:color .2s}
    header nav a:hover{color:var(--primary)}
    main{flex:1;max-width:800px;margin:0 auto;padding:32px 20px;width:100%}
    h1{font-size:1.75rem;margin-bottom:8px;color:var(--text)}
    .subtitle{color:var(--text-secondary);margin-bottom:28px;font-size:.95rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
    .card h2{font-size:1.1rem;margin-bottom:16px;color:var(--text)}
    .category-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
    .cat-tab{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
    .cat-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .symbol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
    .sym{display:flex;align-items:center;justify-content:center;padding:10px 4px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:1.3rem;transition:all .15s;background:var(--card);min-height:48px}
    .sym:hover{background:var(--primary-light);border-color:var(--primary);transform:scale(1.1)}
    .sym.copied{background:#10b981;color:#fff;border-color:#10b981}
    .recent-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:48px;align-items:center}
    .recent-row .sym{font-size:1rem;min-height:36px;padding:6px 8px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 24px;border-radius:20px;font-size:.9rem;z-index:1000;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    footer{background:var(--card);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.85rem;color:var(--text-secondary)}
    footer a{color:var(--primary);text-decoration:none}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:1.4rem}.symbol-grid{grid-template-columns:repeat(6,1fr)}}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>
</head>
<body>
<header>
  <a href="/" class="logo">Free ToolBase</a>
  <nav>
    <a href="/">首页</a>
    <a href="/en/symbol-picker/">English</a>
  </nav>
</header>
<main>
  <h1>🎯 符号选择器</h1>
  <p class="subtitle">收录各类Unicode特殊符号，点击即可复制。最近使用的符号会保留在这里。</p>
  <div class="card">
    <div class="category-tabs" id="cat-tabs"></div>
    <div class="symbol-grid" id="symbol-grid"></div>
    <h3 style="font-size:.95rem;margin-top:20px">🕐 最近使用</h3>
    <div class="recent-row" id="recent-row"><span style="color:var(--text-secondary);font-size:.85rem">点击上方符号开始</span></div>
  </div>
  <div class="toast" id="toast"></div>
</main>
<footer>
  <p>&copy; 2025 <a href="/">Free ToolBase</a> · 免费在线工具</p>
</footer>
<script>
(function(){
  var symbols={
    '箭头':['←','↑','→','↓','↔','↕','↖','↗','↘','↙','↩','↪','↶','↷','⇄','⇅','⇆','⇇','⇈','⇉','⇊','⇐','⇑','⇒','⇓','⇔','⇕','⇦','⇧','⇨','⇩','➔','➘','➙','➚','➛','➜','➝','➞','➟','➠','➡','➢','➣','➤','➥','➦','➧','➨','➩','➪','➫','➬','➭','➮','➯','➱','➲','➳','➵','➶','➷','➸','➹','➺','➻','➼','➽','➾','⤴','⤵'],
    '数学':['+','−','×','÷','±','∓','=','≠','≈','≡','≤','≥','≪','≫','∑','∏','∫','∬','∭','∮','∇','∂','∆','√','∛','∞','∧','∨','∩','∪','∈','∉','⊂','⊃','⊆','⊇','⊕','⊗','⊥','∠','∡','∢','∴','∵','∶','∷','≔','≕','∝'],
    '货币':['$','¢','£','¥','€','₠','₡','₢','₣','₤','₥','₦','₧','₨','₩','₪','₫','₭','₮','₯','₰','₱','₲','₳','₴','₵','₹','₺','₻','₼','₽','₾','₿'],
    '星形':['★','☆','✪','✫','✬','✭','✮','✯','✰','✡','✦','✧','⋆','⁂','⁑','✶','✷','✸','✹','✵','✴','✳','✲','✱','⭑','⭒','🌟','⭐','🌠'],
    '勾叉':['✓','✔','✗','✘','☐','☑','☒','✅','❌','⭕','❎','☓','☒','⍻','⦿','⊗','⊕'],
    '心形':['♥','❤','❥','❣','♡','💙','💚','💛','💜','💝','💞','💟','💖','💗','💘','💕','💓','❦','❧','🖤'],
    '标点':['«','»','‹','›','„','‚','“','”','‘','’','「','」','『','』','【','】','〖','〗','《','》','〔','〕','〘','〙','〚','〛'],
    '音乐':['♪','♫','♬','♩','♭','♮','♯','𝄞','𝄢','𝄡','🎵','🎶','🎼','🎤','🎧'],
    '天气':['☀','☁','☂','☃','☄','★','☆','☇','☈','☉','☊','☋','☌','☍','🌡','🌤','🌥','🌦','🌧','🌨','🌩','🌪','🌫','🌬'],
    '技术':['⌘','⌥','⇧','⌃','⎋','⏎','⌫','⌦','⇪','↩','↪','⇥','⇤','␣','⌂','⌛','⏳','⌚','⎈','⍟','⌨','🖱','🖥','💻']
  };

  var cats=Object.keys(symbols);
  var activeCat=cats[0];
  var recents=[];

  function renderCats(){
    var html='';
    cats.forEach(function(c){html+='<div class="cat-tab'+(c===activeCat?' active':'')+'" data-cat="'+c+'">'+c+'</div>';});
    document.getElementById('cat-tabs').innerHTML=html;
    document.querySelectorAll('.cat-tab').forEach(function(t){
      t.addEventListener('click',function(){
        document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active')});
        this.classList.add('active');
        activeCat=this.dataset.cat;
        renderSymbols();
      });
    });
  }

  function renderSymbols(){
    var html='';
    symbols[activeCat].forEach(function(s){
      html+='<div class="sym" data-sym="'+s+'">'+s+'</div>';
    });
    document.getElementById('symbol-grid').innerHTML=html;
    document.querySelectorAll('#symbol-grid .sym').forEach(function(el){
      el.addEventListener('click',function(){
        var s=this.dataset.sym;
        navigator.clipboard.writeText(s).then(function(){
          toast('已复制: '+s);
          addRecent(s);
        }).catch(function(){});
      });
    });
  }

  function addRecent(s){
    recents=recents.filter(function(x){return x!==s});
    recents.unshift(s);
    if(recents.length>20)recents.pop();
    renderRecents();
  }

  function renderRecents(){
    var row=document.getElementById('recent-row');
    if(recents.length===0){row.innerHTML='<span style="color:var(--text-secondary);font-size:.85rem">点击上方符号开始</span>';return}
    var html='';
    recents.forEach(function(s){
      html+='<div class="sym" data-sym="'+s+'">'+s+'</div>';
    });
    row.innerHTML=html;
    row.querySelectorAll('.sym').forEach(function(el){
      el.addEventListener('click',function(){
        var s=this.dataset.sym;
        navigator.clipboard.writeText(s).then(function(){toast('已复制: '+s)}).catch(function(){});
      });
    });
  }

  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')},2000);
  }

  renderCats();
  renderSymbols();
})();
</script>
</body>
</html>
