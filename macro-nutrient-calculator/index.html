<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Free ToolBase
            </a>
            <a href="https://free-toolbase.com/en/macro-nutrient-calculator/" class="lang-switch">English</a>
        </div>
    </header>
    <main>
        <h1>宏量营养素计算器</h1>
        <p class="subtitle">根据每日热量目标计算蛋白质、碳水化合物和脂肪摄入量。支持增肌、减脂和维持三种目标模式。</p>
        <div class="card">
            <h2>计算器</h2>
            <div class="form-group">
                <label>每日热量目标（千卡）</label>
                <input type="number" id="calories" placeholder="例: 2000" min="500" max="10000">
            </div>
            <div class="form-group">
                <label>目标模式</label>
                <select id="goal">
                    <option value="maintain">维持体重 (30/40/30)</option>
                    <option value="muscle">增肌增重 (35/40/25)</option>
                    <option value="fatloss">减脂减重 (40/30/30)</option>
                    <option value="keto">生酮饮食 (20/75/5)</option>
                    <option value="custom">自定义比例</option>
                </select>
            </div>
            <div class="form-group" id="customRatios" style="display:none">
                <label>蛋白质比例 (%)</label>
                <input type="number" id="proteinPct" placeholder="例: 30" min="5" max="80" value="30">
                <label style="margin-top:8px">碳水比例 (%)</label>
                <input type="number" id="carbPct" placeholder="例: 40" min="5" max="80" value="40">
                <label style="margin-top:8px">脂肪比例 (%)</label>
                <input type="number" id="fatPct" placeholder="例: 30" min="5" max="80" value="30">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">计算</button>
                <button class="btn btn-secondary" id="resetBtn">清空</button>
            </div>
            <div class="result" id="result">
                <span class="result-label">结果:</span>
                <span id="resultValue"></span>
            </div>
        </div>
    </main>
    <footer>
        <a href="/">首页</a>
        <a href="/privacy">隐私政策</a>
    </footer>
    <div class="toast" id="toast"></div>
    <script>
    
const toast = s => {{ const e = document.getElementById('toast'); e.textContent = s; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2000); }};
const copy = s => {{ navigator.clipboard.writeText(s).then(() => toast('已复制到剪贴板')).catch(() => toast('复制失败')); }};

const goals = {{
    maintain: [30, 40, 30],
    muscle: [35, 40, 25],
    fatloss: [40, 30, 30],
    keto: [20, 75, 5]
}};

document.getElementById('goal').addEventListener('change', function() {{
    document.getElementById('customRatios').style.display = this.value === 'custom' ? 'block' : 'none';
}});

document.getElementById('calcBtn').addEventListener('click', () => {{
    const cal = parseFloat(document.getElementById('calories').value);
    if (isNaN(cal) || cal <= 0) {{ toast('请输入热量目标'); return; }}
    let p, c, f;
    const goal = document.getElementById('goal').value;
    if (goal === 'custom') {{
        p = parseFloat(document.getElementById('proteinPct').value);
        c = parseFloat(document.getElementById('carbPct').value);
        f = parseFloat(document.getElementById('fatPct').value);
        if (isNaN(p) || isNaN(c) || isNaN(f)) {{ toast('请填写自定义比例'); return; }}
        if (Math.abs(p + c + f - 100) > 1) {{ toast('三比例之和必须等于100%'); return; }}
    }} else {{
        [p, c, f] = goals[goal];
    }}
    const proG = (cal * p / 100 / 4).toFixed(0);
    const carbG = (cal * c / 100 / 4).toFixed(0);
    const fatG = (cal * f / 100 / 9).toFixed(0);
    const msg = `蛋白: ${{proG}}g (${{(cal*p/100).toFixed(0)}}kcal) | 碳水: ${{carbG}}g (${{(cal*c/100).toFixed(0)}}kcal) | 脂肪: ${{fatG}}g (${{(cal*f/100).toFixed(0)}}kcal)`;
    document.getElementById('resultValue').textContent = msg;
    document.getElementById('result').classList.add('show');
    document.getElementById('resultValue').onclick = () => copy(msg);
    document.getElementById('resultValue').style.cursor = 'pointer';
    document.getElementById('resultValue').title = '点击复制结果';
}});

document.getElementById('resetBtn').addEventListener('click', () => {{
    document.getElementById('calories').value = '';
    document.getElementById('goal').value = 'maintain';
    document.getElementById('customRatios').style.display = 'none';
    document.getElementById('result').classList.remove('show');
}});

    </script>
</body>
