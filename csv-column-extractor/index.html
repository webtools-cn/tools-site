<header><a href="/">← 返回首页</a></header>
<main>
  <h1>📊 CSV列提取器</h1>
  <p class="subtitle">粘贴CSV数据，选择要保留的列，一键提取</p>
  <div class="card">
    <label for="csvInput">CSV数据</label>
    <textarea id="csvInput" placeholder="name,age,city,score&#10;Alice,25,NYC,92&#10;Bob,30,LA,85"></textarea>
    <div class="row" style="margin-top:12px;">
      <div>
        <label for="delimiter">分隔符</label>
        <select id="delimiter">
          <option value=",">逗号 (,)</option>
          <option value=";">分号 (;)</option>
          <option value="\t">制表符 (Tab)</option>
          <option value="|">竖线 (|)</option>
        </select>
      </div>
      <div>
        <label for="hasHeader">首行</label>
        <select id="hasHeader">
          <option value="true" selected>是表头</option>
          <option value="false">是数据</option>
        </select>
      </div>
    </div>
    <div id="columnSelector" style="margin-top:12px;">
      <label>选择要保留的列（点击切换）</label>
      <div class="col-chips" id="colChips"></div>
      <button class="btn btn-sm" id="selectAll" style="margin-top:4px;">全选</button>
      <button class="btn btn-sm" id="deselectAll" style="margin-top:4px;margin-left:4px;">全不选</button>
    </div>
    <button class="btn" id="extractBtn">📤 提取列</button>
    <div id="outputSection"></div>
  </div>
</main>

<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function getDelim(d) { if (d === '\\t') return '\t'; return d; }

function parseCols(){
  var csv = document.getElementById('csvInput').value.trim();
  if (!csv) { document.getElementById('colChips').innerHTML = '<span style="color:var(--text-secondary);font-size:.85rem;">请先粘贴CSV数据</span>'; return []; }
  var delim = getDelim(document.getElementById('delimiter').value);
  var firstLine = csv.split('\n')[0];
  var cols = firstLine.split(delim);
  var chips = '';
  var hasHeader = document.getElementById('hasHeader').value === 'true';
  cols.forEach(function(col, i){
    var name = hasHeader ? col.trim() : ('列' + (i+1));
    chips += '<span class="col-chip selected" data-idx="' + i + '" title="' + name + '">' + name + '</span>';
  });
  document.getElementById('colChips').innerHTML = chips;
  document.querySelectorAll('.col-chip').forEach(function(chip){
    chip.addEventListener('click', function(){ this.classList.toggle('selected'); });
  });
  return cols;
}

document.getElementById('csvInput').addEventListener('input', parseCols);
document.getElementById('delimiter').addEventListener('change', parseCols);
document.getElementById('hasHeader').addEventListener('change', parseCols);

document.getElementById('selectAll').addEventListener('click', function(){
  document.querySelectorAll('.col-chip').forEach(function(c){c.classList.add('selected')});
});
document.getElementById('deselectAll').addEventListener('click', function(){
  document.querySelectorAll('.col-chip').forEach(function(c){c.classList.remove('selected')});
});

document.getElementById('extractBtn').addEventListener('click', function(){
  var csv = document.getElementById('csvInput').value.trim();
  if (!csv) { toast('请粘贴CSV数据'); return; }
  var delim = getDelim(document.getElementById('delimiter').value);
  var selected = [];
  document.querySelectorAll('.col-chip.selected').forEach(function(c){ selected.push(parseInt(c.dataset.idx)); });
  if (selected.length === 0) { toast('请至少选择一列'); return; }
  selected.sort(function(a,b){return a-b;});

  var lines = csv.split('\n');
  var result = [];
  lines.forEach(function(line){
    var cols = line.split(delim);
    var row = selected.map(function(i){ return cols[i] || ''; }).join(delim);
    result.push(row);
  });

  var output = result.join('\n');
  document.getElementById('outputSection').innerHTML =
    '<div class="stats"><div class="stat">📄 行数: <strong>' + lines.length + '</strong></div><div class="stat">📊 列数: <strong>' + selected.length + ' / ' + (lines[0] ? lines[0].split(delim).length : 0) + '</strong></div></div>' +
    '<div class="output-area">' + output.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
    '<button class="btn btn-sm" id="copyBtn" style="margin-top:8px;">📋 复制结果</button>';
  document.getElementById('copyBtn').addEventListener('click', function(){
    navigator.clipboard.writeText(output).then(function(){ toast('已复制!'); });
  });
});

// Initialize
parseCols();
</script>
