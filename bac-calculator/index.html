    <main>
        <h1>血液酒精浓度计算器</h1>
        <p class="subtitle">估算饮酒后的血液酒精浓度(BAC)。基于Widmark公式，输入体重、性别、饮酒量和时间计算BAC及预估代谢时间。</p>
        <div class="card">
            <h2>计算器</h2>
            <div class="form-group">
                <label>性别</label>
                <select id="gender">
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            <div class="form-group">
                <label>体重（公斤）</label>
                <input type="number" id="weight" placeholder="例: 70" min="30" max="300">
            </div>
            <div class="form-group">
                <label>饮酒量（标准杯，1杯≈14g纯酒精）</label>
                <input type="number" id="drinks" placeholder="例: 3" min="0" max="50" step="0.5">
            </div>
            <div class="form-group">
                <label>饮酒已过时间（小时）</label>
                <input type="number" id="hours" placeholder="例: 1.5" min="0" max="48" step="0.1" value="0">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">计算</button>
                <button class="btn btn-secondary" id="resetBtn">清空</button>
            </div>
            <div class="result" id="result">
                <span class="result-label">结果:</span>
                <span id="resultValue"></span>
            </div>
        </div>
    </main>
    <footer>
        <a href="/">首页</a>
        <a href="/privacy">隐私政策</a>
    </footer>
    <div class="toast" id="toast"></div>
    <script>
    
const toast = s => {{ const e = document.getElementById('toast'); e.textContent = s; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2000); }};
const copy = s => {{ navigator.clipboard.writeText(s).then(() => toast('已复制到剪贴板')).catch(() => toast('复制失败')); }};

document.getElementById('calcBtn').addEventListener('click', () => {{
    const gender = document.getElementById('gender').value;
    const weight = parseFloat(document.getElementById('weight').value);
    const drinks = parseFloat(document.getElementById('drinks').value);
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    if (isNaN(weight) || isNaN(drinks)) {{ toast('请填写必填项'); return; }}
    // Widmark formula
    const r = gender === 'male' ? 0.68 : 0.55;
    const alcoholGrams = drinks * 14;
    const bac = Math.max(0, (alcoholGrams / (weight * 1000 * r) * 100 - hours * 0.015));
    const bacPct = (bac * 100).toFixed(3);
    const toZero = bac > 0 ? (bac / 0.015).toFixed(1) : "0";
    let level;
    if (bac === 0) level = '无酒精';
    else if (bac < 0.03) level = '基本清醒';
    else if (bac < 0.05) level = '略受影响';
    else if (bac < 0.08) level = '明显受影响（多数国家酒驾上限）';
    else if (bac < 0.15) level = '显著醉酒';
    else level = '严重醉酒';
    const msg = `BAC: ${{bacPct}}% | 状态: ${{level}} | 预计完全代谢还需: ${{toZero}} 小时`;
    document.getElementById('resultValue').textContent = msg;
    document.getElementById('result').classList.add('show');
    document.getElementById('resultValue').onclick = () => copy(msg);
    document.getElementById('resultValue').style.cursor = 'pointer';
    document.getElementById('resultValue').title = '点击复制结果';
}});

document.getElementById('resetBtn').addEventListener('click', () => {{
    document.getElementById('weight').value = '';
    document.getElementById('drinks').value = '';
    document.getElementById('hours').value = '0';
    document.getElementById('result').classList.remove('show');
}});

    </script>
