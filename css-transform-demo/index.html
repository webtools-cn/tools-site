<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">免费在线CSS Transform可视化演示工具，实时调整旋转/缩放/倾斜/位移参数，直观查看CSS transform效果。支持3D变换和动画预览，前端开发者必备。</p>

</div>
<div class="main-layout">
<div class="tool-section">
<h2>实时预览</h2>
<div class="demo-stage"><div class="demo-box" id="demoBox">Transform</div></div>
</div>
<div class="tool-section">
<h2>变换参数</h2>
<div class="control-group"><label>translateX <span class="val" id="txVal">0px</span></label><input type="range" id="tx" min="-200" max="200" value="0"></div>
<div class="control-group"><label>translateY <span class="val" id="tyVal">0px</span></label><input type="range" id="ty" min="-200" max="200" value="0"></div>
<div class="control-group"><label>translateZ <span class="val" id="tzVal">0px</span></label><input type="range" id="tz" min="-200" max="200" value="0"></div>
<div class="control-group"><label>rotateX <span class="val" id="rxVal">0deg</span></label><input type="range" id="rx" min="-360" max="360" value="0"></div>
<div class="control-group"><label>rotateY <span class="val" id="ryVal">0deg</span></label><input type="range" id="ry" min="-360" max="360" value="0"></div>
<div class="control-group"><label>rotateZ <span class="val" id="rzVal">0deg</span></label><input type="range" id="rz" min="-360" max="360" value="0"></div>
<div class="control-group"><label>scaleX <span class="val" id="sxVal">1</span></label><input type="range" id="sx" min="0.1" max="3" step="0.1" value="1"></div>
<div class="control-group"><label>scaleY <span class="val" id="syVal">1</span></label><input type="range" id="sy" min="0.1" max="3" step="0.1" value="1"></div>
<div class="control-group"><label>skewX <span class="val" id="skxVal">0deg</span></label><input type="range" id="skx" min="-180" max="180" value="0"></div>
<div class="control-group"><label>skewY <span class="val" id="skyVal">0deg</span></label><input type="range" id="sky" min="-180" max="180" value="0"></div>
<div class="actions">
<button class="btn btn-primary" id="copyBtn">复制CSS代码</button>
<button class="btn btn-secondary" id="resetBtn">重置</button>
</div>
</div>
</div>
<div class="tool-section" style="margin-top:16px">
<h2>生成的CSS</h2>
<div class="code-block" id="codeBlock">transform: none;</div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const box=document.getElementById('demoBox');
const code=document.getElementById('codeBlock');
const params={tx:0,ty:0,tz:0,rx:0,ry:0,rz:0,sx:1,sy:1,skx:0,sky:0};
function update(){
  box.style.transform='perspective(800px) translate3d('+params.tx+'px,'+params.ty+'px,'+params.tz+'px) rotateX('+params.rx+'deg) rotateY('+params.ry+'deg) rotateZ('+params.rz+'deg) scaleX('+params.sx+') scaleY('+params.sy+') skewX('+params.skx+'deg) skewY('+params.sky+'deg)';
  code.textContent='transform: perspective(800px) translate3d('+params.tx+'px, '+params.ty+'px, '+params.tz+'px)\n  rotateX('+params.rx+'deg) rotateY('+params.ry+'deg) rotateZ('+params.rz+'deg)\n  scaleX('+params.sx+') scaleY('+params.sy+')\n  skewX('+params.skx+'deg) skewY('+params.sky+'deg);';
}
['tx','ty','tz','rx','ry','rz','sx','sy','skx','sky'].forEach(id=>{
  const el=document.getElementById(id);
  const label=document.getElementById(id+'Val');
  el.addEventListener('input',function(){
    params[id]=parseFloat(this.value);
    label.textContent=(['sx','sy'].includes(id)?params[id].toFixed(1):params[id])+(id.startsWith('t')?'px':'deg').replace('deg','deg').replace(/^$/,(id.startsWith('s')?'':''));
    label.textContent=(id.startsWith('s')?params[id].toFixed(1):Math.round(params[id]))+(id.startsWith('t')?'px':id.startsWith('s')?'':'deg');
    update();
  });
});
document.getElementById('copyBtn').addEventListener('click',()=>{
  navigator.clipboard.writeText(code.textContent).then(()=>showToast('已复制到剪贴板'));
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  params.tx=params.ty=params.tz=params.rx=params.ry=params.rz=params.skx=params.sky=0;params.sx=params.sy=1;
  ['tx','ty','tz','rx','ry','rz','sx','sy','skx','sky'].forEach(id=>{
    document.getElementById(id).value=params[id];
    document.getElementById(id+'Val').textContent=(id.startsWith('s')?params[id].toFixed(1):params[id])+(id.startsWith('t')?'px':'deg');
  });
  update();showToast('已重置');
});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
update();
</script>
</body>
