  <style>

    .btn-outline:hover{background:var(--primary);color:#fff}

<body>
<header>
  <a href="/">🧰 Free ToolBase</a>
  <div class="lang-switch"><a href="/en/atbash/">English</a></div>
</header>
<main>
  <h1>🔐 Atbash密码</h1>
  <p class="subtitle">字母表反转替换加密，最古老的单表替换密码之一</p>

  <div class="card">
    <h3>🔤 加密 / 解密（Atbash是对称的，加密和解密是同一操作）</h3>
    <textarea id="input" placeholder="输入文本，例如：Hello World"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnConvert">🔄 转换（编/解码）</button>
      <button class="btn btn-outline" id="btnCopy">📋 复制结果</button>
      <button class="btn btn-outline" id="btnClear">🗑️ 清空</button>
    </div>
    <div class="output-box" id="output"></div>
  </div>

  <div class="card">
    <h3>📖 替换对照表</h3>
    <div class="info" id="mapping"></div>
  </div>
</main>
<footer>© 2024 Free ToolBase · 纯前端工具，数据不上传服务器</footer>
<div class="toast" id="toast"></div>

<script>
function atbash(text) {
  return [...text].map(ch => {
    if (ch >= 'A' && ch <= 'Z') return String.fromCharCode(90 - (ch.charCodeAt(0) - 65));
    if (ch >= 'a' && ch <= 'z') return String.fromCharCode(122 - (ch.charCodeAt(0) - 97));
    return ch;
  }).join('');
}

function showMapping() {
  const uppers = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const reversed = [...uppers].reverse();
  let html = 'A-Z → Z-A 映射：<br><strong>';
  for (let i = 0; i < 26; i++) {
    html += uppers[i] + '↔' + reversed[i] + ' ';
    if ((i+1) % 9 === 0) html += '</strong><br><strong>';
  }
  html += '</strong>';
  document.getElementById('mapping').innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('btnConvert').addEventListener('click', () => {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请先输入文本'); return; }
  document.getElementById('output').textContent = atbash(input);
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('output').textContent;
  if (!text) { showToast('没有可复制的内容'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '';
});

showMapping();
</script>
</body>
