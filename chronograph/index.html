@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .lap-table{font-size:.78rem}
  .lap-table td,.lap-table th{padding:8px 6px}
}

<script>
// ===== STATE =====
var startTime = null;
var elapsedBeforePause = 0;
var timerInterval = null;
var isRunning = false;
var laps = []; // {lapTime, splitTime}
var lastSplitTime = 0;

// ===== TIMER FUNCTIONS =====
function getNow() {
  return performance.now();
}

function formatTime(ms) {
  if (ms < 0) ms = 0;
  var totalSec = Math.floor(ms / 1000);
  var minutes = Math.floor(totalSec / 60);
  var seconds = totalSec % 60;
  var millis = Math.floor(ms % 1000);
  return String(minutes).padStart(2, '0') + ':' +
         String(seconds).padStart(2, '0') + '.' +
         String(millis).padStart(3, '0');
}

function updateDisplay() {
  var currentMs = 0;
  if (isRunning) {
    currentMs = elapsedBeforePause + (getNow() - startTime);
  } else {
    currentMs = elapsedBeforePause;
  }
  document.getElementById('timerDisplay').textContent = formatTime(currentMs);
}

function updateStatus(state, text) {
  var statusEl = document.getElementById('timerStatus');
  var dotClass = '';
  switch(state) {
    case 'running': dotClass = 'running'; break;
    case 'stopped': dotClass = 'stopped'; break;
    default: dotClass = 'idle';
  }
  statusEl.innerHTML = '<span class="status-dot ' + dotClass + '"></span> ' + text;
}

function setButtons(running) {
  document.getElementById('btnStart').disabled = running;
  document.getElementById('btnLap').disabled = !running;
  document.getElementById('btnSplit').disabled = !running;
  document.getElementById('btnStop').disabled = !running;
  document.getElementById('btnReset').disabled = running;
}

// ===== CORE ACTIONS =====
function startTimer() {
  if (isRunning) return;

  if (elapsedBeforePause === 0 && laps.length === 0) {
    // Fresh start
    startTime = getNow();
  } else {
    // Resume after pause
    startTime = getNow();
  }

  isRunning = true;
  timerInterval = setInterval(updateDisplay, 10); // 10ms refresh

  updateStatus('running', '计时中...');
  setButtons(true);
}

function stopTimer() {
  if (!isRunning) return;

  elapsedBeforePause += (getNow() - startTime);
  isRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  updateDisplay();

  updateStatus('stopped', '已停止');
  setButtons(false);
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnReset').disabled = false;
}

function resetTimer() {
  if (isRunning) {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
  }
  startTime = null;
  elapsedBeforePause = 0;
  laps = [];
  lastSplitTime = 0;

  updateDisplay();
  updateStatus('idle', '准备就绪');
  setButtons(false);
  renderLaps();
  document.getElementById('btnExport').disabled = true;
  document.getElementById('statsSection').style.display = 'none';
  document.getElementById('btnStart').disabled = false;
}

function recordLap() {
  if (!isRunning) return;

  var now = getNow();
  var totalElapsed = elapsedBeforePause + (now - startTime);
  var lapTime = totalElapsed - lastSplitTime;
  lastSplitTime = totalElapsed;

  laps.push({ lapTime: lapTime, splitTime: totalElapsed });

  renderLaps();
  updateStats();
  showToast('🏁 第 ' + laps.length + ' 圈: ' + formatTime(lapTime), 'info');
}

function recordSplit() {
  if (!isRunning) return;

  var now = getNow();
  var totalElapsed = elapsedBeforePause + (now - startTime);
  showToast('📊 分段时间: ' + formatTime(totalElapsed), 'info');
}

// ===== RENDER =====
function renderLaps() {
  var container = document.getElementById('lapContent');
  if (laps.length === 0) {
    container.innerHTML = '<div class="lap-empty"><div class="lap-empty-icon">🏃</div><p>点击"开始"启动计时，然后按"Lap"记录每圈时间</p></div>';
    document.getElementById('btnExport').disabled = true;
    return;
  }

  // Find best and worst
  var bestIdx = 0, worstIdx = 0;
  for (var i = 1; i < laps.length; i++) {
    if (laps[i].lapTime < laps[bestIdx].lapTime) bestIdx = i;
    if (laps[i].lapTime > laps[worstIdx].lapTime) worstIdx = i;
  }

  var html = '<table class="lap-table"><thead><tr>' +
    '<th>#</th><th>圈时 (Lap)</th><th>累计 (Split)</th><th>差值</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < laps.length; i++) {
    var rowClass = '';
    if (laps.length > 1) {
      if (i === bestIdx) rowClass = ' lap-best';
      else if (i === worstIdx) rowClass = ' lap-worst';
    }
    var diff = '';
    if (i > 0) {
      var d = laps[i].lapTime - laps[i-1].lapTime;
      var sign = d >= 0 ? '+' : '';
      diff = sign + formatTime(Math.abs(d)).replace('00:', '');
    } else {
      diff = '—';
    }

    html += '<tr class="' + rowClass + '">' +
      '<td class="lap-num">' + (i + 1) + '</td>' +
      '<td class="lap-time">' + formatTime(laps[i].lapTime) + '</td>' +
      '<td class="lap-split">' + formatTime(laps[i].splitTime) + '</td>' +
      '<td class="lap-split">' + diff + '</td>' +
      '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
  document.getElementById('btnExport').disabled = false;
}

function updateStats() {
  if (laps.length === 0) {
    document.getElementById('statsSection').style.display = 'none';
    return;
  }

  document.getElementById('statsSection').style.display = 'block';

  var totalTime = laps[laps.length - 1].splitTime;
  var best = Infinity, worst = -Infinity, sum = 0;
  for (var i = 0; i < laps.length; i++) {
    if (laps[i].lapTime < best) best = laps[i].lapTime;
    if (laps[i].lapTime > worst) worst = laps[i].lapTime;
    sum += laps[i].lapTime;
  }
  var avg = sum / laps.length;

  document.getElementById('statTotal').textContent = formatTime(totalTime);
  document.getElementById('statLaps').textContent = laps.length;
  document.getElementById('statBest').textContent = formatTime(best);
  document.getElementById('statWorst').textContent = formatTime(worst);
  document.getElementById('statAvg').textContent = formatTime(avg);
  document.getElementById('statSplit').textContent = formatTime(totalTime);
}

// ===== EXPORT =====
function exportCSV() {
  if (laps.length === 0) return;

  var csv = '圈号,圈时(Lap),累计(Split),差值\n';
  for (var i = 0; i < laps.length; i++) {
    var diff = '';
    if (i > 0) {
      var d = laps[i].lapTime - laps[i-1].lapTime;
      var sign = d >= 0 ? '+' : '';
      diff = sign + (d / 1000).toFixed(3);
    } else {
      diff = '—';
    }
    csv += (i + 1) + ',' +
           (laps[i].lapTime / 1000).toFixed(3) + ',' +
           (laps[i].splitTime / 1000).toFixed(3) + ',' +
           diff + '\n';
  }

  var blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lap-times-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ CSV已导出', 'success');
}

// ===== TOAST =====
function showToast(msg, type) {
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'info');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 3000);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.code) {
    case 'Space':
      e.preventDefault();
      if (isRunning) { recordLap(); }
      else { startTimer(); }
      break;
    case 'KeyS':
      if (!isRunning) { startTimer(); }
      break;
    case 'KeyL':
      if (isRunning) { recordLap(); }
      break;
    case 'Escape':
      if (isRunning) { stopTimer(); }
      break;
    case 'KeyR':
      if (!isRunning && (laps.length > 0 || elapsedBeforePause > 0)) { resetTimer(); }
      break;
  }
});

// ===== INIT =====
updateDisplay();
</script>
</body>
