      <label>粘贴或输入文本内容</label>
      <textarea id="textInput" placeholder="在此粘贴你的文章或网页文本内容...">SEO（搜索引擎优化）是通过优化网站内容和结构来提高搜索引擎排名的技术。SEO优化的核心是关键词研究，关键词密度是SEO中一个重要指标。合理的关键词密度有助于搜索引擎理解页面主题。但过度堆砌关键词会被搜索引擎惩罚，因此需要检测关键词密度。</textarea>

    <div class="row">
      <div class="form-group">
        <label>最小词长</label>
        <select id="minLen"><option value="1">1字</option><option value="2" selected>2字</option><option value="3">3字</option><option value="4">4字</option></select>
        <style>#minLen { width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:8px; font-size:0.95rem; }</style>
      </div>
      <div class="form-group">
        <label>最大词长</label>
        <select id="maxLen"><option value="1">1字</option><option value="2">2字</option><option value="3" selected>3字</option><option value="4">4字</option></select>
        <style>#maxLen { width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:8px; font-size:0.95rem; }</style>
      </div>

        <label>显示条数</label>

<script>
(function() {
  const textEl = document.getElementById('textInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const minLenEl = document.getElementById('minLen');
  const maxLenEl = document.getElementById('maxLen');
  const topNEl = document.getElementById('topN');
  const resultsCard = document.getElementById('resultsCard');
  const summaryStats = document.getElementById('summaryStats');
  const resultBody = document.getElementById('resultBody');

  function analyze() {
    const text = textEl.value.trim();
    if (!text) { resultsCard.style.display = 'none'; return; }

    const minLen = parseInt(minLenEl.value);
    const maxLen = parseInt(maxLenEl.value);
    const topN = parseInt(topNEl.value);

    if (minLen > maxLen) { alert('最小词长不能大于最大词长'); return; }

    const words = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ').split(/\s+/).filter(w => w.length >= minLen);
    const totalWords = words.length;

    const freq = {};
    for (const w of words) {
      for (let len = minLen; len <= Math.min(maxLen, w.length); len++) {
        for (let i = 0; i <= w.length - len; i++) {
          const ngram = w.substring(i, i + len);
          freq[ngram] = (freq[ngram] || 0) + 1;
        }
      }
    }

    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, topN);
    const uniqueWords = Object.keys(freq).length;

    summaryStats.innerHTML = `
      <div class="stat-box"><div class="num">${totalWords}</div><div class="lbl">总词数</div></div>
      <div class="stat-box"><div class="num">${uniqueWords}</div><div class="lbl">唯一词数</div></div>
      <div class="stat-box"><div class="num">${sorted.length > 0 ? sorted[0][1] : 0}</div><div class="lbl">最高频次</div></div>
      <div class="stat-box"><div class="num">${sorted.length > 0 ? (sorted[0][1] / totalWords * 100).toFixed(2) : 0}%</div><div class="lbl">最高密度</div></div>
    `;

    const maxFreq = sorted.length > 0 ? sorted[0][1] : 1;
    resultBody.innerHTML = sorted.map(([word, count], i) => {
      const density = (count / totalWords * 100).toFixed(2);
      const barWidth = (count / maxFreq * 100).toFixed(0);
      const cls = density > 5 ? 'high' : '';
      return `<tr class="${cls}"><td><strong>${word}</strong></td><td>${count}</td><td>${density}%</td><td><div class="bar-bg"><div class="bar-fill" style="width:${barWidth}%"></div></div></td></tr>`;
    }).join('');

    resultsCard.style.display = 'block';
  }

  analyzeBtn.addEventListener('click', analyze);
  textEl.addEventListener('input', function() { if (!textEl.value.trim()) resultsCard.style.display = 'none'; });
  analyze();
})();
</script>
