<script>
(function(){
  function convert24to12(v){
    if(!v)return '';
    var p=v.split(':');
    var h=parseInt(p[0]),m=p[1];
    if(h===0)return '12:'+m+' AM';
    if(h<12)return h+':'+m+' AM';
    if(h===12)return '12:'+m+' PM';
    return (h-12)+':'+m+' PM';
  }

  function convert12to24(v){
    if(!v)return '';
    var p=v.split(':');
    var h=parseInt(p[0]),m=p[1];
    return (h<10?'0'+h:''+h)+':'+m;
  }

  function spoken(v){
    if(!v)return '';
    var p=v.split(':');
    var h=parseInt(p[0]);
    var m=p[1];
    var ampm='上午';
    if(h===0){h=12}else if(h===12){ampm='下午'}else if(h>12){h=h-12;ampm='下午'}
    if(m==='00')return ampm+h+'点整';
    return ampm+h+'点'+parseInt(m)+'分';
  }

  function updateFrom24(){
    var v=document.getElementById('time-24').value;
    var r=convert24to12(v);
    document.getElementById('result-time').textContent=r||'--';
    document.querySelector('#result-box .label').textContent='12小时制';
    var sp=spoken(v);
    document.querySelector('#result-box .label:last-child').textContent=sp?('也可以说：'+sp):'';
  }

  function updateFrom12(){
    var v=document.getElementById('time-12').value;
    var r=convert12to24(v);
    document.getElementById('result-time').textContent=r||'--';
    document.querySelector('#result-box .label').textContent='24小时制';
    document.querySelector('#result-box .label:last-child').textContent='';
  }

  document.getElementById('time-24').addEventListener('input',function(){
    var v=this.value;
    if(!v)return;
    var p=v.split(':');
    var h=parseInt(p[0]);
    document.getElementById('time-12').value=(h>12?(h-12):(h===0?12:h))+':'+p[1];
    updateFrom24();
  });

  document.getElementById('time-12').addEventListener('input',function(){
    updateFrom12();
  });

  document.getElementById('now-btn').addEventListener('click',function(){
    var d=new Date();
    var h=d.getHours(),m=d.getMinutes();
    var s24=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
    var h12=h>12?h-12:(h===0?12:h);
    var s12=h12+':'+(m<10?'0':'')+m;
    document.getElementById('time-24').value=s24;
    document.getElementById('time-12').value=s12;
    updateFrom24();
  });

  function buildTable(){
    var html='';
    for(var h=0;h<24;h++){
      var h12=h>12?h-12:(h===0?12:h);
      var ampm=h<12?'AM':'PM';
      var sp='';
      if(h===0)sp='午夜12点';
      else if(h<6)sp='凌晨'+h+'点';
      else if(h<12)sp='上午'+h+'点';
      else if(h===12)sp='中午12点';
      else if(h<18)sp='下午'+(h-12)+'点';
      else sp='晚上'+(h-12)+'点';
      html+='<tr><td>'+(h<10?'0':'')+h+':00</td><td>'+h12+':00 '+ampm+'</td><td>'+sp+'</td></tr>';
    }
    document.getElementById('ref-body').innerHTML=html;
  }

  updateFrom24();
  buildTable();
})();
</script>
