<header><h1>🌐 Hreflang标签生成器</h1><p>多语言网站SEO标签 · 一键生成</p></header>

  <div class="card">
    <h2>📝 添加语言版本</h2>
    <div class="form-group"><label>默认页面URL（x-default）</label><input type="url" id="defaultUrl" placeholder="https://example.com/" value="https://free-toolbase.com/"></div>

        <select class="lang-select"><option value="zh">中文 (zh)</option><option value="en" selected>英语 (en)</option><option value="ja">日语 (ja)</option><option value="ko">韩语 (ko)</option><option value="fr">法语 (fr)</option><option value="de">德语 (de)</option><option value="es">西班牙语 (es)</option><option value="pt">葡萄牙语 (pt)</option><option value="it">意大利语 (it)</option><option value="ru">俄语 (ru)</option><option value="ar">阿拉伯语 (ar)</option><option value="hi">印地语 (hi)</option></select>
        <select class="region-select"><option value="">- 不限地区 -</option><option value="CN">中国 (CN)</option><option value="US" selected>美国 (US)</option><option value="GB">英国 (GB)</option><option value="JP">日本 (JP)</option><option value="KR">韩国 (KR)</option><option value="DE">德国 (DE)</option><option value="FR">法国 (FR)</option><option value="BR">巴西 (BR)</option></select>
        <input type="url" class="version-url" placeholder="https://example.com/en/" value="https://free-toolbase.com/en/">
        <button class="remove-btn" onclick="this.closest('.version-item').remove();generate()">✕</button>

<script>
(function() {
  const defaultUrlEl = document.getElementById('defaultUrl');
  const versionsContainer = document.getElementById('versionsContainer');
  const codeOutput = document.getElementById('codeOutput');
  const addBtn = document.getElementById('addBtn');
  const copyBtn = document.getElementById('copyBtn');
  let versionCount = 1;

  function generate() {
    const defaultUrl = defaultUrlEl.value.trim() || 'https://example.com/';
    let tags = ['<link rel="alternate" hreflang="x-default" href="' + defaultUrl + '" />'];

    document.querySelectorAll('.version-item').forEach(item => {
      const lang = item.querySelector('.lang-select').value;
      const region = item.querySelector('.region-select').value;
      const url = item.querySelector('.version-url').value.trim();
      const code = region ? lang + '-' + region : lang;
      tags.push('<link rel="alternate" hreflang="' + code + '" href="' + (url || '#') + '" />');
    });

    codeOutput.textContent = tags.join('\n');
  }

  function addVersion() {
    const idx = versionCount++;
    const div = document.createElement('div');
    div.className = 'version-item';
    div.innerHTML = `
      <select class="lang-select">${document.querySelector('.lang-select').innerHTML}</select>
      <select class="region-select">${document.querySelector('.region-select').innerHTML}</select>
      <input type="url" class="version-url" placeholder="https://example.com/en/">
      <button class="remove-btn">✕</button>
    `;
    div.querySelector('.remove-btn').addEventListener('click', function() { div.remove(); generate(); });
    div.querySelectorAll('select, input').forEach(el => el.addEventListener('input', generate));
    versionsContainer.appendChild(div);
    generate();
  }

  addBtn.addEventListener('click', addVersion);
  defaultUrlEl.addEventListener('input', generate);
  document.querySelectorAll('.version-item select, .version-item input').forEach(el => el.addEventListener('input', generate));

  copyBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(codeOutput.textContent).then(() => {
      copyBtn.textContent = '✅ 已复制!';
      setTimeout(() => copyBtn.textContent = '📋 复制代码', 2000);
    });
  });

  generate();
})();
</script>
