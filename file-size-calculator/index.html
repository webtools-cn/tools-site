  <script>
    const units = [
      { key: 'byte', label: 'Byte (B)', factor: 1 },
      { key: 'kb', label: 'KB', factor: 1024 },
      { key: 'mb', label: 'MB', factor: 1024 ** 2 },
      { key: 'gb', label: 'GB', factor: 1024 ** 3 },
      { key: 'tb', label: 'TB', factor: 1024 ** 4 },
      { key: 'pb', label: 'PB', factor: 1024 ** 5 },
    ];
    const sizeInput = document.getElementById('sizeInput');
    const unitSelect = document.getElementById('unitSelect');
    const resultsDiv = document.getElementById('results');
    const toast = document.getElementById('toast');

    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

    function calculate() {
      const val = parseFloat(sizeInput.value);
      if (isNaN(val) || val < 0) { resultsDiv.innerHTML = '<div class="result-item"><span>请输入有效数值</span></div>'; return; }
      const fromUnit = unitSelect.value;
      const fromFactor = units.find(u => u.key === fromUnit).factor;
      const bytes = val * fromFactor;
      let html = '';
      units.forEach(u => {
        const converted = bytes / u.factor;
        html += `<div class="result-item"><span class="unit">${u.label}</span><span class="value">${converted.toLocaleString('en-US', { maximumFractionDigits: 6 })}</span></div>`;
      });
      resultsDiv.innerHTML = html;
    }

    sizeInput.addEventListener('input', calculate);
    unitSelect.addEventListener('change', calculate);

    sizeInput.value = '1';
    calculate();
  </script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
