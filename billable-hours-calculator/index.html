<div class="container">
<div class="header"><h1>⏱️ 计费工时计算器</h1><div class="lang-switch"><a href="index.html" class="active">中文</a><a href="../en/billable-hours-calculator/">EN</a></div></div>

<div class="hero"><p>快速计算按小时计费的收入预估。输入小时费率和每天工作小时数，即可看到每日/每周/每月/每年的收入。支持多种费率方案对比。</p><span class="badge">零依赖 · 可离线使用</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 输入参数</h2>
  <div class="input-grid">
    <div class="input-group"><label for="hourlyRate">小时费率 ($)</label><input type="number" id="hourlyRate" value="150" min="0" step="1"><div class="hint">您的标准小时费率</div></div>
    <div class="input-group"><label for="hoursPerDay">每天计费小时</label><input type="number" id="hoursPerDay" value="6" min="0" max="16" step="0.5"><div class="hint">扣除午休/行政后的实际计费时间</div></div>
    <div class="input-group"><label for="daysPerWeek">每周工作天数</label><input type="number" id="daysPerWeek" value="5" min="1" max="7" step="1"><div class="hint">每周实际为客户工作的天数</div></div>
    <div class="input-group"><label for="weeksPerYear">每年工作周数</label><input type="number" id="weeksPerYear" value="48" min="1" max="52" step="1"><div class="hint">扣除假期/培训/病假后的实际周数</div></div>
    <div class="input-group"><label for="nonBillablePct">非计费时间占比 (%)</label><input type="number" id="nonBillablePct" value="25" min="0" max="80" step="1"><div class="hint">行政/营销/学习等非计费时间</div></div>
    <div class="input-group"><label for="targetHours">目标年计费小时</label><input type="number" id="targetHours" value="1800" min="0" step="100"><div class="hint">律所常见的年度计费小时目标</div></div>
  </div>

    <button class="btn btn-primary" id="calcBtn">🔍 计算</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 重置</button>
    <button class="btn btn-secondary" id="copyBtn">📋 复制结果</button>
  </div>

  <div class="result-card"><div class="label">📆 周收入</div><div class="value" id="weeklyIncome">-</div><div class="sub">每周计费收入</div></div>

  <h2>📖 计费工时管理</h2>
  <h3>计费 vs 非计费</h3>
  <p>计费时间：直接为客户工作的时间。非计费时间：行政事务、邮件、培训、营销、午休、通勤。优秀从业者保持70-80%计费率。</p>
  <h3>行业标准</h3>
  <p>大律所：1800-2200小时/年（约36-44小时/周）| 中型律所：1500-1800 | 顾问：1400-1700 | 自由职业：1200-1600</p>
  <h3>效率建议</h3>
  <p>使用时间追踪软件记录每项任务；批量处理非计费活动；设定每日计费小时目标；定期分析时间分配。</p>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  const rate=+$('hourlyRate').value||0;
  const hpd=+$('hoursPerDay').value||0;
  const dpw=+$('daysPerWeek').value||0;
  const wpy=+$('weeksPerYear').value||0;
  const nonPct=(+$('nonBillablePct').value||0)/100;
  const target=+$('targetHours').value||0;
  const daily=hpd*rate;
  const weekly=daily*dpw;
  const annualHours=hpd*dpw*wpy*(1-nonPct);
  const annualIncome=annualHours*rate;
  const monthlyIncome=annualIncome/12;
  const targetAchievement=target>0?(annualHours/target*100):0;
  $('dailyIncome').textContent=fmt(daily);
  $('weeklyIncome').textContent=fmt(weekly);
  $('monthlyIncome').textContent=fmt(monthlyIncome);
  $('annualIncome').textContent=fmt(annualIncome);
  $('annualHours').textContent=Math.round(annualHours)+'小时';
  $('targetRate').textContent=targetAchievement.toFixed(1)+'%';
}
function reset(){
  $('hourlyRate').value=150;$('hoursPerDay').value=6;$('daysPerWeek').value=5;
  $('weeksPerYear').value=48;$('nonBillablePct').value=25;$('targetHours').value=1800;
  ['dailyIncome','weeklyIncome','monthlyIncome','annualIncome','annualHours','targetRate'].forEach(function(id){$(id).textContent='-';});
}
function copyResult(){
  const lines=['=== 计费工时收入预估 ===',
    '日收入: '+$('dailyIncome').textContent,
    '周收入: '+$('weeklyIncome').textContent,
    '月收入: '+$('monthlyIncome').textContent,
    '年收入: '+$('annualIncome').textContent,
    '年计费小时: '+$('annualHours').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ 已复制到剪贴板')).catch(()=>showToast('复制失败'));
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
