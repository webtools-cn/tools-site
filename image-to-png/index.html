n:center;padding:20px;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--border)}</style>

<body>

  <main>
    <h1>图片转PNG</h1>
    <p class="desc">将JPG、WebP、GIF、BMP等格式图片转换为PNG格式，纯浏览器端处理，安全隐私。</p>
    <div class="card">
      <div class="drop-zone" id="dropZone">
        <p>📁 拖放图片到此处，或 <span>点击选择文件</span></p>
        <p class="info">支持 JPG, WebP, GIF, BMP, SVG 等格式</p>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <img class="preview" id="preview" alt="预览">
      <div id="actions" style="display:none;margin-top:12px">
        <p class="info" id="fileInfo"></p>
        <button class="btn" id="downloadBtn">下载PNG</button>

  <script>
  const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),preview=document.getElementById('preview'),actions=document.getElementById('actions'),downloadBtn=document.getElementById('downloadBtn'),fileInfo=document.getElementById('fileInfo'),toast=document.getElementById('toast');
  let pngDataUrl='',origName='';
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
  function processFile(file){if(!file.type.startsWith('image/')){showToast('请选择图片文件');return}origName=file.name.replace(/\.[^.]+$/,'');fileInfo.textContent=`${file.name} (${(file.size/1024).toFixed(1)} KB)`;const reader=new FileReader();reader.onload=function(e){const img=new Image();img.onload=function(){const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);pngDataUrl=canvas.toDataURL('image/png');preview.src=pngDataUrl;preview.style.display='block';actions.style.display='block';};img.src=e.target.result;};reader.readAsDataURL(file);}
  dropZone.addEventListener('click',()=>fileInput.click())
  dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')})
  dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'))
  dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');const file=e.dataTransfer.files[0];if(file)processFile(file)})
  fileInput.addEventListener('change',()=>{const file=fileInput.files[0];if(file)processFile(file)})
  downloadBtn.addEventListener('click',()=>{if(!pngDataUrl){showToast('请先选择图片');return}const a=document.createElement('a');a.href=pngDataUrl;a.download=(origName||'image')+'.png';a.click();showToast('下载开始')})
  </script>
