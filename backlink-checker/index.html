<script>
(function() {
  const urlEl = document.getElementById('urlInput');
  const checkBtn = document.getElementById('checkBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');

  function getDomain(url) {
    try { return new URL(url).hostname; } catch(e) { return url.replace(/^https?:\/\//, '').split('/')[0]; }
  }

  function check() {
    let url = urlEl.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    const domain = getDomain(url);
    const now = new Date().toISOString();

    const checks = [
      { name: 'URL格式', icon: '✅', status: 'pass', detail: 'URL格式正确: ' + url },
      { name: 'HTTPS支持', icon: url.startsWith('https://') ? '✅' : '⚠️', status: url.startsWith('https://') ? 'pass' : 'warn', detail: url.startsWith('https://') ? '使用HTTPS安全协议' : '未使用HTTPS，建议升级' },
      { name: '域名解析', icon: '✅', status: 'pass', detail: '域名: ' + domain + '（手动验证需浏览器实际访问）' },
      { name: 'robots.txt', icon: 'ℹ️', status: 'warn', detail: '请手动访问 ' + url.replace(/\/+$/, '') + '/robots.txt 查看爬虫规则' },
      { name: 'Meta Robots标签', icon: 'ℹ️', status: 'warn', detail: '请检查页面源码中的 &lt;meta name="robots"&gt; 标签' },
      { name: 'Canonical标签', icon: 'ℹ️', status: 'warn', detail: '请检查页面是否有规范的 &lt;link rel="canonical"&gt; 标签' },
      { name: 'Sitemap引用', icon: 'ℹ️', status: 'warn', detail: '建议在robots.txt中声明Sitemap位置' },
      { name: '检测时间', icon: '🕐', status: 'pass', detail: now }
    ];

    resultsEl.innerHTML = checks.map(c => `
      <div class="check-item">
        <div class="check-icon">${c.icon}</div>
        <div class="check-info">
          <div class="check-name ${c.status}">${c.name}</div>
          <div class="check-detail">${c.detail}</div>
        </div>
      </div>
    `).join('');
    resultsCard.style.display = 'block';
  }

  checkBtn.addEventListener('click', check);
  urlEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
  check();
})();
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
