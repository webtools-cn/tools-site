  <p class="subtitle">免费在线勾股定理计算工具，输入两条直角边，自动计算斜边长度。</p>
  <div class="card">
    <div class="row">
      <div class="input-group">
        <label for="legA">直角边 a</label>
        <input type="number" id="legA" placeholder="例如：3" step="any" min="0.0001">
      </div>
      <div class="input-group">
        <label for="legB">直角边 b</label>
        <input type="number" id="legB" placeholder="例如：4" step="any" min="0.0001">
      </div>
    </div>
    <button id="calcBtn">计算斜边</button>
    <div id="result" class="result" style="display:none"></div>
    <div id="steps" class="steps" style="display:none"></div>
  </div>
  <div class="card">
    <h2 style="font-size:18px;margin-bottom:8px">📖 什么是勾股定理？</h2>
    <p style="font-size:14px;color:var(--text-secondary)">勾股定理：在直角三角形中，两条直角边的平方和等于斜边的平方。公式为 <strong>c² = a² + b²</strong>，其中 c 是斜边，a 和 b 是直角边。</p>
    <p style="font-size:14px;color:var(--text-secondary);margin-top:8px">常见勾股数：(3, 4, 5)、(5, 12, 13)、(8, 15, 17) 等。</p>

<script>
(function(){
  const legA = document.getElementById('legA');
  const legB = document.getElementById('legB');
  const result = document.getElementById('result');
  const steps = document.getElementById('steps');
  const btn = document.getElementById('calcBtn');

  function showToast(msg){alert(msg)}

  btn.addEventListener('click', function(){
    const a = parseFloat(legA.value);
    const b = parseFloat(legB.value);
    if(isNaN(a)||isNaN(b)||a<=0||b<=0){showToast('请输入有效的正数');return;}
    const c = Math.sqrt(a*a + b*b);
    result.style.display='block';
    result.textContent='斜边 c = ' + c.toFixed(6);
    steps.style.display='block';
    steps.innerHTML='<strong>计算步骤：</strong><br>'+
      'c² = a² + b²<br>'+
      'c² = '+a.toFixed(2)+'² + '+b.toFixed(2)+'²<br>'+
      'c² = '+(a*a).toFixed(4)+' + '+(b*b).toFixed(4)+'<br>'+
      'c² = '+(a*a+b*b).toFixed(4)+'<br>'+
      'c = √'+(a*a+b*b).toFixed(4)+'<br>'+
      'c ≈ <strong>'+c.toFixed(6)+'</strong>';
  });

  legA.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
  legB.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
})();
</script>
