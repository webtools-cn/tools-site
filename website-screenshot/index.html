<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站信息查看器 - Free ToolBase</title>
  <meta name="description" content="免费在线网站信息查看器。输入URL获取网站标题、描述、关键词、OG标签、favicon等SEO元信息。支持预览和导出。">
  <meta property="og:title" content="网站信息查看器 - Free ToolBase">
  <meta property="og:description" content="免费在线网站信息查看器，获取网站SEO元信息">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"网站信息查看器","description":"免费在线网站信息查看器","applicationCategory":"Utility"}</script>
  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:800px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    h2{font-size:1.25rem;font-weight:600;margin-bottom:16px;color:var(--primary-dark)}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text-light)}
    input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn-secondary{background:#e2e8f0;color:var(--text)}
    .btn-secondary:hover{background:#cbd5e1}
    .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .info-table{width:100%;border-collapse:collapse}
    .info-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.9rem}
    .info-table td:first-child{font-weight:600;color:var(--text-light);width:120px;white-space:nowrap}
    .info-table td:last-child{word-break:break-all}
    .preview-box{border:2px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}
    .preview-box h3{font-size:1.1rem;color:var(--primary)}
    .preview-box .url{font-size:.8rem;color:#10b981;margin-bottom:4px}
    .preview-box .desc{font-size:.85rem;color:var(--text-light);line-height:1.5}
    .loading{text-align:center;padding:30px;color:var(--text-light)}
    .status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:600}
    .status-ok{background:#dcfce7;color:#166534}
    .status-warn{background:#fef3c7;color:#92400e}
    .status-err{background:#fee2e2;color:#991b1b}
    footer{text-align:center;padding:20px;color:var(--text-light);font-size:.85rem}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:9999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <header>
    <h1>🌐 网站信息查看器</h1>
    <p>查看任意网站的SEO元信息和预览</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>🔗 输入URL</h2>
      <div class="row" style="align-items:flex-end">
        <div class="form-group" style="flex:1"><label>网站地址</label><input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com"></div>
        <div class="form-group" style="flex:0"><button class="btn btn-primary" onclick="fetchInfo()">🔍 查看信息</button></div>
      </div>
    </div>
    <div class="card" id="resultCard" style="display:none">
      <h2>📊 网站信息</h2>
      <table class="info-table">
        <tbody id="infoBody"></tbody>
      </table>
      <div class="preview-box" id="previewBox" style="display:none">
        <div class="url" id="previewUrl"></div>
        <h3 id="previewTitle"></h3>
        <div class="desc" id="previewDesc"></div>
      </div>
    </div>
  </div>
  <footer>Free ToolBase - 免费在线工具</footer>
  <div class="toast" id="toast"></div>
  <script>
    async function fetchInfo(){
      const url = document.getElementById('urlInput').value.trim();
      if(!url.startsWith('http')){showToast('请输入完整URL (https://...)');return;}
      document.getElementById('resultCard').style.display='block';
      document.getElementById('infoBody').innerHTML='<tr><td colspan="2"><div class="loading">⏳ 正在获取信息...</div></td></tr>';
      try{
        const proxy = 'https://api.allorigins.win/raw?url='+encodeURIComponent(url);
        const resp = await fetch(proxy,{headers:{'User-Agent':'Mozilla/5.0'}});
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        const html = await resp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html,'text/html');
        const title = doc.querySelector('title')?.textContent||'无标题';
        const desc = doc.querySelector('meta[name="description"]')?.content||doc.querySelector('meta[property="og:description"]')?.content||'无描述';
        const keywords = doc.querySelector('meta[name="keywords"]')?.content||'无';
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.content||'无';
        const ogImage = doc.querySelector('meta[property="og:image"]')?.content||'无';
        const favicon = doc.querySelector('link[rel="icon"]')?.href||doc.querySelector('link[rel="shortcut icon"]')?.href||url+'/faivcon.ico';
        const h1 = doc.querySelector('h1')?.textContent||'无';
        const lang = doc.documentElement.lang||'未指定';
        const hasSchema = doc.querySelector('script[type="application/ld+json"]')?'有':'无';
        const canonical = doc.querySelector('link[rel="canonical"]')?.href||'未指定';
        const infoBody = document.getElementById('infoBody');
        infoBody.innerHTML = `
          <tr><td>标题</td><td>${escapeHtml(title)}</td></tr>
          <tr><td>描述</td><td>${escapeHtml(desc)}</td></tr>
          <tr><td>关键词</td><td>${escapeHtml(keywords)}</td></tr>
          <tr><td>OG标题</td><td>${escapeHtml(ogTitle)}</td></tr>
          <tr><td>OG图片</td><td>${escapeHtml(ogImage)}</td></tr>
          <tr><td>Favicon</td><td>${escapeHtml(favicon)}</td></tr>
          <tr><td>H1标题</td><td>${escapeHtml(h1)}</td></tr>
          <tr><td>语言</td><td>${lang}</td></tr>
          <tr><td>Schema</td><td><span class="status-badge ${hasSchema==='有'?'status-ok':'status-warn'}">${hasSchema}</span></td></tr>
          <tr><td>Canonical</td><td>${escapeHtml(canonical)}</td></tr>
        `;
        document.getElementById('previewBox').style.display='block';
        document.getElementById('previewUrl').textContent = url;
        document.getElementById('previewTitle').textContent = title;
        document.getElementById('previewDesc').textContent = desc;
      }catch(e){
        document.getElementById('infoBody').innerHTML=`<tr><td colspan="2"><div style="color:#dc2626">❌ 获取失败: ${escapeHtml(e.message)}<br><small>提示：某些网站可能阻止跨域请求</small></div></td></tr>`;
      }
    }
    function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function showToast(msg){
      const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
    }
  </script>
</body>
</html>
