<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Feed生成器 - Free ToolBase</title>
  <meta name="description" content="在线RSS Feed生成器，快速创建符合标准的RSS 2.0 XML Feed，支持多条目、自动生成、一键复制，适用于博客和新闻站点。">
  <meta property="og:title" content="RSS Feed生成器 - Free ToolBase">
  <meta property="og:description" content="在线RSS Feed生成器，快速创建标准RSS 2.0 XML Feed">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://free-toolbase.com/rss-generator/">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"RSS Feed生成器","applicationCategory":"DeveloperApplication","operatingSystem":"Web","description":"在线RSS Feed生成器","url":"https://free-toolbase.com/rss-generator/"}</script>
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --bg: #0f172a;
      --surface: #1e293b; --surface2: #334155; --text: #f1f5f9;
      --text2: #94a3b8; --border: rgba(148,163,184,.1); --success: #22c55e;
      --danger: #ef4444; --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    header a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 1.1rem; }
    header nav a { margin-left: 20px; color: var(--text2); font-size: 0.9rem; }
    header nav a:hover { color: var(--text); }
    main { flex: 1; max-width: 900px; margin: 0 auto; padding: 32px 16px; width: 100%; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: var(--text2); margin-bottom: 24px; font-size: 0.95rem; }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 1.1rem; margin-bottom: 14px; color: var(--text); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.9rem; color: var(--text2); margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 0.9rem; font-family: inherit;
    }
    .form-group textarea { min-height: 70px; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .btn {
      padding: 10px 20px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface2); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-danger { background: var(--danger); }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
    .item-row {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 10px; position: relative;
    }
    .item-row .remove-btn {
      position: absolute; top: 8px; right: 8px;
      background: var(--danger); color: #fff; border: none; border-radius: 50%;
      width: 24px; height: 24px; cursor: pointer; font-size: 14px; line-height: 24px; text-align: center;
    }
    .output-area {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-top: 16px; position: relative;
    }
    .output-area pre {
      white-space: pre-wrap; word-break: break-all; font-size: 0.85rem;
      color: var(--success); font-family: 'SF Mono', 'Fira Code', monospace;
      max-height: 400px; overflow-y: auto;
    }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text2); cursor: pointer; font-size: 0.8rem;
    }
    .copy-btn:hover { background: var(--primary); color: #fff; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--success); color: #fff;
      padding: 10px 20px; border-radius: var(--radius); z-index: 9999;
      opacity: 0; transform: translateY(10px); transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    footer { text-align: center; padding: 20px; color: var(--text2); font-size: 0.8rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <a href="/">🧰 Free ToolBase</a>
    <nav><a href="/">首页</a><a href="/en/">English</a></nav>
  </header>
  <main>
    <h1>📡 RSS Feed生成器</h1>
    <p class="subtitle">快速创建符合标准的RSS 2.0 XML Feed，适用于博客、新闻站点和播客</p>

    <div class="section">
      <h2>📋 频道信息</h2>
      <div class="form-group">
        <label>频道标题 *</label>
        <input type="text" id="chTitle" placeholder="我的博客" maxlength="200">
      </div>
      <div class="form-group">
        <label>频道链接 *</label>
        <input type="text" id="chLink" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label>频道描述</label>
        <textarea id="chDesc" placeholder="分享技术文章和开源项目..." rows="3"></textarea>
      </div>
      <div class="row">
        <div class="form-group">
          <label>语言</label>
          <input type="text" id="chLang" placeholder="zh-CN" value="zh-CN">
        </div>
        <div class="form-group">
          <label>Copyright</label>
          <input type="text" id="chCopyright" placeholder="© 2025 My Blog">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>📝 条目列表 <button class="btn btn-sm btn-secondary" id="addItemBtn" style="float:right;">+ 添加条目</button></h2>
      <div id="itemsContainer"></div>
    </div>

    <div class="btn-group">
      <button class="btn" id="generateBtn">🔧 生成RSS</button>
      <button class="btn btn-secondary" id="previewBtn">👁️ XML预览</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
    </div>

    <div class="output-area" id="outputArea" style="display:none;">
      <button class="copy-btn" id="copyBtn">📋 复制</button>
      <button class="copy-btn" id="downloadBtn" style="right:80px;">💾 下载</button>
      <pre id="outputCode"></pre>
    </div>
  </main>
  <footer>© 2025 Free ToolBase · 所有工具免费使用</footer>
  <div class="toast" id="toast"></div>

  <script>
    var itemCounter = 0;

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    function createItemRow(num) {
      var div = document.createElement('div');
      div.className = 'item-row';
      div.id = 'item_' + num;
      div.innerHTML = 
        '<button class="remove-btn" onclick="removeItem(\'item_' + num + '\')">×</button>' +
        '<div class="form-group"><label>标题 *</label><input type="text" id="iTitle_' + num + '" placeholder="文章标题"></div>' +
        '<div class="form-group"><label>链接 *</label><input type="text" id="iLink_' + num + '" placeholder="https://example.com/article"></div>' +
        '<div class="form-group"><label>描述</label><textarea id="iDesc_' + num + '" placeholder="文章摘要..." rows="2"></textarea></div>' +
        '<div class="row">' +
        '<div class="form-group"><label>发布日期</label><input type="text" id="iDate_' + num + '" placeholder="' + new Date().toISOString().split('T')[0] + '"></div>' +
        '<div class="form-group"><label>作者</label><input type="text" id="iAuthor_' + num + '" placeholder="作者"></div>' +
        '</div>';
      return div;
    }

    function addItem() {
      itemCounter++;
      var container = document.getElementById('itemsContainer');
      container.appendChild(createItemRow(itemCounter));
    }

    function removeItem(id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    }

    function getVal(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function escapeXml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }

    function generateRSS() {
      var chTitle = getVal('chTitle');
      var chLink = getVal('chLink');
      if (!chTitle || !chLink) {
        showToast('请填写频道标题和链接');
        return;
      }

      var chDesc = getVal('chDesc');
      var chLang = getVal('chLang') || 'zh-CN';
      var chCopyright = getVal('chCopyright');
      var now = new Date().toUTCString();

      var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">\n';
      xml += '  <channel>\n';
      xml += '    <title>' + escapeXml(chTitle) + '</title>\n';
      xml += '    <link>' + escapeXml(chLink) + '</link>\n';
      if (chDesc) xml += '    <description>' + escapeXml(chDesc) + '</description>\n';
      xml += '    <language>' + escapeXml(chLang) + '</language>\n';
      xml += '    <lastBuildDate>' + now + '</lastBuildDate>\n';
      if (chCopyright) xml += '    <copyright>' + escapeXml(chCopyright) + '</copyright>\n';
      xml += '    <atom:link href="' + escapeXml(chLink) + '/rss.xml" rel="self" type="application/rss+xml"/>\n';

      // 收集所有条目
      var items = [];
      for (var i = 1; i <= itemCounter; i++) {
        var title = getVal('iTitle_' + i);
        var link = getVal('iLink_' + i);
        if (title && link) {
          items.push({
            title: title,
            link: link,
            desc: getVal('iDesc_' + i),
            date: getVal('iDate_' + i) || new Date().toISOString().split('T')[0],
            author: getVal('iAuthor_' + i)
          });
        }
      }

      items.forEach(function(item) {
        xml += '    <item>\n';
        xml += '      <title>' + escapeXml(item.title) + '</title>\n';
        xml += '      <link>' + escapeXml(item.link) + '</link>\n';
        if (item.desc) xml += '      <description>' + escapeXml(item.desc) + '</description>\n';
        xml += '      <pubDate>' + new Date(item.date).toUTCString() + '</pubDate>\n';
        if (item.author) xml += '      <author>' + escapeXml(item.author) + '</author>\n';
        xml += '      <guid isPermaLink="true">' + escapeXml(item.link) + '</guid>\n';
        xml += '    </item>\n';
      });

      xml += '  </channel>\n</rss>';

      document.getElementById('outputCode').textContent = xml;
      document.getElementById('outputArea').style.display = 'block';
      return xml;
    }

    function copyOutput() {
      var text = document.getElementById('outputCode').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(function() {
        showToast('✅ 已复制到剪贴板');
      }).catch(function() { showToast('❌ 复制失败'); });
    }

    function downloadRSS() {
      var text = document.getElementById('outputCode').textContent;
      if (!text) { generateRSS(); text = document.getElementById('outputCode').textContent; }
      var blob = new Blob([text], {type: 'application/rss+xml'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'rss.xml';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('generateBtn').addEventListener('click', generateRSS);
    document.getElementById('previewBtn').addEventListener('click', generateRSS);
    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('chTitle').value = '';
      document.getElementById('chLink').value = '';
      document.getElementById('chDesc').value = '';
      document.getElementById('chLang').value = 'zh-CN';
      document.getElementById('chCopyright').value = '';
      document.getElementById('itemsContainer').innerHTML = '';
      itemCounter = 0;
      document.getElementById('outputArea').style.display = 'none';
    });
    document.getElementById('addItemBtn').addEventListener('click', addItem);
    document.getElementById('copyBtn').addEventListener('click', copyOutput);
    document.getElementById('downloadBtn').addEventListener('click', downloadRSS);

    // 初始化2个条目
    addItem();
    addItem();
  </script>
</body>
</html>
