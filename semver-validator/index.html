  <script>
  (function() {
    const SEMVER_RE = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;

    function parseSemver(v) {
      v = (v || '').trim();
      // strip leading 'v' or '='
      if (v[0] === 'v' || v[0] === '=') v = v.slice(1);
      const m = v.match(SEMVER_RE);
      if (!m) return null;
      return {
        major: parseInt(m[1]),
        minor: parseInt(m[2]),
        patch: parseInt(m[3]),
        prerelease: m[4] || '',
        build: m[5] || '',
        raw: v
      };
    }

    function cmp(a, b) {
      if (a.major !== b.major) return a.major - b.major;
      if (a.minor !== b.minor) return a.minor - b.minor;
      if (a.patch !== b.patch) return a.patch - b.patch;
      // pre-release has lower precedence
      if (a.prerelease && !b.prerelease) return -1;
      if (!a.prerelease && b.prerelease) return 1;
      if (a.prerelease && b.prerelease) {
        const pa = a.prerelease.split('.');
        const pb = b.prerelease.split('.');
        const len = Math.min(pa.length, pb.length);
        for (let i = 0; i < len; i++) {
          const na = parseInt(pa[i]), nb = parseInt(pb[i]);
          if (!isNaN(na) && !isNaN(nb)) {
            if (na !== nb) return na - nb;
          } else if (!isNaN(na)) {
            return -1;
          } else if (!isNaN(nb)) {
            return 1;
          } else {
            if (pa[i] < pb[i]) return -1;
            if (pa[i] > pb[i]) return 1;
          }
        }
        return pa.length - pb.length;
      }
      return 0;
    }

    function formatParsed(p) {
      return `<span class="status-badge valid">✓ 有效</span> <strong>Semver 2.0</strong><br>
        <span class="major">主版本: ${p.major}</span> · 
        <span class="minor">次版本: ${p.minor}</span> · 
        <span class="patch">修订号: ${p.patch}</span>` +
        (p.prerelease ? `<br><span class="pre">预发布: ${p.prerelease}</span>` : '') +
        (p.build ? `<br><span class="build">构建元数据: ${p.build}</span>` : '');
    }

    function formatInvalid(v) {
      let reason = '';
      const raw = v.trim();
      if (!raw) reason = '版本号不能为空';
      else if (/[^0-9a-zA-Z\-+.]/.test(raw.replace(/^v|^=/, ''))) reason = '包含非法字符（仅允许数字、字母、连字符、点号和加号）';
      else if (!/^\d+\.\d+\.\d+/.test(raw.replace(/^v|^=/, ''))) reason = '缺少 MAJOR.MINOR.PATCH 三段式结构';
      else if (/(^|\.)0\d+/.test(raw.replace(/^v|^=/, ''))) reason = '数字部分不允许前导零';
      else reason = '不符合 Semver 2.0 规范';
      return `<span class="status-badge invalid">✗ 无效</span> ${reason}`;
    }

    document.getElementById('btnValidate').addEventListener('click', function() {
      const input = document.getElementById('versionInput');
      const result = document.getElementById('validateResult');
      const v = input.value.trim();
      if (!v) { result.style.display = 'block'; result.innerHTML = formatInvalid(v); input.className = 'invalid'; return; }
      const p = parseSemver(v);
      result.style.display = 'block';
      if (p) {
        result.innerHTML = formatParsed(p);
        input.className = 'valid';
      } else {
        result.innerHTML = formatInvalid(v);
        input.className = 'invalid';
      }
    });

    document.getElementById('versionInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('btnValidate').click();
    });

    document.getElementById('btnCompare').addEventListener('click', function() {
      const a = document.getElementById('compareA').value.trim();
      const b = document.getElementById('compareB').value.trim();
      const detail = document.getElementById('compareDetail');
      const resultEl = document.getElementById('compareResult');
      if (!a || !b) { detail.style.display = 'block'; detail.innerHTML = '请输入两个版本号'; return; }
      const pa = parseSemver(a);
      const pb = parseSemver(b);
      detail.style.display = 'block';
      if (!pa && !pb) { detail.innerHTML = '两个版本号均无效'; resultEl.textContent = '?'; return; }
      if (!pa) { detail.innerHTML = `"${a}" 不是有效的 Semver 版本`; resultEl.textContent = '?'; return; }
      if (!pb) { detail.innerHTML = `"${b}" 不是有效的 Semver 版本`; resultEl.textContent = '?'; return; }
      const c = cmp(pa, pb);
      if (c < 0) {
        resultEl.textContent = '<';
        resultEl.style.color = 'var(--warning)';
        detail.innerHTML = `<strong>${a}</strong> 低于 <strong>${b}</strong>（旧版本）`;
      } else if (c > 0) {
        resultEl.textContent = '>';
        resultEl.style.color = 'var(--success)';
        detail.innerHTML = `<strong>${a}</strong> 高于 <strong>${b}</strong>（新版本）`;
      } else {
        resultEl.textContent = '=';
        resultEl.style.color = 'var(--primary)';
        detail.innerHTML = `<strong>${a}</strong> 等于 <strong>${b}</strong>（版本相同）`;
      }
    });

    document.getElementById('btnMatch').addEventListener('click', function() {
      const rangeRaw = document.getElementById('rangeInput').value.trim();
      const testRaw = document.getElementById('testVersion').value.trim();
      const result = document.getElementById('matchResult');
      if (!rangeRaw || !testRaw) { result.style.display = 'block'; result.innerHTML = '请输入范围表达式和测试版本'; return; }
      const testVer = parseSemver(testRaw);
      result.style.display = 'block';
      if (!testVer) { result.innerHTML = `"${testRaw}" 不是有效的 Semver 版本`; return; }

      // simple range parser: >=1.2.3 <2.0.0 || ^1.2.3 || ~1.2.3 || 1.2.x
      let range = rangeRaw.trim();
      let matched = false;
      const parts = range.split(/\s+/);
      const conditions = [];

      for (const part of parts) {
        if (part === '||') continue;
        let op = '>=';
        let vStr = part;
        if (part.startsWith('>=')) { op = '>='; vStr = part.slice(2); }
        else if (part.startsWith('<=')) { op = '<='; vStr = part.slice(2); }
        else if (part.startsWith('>')) { op = '>'; vStr = part.slice(1); }
        else if (part.startsWith('<')) { op = '<'; vStr = part.slice(1); }
        else if (part.startsWith('=')) { op = '='; vStr = part.slice(1); }
        else if (part.startsWith('^')) {
          const base = parseSemver(vStr.slice(1));
          if (base) {
            conditions.push({ op: '>=', ver: base });
            const upper = { major: base.major === 0 ? (base.minor === 0 ? base.patch + 1 : base.minor + 1) : base.major + 1, minor: 0, patch: 0, prerelease: '', build: '' };
            if (base.major === 0 && base.minor === 0) { upper.major = 0; upper.minor = 0; upper.patch = base.patch + 1; }
            else if (base.major === 0) { upper.major = 0; upper.minor = base.minor + 1; upper.patch = 0; }
            conditions.push({ op: '<', ver: upper });
          }
          continue;
        }
        else if (part.startsWith('~')) {
          const base = parseSemver(vStr.slice(1));
          if (base) {
            conditions.push({ op: '>=', ver: base });
            const upper = { major: base.major, minor: base.minor + 1, patch: 0, prerelease: '', build: '' };
            conditions.push({ op: '<', ver: upper });
          }
          continue;
        }
        else if (part.includes('x') || part.includes('*') || part.includes('X')) {
          const vp = vStr.split('.');
          const lo = parseSemver(vp.map(p => (p === 'x' || p === '*' || p === 'X') ? '0' : p).join('.'));
          const hi = parseSemver(vp.map(p => (p === 'x' || p === '*' || p === 'X') ? '999999' : p).join('.'));
          if (lo && hi) {
            conditions.push({ op: '>=', ver: lo });
            conditions.push({ op: '<=', ver: hi });
          }
          continue;
        }
        const ver = parseSemver(vStr);
        if (ver) conditions.push({ op, ver });
      }

      if (conditions.length === 0) {
        result.innerHTML = '无法解析范围表达式';
        return;
      }

      matched = conditions.every(c => {
        const cval = cmp(testVer, c.ver);
        switch (c.op) {
          case '>=': return cval >= 0;
          case '>': return cval > 0;
          case '<=': return cval <= 0;
          case '<': return cval < 0;
          case '=': return cval === 0;
          default: return false;
        }
      });

      if (matched) {
        result.innerHTML = `<span class="status-badge valid">✓ 匹配</span> <strong>${testRaw}</strong> 在范围 <strong>${rangeRaw}</strong> 内`;
      } else {
        result.innerHTML = `<span class="status-badge invalid">✗ 不匹配</span> <strong>${testRaw}</strong> 不在范围 <strong>${rangeRaw}</strong> 内`;
      }
    });

    // click examples
    document.querySelectorAll('.example-tag').forEach(function(tag) {
      tag.addEventListener('click', function() {
        document.getElementById('versionInput').value = this.textContent;
        document.getElementById('btnValidate').click();
      });
    });
  })();
  </script>
