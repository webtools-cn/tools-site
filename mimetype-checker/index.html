<script>
(function(){
var MIME_DB={
'.html':'text/html','.htm':'text/html','.css':'text/css','.js':'application/javascript',
'.json':'application/json','.xml':'application/xml','.pdf':'application/pdf',
'.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.gif':'image/gif',
'.svg':'image/svg+xml','.webp':'image/webp','.ico':'image/x-icon','.bmp':'image/bmp',
'.mp3':'audio/mpeg','.wav':'audio/wav','.ogg':'audio/ogg','.mp4':'video/mp4',
'.webm':'video/webm','.avi':'video/x-msvideo','.mov':'video/quicktime',
'.txt':'text/plain','.csv':'text/csv','.md':'text/markdown','.yaml':'application/x-yaml',
'.yml':'application/x-yaml','.zip':'application/zip','.tar':'application/x-tar',
'.gz':'application/gzip','.7z':'application/x-7z-compressed','.rar':'application/vnd.rar',
'.doc':'application/msword','.docx':'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
'.xls':'application/vnd.ms-excel','.xlsx':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
'.ppt':'application/vnd.ms-powerpoint','.pptx':'application/vnd.openxmlformats-officedocument.presentationml.presentation',
'.ttf':'font/ttf','.woff':'font/woff','.woff2':'font/woff2','.otf':'font/otf',
'.wasm':'application/wasm','.mjs':'application/javascript','.ts':'application/typescript',
'.php':'application/x-httpd-php','.py':'text/x-python','.rb':'text/x-ruby',
'.java':'text/x-java','.c':'text/x-c','.cpp':'text/x-c++','.h':'text/x-c',
'.sh':'application/x-sh','.bat':'application/x-msdownload','.sql':'application/sql',
'.env':'text/plain','.gitignore':'text/plain','.dockerfile':'text/plain',
'.apk':'application/vnd.android.package-archive','.ipa':'application/octet-stream',
'.epub':'application/epub+zip','.mobi':'application/x-mobipocket-ebook',
'.rtf':'application/rtf','.tex':'application/x-tex','.psd':'image/vnd.adobe.photoshop',
'.ai':'application/postscript','.sketch':'application/octet-stream',
'.mpg':'video/mpeg','.mpeg':'video/mpeg','.mkv':'video/x-matroska',
'.flac':'audio/flac','.aac':'audio/aac','.m4a':'audio/mp4','.mid':'audio/midi','.midi':'audio/midi',
'.eot':'application/vnd.ms-fontobject','.map':'application/json',
'.vue':'text/plain','.jsx':'text/plain','.tsx':'text/plain','.scss':'text/x-scss',
'.less':'text/plain','.styl':'text/plain','.coffee':'text/coffeescript',
'.abw':'application/x-abiword','.arc':'application/x-freearc','.azw':'application/vnd.amazon.ebook',
'.bin':'application/octet-stream','.bz':'application/x-bzip','.bz2':'application/x-bzip2',
'.csh':'application/x-csh','.dmg':'application/x-apple-diskimage',
'.ics':'text/calendar','.jar':'application/java-archive',
'.jsonld':'application/ld+json','.mdb':'application/x-msaccess',
'.odp':'application/vnd.oasis.opendocument.presentation','.ods':'application/vnd.oasis.opendocument.spreadsheet',
'.odt':'application/vnd.oasis.opendocument.text','.ogx':'application/ogg',
'.pkg':'application/vnd.apple.installer+xml','.swf':'application/x-shockwave-flash',
'.tar.gz':'application/gzip','.tgz':'application/gzip','.tif':'image/tiff','.tiff':'image/tiff',
'.vcard':'text/vcard','.vcf':'text/vcard','.vsd':'application/vnd.visio',
'.xhtml':'application/xhtml+xml','.xul':'application/vnd.mozilla.xul+xml',
'.3gp':'video/3gpp','.3g2':'video/3gpp2','.7zip':'application/x-7z-compressed',
'.atom':'application/atom+xml','.rss':'application/rss+xml',
'.weba':'audio/webm','.webp':'image/webp','.heic':'image/heic','.heif':'image/heif',
'.avif':'image/avif','.jxl':'image/jxl',
'.log':'text/plain','.lock':'text/plain','.toml':'application/toml',
'.ini':'text/plain','.cfg':'text/plain','.conf':'text/plain'
};

function buildReverse(){
var rev={};
for(var ext in MIME_DB){
var mime=MIME_DB[ext];
if(!rev[mime])rev[mime]=[];
rev[mime].push(ext);
}
return rev;
}
var REV_DB=buildReverse();

var input=document.getElementById('searchInput');
var resultBox=document.getElementById('resultBox');
var commonList=document.getElementById('commonList');

var COMMON_EXTS=['.html','.css','.js','.json','.pdf','.png','.jpg','.svg','.mp4','.mp3','.zip','.docx','.xlsx'];

function renderCommon(){
commonList.innerHTML=COMMON_EXTS.map(function(ext){
return '<span class="chip" data-ext="'+ext+'">'+ext+' → '+MIME_DB[ext]+'</span>';
}).join('');
}

function search(query){
query=query.trim().toLowerCase();
if(!query){
resultBox.innerHTML='<span>输入扩展名或MIME类型开始查询</span>';
resultBox.className='result-box empty';
return;
}
if(query.startsWith('.')){
var mime=MIME_DB[query];
if(mime){
resultBox.innerHTML='<div class="mime-type">'+mime+'</div><div class="desc">扩展名: '+query+'</div>';
resultBox.className='result-box';
}else{
resultBox.innerHTML='<span>未找到扩展名 <b>'+query+'</b> 对应的MIME类型</span>';
resultBox.className='result-box empty';
}
}else{
var exts=REV_DB[query];
if(exts&&exts.length){
resultBox.innerHTML='<div class="mime-type">'+query+'</div><div class="desc">对应扩展名: '+exts.join(', ')+'</div>';
resultBox.className='result-box';
}else{
var foundExt=null;
for(var ext in MIME_DB){
if(MIME_DB[ext].indexOf(query)!==-1){
foundExt=ext;
break;
}
}
if(foundExt){
resultBox.innerHTML='<div class="mime-type">'+MIME_DB[foundExt]+'</div><div class="desc">扩展名: '+foundExt+'（模糊匹配）</div>';
resultBox.className='result-box';
}else{
resultBox.innerHTML='<span>未找到 <b>'+query+'</b></span>';
resultBox.className='result-box empty';
}
}
}
}

document.getElementById('btnSearch').addEventListener('click',function(){search(input.value);});
input.addEventListener('keydown',function(e){if(e.key==='Enter')search(input.value);});

commonList.addEventListener('click',function(e){
var chip=e.target.closest('.chip');
if(!chip)return;
input.value=chip.dataset.ext;
search(chip.dataset.ext);
});

renderCommon();
})();
</script>
</body>
