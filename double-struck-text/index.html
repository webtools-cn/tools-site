<div class="container">
<div class="header"><h1>𝔻𝕠𝕦𝕓𝕝𝕖-𝕊𝕥𝕣𝕦𝕔𝕜 双线体</h1><div class="lang-switch"><a href="index.html" class="active">中文</a><a href="../en/double-struck-text/">EN</a></div></div>

  <div class="panel-title">✏️ 输入文字</div>
  <textarea id="input" placeholder="输入英文，如 Hello World"></textarea>
  <div class="btn-row">
    <button class="btn btn-primary" id="convertBtn">✨ 转换为双线体</button>
    <button class="btn btn-secondary" id="copyBtn">📋 复制结果</button>

<script>
var dsMap={A:'\ud835\udd38',B:'\ud835\udd39',C:'\u2102',D:'\ud835\udd3b',E:'\ud835\udd3c',F:'\ud835\udd3d',G:'\ud835\udd3e',H:'\u210d',I:'\ud835\udd40',J:'\ud835\udd41',K:'\ud835\udd42',L:'\ud835\udd43',M:'\ud835\udd44',N:'\u2115',O:'\ud835\udd46',P:'\u2119',Q:'\u211a',R:'\u211d',S:'\ud835\udd4a',T:'\ud835\udd4b',U:'\ud835\udd4c',V:'\ud835\udd4d',W:'\ud835\udd4e',X:'\ud835\udd4f',Y:'\ud835\udd50',Z:'\u2124',a:'\ud835\udd52',b:'\ud835\udd53',c:'\ud835\udd54',d:'\ud835\udd55',e:'\ud835\udd56',f:'\ud835\udd57',g:'\ud835\udd58',h:'\ud835\udd59',i:'\ud835\udd5a',j:'\ud835\udd5b',k:'\ud835\udd5c',l:'\ud835\udd5d',m:'\ud835\udd5e',n:'\ud835\udd5f',o:'\ud835\udd60',p:'\ud835\udd61',q:'\ud835\udd62',r:'\ud835\udd63',s:'\ud835\udd64',t:'\ud835\udd65',u:'\ud835\udd66',v:'\ud835\udd67',w:'\ud835\udd68',x:'\ud835\udd69',y:'\ud835\udd6a',z:'\ud835\udd6b'};

function convert(text){return text.split('').map(function(c){return dsMap[c]||c;}).join('');}

function renderCharGrid(){
  var grid=document.getElementById('charGrid');
  grid.innerHTML=Object.keys(dsMap).map(function(k){
    return '<div class="char-item"><b>'+dsMap[k]+'</b>'+k+'</div>';
  }).join('');
}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1500);}

document.getElementById('input').addEventListener('input',function(){
  document.getElementById('output').textContent=convert(this.value);
});
document.getElementById('convertBtn').addEventListener('click',function(){
  document.getElementById('output').textContent=convert(document.getElementById('input').value);
  showToast('转换完成');
});
document.getElementById('copyBtn').addEventListener('click',function(){
  var t=document.getElementById('output').textContent;
  if(!t){showToast('无内容可复制');return;}
  navigator.clipboard.writeText(t).then(function(){showToast('已复制!');});
});
document.getElementById('clearBtn').addEventListener('click',function(){document.getElementById('input').value='';document.getElementById('output').textContent='';});

renderCharGrid();
</script>
