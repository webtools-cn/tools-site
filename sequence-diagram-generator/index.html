  <div class="toast" id="toast"></div>
  <script>
    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'error' : '');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Simple sequence diagram parser & SVG renderer
    function parseDiagram(text) {
      const lines = text.split('\n').filter(l => l.trim());
      const result = { title: '', participants: [], messages: [], notes: [], activations: [] };
      const partSet = new Set();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        
        if (trimmed.startsWith('title ')) {
          result.title = trimmed.slice(6);
        } else if (trimmed.startsWith('participant ')) {
          const name = trimmed.slice(12);
          if (!partSet.has(name)) {
            partSet.add(name);
            result.participants.push(name);
          }
        } else if (trimmed.startsWith('Note over ')) {
          const rest = trimmed.slice(10);
          const parts = rest.split(',').map(s => s.trim());
          result.notes.push({ over: parts, text: '' });
        } else if (trimmed.startsWith('Note ')) {
          result.notes.push({ over: [], text: trimmed.slice(5) });
        } else {
          // parse message: A->B: text  or A-->B: text  or A->>B: text
          const msgMatch = trimmed.match(/^(\S+)\s*(-+>?|->>)\s*(\S+)\s*:?\s*(.*)$/);
          if (msgMatch) {
            const [, from, arrow, to, text] = msgMatch;
            const isReturn = arrow.includes('--');
            const isAsync = arrow.includes('>>');
            if (!partSet.has(from)) { partSet.add(from); result.participants.push(from); }
            if (!partSet.has(to)) { partSet.add(to); result.participants.push(to); }
            result.messages.push({ from, to, text: text || '', isReturn, isAsync });
          }
        }
      }
      return result;
    }

    function renderSVG(diagram) {
      const parts = diagram.participants;
      const msgs = diagram.messages;
      const title = diagram.title;

      const partW = 140, topH = 60, msgH = 50, padding = 60;
      const startX = 120, startY = title ? 80 : 40;
      const totalW = startX * 2 + parts.length * partW;
      const totalH = startY + topH + msgs.length * msgH + 40;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" style="font-family: -apple-system, sans-serif; font-size: 13px;">`;
      svg += `<rect width="100%" height="100%" fill="white"/>`;

      if (title) {
        svg += `<text x="${totalW/2}" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">${escapeXml(title)}</text>`;
      }

      // participant boxes
      parts.forEach((p, i) => {
        const cx = startX + i * partW + partW / 2;
        svg += `<rect x="${cx - 55}" y="${startY}" width="110" height="36" rx="4" fill="#e0e7ff" stroke="#4F46E5" stroke-width="1.5"/>`;
        svg += `<text x="${cx}" y="${startY + 23}" text-anchor="middle" fill="#1e293b" font-weight="600">${escapeXml(p)}</text>`;
        // lifeline
        svg += `<line x1="${cx}" y1="${startY + 36}" x2="${cx}" y2="${totalH - 20}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>`;
      });

      // messages
      msgs.forEach((m, mi) => {
        const fromIdx = parts.indexOf(m.from);
        const toIdx = parts.indexOf(m.to);
        if (fromIdx < 0 || toIdx < 0) return;

        const y = startY + topH + mi * msgH + msgH / 2;
        const x1 = startX + fromIdx * partW + partW / 2;
        const x2 = startX + toIdx * partW + partW / 2;
        const leftToRight = x1 < x2;
        const color = m.isReturn ? '#94a3b8' : '#1e293b';

        // arrow
        const arrowHeadSize = 6;
        if (m.isReturn) {
          svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1.5" stroke-dasharray="5,3"/>`;
        } else {
          svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1.5"/>`;
        }
        // arrowhead
        if (leftToRight) {
          svg += `<polygon points="${x2},${y} ${x2-arrowHeadSize},${y-arrowHeadSize/2} ${x2-arrowHeadSize},${y+arrowHeadSize/2}" fill="${color}"/>`;
        } else {
          svg += `<polygon points="${x2},${y} ${x2+arrowHeadSize},${y-arrowHeadSize/2} ${x2+arrowHeadSize},${y+arrowHeadSize/2}" fill="${color}"/>`;
        }

        // label
        if (m.text) {
          const labelX = (x1 + x2) / 2;
          const labelY = y - 8;
          svg += `<text x="${labelX}" y="${labelY}" text-anchor="middle" fill="${color}" font-size="11">${escapeXml(m.text)}</text>`;
        }

        // activation boxes (narrow rectangle on lifeline)
        const boxW = 8;
        svg += `<rect x="${x1 - boxW/2}" y="${y - 10}" width="${boxW}" height="20" fill="#4F46E5" rx="2" opacity="0.3"/>`;
        svg += `<rect x="${x2 - boxW/2}" y="${y - 10}" width="${boxW}" height="20" fill="#4F46E5" rx="2" opacity="0.3"/>`;
      });

      svg += `</svg>`;
      return svg;
    }

    function escapeXml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderDiagram() {
      const text = document.getElementById('codeInput').value;
      const output = document.getElementById('diagramOutput');
      try {
        const diagram = parseDiagram(text);
        if (diagram.participants.length === 0) {
          output.innerHTML = '<p style="color:#94a3b8">请输入至少一个 participant 和一条消息。</p>';
          return;
        }
        const svg = renderSVG(diagram);
        output.innerHTML = svg;
        showToast('图表已生成');
      } catch (e) {
        output.innerHTML = `<p style="color:#ef4444">解析错误: ${e.message}</p>`;
      }
    }

    function downloadSVG() {
      const svgEl = document.getElementById('diagramOutput').querySelector('svg');
      if (!svgEl) { showToast('请先生成图表', true); return; }
      const blob = new Blob([svgEl.outerHTML], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'sequence-diagram.svg'; a.click();
      URL.revokeObjectURL(url);
      showToast('SVG 已下载');
    }

    function downloadPNG() {
      const svgEl = document.getElementById('diagramOutput').querySelector('svg');
      if (!svgEl) { showToast('请先生成图表', true); return; }
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const canvas = document.createElement('canvas');
      const w = parseInt(svgEl.getAttribute('width'));
      const h = parseInt(svgEl.getAttribute('height'));
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'sequence-diagram.png'; a.click();
          URL.revokeObjectURL(url);
          showToast('PNG 已下载');
        }, 'image/png');
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }

    const examples = {
      simple: 'title 简单API请求\nparticipant 客户端\nparticipant API网关\nparticipant 微服务\n客户端->API网关: GET /api/users\nAPI网关->微服务: 转发请求\n微服务-->API网关: 用户列表JSON\nAPI网关-->客户端: 200 OK',
      auth: 'title OAuth 2.0 授权码流程\nparticipant 用户\nparticipant 客户端应用\nparticipant 授权服务器\nparticipant 资源服务器\n用户->客户端应用: 点击登录\n客户端应用->授权服务器: 重定向到授权页\n授权服务器->用户: 显示授权确认\n用户->授权服务器: 确认授权\n授权服务器-->客户端应用: 授权码\n客户端应用->授权服务器: 用授权码换Token\n授权服务器-->客户端应用: Access Token + Refresh Token\n客户端应用->资源服务器: API请求 + Bearer Token\n资源服务器-->客户端应用: 受保护资源',
      payment: 'title 在线支付流程\nparticipant 买家\nparticipant 电商平台\nparticipant 支付网关\nparticipant 银行\n买家->电商平台: 提交订单\n电商平台->支付网关: 创建支付订单\n支付网关->银行: 请求扣款\n银行-->支付网关: 扣款成功\n支付网关-->电商平台: 支付回调通知\n电商平台->买家: 显示支付成功\n电商平台->电商平台: 更新订单状态'
    };

    document.getElementById('renderBtn').addEventListener('click', renderDiagram);
    document.getElementById('downloadSvg').addEventListener('click', downloadSVG);
    document.getElementById('downloadPng').addEventListener('click', downloadPNG);
    document.querySelectorAll('.example-link').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.dataset.example;
        if (examples[key]) document.getElementById('codeInput').value = examples[key];
        renderDiagram();
      });
    });
    // auto render onload
    renderDiagram();)</script>
