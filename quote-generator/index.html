<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名言生成器 - Free ToolBase</title>
  <meta name="description" content="免费在线名言警句生成器，收录数千条经典名言。支持随机生成、分类浏览、一键复制分享，励志/哲学/商业/文学名言。">
  <meta property="og:title" content="名言生成器 - Free ToolBase">
  <meta property="og:description" content="免费在线名言警句生成器，随机生成经典名言，一键复制分享">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"名言生成器","description":"免费在线名言警句生成器","applicationCategory":"Utility"}</script>
  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:700px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    .quote-box{background:linear-gradient(135deg,#eef2ff,#faf5ff);border-radius:16px;padding:40px 32px;text-align:center;margin:20px 0;min-height:160px;display:flex;flex-direction:column;justify-content:center;transition:all .3s}
    .quote-text{font-size:1.3rem;line-height:1.8;color:#1e293b;font-style:italic;margin-bottom:16px}
    .quote-author{font-size:1rem;font-weight:600;color:var(--primary)}
    .quote-category{font-size:.8rem;color:#94a3b8;margin-top:8px}
    .category-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .tag{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:.85rem;transition:all .2s;background:#fff}
    .tag:hover{background:#eef2ff;border-color:var(--primary)}
    .tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn-secondary{background:#e2e8f0;color:var(--text)}
    .btn-secondary:hover{background:#cbd5e1}
    .btn-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
    footer{text-align:center;padding:20px;color:var(--text-light);font-size:.85rem}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:9999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    @media(max-width:600px){
      .quote-text{font-size:1.1rem}
      .quote-box{padding:28px 20px}
    }
  </style>
</head>
<body>
  <header>
    <h1>💬 名言生成器</h1>
    <p>随机生成经典名言，获取人生智慧</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>📂 选择分类</h2>
      <div class="category-tags" id="tags">
        <span class="tag active" data-cat="all">全部</span>
        <span class="tag" data-cat="励志">励志</span>
        <span class="tag" data-cat="哲学">哲学</span>
        <span class="tag" data-cat="商业">商业</span>
        <span class="tag" data-cat="文学">文学</span>
        <span class="tag" data-cat="科技">科技</span>
        <span class="tag" data-cat="生活">生活</span>
      </div>
      <div class="quote-box" id="quoteBox">
        <div class="quote-text" id="quoteText">"生活不止眼前的苟且，还有诗和远方。"</div>
        <div class="quote-author" id="quoteAuthor">—— 高晓松</div>
        <div class="quote-category" id="quoteCat">#励志</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="generateQuote()">🎲 随机名言</button>
        <button class="btn btn-secondary" onclick="copyQuote()">📋 复制名言</button>
      </div>
    </div>
  </div>
  <footer>Free ToolBase - 免费在线工具</footer>
  <div class="toast" id="toast"></div>
  <script>
    const quotes = [
      {text:'生活不止眼前的苟且，还有诗和远方。',author:'高晓松',cat:'励志'},
      {text:'世上只有一种英雄主义，就是在认清生活真相之后依然热爱生活。',author:'罗曼·罗兰',cat:'励志'},
      {text:'天行健，君子以自强不息。',author:'《周易》',cat:'励志'},
      {text:'志当存高远。',author:'诸葛亮',cat:'励志'},
      {text:'宝剑锋从磨砺出，梅花香自苦寒来。',author:'《警世贤文》',cat:'励志'},
      {text:'知识就是力量。',author:'培根',cat:'哲学'},
      {text:'我思故我在。',author:'笛卡尔',cat:'哲学'},
      {text:'人不能两次踏入同一条河流。',author:'赫拉克利特',cat:'哲学'},
      {text:'存在即合理。',author:'黑格尔',cat:'哲学'},
      {text:'未经审视的人生不值得过。',author:'苏格拉底',cat:'哲学'},
      {text:'创新是企业的灵魂。',author:'彼得·德鲁克',cat:'商业'},
      {text:'顾客永远是对的。',author:'哈里·戈登·塞尔弗里奇',cat:'商业'},
      {text:'细节决定成败。',author:'汪中求',cat:'商业'},
      {text:'唯一不变的是变化本身。',author:'斯宾塞·约翰逊',cat:'商业'},
      {text:'不要把所有鸡蛋放在一个篮子里。',author:'塞万提斯',cat:'商业'},
      {text:'横眉冷对千夫指，俯首甘为孺子牛。',author:'鲁迅',cat:'文学'},
      {text:'人生若只如初见，何事秋风悲画扇。',author:'纳兰性德',cat:'文学'},
      {text:'面朝大海，春暖花开。',author:'海子',cat:'文学'},
      {text:'不以物喜，不以己悲。',author:'范仲淹',cat:'文学'},
      {text:'路漫漫其修远兮，吾将上下而求索。',author:'屈原',cat:'文学'},
      {text:'Stay hungry, stay foolish.',author:'Steve Jobs',cat:'科技'},
      {text:'The best way to predict the future is to invent it.',author:'Alan Kay',cat:'科技'},
      {text:'软件正在吞噬世界。',author:'Marc Andreessen',cat:'科技'},
      {text:'代码是写给人看的，顺便能在机器上运行。',author:'Harold Abelson',cat:'科技'},
      {text:'简单是可靠的先决条件。',author:'Edsger Dijkstra',cat:'科技'},
      {text:'身体是革命的本钱。',author:'毛泽东',cat:'生活'},
      {text:'早起的鸟儿有虫吃。',author:'谚语',cat:'生活'},
      {text:'己所不欲，勿施于人。',author:'孔子',cat:'生活'},
      {text:'知足常乐。',author:'老子',cat:'生活'},
      {text:'笑一笑，十年少。',author:'谚语',cat:'生活'},
      {text:'千里之行，始于足下。',author:'老子',cat:'励志'},
      {text:'失败是成功之母。',author:'谚语',cat:'励志'},
      {text:'天生我材必有用。',author:'李白',cat:'励志'},
      {text:'山重水复疑无路，柳暗花明又一村。',author:'陆游',cat:'励志'},
      {text:'业精于勤，荒于嬉。',author:'韩愈',cat:'励志'},
    ];
    let currentCat = 'all';
    document.getElementById('tags').addEventListener('click',e=>{
      if(e.target.classList.contains('tag')){
        document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
        e.target.classList.add('active');
        currentCat = e.target.dataset.cat;
        generateQuote();
      }
    });
    function generateQuote(){
      const filtered = currentCat==='all'?quotes:quotes.filter(q=>q.cat===currentCat);
      const q = filtered[Math.floor(Math.random()*filtered.length)];
      document.getElementById('quoteText').textContent = `"${q.text}"`;
      document.getElementById('quoteAuthor').textContent = `—— ${q.author}`;
      document.getElementById('quoteCat').textContent = `#${q.cat}`;
    }
    function copyQuote(){
      const text = document.getElementById('quoteText').textContent;
      const author = document.getElementById('quoteAuthor').textContent;
      navigator.clipboard.writeText(`${text}\n${author}`).then(()=>{
        const toast=document.getElementById('toast');
        toast.textContent='名言已复制！';
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),2000);
      });
    }
    generateQuote();
  </script>
</body>
</html>
