<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
function fmt(n,d){d=d||2;return Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
function copyResults(){const items=document.querySelectorAll('.result-item');let text='';items.forEach(function(item){const label=item.querySelector('.label').textContent;const value=item.querySelector('.value').textContent;text+=label+': '+value+'\n';});navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板');});}
// == TOOL LOGIC ==

function initInputs() {
  document.getElementById('input-grid').innerHTML = `
    <div class="input-group"><label>一次性投资金额</label><input type="number" id="lumpsum" value="100000" min="1" step="1000"><div class="hint">单位：元</div></div>
    <div class="input-group"><label>每月定投金额</label><input type="number" id="sipMonthly" value="10000" min="1" step="100"><div class="hint">定期定额每月投入</div></div>
    <div class="input-group"><label>预期年化收益率(%)</label><input type="number" id="rate" value="12" min="0" step="0.1"></div>
    <div class="input-group"><label>投资年限</label><input type="number" id="years" value="10" min="1" max="50"></div>
  `;
}
function calculate() {
  const lumpsum = parseFloat(document.getElementById('lumpsum').value) || 0;
  const sipMonthly = parseFloat(document.getElementById('sipMonthly').value) || 0;
  const rate = parseFloat(document.getElementById('rate').value) || 0;
  const years = parseInt(document.getElementById('years').value) || 1;
  const mr = rate / 100 / 12;
  const months = years * 12;
  const lumpsumFV = lumpsum * Math.pow(1 + rate / 100, years);
  let sipFV = 0;
  for (let m = 0; m < months; m++) { sipFV = (sipFV + sipMonthly) * (1 + mr); }
  const lumpsumReturns = lumpsumFV - lumpsum;
  const sipReturns = sipFV - sipMonthly * months;
  const sipTotalInvested = sipMonthly * months;
  const totalInvested = lumpsum + sipTotalInvested;
  const totalFV = lumpsumFV + sipFV;
  document.getElementById('result-grid').innerHTML = `
    <div class="result-item" style="grid-column:span 2;background:rgba(6,182,212,.1)"><div class="label">总到期金额</div><div class="value" style="font-size:1.6rem">` + fmt(totalFV) + `</div></div>
    <div class="result-item"><div class="label">一次性投资到期</div><div class="value">` + fmt(lumpsumFV) + `</div></div>
    <div class="result-item"><div class="label">定投到期金额</div><div class="value">` + fmt(sipFV) + `</div></div>
    <div class="result-item"><div class="label">一次性投资收益</div><div class="value">` + fmt(lumpsumReturns) + `</div></div>
    <div class="result-item"><div class="label">定投总收益</div><div class="value">` + fmt(sipReturns) + `</div></div>
    <div class="result-item"><div class="label">总投资额</div><div class="value">` + fmt(totalInvested) + `</div></div>
  `;
  document.getElementById('note-text').textContent = '一次性投资收益波动大但长期看复利基数更大；定投能平滑市场波动，降低择时风险。';
  document.getElementById('result-section').style.display = 'block';
}
function clearAll() { document.getElementById('lumpsum').value='100000';document.getElementById('sipMonthly').value='10000';document.getElementById('rate').value='12';document.getElementById('years').value='10';document.getElementById('result-section').style.display='none'; }

initInputs();
calculate();
</script>
