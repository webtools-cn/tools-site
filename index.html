<script>
// === 工具数据（从JSON加载） ===
var TOOLS_DATA = null;
var CAT_NAMES = {
  'dev-tools':'开发者工具','utility-tools':'实用工具','finance-tools':'金融工具',
  'text-tools':'文字工具','design-tools':'设计工具','health-tools':'健康工具',
  'image-tools':'图片工具','calc-tools':'计算工具','media-tools':'媒体工具',
  'fun-tools':'趣味娱乐','office-tools':'办公工具','pdf-tools':'PDF工具',
  'math-tools':'数学工具','security-tools':'安全工具','creative-tools':'创意工具',
  'network-tools':'网络工具','life-tools':'生活工具','seo-tools':'SEO工具',
  'productivity-tools':'效率工具','conv-tools':'转换工具','audio-tools':'音频工具',
  'business-tools':'商业工具','converter-tools':'转换工具','gen-tools':'生成工具',
  'developer-tools':'开发工具','travel-tools':'旅行工具','education-tools':'教育工具',
  'kitchen-tools':'厨房工具','css-tools':'CSS工具','color-tools':'颜色工具',
  'sports-tools':'运动工具','study-tools':'学习工具','science-tools':'科学工具',
  'video-tools':'视频工具','data-tools':'数据工具','generator-tools':'生成工具',
  'new-tools':'新工具','check-tools':'检测工具'
};
var CAT_ICONS = {
  'dev-tools':'💻','utility-tools':'🔧','finance-tools':'💰','text-tools':'📝',
  'design-tools':'🎨','health-tools':'❤️','image-tools':'🖼️','calc-tools':'🧮',
  'media-tools':'🎬','fun-tools':'🎮','office-tools':'📊','pdf-tools':'📄',
  'math-tools':'📐','security-tools':'🔒','creative-tools':'🎭','network-tools':'🌐',
  'life-tools':'🏠','seo-tools':'🔍','productivity-tools':'⏱️','conv-tools':'🔄',
  'audio-tools':'🎵','business-tools':'💼','converter-tools':'🔄','gen-tools':'⚙️',
  'developer-tools':'💻','travel-tools':'✈️','education-tools':'📚','kitchen-tools':'🍳',
  'css-tools':'🎨','color-tools':'🎨','sports-tools':'⚽','study-tools':'📖',
  'science-tools':'🔬','video-tools':'🎥','data-tools':'📊','generator-tools':'⚙️',
  'new-tools':'🆕','check-tools':'✅'
};
var PER_PAGE = 40;
var expandedCats = {};
var searchQuery = '';
var activeCategory = 'all';

// 加载JSON数据
fetch('tools-data-cn.json').then(function(r){return r.json()}).then(function(data){
  TOOLS_DATA = data;
  document.getElementById('loading').style.display = 'none';
  var total = 0;
  Object.keys(data).forEach(function(k){total += data[k].length});
  document.getElementById('statTools').textContent = total + '+';
  document.getElementById('statCats').textContent = Object.keys(data).length;
  document.getElementById('footerCount').textContent = total;
  renderCatTabs();
  renderGrouped();
  // URL搜索参数
  var q = new URLSearchParams(window.location.search).get('q');
  if(q){document.getElementById('searchInput').value=q;searchQuery=q.toLowerCase();renderGrouped();}
}).catch(function(e){
  document.getElementById('loading').textContent = '加载失败，请刷新页面';
});

// 渲染分类标签
function renderCatTabs(){
  if(!TOOLS_DATA) return;
  var html = '<span class="cat-tab active" onclick="setCategory(\'all\')">全部</span>';
  var sorted = Object.keys(TOOLS_DATA).sort(function(a,b){return TOOLS_DATA[b].length - TOOLS_DATA[a].length});
  sorted.forEach(function(cat){
    var name = CAT_NAMES[cat] || cat.replace(/-/g,' ');
    var icon = CAT_ICONS[cat] || '📁';
    html += '<span class="cat-tab" onclick="setCategory(\''+cat+'\')">'+icon+' '+name+' ('+TOOLS_DATA[cat].length+')</span>';
  });
  document.getElementById('catTabs').innerHTML = html;
}

function setCategory(cat){
  activeCategory = cat;
  var tabs = document.querySelectorAll('.cat-tab');
  tabs.forEach(function(t){t.classList.remove('active')});
  event.target.classList.add('active');
  expandedCats = {};
  if(cat !== 'all') expandedCats[cat] = true;
  renderGrouped();
}

// 搜索
document.getElementById('searchInput').addEventListener('input', function(e){
  searchQuery = e.target.value.toLowerCase();
  activeCategory = 'all';
  var tabs = document.querySelectorAll('.cat-tab');
  tabs.forEach(function(t){t.classList.remove('active')});
  tabs[0].classList.add('active');
  expandedCats = {};
  if(searchQuery){
    // 搜索时展开有结果的分类
    Object.keys(TOOLS_DATA).forEach(function(cat){
      var filtered = TOOLS_DATA[cat].filter(function(t){return t[1].toLowerCase().indexOf(searchQuery)>-1 || t[2].toLowerCase().indexOf(searchQuery)>-1});
      if(filtered.length > 0) expandedCats[cat] = true;
    });
  }
  renderGrouped();
});

// 渲染工具列表
function renderGrouped(){
  if(!TOOLS_DATA) return;
  var grid = document.getElementById('toolsGrid');
  var html = '';
  var total = 0;
  var sorted = Object.keys(TOOLS_DATA).sort(function(a,b){return TOOLS_DATA[b].length - TOOLS_DATA[a].length});

  sorted.forEach(function(cat){
    var tools = TOOLS_DATA[cat];
    var filtered = tools;
    if(searchQuery){
      filtered = tools.filter(function(t){return t[1].toLowerCase().indexOf(searchQuery)>-1 || t[2].toLowerCase().indexOf(searchQuery)>-1});
    }
    if(activeCategory !== 'all' && cat !== activeCategory) return;
    if(filtered.length === 0) return;
    total += filtered.length;

    var name = CAT_NAMES[cat] || cat.replace(/-/g,' ');
    var icon = CAT_ICONS[cat] || '📁';
    var isExpanded = expandedCats[cat];

    html += '<div class="cat-group" data-cat="'+cat+'">';
    html += '<div class="cat-header" onclick="toggleCat(\''+cat+'\')">';
    html += '<span class="cat-icon">'+icon+'</span>';
    html += '<span class="cat-name">'+name+'</span>';
    html += '<span class="cat-count">'+filtered.length+' 个工具</span>';
    html += '<span class="cat-arrow'+(isExpanded?' expanded':'')+'">▼</span>';
    html += '</div>';
    if(isExpanded){
      html += '<div class="cat-cards">';
      var show = filtered.slice(0, PER_PAGE);
      show.forEach(function(t){
        html += '<div class="tool-card"><div class="tool-icon">'+t[0]+'</div><a href="/'+t[3]+'"><span class="tool-name">'+t[1]+'</span></a><span class="tool-desc">'+t[2]+'</span><a href="/'+t[3]+'" class="btn">立即使用</a></div>';
      });
      if(filtered.length > PER_PAGE){
        html += '<div class="load-more" onclick="loadMore(\''+cat+'\')">显示更多（还有 '+(filtered.length-PER_PAGE)+' 个）</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });

  grid.innerHTML = html;
  document.getElementById('resultCount').textContent = total + ' 个工具';
}

function toggleCat(cat){
  expandedCats[cat] = !expandedCats[cat];
  renderGrouped();
}

function loadMore(cat){
  var tools = TOOLS_DATA[cat];
  var filtered = tools;
  if(searchQuery){
    filtered = tools.filter(function(t){return t[1].toLowerCase().indexOf(searchQuery)>-1 || t[2].toLowerCase().indexOf(searchQuery)>-1});
  }
  var container = document.querySelector('.cat-group[data-cat="'+cat+'"] .cat-cards');
  if(!container) return;
  var existing = container.querySelectorAll('.tool-card').length;
  var more = filtered.slice(existing, existing + PER_PAGE);
  var loadMoreEl = container.querySelector('.load-more');
  var html = '';
  more.forEach(function(t){
    html += '<div class="tool-card"><div class="tool-icon">'+t[0]+'</div><a href="/'+t[3]+'"><span class="tool-name">'+t[1]+'</span></a><span class="tool-desc">'+t[2]+'</span><a href="/'+t[3]+'" class="btn">立即使用</a></div>';
  });
  var div = document.createElement('div');
  div.innerHTML = html;
  while(div.firstChild){
    if(loadMoreEl) container.insertBefore(div.firstChild, loadMoreEl);
    else container.appendChild(div.firstChild);
  }
  var remaining = filtered.length - existing - more.length;
  if(remaining > 0 && loadMoreEl){
    loadMoreEl.textContent = '显示更多（还有 '+remaining+' 个）';
  } else if(loadMoreEl){
    loadMoreEl.remove();
  }
}
</script>
</body>
