<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"学习计划生成器","description":"免费在线学习计划生成器，根据科目、时间、目标自动生成学习计划表。","applicationCategory":"EducationalApplication","operatingSystem":"Web","url":"https://free-toolbase.com/study-planner/"}</script>
  <style>
    :root { --primary: #8B5CF6; --primary-dark: #7C3AED; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav a { color: var(--text-light); text-decoration: none; margin-left: 20px; font-size: 14px; }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 30px 20px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-light); margin-bottom: 24px; font-size: 15px; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn { padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .plan-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .plan-table th { background: var(--primary); color: #fff; padding: 10px; font-size: 13px; text-align: left; }
    .plan-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .plan-table tr:nth-child(even) { background: #f1f5f9; }
    .empty-state { text-align: center; padding: 40px; color: var(--text-light); }
    footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 13px; border-top: 1px solid var(--border); }
    .toast { position: fixed; top: 20px; right: 20px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(-10px); transition: all .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Free ToolBase</a>
    <nav><a href="/">首页</a><a href="/en/">EN</a></nav>
  </header>
  <main>
    <h1>📋 学习计划生成器</h1>
    <p class="subtitle">输入科目、可用时间和目标，自动生成每日学习计划表</p>

    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>计划名称</label><input type="text" id="planName" placeholder="例：期末考试冲刺计划"></div>
        <div class="form-group"><label>总天数</label><input type="number" id="totalDays" value="7" min="1" max="90"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>每日学习时长（小时）</label><input type="number" id="dailyHours" value="3" min="1" max="12" step="0.5"></div>
        <div class="form-group"><label>开始日期</label><input type="date" id="startDate"></div>
      </div>
      <div class="form-group"><label>科目列表（每行一个，格式：科目名:重要程度1-5）</label>
        <textarea id="subjects" rows="4" placeholder="数学:5&#10;英语:4&#10;物理:3&#10;化学:3&#10;语文:2"></textarea>
      </div>
      <button class="btn btn-primary" onclick="generatePlan()">生成计划</button>
      <button class="btn btn-secondary" style="margin-left:8px" onclick="exportPlan()">📄 导出打印</button>
    </div>

    <div class="card" id="planOutput">
      <h3 style="margin-bottom:16px">📅 学习计划表</h3>
      <div id="planContent" class="empty-state">请填写信息并点击"生成计划"</div>
    </div>
  </main>
  <footer>© 2025 Free ToolBase · 所有工具免费使用</footer>
  <div class="toast" id="toast"></div>

  <script>
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
    let currentPlan = null;

    function generatePlan() {
      const name = document.getElementById('planName').value || '学习计划';
      const days = parseInt(document.getElementById('totalDays').value) || 7;
      const dailyH = parseFloat(document.getElementById('dailyHours').value) || 3;
      const startDate = document.getElementById('startDate').value || new Date().toISOString().split('T')[0];
      const subjectsRaw = document.getElementById('subjects').value.trim();

      if (!subjectsRaw) { showToast('请填写科目列表'); return; }

      const subjects = subjectsRaw.split('\n').filter(s => s.trim()).map(s => {
        const parts = s.split(':');
        return { name: parts[0].trim(), weight: parseInt(parts[1]) || 3 };
      });
      const totalWeight = subjects.reduce((sum, s) => sum + s.weight, 0);
      const dailyMinutes = dailyH * 60;

      let plan = [];
      const start = new Date(startDate);
      for (let d = 0; d < days; d++) {
        const date = new Date(start);
        date.setDate(date.getDate() + d);
        const dayStr = date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });
        let sessions = [];
        let remaining = dailyMinutes;
        // Distribute time proportionally
        for (let i = 0; i < subjects.length; i++) {
          const s = subjects[i];
          let mins = Math.round((s.weight / totalWeight) * dailyMinutes);
          if (i === subjects.length - 1) mins = remaining;
          if (mins < 10) mins = 10;
          remaining -= mins;
          sessions.push({ subject: s.name, minutes: mins });
        }
        plan.push({ date: dayStr, sessions, isoDate: date.toISOString().split('T')[0] });
      }

      currentPlan = { name, plan };

      let html = '<table class="plan-table"><tr><th>日期</th><th>科目</th><th>时长</th></tr>';
      plan.forEach(day => {
        const first = day.sessions[0];
        html += '<tr><td rowspan="' + day.sessions.length + '"><strong>' + day.date + '</strong></td>';
        html += '<td>' + first.subject + '</td><td>' + first.minutes + '分钟</td></tr>';
        for (let i = 1; i < day.sessions.length; i++) {
          html += '<tr><td>' + day.sessions[i].subject + '</td><td>' + day.sessions[i].minutes + '分钟</td></tr>';
        }
      });
      html += '</table>';
      document.getElementById('planContent').innerHTML = html;
      document.getElementById('planContent').classList.remove('empty-state');
      showToast('学习计划已生成！');
    }

    function exportPlan() {
      if (!currentPlan) { showToast('请先生成计划'); return; }
      let text = currentPlan.name + '\n' + '='.repeat(40) + '\n\n';
      currentPlan.plan.forEach(day => {
        text += day.date + '\n';
        day.sessions.forEach(s => { text += '  ' + s.subject + ': ' + s.minutes + '分钟\n'; });
        text += '\n';
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = currentPlan.name + '.txt';
      a.click(); URL.revokeObjectURL(url);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
