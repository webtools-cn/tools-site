<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
(function(){
  var container = document.getElementById('cashflowContainer');
  var rowCount = 5;

  function reindex(){
    var rows = container.querySelectorAll('.cashflow-row');
    rows.forEach(function(row,i){
      row.querySelector('span').textContent = '第' + (i+1) + '年';
    });
    rowCount = rows.length;
  }

  function addRow(){
    rowCount++;
    var div = document.createElement('div');
    div.className = 'cashflow-row';
    div.innerHTML = '<span>第' + rowCount + '年</span><input type="number" value="0" step="0.01" class="cf-input"><button class="cf-del" title="删除">×</button>';
    container.appendChild(div);
    bindDelete(div.querySelector('.cf-del'));
  }

  function bindDelete(btn){
    btn.addEventListener('click',function(){
      if(container.querySelectorAll('.cashflow-row').length <= 2) return;
      btn.parentElement.remove();
      reindex();
    });
  }

  container.querySelectorAll('.cf-del').forEach(bindDelete);
  document.getElementById('btnAddRow').addEventListener('click',addRow);

  document.getElementById('btnCalc').addEventListener('click',function(){
    var inv = parseFloat(document.getElementById('initialInvestment').value) || 0;
    var dr = parseFloat(document.getElementById('discountRate').value) / 100 || 0;
    var cfs = [];
    document.querySelectorAll('.cf-input').forEach(function(el){
      cfs.push(parseFloat(el.value) || 0);
    });

    if(inv <= 0){ showToast('请输入有效的初始投资金额'); return; }
    if(cfs.every(function(v){return v===0;})){ showToast('请至少输入一年的现金流'); return; }

    // Simple payback period
    var cumulative = 0;
    var simpleYears = -1;
    for(var i=0;i<cfs.length;i++){
      cumulative += cfs[i];
      if(cumulative >= inv){
        var prev = cumulative - cfs[i];
        var fraction = (inv - prev) / cfs[i];
        simpleYears = i + fraction;
        break;
      }
    }

    // Discounted payback period
    var dCumulative = 0;
    var discYears = -1;
    for(var i=0;i<cfs.length;i++){
      var dcf = cfs[i] / Math.pow(1+dr, i+1);
      dCumulative += dcf;
      if(dCumulative >= inv){
        var dPrev = dCumulative - dcf;
        var dFraction = (inv - dPrev) / dcf;
        discYears = i + dFraction;
        break;
      }
    }

    var totalCF = cfs.reduce(function(a,b){return a+b;},0);
    var npv = 0;
    for(var i=0;i<cfs.length;i++){
      npv += cfs[i] / Math.pow(1+dr, i+1);
    }
    npv -= inv;

    var simpleStr = simpleYears >= 0 ? simpleYears.toFixed(2) + ' 年' : '超过' + cfs.length + '年（无法回本）';
    var discStr = discYears >= 0 ? discYears.toFixed(2) + ' 年' : '超过' + cfs.length + '年（折现后无法回本）';

    document.getElementById('finalResult').textContent = simpleStr;
    document.getElementById('detail').innerHTML =
      '静态回收期：' + simpleStr + '<br>' +
      '动态回收期（折现' + (dr*100).toFixed(1) + '%）：' + discStr + '<br>' +
      '累计现金流：¥' + totalCF.toFixed(2) + ' | 净现值(NPV)：¥' + npv.toFixed(2);
    document.getElementById('result').style.display = 'block';
  });

  document.getElementById('btnClear').addEventListener('click',function(){
    document.getElementById('initialInvestment').value = '100000';
    document.getElementById('discountRate').value = '5';
    document.getElementById('result').style.display = 'none';
  });
})();
</script>

<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
