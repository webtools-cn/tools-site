<body>

  <main>
    <h1>血型信息查询</h1>
    <p class="subtitle">ABO/Rh血型查询：遗传规律、输血兼容、性格特征、全球分布</p>
    <div class="tool-area">
      <label for="aboSelect">您的血型</label>
      <select id="aboSelect">
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
        <option value="O+">O+</option><option value="O-">O-</option>
      </select>
      <button class="btn" id="getInfo">查看信息</button>
      <div id="bloodResult" class="output"></div>
      <script>
      var allTypesLabel = '所有类型';
      var bloodData = {
        'A+': {donate:['A+','AB+'], receive:['A+','A-','O+','O-'], personality:'勤奋、负责、细心', global:'27%'},
        'A-': {donate:['A+','A-','AB+','AB-'], receive:['A-','O-'], personality:'冷静、耐心、有条理', global:'7%'},
        'B+': {donate:['B+','AB+'], receive:['B+','B-','O+','O-'], personality:'有创意、热情、灵活', global:'22%'},
        'B-': {donate:['B+','B-','AB+','AB-'], receive:['B-','O-'], personality:'独立、目标导向', global:'2%'},
        'AB+': {donate:['AB+'], receive:[allTypesLabel], personality:'理性、适应力强、善于交际', global:'5%'},
        'AB-': {donate:['AB+','AB-'], receive:['A-','B-','AB-','O-'], personality:'神秘、善于分析', global:'1%'},
        'O+': {donate:['O+','A+','B+','AB+'], receive:['O+','O-'], personality:'自信、领导力强、善于社交', global:'39%'},
        'O-': {donate:[allTypesLabel], receive:['O-'], personality:'大胆、坚定、万能献血者', global:'6%'}
      };
      document.getElementById('getInfo').addEventListener('click', function() {
        var type = document.getElementById('aboSelect').value;
        var d = bloodData[type];
        var html = '<div style="background:#fff;padding:20px;border-radius:8px;border:1px solid #e2e8f0"><h3>' + type + ' 血型信息</h3>';
        html += '<p><strong>可输血给:</strong> ' + d.donate.join(', ') + '</p>';
        html += '<p><strong>可接受输血:</strong> ' + d.receive.join(', ') + '</p>';
        html += '<p><strong>性格特征:</strong> ' + d.personality + '</p>';
        html += '<p><strong>全球分布:</strong> ' + d.global + '</p></div>';
        document.getElementById('bloodResult').innerHTML = html;
      });
      </script>

  <div class="toast" id="toast"></div>
  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('已复制！')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制！');
    }
  }
  </script>
