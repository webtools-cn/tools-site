<script>
function extractLinks(){
  const md=document.getElementById('mdInput').value;
  const dedup=document.getElementById('dedup').checked;
  const links=[];
  const refs={};
  // Parse reference definitions
  const refRegex=/^\s*\[([^\]]+)\]:\s*(?:<([^>]+)>|(\S+))\s*(?:"([^"]*)"|'([^']*)'|\(([^)]*)\))?\s*$/gm;
  let m;
  while((m=refRegex.exec(md))!==null){
    const ref=m[1].toLowerCase();
    const url=m[2]||m[3];
    if(url)refs[ref]=url;
  }
  // Inline links [text](url)
  const inlineRegex=/!?\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g;
  while((m=inlineRegex.exec(md))!==null){
    const isImg=md.substring(m.index,m.index+1)==='!';
    links.push({url:m[2],type:isImg?'图片':'链接',text:m[1]});
  }
  // Reference links [text][ref]
  const refLinkRegex=/!?\[([^\]]+)\]\s*\[([^\]]*)\]/g;
  while((m=refLinkRegex.exec(md))!==null){
    const ref=(m[2]||m[1]).toLowerCase();
    if(refs[ref]){
      const isImg=md.substring(m.index,m.index+1)==='!';
      links.push({url:refs[ref],type:isImg?'图片':'链接',text:m[1]});
    }
  }
  // Bare URLs
  const bareRegex=/(?<!\(|")(https?:\/\/[^\s<>"]+)/g;
  while((m=bareRegex.exec(md))!==null){
    const pos=m.index;
    const before=md.substring(Math.max(0,pos-3),pos);
    if(!before.match(/\]\(|"\s*$/))links.push({url:m[1],type:'纯URL',text:''});
  }
  let result=links;
  if(dedup){
    const seen=new Set();
    result=links.filter(l=>{if(seen.has(l.url))return false;seen.add(l.url);return true;});
  }
  document.getElementById('summary').textContent=`共找到 ${result.length} 个链接（链接 ${links.filter(l=>l.type==='链接').length}，图片 ${links.filter(l=>l.type==='图片').length}，纯URL ${links.filter(l=>l.type==='纯URL').length}）`;
  const box=document.getElementById('resultBox');
  if(result.length===0){box.innerHTML='<span style="color:#64748b">未找到链接</span>';return;}
  box.innerHTML=result.map(l=>`<div class="link-item"><span class="link-url">${escapeHtml(l.url)}</span><span class="link-type">[${l.type}]</span></div>`).join('');
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
document.getElementById('extractBtn').addEventListener('click',extractLinks);
document.getElementById('mdInput').addEventListener('input',extractLinks);
document.getElementById('copyBtn').addEventListener('click',()=>{
  const urls=[...document.querySelectorAll('.link-url')].map(e=>e.textContent).join('\n');
  if(urls){navigator.clipboard.writeText(urls).then(()=>showToast('已复制到剪贴板'));}
  else showToast('没有链接可复制');
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  document.getElementById('mdInput').value='';
  document.getElementById('resultBox').innerHTML='';
  document.getElementById('summary').textContent='';
});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
