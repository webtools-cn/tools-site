<!DOCTYPE html><html><head><meta charset="utf-8"><title>QA</title></head><body>
<script>
const pages = ["ats-resume-checker","audio-converter","audio-cutter","audio-eq-presets","audio-fade-generator","audio-loop-maker","audio-noise-reducer","audio-panner"];
const widths = [375, 1280];
const out = [];
const inject = `<script>
window.__qaErrors = [];
window.onerror = function(msg, src, line){ window.__qaErrors.push(String(msg).slice(0,120)); return false; };
window.addEventListener('error', function(e){ window.__qaErrors.push((e.message||'err').slice(0,120)); }, true);
window.addEventListener('unhandledrejection', function(e){ window.__qaErrors.push('REJ: ' + String(e.reason).slice(0,120)); });
<\\/script>`;
async function run(){
  for (const p of pages) {
    const res = await fetch('en/' + p + '/index.html');
    const html = await res.text();
    const withHook = html.replace(/<head>/i, '<head>' + inject);
    for (const w of widths) {
      const f = document.createElement('iframe');
      f.style.width = w + 'px';
      f.style.border = '0';
      f.srcdoc = withHook;
      document.body.appendChild(f);
      await new Promise(r => setTimeout(r, 900));
      let scrollW, h1Top, lsTop, footOk, errors;
      try {
        const d = f.contentDocument, win = f.contentWindow;
        scrollW = d.scrollingElement.scrollWidth;
        const h1 = d.querySelector('h1');
        h1Top = h1 ? Math.round(h1.getBoundingClientRect().top) : null;
        let ls = null;
        for (const a of d.querySelectorAll('a')) { if (a.textContent.trim() === '中文') { ls = a; break; } }
        lsTop = ls ? Math.round(ls.getBoundingClientRect().top) : null;
        const foot = d.querySelector('footer');
        const bodyH = d.body.scrollHeight;
        const footBottom = foot ? Math.round(foot.getBoundingClientRect().bottom) : null;
        footOk = foot ? (Math.abs(footBottom - bodyH) < 80) : null;
        errors = (win.__qaErrors || []).slice();
      } catch(err) { errors = ['ACCESS: ' + err.message]; }
      out.push({p, w, scrollW, overflow: scrollW > w ? scrollW - w : 0, h1Top, lsTop, lsAboveH1: lsTop !== null && h1Top !== null && lsTop < h1Top, footOk, errors});
      f.remove();
    }
  }
  document.getElementById('result').textContent = JSON.stringify(out);
}
run();
</script>
<pre id="result">running...</pre>
</body></html>
