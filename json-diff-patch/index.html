<body>
<header><h1>🔍 JSON 差异对比</h1></header>
<main>
  <div class="card">
    <h2>输入 JSON</h2>
    <div class="two-col">
      <div>
        <label style="font-size:0.8rem;color:var(--text2);display:block;margin-bottom:4px">原始 JSON (Old)</label>
        <textarea id="jsonOld" placeholder='{"name":"张三","age":25}'>{"name":"张三","age":25,"city":"北京"}</textarea>
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text2);display:block;margin-bottom:4px">新 JSON (New)</label>
        <textarea id="jsonNew" placeholder='{"name":"李四","age":30}'>{"name":"李四","age":30,"city":"北京"}</textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnCompare">🔍 对比差异</button>
      <button class="btn btn-secondary" id="btnCopy">📋 复制结果</button>
      <button class="btn btn-outline" id="btnClear">✕ 清空</button>

<div class="toast" id="toast"></div>
<script>
const jsonOld = document.getElementById('jsonOld');
const jsonNew = document.getElementById('jsonNew');
const resultOutput = document.getElementById('resultOutput');
const errorMsg = document.getElementById('errorMsg');
const stats = document.getElementById('stats');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function diffObjects(a, b, path) {
  path = path || '';
  const patches = [];
  const allKeys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  allKeys.forEach(key => {
    const fullPath = path ? `${path}.${key}` : key;
    if (!(key in b)) {
      patches.push({ op: 'remove', path: `/${fullPath.replace(/\./g, '/')}`, oldValue: a[key] });
    } else if (!(key in a)) {
      patches.push({ op: 'add', path: `/${fullPath.replace(/\./g, '/')}`, value: b[key] });
    } else if (JSON.stringify(a[key]) !== JSON.stringify(b[key])) {
      if (typeof a[key] === 'object' && typeof b[key] === 'object' && a[key] !== null && b[key] !== null && !Array.isArray(a[key])) {
        patches.push(...diffObjects(a[key], b[key], fullPath));
      } else {
        patches.push({ op: 'replace', path: `/${fullPath.replace(/\./g, '/')}`, oldValue: a[key], value: b[key] });
      }
    }
  });
  return patches;
}

document.getElementById('btnCompare').addEventListener('click', () => {
  errorMsg.textContent = '';
  try {
    const a = JSON.parse(jsonOld.value.trim() || '{}');
    const b = JSON.parse(jsonNew.value.trim() || '{}');
    const patches = diffObjects(a, b);
    const added = patches.filter(p => p.op === 'add').length;
    const removed = patches.filter(p => p.op === 'remove').length;
    const changed = patches.filter(p => p.op === 'replace').length;
    stats.innerHTML = `<span class="stat"><span class="added">+${added} 新增</span></span>
      <span class="stat"><span class="removed">-${removed} 删除</span></span>
      <span class="stat"><span class="changed">~${changed} 修改</span></span>`;
    if (patches.length === 0) {
      resultOutput.textContent = '✅ 两个JSON完全一致，没有差异';
    } else {
      resultOutput.textContent = JSON.stringify(patches, null, 2);
    }
  } catch(e) {
    errorMsg.textContent = '❌ JSON解析错误: ' + e.message;
    resultOutput.textContent = '对比失败';
    stats.innerHTML = '';
  }
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = resultOutput.textContent;
  if (text === '等待对比...' || text === '对比失败') { showToast('请先对比'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => showToast('复制失败'));
});

document.getElementById('btnClear').addEventListener('click', () => {
  jsonOld.value = '';
  jsonNew.value = '';
  resultOutput.textContent = '等待对比...';
  stats.innerHTML = '';
  errorMsg.textContent = '';
});
</script>
