<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="免费在线日期加减计算器，在指定日期上加减天数、周数、月数或年数，快速得出新日期和星期。">

  <meta property="og:description" content="免费在线日期加减计算器，快速计算N天/周/月/年后的日期。">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "日期加减计算器",
    "applicationCategory": "UtilityApplication",

    "description": "免费在线日期加减计算器，快速计算N天/周/月/年后的日期。"
  }
  </script>
  <style>
    :root{--primary:#4F46E5;--primary-light:#EEF2FF;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header .logo{font-size:1.25rem;font-weight:700;color:var(--primary);text-decoration:none}
    header nav{display:flex;gap:16px}
    header nav a{color:var(--text-secondary);text-decoration:none;font-size:.9rem;transition:color .2s}
    header nav a:hover{color:var(--primary)}
    main{flex:1;max-width:800px;margin:0 auto;padding:32px 20px;width:100%}
    h1{font-size:1.75rem;margin-bottom:8px;color:var(--text)}
    .subtitle{color:var(--text-secondary);margin-bottom:28px;font-size:.95rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
    .card h2{font-size:1.1rem;margin-bottom:16px;color:var(--text)}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text)}
    input,select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;transition:border-color .2s}
    input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:500;cursor:pointer;transition:all .2s;gap:6px}
    .btn-primary{background:var(--primary);color:#fff;width:100%}
    .btn-primary:hover{background:#4338CA;transform:translateY(-1px)}
    .input-row{display:flex;gap:12px;align-items:end}
    .input-row>div{flex:1}
    .input-row>div:last-child{flex:0 0 140px}
    .result-box{background:var(--primary-light);border-radius:8px;padding:20px;text-align:center;margin-top:20px}
    .result-box .date{font-size:1.8rem;font-weight:700;color:var(--primary)}
    .result-box .weekday{font-size:1rem;color:var(--text-secondary);margin-top:4px}
    .result-box .diff{font-size:.85rem;color:var(--text-secondary);margin-top:8px}
    .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .preset-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
    .preset-btn:hover{background:var(--primary-light);border-color:var(--primary)}
    footer{background:var(--card);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.85rem;color:var(--text-secondary)}
    footer a{color:var(--primary);text-decoration:none}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:1.4rem}.input-row{flex-direction:column}.input-row>div:last-child{flex:1}.result-box .date{font-size:1.4rem}}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>
</head>
<body>
<header>
  <a href="/" class="logo">Free ToolBase</a>
  <nav>
    <a href="/">首页</a>
    <a href="/en/date-add/">English</a>
  </nav>
</header>
<main>
  <h1>📅 日期加减计算器</h1>
  <p class="subtitle">在指定日期上加减天数、周数、月数或年数，快速得出新日期和星期几。</p>
  <div class="card">
    <div class="input-row">
      <div>
        <label for="base-date">起始日期</label>
        <input type="date" id="base-date">
      </div>
      <div>
        <label for="amount">数量</label>
        <input type="number" id="amount" value="7" min="0" max="9999">
      </div>
      <div>
        <label for="unit">单位</label>
        <select id="unit">
          <option value="days">天</option>
          <option value="weeks">周</option>
          <option value="months">月</option>
          <option value="years">年</option>
        </select>
      </div>
    </div>
    <div class="presets">
      <button class="preset-btn" data-days="1">明天</button>
      <button class="preset-btn" data-days="7">7天后</button>
      <button class="preset-btn" data-days="30">30天后</button>
      <button class="preset-btn" data-days="90">90天后</button>
      <button class="preset-btn" data-days="365">365天后</button>
    </div>
    <div class="result-box">
      <div class="label" style="margin-bottom:4px">计算结果</div>
      <div class="date" id="result-date">--</div>
      <div class="weekday" id="result-weekday"></div>
      <div class="diff" id="result-diff"></div>
    </div>
  </div>
  <div class="card">
    <h2>📖 使用说明</h2>
    <p style="font-size:.9rem;color:var(--text-secondary);line-height:1.8">
      选择起始日期、输入数量（正数为加、负数为减），选择单位即可。
      支持天、周、月、年四种单位。月份加减会自动处理月末边界（如1月31日加1个月=2月28/29日）。
      点击预设按钮可快速选择常用时间间隔。
    </p>
  </div>
</main>
<footer>
  <p>&copy; 2025 <a href="/">Free ToolBase</a> · 免费在线工具</p>
</footer>
<script>
(function(){
  var weekdays=['日','一','二','三','四','五','六'];
  var today=new Date();
  var ds=today.getFullYear()+'-'+(today.getMonth()<9?'0':'')+(today.getMonth()+1)+'-'+(today.getDate()<10?'0':'')+today.getDate();
  document.getElementById('base-date').value=ds;

  function calc(){
    var bd=document.getElementById('base-date').value;
    var amt=parseInt(document.getElementById('amount').value)||0;
    var unit=document.getElementById('unit').value;
    if(!bd)return;
    var d=new Date(bd+'T00:00:00');
    var orig=d.getTime();
    switch(unit){
      case 'days':d.setDate(d.getDate()+amt);break;
      case 'weeks':d.setDate(d.getDate()+amt*7);break;
      case 'months':d.setMonth(d.getMonth()+amt);break;
      case 'years':d.setFullYear(d.getFullYear()+amt);break;
    }
    var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
    var s=y+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
    document.getElementById('result-date').textContent=s;
    document.getElementById('result-weekday').textContent='星期'+weekdays[d.getDay()];
    var diffDays=Math.round((d.getTime()-orig)/86400000);
    document.getElementById('result-diff').textContent='(相差 '+Math.abs(diffDays)+' 天)';
  }

  document.getElementById('base-date').addEventListener('input',calc);
  document.getElementById('amount').addEventListener('input',calc);
  document.getElementById('unit').addEventListener('change',calc);

  document.querySelectorAll('.preset-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.getElementById('amount').value=this.dataset.days;
      document.getElementById('unit').value='days';
      calc();
    });
  });

  calc();
})();
</script>
</body>
</html>
