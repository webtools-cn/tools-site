  <main class="container">
    <h1>🚀 创业跑道计算器</h1>
    <div class="card" id="calc-card">
            <div class="input-group">
        <label for="cash">Cash Balance ($)</label>
        <input type="number" id="cash" placeholder="e.g. 100000" step="0.01" min="0">
      </div>
      <div class="input-group">
        <label for="burn-rate">Monthly Burn Rate ($)</label>
        <input type="number" id="burn-rate" placeholder="e.g. 15000" step="0.01" min="0">
      </div>
      <div class="input-group">
        <label for="revenue">Monthly Revenue ($)</label>
        <input type="number" id="revenue" placeholder="e.g. 5000" step="0.01" min="0">
      </div>
      <button class="btn" onclick="calculate()">计算</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空</button>
      <div class="result" id="result"></div>
    </div>
    <section class="related-tools" style="margin:2rem 0;padding:1rem;background:#f8fafc;border-radius:8px;"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#374151;">🔗 Related Tools</h2><div style="display:flex;flex-wrap:wrap;gap:4px;"><a href="/en/saas-mrr-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">SaaS MRR</a><a href="/en/revenue-churn-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">Revenue Churn</a><a href="/en/burn-rate-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">Burn Rate</a></div></section>
  </main>

  <div class="toast" id="toast"></div>
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
    function copyResult(text) {
      navigator.clipboard.writeText(text).then(() => showToast('已复制！'));
    }
    
    function calculate() {
      const cash = parseFloat(document.getElementById('cash').value) || 0;
      const burn = parseFloat(document.getElementById('burn-rate').value) || 0;
      const rev = parseFloat(document.getElementById('revenue').value) || 0;
      if (cash <= 0 || burn <= 0) { showToast('Please enter cash balance and burn rate'); return; }
      const netBurn = burn - rev;
      const months = netBurn > 0 ? (cash / netBurn).toFixed(1) : (rev >= burn ? '∞' : '0');
      document.getElementById('result').innerHTML = `
        <div class="result-item"><span>Net Monthly Burn</span><span class="result-value">$${netBurn.toLocaleString('en-US', {minimumFractionDigits:2})}</span></div>
        <div class="result-item"><span>Runway</span><span class="result-value">${months} months</span></div>
      `;
      document.getElementById('result').classList.add('show');
    }
    function clearAll() {
      ['cash','burn-rate','revenue'].forEach(id => document.getElementById(id).value='');
      document.getElementById('result').classList.remove('show');
    }
  </script>
