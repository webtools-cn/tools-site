<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假期预算规划器 - 智能旅行预算管理 | Free ToolBase</title>
  <meta name="description" content="免费在线假期预算规划器，设置总预算后按交通、住宿、餐饮、娱乐等类别分配，实时追踪花费，超支提醒。">
  <meta property="og:title" content="假期预算规划器 - Free ToolBase">
  <meta property="og:description" content="免费在线假期预算规划器，按类别分配预算，实时追踪花费，超支提醒。">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"假期预算规划器","description":"免费在线假期预算规划器，按类别分配预算，实时追踪花费，超支提醒。","applicationCategory":"TravelApplication","operatingSystem":"Web","url":"https://free-toolbase.com/vacation-budget/"}</script>
  <style>
    :root { --primary: #10B981; --primary-dark: #059669; --danger: #ef4444; --warning: #f59e0b; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav a { color: var(--text-light); text-decoration: none; margin-left: 20px; font-size: 14px; }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 30px 20px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-light); margin-bottom: 24px; font-size: 15px; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .budget-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; padding: 10px; background: var(--bg); border-radius: 8px; }
    @media (max-width: 500px) { .budget-row { grid-template-columns: 1fr 1fr; } }
    .budget-row .cat-name { font-weight: 600; font-size: 14px; }
    .budget-row .progress-bg { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .budget-row .progress-fill { height: 100%; border-radius: 4px; transition: width .3s; }
    .progress-green { background: var(--primary); }
    .progress-yellow { background: var(--warning); }
    .progress-red { background: var(--danger); }
    .over-budget { color: var(--danger); font-weight: 700; }
    .total-display { font-size: 36px; font-weight: 700; color: var(--primary); text-align: center; padding: 20px; }
    footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 13px; border-top: 1px solid var(--border); }
    .toast { position: fixed; top: 20px; right: 20px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(-10px); transition: all .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Free ToolBase</a>
    <nav><a href="/">首页</a><a href="/en/">EN</a></nav>
  </header>
  <main>
    <h1>🏖️ 假期预算规划器</h1>
    <p class="subtitle">设置旅行总预算，按类别分配，实时追踪花费，超支自动提醒</p>

    <div class="card">
      <div class="form-group" style="margin-bottom:16px"><label>旅行总预算（元）</label><input type="number" id="totalBudget" value="10000" min="0" onchange="updateDisplay()"></div>
      <div id="categories">
        <div class="budget-row" data-cat="交通"><span class="cat-name">🚗 交通</span><input type="number" value="2000" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
        <div class="budget-row" data-cat="住宿"><span class="cat-name">🏨 住宿</span><input type="number" value="3000" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
        <div class="budget-row" data-cat="餐饮"><span class="cat-name">🍽️ 餐饮</span><input type="number" value="2000" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
        <div class="budget-row" data-cat="娱乐"><span class="cat-name">🎢 娱乐</span><input type="number" value="1500" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
        <div class="budget-row" data-cat="购物"><span class="cat-name">🛍️ 购物</span><input type="number" value="1000" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
        <div class="budget-row" data-cat="其他"><span class="cat-name">📦 其他</span><input type="number" value="500" min="0" class="cat-budget" onchange="updateDisplay()"><input type="number" value="0" min="0" class="cat-spent" onchange="updateDisplay()" placeholder="已花费"><div class="progress-bg"><div class="progress-fill progress-green" style="width:0%"></div></div></div>
      </div>
    </div>

    <div class="card" style="text-align:center">
      <div style="font-size:14px;color:var(--text-light);margin-bottom:8px">总预算剩余</div>
      <div class="total-display" id="remaining">¥10,000</div>
      <div style="font-size:14px" id="status"></div>
    </div>
  </main>
  <footer>© 2025 Free ToolBase · 所有工具免费使用</footer>
  <div class="toast" id="toast"></div>

  <script>
    function updateDisplay() {
      const total = parseInt(document.getElementById('totalBudget').value) || 0;
      let totalBudgeted = 0, totalSpent = 0;
      const rows = document.querySelectorAll('.budget-row');
      rows.forEach(row => {
        const budget = parseInt(row.querySelector('.cat-budget').value) || 0;
        const spent = parseInt(row.querySelector('.cat-spent').value) || 0;
        totalBudgeted += budget; totalSpent += spent;
        const fill = row.querySelector('.progress-fill');
        const pct = budget > 0 ? Math.min(spent / budget * 100, 100) : 0;
        fill.style.width = pct + '%';
        fill.className = 'progress-fill ' + (pct >= 100 ? 'progress-red' : pct >= 80 ? 'progress-yellow' : 'progress-green');
      });
      const remaining = total - totalSpent;
      const remEl = document.getElementById('remaining');
      remEl.textContent = '¥' + remaining.toLocaleString();
      remEl.style.color = remaining < 0 ? 'var(--danger)' : remaining < total * 0.1 ? 'var(--warning)' : 'var(--primary)';
      const statusEl = document.getElementById('status');
      if (remaining < 0) statusEl.innerHTML = '<span style="color:var(--danger)">⚠️ 已超支 ¥' + Math.abs(remaining).toLocaleString() + '</span>';
      else if (totalSpent > total * 0.9) statusEl.innerHTML = '<span style="color:var(--warning)">⚠️ 预算即将用完</span>';
      else statusEl.innerHTML = '<span style="color:var(--primary)">✅ 预算充足</span>';
    }

    document.addEventListener('DOMContentLoaded', updateDisplay);
  </script>
</body>
</html>
