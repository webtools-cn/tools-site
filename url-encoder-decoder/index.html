          <button data-sample="https://example.com/search?q=你好世界&lang=zh">中文URL</button>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      var modeTabs = document.querySelectorAll('.mode-tab');
      var inputText = document.getElementById('inputText');
      var outputText = document.getElementById('outputText');
      var btnProcess = document.getElementById('btnProcess');
      var btnClear = document.getElementById('btnClear');
      var btnSwap = document.getElementById('btnSwap');
      var btnPaste = document.getElementById('btnPaste');
      var btnSample = document.getElementById('btnSample');
      var btnCopy = document.getElementById('btnCopy');
      var btnDownload = document.getElementById('btnDownload');
      var optFullUri = document.getElementById('optFullUri');
      var charCount = document.getElementById('charCount');
      var inputLabel = document.getElementById('inputLabel');
      var outputLabel = document.getElementById('outputLabel');
      var exampleBar = document.getElementById('exampleBar');
      var sampleButtons = document.querySelectorAll('[data-sample]');
      var toast = document.getElementById('toast');

      var currentMode = 'encode';
      var toastTimer = null;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
      }

      function updateCharCount() {
        charCount.textContent = inputText.value.length;
      }

      function setMode(mode) {
        currentMode = mode;
        modeTabs.forEach(function(t) { t.classList.toggle('active', t.dataset.mode === mode); });
        if (mode === 'encode') {
          inputLabel.textContent = '📥 输入原始文本';
          outputLabel.textContent = '📤 编码结果';
          btnProcess.textContent = '🔒 URL编码';
          inputText.placeholder = '在此输入需要URL编码的文本...';
          optFullUri.parentElement.style.display = '';
        } else {
          inputLabel.textContent = '📥 输入编码后文本';
          outputLabel.textContent = '📤 解码结果';
          btnProcess.textContent = '🔓 URL解码';
          inputText.placeholder = '在此输入需要URL解码的文本...';
          optFullUri.parentElement.style.display = 'none';
        }
        outputText.value = '';
        updateCharCount();
      }

      function processText() {
        var input = inputText.value;
        if (!input) {
          outputText.value = '';
          showToast('请输入文本后再转换');
          return;
        }
        try {
          var result;
          if (currentMode === 'encode') {
            if (optFullUri.checked) {
              result = encodeURI(input);
            } else {
              result = encodeURIComponent(input);
            }
          } else {
            // Try both decode methods
            try {
              result = decodeURIComponent(input);
            } catch(e1) {
              try {
                result = decodeURI(input);
              } catch(e2) {
                throw new Error('解码失败：输入不是有效的URL编码文本');
              }
            }
          }
          outputText.value = result;
          showToast(currentMode === 'encode' ? '✅ URL编码完成' : '✅ URL解码完成');
        } catch(e) {
          outputText.value = '';
          showToast('❌ ' + e.message);
        }
      }

      function clearAll() {
        inputText.value = '';
        outputText.value = '';
        updateCharCount();
      }

      function swapTexts() {
        var tmp = inputText.value;
        inputText.value = outputText.value;
        outputText.value = '';
        updateCharCount();
        showToast('已交换输入和输出');
      }

      function copyOutput() {
        if (!outputText.value) {
          showToast('没有结果可复制');
          return;
        }
        navigator.clipboard.writeText(outputText.value).then(function() {
          showToast('✅ 结果已复制到剪贴板');
        }).catch(function() {
          showToast('❌ 复制失败，请手动选择复制');
        });
      }

      function downloadOutput() {
        if (!outputText.value) {
          showToast('没有结果可下载');
          return;
        }
        var blob = new Blob([outputText.value], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = currentMode === 'encode' ? 'url-encoded.txt' : 'url-decoded.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('💾 已下载结果文件');
      }

      function pasteFromClipboard() {
        navigator.clipboard.readText().then(function(clipText) {
          inputText.value = clipText;
          updateCharCount();
          showToast('📋 已从剪贴板粘贴');
        }).catch(function() {
          showToast('❌ 无法访问剪贴板，请手动粘贴');
        });
      }

      function toggleExampleBar() {
        var isVisible = exampleBar.style.display !== 'none';
        exampleBar.style.display = isVisible ? 'none' : 'flex';
      }

      // Event bindings
      modeTabs.forEach(function(tab) {
        tab.addEventListener('click', function() { setMode(tab.dataset.mode); });
      });

      btnProcess.addEventListener('click', processText);
      btnClear.addEventListener('click', clearAll);
      btnSwap.addEventListener('click', swapTexts);
      btnCopy.addEventListener('click', copyOutput);
      btnDownload.addEventListener('click', downloadOutput);
      btnPaste.addEventListener('click', pasteFromClipboard);
      btnSample.addEventListener('click', toggleExampleBar);

      sampleButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          inputText.value = btn.dataset.sample;
          updateCharCount();
          showToast('💡 已加载示例');
        });
      });

      inputText.addEventListener('input', updateCharCount);

      // Keyboard shortcut
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          processText();
        }
      });
    })();
  </script>
