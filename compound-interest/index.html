<main>
  <h1>📈 复利计算器</h1>
  <p class="subtitle">计算投资复利增长，支持年/月/日复利</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>💰 初始本金（元）</label><input type="number" id="principal" value="10000" min="0" step="0.01"></div>
      <div class="form-group"><label>📅 每月定投（元）</label><input type="number" id="monthly" value="0" min="0" step="0.01"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>📊 年化收益率 (%)</label><input type="number" id="rate" value="5" min="0" max="100" step="0.1"></div>
      <div class="form-group"><label>⏱️ 投资年限</label><input type="number" id="years" value="10" min="1" max="100"></div>
    </div>
    <div class="form-group"><label>🔄 复利频率</label><select id="frequency"><option value="1">年复利</option><option value="12" selected>月复利</option><option value="365">日复利</option></select></div>
    <button class="btn" id="btnCalc">🧮 计算收益</button>
    <div class="result" id="result" style="display:none">
      <div>最终价值</div>

<script>
document.getElementById('btnCalc').addEventListener('click',()=>{
  const P=parseFloat(document.getElementById('principal').value)||0;
  const M=parseFloat(document.getElementById('monthly').value)||0;
  const r=parseFloat(document.getElementById('rate').value)/100;
  const t=parseInt(document.getElementById('years').value);
  const n=parseInt(document.getElementById('frequency').value);
  const rn=r/n;
  const nt=n*t;
  let fv=P*Math.pow(1+rn,nt);
  if(M>0&&n===12){
    for(let i=0;i<t*12;i++)fv+=M*Math.pow(1+rn,nt-i*(n/12));
  }else if(M>0){
    const mr=r/12;const mt=t*12;
    for(let i=0;i<mt;i++)fv+=M*Math.pow(1+mr,mt-i);
  }
  const totalInvested=P+M*t*12;
  const profit=fv-totalInvested;
  document.getElementById('finalAmount').textContent='¥'+fv.toFixed(2);
  document.getElementById('detail').innerHTML=`投入本金：¥${totalInvested.toFixed(2)} | 收益：¥${profit.toFixed(2)}<br>总回报率：${((fv/totalInvested-1)*100).toFixed(1)}% | 年化收益率：${r*100}%`;
  document.getElementById('result').style.display='block';
});
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
