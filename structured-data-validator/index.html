<script>
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}
function clearAll(){
  document.getElementById('jsonInput').value='';
  document.getElementById('result').style.display='none';
  document.getElementById('jsonInput').focus();
}
function validateSD(){
  var input=document.getElementById('jsonInput').value.trim();
  var resultEl=document.getElementById('result');
  var contentEl=document.getElementById('resultContent');
  if(!input){showToast('请粘贴JSON-LD代码');return;}
  var issues=[];
  try{
    var data=JSON.parse(input);
    if(!data['@context']||data['@context']!=='https://schema.org')issues.push('缺少或无效的 @context（应为 https://schema.org）');
    if(!data['@type'])issues.push('缺少 @type 字段');
    else{
      var knownTypes=['Article','Product','FAQPage','BreadcrumbList','HowTo','LocalBusiness','Organization','Person','WebSite','WebPage','Recipe','Review','Event','VideoObject','ImageObject','SoftwareApplication','Book','Course','JobPosting','NewsArticle','BlogPosting','Service','CreativeWork'];
      if(knownTypes.indexOf(data['@type'])===-1)issues.push('@type "'+data['@type']+'" 不在常见Schema类型列表中');
    }
    if(issues.length===0){
      contentEl.innerHTML='<p style="color:#22c55e;font-weight:600">✅ JSON-LD 格式正确！</p><p style="margin-top:8px;color:var(--text-secondary)">@type: '+data['@type']+'</p><p style="color:var(--text-secondary)">请使用 <a href="https://search.google.com/test/rich-results" target="_blank" style="color:var(--primary)">Google Rich Results Test</a> 进行最终验证。</p>';
    }else{
      contentEl.innerHTML='<p style="color:#ef4444;font-weight:600">⚠️ 发现 '+issues.length+' 个问题：</p><ul style="margin-top:8px;padding-left:20px;color:var(--text-secondary)">'+issues.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><p style="margin-top:12px;color:var(--text-secondary)">JSON 语法本身是有效的，但可能缺少Schema.org必要的字段。</p>';
    }
  }catch(e){
    contentEl.innerHTML='<p style="color:#ef4444;font-weight:600">❌ JSON 语法错误</p><p style="margin-top:8px;color:var(--text-secondary)">'+e.message+'</p>';
  }
  resultEl.style.display='block';
  // Copy to clipboard
  navigator.clipboard.writeText(input).then(function(){});
}
</script>
