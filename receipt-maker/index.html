  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:900px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    h2{font-size:1.25rem;font-weight:600;margin-bottom:16px;color:var(--primary-dark)}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text-light)}
    input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row>*{flex:1;min-width:120px}
    table{width:100%;border-collapse:collapse;margin:16px 0}
    th{background:#f1f5f9;padding:10px;text-align:left;font-size:.85rem;font-weight:600}
    td{padding:10px;border-bottom:1px solid var(--border);font-size:.9rem}
    td input{border:none;background:transparent;width:100%;padding:6px 4px;font-size:.9rem}
    td input:focus{outline:none;background:#eef2ff}
    .item-total{font-weight:600;text-align:right}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn-secondary{background:#e2e8f0;color:var(--text)}
    .btn-secondary:hover{background:#cbd5e1}
    .btn-danger{background:#fee2e2;color:#dc2626}
    .btn-danger:hover{background:#fecaca}
    .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .receipt-preview{background:#fff;border:2px dashed #cbd5e1;border-radius:12px;padding:32px;margin-top:20px;font-family:'Courier New',monospace;max-width:400px;margin-left:auto;margin-right:auto}
    .receipt-preview h3{text-align:center;font-size:1.1rem;margin-bottom:8px}
    .receipt-preview .store{text-align:center;font-size:.85rem;color:#64748b;margin-bottom:12px}
    .receipt-preview .divider{border-top:1px dashed #94a3b8;margin:10px 0}
    .receipt-preview .item-row{display:flex;justify-content:space-between;font-size:.85rem;margin:4px 0}
    .receipt-preview .total{font-weight:700;font-size:1rem;margin-top:8px}
    .receipt-preview .footer-text{text-align:center;font-size:.8rem;color:#94a3b8;margin-top:12px}
    @media(max-width:600px){
      .receipt-preview{padding:20px}
      .row>*{min-width:100%}
    }
    footer{text-align:center;padding:20px;color:var(--text-light);font-size:.85rem}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:9999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
  @media(max-width:640px){h1{font-size:1.2rem;word-break:break-word}.header{flex-direction:column;gap:8px}}</style>
<link rel="alternate" hreflang="zh" href="https://free-toolbase.com/receipt-maker/"><link rel="alternate" hreflang="en" href="https://free-toolbase.com/en/receipt-maker/"><link rel="alternate" hreflang="x-default" href="https://free-toolbase.com/en/receipt-maker/"><link rel="canonical" href="https://free-toolbase.com/receipt-maker/"></head>
<body>
  <header>
    <h1>🧾 收据生成器</h1>
    <p>快速生成专业收据，免费下载打印</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>📋 商家信息</h2>
      <div class="form-group"><label>商家名称</label><input type="text" id="storeName" placeholder="输入商家名称" value="XX商店"></div>
      <div class="row">
        <div class="form-group"><label>联系电话</label><input type="text" id="storePhone" placeholder="010-12345678"></div>
        <div class="form-group"><label>地址</label><input type="text" id="storeAddr" placeholder="北京市朝阳区"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>收据编号</label><input type="text" id="receiptNo" placeholder="REC-20240001"></div>
        <div class="form-group"><label>日期</label><input type="date" id="receiptDate"></div>
      </div>
    </div>
    <div class="card">
      <h2>🛒 商品明细</h2>
      <table>
        <thead><tr><th>商品名称</th><th style="width:80px">数量</th><th style="width:100px">单价(¥)</th><th style="width:100px">小计</th><th></th></tr></thead>
        <tbody id="itemsBody">
          <tr><td><input type="text" placeholder="商品名称" value="商品A"></td><td><input type="number" value="1" min="1" style="width:70px" onchange="updateTotals()"></td><td><input type="number" value="99.00" step="0.01" style="width:90px" onchange="updateTotals()"></td><td class="item-total">99.00</td><td><button class="btn btn-danger" style="padding:4px 8px;font-size:.8rem" onclick="removeItem(this)">✕</button></td></tr>
        </tbody>
      </table>
      <button class="btn btn-secondary" onclick="addItem()" style="margin-top:8px">+ 添加商品</button>
      <div class="row" style="margin-top:16px">
        <div class="form-group"><label>税率(%)</label><input type="number" id="taxRate" value="0" min="0" max="100" onchange="updateTotals()"></div>
        <div class="form-group"><label>折扣(¥)</label><input type="number" id="discount" value="0" min="0" step="0.01" onchange="updateTotals()"></div>
      </div>
      <div style="text-align:right;margin-top:12px;font-size:1.1rem;font-weight:600">合计: ¥<span id="grandTotal">99.00</span></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="printReceipt()">🖨️ 打印收据</button>
      <button class="btn btn-secondary" onclick="downloadReceipt()">⬇️ 下载图片</button>
    </div>
    <div class="receipt-preview" id="receiptPreview">
      <h3 id="previewStore">XX商店</h3>
      <div class="store" id="previewInfo"></div>
      <div class="divider"></div>
      <div id="previewItems"></div>
      <div class="divider"></div>
      <div class="item-row"><span>小计</span><span id="previewSubtotal">99.00</span></div>
      <div class="item-row" id="previewTaxRow" style="display:none"><span>税费</span><span id="previewTax">0.00</span></div>
      <div class="item-row" id="previewDiscountRow" style="display:none"><span>折扣</span><span id="previewDiscount">0.00</span></div>
      <div class="item-row total"><span>合计</span><span id="previewTotal">99.00</span></div>
      <div class="footer-text">感谢您的惠顾！</div>
    </div>
  </div>
  <footer>Free ToolBase - 免费在线工具</footer>
  <div class="toast" id="toast"></div>
  <script>
    document.getElementById('receiptDate').valueAsDate = new Date();
    function addItem(){
      const tbody = document.getElementById('itemsBody');
      const row = document.createElement('tr');
      row.innerHTML = `<td><input type="text" placeholder="商品名称"></td><td><input type="number" value="1" min="1" style="width:70px" onchange="updateTotals()"></td><td><input type="number" value="0.00" step="0.01" style="width:90px" onchange="updateTotals()"></td><td class="item-total">0.00</td><td><button class="btn btn-danger" style="padding:4px 8px;font-size:.8rem" onclick="removeItem(this)">✕</button></td>`;
      tbody.appendChild(row);
      updateTotals();
    }
    function removeItem(btn){btn.closest('tr').remove();updateTotals();}
    function updateTotals(){
      let subtotal = 0;
      document.querySelectorAll('#itemsBody tr').forEach(row=>{
        const qty = parseFloat(row.cells[1].querySelector('input').value)||0;
        const price = parseFloat(row.cells[2].querySelector('input').value)||0;
        const itemTotal = qty * price;
        row.cells[3].textContent = itemTotal.toFixed(2);
        subtotal += itemTotal;
      });
      const tax = parseFloat(document.getElementById('taxRate').value)||0;
      const discount = parseFloat(document.getElementById('discount').value)||0;
      const taxAmt = subtotal * (tax/100);
      const total = subtotal + taxAmt - discount;
      document.getElementById('grandTotal').textContent = total.toFixed(2);
      document.getElementById('previewSubtotal').textContent = subtotal.toFixed(2);
      document.getElementById('previewTotal').textContent = total.toFixed(2);
      const taxRow = document.getElementById('previewTaxRow');
      const discRow = document.getElementById('previewDiscountRow');
      taxRow.style.display = tax>0?'flex':'none';
      discRow.style.display = discount>0?'flex':'none';
      if(tax>0)document.getElementById('previewTax').textContent=taxAmt.toFixed(2);
      if(discount>0)document.getElementById('previewDiscount').textContent=discount.toFixed(2);
      document.getElementById('previewStore').textContent = document.getElementById('storeName').value||'XX商店';
      document.getElementById('previewInfo').textContent = [document.getElementById('storePhone').value,document.getElementById('storeAddr').value,`No:${document.getElementById('receiptNo').value}`,`日期:${document.getElementById('receiptDate').value}`].filter(Boolean).join(' | ');
    }
    function printReceipt(){
      const preview = document.getElementById('receiptPreview');
      const orig = document.body.innerHTML;
      document.body.innerHTML = preview.outerHTML;
      window.print();
      document.body.innerHTML = orig;
      location.reload();
    }
    function downloadReceipt(){
      import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(({default:html2canvas})=>{
        html2canvas(document.getElementById('receiptPreview'),{scale:2}).then(canvas=>{
          const link=document.createElement('a');link.download='receipt.png';link.href=canvas.toDataURL();link.click();
        });
      }).catch(()=>{
        const toast=document.getElementById('toast');toast.textContent='下载失败，请使用打印功能';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);
      });
    }
    document.getElementById('storeName').addEventListener('input',updateTotals);
    document.getElementById('storePhone').addEventListener('input',updateTotals);
    document.getElementById('storeAddr').addEventListener('input',updateTotals);
    document.getElementById('receiptNo').addEventListener('input',updateTotals);
    document.getElementById('receiptDate').addEventListener('change',updateTotals);
  </script>
</body>
</html>
