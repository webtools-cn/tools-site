<header><a href="/">← 返回首页</a></header>
<main>
  <h1>🤖 Robots.txt测试器</h1>
  <p class="subtitle">获取并分析网站的robots.txt，测试URL是否允许爬取</p>
  <div class="card">
    <label for="url">网站URL</label>
    <input type="text" id="url" placeholder="例如: https://example.com">
    <button class="btn" id="fetchBtn">📥 获取 robots.txt</button>

  </div>
  <div class="card">
    <h3>🧪 测试URL</h3>

      <div>
        <label for="testPath">测试路径</label>
        <input type="text" id="testPath" placeholder="/admin/ 或 /page.html">
      </div>
      <div>
        <label for="ua">爬虫User-Agent</label>
        <select id="ua">
          <option value="Googlebot">Googlebot</option>
          <option value="Bingbot">Bingbot</option>
          <option value="Baiduspider">Baiduspider</option>
          <option value="Slurp">Yahoo Slurp</option>
          <option value="DuckDuckBot">DuckDuckBot</option>
          <option value="*">* (所有爬虫)</option>
        </select>
      </div>
    </div>
    <button class="btn" id="testBtn">🧪 测试</button>

  </div>
</main>

<div id="toast"></div>
<script>
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

var robotsText = '';
var baseUrl = '';

document.getElementById('fetchBtn').addEventListener('click', async function() {
  var url = document.getElementById('url').value.trim();
  if (!url) { toast('请输入网站URL'); return; }
  if (!/^https?:\/\/.+/.test(url)) { url = 'https://' + url; document.getElementById('url').value = url; }
  baseUrl = url.replace(/\/$/, '');
  try {
    var resp = await fetch(baseUrl + '/robots.txt', { mode: 'cors' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    robotsText = await resp.text();
    document.getElementById('robotsDisplay').innerHTML = '<p style="color:var(--success);margin-top:8px;">✅ 已获取 robots.txt (' + (robotsText.length/1024).toFixed(1) + ' KB)</p><div class="robots-content">' + robotsText.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
  } catch(e) {
    document.getElementById('robotsDisplay').innerHTML = '<p style="color:var(--error);margin-top:8px;">❌ 获取失败: ' + e.message + '</p><p style="font-size:.85rem;color:var(--text-secondary)">可能原因：网站无robots.txt / 跨域限制</p>';
    robotsText = '';
  }
});

function parseRobots(text) {
  var rules = {};
  var currentAgents = [];
  text.split('\n').forEach(function(line) {
    line = line.replace(/#.*/, '').trim();
    if (!line) return;
    var parts = line.split(':');
    if (parts.length < 2) return;
    var key = parts[0].trim().toLowerCase();
    var value = parts.slice(1).join(':').trim();
    if (key === 'user-agent') {
      currentAgents = [value.toLowerCase()];
      if (!rules[value.toLowerCase()]) rules[value.toLowerCase()] = { allow: [], disallow: [] };
    } else if (key === 'allow') {
      currentAgents.forEach(function(ua) {
        if (rules[ua]) rules[ua].allow.push(value);
      });
    } else if (key === 'disallow') {
      currentAgents.forEach(function(ua) {
        if (rules[ua]) rules[ua].disallow.push(value);
      });
    }
  });
  return rules;
}

function matchRule(path, patterns) {
  for (var i = 0; i < patterns.length; i++) {
    var p = patterns[i];
    if (!p) continue;
    // Simple wildcard matching
    var regex = p.replace(/\./g, '\\.').replace(/\*/g, '.*').replace(/\$$/, '');
    if (new RegExp('^' + regex).test(path)) return true;
  }
  return false;
}

document.getElementById('testBtn').addEventListener('click', function() {
  var path = document.getElementById('testPath').value.trim();
  var ua = document.getElementById('ua').value;
  if (!robotsText) { toast('请先获取 robots.txt'); return; }
  if (!path) { toast('请输入测试路径'); return; }
  if (!path.startsWith('/')) path = '/' + path;

  var rules = parseRobots(robotsText);
  var uaKey = ua.toLowerCase();
  // Fallback to wildcard
  var agentRules = rules[uaKey] || rules['*'] || { allow: [], disallow: [] };

  var isDisallowed = matchRule(path, agentRules.disallow);
  var isAllowed = matchRule(path, agentRules.allow);

  // Allow takes precedence in most implementations
  if (isAllowed && isDisallowed) {
    document.getElementById('testResult').innerHTML = '<p class="status-allow">✅ 允许爬取 (Allow规则优先，覆盖了Disallow)</p><p style="font-size:.85rem">路径: ' + path + ' | UA: ' + ua + '</p>';
  } else if (isDisallowed) {
    document.getElementById('testResult').innerHTML = '<p class="status-disallow">🚫 禁止爬取</p><p style="font-size:.85rem">路径: ' + path + ' | UA: ' + ua + '</p>';
  } else {
    document.getElementById('testResult').innerHTML = '<p class="status-allow">✅ 允许爬取 (无匹配的Disallow规则)</p><p style="font-size:.85rem">路径: ' + path + ' | UA: ' + ua + '</p>';
  }
});
</script>
