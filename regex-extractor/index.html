<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正则提取器 - Free ToolBase</title>
  <meta name="description" content="在线正则表达式提取器，使用正则从文本中提取匹配内容。支持全局匹配、捕获组、常用模板，实时预览提取结果。">
  <meta property="og:title" content="正则提取器 - Free ToolBase">
  <meta property="og:description" content="在线正则提取器，从文本中快速提取匹配的邮箱、URL、数字等内容。">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "正则提取器",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "description": "在线正则表达式提取器，使用正则从文本中提取匹配内容。",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <style>
  :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --error: #ef4444; --success: #22c55e; --radius: 8px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--text-secondary); text-decoration: none; font-size: .9rem; }
  header nav a:hover { color: var(--primary); }
  main { flex: 1; max-width: 960px; margin: 0 auto; padding: 24px 16px; width: 100%; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: var(--text-secondary); margin-bottom: 16px; font-size: .9rem; }
  .control-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .control-row input { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .85rem; font-family: monospace; }
  .control-row input:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
  .control-row label { font-size: .8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .split-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .split-panel { grid-template-columns: 1fr; } }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .panel h3 { font-size: .85rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  textarea { width: 100%; min-height: 180px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-family: 'Fira Code', monospace; font-size: .82rem; resize: vertical; line-height: 1.5; }
  textarea:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
  #outputArea { background: #f1f5f9; min-height: 180px; }
  .templates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .templates button { font-size: .72rem; padding: 3px 10px; background: #eef2ff; color: var(--primary); border: 1px solid #c7d2fe; border-radius: 20px; cursor: pointer; }
  .templates button:hover { background: #e0e7ff; }
  .btn { padding: 10px 20px; border: none; border-radius: var(--radius); font-size: .9rem; cursor: pointer; font-weight: 600; transition: all .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .match-count { font-size: .8rem; color: var(--text-secondary); margin-top: 6px; }
  .match-item { padding: 4px 8px; margin: 2px 0; background: #f0fdf4; border-left: 3px solid var(--success); border-radius: 0 4px 4px 0; font-family: monospace; font-size: .82rem; word-break: break-all; }
  footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 16px 24px; text-align: center; color: var(--text-secondary); font-size: .8rem; }
  footer a { color: var(--primary); text-decoration: none; }
  #toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: .85rem; opacity: 0; transform: translateY(20px); transition: all .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--error); }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Free ToolBase</a>
    <nav>
      <a href="/">首页</a>
      <a href="/en/">English</a>
    </nav>
  </header>
  <main>
    <h1>正则提取器</h1>
    <p class="subtitle">使用正则表达式从文本中提取匹配内容。支持全局匹配、捕获组、忽略大小写等选项。</p>
    <div class="control-row">
      <input type="text" id="regexInput" placeholder="正则表达式，如: [\w.-]+@[\w.-]+\.\w+" value="[\w.-]+@[\w.-]+\.\w+">
      <label><input type="checkbox" id="globalFlag" checked> 全局</label>
      <label><input type="checkbox" id="caseFlag"> 忽略大小写</label>
      <label><input type="checkbox" id="multiFlag"> 多行</label>
      <button class="btn btn-primary" id="extractBtn">提取</button>
      <button class="btn btn-secondary" id="copyBtn">复制结果</button>
    </div>
    <div class="split-panel">
      <div class="panel">
        <h3>输入文本</h3>
        <textarea id="inputText" placeholder="粘贴要提取的文本...">联系我们: support@example.com, sales@company.org
网站: https://www.example.com
电话: 138-0000-1234, 139-1111-5678
日期: 2024-01-15, 2024-12-31
价格: ¥99.99, $49.50, €29.00</textarea>
        <div class="templates">
          <span style="font-size:.72rem;color:var(--text-secondary)">模板:</span>
          <button onclick="setTemplate('[\\w.-]+@[\\w.-]+\\.\\w+')">邮箱</button>
          <button onclick="setTemplate('https?://[^\\s]+')">URL</button>
          <button onclick="setTemplate('\\d{4}-\\d{2}-\\d{2}')">日期</button>
          <button onclick="setTemplate('1[3-9]\\d{9}')">手机号</button>
          <button onclick="setTemplate('\\d+\\.\\d+')">小数</button>
          <button onclick="setTemplate('[¥$€]\\d+\\.?\\d*')">价格</button>
        </div>
      </div>
      <div class="panel">
        <h3>提取结果</h3>
        <textarea id="outputArea" readonly placeholder="匹配结果将显示在这里..."></textarea>
        <div class="match-count" id="matchCount"></div>
      </div>
    </div>
  </main>
  <footer>
    <p>Free ToolBase &copy; 2025 · <a href="/">返回首页</a></p>
  </footer>
  <div id="toast"></div>
  <script>
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error show' : 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }
  function extractMatches() {
    var text = document.getElementById('inputText').value;
    var regexStr = document.getElementById('regexInput').value.trim();
    var global = document.getElementById('globalFlag').checked;
    var caseInsensitive = document.getElementById('caseFlag').checked;
    var multiline = document.getElementById('multiFlag').checked;
    var output = document.getElementById('outputArea');
    if (!text) { output.value = ''; showToast('请输入文本', true); return; }
    if (!regexStr) { output.value = ''; showToast('请输入正则表达式', true); return; }
    try {
      var flags = '';
      if (global) flags += 'g';
      if (caseInsensitive) flags += 'i';
      if (multiline) flags += 'm';
      var re = new RegExp(regexStr, flags);
      var matches = [];
      var m;
      while ((m = re.exec(text)) !== null) {
        matches.push(m[0]);
        if (!global) break;
      }
      if (matches.length === 0) {
        output.value = '未找到匹配项';
        document.getElementById('matchCount').textContent = '';
      } else {
        output.value = matches.join('\n');
        document.getElementById('matchCount').textContent = '共匹配 ' + matches.length + ' 项';
      }
    } catch(e) {
      output.value = '';
      document.getElementById('matchCount').textContent = '';
      showToast('正则表达式错误: ' + e.message, true);
    }
  }
  function setTemplate(regex) {
    document.getElementById('regexInput').value = regex;
    extractMatches();
  }
  document.getElementById('extractBtn').addEventListener('click', extractMatches);
  document.getElementById('regexInput').addEventListener('input', extractMatches);
  document.getElementById('inputText').addEventListener('input', extractMatches);
  document.getElementById('globalFlag').addEventListener('change', extractMatches);
  document.getElementById('caseFlag').addEventListener('change', extractMatches);
  document.getElementById('multiFlag').addEventListener('change', extractMatches);
  document.getElementById('copyBtn').addEventListener('click', function() {
    var output = document.getElementById('outputArea');
    if (!output.value || output.value === '未找到匹配项') { showToast('没有可复制的内容', true); return; }
    output.select();
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  });
  extractMatches();
  </script>
</body>
</html>
