<script>
(function(){
var el=function(id){return document.getElementById(id);};
var toastTimer=null;
function showToast(msg){var t=el('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.opacity='0';},2000);}
function fm(n){return parseFloat(n)||0;}
function fmt(n,d){d=d||2;return fm(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtCur(n){return '$'+fm(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(n){return fm(n).toFixed(2)+'%';}

// Tool-specific logic injected below

// Cooking Measurement Converter
var densityTable={'flour':120,'sugar':200,'butter':227,'water':240,'milk':245,'oil':220,'rice':200,'honey':340,'salt':288,'baking-powder':192};

var inputHTML='<div class="form-group"><label>🥘 食材类型</label><select id="ingredient"><option value="flour">面粉 Flour (120g/杯)</option><option value="sugar">白糖 Sugar (200g/杯)</option><option value="butter">黄油 Butter (227g/杯)</option><option value="water">水 Water (240g/杯)</option><option value="milk">牛奶 Milk (245g/杯)</option><option value="oil">食用油 Oil (220g/杯)</option><option value="rice">大米 Rice (200g/杯)</option><option value="honey">蜂蜜 Honey (340g/杯)</option><option value="salt">盐 Salt (288g/杯)</option><option value="baking-powder">泡打粉 Baking Powder (192g/杯)</option><option value="custom">自定义密度</option></select></div>';
inputHTML+='<div class="form-group" id="customDensityGroup" style="display:none"><label>⚖️ 自定义密度 (g/杯)</label><input type="number" id="customDensity" placeholder="如：150" min="1" step="1" value="150"></div>';
inputHTML+='<div class="input-row"><div class="form-group"><label>🔢 数量</label><input type="number" id="amount" placeholder="如：2" min="0" step="0.01" value="1"></div><div class="form-group"><label>📏 原单位</label><select id="fromUnit"><option value="cup">杯 (cup)</option><option value="tbsp">汤匙 (tbsp)</option><option value="tsp">茶匙 (tsp)</option><option value="ml">毫升 (ml)</option><option value="l">升 (L)</option><option value="oz">盎司 (oz)</option><option value="lb">磅 (lb)</option><option value="g">克 (g)</option><option value="kg">千克 (kg)</option></select></div></div>';
inputHTML+='<div class="form-group"><label>🎯 目标单位</label><select id="toUnit"><option value="cup">杯 (cup)</option><option value="tbsp">汤匙 (tbsp)</option><option value="tsp">茶匙 (tsp)</option><option value="ml">毫升 (ml)</option><option value="l">升 (L)</option><option value="oz">盎司 (oz)</option><option value="lb">磅 (lb)</option><option value="g" selected>克 (g)</option><option value="kg">千克 (kg)</option></select></div>';
el('inputFields').innerHTML=inputHTML;

el('ingredient').addEventListener('change',function(){
  el('customDensityGroup').style.display=this.value==='custom'?'block':'none';
});

function toGrams(amount,unit,densityPerCup){
  var cupToMl=240;
  switch(unit){
    case 'cup':return amount*densityPerCup;
    case 'tbsp':return amount*densityPerCup/16;
    case 'tsp':return amount*densityPerCup/48;
    case 'ml':return amount*densityPerCup/cupToMl;
    case 'l':return amount*densityPerCup*1000/cupToMl;
    case 'oz':return amount*28.3495;
    case 'lb':return amount*453.592;
    case 'g':return amount;
    case 'kg':return amount*1000;
    default:return amount;
  }
}

function fromGrams(grams,unit,densityPerCup){
  var cupToMl=240;
  switch(unit){
    case 'cup':return grams/densityPerCup;
    case 'tbsp':return grams/densityPerCup*16;
    case 'tsp':return grams/densityPerCup*48;
    case 'ml':return grams/densityPerCup*cupToMl;
    case 'l':return grams/densityPerCup*cupToMl/1000;
    case 'oz':return grams/28.3495;
    case 'lb':return grams/453.592;
    case 'g':return grams;
    case 'kg':return grams/1000;
    default:return grams;
  }
}

function calculate(){
  var ingredient=el('ingredient').value;
  var densityPerCup=ingredient==='custom'?fm(el('customDensity').value):densityTable[ingredient];
  var amount=fm(el('amount').value);
  var fromUnit=el('fromUnit').value;
  var toUnit=el('toUnit').value;
  
  var grams=toGrams(amount,fromUnit,densityPerCup);
  var result=fromGrams(grams,toUnit,densityPerCup);
  
  var unitLabels={'cup':'杯','tbsp':'汤匙','tsp':'茶匙','ml':'毫升','l':'升','oz':'盎司','lb':'磅','g':'克','kg':'千克'};
  var html='<div class="result-item"><span class="result-label">换算结果</span><span class="result-value" style="font-size:1.3rem;">'+fmt(result,4)+' '+unitLabels[toUnit]+'</span></div>';
  html+='<div class="result-item"><span class="result-label">原始值</span><span class="result-value">'+fmt(amount,2)+' '+unitLabels[fromUnit]+'</span></div>';
  html+='<div class="result-item"><span class="result-label">克重</span><span class="result-value">'+fmt(grams,1)+' 克</span></div>';
  el('resultContent').innerHTML=html;
  el('resultSection').style.display='block';
  
  el('explanationContent').innerHTML='<p style="color:#94a3b8;line-height:1.7;">📌 <b>换算逻辑</b>：所有单位先换算为克（通用中间单位），再从克换算到目标单位。体积单位（杯/汤匙/茶匙/毫升）的换算依赖于食材密度。<br>📌 <b>常用换算</b>：1杯=16汤匙=48茶匙=240毫升 | 1盎司≈28.35克 | 1磅≈453.6克<br>📌 <b>密度说明</b>：不同食材密度不同，例如1杯面粉≈120g，而1杯黄油≈227g。选择正确食材获得精确结果。</p>';
}


el('calcBtn').addEventListener('click',calculate);
el('clearBtn').addEventListener('click',function(){clearInputs();el('resultSection').style.display='none';el('explanationContent').innerHTML='';});
el('copyBtn').addEventListener('click',function(){
  var results=document.querySelectorAll('#resultContent .result-item');
  var text='烹饪计量换算器 - 计算结果\n';
  results.forEach(function(r){text+=r.querySelector('.result-label').textContent+': '+r.querySelector('.result-value').textContent+'\n';});
  navigator.clipboard.writeText(text).then(function(){showToast('结果已复制到剪贴板');}).catch(function(){showToast('复制失败，请手动复制');});
});

// Related tools
var relatedTools=[{icon:"🍽️",name:"卡路里计算器",url:"calorie-calculator/"},{icon:"⚖️",name:"BMI计算器",url:"bmi-calculator/"},{icon:"💧",name:"饮水量计算器",url:"water-intake-calculator/"},{icon:"🛒",name:"购物清单生成器",url:"shopping-list-generator/"}];
var rg=el('relatedGrid');
relatedTools.forEach(function(rt){var d=document.createElement('div');d.className='related-item';d.innerHTML='<a href="../'+rt.url+'">'+rt.icon+' '+rt.name+'</a>';rg.appendChild(d);});

function clearInputs(){var inputs=document.querySelectorAll('#inputSection input,#inputSection select');inputs.forEach(function(i){i.value='';});}
})();
</script>
