<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script>
(async () => {
  const res = await fetch('en/audio-panner/index.html');
  const html = await res.text();
  const f = document.createElement('iframe');
  f.style.width = '375px'; f.style.border = '0';
  f.srcdoc = html;
  document.body.appendChild(f);
  await new Promise(r => setTimeout(r, 900));
  const d = f.contentDocument;
  let worst = null;
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && (r.right > 375 || r.left < 0)) {
      const o = Math.max(r.right - 375, -r.left);
      if (!worst || o > worst.o) worst = {el, o, right: r.right, left: r.left, w: r.width};
    }
  });
  if (worst) {
    const el = worst.el;
    console.log('OVERFLOW el:', el.tagName, el.className || el.id, 'right=', worst.right, 'left=', worst.left, 'width=', worst.w);
    console.log('HTML:', (el.outerHTML || '').slice(0, 250));
  } else console.log('no overflow found');
})();
</script></body></html>
