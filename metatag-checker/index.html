<header><a href="/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/en/metatag-checker/">English</a></div></header>
<main>
  <h1>🔍 Meta标签检查器</h1>
  <p class="subtitle">粘贴HTML源码，检查SEO Meta标签是否完整</p>
  <div class="card">
    <div class="form-group"><label>粘贴HTML源码</label><textarea id="htmlInput" placeholder="<html><head>...</head></html>"></textarea></div>
    <button class="btn" id="btnCheck">🔍 分析Meta标签</button>
    <div id="results" style="display:none"></div>
    <div class="notice">💡 提示：在网页上右键 → 查看网页源代码，复制粘贴到这里分析。</div>
  </div>
</main>

<script>
var checks=[
  {name:'Title标签',tag:'<title>',key:'title',desc:'定义页面标题，显示在搜索结果和浏览器标签'},
  {name:'Meta Description',tag:'<meta name="description"',key:'description',desc:'搜索结果摘要，影响点击率'},
  {name:'Meta Keywords',tag:'<meta name="keywords"',key:'keywords',desc:'关键词（现代搜索引擎已不重视）'},
  {name:'Meta Robots',tag:'<meta name="robots"',key:'robots',desc:'控制搜索引擎索引行为'},
  {name:'Canonical URL',tag:'<link rel="canonical"',key:'canonical',desc:'指定页面的规范URL，防止重复内容'},
  {name:'OG Title',tag:'<meta property="og:title"',key:'og:title',desc:'社交分享时显示的标题'},
  {name:'OG Description',tag:'<meta property="og:description"',key:'og:description',desc:'社交分享时显示的描述'},
  {name:'OG Image',tag:'<meta property="og:image"',key:'og:image',desc:'社交分享时显示的缩略图'},
  {name:'OG URL',tag:'<meta property="og:url"',key:'og:url',desc:'社交分享时的规范URL'},
  {name:'Twitter Card',tag:'<meta name="twitter:card"',key:'twitter:card',desc:'Twitter分享卡片类型'},
  {name:'Viewport',tag:'<meta name="viewport"',key:'viewport',desc:'移动端视口设置'},
  {name:'Charset',tag:'<meta charset',key:'charset',desc:'字符编码声明'},
  {name:'Hreflang',tag:'<link rel="alternate" hreflang',key:'hreflang',desc:'多语言版本声明'}
];
document.getElementById('btnCheck').addEventListener('click',function(){
  var html=document.getElementById('htmlInput').value.trim();
  if(!html){alert('请粘贴HTML源码');return}
  var results=checks.map(function(c){
    var found=html.indexOf(c.tag)!==-1;
    var status=found?'ok':'miss';
    return {name:c.name,desc:c.desc,status:status,tag:c.tag};
  });
  var ok=results.filter(function(r){return r.status==='ok'}).length;
  var total=results.length;
  var pct=Math.round(ok/total*100);
  var scoreClass=pct>=80?'good':pct>=50?'warn':'bad';
  var html='<div style="text-align:center;margin-top:16px"><div class="score '+scoreClass+'">'+ok+'/'+total+'</div><div style="color:var(--sub);font-size:14px">Meta标签完整度 '+pct+'%</div></div>';
  html+='<table><tr><th>标签</th><th>状态</th><th>说明</th></tr>';
  results.forEach(function(r){
    var cls=r.status==='ok'?'ok':r.status==='miss'?'miss':'warn';
    var txt=r.status==='ok'?'✅ 存在':'❌ 缺失';
    html+='<tr><td><strong>'+r.name+'</strong></td><td><span class="tag '+cls+'">'+txt+'</span></td><td>'+r.desc+'</td></tr>';
  });
  html+='</table>';
  document.getElementById('results').innerHTML=html;
  document.getElementById('results').style.display='block';
});
</script>
