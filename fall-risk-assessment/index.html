<main>
  <h1>🩺 跌倒风险评估</h1>
  <p class="hero">基于CDC STEADI标准的跌倒风险评估。回答以下10个问题，了解您的跌倒风险等级并获得个性化建议。适用于65岁以上人群。</p>

      <button class="btn btn-primary" onclick="assess()">提交评估</button>

    </div>
  </div>

    <h2 style="font-size:18px;margin-bottom:12px;">📊 评估结果</h2>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3);"></div>

<script>
var questions = [
  "在过去一年中，您是否跌倒过？",
  "您是否感觉站立或行走时不稳定？",
  "您是否担心会跌倒？",
  "您是否需要用手臂支撑才能从椅子上站起来？",
  "您是否在跨过台阶或上楼梯时有困难？",
  "您是否经常感到脚部麻木或有刺痛感？",
  "您是否服用可能引起头晕或嗜睡的药物？",
  "您是否服用抗抑郁药、镇静剂或降压药？",
  "您是否需要频繁起夜上厕所？",
  "您的视力是否影响日常行走（即使戴眼镜）？"
];

var container = document.getElementById('questionsContainer');
for (var i = 0; i < questions.length; i++) {
  var div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = '<div class="q-text">' + (i+1) + '. ' + questions[i] + '</div>' +
    '<div class="radio-group">' +
    '<label><input type="radio" name="q' + i + '" value="1"> 是</label>' +
    '<label><input type="radio" name="q' + i + '" value="0"> 否</label>' +
    '</div>';
  container.appendChild(div);
}

function assess() {
  var score = 0;
  for (var i = 0; i < questions.length; i++) {
    var radios = document.getElementsByName('q' + i);
    for (var j = 0; j < radios.length; j++) {
      if (radios[j].checked && radios[j].value === '1') score++;
    }
  }

  var box = document.getElementById('resultBox');
  box.className = 'result-box';
  var level, color, suggestion;

  if (score <= 2) {
    box.className += ' risk-low';
    level = '✅ 低风险';
    suggestion = '您目前的跌倒风险较低。建议保持规律运动（如太极、散步），每年复查视力和用药情况。继续维持健康生活方式！';
  } else if (score <= 5) {
    box.className += ' risk-moderate';
    level = '⚠️ 中等风险';
    suggestion = '您的跌倒风险为中等。建议：1）咨询医生进行步态和平衡评估；2）检查家中安全隐患（地毯、照明）；3）考虑参加平衡训练课程。';
  } else {
    box.className += ' risk-high';
    level = '🔴 高风险';
    suggestion = '您的跌倒风险较高。强烈建议：1）尽快就医进行综合评估；2）检查用药并咨询药剂师；3）安装浴室扶手和夜灯；4）考虑使用助行器具。';
  }

  document.getElementById('resultScore').textContent = score + ' / ' + questions.length;
  document.getElementById('resultLevel').textContent = level;
  document.getElementById('resultSuggestion').textContent = suggestion;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});

  showToast('评估完成: ' + score + '分');
}

function resetAll() {
  var radios = document.querySelectorAll('input[type="radio"]');
  for (var i = 0; i < radios.length; i++) radios[i].checked = false;
  document.getElementById('resultCard').style.display = 'none';
  showToast('已重置');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}
</script>
</body>
