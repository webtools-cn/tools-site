<body>
<div class="container">
<div class="header"><h1>⏱️ 在线秒表计时器</h1><div class="lang-switch"><a href="../en/stopwatch-timer/" class="active">中文</a><a href="../en/stopwatch-timer/">EN</a></div></div>

<div class="hero"><p>免费在线秒表计时器，毫秒级精确计时。支持计次(Lap)记录、暂停/继续、导出计次列表。适合运动计时、演讲训练、实验计时等场景。 <span class="badge">⏱️ 无需注册</span></p></div>

<div class="panel">
  <div class="timer-display">
    <span class="timer-value" id="timerDisplay">00:00:00</span><span class="timer-ms" id="msDisplay">.000</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-start" id="startBtn">▶ 开始</button>
    <button class="btn btn-lap" id="lapBtn" disabled>🏁 计次</button>
    <button class="btn btn-reset" id="resetBtn">↺ 重置</button>
  </div>
</div>

<div class="panel" id="lapPanel" style="display:none">
  <div class="panel-title">📊 计次记录 <span style="font-weight:400;font-size:.8rem;color:#64748b" id="lapCount"></span></div>
  <div class="lap-list" id="lapList"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="copyLaps">📋 复制计次记录</button>
    <button class="btn btn-secondary" id="clearLaps">🗑️ 清除记录</button>
  </div>
</div>

     style="display:block"

<script>
var timerDisplay=document.getElementById('timerDisplay'),msDisplay=document.getElementById('msDisplay'),
  startBtn=document.getElementById('startBtn'),lapBtn=document.getElementById('lapBtn'),
  resetBtn=document.getElementById('resetBtn'),lapList=document.getElementById('lapList'),
  lapCount=document.getElementById('lapCount'),lapPanel=document.getElementById('lapPanel'),
  startTime=0,elapsed=0,timerId=null,running=false,laps=[];

function showToast(msg) {
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function formatTime(ms) {
  var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),
    s=Math.floor((ms%60000)/1000),millis=Math.floor(ms%1000);
  return {h:h,m:m,s:s,ms:millis,display:(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'),msDisplay:'.'+String(millis).padStart(3,'0')};
}

function updateDisplay() {
  var now=performance.now(),total=elapsed+(now-startTime);
  var f=formatTime(total);
  timerDisplay.textContent=f.display;
  msDisplay.textContent=f.msDisplay;
}

function startTimer() {
  if(running)return;
  running=true;startTime=performance.now();
  timerId=setInterval(updateDisplay,10);
  startBtn.textContent='⏸ 暂停';startBtn.className='btn btn-pause';
  lapBtn.disabled=false;resetBtn.disabled=false;
}

function pauseTimer() {
  if(!running)return;
  running=false;clearInterval(timerId);
  elapsed+=performance.now()-startTime;
  updateDisplay();
  startBtn.textContent='▶ 继续';startBtn.className='btn btn-start';
  lapBtn.disabled=true;
}

function resetTimer() {
  running=false;clearInterval(timerId);
  elapsed=0;startTime=0;laps=[];
  timerDisplay.textContent='00:00:00';msDisplay.textContent='.000';
  startBtn.textContent='▶ 开始';startBtn.className='btn btn-start';
  lapBtn.disabled=true;resetBtn.disabled=false;
  lapPanel.style.display='none';lapList.innerHTML='';
}

function addLap() {
  if(!running)return;
  var now=performance.now(),total=elapsed+(now-startTime);
  var prevTotal=laps.length>0?laps[laps.length-1].total:0;
  var split=total-prevTotal;
  laps.push({total:total,split:split});
  renderLaps();
  if(laps.length===1)lapPanel.style.display='block';
}

function renderLaps() {
  var html='';
  for(var i=laps.length-1;i>=0;i--){
    var lap=laps[i],tf=formatTime(lap.total),sf=formatTime(lap.split);
    html+='<div class="lap-item"><span class="lap-no">#'+(i+1)+'</span><span class="lap-time">'+tf.display+tf.msDisplay+'</span><span class="lap-split">+'+sf.display+sf.msDisplay+'</span></div>';
  }
  lapList.innerHTML=html;
  lapCount.textContent='（共'+laps.length+'次）';
}

function copyLaps() {
  if(laps.length===0){showToast('暂无计次记录');return;}
  var text='';
  for(var i=0;i<laps.length;i++){
    var tf=formatTime(laps[i].total),sf=formatTime(laps[i].split);
    text+='#'+(i+1)+'  '+tf.display+tf.msDisplay+'  (+'+sf.display+sf.msDisplay+')\n';
  }
  navigator.clipboard.writeText(text).then(function(){showToast('已复制'+laps.length+'条计次记录');});
}

startBtn.addEventListener('click',function(){
  if(running)pauseTimer();else startTimer();
});

lapBtn.addEventListener('click',addLap);

resetBtn.addEventListener('click',resetTimer);

document.getElementById('copyLaps').addEventListener('click',copyLaps);
document.getElementById('clearLaps').addEventListener('click',function(){
  laps=[];lapList.innerHTML='';lapCount.textContent='';lapPanel.style.display='none';
});

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();if(running){addLap();}else{startTimer();}}
  if(e.code==='KeyR'){e.preventDefault();resetTimer();}
});
</script>
</body>
