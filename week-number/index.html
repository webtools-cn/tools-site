<script>
function getISOWeek(d){
  const date=new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}
function getUSWeek(d){
  const date=new Date(d);
  const jan1=new Date(date.getFullYear(),0,1);
  return Math.ceil(((date-jan1)/86400000+jan1.getDay()+1)/7);
}
const today=new Date().toISOString().split('T')[0];
document.getElementById('dateInput').value=today;
function renderYearWeeks(){
  const y=new Date().getFullYear();
  const html=[];
  for(let w=1;w<=52;w++)html.push(`<span>W${w}</span>`);
  const curWeek=getISOWeek(new Date());
  html[curWeek-1]=`<span class="current">W${curWeek}</span>`;
  document.getElementById('yearWeeks').innerHTML=html.join('');
}
document.getElementById('btnCalc').addEventListener('click',()=>{
  const d=new Date(document.getElementById('dateInput').value);
  if(isNaN(d)){alert('请选择有效日期');return}
  const std=document.getElementById('standard').value;
  const wn=std==='iso'?getISOWeek(d):getUSWeek(d);
  document.getElementById('weekNum').textContent=wn;
  const dayNames=['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('detail').innerHTML=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${dayNames[d.getDay()]} | ${std==='iso'?'ISO 8601':'美国'}标准`;
  document.getElementById('result').style.display='block';
});
renderYearWeeks();
document.getElementById('btnCalc').click();
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
