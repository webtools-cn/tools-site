<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="图片灰度化 - 在线图片转黑白/灰度 | Free ToolBase">
  <meta property="og:description" content="在线图片灰度化工具，将彩色图片转为黑白或灰度效果。支持多种灰度算法，纯浏览器端处理。">
  <meta property="og:type" content="website">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "图片灰度化",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web",
    "description": "在线图片灰度化工具，将彩色图片转为黑白或灰度效果。"
  }
  </script>
  <style>
    :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; }
    header nav { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 24px; }
    header nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
    header nav a:hover { color: var(--primary); }
    header nav .logo { font-weight: 700; font-size: 18px; color: var(--primary); }
    main { max-width: 800px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .desc { color: var(--text-secondary); margin-bottom: 24px; }
    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 18px; margin-bottom: 16px; }
    .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover { border-color: var(--primary); }
    .upload-zone p { color: var(--text-secondary); }
    .preview-area { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
    .preview-box { flex: 1; min-width: 200px; text-align: center; }
    .preview-box img { max-width: 100%; max-height: 300px; border-radius: 4px; border: 1px solid var(--border); }
    .preview-box .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .algo-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .algo-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 13px; transition: all .2s; }
    .algo-btn.active { border-color: var(--primary); background: #eef2ff; color: var(--primary); font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .toast { position: fixed; top: 20px; right: 20px; background: #1e293b; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; z-index: 9999; opacity: 0; transform: translateY(-10px); transition: all .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #ef4444; }
    footer { text-align: center; padding: 32px 20px; color: var(--text-secondary); font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }
    @media (max-width: 375px) { main { padding: 16px 12px; } h1 { font-size: 22px; } .card { padding: 16px; } .preview-area { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">Free ToolBase</a>
      <a href="/">首页</a>
      <a href="/en/image-grayscale/">English</a>
    </nav>
  </header>
  <main>
    <h1>图片灰度化</h1>
    <p class="desc">将彩色图片转换为黑白或灰度效果。支持多种灰度算法，所有处理在浏览器本地完成。</p>
    <div class="card">
      <h2>📤 上传图片</h2>
      <div class="upload-zone" id="dropZone">
        <p>点击选择或拖拽图片到此处</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <div class="algo-row">
        <span style="font-size:13px;line-height:32px;">算法:</span>
        <button class="algo-btn active" data-algo="luminosity">亮度加权</button>
        <button class="algo-btn" data-algo="average">平均值</button>
        <button class="algo-btn" data-algo="lightness">明度</button>
        <button class="algo-btn" data-algo="single-r">红色通道</button>
      </div>
      <button class="btn btn-primary" id="convertBtn" disabled>生成灰度图</button>
      <button class="btn btn-primary" id="downloadBtn" style="display:none;margin-left:8px;">下载 PNG</button>
    </div>
    <div class="card" id="previewCard" style="display:none">
      <h2>👁️ 预览</h2>
      <div class="preview-area">
        <div class="preview-box">
          <div class="label">原图</div>
          <img id="previewOriginal" alt="原图">
        </div>
        <div class="preview-box">
          <div class="label">灰度图</div>
          <canvas id="previewCanvas" style="max-width:100%;max-height:300px;border-radius:4px;border:1px solid var(--border);"></canvas>
        </div>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 Free ToolBase · 免费在线工具</p></footer>
  <div class="toast" id="toast"></div>
  <script>
    let sourceImage = null, algo = 'luminosity', resultCanvas = null;

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'error' : '');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function applyGrayscale() {
      if (!sourceImage) return;
      const canvas = document.getElementById('previewCanvas');
      canvas.width = sourceImage.width;
      canvas.height = sourceImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceImage, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        let gray;
        switch (algo) {
          case 'average': gray = (r + g + b) / 3; break;
          case 'lightness': gray = (Math.max(r, g, b) + Math.min(r, g, b)) / 2; break;
          case 'single-r': gray = r; break;
          case 'luminosity':
          default: gray = 0.299 * r + 0.587 * g + 0.114 * b; break;
        }
        data[i] = data[i+1] = data[i+2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);
      resultCanvas = canvas;
      document.getElementById('downloadBtn').style.display = 'inline-flex';
    }

    function downloadResult() {
      if (!resultCanvas) return;
      const a = document.createElement('a');
      a.href = resultCanvas.toDataURL('image/png');
      a.download = 'grayscale.png';
      a.click();
      showToast('已下载！');
    }

    function loadImage(file) {
      if (file.size > 20 * 1024 * 1024) { showToast('图片不能超过20MB', true); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          document.getElementById('convertBtn').disabled = false;
          document.getElementById('previewOriginal').src = e.target.result;
          document.getElementById('previewCard').style.display = 'block';
          applyGrayscale();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });
    document.getElementById('dropZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--primary)'; });
    document.getElementById('dropZone').addEventListener('dragleave', e => { e.currentTarget.style.borderColor = 'var(--border)'; });
    document.getElementById('dropZone').addEventListener('drop', e => {
      e.preventDefault(); e.currentTarget.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
    });
    document.querySelectorAll('.algo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        algo = btn.dataset.algo;
        if (sourceImage) applyGrayscale();
      });
    });
    document.getElementById('convertBtn').addEventListener('click', applyGrayscale);
    document.getElementById('downloadBtn').addEventListener('click', downloadResult);
  </script>
</body>
</html>
