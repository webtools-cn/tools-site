<body>
<header>
  <h1>🥦 膳食纤维摄入计算器</h1>
  <a href="/">← 返回首页</a>
</header>
<main>
  <div class="card">
    <div class="form-row">
      <div class="form-group">
        <label>性别</label>
        <select id="gender">
          <option value="male" selected>男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="form-group">
        <label>年龄</label>
        <select id="age-group">
          <option value="child">儿童 (4-8岁)</option>
          <option value="teen">青少年 (9-18岁)</option>
          <option value="adult" selected>成人 (19-50岁)</option>
          <option value="senior">中老年 (51岁以上)</option>
        </select>
      </div>
      <div class="form-group">
        <label>每日热量摄入</label>
        <div class="input-with-suffix"><input type="number" id="calories" placeholder="2000" value="2000"><span class="suffix">千卡</span></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calculate()">📊 计算</button>
      <button class="btn-outline" onclick="clearForm()">🗑️ 重置</button>
    </div>
  </div>
  <div class="card" id="result-card" style="display:none">
    <h3 style="margin-bottom:12px;font-size:.95rem;color:var(--text-secondary)">每日纤维需求</h3>
    <div class="results" id="results"></div>
    <div class="tip-box" id="tip"></div>
    <h4 style="margin-top:16px;margin-bottom:8px;font-size:.9rem;color:var(--text-secondary)">🥗 常见食物纤维含量（每100g）</h4>
    <div class="food-examples" id="food-examples"></div>

<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
const foodData=[{emoji:'🫘',name:'黑豆（熟）',fiber:8.7},{emoji:'🥑',name:'牛油果',fiber:6.7},{emoji:'🥦',name:'西兰花',fiber:2.6},{emoji:'🍎',name:'苹果（带皮）',fiber:2.4},{emoji:'🍌',name:'香蕉',fiber:2.6},{emoji:'🫛',name:'扁豆（熟）',fiber:7.9},{emoji:'🥜',name:'杏仁',fiber:12.5},{emoji:'🌾',name:'燕麦片',fiber:10.6},{emoji:'🍠',name:'红薯（带皮）',fiber:3.0},{emoji:'🥕',name:'胡萝卜',fiber:2.8},{emoji:'🍐',name:'梨（带皮）',fiber:3.1},{emoji:'🌰',name:'奇亚籽',fiber:34.4}];
function calculate(){
  const gender=document.getElementById('gender').value;
  const ageGroup=document.getElementById('age-group').value;
  const calories=parseFloat(document.getElementById('calories').value)||0;
  if(calories<=0){showToast('请填写有效热量摄入');return}

  const fiberTable={
    male:{child:25,teen:31,adult:38,senior:30},
    female:{child:25,teen:26,adult:25,senior:21}
  };
  const baseFiber=fiberTable[gender][ageGroup];
  const calorieBased=(calories/1000)*14;
  const recommended=Math.round((baseFiber+calorieBased)/2);

  let tip='';
  if(recommended<20) tip='💡 提示：你目前的纤维需求偏低。建议多吃全谷物、豆类、蔬菜和水果来增加膳食纤维摄入。每天增加纤维时记得多喝水。';
  else if(recommended<30) tip='💡 提示：你的纤维需求处于适中水平。保持每日蔬菜水果摄入，适量食用全谷物和豆类。逐渐增加纤维摄入，避免肠胃不适。';
  else tip='💡 提示：你的纤维需求较高。确保多喝水（每天2L以上），逐步增加纤维摄入量，选择多样化的纤维来源以获得可溶性和不可溶性纤维的平衡。';

  document.getElementById('result-card').style.display='block';
  document.getElementById('results').innerHTML=`
    <div class="result-item"><div class="result-label">年龄性别基准</div><div class="result-value">${baseFiber}g</div></div>
    <div class="result-item"><div class="result-label">热量基准(14g/1000kcal)</div><div class="result-value">${calorieBased.toFixed(0)}g</div></div>
    <div class="result-item"><div class="result-label">综合推荐量</div><div class="result-value">${recommended}g</div></div>
    <div class="result-item"><div class="result-label">可溶性纤维(30%)</div><div class="result-value">${(recommended*0.3).toFixed(0)}g</div></div>
    <div class="result-item"><div class="result-label">不可溶性纤维(70%)</div><div class="result-value">${(recommended*0.7).toFixed(0)}g</div></div>
  `;
  document.getElementById('tip').innerHTML=tip;
  document.getElementById('food-examples').innerHTML=foodData.map(f=>{
    const servings=(recommended/f.fiber).toFixed(1);
    return '<div class="food-item"><span class="emoji">'+f.emoji+'</span><span class="name">'+f.name+'</span><span class="amount">≈'+servings+'份 ('+f.fiber+'g纤维)</span></div>';
  }).join('');
}
function clearForm(){document.getElementById('gender').value='male';document.getElementById('age-group').value='adult';document.getElementById('calories').value='2000';document.getElementById('result-card').style.display='none'}
calculate();
</script>
<script>
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
