<div class="container">
<header class="header">
<h1>⌨️ 键盘按键代码查询</h1>
<div style="background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);border-radius:8px;padding:12px 16px;margin:12px 0;color:#22d3ee;font-size:.9rem">📌 此工具已合并至 <a href="/keycode-finder/" style="color:#22d3ee;text-decoration:underline">keycode finder</a>，请使用新版本。</div>

<a href="/keycode-info/" class="active">中文</a>
<a href="/en/keycode-info/">EN</a>
</div>
</header>
<div class="card">
<div class="prompt-box" id="promptBox" tabindex="0">
<div class="key-display" id="keyDisplay">按下任意键</div>
<div class="hint">点击此处，然后按下键盘上的任意按键</div>
</div>
<div class="info-grid" id="infoGrid">
<div class="info-item"><div class="label">event.key</div><div class="value" id="valKey">—</div></div>
<div class="info-item"><div class="label">event.code</div><div class="value code" id="valCode">—</div></div>
<div class="info-item"><div class="label">event.keyCode</div><div class="value" id="valKeyCode">—</div></div>
<div class="info-item"><div class="label">event.which</div><div class="value" id="valWhich">—</div></div>
<div class="info-item"><div class="label">event.location</div><div class="value" id="valLocation">—</div></div>
<div class="info-item"><div class="label">修饰键</div><div class="value" id="valModifiers">—</div></div>
</div>

</div>

<script>
(function(){
var promptBox=document.getElementById('promptBox');
var keyDisplay=document.getElementById('keyDisplay');
var history=document.getElementById('history');
var valKey=document.getElementById('valKey');
var valCode=document.getElementById('valCode');
var valKeyCode=document.getElementById('valKeyCode');
var valWhich=document.getElementById('valWhich');
var valLocation=document.getElementById('valLocation');
var valModifiers=document.getElementById('valModifiers');
var historyKeys=[];

var locationMap={0:'标准键盘',1:'左侧',2:'右侧',3:'数字键盘'};

function updateDisplay(e){
e.preventDefault();
var key=e.key===' '?'Space':(e.key||'(空)');
keyDisplay.textContent=key;
promptBox.classList.add('active');
setTimeout(function(){promptBox.classList.remove('active');},300);

valKey.textContent=e.key||'(空)';
valCode.textContent=e.code||'—';
valKeyCode.textContent=e.keyCode!==undefined?e.keyCode:'—';
valWhich.textContent=e.which!==undefined?e.which:'—';
valLocation.textContent=locationMap[e.location]||e.location||'—';

var mods=[];
if(e.ctrlKey)mods.push('Ctrl');
if(e.altKey)mods.push('Alt');
if(e.shiftKey)mods.push('Shift');
if(e.metaKey)mods.push('Meta');
valModifiers.textContent=mods.length?mods.join(' + '):'无';

var chipLabel=(e.ctrlKey?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+(e.metaKey?'Meta+':'')+e.key;
if(historyKeys[0]!==chipLabel){
historyKeys.unshift(chipLabel);
if(historyKeys.length>20)historyKeys.pop();
renderHistory();
}
}

function renderHistory(){
history.innerHTML=historyKeys.slice(0,20).map(function(k,i){
return '<span class="chip" data-idx="'+i+'" title="点击重新选中">'+k+'</span>';
}).join('');
}

history.addEventListener('click',function(e){
var chip=e.target.closest('.chip');
if(!chip)return;
var idx=parseInt(chip.dataset.idx);
var k=historyKeys[idx];
keyDisplay.textContent=k;
});

promptBox.addEventListener('click',function(){promptBox.focus();});
document.addEventListener('keydown',updateDisplay);
})();
</script>
