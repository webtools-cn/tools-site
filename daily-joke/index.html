    <h1>每日笑话</h1>

    <div class="tool-area">

      <div id="jokeDisplay" class="output" style="font-size:1.1rem;line-height:1.8"></div>
      <script>
      var jokes = ["为什么程序员总是搞混圣诞节和万圣节？因为 Oct 31 == Dec 25！", "小明：老师，我昨天看到一个成语叫「愚公移山」，为什么不是「愚公移山」呢？老师：那是愚公，不是愚公。", "面试官：「你有什么特长？」我：「我特别能熬夜。」面试官：「还有呢？」我：「我特别能吃。」", "为什么数学书总是很忧郁？因为它有太多问题。", "世界上什么东西最硬？女朋友的「我没事」。", "程序员最讨厌的数字是什么？1024。因为1024=1K，然后他就失去了工作。", "为什么蜗牛看起来不太高兴？因为它背上的房子贷款利率太高了。", "问：如何让程序员发疯？答：给他一个没有错误信息的bug。", "我今天去了图书馆，问管理员：「有关于偏执症的书吗？」管理员小声说：「在你身后。」", "两个饺子结婚了，洞房花烛夜，新郎发现新娘是肉馅的，崩溃大哭：「你不是说你是素的吗？」", "医生：「你的检查结果出来了，很不幸，你只有6个月的时间了。」病人：「医生，那我现在应该做什么？」医生：「我建议你嫁给一个税务师。」病人：「这样能治好我的病吗？」医生：「不能，但会让那6个月感觉像永远。」", "老板：「你明天不用来上班了。」我：「为什么？」老板：「你昨天在会议上睡着了。」我：「这不能怪我，是你在讲PPT的时候催眠效果太好了。」", "我减肥的方法很简单：每天照镜子，然后对自己说「你不胖」，然后就真的…还是胖。", "为什么程序员不喜欢户外活动？因为阳光太亮了，没法看清黑色主题的屏幕。", "问：什么样的水不能喝？答：薪水。", "我今天买了一个充电宝，很大很重，结果发现里面全是电池。我在想，如果我把电池都拿出来，那它是不是就变成了一个……空壳？", "老板：「你不是说你会Python吗？」我：「对啊，我会写print('Hello World')」老板：「就这？」我：「我还会写input()让程序停下来。」", "今天去相亲，对方问我：「你有什么爱好？」我说：「我喜欢安静。」对方：「那正好，我也不爱说话。」然后我们就安静地坐了一个小时，最后她说：「我们不太合适。」", "小明问爸爸：「为什么我们要给奶奶过生日，她却总说不用不用？」爸爸：「等你长大了就懂了。比如我给你买生日礼物的时候，你也会说不用不用。」小明：「那不一样！我说不用是真的不用！」", "面试官：「你期望的薪资是多少？」我：「五万。」面试官：「一个月？」我：「不，一年。」面试官：「……」我：「怎么了？太高了吗？」面试官：「不是，你走吧，我们公司配不上你。」"];
      function getJoke() {
        var joke = jokes[Math.floor(Math.random() * jokes.length)];
        document.getElementById('jokeDisplay').textContent = joke;
        return joke;
      }
      document.getElementById('getJoke').addEventListener('click', getJoke);
      document.getElementById('copyJoke').addEventListener('click', function() {
        var joke = document.getElementById('jokeDisplay').textContent;
        if (!joke) joke = getJoke();
        copyText(joke);
      });
      getJoke();
      </script>

  <div class="toast" id="toast"></div>
  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('已复制！')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制！');
    }
  }
  </script>
