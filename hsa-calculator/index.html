  <style>
    :root { --primary: #4F46E5; --primary-light: #6366F1; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,.06); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    .container { max-width: 780px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 24px 0 8px; }
    header a { color: var(--primary); text-decoration: none; font-size: .9rem; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: var(--text-secondary); font-size: .9rem; margin-bottom: 20px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
    .form-row label { font-size: .85rem; color: var(--text-secondary); min-width: 130px; }
    input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; background: #fff; color: var(--text); }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    input[type="number"] { width: 160px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: .9rem; cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .result-item { background: var(--bg); padding: 16px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .result-item .val { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .result-item .lbl { font-size: .8rem; color: var(--text-secondary); margin-top: 4px; }
    .result-item.highlight { border-color: var(--success); background: rgba(16,185,129,.05); }
    .result-item.highlight .val { color: var(--success); }
    .result-item.warn { border-color: var(--warning); }
    .result-item.warn .val { color: var(--warning); }
    .info-box { background: rgba(79,70,229,.05); border-left: 3px solid var(--primary); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 12px 0; font-size: .85rem; }
    .chart-row { display: flex; gap: 8px; align-items: flex-end; height: 150px; margin-top: 12px; }
    .chart-bar-container { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .chart-bar-fill { width: 100%; border-radius: 4px 4px 0 0; transition: height .3s; }
    .chart-bar-fill.contribution { background: var(--primary); }
    .chart-bar-fill.growth { background: var(--success); }
    .chart-bar-fill.tax { background: var(--warning); }
    .chart-label { font-size: .75rem; color: var(--text-secondary); margin-top: 4px; }
    footer { text-align: center; padding: 24px 0; color: var(--text-secondary); font-size: .82rem; border-top: 1px solid var(--border); margin-top: 20px; }
    footer a { color: var(--text-secondary); margin: 0 8px; text-decoration: none; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: .85rem; z-index: 1000; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media(max-width:640px) { h1{font-size:1.2rem} .container{padding:0 12px} .card{padding:16px} .results{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/">← 返回首页</a>
      <h1>🏥 HSA计算器</h1>
      <p class="subtitle">健康储蓄账户供款限额与税收节省计算</p>
    </header>

    <div class="card">
      <div class="form-row">
        <label>计划类型</label>
        <select id="plan-type" onchange="updateLimits()">
          <option value="individual">个人计划</option>
          <option value="family">家庭计划</option>
        </select>
      </div>

      <div class="form-row">
        <label>年龄</label>
        <input type="number" id="age" value="35" min="18" max="80" step="1">
      </div>

      <div class="form-row">
        <label>年供款额</label>
        <input type="number" id="contribution" value="3850" min="0" step="50">
        <span style="font-size:.8rem;color:var(--text-secondary)">$（2025年个人限额$4,150）</span>
      </div>

      <div class="form-row">
        <label>边际税率</label>
        <input type="number" id="tax-rate" value="24" min="0" max="50" step="1">
        <span style="font-size:.8rem;color:var(--text-secondary)">%</span>
      </div>

      <div class="form-row">
        <label>预期年回报率</label>
        <input type="number" id="return-rate" value="7" min="0" max="20" step="0.5">
        <span style="font-size:.8rem;color:var(--text-secondary)">%</span>
      </div>

      <div class="form-row">
        <label>投资年限</label>
        <input type="number" id="years" value="20" min="1" max="50" step="1">
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="calculate()">📊 计算</button>
        <button class="btn btn-secondary" onclick="resetAll()">↺ 重置</button>
      </div>
    </div>

    <div class="card" id="result-card" style="display:none">
      <div class="info-box">
        <strong>💡 HSA三重税收优惠：</strong>供款免税、增长免税、合格医疗支出免税。
      </div>
      <div class="results" id="summary"></div>
      <div class="chart-row">
        <div class="chart-bar-container"><div class="chart-bar-fill contribution" id="bar-contrib"></div><div class="chart-label">供款</div></div>
        <div class="chart-bar-container"><div class="chart-bar-fill growth" id="bar-growth"></div><div class="chart-label">增长</div></div>
        <div class="chart-bar-container"><div class="chart-bar-fill tax" id="bar-tax"></div><div class="chart-label">税收节省</div></div>
      </div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn btn-primary" onclick="copyResults()">📋 复制结果</button>
      </div>
    </div>

    <footer>
      <a href="/">首页</a>
      <a href="/privacy">隐私政策</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <!-- AdSense -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-5998441792679372"
       data-ad-slot="auto"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <script>
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }

    function updateLimits() {
      var plan = document.getElementById('plan-type').value;
      var age = parseInt(document.getElementById('age').value) || 0;
      var limit = plan === 'individual' ? 4150 : 8300;
      if (age >= 55) limit += 1000;
      document.getElementById('contribution').max = limit;
      var contrib = parseInt(document.getElementById('contribution').value) || 0;
      if (contrib > limit) document.getElementById('contribution').value = limit;
    }

    function calculate() {
      var plan = document.getElementById('plan-type').value;
      var age = parseInt(document.getElementById('age').value) || 0;
      var contribution = parseFloat(document.getElementById('contribution').value) || 0;
      var taxRate = parseFloat(document.getElementById('tax-rate').value) / 100 || 0;
      var returnRate = parseFloat(document.getElementById('return-rate').value) / 100 || 0;
      var years = parseInt(document.getElementById('years').value) || 0;

      if (contribution <= 0) { showToast('请输入有效供款额'); return; }

      var limit = plan === 'individual' ? 4150 : 8300;
      if (age >= 55) limit += 1000;

      var annualTaxSaving = contribution * taxRate;
      var futureValue = 0;
      var totalContrib = 0;
      for (var i = 0; i < years; i++) {
        futureValue = (futureValue + contribution) * (1 + returnRate);
        totalContrib += contribution;
      }
      var growth = futureValue - totalContrib;
      var totalTaxSaving = annualTaxSaving * years;
      var afterTaxValue = futureValue - totalTaxSaving;

      document.getElementById('summary').innerHTML =
        '<div class="result-item"><div class="val">$' + limit.toLocaleString('en-US') + '</div><div class="lbl">年度供款限额</div></div>' +
        '<div class="result-item"><div class="val">$' + annualTaxSaving.toLocaleString('en-US', {minimumFractionDigits:0}) + '</div><div class="lbl">年税收节省</div></div>' +
        '<div class="result-item warn"><div class="val">$' + totalTaxSaving.toLocaleString('en-US', {minimumFractionDigits:0}) + '</div><div class="lbl">总税收节省</div></div>' +
        '<div class="result-item highlight"><div class="val">$' + futureValue.toLocaleString('en-US', {minimumFractionDigits:0}) + '</div><div class="lbl">账户未来价值</div></div>' +
        '<div class="result-item"><div class="val">$' + afterTaxValue.toLocaleString('en-US', {minimumFractionDigits:0}) + '</div><div class="lbl">税后净值</div></div>';

      // 图表
      var maxVal = Math.max(totalContrib, growth, totalTaxSaving, 1);
      document.getElementById('bar-contrib').style.height = (totalContrib / maxVal * 100) + '%';
      document.getElementById('bar-growth').style.height = (growth / maxVal * 100) + '%';
      document.getElementById('bar-tax').style.height = (totalTaxSaving / maxVal * 100) + '%';

      document.getElementById('result-card').style.display = 'block';
    }

    function resetAll() {
      document.getElementById('plan-type').value = 'individual';
      document.getElementById('age').value = '35';
      document.getElementById('contribution').value = '3850';
      document.getElementById('tax-rate').value = '24';
      document.getElementById('return-rate').value = '7';
      document.getElementById('years').value = '20';
      document.getElementById('result-card').style.display = 'none';
    }

    function copyResults() {
      var items = document.querySelectorAll('#summary .result-item');
      var text = 'HSA计算器结果\n';
      text += '='.repeat(30) + '\n';
      items.forEach(function(item) {
        var val = item.querySelector('.val').textContent;
        var lbl = item.querySelector('.lbl').textContent;
        text += '  ' + lbl + ': ' + val + '\n';
      });
      navigator.clipboard.writeText(text).then(function() {
        showToast('✅ 结果已复制到剪贴板');
      }).catch(function() {
        showToast('❌ 复制失败');
      });
    }

    document.querySelectorAll('input, select').forEach(function(el) {
      el.addEventListener('change', calculate);
    });
    calculate();
  </script>
</body>
</html>
