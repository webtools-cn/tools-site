    ],
    '蛋奶':[

    ],
    '豆制品':[
      {n:'豆腐',cal:76,u:'每100g'},{n:'豆浆',cal:33,u:'每100ml'},{n:'豆腐干',cal:140,u:'每100g'},{n:'腐竹',cal:459,u:'每100g'},{n:'毛豆',cal:131,u:'每100g'},{n:'黄豆',cal:390,u:'每100g'}

    ],
    '水果':[
      {n:'苹果',cal:52,u:'每100g'},{n:'香蕉',cal:89,u:'每100g'},{n:'橙子',cal:47,u:'每100g'},{n:'葡萄',cal:69,u:'每100g'},{n:'西瓜',cal:30,u:'每100g'},{n:'草莓',cal:32,u:'每100g'},{n:'蓝莓',cal:57,u:'每100g'},{n:'芒果',cal:60,u:'每100g'},{n:'猕猴桃',cal:61,u:'每100g'},{n:'梨',cal:57,u:'每100g'},{n:'桃子',cal:39,u:'每100g'},{n:'樱桃',cal:63,u:'每100g'},{n:'柚子',cal:42,u:'每100g'},{n:'牛油果',cal:160,u:'每100g'},{n:'榴莲',cal:147,u:'每100g'}
    ],
    '零食':[
      {n:'薯片',cal:536,u:'每100g'},{n:'巧克力',cal:546,u:'每100g'},{n:'饼干',cal:433,u:'每100g'},{n:'蛋糕',cal:347,u:'每100g'},{n:'冰淇淋',cal:207,u:'每100g'},{n:'坚果(混合)',cal:607,u:'每100g'},{n:'花生',cal:567,u:'每100g'},{n:'瓜子',cal:582,u:'每100g'},{n:'方便面',cal:473,u:'每100g'},{n:'可乐',cal:42,u:'每100ml'},{n:'果汁(橙)',cal:45,u:'每100ml'},{n:'啤酒',cal:43,u:'每100ml'}
    ],
    '调味':[
      {n:'植物油',cal:899,u:'每100g'},{n:'橄榄油',cal:884,u:'每100g'},{n:'沙拉酱',cal:680,u:'每100g'},{n:'番茄酱',cal:100,u:'每100g'},{n:'蜂蜜',cal:304,u:'每100g'},{n:'白糖',cal:387,u:'每100g'}
    ]
  };

  var selected={};
  var cats=Object.keys(foodData);
  var activeCat='全部';

  function renderCats(){
    var html='<div class="cat-tab active" data-cat="全部">全部</div>';
    cats.forEach(function(c){html+='<div class="cat-tab" data-cat="'+c+'">'+c+'</div>';});
    document.getElementById('cat-tabs').innerHTML=html;
    document.querySelectorAll('.cat-tab').forEach(function(t){
      t.addEventListener('click',function(){
        document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active')});
        this.classList.add('active');
        activeCat=this.dataset.cat;
        filterFoods();
      });
    });
  }

  function filterFoods(){
    var q=(document.getElementById('food-search').value||'').toLowerCase();
    var list=document.getElementById('food-list');
    var html='';
    var results=[];
    if(activeCat==='全部'){
      cats.forEach(function(c){
        foodData[c].forEach(function(f){
          if(!q||f.n.toLowerCase().includes(q)) results.push({cat:c,name:f.n,cal:f.cal,unit:f.u});
        });
      });
    }else{
      (foodData[activeCat]||[]).forEach(function(f){
        if(!q||f.n.toLowerCase().includes(q)) results.push({cat:activeCat,name:f.n,cal:f.cal,unit:f.u});
      });
    }
    if(results.length===0){
      html='<div style="padding:20px;text-align:center;color:#94a3b8">未找到匹配的食物</div>';
    }else{
      results.forEach(function(r,i){
        html+='<div class="food-item" data-idx="'+i+'" data-name="'+r.name+'" data-cal="'+r.cal+'" data-unit="'+r.unit+'" data-cat="'+r.cat+'"><span><span class="food-name">'+r.name+'</span><span class="food-unit">'+r.unit+'</span></span><span class="food-cal">'+r.cal+' kcal</span></div>';
      });
    }
    list.innerHTML=html;
    list.querySelectorAll('.food-item').forEach(function(item){
      item.addEventListener('click',function(){
        var key=this.dataset.name;
        if(selected[key]){selected[key].qty++}else{selected[key]={name:key,cal:parseInt(this.dataset.cal),unit:this.dataset.unit,qty:1}}
        renderSelected();
      });
    });
  }

  function renderSelected(){
    var keys=Object.keys(selected);
    var sec=document.getElementById('selected-section');
    var list=document.getElementById('selected-list');
    if(keys.length===0){sec.style.display='none';return}
    sec.style.display='block';
    var html='';
    var total=0;
    keys.forEach(function(k){
      var s=selected[k];
      total+=s.cal*s.qty;
      html+='<div class="selected-item"><span>'+s.name+' ×'+s.qty+' ('+s.unit+')</span><span>'+ (s.cal*s.qty) +' kcal <button class="remove-btn" data-key="'+k+'">✕</button></span></div>';
    });
    list.innerHTML=html;
    document.getElementById('total-cal').textContent=total+' kcal';
    list.querySelectorAll('.remove-btn').forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var k=this.dataset.key;
        if(selected[k]&&selected[k].qty>1){selected[k].qty--}else{delete selected[k]}
        renderSelected();
      });
    });
  }

  document.getElementById('clear-all').addEventListener('click',function(){selected={};renderSelected()});
  document.getElementById('food-search').addEventListener('input',filterFoods);
  document.getElementById('clear-search').addEventListener('click',function(){
    document.getElementById('food-search').value='';
    filterFoods();
  });

  renderCats();
  filterFoods();
})();
</script>
