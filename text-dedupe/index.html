<body>
<div class="container">
<div class="header"><h1>📝 文本去重工具</h1><div class="lang-switch"><a href="../en/text-dedupe/" class="active">中文</a><a href="../en/text-dedupe/">EN</a></div></div>
<p class="nav-back"><a href="../index.html">首页</a> &rsaquo; <a href="../#tools">工具</a> &rsaquo; 文本去重工具</p>
<div class="hero"><p>免费在线文本去重工具，快速删除或提取重复行。支持忽略大小写、忽略空白行、排序输出。纯前端处理，数据安全不上传。 <span class="badge">🔒 本地处理 · 无需注册</span></p></div>

<div class="panel">
  <div class="panel-title">📋 选项</div>
  <div class="option-row">
    <select id="mode" style="width:200px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px">
      <option value="remove">删除重复行（保留首次出现）</option>
      <option value="keep">仅保留重复行（出现≥2次）</option>
    </select>
    <label><input type="checkbox" id="ignoreCase"> 忽略大小写</label>
    <label><input type="checkbox" id="ignoreEmpty" checked> 忽略空白行</label>
    <label><input type="checkbox" id="sortOutput"> 排序输出</label>
  </div>
</div>

<div class="dual-pane">
  <div class="panel">
    <div class="panel-title">📥 输入</div>
    <textarea id="inputText" rows="12" placeholder="每行一条数据，粘贴需要去重的文本..."></textarea>
    <div class="stats" id="inputStats">行数: 0</div>
    <div class="btn-row">
      <button class="btn btn-primary btn-large" id="dedupeBtn">🔄 去重</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">📤 输出</div>
    <textarea id="outputText" rows="12" placeholder="去重结果将显示在这里..." readonly></textarea>
    <div class="stats" id="outputStats">行数: 0 | 已移除: 0</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="copyBtn">📋 复制结果</button>
      <button class="btn btn-secondary" id="swapBtn">🔃 交换输入输出</button>
    </div>
  </div>
</div>

<footer><p>© 2025 Free ToolBase · 纯前端处理，数据不上传服务器 · <a href="../">首页</a></p></footer>
<div class="toast" id="toast"></div>
</div>

<script>
const inputText=document.getElementById('inputText'),outputText=document.getElementById('outputText'),
  inputStats=document.getElementById('inputStats'),outputStats=document.getElementById('outputStats'),
  mode=document.getElementById('mode'),ignoreCase=document.getElementById('ignoreCase'),
  ignoreEmpty=document.getElementById('ignoreEmpty'),sortOutput=document.getElementById('sortOutput');

function showToast(msg) {
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function updateInputStats() {
  var lines=inputText.value.split('\n');
  if(ignoreEmpty.checked)lines=lines.filter(function(l){return l.trim()!=='';});
  inputStats.textContent='行数: '+lines.length;
}

function dedupe() {
  var text=inputText.value;
  if(!text.trim()){showToast('请输入需要去重的文本');return;}
  var lines=text.split('\n');
  if(ignoreEmpty.checked)lines=lines.filter(function(l){return l.trim()!=='';});
  var originalCount=lines.length;
  var seen={},result=[],dupLines={};
  var normalize=ignoreCase.checked?function(s){return s.toLowerCase();}:function(s){return s;};

  if(mode.value==='remove'){
    for(var i=0;i<lines.length;i++){
      var key=normalize(lines[i]);
      if(!seen[key]){seen[key]=true;result.push(lines[i]);}
    }
  }else{
    for(var i=0;i<lines.length;i++){
      var k=normalize(lines[i]);
      if(seen[k]===undefined)seen[k]=1;
      else seen[k]++;
    }
    for(var j=0;j<lines.length;j++){
      var nk=normalize(lines[j]);
      if(seen[nk]>=2&&!dupLines[nk]){dupLines[nk]=true;result.push(lines[j]);}
    }
  }

  if(sortOutput.checked)result.sort();
  outputText.value=result.join('\n');
  var removed=originalCount-result.length;
  outputStats.textContent='行数: '+result.length+' | 已移除: '+removed;
  updateInputStats();
}

inputText.addEventListener('input',updateInputStats);
document.getElementById('dedupeBtn').addEventListener('click',dedupe);
document.getElementById('clearBtn').addEventListener('click',function(){
  inputText.value='';outputText.value='';inputStats.textContent='行数: 0';outputStats.textContent='行数: 0 | 已移除: 0';
});
document.getElementById('copyBtn').addEventListener('click',function(){
  if(!outputText.value.trim()){showToast('没有可复制的结果');return;}
  navigator.clipboard.writeText(outputText.value).then(function(){showToast('已复制去重结果');});
});
document.getElementById('swapBtn').addEventListener('click',function(){
  var tmp=inputText.value;inputText.value=outputText.value;outputText.value=tmp;
  updateInputStats();dedupe();
});

// 示例数据
inputText.value='apple\nbanana\nApple\norange\nbanana\n\n\ngrape\norange';
updateInputStats();
</script>
</body>
