<body>
  <header>
    <nav>
      <a href="/" class="logo">Free ToolBase</a>

  <main>
    <h1>Image Blur Tool</h1>
    <p class="desc">Apply Gaussian blur or pixelate effects to images online. Adjustable strength, 100% browser-side processing.</p>
    <div class="card">
      <h2>📤 Upload Image</h2>
      <div class="upload-zone" id="dropZone">
        <p>Click or drag an image here</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <div class="mode-row">
        <span style="font-size:13px;line-height:32px;">Mode:</span>
        <button class="mode-btn active" data-mode="gaussian">Gaussian Blur</button>
        <button class="mode-btn" data-mode="pixelate">Pixelate</button>
      </div>
      <div class="control-row">
        <span>Strength: <strong id="strengthVal">5</strong></span>
        <input type="range" id="strengthRange" min="1" max="50" value="5">
      </div>
      <button class="btn btn-primary" id="blurBtn" disabled>Apply Blur</button>
      <button class="btn btn-primary" id="downloadBtn" style="display:none;margin-left:8px;">Download PNG</button>
    </div>
    <div class="card" id="previewCard" style="display:none">
      <h2>👁️ Preview</h2>
      <div class="preview-area">
        <div class="preview-box">
          <div class="label">Original</div>
          <img id="previewOriginal" alt="Original">
        </div>
        <div class="preview-box">
          <div class="label">Processed</div>
          <canvas id="previewCanvas" style="max-width:100%;max-height:300px;border-radius:4px;border:1px solid var(--border);"></canvas>
        </div>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 Free ToolBase · Free Online Tools</p></footer>
  <div class="toast" id="toast"></div>
  <script>
    let sourceImage = null, mode = 'gaussian', resultCanvas = null;

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'error' : '');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function boxBlur(imageData, radius) {
      const w = imageData.width, h = imageData.height;
      const src = new Uint8ClampedArray(imageData.data);
      const dst = new Uint8ClampedArray(src);
      
      for (let pass = 0; pass < 3; pass++) {
        for (let y = 0; y < h; y++) {
          let rSum = 0, gSum = 0, bSum = 0, count = 0;
          for (let x = 0; x < w + radius; x++) {
            if (x < w) {
              const i = (y * w + x) * 4;
              rSum += src[i]; gSum += src[i+1]; bSum += src[i+2];
              count++;
            }
            if (x >= radius * 2 + 1) {
              const i2 = (y * w + (x - radius * 2 - 1)) * 4;
              rSum -= src[i2]; gSum -= src[i2+1]; bSum -= src[i2+2];
              count--;
            }
            if (x >= radius) {
              const oi = (y * w + (x - radius)) * 4;
              dst[oi] = rSum / count;
              dst[oi+1] = gSum / count;
              dst[oi+2] = bSum / count;
            }
          }
        }
        for (let x = 0; x < w; x++) {
          let rSum = 0, gSum = 0, bSum = 0, count = 0;
          for (let y = 0; y < h + radius; y++) {
            if (y < h) {
              const i = (y * w + x) * 4;
              rSum += dst[i]; gSum += dst[i+1]; bSum += dst[i+2];
              count++;
            }
            if (y >= radius * 2 + 1) {
              const i2 = ((y - radius * 2 - 1) * w + x) * 4;
              rSum -= dst[i2]; gSum -= dst[i2+1]; bSum -= dst[i2+2];
              count--;
            }
            if (y >= radius) {
              const oi = ((y - radius) * w + x) * 4;
              imageData.data[oi] = rSum / count;
              imageData.data[oi+1] = gSum / count;
              imageData.data[oi+2] = bSum / count;
            }
          }
        }
        for (let i = 0; i < src.length; i++) src[i] = imageData.data[i];
      }
    }

    function applyBlur() {
      if (!sourceImage) return;
      const canvas = document.getElementById('previewCanvas');
      canvas.width = sourceImage.width;
      canvas.height = sourceImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceImage, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const strength = parseInt(document.getElementById('strengthRange').value);

      if (mode === 'gaussian') {
        boxBlur(imageData, strength);
        boxBlur(imageData, Math.max(1, Math.floor(strength * 0.7)));
        boxBlur(imageData, Math.max(1, Math.floor(strength * 0.4)));
        ctx.putImageData(imageData, 0, 0);
      } else {
        const bs = Math.max(2, strength);
        const w = canvas.width, h = canvas.height;
        const smallCanvas = document.createElement('canvas');
        const smallCtx = smallCanvas.getContext('2d');
        smallCanvas.width = Math.max(1, Math.floor(w / bs));
        smallCanvas.height = Math.max(1, Math.floor(h / bs));
        smallCtx.drawImage(sourceImage, 0, 0, smallCanvas.width, smallCanvas.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(smallCanvas, 0, 0, w, h);
      }

      resultCanvas = canvas;
      document.getElementById('downloadBtn').style.display = 'inline-flex';
    }

    function downloadResult() {
      if (!resultCanvas) return;
      const a = document.createElement('a');
      a.href = resultCanvas.toDataURL('image/png');
      a.download = 'blurred.png';
      a.click();
      showToast('Downloaded!');
    }

    function loadImage(file) {
      if (file.size > 20 * 1024 * 1024) { showToast('Image must be under 20MB', true); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          document.getElementById('blurBtn').disabled = false;
          document.getElementById('previewOriginal').src = e.target.result;
          document.getElementById('previewCard').style.display = 'block';
          applyBlur();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });
    document.getElementById('dropZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--primary)'; });
    document.getElementById('dropZone').addEventListener('dragleave', e => { e.currentTarget.style.borderColor = 'var(--border)'; });
    document.getElementById('dropZone').addEventListener('drop', e => {
      e.preventDefault(); e.currentTarget.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
    });
    document.getElementById('strengthRange').addEventListener('input', e => {
      document.getElementById('strengthVal').textContent = e.target.value;
    });
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        if (sourceImage) applyBlur();
      });
    });
    document.getElementById('blurBtn').addEventListener('click', applyBlur);
    document.getElementById('downloadBtn').addEventListener('click', downloadResult);
  </script>
