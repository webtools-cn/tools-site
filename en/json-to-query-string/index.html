  <script>
  const input=document.getElementById('input'),output=document.getElementById('output'),convertBtn=document.getElementById('convertBtn'),copyBtn=document.getElementById('copyBtn'),toast=document.getElementById('toast');
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
  function toQueryString(obj,prefix=''){const parts=[];for(const[key,val]of Object.entries(obj)){const k=prefix?prefix+'['+key+']':key;if(val!==null&&typeof val==='object'&&!Array.isArray(val)){parts.push(toQueryString(val,k))}else if(Array.isArray(val)){val.forEach((v,i)=>{parts.push(encodeURIComponent(k)+'[]='+encodeURIComponent(v))})}else{parts.push(encodeURIComponent(k)+'='+encodeURIComponent(val))}}return parts.join('&')}
  function convert(){try{const obj=JSON.parse(input.value);output.value=toQuery(obj)}catch(e){showToast('Invalid JSON');output.value=''}}
  copyBtn.addEventListener('click',()=>{if(!output.value){showToast('Nothing to copy');return}navigator.clipboard.writeText(output.value).then(()=>showToast('Copied')).catch(()=>{output.select();document.execCommand('copy');showToast('Copied')})})
  convertBtn.addEventListener('click',convert);input.value='{"name":"John","age":30,"tags":["a","b"]}';convert();
