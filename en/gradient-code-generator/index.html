<body>
<header><h1>🎨 CSS Gradient Code Generator</h1></header>
<main>
  <div class="card">
    <h2>Gradient Preview</h2>
    <div id="preview"></div>
    <div class="controls">
      <div class="control-group">
        <label>Gradient Type</label>
        <select id="gradType">
          <option value="linear-gradient">Linear</option>
          <option value="radial-gradient">Radial</option>
          <option value="conic-gradient">Conic</option>
        </select>
      </div>
      <div class="control-group">
        <label>Angle (deg)</label>
        <input type="range" id="gradAngle" min="0" max="360" value="90">
        <span style="font-size:0.8rem;color:var(--text2)" id="angleVal">90°</span>
      </div>
    </div>
    <div class="color-stops" id="colorStops">
      <div class="color-stop"><input type="color" value="#4F46E5"><button class="remove-btn" title="Remove">×</button></div>
      <div class="color-stop"><input type="color" value="#06b6d4"><button class="remove-btn" title="Remove">×</button></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="btnAddColor">+ Add Color</button>
    </div>
  </div>
  <div class="card">
    <h2>Generated CSS</h2>
    <pre id="cssOutput">background: linear-gradient(90deg, #4F46E5, #06b6d4);</pre>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCopy">📋 Copy CSS</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script>
const preview = document.getElementById('preview');
const gradType = document.getElementById('gradType');
const gradAngle = document.getElementById('gradAngle');
const angleVal = document.getElementById('angleVal');
const colorStops = document.getElementById('colorStops');
const cssOutput = document.getElementById('cssOutput');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function getColors() {
  return [...colorStops.querySelectorAll('input[type="color"]')].map(el => el.value);
}

function updatePreview() {
  const colors = getColors();
  const type = gradType.value;
  const angle = gradAngle.value;
  let css = '';
  if (type === 'linear-gradient') {
    css = `linear-gradient(${angle}deg, ${colors.join(', ')})`;
  } else if (type === 'radial-gradient') {
    css = `radial-gradient(circle, ${colors.join(', ')})`;
  } else {
    css = `conic-gradient(from ${angle}deg, ${colors.join(', ')})`;
  }
  preview.style.background = css;
  cssOutput.textContent = `background: ${css};`;
}

function addRemoveListeners() {
  colorStops.querySelectorAll('.remove-btn').forEach(btn => {
    btn.onclick = () => {
      if (colorStops.children.length <= 2) { showToast('At least 2 colors required'); return; }
      btn.parentElement.remove();
      updatePreview();
    };
  });
  colorStops.querySelectorAll('input[type="color"]').forEach(input => {
    input.onchange = updatePreview;
  });
}

gradType.addEventListener('change', updatePreview);
gradAngle.addEventListener('input', () => {
  angleVal.textContent = gradAngle.value + '°';
  updatePreview();
});

document.getElementById('btnAddColor').addEventListener('click', () => {
  const div = document.createElement('div');
  div.className = 'color-stop';
  div.innerHTML = '<input type="color" value="#e2e8f0"><button class="remove-btn" title="Remove">×</button>';
  colorStops.appendChild(div);
  addRemoveListeners();
  updatePreview();
});

document.getElementById('btnCopy').addEventListener('click', () => {
  navigator.clipboard.writeText(cssOutput.textContent).then(() => showToast('Copied to clipboard')).catch(() => showToast('Copy failed'));
});

addRemoveListeners();
updatePreview();
</script>
</body>
