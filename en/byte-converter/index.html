<main>
  <h1>Byte Converter</h1>
  <p class="subtitle">Quickly convert between bit, Byte, KB, MB, GB, TB, PB. Supports both binary (1024) and decimal (1000) modes.</p>

  <div class="card">
    <h2>Conversion Mode</h2>
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn active" data-mode="1024">Binary (1KB = 1024B)</button>
      <button class="mode-btn" data-mode="1000">Decimal (1KB = 1000B)</button>
    </div>
  </div>

  <div class="card">
    <h2>Input Value</h2>
    <div class="row">
      <div class="field">
        <label>Value</label>
        <input type="number" id="inputValue" placeholder="Enter value" step="any" value="1">
      </div>
      <div class="field">
        <label>From Unit</label>
        <select id="fromUnit">
          <option value="bit">bit</option>
          <option value="Byte" selected>Byte (B)</option>
          <option value="KB">KB</option>
          <option value="MB">MB</option>
          <option value="GB">GB</option>
          <option value="TB">TB</option>
          <option value="PB">PB</option>
        </select>
      </div>
    </div>
    <p class="error" id="errorMsg" style="display:none;"></p>
  </div>

  <div class="card" id="resultCard">
    <h2>Converted Results</h2>
    <div class="result-grid" id="resultGrid"></div>
  </div>
</main>

<script>
(function() {
  const inputValue = document.getElementById('inputValue');
  const fromUnit = document.getElementById('fromUnit');
  const errorMsg = document.getElementById('errorMsg');
  const resultGrid = document.getElementById('resultGrid');
  const modeSwitch = document.getElementById('modeSwitch');

  let base = 1024;

  const units = [
    { key: 'bit', label: 'bit', toByte: function(v, b) { return v / 8; }, fromByte: function(v, b) { return v * 8; } },
    { key: 'Byte', label: 'Byte (B)', toByte: function(v, b) { return v; }, fromByte: function(v, b) { return v; } },
    { key: 'KB', label: 'KB', toByte: function(v, b) { return v * b; }, fromByte: function(v, b) { return v / b; } },
    { key: 'MB', label: 'MB', toByte: function(v, b) { return v * b * b; }, fromByte: function(v, b) { return v / (b * b); } },
    { key: 'GB', label: 'GB', toByte: function(v, b) { return v * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b); } },
    { key: 'TB', label: 'TB', toByte: function(v, b) { return v * b * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b * b); } },
    { key: 'PB', label: 'PB', toByte: function(v, b) { return v * b * b * b * b * b; }, fromByte: function(v, b) { return v / (b * b * b * b * b); } },
  ];

  function format(val) {
    if (val === 0) return '0';
    if (Math.abs(val) < 1e-15) return '0';
    if (Math.abs(val) < 0.001) return val.toExponential(4);
    if (Math.abs(val) >= 1e15) return val.toExponential(4);
    var s = val.toPrecision(10);
    var parts = s.split('e');
    if (parts.length === 2) return val.toExponential(4);
    var dot = s.indexOf('.');
    if (dot === -1) return s;
    var dec = s.substring(dot + 1);
    var trimmed = s.substring(0, dot + 1 + Math.min(dec.length, 6));
    return parseFloat(trimmed).toString();
  }

  function convert() {
    errorMsg.style.display = 'none';
    var val = parseFloat(inputValue.value);
    if (isNaN(val)) {
      errorMsg.textContent = 'Please enter a valid number.';
      errorMsg.style.display = 'block';
      return;
    }
    if (val < 0) {
      errorMsg.textContent = 'Please enter a non-negative number.';
      errorMsg.style.display = 'block';
      return;
    }

    var fromKey = fromUnit.value;
    var fromU = units.find(function(u) { return u.key === fromKey; });
    if (!fromU) return;

    var bytes = fromU.toByte(val, base);
    var html = '';
    units.forEach(function(u) {
      var result = u.fromByte(bytes, base);
      html += '<div class="result-item"><div class="val">' + format(result) + '</div><div class="lbl">' + u.label + '</div></div>';
    });
    resultGrid.innerHTML = html;
  }

  inputValue.addEventListener('input', convert);
  fromUnit.addEventListener('change', convert);

  modeSwitch.addEventListener('click', function(e) {
    var btn = e.target.closest('.mode-btn');
    if (!btn) return;
    modeSwitch.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    base = parseInt(btn.dataset.mode);
    convert();
  });

  convert();
})();
</script>
