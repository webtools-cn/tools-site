<style>
:root{--primary:#4F46E5;--primary-hover:#4338CA;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-size:1.25rem;font-weight:700}
header a{color:var(--primary);text-decoration:none;font-size:.9rem}
main{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%}
h2{font-size:1rem;margin-bottom:12px}
.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--primary);background:rgba(79,70,229,.03)}
.drop-zone p{margin:8px 0;color:var(--text-secondary);font-size:.9rem}
.drop-zone .icon{font-size:2.5rem;margin-bottom:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:rgba(79,70,229,.05)}
#results{display:none}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.meta-item{background:linear-gradient(135deg,#f0f4ff,#e8ecff);border-radius:8px;padding:12px;text-align:center}
.meta-item .val{font-size:1.2rem;font-weight:700;color:var(--primary);word-break:break-all}
.meta-item .lbl{font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.kv-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:12px}
.kv-table th{background:#f1f5f9;padding:8px 10px;text-align:left;font-weight:600;font-size:.8rem;color:var(--text-secondary);width:200px}
.kv-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-family:monospace;font-size:.8rem;word-break:break-all}
.kv-search{margin-bottom:12px}
.kv-search input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem}
.kv-search input:focus{outline:none;border-color:var(--primary)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-blue{background:#e0e7ff;color:var(--primary)}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-orange{background:#fff7ed;color:#ea580c}
footer{background:var(--surface);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.8rem;color:var(--text-secondary)}
@media(max-width:600px){main{padding:12px}.card{padding:16px}.meta-grid{grid-template-columns:1fr 1fr}.kv-table th{width:120px}}

<body>
<header><h1>🦙 GGUF Analyzer</h1><a href="/en/">← Back to Home</a></header>
<main>
<div class="card">
  <h2>📂 Upload GGUF File</h2>
  <div class="drop-zone" id="dropZone">
    <div class="icon">📁</div>
    <p><strong>Drag & drop .gguf file here</strong></p>
    <p>or click to select · Pure frontend, no upload</p>
    <input type="file" id="fileInput" accept=".gguf" style="display:none">
    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Select File</button>
  </div>
  <p style="margin-top:8px;font-size:.8rem;color:var(--text-secondary)" id="fileInfo">No file selected</p>
</div>
<div class="card" id="results">
  <h2>📊 Model Summary</h2>
  <div class="meta-grid" id="metaGrid"></div>
  <h2 style="margin-top:16px">📋 Metadata Key-Value Pairs</h2>
  <div class="kv-search"><input type="text" id="searchInput" placeholder="Search metadata key..." oninput="filterKV()"></div>
  <div style="max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
    <table class="kv-table"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody id="kvBody"></tbody></table>
  </div>
  <div class="btn-row">
    <button class="btn-outline" onclick="exportJSON()">📥 Export JSON</button>
    <button class="btn-outline" onclick="document.getElementById('searchInput').value='';filterKV()">🔄 Clear Filter</button>
  
    <button class="btn-outline" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
</main>
<footer>© 2025 Free ToolBase · Pure frontend, no file upload</footer>
<script>
let allKV=[];
function showToast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;z-index:99999;font-size:14px;animation:toastIn .3s ease';document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2000)}
document.head.insertAdjacentHTML('beforeend','<style>@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}</style>');

const GGUF_MAGIC=0x46554747;
const GGUF_VALUE_TYPES={0:'uint8',1:'int8',2:'uint16',3:'int16',4:'uint32',5:'int32',6:'float32',7:'bool',8:'string',9:'array',10:'uint64',11:'int64',12:'float64'};

const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)processFile(f)});
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)processFile(f)});

async function processFile(file){
  if(!file.name.toLowerCase().endsWith('.gguf')){showToast('Please select a .gguf file');return}
  document.getElementById('fileInfo').textContent=file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)';
  try{
    const buf=await file.arrayBuffer();const dv=new DataView(buf);
    if(dv.getUint32(0,true)!==GGUF_MAGIC){showToast('Invalid GGUF file');return}
    const version=dv.getUint32(4,true);
    const tensorCount=dv.getBigUint64(8,true);
    const metadataKVCount=dv.getBigUint64(16,true);
    let offset=24;const kv=[];
    for(let i=0;i<metadataKVCount;i++){
      const keyLen=dv.getBigUint64(offset,true);offset+=8;
      const keyBytes=new Uint8Array(buf,offset,Number(keyLen));const key=new TextDecoder().decode(keyBytes);
      offset+=Number(keyLen);
      const valueType=dv.getUint32(offset,true);offset+=4;
      let value;
      switch(valueType){
        case 0:value=dv.getUint8(offset);offset+=1;break;
        case 1:value=dv.getInt8(offset);offset+=1;break;
        case 2:value=dv.getUint16(offset,true);offset+=2;break;
        case 3:value=dv.getInt16(offset,true);offset+=2;break;
        case 4:value=dv.getUint32(offset,true);offset+=4;break;
        case 5:value=dv.getInt32(offset,true);offset+=4;break;
        case 6:value=dv.getFloat32(offset,true).toFixed(6);offset+=4;break;
        case 7:value=dv.getUint8(offset)?'true':'false';offset+=1;break;
        case 8:const slen=dv.getBigUint64(offset,true);offset+=8;value=new TextDecoder().decode(new Uint8Array(buf,offset,Number(slen)));offset+=Number(slen);break;
        case 10:value=dv.getBigUint64(offset,true).toString();offset+=8;break;
        case 11:value=dv.getBigInt64(offset,true).toString();offset+=8;break;
        case 12:value=dv.getFloat64(offset,true);offset+=8;break;
        default:value='(unsupported type)';break;
      }
      if(valueType===9){const atype=dv.getUint32(offset,true);offset+=4;const alen=dv.getUint32(offset,true);offset+=4;const arr=[];for(let j=0;j<alen;j++){switch(atype){case 4:arr.push(dv.getUint32(offset,true));offset+=4;break;case 5:arr.push(dv.getInt32(offset,true));offset+=4;break;case 6:arr.push(dv.getFloat32(offset,true));offset+=4;break;default:offset+=4}}value='['+arr.join(', ')+']'}
      kv.push({key,value:String(value),type:GGUF_VALUE_TYPES[valueType]||'?'});
    }
    allKV=kv;displayResults(kv,version,tensorCount,file.size);
  }catch(e){showToast('Parse error: '+e.message)}
}

function displayResults(kv,version,tensorCount,fileSize){
  document.getElementById('results').style.display='block';
  const arch=kv.find(k=>k.key==='general.architecture')?.value||'Unknown';
  const name=kv.find(k=>k.key==='general.name')?.value||'Unknown';
  const quant=kv.find(k=>k.key==='general.file_type')?.value||'Unknown';
  const ctxLen=kv.find(k=>k.key.match(/context_length/))?.value||'Unknown';
  const vocab=kv.find(k=>k.key.match(/vocab_size/))?.value||'Unknown';
  document.getElementById('metaGrid').innerHTML=`
    <div class="meta-item"><div class="lbl">Architecture</div><div class="val"><span class="badge badge-green">${arch}</span></div></div>
    <div class="meta-item"><div class="lbl">Model Name</div><div class="val" style="font-size:.9rem">${name}</div></div>
    <div class="meta-item"><div class="lbl">GGUF Version</div><div class="val">${version}</div></div>
    <div class="meta-item"><div class="lbl">Tensor Count</div><div class="val">${tensorCount}</div></div>
    <div class="meta-item"><div class="lbl">Quantization</div><div class="val"><span class="badge badge-orange">${quant}</span></div></div>
    <div class="meta-item"><div class="lbl">Context Length</div><div class="val">${ctxLen}</div></div>
    <div class="meta-item"><div class="lbl">Vocabulary Size</div><div class="val">${vocab}</div></div>
    <div class="meta-item"><div class="lbl">File Size</div><div class="val">${(fileSize/1024/1024).toFixed(0)} MB</div></div>
  `;
  renderKV(kv);
}

function renderKV(data){
  document.getElementById('kvBody').innerHTML=data.map(k=>`<tr><td>${k.key}</td><td><span class="badge badge-blue" style="margin-right:6px">${k.type}</span>${k.value}</td></tr>`).join('');
}

function filterKV(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=q?allKV.filter(k=>k.key.toLowerCase().includes(q)):allKV;
  renderKV(filtered);
}

function exportJSON(){
  const data=allKV.map(k=>({key:k.key,type:k.type,value:k.value}));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='gguf-metadata.json';a.click();URL.revokeObjectURL(url);showToast('JSON exported');
}

function copyResults(){
  const results=document.getElementById('results');
  if(!results||results.style.display==='none'){showToast('Please generate comparison results first');return}
  let text='';
  const table=results.querySelector('table');
  if(table){
    const rows=table.querySelectorAll('tr');
    rows.forEach(row=>{
      const cells=row.querySelectorAll('th,td');
      text+=Array.from(cells).map(c=>c.textContent.trim()).join('\t')+'\n';
    });
  }else{
    text=results.textContent.trim();
  }
  if(!text){showToast('Nothing to copy');return}
  navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>showToast('Copy failed'));
}

</script>
</body>
</html>
