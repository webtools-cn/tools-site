<body>
<div class="container">
  <div class="header">
    <h1>🩸 Blood Type Calculator</h1>
    <div class="lang-switch"><a href="/blood-type-calculator/">中文</a><a href="/en/blood-type-calculator/" class="active">EN</a></div>
  </div>
  <div class="nav-back"><a href="/en/">← Back to Home</a></div>
  <div class="hero"><p>Predict child blood types from parents</p><span class="badge">Health</span></div>
  <div class="section">
    <div class="form-row">
      <div class="form-group"><label for="fatherABO">Father ABO Type</label><select id="fatherABO"><option value="A">Type A</option><option value="B">Type B</option><option value="AB">Type AB</option><option value="O">Type O</option></select></div>
      <div class="form-group"><label for="fatherRh">Father Rh Factor</label><select id="fatherRh"><option value="+">Rh+</option><option value="-">Rh-</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label for="motherABO">Mother ABO Type</label><select id="motherABO"><option value="A">Type A</option><option value="B">Type B</option><option value="AB">Type AB</option><option value="O">Type O</option></select></div>
      <div class="form-group"><label for="motherRh">Mother Rh Factor</label><select id="motherRh"><option value="+">Rh+</option><option value="-">Rh-</option></select></div>
    </div>
    <button class="btn" onclick="calculate()">Calculate</button>
    <div class="result-box" id="resultBox">
      <h3>Possible Child Blood Types</h3>
      <div id="aboResults"></div>
      <div class="prob" id="rhProb"></div>
    </div>
    <div class="info-box">💡 ABO: A and B dominant, O recessive. Rh+ dominant, Rh- recessive.</div>
  </div>
  <div class="footer">Free ToolBase © 2024 | Client-side only, no data upload</div>
</div>
<div class="toast" id="toast"></div>
<script>
function calculate(){
  const aboAlleles={A:['A','O'],B:['B','O'],AB:['A','B'],O:['O','O']};
  const fA=document.getElementById('fatherABO').value,mA=document.getElementById('motherABO').value;
  const fR=document.getElementById('fatherRh').value,mR=document.getElementById('motherRh').value;
  const fAlleles=aboAlleles[fA],mAlleles=aboAlleles[mA];
  const results={};
  for(const a of fAlleles)for(const b of mAlleles){
    const combo=[a,b].sort().join('');
    const type=combo==='AA'?'A':combo==='AB'?'AB':combo==='BB'?'B':combo==='AO'?'A':combo==='BO'?'B':combo==='OO'?'O':combo;
    results[type]=(results[type]||0)+1;
  }
  const total=Object.values(results).reduce((s,v)=>s+v,0);
  let html='';
  for(const[t,c]of Object.entries(results)){
    html+=`<span class="blood-type">Type ${t}: ${Math.round(c/total*100)}%</span> `;
  }
  document.getElementById('aboResults').innerHTML=html;
  let rhHtml='';
  if(fR==='+'&&mR==='+')rhHtml='Rh+: 75%, Rh-: 25%';
  else if(fR==='-'&&mR==='-')rhHtml='Rh-: 100%';
  else rhHtml='Rh+: 50%, Rh-: 50%';
  document.getElementById('rhProb').textContent=rhHtml;
}
</script>
