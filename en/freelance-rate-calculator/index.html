<main class="container">
<div class="header"><h1>💼 Freelance Rate Calculator</h1><div class="lang-switch"><a href="../../freelance-rate-calculator/">中文</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Freelance Rate Calculator</p>
<div class="hero"><p>Calculate your ideal hourly and daily rates based on target income, billable days, expenses, and tax rate. Stop guessing and start pricing confidently.</p><span class="badge">Zero Dependencies · Works Offline</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="targetIncome">Target Annual Income ($)</label><input type="number" id="targetIncome" value="100000" min="0" step="1000"><div class="hint">Desired pre-tax annual income</div></div>
    <div class="input-group"><label for="billableDays">Billable Days per Year</label><input type="number" id="billableDays" value="190" min="1" max="365" step="1"><div class="hint">Actual work days after vacation/training</div></div>
    <div class="input-group"><label for="hoursPerDay">Hours per Day</label><input type="number" id="hoursPerDay" value="8" min="1" max="16" step="0.5"><div class="hint">Average actual working hours per day</div></div>
    <div class="input-group"><label for="expenses">Annual Operating Costs ($)</label><input type="number" id="expenses" value="10000" min="0" step="500"><div class="hint">Software, insurance, equipment, office, etc.</div></div>
    <div class="input-group"><label for="taxRate">Combined Tax Rate (%)</label><input type="number" id="taxRate" value="30" min="0" max="60" step="0.1"><div class="hint">Federal + State + Self-employment tax combined</div></div>
    <div class="input-group"><label for="vacationWeeks">Vacation/Sick Weeks</label><input type="number" id="vacationWeeks" value="4" min="0" max="12" step="1"><div class="hint">Non-working weeks (vacation + sick + training)</div></div>
    <div class="input-group"><label for="utilizationRate">Utilization Rate (%)</label><input type="number" id="utilizationRate" value="75" min="10" max="100" step="1"><div class="hint">Percentage of time actually billable</div></div>
    <div class="input-group"><label for="profitMargin">Target Profit Margin (%)</label><input type="number" id="profitMargin" value="20" min="0" max="50" step="1"><div class="hint">Profit above your costs</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn">🔍 Calculate</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-secondary" id="copyBtn">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">💰 Suggested Hourly Rate</div><div class="value" id="hourlyRate">-</div><div class="sub">Amount to charge per hour</div></div>
  <div class="result-card"><div class="label">📅 Suggested Daily Rate</div><div class="value" id="dailyRate">-</div><div class="sub">Amount to charge per day</div></div>
  <div class="result-card"><div class="label">📆 Monthly Revenue Target</div><div class="value" id="monthlyTarget">-</div><div class="sub">Average monthly invoice target</div></div>
  <div class="result-card"><div class="label">📊 Annual Revenue Needed</div><div class="value" id="annualRevenue">-</div><div class="sub">Including taxes and profit</div></div>
  <div class="result-card"><div class="label">🏦 After-Tax Income</div><div class="value" id="afterTax">-</div><div class="sub">Actual take-home pay</div></div>
  <div class="result-card"><div class="label">📈 Total Billable Hours/yr</div><div class="value" id="totalHours">-</div><div class="sub">Based on utilization rate</div></div>
</div>
<div class="info-section">
  <h2>📖 Freelance Pricing Guide</h2>
  <h3>How Rates Are Calculated</h3>
  <p>Rate = (Target Income + Costs) / (Billable Days × Hours/Day × Utilization) × (1 + Margin) / (1 - Tax Rate). Must cover all non-billable time, vacation, and taxes.</p>
  <h3>Utilization Rate Reference</h3>
  <p>Beginner: 50-60% | Experienced: 65-75% | Expert: 80-90%. Beginners need more time finding clients and learning.</p>
  <h3>Industry Rate Ranges</h3>
  <p>Web Dev: $50-150/hr | UI Design: $40-120/hr | Writing: $30-100/hr | Consulting: $100-300/hr | Translation: $25-80/hr</p>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
  const income=+$('targetIncome').value||0;
  const days=+$('billableDays').value||190;
  const hours=+$('hoursPerDay').value||8;
  const expenses=+$('expenses').value||0;
  const taxPct=(+$('taxRate').value||30)/100;
  const vacation=+$('vacationWeeks').value||4;
  const util=(+$('utilizationRate').value||75)/100;
  const margin=(+$('profitMargin').value||20)/100;
  const annualNeed=(income+expenses)*(1+margin);
  const totalBillableHours=days*hours*util;
  const hourly=totalBillableHours>0?annualNeed/(totalBillableHours*(1-taxPct)):0;
  const daily=hourly*hours;
  const monthly=annualNeed/12;
  const afterTax=income;
  $('hourlyRate').textContent=fmt(hourly);
  $('dailyRate').textContent=fmt(daily);
  $('monthlyTarget').textContent=fmt(monthly);
  $('annualRevenue').textContent=fmt(annualNeed);
  $('afterTax').textContent=fmt(afterTax);
  $('totalHours').textContent=Math.round(totalBillableHours)+' hrs';
}
function reset(){
  $('targetIncome').value=100000;$('billableDays').value=190;$('hoursPerDay').value=8;
  $('expenses').value=10000;$('taxRate').value=30;$('vacationWeeks').value=4;
  $('utilizationRate').value=75;$('profitMargin').value=20;
  ['hourlyRate','dailyRate','monthlyTarget','annualRevenue','afterTax','totalHours'].forEach(function(id){$(id).textContent='-';});
}
function copyResult(){
  const lines=['=== Freelance Rate Estimate ===',
    'Hourly Rate: '+$('hourlyRate').textContent,
    'Daily Rate: '+$('dailyRate').textContent,
    'Monthly Target: '+$('monthlyTarget').textContent,
    'Annual Revenue Needed: '+$('annualRevenue').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'));
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
