<body>
<header><a href="/en/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/percentage-difference/">中文</a></div></header>
<main>
  <h1>📊 Percentage Difference Calculator</h1>
  <p class="subtitle">Symmetric percentage difference using the average as baseline</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>Value A</label><input type="number" id="valA" placeholder="Enter value A" step="any"></div>
      <div class="form-group"><label>Value B</label><input type="number" id="valB" placeholder="Enter value B" step="any"></div>
    </div>
    <button class="btn" id="btnCalc">📊 Calculate Difference</button>
    <div class="result" id="result" style="display:none">
      <div>Percentage Difference</div>
      <div class="diff" id="diffResult">0%</div>
      <div class="detail" id="detailResult"></div>
      <div class="formula" id="formulaBox"></div>
    </div>
  </div>
</main>

<script>
document.getElementById('btnCalc').addEventListener('click',function(){
  var a=parseFloat(document.getElementById('valA').value);
  var b=parseFloat(document.getElementById('valB').value);
  if(isNaN(a)||isNaN(b)){alert('Please enter two valid numbers');return}
  var diff=Math.abs(a-b);
  var avg=(Math.abs(a)+Math.abs(b))/2;
  var pct=avg===0?0:(diff/avg*100);
  document.getElementById('diffResult').textContent=pct.toFixed(2)+'%';
  document.getElementById('detailResult').innerHTML='|A - B| = '+diff.toFixed(4)+'<br>Average = '+avg.toFixed(4)+'<br>A='+a+', B='+b;
  document.getElementById('formulaBox').textContent='Formula: |A - B| / ((|A| + |B|) / 2) × 100%';
  document.getElementById('result').style.display='block';
});
</script>
