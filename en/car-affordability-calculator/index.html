<body>

<div class="nav-back"><a href="/">🏠 Home</a> › <a href="/#tools">Tools</a> › <span>Car Affordability Calculator</span></div>
<div class="hero">
  <span style="font-size:2rem">🚗</span>
  <div><h1 style="font-size:1.5rem;color:#f1f5f9;margin-bottom:4px">Car Affordability Calculator</h1>
  <p>Calculate your affordable car price using the 20/4/10 rule</p></div>
  <span class="badge">🛡️ Client-side Only</span>
</div>
<div class="calculator-section">
  <h2>📊 Financial Info</h2>
  <div class="input-grid">
    <div class="input-group"><label>Monthly After-Tax Income ($)</label><input type="number" id="monthlyIncome" value="5000" min="0" step="100"><span class="hint">Take-home monthly income</span></div>
    <div class="input-group"><label>Planned Down Payment ($)</label><input type="number" id="downPayment" value="10000" min="0" step="500"><span class="hint">20% down payment recommended</span></div>
    <div class="input-group"><label>Interest Rate (%)</label><input type="number" id="interestRate" value="7" min="0" max="20" step="0.1"><span class="hint">New cars 5-8%, used higher</span></div>
    <div class="input-group"><label>Loan Term (months)</label><input type="number" id="loanTerm" value="48" min="12" max="84" step="12"><span class="hint">20/4/10 recommends ≤48 months</span></div>
  </div>
</div>
<div class="calculator-section">
  <h2>🔧 Monthly Car Ownership Costs</h2>
  <div class="input-grid">
    <div class="input-group"><label>Insurance ($/mo)</label><input type="number" id="insurance" value="150" min="0" step="10"></div>
    <div class="input-group"><label>Gas/Fuel ($/mo)</label><input type="number" id="gas" value="200" min="0" step="10"></div>
    <div class="input-group"><label>Maintenance ($/mo)</label><input type="number" id="maintenance" value="80" min="0" step="10"><span class="hint">Annual avg $800-$1,200</span></div>
    <div class="input-group"><label>Other Costs ($/mo)</label><input type="number" id="otherCosts" value="50" min="0" step="10"><span class="hint">Parking, registration, etc.</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">🔍 Calculate Car Budget</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear & Reset</button>
    <button class="btn btn-danger" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">🚗 Max Affordable Price</div><div class="value" id="maxCarPrice">$0</div><div class="sub" id="priceNote"></div></div>
  <div class="result-card"><div class="label">📅 Monthly Loan Payment</div><div class="value" id="monthlyPayment">$0</div><div class="sub" id="loanAmount"></div></div>
  <div class="result-card warning"><div class="label">💸 Total Monthly Cost</div><div class="value" id="totalMonthly">$0</div><div class="sub" id="incomeRatio"></div></div>
</div>
<div class="calculator-section" id="breakdownSection" style="display:none">

  <table class="breakdown-table">
    <thead><tr><th>Cost Item</th><th>Monthly</th><th>Annual</th><th>Share of Income</th></tr></thead>

  </table>
</div>
<div class="info-section">
  <h2>📘 20/4/10 Smart Car Buying Rule</h2>
  <h3>Down payment at least 20%</h3><p>Reduces loan principal, avoiding negative equity (loan > car value).</p>
  <h3>Loan term max 4 years</h3><p>Pay off within 4 years to reduce interest. Avoid 7-8 year loans with high total interest.</p>
  <h3>Monthly car costs ≤ 10% of income</h3><p>Includes payment + insurance + gas + maintenance. Ensures quality of life and emergency savings are not affected.</p>
  <h3>Data Security</h3><p>All calculations are done locally in your browser. Your data is never uploaded.</p>
</div>

<script>
function formatCurrency(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function calculate(){
  var income=parseFloat(document.getElementById('monthlyIncome').value)||0;
  var down=parseFloat(document.getElementById('downPayment').value)||0;
  var rate=parseFloat(document.getElementById('interestRate').value)||0;
  var term=parseInt(document.getElementById('loanTerm').value)||48;
  var insurance=parseFloat(document.getElementById('insurance').value)||0;
  var gas=parseFloat(document.getElementById('gas').value)||0;
  var maint=parseFloat(document.getElementById('maintenance').value)||0;
  var other=parseFloat(document.getElementById('otherCosts').value)||0;
  if(income<=0||term<1){showToast('Please enter valid numbers');return}
  var maxMonthly=income*0.1;
  var nonLoanCosts=insurance+gas+maint+other;
  var maxLoanPayment=Math.max(0,maxMonthly-nonLoanCosts);
  var r=rate/100/12;
  var maxLoan;
  if(r===0)maxLoan=maxLoanPayment*term;
  else maxLoan=maxLoanPayment*(1-Math.pow(1+r,-term))/r;
  var maxPrice=down+maxLoan;
  var loanAmt=Math.max(0,maxPrice-down);
  var payment;
  if(r===0)payment=loanAmt/term;
  else payment=loanAmt*r/(1-Math.pow(1+r,-term));
  if(loanAmt<=0)payment=0;
  var totalMonthly=payment+nonLoanCosts;
  document.getElementById('maxCarPrice').textContent=formatCurrency(maxPrice);
  document.getElementById('priceNote').textContent='Incl. down payment:'+formatCurrency(down);
  document.getElementById('monthlyPayment').textContent=formatCurrency(payment);
  document.getElementById('loanAmount').textContent='Loan:'+formatCurrency(loanAmt);
  document.getElementById('totalMonthly').textContent=formatCurrency(totalMonthly);
  document.getElementById('incomeRatio').textContent='of income: '+(totalMonthly/income*100).toFixed(1)+'%';
  var items=[
    {name:'Loan Payment',amt:payment},{name:'Insurance',amt:insurance},{name:'Gas/Fuel',amt:gas},{name:'Maintenance',amt:maint},{name:'Other Costs',amt:other}
  ];
  var tbody=document.getElementById('breakdownBody');
  tbody.innerHTML='';
  items.forEach(function(item){
    tbody.innerHTML+='<tr><td>'+item.name+'</td><td>'+formatCurrency(item.amt)+'</td><td>'+formatCurrency(item.amt*12)+'</td><td>'+(income>0?(item.amt/income*100).toFixed(1):'0.0')+'%</td></tr>';
  });
  tbody.innerHTML+='<tr><td>Total</td><td>'+formatCurrency(totalMonthly)+'</td><td>'+formatCurrency(totalMonthly*12)+'</td><td>'+(income>0?(totalMonthly/income*100).toFixed(1):'0.0')+'%</td></tr>';
  document.getElementById('breakdownSection').style.display='block';
  showToast('✅ Calculation Complete');
}
function clearAll(){
  document.getElementById('monthlyIncome').value='5000';
  document.getElementById('downPayment').value='10000';
  document.getElementById('interestRate').value='7';
  document.getElementById('loanTerm').value='48';
  document.getElementById('insurance').value='150';
  document.getElementById('gas').value='200';
  document.getElementById('maintenance').value='80';
  document.getElementById('otherCosts').value='50';
  document.getElementById('maxCarPrice').textContent='$0';
  document.getElementById('priceNote').textContent='';
  document.getElementById('monthlyPayment').textContent='$0';
  document.getElementById('loanAmount').textContent='';
  document.getElementById('totalMonthly').textContent='$0';
  document.getElementById('incomeRatio').textContent='';
  document.getElementById('breakdownSection').style.display='none';
  showToast('🔄 Reset Complete');
}
function copyResults(){
  var lines=['Car Affordability Results','---',
    'Max Price: '+document.getElementById('maxCarPrice').textContent+' ('+document.getElementById('priceNote').textContent+')',
    'Monthly Payment: '+document.getElementById('monthlyPayment').textContent+' ('+document.getElementById('loanAmount').textContent+')',
    'Total Monthly: '+document.getElementById('totalMonthly').textContent+' ('+document.getElementById('incomeRatio').textContent+')'
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('📋 Copied')}).catch(function(){showToast('Copy failed')});
}
calculate();
</script>
