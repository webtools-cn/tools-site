<body>
<div class="container">
<div class="nav-back"><a href="/">← Home</a> / JSON Array to CSV</div>
<div class="header">
<h1>🔄 JSON 数 rounds转 CSV</h1>
<div class="lang-switch"><a href="/json-array-to-csv/">中文</a><a href="/en/json-array-to-csv/" class="active">English</a></div>
</div>
<div class="card">
<h2>📥 JSON Input</h2>
<textarea id="jsonInput" rows="8" placeholder='[{"name":"张三","age":25,"city":"北京"},{"name":"李四","age":30,"city":"上海"},{"name":"王五","age":28,"city":"广州"}]'></textarea>
<div class="options-row">
<label>CSVDelimiter:</label>
<select id="delimiter">
<option value=",">Comma (,)</option>
<option value=";">Semicolon (;)</option>
<option value="\t">Tab</option>
<option value="|">Pipe (|)</option>
</select>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="convertBtn">🔄 Convert to CSV</button>
<button class="btn btn-secondary" id="sampleBtn">📋 Load Sample</button>
<button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
</div>
<div id="errorMsg" class="error-msg"></div>
</div>
<div class="card">
<h2>📤 CSV Output</h2>
<textarea id="csvOutput" readonly placeholder="转换结果将在这里显示..." rows="6"></textarea>
<div class="char-count"><span id="outputCount">0</span> 字符</div>
<div class="btn-row">
<button class="btn btn-primary" id="copyBtn">📋 Copy CSV</button>
<button class="btn btn-secondary" id="downloadBtn">💾 Download CSV</button>
</div>
</div>
<div class="card">
<h2>💡 Instructions</h2>
<p style="color:#94a3b8;font-size:.9rem;line-height:1.8">
将JSON对象数 rounds粘贴到input box，自动提取所有对象的key作为CSV列名。<br>
<strong>示例: </strong><br>
Input: <code style="color:#22d3ee">[{"name":"张三","age":25}]</code><br>
CSV Output: <code style="color:#22d3ee;white-space:pre">name,age
张三,25</code>
</p>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
var jsonInput=document.getElementById('jsonInput');
var csvOutput=document.getElementById('csvOutput');
var delimiterEl=document.getElementById('delimiter');
var errorMsg=document.getElementById('errorMsg');
var outputCount=document.getElementById('outputCount');
var toast=document.getElementById('toast');

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(function(){toast.classList.remove('show')},2000);
}

function flattenValue(val){
  if(val===null||val===undefined) return '';
  if(typeof val==='object') return JSON.stringify(val);
  return String(val);
}

function convert(){
  errorMsg.style.display='none';
  var raw=jsonInput.value.trim();
  if(!raw){
    errorMsg.textContent='请输入JSON数 rounds数据';
    errorMsg.style.display='block';
    return;
  }
  var data;
  try{data=JSON.parse(raw);}catch(e){
    errorMsg.textContent='JSON格式错误: '+e.message;
    errorMsg.style.display='block';
    return;
  }
  if(!Array.isArray(data)){
    errorMsg.textContent='输入必须是JSON数 rounds（以[开头以]结尾）';
    errorMsg.style.display='block';
    return;
  }
  if(data.length===0){
    errorMsg.textContent='JSON数 rounds为空';
    errorMsg.style.display='block';
    return;
  }
  var keys=Object.keys(data[0]);
  var delim=delimiterEl.value==='\\t'?'\t':delimiterEl.value;
  var lines=[keys.join(delim)];
  for(var i=0;i<data.length;i++){
    var row=[];
    for(var j=0;j<keys.length;j++){
      var val=flattenValue(data[i][keys[j]]);
      if(val.indexOf(delim)!==-1||val.indexOf('"')!==-1||val.indexOf('\n')!==-1){
        val='"'+val.replace(/"/g,'""')+'"';
      }
      row.push(val);
    }
    lines.push(row.join(delim));
  }
  var csv=lines.join('\n');
  csvOutput.value=csv;
  outputCount.textContent=csv.length;
}

document.getElementById('convertBtn').addEventListener('click',convert);
document.getElementById('sampleBtn').addEventListener('click',function(){
  jsonInput.value='[\n  {"name":"张三","age":25,"city":"北京","email":"zhangsan@example.com"},\n  {"name":"李四","age":30,"city":"上海","email":"lisi@example.com"},\n  {"name":"王五","age":28,"city":"广州","email":"wangwu@example.com"}\n]';
  convert();
});
document.getElementById('clearBtn').addEventListener('click',function(){
  jsonInput.value='';
  csvOutput.value='';
  outputCount.textContent='0';
  errorMsg.style.display='none';
});
document.getElementById('copyBtn').addEventListener('click',function(){
  var val=csvOutput.value.trim();
  if(!val){showToast('Nothing to copy');return}
  navigator.clipboard.writeText(val).then(function(){showToast('✅ 已复制到剪贴板')}).catch(function(){csvOutput.select();document.execCommand('copy');showToast('✅ 已复制')});
});
document.getElementById('downloadBtn').addEventListener('click',function(){
  var val=csvOutput.value.trim();
  if(!val){showToast('Nothing to download');return}
  var blob=new Blob(['\uFEFF'+val],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='data.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✅ CSV文件已下载');
});
</script>
</body>
</html>
