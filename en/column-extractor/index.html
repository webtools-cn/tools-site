<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Column Extractor - Free ToolBase</title>
  <meta name="description" content="Online CSV/TSV column extractor — paste tabular data, specify column numbers or names, and extract only the columns you need. Free, no sign-up.">
  <meta property="og:title" content="Column Extractor - Free ToolBase">
  <meta property="og:description" content="Online CSV/TSV column extractor — extract specific columns from tabular data instantly.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Column Extractor",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "description": "Online CSV/TSV column extractor — extract specific columns from tabular data.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <style>
  :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --error: #ef4444; --success: #22c55e; --radius: 8px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--text-secondary); text-decoration: none; font-size: .9rem; }
  header nav a:hover { color: var(--primary); }
  main { flex: 1; max-width: 960px; margin: 0 auto; padding: 24px 16px; width: 100%; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: var(--text-secondary); margin-bottom: 20px; font-size: .9rem; }
  .control-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .control-row label { font-size: .85rem; color: var(--text-secondary); white-space: nowrap; }
  .control-row select, .control-row input { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .85rem; }
  .control-row select:focus, .control-row input:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
  .control-row input { flex: 1; min-width: 150px; }
  .split-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .split-panel { grid-template-columns: 1fr; } }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .panel h3 { font-size: .85rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  textarea { width: 100%; min-height: 220px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-family: 'Fira Code', monospace; font-size: .82rem; resize: vertical; line-height: 1.5; }
  textarea:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
  #outputArea { background: #f1f5f9; min-height: 220px; }
  .btn { padding: 10px 20px; border: none; border-radius: var(--radius); font-size: .9rem; cursor: pointer; font-weight: 600; transition: all .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .stats { font-size: .8rem; color: var(--text-secondary); margin-top: 8px; }
  footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 16px 24px; text-align: center; color: var(--text-secondary); font-size: .8rem; }
  footer a { color: var(--primary); text-decoration: none; }
  #toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: .85rem; opacity: 0; transform: translateY(20px); transition: all .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--error); }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Free ToolBase</a>
    <nav>
      <a href="/">中文</a>
      <a href="/en/">Home</a>
    </nav>
  </header>
  <main>
    <h1>Column Extractor</h1>
    <p class="subtitle">Extract specific columns from CSV/TSV data. Paste your data, choose delimiter and columns, and extract instantly.</p>
    <div class="control-row">
      <label>Delimiter:</label>
      <select id="delimiter">
        <option value=",">Comma (,)</option>
        <option value="\t">Tab</option>
        <option value=";">Semicolon (;)</option>
        <option value="|">Pipe (|)</option>
      </select>
      <label>Columns:</label>
      <input type="text" id="columnsInput" placeholder="e.g. 1,3,5 or name,email" value="1,3">
      <button class="btn btn-primary" id="extractBtn">Extract</button>
      <button class="btn btn-secondary" id="copyBtn">Copy Result</button>
    </div>
    <div class="split-panel">
      <div class="panel">
        <h3>Input Data</h3>
        <textarea id="inputData" placeholder="Paste CSV/TSV data...">Name,Age,City,Role,Salary
John,28,New York,Engineer,75000
Jane,32,London,Designer,68000
Bob,25,Tokyo,Manager,82000
Alice,30,Paris,Operations,55000</textarea>
        <div class="stats" id="inputStats"></div>
      </div>
      <div class="panel">
        <h3>Extracted Result</h3>
        <textarea id="outputArea" readonly placeholder="Extracted columns will appear here..."></textarea>
        <div class="stats" id="outputStats"></div>
      </div>
    </div>
  </main>
  <footer>
    <p>Free ToolBase &copy; 2025 · <a href="/en/">Home</a></p>
  </footer>
  <div id="toast"></div>
  <script>
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error show' : 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }
  function parseDelimiter(val) {
    if (val === '\\t') return '\t';
    return val;
  }
  function extractColumns() {
    var input = document.getElementById('inputData').value;
    var delim = parseDelimiter(document.getElementById('delimiter').value);
    var colsInput = document.getElementById('columnsInput').value.trim();
    var outputArea = document.getElementById('outputArea');
    if (!input) { outputArea.value = ''; showToast('Please enter data first', true); return; }
    if (!colsInput) { outputArea.value = ''; showToast('Please specify columns to extract', true); return; }
    var lines = input.split('\n').filter(function(l){ return l.trim() !== ''; });
    if (lines.length === 0) { outputArea.value = ''; showToast('No valid data rows', true); return; }
    var header = lines[0].split(delim).map(function(h){ return h.trim(); });
    var colIndices = [];
    var colParts = colsInput.split(',').map(function(c){ return c.trim(); });
    for (var i = 0; i < colParts.length; i++) {
      var part = colParts[i];
      if (/^\d+$/.test(part)) {
        var idx = parseInt(part) - 1;
        if (idx >= 0 && idx < header.length) colIndices.push(idx);
      } else {
        var found = header.indexOf(part);
        if (found !== -1) colIndices.push(found);
      }
    }
    if (colIndices.length === 0) { outputArea.value = ''; showToast('No matching columns found. Check column names or numbers.', true); return; }
    var result = [];
    for (var r = 0; r < lines.length; r++) {
      var cells = lines[r].split(delim);
      var row = [];
      for (var c = 0; c < colIndices.length; c++) {
        var ci = colIndices[c];
        row.push(ci < cells.length ? cells[ci].trim() : '');
      }
      result.push(row.join(delim));
    }
    outputArea.value = result.join('\n');
    document.getElementById('inputStats').textContent = lines.length + ' rows, ' + header.length + ' columns';
    document.getElementById('outputStats').textContent = result.length + ' rows, ' + colIndices.length + ' columns';
    showToast('Successfully extracted ' + colIndices.length + ' column(s)');
  }
  document.getElementById('extractBtn').addEventListener('click', extractColumns);
  document.getElementById('inputData').addEventListener('input', function() {
    var lines = this.value.split('\n').filter(function(l){ return l.trim(); });
    var delim = parseDelimiter(document.getElementById('delimiter').value);
    var cols = lines.length > 0 ? lines[0].split(delim).length : 0;
    document.getElementById('inputStats').textContent = lines.length + ' rows, ' + cols + ' columns';
  });
  document.getElementById('delimiter').addEventListener('change', extractColumns);
  document.getElementById('copyBtn').addEventListener('click', function() {
    var output = document.getElementById('outputArea');
    if (!output.value) { showToast('Nothing to copy', true); return; }
    output.select();
    document.execCommand('copy');
    showToast('Copied to clipboard');
  });
  extractColumns();
  </script>
</body>
</html>
