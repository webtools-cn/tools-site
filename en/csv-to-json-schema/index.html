<header><h1>📊 CSV to JSON Schema</h1></header>
<main>
  <div class="card">

John,25,john@example.com
Jane,30,jane@example.com"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnConvert">🔄 Generate Schema</button>
      <button class="btn btn-secondary" id="btnCopy">📋 Copy</button>

<script>
const csvInput = document.getElementById('csvInput');
const schemaOutput = document.getElementById('schemaOutput');
const errorMsg = document.getElementById('errorMsg');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function inferType(val) {
  if (val === '' || val === 'null' || val === 'NULL') return 'null';
  if (/^(true|false)$/i.test(val)) return 'boolean';
  if (/^-?\d+$/.test(val)) return 'integer';
  if (/^-?\d+\.\d+$/.test(val)) return 'number';
  if (/^\d{4}-\d{2}-\d{2}/.test(val)) return 'string';
  return 'string';
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('CSV needs at least a header row and one data row');
  const headers = lines[0].split(',').map(h => h.trim()).filter(h => h);
  if (!headers.length) throw new Error('Header row is empty');
  const rows = lines.slice(1).map(line => line.split(',').map(c => c.trim()));
  const typeCounts = {};
  headers.forEach(h => { typeCounts[h] = {}; });
  rows.forEach(row => {
    row.forEach((val, i) => {
      if (i < headers.length) {
        const t = inferType(val);
        typeCounts[headers[i]][t] = (typeCounts[headers[i]][t] || 0) + 1;
      }
    });
  });
  return { headers, typeCounts };
}

document.getElementById('btnConvert').addEventListener('click', () => {
  errorMsg.textContent = '';
  const val = csvInput.value.trim();
  if (!val) { showToast('Please enter CSV data'); return; }
  try {
    const { headers, typeCounts } = parseCSV(val);
    const props = {};
    headers.forEach(h => {
      const counts = typeCounts[h];
      const bestType = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      props[h] = { type: bestType === 'integer' || bestType === 'number' ? 'number' : bestType };
      if (counts['null']) props[h].type = [bestType, 'null'];
    });
    const schema = {
      '$schema': 'https://json-schema.org/draft/2020-12/schema',
      type: 'object',
      properties: props,
      required: headers,
      additionalProperties: false
    };
    schemaOutput.textContent = JSON.stringify(schema, null, 2);
  } catch(e) {
    errorMsg.textContent = '❌ ' + e.message;
    schemaOutput.textContent = 'Generation failed';
  }
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = schemaOutput.textContent;
  if (text === 'Waiting for input...' || text === 'Generation failed') { showToast('Please generate schema first'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => showToast('Copy failed'));
});

document.getElementById('btnClear').addEventListener('click', () => {
  csvInput.value = '';
  schemaOutput.textContent = 'Waiting for input...';
  errorMsg.textContent = '';
});
</script>
