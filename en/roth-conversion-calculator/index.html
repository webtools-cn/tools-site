<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="iraBalance">Traditional IRA Balance ($)</label><input type="number" id="iraBalance" value="100000" min="0" step="1000"><div class="hint">Your current Traditional IRA balance</div></div>
    <div class="input-group"><label for="convertAmount">Conversion Amount ($)</label><input type="number" id="convertAmount" value="50000" min="0" step="1000"><div class="hint">Amount you plan to convert (partial allowed)</div></div>
    <div class="input-group"><label for="currentTaxRate">Current Marginal Tax Rate (%)</label><input type="number" id="currentTaxRate" value="24" min="0" max="50" step="0.1"><div class="hint">Your current federal marginal tax rate</div></div>
    <div class="input-group"><label for="retireTaxRate">Expected Retirement Tax Rate (%)</label><input type="number" id="retireTaxRate" value="22" min="0" max="50" step="0.1"><div class="hint">Expected marginal tax rate at retirement</div></div>
    <div class="input-group"><label for="annualReturn">Expected Annual Return (%)</label><input type="number" id="annualReturn" value="7" min="0" max="20" step="0.1"><div class="hint">Expected annual investment return (~7% S&P 500 avg)</div></div>
    <div class="input-group"><label for="yearsToRetire">Years Until Retirement</label><input type="number" id="yearsToRetire" value="20" min="1" max="50" step="1"><div class="hint">Years until you plan to retire</div></div>

  </div>
  <div class="btn-row">

<div class="info-section">
  <h2>📖 About Roth IRA Conversion</h2>
  <h3>What is a Roth Conversion?</h3>
  <p>Roth conversion is moving funds from a Traditional IRA to a Roth IRA. You pay income tax on the converted amount now, but all future growth and qualified withdrawals are tax-free.</p>
  <h3>Conversion Strategies</h3>
  <p>1) Partial conversions: spread across years to avoid bracket creep; 2) Market downturn conversions: more shares for the same tax cost; 3) Pay taxes externally: keep the full converted amount invested.</p>
  <h3>2024 Tax Brackets (Single)</h3>
  <p>22% ($47,150-$100,525) | 24% ($100,525-$191,950) | 32% ($191,950-$243,725) | 35% ($243,725-$609,350) | 37% (>$609,350)</p>

<script>
(function(){
const $=s=>document.getElementById(s);
const iraBalance=$('iraBalance'),convertAmount=$('convertAmount'),currentTaxRate=$('currentTaxRate'),
retireTaxRate=$('retireTaxRate'),annualReturn=$('annualReturn'),yearsToRetire=$('yearsToRetire'),
paymentMethod=$('paymentMethod');
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
const balance=+iraBalance.value,convert=Math.min(+convertAmount.value,balance),
curTax=+currentTaxRate.value/100,retTax=+retireTaxRate.value/100,
ret=+annualReturn.value/100,years=+yearsToRetire.value,method=paymentMethod.value;
if(convert<=0){showToast('Conversion amount must be greater than 0');return}
if(years<1){showToast('Years to retirement must be at least 1');return}
let taxDue,rothInvested;
if(method==='withhold'){taxDue=convert*curTax;rothInvested=convert-taxDue}
else{taxDue=convert*curTax;rothInvested=convert}
const rothFinal=rothInvested*Math.pow(1+ret,years);
const tradPreTax=convert*Math.pow(1+ret,years);
const tradFinal=tradPreTax*(1-retTax);
const netSavings=rothFinal-tradFinal;
let recommendation,cardClass;
if(netSavings>5000){recommendation='✅ Strongly Recommend';cardClass='good'}
else if(netSavings>0){recommendation='✅ Recommend';cardClass='good'}
else if(netSavings>-5000){recommendation='⚠️ Marginal';cardClass=''}
else{recommendation='❌ Not Recommended';cardClass='bad'}
let breakeven=-1;
if(netSavings>0){
for(let y=1;y<=years;y++){
const rothY=rothInvested*Math.pow(1+ret,y);
const tradY=convert*Math.pow(1+ret,y)*(1-retTax);
const gain=rothY-tradY-taxDue*Math.pow(1+ret,y);
if(gain>0){breakeven=y;break}
}
}
$('recommendation').textContent=recommendation;
$('taxDue').textContent=fmt(taxDue);
$('rothFinal').textContent=fmt(rothFinal);
$('tradFinal').textContent=fmt(tradFinal);
$('netSavings').textContent=fmt(netSavings);
$('breakeven').textContent=breakeven>0?breakeven+' yrs':'N/A';
const recCard=$('recommendation').parentElement;
recCard.className='result-card highlight '+cardClass;
}
function reset(){
iraBalance.value=100000;convertAmount.value=50000;currentTaxRate.value=24;
retireTaxRate.value=22;annualReturn.value=7;yearsToRetire.value=20;
paymentMethod.value='separate';
$('recommendation').textContent='-';$('taxDue').textContent='-';
$('rothFinal').textContent='-';$('tradFinal').textContent='-';
$('netSavings').textContent='-';$('breakeven').textContent='-';
$('recommendation').parentElement.className='result-card highlight';
}
function copyResult(){
const lines=['=== Roth IRA Conversion Analysis ===',
'Recommendation: '+$('recommendation').textContent,
'Tax Due: '+$('taxDue').textContent,
'Roth Final Value: '+$('rothFinal').textContent,
'Traditional After-tax: '+$('tradFinal').textContent,
'Net Savings/Loss: '+$('netSavings').textContent,
'Breakeven: '+$('breakeven').textContent];
navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
