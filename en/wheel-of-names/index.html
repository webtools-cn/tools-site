  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:700px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    h2{font-size:1.25rem;font-weight:600;margin-bottom:16px;color:var(--primary-dark)}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text-light)}
    input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .2s;box-sizing:border-box}

    canvas{max-width:100%}
    .pointer{font-size:2rem;margin-top:-10px;z-index:10;position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
    .result-box{text-align:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border-radius:16px;margin-top:12px}
    .result-text{font-size:1.4rem;font-weight:700;color:var(--primary)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border:none;border-radius:8px;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}

<body>
  <header>
    <h1>🎡 Wheel of Names</h1>
    <p>Spin the wheel - let fate decide</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>📝 Custom Names</h2>
      <div class="form-group"><label>Enter names (one per line)</label><textarea id="optionsInput">Option A
Option B
Option C
Option D
Option E
Option F</textarea></div>
      <button class="btn btn-secondary" onclick="initWheel()">🔄 Update Wheel</button>
    </div>
    <div class="wheel-container">

      <canvas id="wheel" width="400" height="400"></canvas>
    </div>

  <div class="toast" id="toast"></div>
  <script>
    let items = ['Option A','Option B','Option C','Option D','Option E','Option F'];
    let currentAngle = 0;
    let spinning = false;
    const colors = ['#4F46E5','#7C3AED','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444','#8B5CF6','#06B6D4','#F97316','#84CC16','#6366F1','#14B8A6','#E11D48','#0EA5E9','#A855F7','#22C55E','#EAB308','#64748B','#D946EF'];
    function initWheel(){
      const text = document.getElementById('optionsInput').value.trim();
      items = text.split('\n').filter(l=>l.trim());
      if(items.length<2){items=['Item 1','Item 2'];}
      if(items.length>20){items=items.slice(0,20);}
      document.getElementById('resultBox').style.display='none';
      drawWheel();
    }
    function drawWheel(angle=0){
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width/2, cy = canvas.height/2, r = 180;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const sliceAngle = (2*Math.PI)/items.length;
      items.forEach((item,i)=>{
        const start = angle + i*sliceAngle - Math.PI/2;
        const end = start + sliceAngle;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,end);
        ctx.closePath();
        ctx.fillStyle = colors[i%colors.length];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start+sliceAngle/2);
        ctx.textAlign='center';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px -apple-system,BlinkMacSystemFont,sans-serif';
        ctx.fillText(item.length>10?item.slice(0,9)+'..':item, r*0.6, 5);
        ctx.restore();
      });
      ctx.beginPath();
      ctx.arc(cx,cy,20,0,2*Math.PI);
      ctx.fillStyle='#fff';
      ctx.fill();
      ctx.strokeStyle='#e2e8f0';
      ctx.lineWidth=3;
      ctx.stroke();
    }
    function spin(){
      if(spinning)return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      const targetIdx = Math.floor(Math.random()*items.length);
      const sliceAngle = (2*Math.PI)/items.length;
      const targetAngle = -targetIdx*sliceAngle + Math.PI/2;
      const extraSpins = (3+Math.floor(Math.random()*4))*2*Math.PI;
      const totalAngle = extraSpins + targetAngle;
      const duration = 3000;
      const startTime = Date.now();
      const startAngle = currentAngle;
      function animate(){
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed/duration,1);
        const eased = 1-Math.pow(1-progress,3);
        currentAngle = startAngle + totalAngle*eased;
        drawWheel(currentAngle);
        if(progress<1){
          requestAnimationFrame(animate);
        }else{
          spinning = false;
          document.getElementById('spinBtn').disabled = false;
          document.getElementById('resultBox').style.display = 'block';
          document.getElementById('resultText').textContent = items[targetIdx];
        }
      }
      requestAnimationFrame(animate);
    }
    initWheel();
  </script>
</body>
