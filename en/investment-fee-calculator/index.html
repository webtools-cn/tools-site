<body>
<div class="container">
<div class="nav-back"><a href="/">🏠 Home</a> › <a href="/#tools">Tools</a> › <span>Investment Fee Calculator</span></div>
<div class="hero">
  <span style="font-size:2rem">💸</span>
  <div><h1 style="font-size:1.5rem;color:#f1f5f9;margin-bottom:4px">Investment Fee Calculator</h1>
  <p>Quantify fund fees - see how much they eat your returns</p></div>
  <span class="badge">🛡️ Client-side Only</span>
</div>
<div class="calculator-section">
  <h2>📊 Investment Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label>Initial Investment ($)</label><input type="number" id="initial" value="100000" min="0" step="1000"></div>
    <div class="input-group"><label>Monthly Contribution ($)</label><input type="number" id="monthly" value="1000" min="0" step="100"></div>
    <div class="input-group"><label>Expected Annual Return (%)</label><input type="number" id="returnRate" value="7" min="0" max="30" step="0.1"></div>
    <div class="input-group"><label>Investment Period</label><input type="number" id="years" value="30" min="1" max="50"></div>
  </div>
</div>
<div class="calculator-section">
  <h2>⚖️ Fee Comparison</h2>
  <div class="fee-comparison">
    <div class="fee-box highlight"><div class="fee-label">🏦 Low-Fee Fund</div><input type="number" id="fee1" value="0.1" min="0" max="5" step="0.01" style="width:100%;padding:10px;background:#0f172a;border:1px solid rgba(6,182,212,.3);border-radius:8px;color:#22d3ee;font-size:1.1rem;text-align:center"><div class="hint" style="margin-top:4px">Index funds typically 0.03%-0.5%</div></div>
    <div class="fee-box"><div class="fee-label">📈 High-Fee Fund</div><input type="number" id="fee2" value="1.5" min="0" max="5" step="0.01" style="width:100%;padding:10px;background:#0f172a;border:1px solid rgba(148,163,184,.2);border-radius:8px;color:#f87171;font-size:1.1rem;text-align:center"><div class="hint" style="margin-top:4px">Active funds typically 1%-2%</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">🔍 Calculate Fee Difference</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear & Reset</button>
    <button class="btn btn-danger" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card"><div class="label">🏦 Low-Fee Final Value</div><div class="value" id="result1">$0</div><div class="sub" id="fee1Total"></div></div>
  <div class="result-card"><div class="label">📈 High-Fee Final Value</div><div class="value" id="result2">$0</div><div class="sub" id="fee2Total"></div></div>
  <div class="result-card warning"><div class="label">⚠️ Fee Difference</div><div class="value" id="diff">$0</div><div class="sub" id="diffPct"></div></div>
  <div class="result-card"><div class="label">💰 Total Fees Paid (High)</div><div class="value" id="fee2Cost">$0</div><div class="sub">Returns lost to fees</div></div>
</div>
<div class="info-section">
  <h2>📘 Why Fees Matter</h2>
  <h3>The Enemy of Compounding</h3>
  <p>A 1% fee difference can consume over 25% of potential returns over 30 years. $100,000 invested for 30 years at 7% with 1.5% vs 0.1% fees: over $140,000 difference.</p>
  <h3>How to Reduce Investment Fees</h3>
  <p>Choose low-cost index funds/ETFs (0.03%-0.5%). Avoid frequent trading and use commission-free platforms. Every 0.1% saved in fees nets tens of thousands over 30 years.</p>
  <h3>Data Security</h3>
  <p>All calculations are done locally in your browser. Your data is never uploaded. Works offline.</p>
</div>

<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a> · <a href="/privacy/">Privacy</a></p>
</div>

<div class="toast" id="toast"></div>
<script>
function formatCurrency(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function calculate(){
  var initial=parseFloat(document.getElementById('initial').value)||0;
  var monthly=parseFloat(document.getElementById('monthly').value)||0;
  var rate=parseFloat(document.getElementById('returnRate').value)||0;
  var years=parseInt(document.getElementById('years').value)||30;
  var fee1=parseFloat(document.getElementById('fee1').value)||0;
  var fee2=parseFloat(document.getElementById('fee2').value)||0;
  if(initial<0||years<1){showToast('Please enter valid numbers');return}
  var r=rate/100;
  var months=years*12;
  function futureValue(P,M,r,n){
    var total=P;
    for(var i=0;i<n;i++){total=total*(1+r/12)+M}
    return total;
  }
  var r1=rate/100-fee1/100;
  var r2=rate/100-fee2/100;
  var v1=futureValue(initial,monthly,r1,months);
  var v2=futureValue(initial,monthly,r2,months);
  var diff=v1-v2;
  var fee2Total=v2-futureValue(initial,monthly,rate/100,months);
  document.getElementById('result1').textContent=formatCurrency(v1);
  document.getElementById('fee1Total').textContent='Net Return: '+(r1*100).toFixed(2)+'%';
  document.getElementById('result2').textContent=formatCurrency(v2);
  document.getElementById('fee2Total').textContent='Net Return: '+(r2*100).toFixed(2)+'%';
  document.getElementById('diff').textContent=formatCurrency(diff);
  document.getElementById('diffPct').textContent='Share: '+(diff/v1*100).toFixed(1)+'%';
  document.getElementById('fee2Cost').textContent=formatCurrency(Math.abs(fee2Total));
  showToast('✅ Calculation Complete');
}
function clearAll(){
  document.getElementById('initial').value='100000';
  document.getElementById('monthly').value='1000';
  document.getElementById('returnRate').value='7';
  document.getElementById('years').value='30';
  document.getElementById('fee1').value='0.1';
  document.getElementById('fee2').value='1.5';
  document.getElementById('result1').textContent='$0';
  document.getElementById('fee1Total').textContent='';
  document.getElementById('result2').textContent='$0';
  document.getElementById('fee2Total').textContent='';
  document.getElementById('diff').textContent='$0';
  document.getElementById('diffPct').textContent='';
  document.getElementById('fee2Cost').textContent='$0';
  showToast('🔄 Reset Complete');
}
function copyResults(){
  var lines=['Investment Fee Comparison','---',
    'Low-Fee Final: '+document.getElementById('result1').textContent+' ('+document.getElementById('fee1Total').textContent+')',
    'High-Fee Final: '+document.getElementById('result2').textContent+' ('+document.getElementById('fee2Total').textContent+')',
    'Fee Difference: '+document.getElementById('diff').textContent+' ('+document.getElementById('diffPct').textContent+')',
    'Total Fees (High): '+document.getElementById('fee2Cost').textContent
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('📋 Copied')}).catch(function(){showToast('Copy failed')});
}
calculate();
</script>
