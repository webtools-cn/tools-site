<script>
const deck=[{n:'The Fool',e:'🃏',m:'New beginnings, spontaneity, free spirit'},{n:'The Magician',e:'🧙',m:'Manifestation, resourcefulness, power'},{n:'The High Priestess',e:'🔮',m:'Intuition, unconscious, inner voice'},{n:'The Empress',e:'👸',m:'Fertility, nature, abundance'},{n:'The Emperor',e:'👑',m:'Authority, structure, control'},{n:'The Hierophant',e:'⛪',m:'Tradition, conformity, spiritual guidance'},{n:'The Lovers',e:'💑',m:'Love, harmony, choices'},{n:'The Chariot',e:'🏇',m:'Determination, willpower, victory'},{n:'Strength',e:'🦁',m:'Courage, inner strength, patience'},{n:'The Hermit',e:'🏔️',m:'Introspection, solitude, wisdom'},{n:'Wheel of Fortune',e:'🎡',m:'Cycles, destiny, turning point'},{n:'Justice',e:'⚖️',m:'Fairness, truth, cause and effect'},{n:'The Hanged Man',e:'🙃',m:'Letting go, new perspective, surrender'},{n:'Death',e:'💀',m:'Transformation, endings, new beginnings'},{n:'Temperance',e:'☯️',m:'Balance, moderation, patience'},{n:'The Devil',e:'😈',m:'Attachment, temptation, materialism'},{n:'The Tower',e:'🗼',m:'Sudden change, upheaval, revelation'},{n:'The Star',e:'⭐',m:'Hope, inspiration, serenity'},{n:'The Moon',e:'🌙',m:'Illusion, fear, subconscious'},{n:'The Sun',e:'☀️',m:'Joy, success, vitality'},{n:'Judgement',e:'📯',m:'Rebirth, inner calling, absolution'},{n:'The World',e:'🌍',m:'Completion, accomplishment, travel'}],positions=['Past','Present','Future'];
function draw(){const cards=[];const used=new Set();while(cards.length<3){const i=Math.floor(Math.random()*deck.length);if(!used.has(i)){used.add(i);cards.push(deck[i])}}let html='';cards.forEach((c,i)=>{html+=`<div class="tarot-card card-reveal" style="animation-delay:${i*0.2}s"><span class="emoji">${c.e}</span><div class="name">${c.n}</div><div class="position">${positions[i]}</div><div class="meaning">${c.m}</div></div>`});document.getElementById('cardsGrid').innerHTML=html}
</script>
