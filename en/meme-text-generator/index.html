  <main>
    <h1>Meme Text Generator</h1>
    <p class="subtitle">Classic meme text generator with top/bottom text, custom color & size</p>
    <div class="tool-area">
      <label for="topText">Top Text</label>
      <input type="text" id="topText" placeholder="(e.g. ONE DOES NOT SIMPLY)" maxlength="60">
      <label for="bottomText">Bottom Text</label>
      <input type="text" id="bottomText" placeholder="(e.g. WALK INTO MORDOR)" maxlength="60">
      <div class="row">
        <div><label for="fontSize">Font Size</label><input type="number" id="fontSize" value="32" min="16" max="80"></div>
        <div><label for="fontColor">Color</label><input type="color" id="fontColor" value="#ffffff"></div>
        <div><label for="strokeColor">Outline</label><input type="color" id="strokeColor" value="#000000"></div>
      </div>
      <button class="btn" id="generateBtn">Generate Meme</button>
      <button class="btn btn-secondary" id="downloadBtn" style="margin-left:8px">Download</button>
      <div style="margin-top:20px;text-align:center;background:#000;border-radius:8px;padding:20px;min-height:200px;display:flex;align-items:center;justify-content:center" id="memeCanvas">
        <canvas id="canvas" style="max-width:100%"></canvas>
      </div>
      <script>
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = 600;
      canvas.height = 400;
      function drawMeme() {
        var top = document.getElementById('topText').value.toUpperCase();
        var bottom = document.getElementById('bottomText').value.toUpperCase();
        var fontSize = parseInt(document.getElementById('fontSize').value);
        var fontColor = document.getElementById('fontColor').value;
        var strokeColor = document.getElementById('strokeColor').value;
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold ' + fontSize + 'px Impact, Arial Black, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = fontColor;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = fontSize / 8;
        if (top) { ctx.strokeText(top, canvas.width/2, fontSize + 10); ctx.fillText(top, canvas.width/2, fontSize + 10); }
        if (bottom) { ctx.strokeText(bottom, canvas.width/2, canvas.height - 20); ctx.fillText(bottom, canvas.width/2, canvas.height - 20); }
        if (!top && !bottom) { ctx.fillStyle = '#666'; ctx.font = '20px sans-serif'; ctx.fillText('Enter text above to generate', canvas.width/2, canvas.height/2); }
      }
      document.getElementById('generateBtn').addEventListener('click', drawMeme);
      document.getElementById('downloadBtn').addEventListener('click', function() {
        var link = document.createElement('a');
        link.download = 'meme.png';
        link.href = canvas.toDataURL();
        link.click();
        showToast('Downloaded!');
      });
      drawMeme();
      </script>
    </div>
  </main>

  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('Copied!')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  }
  </script>
