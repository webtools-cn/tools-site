<body>
<div class="container">
<div class="header"><h1>👶 Child Tax Credit Calculator</h1><div class="lang-switch"><a href="../../child-tax-credit-calculator/" class="">Chinese</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Child Tax Credit Calculator</p>
<div class="hero"><p>Enter your filing status, annual income, and number of children to calculate your Child Tax Credit (CTC) amount. Supports 2024 and 2025 tax years.</p><span class="badge">Zero Dependency · Works Offline</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 Your Information</h2>
  <div class="input-grid">
    <div class="input-group"><label for="taxYear">Tax Year</label><select id="taxYear"><option value="2024">2024</option><option value="2025" selected>2025</option></select><div class="hint">Select the applicable tax year</div></div>
    <div class="input-group"><label for="filingStatus">Filing Status</label><select id="filingStatus"><option value="single">Single</option><option value="married_joint" selected>Married Filing Jointly</option><option value="married_separate">Married Filing Separately</option><option value="head_household">Head of Household</option></select><div class="hint">Your tax filing status</div></div>
    <div class="input-group"><label for="agi">Adjusted Gross Income AGI ($)</label><input type="number" id="agi" value="80000" min="0" step="100"><div class="hint">Your annual adjusted gross income</div></div>
    <div class="input-group"><label for="numChildren">Number of Qualifying Children</label><input type="number" id="numChildren" value="2" min="1" max="10" step="1"><div class="hint">Children under 17 who qualify</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()" id="calcBtn">📊 Calculate Credit</button>
    <button class="btn btn-secondary" onclick="copyResult()" id="copyBtn" style="display:none">📋 Copy Results</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Reset</button>
  </div>
</div>
<div class="calculator-section" id="resultSection" style="display:none">
  <h2>📈 Results</h2>
  <div class="results-grid">
    <div class="result-card highlight"><div class="label">Base CTC</div><div class="value" id="baseCTC">$0</div><div class="sub">$2,000 per child × count</div></div>
    <div class="result-card"><div class="label">Refundable Portion</div><div class="value" id="refundableCTC">$0</div><div class="sub">Available even with no tax</div></div>
    <div class="result-card"><div class="label">Actual CTC Amount</div><div class="value" id="actualCTC">$0</div><div class="sub">After income limits</div></div>
  </div>
  <div class="breakdown">
    <h3>📊 Detailed Breakdown</h3>
    <div class="item"><span>Tax Year</span><span class="val" id="detailYear">-</span></div>
    <div class="item"><span>Qualifying Children</span><span class="val" id="detailChildren">-</span></div>
    <div class="item"><span>Base CTC ($2,000/child)</span><span class="val" id="detailBase">-</span></div>
    <div class="item"><span>Phaseout Starts At</span><span class="val" id="detailPhaseoutStart">-</span></div>
    <div class="item"><span>Phaseout Reduction</span><span class="val" id="detailPhaseout">-</span></div>
    <div class="item"><span>Refundable CTC (max $1,700/child)</span><span class="val" id="detailRefundable">-</span></div>
    <div class="item"><span style="font-weight:600;color:#22d3ee">Total Actual CTC</span><span class="val" style="font-weight:600;color:#22d3ee" id="detailTotal">-</span></div>
  </div>
</div>

<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a> · <a href="../privacy/">Privacy</a></p><p style="font-size:.75rem;margin-top:8px">All calculations are performed in your browser. Your financial data is never uploaded.</p></div>

<div class="toast" id="toast"></div>
<script>
const CONFIG = {
  2024: { ctca: 2000, refundableMax: 1700, refundEarned: 2500, refundRate: 0.15, phaseout: { single: 200000, married_joint: 400000, married_separate: 200000, head_household: 200000 } },
  2025: { ctca: 2000, refundableMax: 1700, refundEarned: 2500, refundRate: 0.15, phaseout: { single: 200000, married_joint: 400000, married_separate: 200000, head_household: 200000 } }
};

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function formatMoney(n) { return '$' + Number(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function calculate() {
  var year = document.getElementById('taxYear').value;
  var status = document.getElementById('filingStatus').value;
  var agi = parseFloat(document.getElementById('agi').value) || 0;
  var numKids = parseInt(document.getElementById('numChildren').value) || 0;

  if (numKids < 1) { showToast('Please enter at least 1 qualifying child'); return; }

  var cfg = CONFIG[year];
  var baseCTC = cfg.ctca * numKids;
  var phaseoutStart = cfg.phaseout[status];
  var excess = Math.max(0, agi - phaseoutStart);
  var reduction = Math.ceil(excess / 1000) * 50;
  var afterPhaseout = Math.max(0, baseCTC - reduction);
  var refundablePerChild = Math.min(cfg.refundableMax, afterPhaseout / numKids);
  var refundable = refundablePerChild * numKids;

  document.getElementById('baseCTC').textContent = formatMoney(baseCTC);
  document.getElementById('refundableCTC').textContent = formatMoney(refundable);
  document.getElementById('actualCTC').textContent = formatMoney(afterPhaseout);
  document.getElementById('detailYear').textContent = year;
  document.getElementById('detailChildren').textContent = numKids;
  document.getElementById('detailBase').textContent = formatMoney(baseCTC);
  document.getElementById('detailPhaseoutStart').textContent = formatMoney(phaseoutStart);
  document.getElementById('detailPhaseout').textContent = formatMoney(reduction);
  document.getElementById('detailRefundable').textContent = formatMoney(refundable);
  document.getElementById('detailTotal').textContent = formatMoney(afterPhaseout);
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  var lines = ['Child Tax Credit Calculation Results', '---'];
  var items = document.querySelectorAll('#resultSection .item');
  items.forEach(function(i){
    lines.push(i.children[0].textContent + ': ' + i.children[1].textContent);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    showToast('✅ Copied to clipboard');
  }, function(){
    showToast('❌ Copy failed, please select manually');
  });
}

function clearAll() {
  document.getElementById('agi').value = '80000';
  document.getElementById('numChildren').value = '2';
  document.getElementById('taxYear').value = '2025';
  document.getElementById('filingStatus').value = 'married_joint';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  showToast('Reset complete');
}
</script>
