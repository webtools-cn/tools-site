<main>
<div class=container>
<div class=header><h1>💰 Crypto Tax Calculator</h1><div class=lang-switch><a href="index.html"></a><a href="../en/crypto-tax-calculator/" class=active>EN</a></div></div>

<div class=hero><p>Calculate capital gains tax on your cryptocurrency trades. Supports multiple buys/sells, FIFO cost basis, short/long-term rates, mining income, and staking rewards. Data stays local.</p><span class=badge>Zero Dependencies Offline Ready</span></div>
<div class=calculator-section>
 <h2>💹 Trade Records</h2>
 <div class=trade-list-header><span>BuySellFIFO</span></div>
 <div id=tradeList></div>
 <div class=btn-row>
 <button class=btn btn-secondary btn-sm id=addBuyBtn>+ Add Buy</button>
 <button class=btn btn-secondary btn-sm id=addSellBtn>+ Add Sell</button>
 <button class=btn btn-secondary btn-sm id=clearTradesBtn>🗑 Clear</button>
 </div>
</div>
<div class=calculator-section>
 <h2>⚙️ Rate</h2>
 <div class=input-grid>
 <div class=input-group><label for=shortTermRate>Short-Term Cap Gains Rate (%)</label><input type="number" id=shortTermRate value=30 min=0 max=60 step=0.1><div class=hint>Held <1yr, default 30% (US ordinary income reference)</div></div>
 <div class=input-group><label for=longTermRate>Long-Term Cap Gains Rate (%)</label><input type="number" id=longTermRate value=15 min=0 max=40 step=0.1><div class=hint>Held ≥1yr, default 15%</div></div>
 <div class=input-group><label for=miningIncome>Mining/Staking Income ($)</label><input type="number" id=miningIncome value=0 min=0 step=100><div class=hint>Taxed as ordinary income</div></div>
 <div class=input-group><label for=incomeTaxRate>Ordinary Income Tax Rate (%)</label><input type="number" id=incomeTaxRate value=22 min=0 max=50 step=0.1><div class=hint>For mining/staking income tax</div></div>
 </div>
 <div class=btn-row>
 <button class=btn btn-primary id=calcBtn>🔍 Tax</button>
 <button class=btn btn-secondary id=resetBtn>🔄 Reset</button>
 <button class=btn btn-secondary id=copyBtn>📋 Copy Report</button>
 </div>
</div>
<div class=results-grid>
 <div class=result-card highlight><div class=label>💰 Total Capital Gains</div><div class=value id=totalGain>-</div><div class=sub id=gainBreakdown>-</div></div>
 <div class=result-card><div class=label>📊 Estimated Total Tax</div><div class=value id=totalTax>-</div><div class=sub>incl. capital gains + income tax</div></div>
 <div class=result-card><div class=label>💵 Net Gain</div><div class=value id=netGain>-</div><div class=sub>After-tax amount</div></div>
</div>

 </table>
</div>
<div class=info-section>
 <h2>📖 US Crypto Tax Guide</h2>
 <h3>Taxable Events</h3>
 <ul><li>Selling crypto for fiat</li><li>Buying goods/services with crypto</li><li>Trading crypto for other crypto</li><li>Receiving mining/staking rewards</li><li>Receiving airdrops/forks</li></ul>

</div>

<script>
(function(){
const $=s=>document.getElementById(s);
let trades=[];
let tradeId=0;
function fmt(v){return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function addTrade(type){
const id=tradeId++;
const defDate=type==='buy'?'2023-01-15':'2024-06-15';
const defPrice=type==='buy'?'30000':'65000';
trades.push({id,type,date:defDate,price:+defPrice,qty:1});
renderTrades();
}
function removeTrade(id){
trades=trades.filter(t=>t.id!==id);
renderTrades();
}
function renderTrades(){
const container=$('tradeList');
container.innerHTML=trades.map(t=>`
<div class=trade-item>
<div class=field><label>Type</label><span style=color:${t.type==='buy'?'#22c55e':'#f87171'}">${t.type==='buy'?'Buy':'Sell'}</span></div>
<div class=field><label>Date</label><input type="date" value=${t.date} onchange=updateTrade(${t.id},'date',this.value)></div>
<div class=field><label>Price ($)</label><input type="number" value=${t.price} step=1 onchange=updateTrade(${t.id},'price',+this.value)></div>
<div class=field><label>Quantity</label><input type="number" value=${t.qty} step=0.01 min=0.01 onchange=updateTrade(${t.id},'qty',+this.value)></div>
<button class=remove-btn onclick=removeTrade(${t.id})>✕</button>
</div>`).join('');
}
window.updateTrade=function(id,field,value){
const t=trades.find(t=>t.id===id);
if(t)t[field]=value;
}
window.removeTrade=removeTrade;
function calc(){
if(trades.length===0){showToast('Please add trade records first');return}
const buys=trades.filter(t=>t.type==='buy').sort((a,b)=>a.date.localeCompare(b.date));
const sells=trades.filter(t=>t.type==='sell').sort((a,b)=>a.date.localeCompare(b.date));
let buyQueue=buys.map(b=>({...b,remaining:parseFloat(b.qty)}));
let shortGain=0,longGain=0,totalProceeds=0;
for(const sell of sells){
let need=parseFloat(sell.qty);
let proceeds=need*parseFloat(sell.price);
totalProceeds+=proceeds;
let costBasis=0;
while(need>0.001&&buyQueue.length>0){
const b=buyQueue[0];
const use=Math.min(need,b.remaining);
const bPrice=parseFloat(b.price);
costBasis+=use*bPrice;
b.remaining-=use;
need-=use;
if(b.remaining<0.001)buyQueue.shift();
}
const gain=proceeds-costBasis;
const holdDays=(new Date(sell.date)-new Date(buys[0].date))/(86400000);
if(holdDays>=365)longGain+=gain;
else shortGain+=gain;
}
const totalGain=shortGain+longGain;
const sRate=+$('shortTermRate').value/100;
const lRate=+$('longTermRate').value/100;
const mining=+$('miningIncome').value;
const iRate=+$('incomeTaxRate').value/100;
const capTax=shortGain*sRate+longGain*lRate;
const miningTax=mining*iRate;
const totalTax=capTax+miningTax;
const netGain=totalGain+mining-totalTax;
$('totalGain').textContent=fmt(totalGain);
$('gainBreakdown').textContent='Short: '+fmt(shortGain)+' | Long: '+fmt(longGain);
$('totalTax').textContent=fmt(totalTax);
$('netGain').textContent=fmt(netGain);
const detail=$('detailBody');
detail.innerHTML=`
<tr><td>Short-Term Capital Gains</td><td>${fmt(shortGain)}</td><td>${(sRate*100).toFixed(1)}%</td><td>${fmt(shortGain*sRate)}</td></tr>
<tr><td>Long-Term Capital Gains</td><td>${fmt(longGain)}</td><td>${(lRate*100).toFixed(1)}%</td><td>${fmt(longGain*lRate)}</td></tr>
<tr><td>Mining/Staking Income</td><td>${fmt(mining)}</td><td>${(iRate*100).toFixed(1)}%</td><td>${fmt(miningTax)}</td></tr>
<tr style=font-weight:600;color:#f97316><td>Total</td><td colspan=2>-</td><td>${fmt(totalTax)}</td></tr>`;
$('taxDetail').style.display='block';
}
function reset(){
trades=[{id:1,type:'buy',date:'2023-01-15',price:30000,qty:2},{id:2,type:'sell',date:'2024-06-15',price:65000,qty:1}];
tradeId=3;
$('shortTermRate').value=30;$('longTermRate').value=15;
$('miningIncome').value=0;$('incomeTaxRate').value=22;
['totalGain','totalTax','netGain'].forEach(id=>$(id).textContent='-');
$('gainBreakdown').textContent='-';
$('taxDetail').style.display='none';
renderTrades();
}
function copyResult(){
navigator.clipboard.writeText(['=== Crypto Tax Report ===',
'Total Capital Gains: '+$('totalGain').textContent,
'/Long: '+$('gainBreakdown').textContent,
'Tax: '+$('totalTax').textContent,
'Net Gain: '+$('netGain').textContent].join('\n'))
.then(()=>showToast('✅ Copied')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('addBuyBtn').addEventListener('click',()=>addTrade('buy'));
$('addSellBtn').addEventListener('click',()=>addTrade('sell'));
$('clearTradesBtn').addEventListener('click',()=>{trades=[];renderTrades();showToast('Cleared')});
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
reset();
})();
</script>
