<body>
<div class=container>
<div class=header><h1>💰 Rent vs Buy Calculator</h1><div class=lang-switch><a href="index.html"></a><a href="../en/rent-vs-buy-calculator/" class=active>EN</a></div></div>
<p class=nav-back><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › vs</p>
<div class=hero><p>Compare the long-term costs of renting vs buying a home. Includes mortgage, taxes, insurance, maintenance, rent increases, and appreciation. See which option saves more over your planned timeframe.</p><span class=badge>Zero Dependencies Offline Ready</span></div>
<div class=calculator-section>
 <h2>🏡 Buying Parameters</h2>
 <div class=input-grid>
 <div class=input-group><label for=homePrice>Home Price ($)</label><input type="number" id=homePrice value=400000 min=0 step=1000></div>
 <div class=input-group><label for=downPayment>Down Payment (%)</label><input type="number" id=downPayment value=20 min=0 max=100 step=0.1><div class=hint>Conventional loan recommends 20%</div></div>
 <div class=input-group><label for=interestRate>Interest Rate (%)</label><input type="number" id=interestRate value=6.5 min=0 max=20 step=0.1></div>
 <div class=input-group><label for=loanTerm>Loan Term (Years)</label><input type="number" id=loanTerm value=30 min=1 max=40 step=1></div>
 <div class=input-group><label for=propertyTax>Property Tax Rate (%)</label><input type="number" id=propertyTax value=1.2 min=0 max=5 step=0.01><div class=hint>Annual tax as % of home value</div></div>
 <div class=input-group><label for=homeInsurance>Home Insurance ($/yr)</label><input type="number" id=homeInsurance value=1500 min=0 step=100></div>
 <div class=input-group><label for=maintenance>Annual Maintenance (%)</label><input type="number" id=maintenance value=1 min=0 max=5 step=0.1><div class=hint>Annual maintenance as % of home value</div></div>
 <div class=input-group><label for=hoaFee>HOA Monthly Fee ($)</label><input type="number" id=hoaFee value=0 min=0 step=10></div>
 <div class=input-group><label for=closingCost>Closing Costs (%)</label><input type="number" id=closingCost value=5 min=0 max=10 step=0.1><div class=hint>Total buy/sell commission</div></div>
 <div class=input-group><label for=appreciation>Annual Appreciation (%)</label><input type="number" id=appreciation value=3 min=-5 max=20 step=0.1></div>
 </div>
</div>
<div class=calculator-section>
 <h2>🔑 Renting Parameters</h2>
 <div class=input-grid>
 <div class=input-group><label for=monthlyRent>Monthly Rent ($)</label><input type="number" id=monthlyRent value=2000 min=0 step=10></div>
 <div class=input-group><label for=rentGrowth>Annual Rent Growth (%)</label><input type="number" id=rentGrowth value=3 min=0 max=20 step=0.1></div>
 <div class=input-group><label for=rentInsurance>Renter Insurance ($/yr)</label><input type="number" id=rentInsurance value=200 min=0 step=10></div>
 </div>
</div>
<div class=calculator-section>
 <h2>⏱ General Parameters</h2>
 <div class=input-grid>
 <div class=input-group><label for=yearsStay>Years Staying</label><input type="number" id=yearsStay value=10 min=1 max=50 step=1><div class=hint>How many years you plan to stay</div></div>
 <div class=input-group><label for=investReturn>Investment Return (%)</label><input type="number" id=investReturn value=7 min=0 max=20 step=0.1><div class=hint>Annual return on investing the down payment (renters)</div></div>
 </div>
 <div class=btn-row>
 <button class=btn btn-primary id=calcBtn>🔍 Compare</button>
 <button class=btn btn-secondary id=resetBtn>🔄 Reset</button>
 <button class=btn btn-secondary id=copyBtn>📋 Copy Results</button>
 </div>
</div>

 <div class=result-card highlight><div class=label>🏡 Buying Net Worth</div><div class=value id=buyNet>-</div><div class=sub>Sale price - loan balance - costs</div></div>

</div>
<div class=results-grid>
 <div class=result-card><div class=label>📅 Monthly Payment</div><div class=value id=monthlyPayment>-</div></div>

</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(v){return '$'+v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
const price=+$('homePrice').value,downPct=+$('downPayment').value/100,
rate=+$('interestRate').value/100/12,term=+$('loanTerm').value*12,
pTax=+$('propertyTax').value/100/12,insurance=+$('homeInsurance').value/12,
maint=+$('maintenance').value/100/12,hoa=+$('hoaFee').value,
closeCost=+$('closingCost').value/100,appr=+$('appreciation').value/100,
rent=+$('monthlyRent').value,rGrow=+$('rentGrowth').value/100,
rIns=+$('rentInsurance').value/12,years=+$('yearsStay').value,
invRet=+$('investReturn').value/100;
if(price<=0||rent<=0||years<=0){showToast('Please enter valid values');return}
const down=price*downPct,loan=price-down;
const mPay=(loan*rate*Math.pow(1+rate,term))/(Math.pow(1+rate,term)-1);
const mExtra=pTax*price+insurance+maint*price+hoa;
const mTotal=mPay+mExtra;
let buyEquity=price,remainingLoan=loan;
for(let i=0;i<Math.min(years*12,term);i++)remainingLoan=remainingLoan*(1+rate)-mPay;
remainingLoan=Math.max(0,remainingLoan);
const homeValue=price*Math.pow(1+appr,years);
buyEquity=homeValue-remainingLoan-homeValue*closeCost;
const buyTotalCost=years*12*mTotal+down;
let rentPaid=0;let curRent=rent;
const invPrincipal=down;
let invValue=invPrincipal;
for(let y=0;y<years;y++){
rentPaid+=curRent*12+rIns*12;
invValue=invValue*(1+invRet)+(mTotal-curRent-rIns)*12;
curRent*=(1+rGrow);
}
if(invValue>0)invValue=invValue;
const rentNet=invValue-rentPaid;
const diff=buyEquity-rentNet;
$('buyNet').textContent=fmt(buyEquity);
$('rentNet').textContent=fmt(rentNet);
$('difference').textContent=fmt(Math.abs(diff));
$('monthlyPayment').textContent=fmt(mTotal);
$('buyTotalCost').textContent=fmt(buyTotalCost);
$('rentTotalCost').textContent=fmt(rentPaid);
$('recommend').textContent=diff>0?'🏡 Buying Wins':'🔑 Renting Wins';
const diffCard=$('difference').parentElement;
diffCard.className=diff>0?'result-card good':'result-card bad';
}
function reset(){
$('homePrice').value=400000;$('downPayment').value=20;
$('interestRate').value=6.5;$('loanTerm').value=30;
$('propertyTax').value=1.2;$('homeInsurance').value=1500;
$('maintenance').value=1;$('hoaFee').value=0;
$('closingCost').value=5;$('appreciation').value=3;
$('monthlyRent').value=2000;$('rentGrowth').value=3;
$('rentInsurance').value=200;$('yearsStay').value=10;
$('investReturn').value=7;
['buyNet','rentNet','difference','monthlyPayment','buyTotalCost','rentTotalCost'].forEach(id=>$(id).textContent='-');
$('recommend').textContent='-';
}
function copyResult(){
navigator.clipboard.writeText(['=== vs ===',
': '+$('buyNet').textContent,': '+$('rentNet').textContent,
': '+$('difference').textContent,': '+$('recommend').textContent,
': '+$('monthlyPayment').textContent,': '+$('buyTotalCost').textContent,
': '+$('rentTotalCost').textContent].join('\n'))
.then(()=>showToast('✅ Copied')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
