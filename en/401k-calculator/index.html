<div class="container">
<div class="header"><h1>💰 401k Retirement Calculator</h1><div class="lang-switch"><a href="/401k-calculator/" class="">中文</a><a href="../en/401k-calculator/" class="">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › 401k Retirement Calculator</p>
<div class="hero"><p>Calculate your 401k retirement savings, including employer matching contributions, compound growth, and pre-tax returns. Enter basic information to estimate your total account balance at retirement.</p><span class="badge">Zero Dependencies · Can Be Used Offline</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="currentAge">Current Age</label><input type="number" id="currentAge" value="30" min="18" max="70" step="1"><div class="hint">Your current age (18-70)</div></div>
    <div class="input-group"><label for="retireAge">Expected Retirement Age</label><input type="number" id="retireAge" value="65" min="50" max="75" step="1"><div class="hint">The age you plan to retire (50-75)</div></div>
    <div class="input-group"><label for="annualSalary">Annual Salary ($)</label><input type="number" id="annualSalary" value="80000" min="0" step="1000"><div class="hint">Your current pre-tax annual salary</div></div>
    <div class="input-group"><label for="currentBalance">Existing 401k Balance ($)</label><input type="number" id="currentBalance" value="20000" min="0" step="100"><div class="hint">The amount currently in your account</div></div>
    <div class="input-group"><label for="contributePct">Personal Contribution Rate (%)</label><input type="number" id="contributePct" value="10" min="0" max="100" step="0.1"><div class="hint">Percentage of pre-tax salary contributed to 401k</div></div>
    <div class="input-group"><label for="employerMatch">Employer Match Rate (%)</label><input type="number" id="employerMatch" value="50" min="0" max="100" step="1"><div class="hint">The rate at which your employer matches your contribution (e.g., 50% means $0.50 for every $1)</div></div>
    <div class="input-group"><label for="matchLimit">Employer Match Limit (%)</label><input type="number" id="matchLimit" value="6" min="0" max="100" step="0.1"><div class="hint">Cap on the percentage of salary that the employer matches</div></div>
    <div class="input-group"><label for="annualReturn">Expected Annual Return Rate (%)</label><input type="number" id="annualReturn" value="7" min="0" max="20" step="0.1"><div class="hint">Historical average is about 7% (S&P 500 long-term average)</div></div>
    <div class="input-group"><label for="salaryGrowth">Annual Salary Growth Rate (%)</label><input type="number" id="salaryGrowth" value="3" min="0" max="15" step="0.1"><div class="hint">Estimated annual salary increase</div></div>
    <div class="input-group"><label for="contributionLimit">Annual Contribution Limit ($)</label><input type="number" id="contributionLimit" value="23000" min="0" step="500"><div class="hint">$23,000 in 2024 (under 50 years old)</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn">🔍 Calculate</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-secondary" id="copyBtn">📋 Copy Results</button>
  </div>

</div>

<div class="info-section">
  <h2>📖 About the 401k Retirement Plan</h2>
  <h3>What is a 401k?</h3>
  <p>A 401k is the most common employer-sponsored retirement savings plan in the US. Employees contribute a portion of their pre-tax salary to the account, and employers typically match a certain percentage. Investment growth in the account is tax-deferred, and withdrawals after age 59.5 are taxed as ordinary income.</p>
  <h3>2024 Contribution Limits</h3>
  <p>Under 50: $23,000/year | 50 and older catch-up: $7,500 (total $30,500) | Total limit (including employer): $69,000</p>
  <h3>Employer Match Example</h3>
  <p>The most common plan: 50% match on the first 6% of salary (employee contributes 6% → employer gives 3%). Some companies offer a 100% match on the first 3-5%.</p>
  <h3>Tax Advantages</h3>
  <p>Traditional 401k: Tax-deductible at contribution, taxed at withdrawal. Roth 401k: Taxed at contribution, tax-free at withdrawal. This calculator uses Traditional 401k calculations.</p>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
const currentAge=$('currentAge'),retireAge=$('retireAge'),annualSalary=$('annualSalary'),
currentBalance=$('currentBalance'),contributePct=$('contributePct'),employerMatch=$('employerMatch'),
matchLimit=$('matchLimit'),annualReturn=$('annualReturn'),salaryGrowth=$('salaryGrowth'),
contributionLimit=$('contributionLimit');
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
const age=+currentAge.value,retire=+retireAge.value,salary=+annualSalary.value,
bal=+currentBalance.value,myPct=+contributePct.value/100,matchPct=+employerMatch.value/100,
limit=+matchLimit.value/100,ret=+annualReturn.value/100,grow=+salaryGrowth.value/100,
cap=+contributionLimit.value;
if(age>=retire){showToast('Retirement age must be greater than current age');return}
const years=retire-age;
let total=bal,totalMyContrib=0,totalMatch=0,totalGain=0;
let curSalary=salary;
for(let y=0;y<years;y++){
let myContrib=Math.min(curSalary*myPct,cap);
let match=Math.min(myContrib*matchPct,curSalary*limit);
totalMyContrib+=myContrib;
totalMatch+=match;
let yearContrib=myContrib+match;
total+=yearContrib;
total=total*(1+ret);
curSalary*=(1+grow);
}
totalGain=total-totalMyContrib-totalMatch-bal;
let taxRate=0.22;
$('totalValue').textContent=fmt(total);
$('yourContrib').textContent=fmt(totalMyContrib);
$('employerContrib').textContent=fmt(totalMatch);
$('investmentGain').textContent=fmt(totalGain);
$('taxSaving').textContent=fmt((totalMyContrib+totalMatch)*taxRate);
$('annualTotal').textContent=fmt(Math.min(salary*myPct,cap)+Math.min(Math.min(salary*myPct,cap)*matchPct,salary*limit));
drawChart(bal,totalMyContrib,totalMatch,totalGain,years);
}
function drawChart(init,your,match,gain,years){
const canvas=$('growthChart'),ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const w=canvas.parentElement.clientWidth-32,h=280;
canvas.width=w*dpr;canvas.height=h*dpr;
canvas.style.width=w+'px';canvas.style.height=h+'px';
ctx.scale(dpr,dpr);
ctx.clearRect(0,0,w,h);
const max=Math.max(init+your+match+gain,1);
const yrData=[];let v=init;
for(let i=0;i<=years;i++){yrData.push(v);v=(v+your/years+match/years)*(1+(+annualReturn.value/100))}
const scaleY=h/(max*1.1),barW=Math.max(2,(w-80)/years);
ctx.fillStyle='rgba(148,163,184,.15)';ctx.strokeStyle='rgba(148,163,184,.3)';
for(let i=0;i<=5;i++){const y=h-(max/5*i*scaleY);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.fillText('$'+(max/5*i).toFixed(0),2,y+4)}
ctx.fillStyle='rgba(34,211,238,.6)';
for(let i=0;i<years;i++){const x=40+i*barW,height=yrData[i]*scaleY;ctx.fillRect(x,h-height,barW-1,height)}
ctx.fillStyle='rgba(249,115,22,.4)';
for(let i=0;i<years;i++){const x=40+i*barW,height=(your+match)/years*i*scaleY;ctx.fillRect(x,h-height,barW-1,height)}
ctx.fillStyle='#22d3ee';ctx.font='12px sans-serif';ctx.fillText('📈 Total Value',w-80,20)
ctx.fillStyle='#f97316';ctx.fillText('🏢 Contributions',w-80,40)
}
function reset(){
currentAge.value=30;retireAge.value=65;annualSalary.value=80000;currentBalance.value=20000;
contributePct.value=10;employerMatch.value=50;matchLimit.value=6;annualReturn.value=7;
salaryGrowth.value=3;contributionLimit.value=23000;
$('totalValue').textContent='-';$('yourContrib').textContent='-';
$('employerContrib').textContent='-';$('investmentGain').textContent='-';
$('taxSaving').textContent='-';$('annualTotal').textContent='-';
const canvas=$('growthChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height)
}
function copyResult(){
const lines=['=== 401k Retirement Estimate ===',
'Total at retirement: '+$('totalValue').textContent,
'Personal contributions: '+$('yourContrib').textContent,
'Employer match: '+$('employerContrib').textContent,
'Investment returns: '+$('investmentGain').textContent,
'Pre-tax savings: '+$('taxSaving').textContent];
navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
