<header><a href="/en/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/emoji-background/">CN</a></div></header>
<main>
  <h1>🎨 Emoji Background Generator</h1>
  <p class="subtitle">Tile emojis across the canvas to create unique wallpapers</p>
  <div class="card">
    <div class="form-group"><label>Choose Emoji</label>
      <div class="emoji-picker" id="emojiPicker">
        <button class="emoji-btn active" data-emoji="🌟">🌟</button>
        <button class="emoji-btn" data-emoji="❤️">❤️</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="⭐">⭐</button>
        <button class="emoji-btn" data-emoji="💎">💎</button>
        <button class="emoji-btn" data-emoji="🎵">🎵</button>
        <button class="emoji-btn" data-emoji="🌸">🌸</button>
        <button class="emoji-btn" data-emoji="🍀">🍀</button>
        <button class="emoji-btn" data-emoji="🦋">🦋</button>
        <button class="emoji-btn" data-emoji="✨">✨</button>
        <button class="emoji-btn" data-emoji="🎉">🎉</button>
        <button class="emoji-btn" data-emoji="💡">💡</button>
        <button class="emoji-btn" data-emoji="🐱">🐱</button>
        <button class="emoji-btn" data-emoji="🌈">🌈</button>
        <button class="emoji-btn" data-emoji="🍕">🍕</button>
      </div>
    </div>
    <div class="row">
      <div class="form-group"><label>Emoji Size</label><input type="range" id="emojiSize" min="20" max="80" value="40"><span id="sizeVal" style="font-size:14px;color:var(--sub)">40px</span></div>
      <div class="form-group"><label>Spacing</label><input type="range" id="spacing" min="0" max="30" value="8"><span id="spaceVal" style="font-size:14px;color:var(--sub)">8px</span></div>
    </div>
    <div class="form-group"><label>Background Color</label><input type="color" id="bgColor" value="#1e293b"></div>
    <button class="btn" id="btnGen">🎨 Generate Background</button>
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <canvas id="canvas" width="600" height="400"></canvas>
      <div class="btn-row">
        <button class="btn-secondary" id="btnDownload">📥 Download PNG</button>
        <button class="btn-secondary" id="btnResize">📐 Set 1080p Wallpaper</button>
      </div>
    </div>
  </div>

<script>
var currentEmoji='🌟';
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
document.querySelectorAll('.emoji-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.emoji-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    currentEmoji=btn.dataset.emoji;
  });
});
document.getElementById('emojiSize').addEventListener('input',function(){
  document.getElementById('sizeVal').textContent=this.value+'px';
});
document.getElementById('spacing').addEventListener('input',function(){
  document.getElementById('spaceVal').textContent=this.value+'px';
});
document.getElementById('btnGen').addEventListener('click',function(){
  var size=parseInt(document.getElementById('emojiSize').value);
  var gap=parseInt(document.getElementById('spacing').value);
  var bg=document.getElementById('bgColor').value;
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=size+'px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  var step=size+gap;
  for(var y=step/2;y<canvas.height;y+=step){
    for(var x=step/2;x<canvas.width;x+=step){
      ctx.fillText(currentEmoji,x,y);
    }
  }
  document.getElementById('previewWrap').style.display='block';
});
document.getElementById('btnDownload').addEventListener('click',function(){
  var link=document.createElement('a');
  link.download='emoji-background.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
});
document.getElementById('btnResize').addEventListener('click',function(){
  canvas.width=1920;
  canvas.height=1080;
  document.getElementById('btnGen').click();
});
</script>
</body>
