<body>

<div class="container">
  <h1>☁️ Tag Cloud Generator</h1>
  <p class="subtitle">Enter keywords to generate a beautiful tag cloud instantly</p>

  <div class="form-group">

<script>
(function(){
  const tagsInput = document.getElementById('tagsInput');
  const colorScheme = document.getElementById('colorScheme');
  const layoutStyle = document.getElementById('layoutStyle');
  const tagShape = document.getElementById('tagShape');
  const generateBtn = document.getElementById('generateBtn');
  const exportBtn = document.getElementById('exportBtn');
  const tagCloud = document.getElementById('tagCloud');
  const toastEl = document.getElementById('toast');

  const colorSchemes = {
    vibrant: ['#EF4444','#F97316','#F59E0B','#84CC16','#06B6D4','#3B82F6','#8B5CF6','#EC4899','#14B8A6','#E11D48'],
    cool: ['#06B6D4','#0891B2','#0EA5E9','#3B82F6','#6366F1','#8B5CF6','#7C3AED','#2563EB','#0284C7','#0D9488'],
    warm: ['#EF4444','#F97316','#F59E0B','#EAB308','#F43F5E','#FB923C','#DC2626','#B45309','#EA580C','#D97706'],
    pastel: ['#FCA5A5','#FCD34D','#A7F3D0','#93C5FD','#C4B5FD','#FDA4AF','#86EFAC','#FDE68A','#BAE6FD','#DDD6FE'],
    mono: ['#1e293b','#334155','#475569','#64748b','#94a3b8','#cbd5e1','#0f172a','#334155','#475569','#64748b']
  };

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function parseTags(input) {
    const parts = input.split(/[\n,]+/);
    return parts.map(t => t.trim()).filter(t => t.length > 0).slice(0, 50);
  }

  function getTagSize(tag, tags, layout) {
    if (layout === 'spread') {
      const sizes = [14, 16, 18, 20, 22, 24, 26, 28];
      return sizes[Math.floor(Math.random() * sizes.length)];
    }
    const len = tag.length;
    if (len <= 3) return 20 + Math.random() * 8;
    if (len <= 6) return 16 + Math.random() * 6;
    if (len <= 10) return 14 + Math.random() * 4;
    return 12 + Math.random() * 2;
  }

  function getTagRotation(layout) {
    if (layout === 'cluster') return 0;
    const rots = [0, 0, 0, 0, 0, -2, 2, -5, 5];
    return rots[Math.floor(Math.random() * rots.length)];
  }

  function getShapeStyle(shape) {
    switch(shape) {
      case 'pill': return 'border-radius: 20px; padding: 4px 12px;';
      case 'square': return 'border-radius: 2px; padding: 4px 8px;';
      case 'rounded': return 'border-radius: 6px; padding: 3px 10px;';
      case 'plain': return 'background: none; padding: 2px 6px;';
      default: return 'border-radius: 6px; padding: 3px 10px;';
    }
  }

  function generate() {
    const input = tagsInput.value.trim();
    if (!input) { showToast('Please enter tags first'); return; }

    const tags = parseTags(input);
    if (tags.length === 0) { showToast('No valid tags found'); return; }

    const scheme = colorScheme.value;
    const layout = layoutStyle.value;
    const shape = tagShape.value;
    const colors = colorSchemes[scheme];

    let html = '';
    for (let i = 0; i < tags.length; i++) {
      const tag = tags[i];
      const color = colors[i % colors.length];
      const size = Math.round(getTagSize(tag, tags, layout));
      const rotation = getTagRotation(layout);
      const shapeStyle = getShapeStyle(shape);
      const bgStyle = shape === 'plain' ? '' : 'background:' + color + '22;';

      html += `<span class="tag" style="font-size:${size}px;color:${color};transform:rotate(${rotation}deg);${shapeStyle}${bgStyle}">${escapeHtml(tag)}</span>`;
    }

    tagCloud.innerHTML = html;
    tagCloud.classList.add('show');
    exportBtn.disabled = false;
    showToast(`✅ Generated ${tags.length} tags`);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function exportHTML() {
    const html = tagCloud.innerHTML;
    const full = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>.tag{display:inline-block;margin:4px 6px;}.tag-cloud{text-align:center;line-height:2.2;padding:32px;}</style><link rel="canonical" href="https://free-toolbase.com/en/tag-cloud/">
<meta property="og:image" content="https://free-toolbase.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

</head><body><div class="tag-cloud">${html}</div></body></html>`;
    const blob = new Blob([full], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tag-cloud.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('📋 HTML downloaded');
  }

  generateBtn.addEventListener('click', generate);
  exportBtn.addEventListener('click', exportHTML);
})();
</script>
