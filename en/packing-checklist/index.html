  <style>
    :root { --primary: #06B6D4; --primary-dark: #0891B2; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav a { color: var(--text-light); text-decoration: none; margin-left: 20px; font-size: 14px; }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 30px 20px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-light); margin-bottom: 24px; font-size: 15px; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
    .btn { padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .checklist { list-style: none; }
    .checklist li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .checklist input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
    .checklist label { flex: 1; font-size: 15px; cursor: pointer; }
    .checklist label.checked { text-decoration: line-through; color: var(--text-light); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin: 12px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
    .add-item { display: flex; gap: 8px; margin-top: 12px; }
    .add-item input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 13px; border-top: 1px solid var(--border); }
    .toast { position: fixed; top: 20px; right: 20px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(-10px); transition: all .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
<link rel="canonical" href="https://free-toolbase.com/en/packing-checklist/">

<body>
  <header>
    <a href="/en/" class="logo">Free ToolBase</a>
    <nav><a href="/en/">Home</a><a href="/">中文</a></nav>
  </header>
  <main>
    <h1>🧳 Packing Checklist</h1>
    <p class="subtitle">Auto-generate luggage list based on trip type, duration & weather — customize, export & print</p>

    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>Trip Type</label>
          <select id="tripType"><option value="leisure">Leisure</option><option value="business">Business</option><option value="beach">Beach</option><option value="hiking">Hiking</option><option value="winter">Winter/Ski</option></select>
        </div>
        <div class="form-group"><label>Days</label><input type="number" id="tripDays" value="5" min="1" max="60"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Weather</label>
          <select id="weather"><option value="warm">Warm (20-30°C)</option><option value="hot">Hot (30°C+)</option><option value="cool">Cool (10-20°C)</option><option value="cold">Cold (0-10°C)</option><option value="freezing">Freezing (&lt;0°C)</option></select>
        </div>
        <div class="form-group"><label>Luggage</label>
          <select id="luggageType"><option value="carryon">Carry-on</option><option value="checked">Checked Bag</option><option value="backpack">Backpack</option></select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="generateChecklist()">Generate Checklist</button>
    </div>

    <div class="card" id="checklistCard">
      <h3 style="margin-bottom:8px">📋 Packing List</h3>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div id="checklistContent" style="text-align:center;padding:30px;color:var(--text-light)">Select options and click "Generate Checklist"</div>
      <div class="add-item">
        <input type="text" id="customItem" placeholder="Add custom item...">
        <button class="btn btn-primary" onclick="addCustomItem()" style="padding:10px 16px;font-size:14px">+ Add</button>
      </div>
      <button class="btn btn-secondary" onclick="exportChecklist()" style="margin-top:12px">📄 Export List</button>
    </div>
  </main>
  <footer>© 2025 Free ToolBase · All tools free to use</footer>
  <div class="toast" id="toast"></div>

  <script>
    const baseItems = {
      leisure: ['Casual outfit x3', 'Comfortable shoes', 'Sunglasses', 'Swimwear', 'Sunscreen', 'Camera', 'Charger', 'Headphones', 'Toiletries', 'Basic meds'],
      business: ['Business suit x2', 'Dress shirts x3', 'Dress shoes', 'Tie/Scarf', 'Laptop', 'Charger', 'Business cards', 'Documents', 'Toiletries', 'Razor'],
      beach: ['Swimwear x2', 'Beach towel', 'Sunscreen SPF50+', 'Sunglasses', 'Sandals', 'Sun hat', 'Waterproof bag', 'Power bank', 'Toiletries', 'Bug spray'],
      hiking: ['Rain jacket', 'Hiking boots', 'Quick-dry shirt x2', 'Trekking poles', 'Headlamp', 'Water bottle', 'First aid kit', 'Map/Compass', 'Energy bars', 'Bug spray'],
      winter: ['Down jacket', 'Thermal wear x2', 'Gloves', 'Scarf', 'Beanie', 'Snow boots', 'Hand cream', 'Hand warmers', 'Ski goggles', 'Lip balm']
    };
    const weatherAddons = {
      hot: ['Sunscreen SPF50+', 'Sun hat', 'Mini fan'],
      warm: ['Sunscreen', 'Sunglasses', 'Light jacket'],
      cool: ['Light jacket', 'Long pants', 'Scarf'],
      cold: ['Heavy coat', 'Thermal wear', 'Gloves', 'Scarf'],
      freezing: ['Down jacket', 'Thermal wear x2', 'Gloves', 'Scarf', 'Beanie', 'Hand warmers', 'Thick socks x2']
    };
    const essentials = ['ID/Passport', 'Tickets/Boarding pass', 'Phone', 'Wallet', 'Keys', 'Charger', 'Power bank'];
    let currentItems = [];

    function generateChecklist() {
      const type = document.getElementById('tripType').value, days = parseInt(document.getElementById('tripDays').value) || 5;
      const weather = document.getElementById('weather').value;
      let items = [...essentials];
      const base = baseItems[type] || baseItems.leisure;
      base.forEach(item => {
        const match = item.match(/^(.+?)\s*x(\d+)$/);
        if (match) { const qty = Math.max(1, Math.round(parseInt(match[2]) * days / 5)); items.push(match[1] + ' x' + qty); }
        else items.push(item);
      });
      const wa = weatherAddons[weather] || [];
      items = [...new Set(items.concat(wa))];
      currentItems = items; renderChecklist();
      showToast('Checklist generated! ' + items.length + ' items');
    }

    function renderChecklist() {
      let html = '<ul class="checklist">';
      currentItems.forEach((item, i) => {
        html += '<li><input type="checkbox" id="item' + i + '" onchange="toggleItem(' + i + ')"><label for="item' + i + '">' + escapeHtml(item) + '</label></li>';
      });
      html += '</ul>';
      document.getElementById('checklistContent').innerHTML = html; updateProgress();
    }

    function toggleItem(i) { document.getElementById('item' + i).nextElementSibling.classList.toggle('checked', document.getElementById('item' + i).checked); updateProgress(); }

    function updateProgress() {
      const cbs = document.querySelectorAll('.checklist input[type="checkbox"]');
      if (cbs.length === 0) { document.getElementById('progressFill').style.width = '0%'; return; }
      document.getElementById('progressFill').style.width = (document.querySelectorAll('.checklist input[type="checkbox"]:checked').length / cbs.length * 100) + '%';
    }

    function addCustomItem() {
      const val = document.getElementById('customItem').value.trim(); if (!val) return;
      currentItems.push(val); document.getElementById('customItem').value = ''; renderChecklist(); showToast('Added: ' + val);
    }

    function exportChecklist() {
      if (currentItems.length === 0) { showToast('Generate checklist first'); return; }
      let text = 'Packing Checklist\n' + '='.repeat(30) + '\n\n';
      currentItems.forEach((item, i) => {
        const cb = document.getElementById('item' + i);
        text += (cb && cb.checked ? '☑' : '☐') + ' ' + item + '\n';
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'packing-checklist.txt'; a.click();
    }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
  </script>
</body>
</html>
