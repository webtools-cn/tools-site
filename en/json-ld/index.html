  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --bg: #0f172a;

    header {

      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;

    header a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 1.1rem; }

    main { flex: 1; max-width: 900px; margin: 0 auto; padding: 32px 16px; width: 100%; }

    .type-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .type-tab {
      padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; cursor: pointer; font-size: 0.85rem; color: var(--text2);
    }
    .type-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.9rem; color: var(--text2); margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 0.9rem; font-family: inherit;
    }
    .form-group textarea { min-height: 70px; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .btn {
      padding: 10px 20px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface2); }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
    .output-area {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-top: 16px; position: relative;
    }
    .output-area pre {
      white-space: pre-wrap; word-break: break-all; font-size: 0.85rem;
      color: var(--success); font-family: 'SF Mono', 'Fira Code', monospace;
      max-height: 400px; overflow-y: auto;
    }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text2); cursor: pointer; font-size: 0.8rem;
    }
    .copy-btn:hover { background: var(--primary); color: #fff; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--success); color: #fff;
      padding: 10px 20px; border-radius: var(--radius); z-index: 9999;
      opacity: 0; transform: translateY(10px); transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    footer { text-align: center; padding: 20px; color: var(--text2); font-size: 0.8rem; border-top: 1px solid var(--border); }
  </style>

  <script>
    var currentType = 'article';

    var schemas = {
      article: {
        fields: [
          {key:'headline',label:'Headline',placeholder:'Article headline',required:true},
          {key:'author',label:'Author',placeholder:'Author name'},
          {key:'datePublished',label:'Date Published',placeholder:'2025-01-15',type:'date'},
          {key:'dateModified',label:'Date Modified',placeholder:'2025-01-15',type:'date'},
          {key:'image',label:'Image URL',placeholder:'https://example.com/image.jpg'},
          {key:'description',label:'Description',placeholder:'Article summary'},
          {key:'publisher',label:'Publisher Name',placeholder:'Publisher organization'},
          {key:'url',label:'Article URL',placeholder:'https://example.com/article'}
        ]
      },
      product: {
        fields: [
          {key:'name',label:'Product Name',placeholder:'Product name',required:true},
          {key:'description',label:'Description',placeholder:'Product description'},
          {key:'image',label:'Image URL',placeholder:'https://example.com/product.jpg'},
          {key:'sku',label:'SKU',placeholder:'SKU-12345'},
          {key:'brand',label:'Brand',placeholder:'Brand name'},
          {key:'price',label:'Price',placeholder:'99.99'},
          {key:'priceCurrency',label:'Currency',placeholder:'USD'},
          {key:'availability',label:'Availability',placeholder:'InStock / OutOfStock'}
        ]
      },
      breadcrumb: {
        fields: [
          {key:'items',label:'Breadcrumb Items',placeholder:'Home,Category,Current Page',type:'textarea',required:true}
        ],
        help: 'Separate items with commas: Home,Tools,JSON-LD Generator'
      },
      faq: {
        fields: [
          {key:'items',label:'FAQ Items',placeholder:'Q: What is this?\nA: This is a tool\n\nQ: How to use?\nA: Fill in the form',type:'textarea',required:true}
        ],
        help: 'Separate Q&A pairs with blank lines, use "Q:" and "A:" prefixes'
      },
      organization: {
        fields: [
          {key:'name',label:'Organization Name',placeholder:'Company name',required:true},
          {key:'url',label:'Website URL',placeholder:'https://example.com'},
          {key:'logo',label:'Logo URL',placeholder:'https://example.com/logo.png'},
          {key:'description',label:'Description',placeholder:'Organization description'},
          {key:'sameAs',label:'Social Links',placeholder:'https://twitter.com/xxx, https://linkedin.com/xxx'}
        ]
      },
      localBusiness: {
        fields: [
          {key:'name',label:'Business Name',placeholder:'Business name',required:true},
          {key:'address',label:'Address',placeholder:'Full address'},
          {key:'telephone',label:'Phone',placeholder:'+1-555-123-4567'},
          {key:'openingHours',label:'Opening Hours',placeholder:'Mo-Fr 09:00-18:00'},
          {key:'priceRange',label:'Price Range',placeholder:'$$'},
          {key:'image',label:'Image URL',placeholder:'https://example.com/photo.jpg'}
        ]
      },
      recipe: {
        fields: [
          {key:'name',label:'Recipe Name',placeholder:'Recipe name',required:true},
          {key:'author',label:'Author',placeholder:'Author name'},
          {key:'description',label:'Description',placeholder:'Recipe description'},
          {key:'prepTime',label:'Prep Time',placeholder:'PT30M'},
          {key:'cookTime',label:'Cook Time',placeholder:'PT1H'},
          {key:'totalTime',label:'Total Time',placeholder:'PT1H30M'},
          {key:'recipeYield',label:'Servings',placeholder:'4'},
          {key:'image',label:'Image URL',placeholder:'https://example.com/recipe.jpg'},
          {key:'ingredients',label:'Ingredients (one per line)',placeholder:'200g flour\n2 eggs',type:'textarea'},
          {key:'instructions',label:'Instructions (one per line)',placeholder:'1. Mix flour and eggs\n2. Knead for 10 minutes',type:'textarea'}
        ]
      }
    };

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    function renderForm(type) {
      var schema = schemas[type];
      var html = '';
      schema.fields.forEach(function(f) {
        html += '<div class="form-group">';
        html += '<label>' + f.label + (f.required ? ' *' : '') + '</label>';
        if (f.type === 'textarea') {
          html += '<textarea id="fld_' + f.key + '" placeholder="' + (f.placeholder || '') + '" rows="4"></textarea>';
        } else if (f.type === 'date') {
          html += '<input type="date" id="fld_' + f.key + '">';
        } else {
          html += '<input type="text" id="fld_' + f.key + '" placeholder="' + (f.placeholder || '') + '">';
        }
        html += '</div>';
      });
      if (schema.help) {
        html += '<p style="color:var(--text2);font-size:0.8rem;margin-bottom:10px;">💡 ' + schema.help + '</p>';
      }
      document.getElementById('formContainer').innerHTML = html;
    }

    function generateJSONLD() {
      var schema = schemas[currentType];
      var data = {'@context': 'https://schema.org'};

      if (currentType === 'article') {
        data['@type'] = 'Article';
        var author = getVal('author');
        if (author) data.author = {'@type': 'Person', name: author};
        var pub = getVal('publisher');
        if (pub) data.publisher = {'@type': 'Organization', name: pub};
      } else if (currentType === 'product') {
        data['@type'] = 'Product';
        var price = getVal('price');
        var currency = getVal('priceCurrency') || 'USD';
        if (price) data.offers = {'@type': 'Offer', price: price, priceCurrency: currency};
        var avail = getVal('availability');
        if (avail) data.offers = data.offers || {};
        if (avail) data.offers.availability = 'https://schema.org/' + avail;
      } else if (currentType === 'breadcrumb') {
        data['@type'] = 'BreadcrumbList';
        var items = getVal('items').split(',').filter(Boolean);
        data.itemListElement = items.map(function(item, i) {
          return {'@type': 'ListItem', position: i + 1, name: item.trim()};
        });
      } else if (currentType === 'faq') {
        data['@type'] = 'FAQPage';
        var text = getVal('items');
        var blocks = text.split(/\n\n+/).filter(Boolean);
        data.mainEntity = blocks.map(function(b) {
          var lines = b.split('\n');
          var q = '', a = '';
          lines.forEach(function(l) {
            if (l.match(/^Q[：:]/i)) q = l.replace(/^Q[：:]\s*/i, '');
            if (l.match(/^A[：:]/i)) a = l.replace(/^A[：:]\s*/i, '');
          });
          return {'@type': 'Question', name: q || lines[0], acceptedAnswer: {'@type': 'Answer', text: a || lines.slice(1).join('\n')}};
        });
      } else if (currentType === 'organization') {
        data['@type'] = 'Organization';
        var sameAs = getVal('sameAs');
        if (sameAs) data.sameAs = sameAs.split(',').map(function(s) { return s.trim(); });
      } else if (currentType === 'localBusiness') {
        data['@type'] = 'LocalBusiness';
        var addr = getVal('address');
        if (addr) data.address = {'@type': 'PostalAddress', streetAddress: addr};
      } else if (currentType === 'recipe') {
        data['@type'] = 'Recipe';
        var ingredients = getVal('ingredients');
        if (ingredients) data.recipeIngredient = ingredients.split('\n').filter(Boolean);
        var instructions = getVal('instructions');
        if (instructions) data.recipeInstructions = instructions.split('\n').filter(Boolean).map(function(s, i) {
          return {'@type': 'HowToStep', position: i + 1, text: s.replace(/^\d+[\.\)]\s*/, '')};
        });
      }

      var simpleFields = ['headline','name','description','url','image','datePublished','dateModified','sku','brand','logo','telephone','openingHours','priceRange','prepTime','cookTime','totalTime','recipeYield'];
      simpleFields.forEach(function(k) {
        var v = getVal(k);
        if (v) data[k] = v;
      });

      var json = JSON.stringify(data, null, 2);
      document.getElementById('outputCode').textContent = json;
      document.getElementById('outputArea').style.display = 'block';
      return json;
    }

    function getVal(key) {
      var el = document.getElementById('fld_' + key);
      return el ? el.value.trim() : '';
    }

    function copyOutput() {
      var text = document.getElementById('outputCode').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(function() {
        showToast('✅ Copied to clipboard');
      }).catch(function() { showToast('❌ Copy failed'); });
    }

    function validateJSON() {
      var text = document.getElementById('outputCode').textContent;
      if (!text) {
        generateJSONLD();
        text = document.getElementById('outputCode').textContent;
      }
      try {
        JSON.parse(text);
        showToast('✅ Valid JSON');
      } catch(e) {
        showToast('❌ Invalid JSON: ' + e.message);
      }
    }

    document.getElementById('generateBtn').addEventListener('click', generateJSONLD);
    document.getElementById('validateBtn').addEventListener('click', validateJSON);
    document.getElementById('clearBtn').addEventListener('click', function() {
      document.querySelectorAll('#formContainer input, #formContainer textarea').forEach(function(el) { el.value = ''; });
      document.getElementById('outputArea').style.display = 'none';
    });
    document.getElementById('copyBtn').addEventListener('click', copyOutput);

    document.querySelectorAll('.type-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.type-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentType = tab.getAttribute('data-type');
        renderForm(currentType);
        document.getElementById('outputArea').style.display = 'none';
      });
    });

    renderForm('article';</script>
</body>
