<style>:root{--primary:#4F46E5;--primary-dark:#3730a3;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text-secondary:#94a3b8;--border:#334155;--success:#10b981;--warning:#f59e0b;--input-bg:#0f172a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
a{color:#06b6d4;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:24px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;color:#f1f5f9}
.lang-switch a{color:var(--text-secondary);font-size:.875rem;padding:4px 12px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.lang-switch a:hover{color:var(--text);border-color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.card h2{font-size:1.1rem;margin-bottom:16px;color:#f1f5f9}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.875rem;color:var(--text-secondary)}
.form-group input{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--primary)}
.input-row{display:flex;gap:12px}
.input-row .form-group{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#475569}
.btn-group{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.result-item{background:var(--bg);border-radius:8px;padding:16px;text-align:center}
.result-item .label{font-size:.75rem;color:var(--text-secondary);margin-bottom:4px}
.result-item .value{font-size:1.25rem;font-weight:700;color:var(--primary)}
.result-item .value.green{color:var(--success)}
.result-item .value.amber{color:var(--warning)}
.progress-bar{width:100%;height:8px;background:var(--border);border-radius:4px;margin-top:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--success));border-radius:4px;transition:width .5s}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:10px 24px;border-radius:8px;font-size:.875rem;border:1px solid var(--border);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.footer{margin-top:32px;text-align:center;color:var(--text-secondary);font-size:.75rem;padding:16px 0;border-top:1px solid var(--border)}
@media(max-width:480px){
  .input-row{flex-direction:column}
  .result-grid{grid-template-columns:1fr 1fr}
  .header h1{font-size:1.25rem}
}
</style>

<body>
<div class="container">
  <header class="header">
    <h1>🎯 Saving Goal Calculator</h1>
    <div class="lang-switch"><a href="/saving-goal-calculator/">中文</a></div>
  </header>

  <div class="card">
    <h2>Goal Settings</h2>
    <div class="input-row">
      <div class="form-group">
        <label>Target Amount ($)</label>
        <input type="number" id="goalAmount" placeholder="e.g. 30000" min="0" step="100">
      </div>
      <div class="form-group">
        <label>Current Savings ($)</label>
        <input type="number" id="currentSavings" placeholder="e.g. 5000" min="0" step="100" value="0">
      </div>
    </div>
    <div class="input-row">
      <div class="form-group">
        <label>Monthly Deposit ($)</label>
        <input type="number" id="monthlyDeposit" placeholder="e.g. 500" min="0" step="100">
      </div>
      <div class="form-group">
        <label>Annual Return (%)</label>
        <input type="number" id="annualReturn" placeholder="e.g. 3.0" min="0" max="100" step="0.1" value="0">
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="calculate()">📊 Calculate</button>
      <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>Savings Plan</h2>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="result-grid" style="margin-top:12px">
      <div class="result-item">
        <div class="label">Months Needed</div>
        <div class="value green" id="monthsNeeded">0</div>
      </div>
      <div class="result-item">
        <div class="label">Target Date</div>
        <div class="value" id="targetDate">-</div>
      </div>
      <div class="result-item">
        <div class="label">Final Balance</div>
        <div class="value green" id="finalAmount">$0</div>
      </div>
      <div class="result-item">
        <div class="label">Interest Earned</div>
        <div class="value amber" id="interestEarned">$0</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="copyResult()">📋 Copy Results</button>
    </div>
  </div>

  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

  <footer class="footer">
    <p>© 2025 Free ToolBase · Results are for reference only, not investment advice</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
function calculate(){
  const goal=parseFloat(document.getElementById('goalAmount').value)||0;
  const current=parseFloat(document.getElementById('currentSavings').value)||0;
  const monthly=parseFloat(document.getElementById('monthlyDeposit').value)||0;
  const annualRate=parseFloat(document.getElementById('annualReturn').value)||0;

  if(goal<=0){showToast('Please enter target amount');return;}
  if(monthly<=0&&annualRate<=0){showToast('Please enter monthly deposit or annual return');return;}

  const monthlyRate=annualRate/100/12;
  let balance=current;
  let months=0;
  const maxMonths=600;

  if(monthlyRate===0){
    if(monthly<=0){showToast('Monthly deposit required with 0% return');return;}
    months=Math.ceil((goal-current)/monthly);
    balance=current+months*monthly;
  }else{
    while(balance<goal&&months<maxMonths){
      balance=balance*(1+monthlyRate)+monthly;
      months++;
    }
  }

  if(months>=maxMonths){showToast('Cannot reach goal within 50 years. Increase monthly deposit.');return;}

  const totalDeposits=current+months*monthly;
  const interestEarned=balance-totalDeposits;

  const now=new Date();
  const targetDate=new Date(now);
  targetDate.setMonth(targetDate.getMonth()+months);

  document.getElementById('monthsNeeded').textContent=months+' months ('+Math.floor(months/12)+'y '+(months%12)+'m)';
  document.getElementById('targetDate').textContent=targetDate.toLocaleDateString('en-US',{year:'numeric',month:'long'});
  document.getElementById('finalAmount').textContent='$'+balance.toFixed(2);
  document.getElementById('interestEarned').textContent='$'+interestEarned.toFixed(2);

  const progress=Math.min((current/goal)*100,100);
  document.getElementById('progressFill').style.width=progress+'%';

  document.getElementById('resultCard').style.display='block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}

function clearAll(){
  document.getElementById('goalAmount').value='';
  document.getElementById('currentSavings').value='0';
  document.getElementById('monthlyDeposit').value='';
  document.getElementById('annualReturn').value='0';
  document.getElementById('resultCard').style.display='none';
}

function copyResult(){
  const lines=[
    '🎯 Saving Goal Results',
    'Months Needed: '+document.getElementById('monthsNeeded').textContent,
    'Target Date: '+document.getElementById('targetDate').textContent,
    'Final Balance: '+document.getElementById('finalAmount').textContent,
    'Interest Earned: '+document.getElementById('interestEarned').textContent
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard'));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
