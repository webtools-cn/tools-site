  <style>
  :root {
    --primary: #4F46E5;
    --primary-dark: #4338CA;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.1);
    --radius: 12px;
  }
  *,*::before,*::after {box-sizing:border-box;margin:0;padding:0}
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header .logo {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
  }
  header nav {display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header nav a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: .9rem;
    transition: color .2s;
  }
  header nav a:hover {color:var(--primary)}
  .lang-switch {

  }

  main {
    flex: 1;

    margin: 0 auto;

  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;

    margin-bottom: 28px;
    font-size: .95rem;
  }
  .tool-area {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .tool-area label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: .9rem;
    color: var(--text);
  }
  .tool-area input[type="text"],
  .tool-area input[type="number"],
  .tool-area textarea,
  .tool-area select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    font-family: inherit;
    margin-bottom: 16px;
    transition: border-color .2s;
    background: #fff;
  }
  .tool-area input:focus,
  .tool-area textarea:focus,
  .tool-area select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  }
  .tool-area textarea {min-height:120px;resize:vertical}
  .tool-area .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tool-area .row > * {flex:1;min-width:150px}
  .btn {
    display: inline-block;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover {background:var(--primary-dark);transform:translateY(-1px)}
  .btn:active {transform:translateY(0)}
  .btn-secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .btn-secondary:hover {background:rgba(79,70,229,.05)}
  .output {
    margin-top: 20px;
    padding: 16px;
    background: #f1f5f9;
    border-radius: 8px;
    font-size: .95rem;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 48px;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .output:empty {display:none}
  .result-item {
    padding: 12px;
    margin-bottom: 8px;
    background: #fff;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-secondary);
    font-size: .85rem;
    border-top: 1px solid var(--border);

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);

    color: #fff;

    border-radius: 8px;
    font-size: .9rem;
    z-index: 1000;

  .toast.show {opacity:1}
  @media (max-width: 600px) {

    h1 {font-size:1.4rem}

<body>
  <header>
    <a href="/en/" class="logo">Free ToolBase</a>
    <nav>
      <a href="/en/">Home</a>
      <a href="/blood-type/" class="lang-switch">中文</a>
    </nav>
  </header>
  <main>
    <h1>Blood Type Info</h1>
    <p class="subtitle">ABO/Rh blood type: inheritance, compatibility, personality, global distribution</p>
    <div class="tool-area">
      <label for="aboSelect">Your Blood Type</label>
      <select id="aboSelect">
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
        <option value="O+">O+</option><option value="O-">O-</option>
      </select>
      <button class="btn" id="getInfo">View Info</button>
      <div id="bloodResult" class="output"></div>
      <script>
      var allTypesLabel = 'All types';
      var bloodData = {
        'A+': {donate:['A+','AB+'], receive:['A+','A-','O+','O-'], personality:'Diligent, responsible, careful', global:'27%'},
        'A-': {donate:['A+','A-','AB+','AB-'], receive:['A-','O-'], personality:'Calm, patient, organized', global:'7%'},
        'B+': {donate:['B+','AB+'], receive:['B+','B-','O+','O-'], personality:'Creative, passionate, flexible', global:'22%'},
        'B-': {donate:['B+','B-','AB+','AB-'], receive:['B-','O-'], personality:'Independent, goal-oriented', global:'2%'},
        'AB+': {donate:['AB+'], receive:[allTypesLabel], personality:'Rational, adaptable, diplomatic', global:'5%'},
        'AB-': {donate:['AB+','AB-'], receive:['A-','B-','AB-','O-'], personality:'Mysterious, analytical', global:'1%'},
        'O+': {donate:['O+','A+','B+','AB+'], receive:['O+','O-'], personality:'Confident, leadership, sociable', global:'39%'},
        'O-': {donate:[allTypesLabel], receive:['O-'], personality:'大胆、坚定、universal donor', global:'6%'}
      };
      document.getElementById('getInfo').addEventListener('click', function() {
        var type = document.getElementById('aboSelect').value;
        var d = bloodData[type];
        var html = '<div style="background:#fff;padding:20px;border-radius:8px;border:1px solid #e2e8f0"><h3>' + type + ' Blood Type Info</h3>';
        html += '<p><strong>Can Donate To:</strong> ' + d.donate.join(', ') + '</p>';
        html += '<p><strong>Can Receive From:</strong> ' + d.receive.join(', ') + '</p>';
        html += '<p><strong>Personality:</strong> ' + d.personality + '</p>';
        html += '<p><strong>Global Distribution:</strong> ' + d.global + '</p></div>';
        document.getElementById('bloodResult').innerHTML = html;
      });
      </script>
    </div>
  </main>
  <footer>
    <p>&copy; 2024 <a href="/en/">Free ToolBase</a> | All tools run locally in your browser</p>
  </footer>
  <div class="toast" id="toast"></div>
  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('Copied!')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  }
  </script>
</body>
