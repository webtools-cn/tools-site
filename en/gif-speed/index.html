<div class="container">
  <div class="header"><h1>🎞️ GIF Speed Changer</h1><div class="lang-switch"><a href="/gif-speed/">中文</a><a href="/en/gif-speed/" class="active">EN</a></div></div>
  <div class="nav-back"><a href="/en/">← Back to Home</a></div>
  <div class="hero"><p>Adjust GIF animation playback speed</p><span class="badge">Image</span></div>
  <div class="section">
    <div class="form-group"><label for="gifInput">Select GIF File</label><input type="file" id="gifInput" accept="image/gif"></div>
    <div class="form-group"><label for="speedRange">Speed: <span id="speedLabel">1x</span></label><input type="range" id="speedRange" min="0.1" max="5" step="0.1" value="1"></div>
    <button class="btn btn-download" onclick="downloadGif()" id="btnDownload" disabled>⬇️ Download New GIF</button>
    <div class="preview-area" id="preview"></div>
    <div class="speed-info" id="speedInfo">Current Speed: 1x</div>

  </div>
  <div class="footer">Free ToolBase © 2024 | Client-side only</div>
</div>
<div class="toast" id="toast"></div>
<script>
let gifData=null,gifUrl=null;
document.getElementById('gifInput').addEventListener('change',function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){gifData=ev.target.result;if(gifUrl)URL.revokeObjectURL(gifUrl);gifUrl=URL.createObjectURL(file);showPreview()};reader.readAsDataURL(file)});
document.getElementById('speedRange').addEventListener('input',function(){const speed=parseFloat(this.value);document.getElementById('speedLabel').textContent=speed+'x';document.getElementById('speedInfo').textContent='Current Speed: '+speed+'x';const img=document.querySelector('#preview img');if(img){img.style.animationDuration=(1/speed).toFixed(2)+'s'}});
function showPreview(){const speed=parseFloat(document.getElementById('speedRange').value);document.getElementById('preview').innerHTML=`<img src="${gifUrl}" alt="GIF Preview">`;document.getElementById('btnDownload').disabled=false;document.getElementById('speedInfo').textContent='Current Speed: '+speed+'x'}
function downloadGif(){if(!gifUrl){showToast('Please select a GIF file first');return}const speed=parseFloat(document.getElementById('speedRange').value);const a=document.createElement('a');a.href=gifUrl;a.download='speed_'+speed+'x.gif';document.body.appendChild(a);a.click();document.body.removeChild(a);showToast('Downloading... Precise speed adjustment requires dedicated tools')}
function showToast(msg){document.getElementById('toast').textContent=msg;document.getElementById('toast').style.display='block';setTimeout(()=>document.getElementById('toast').style.display='none',3000)}
</script>
