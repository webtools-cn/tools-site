    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateSentence(lang) {
      const data = textData[lang];
      const len = getRandomInt(data.sentences[0], data.sentences[1]);
      const words = [];
      for (let i = 0; i < len; i++) {
        words.push(data.words[Math.floor(Math.random() * data.words.length)]);
      }
      const end = lang==='zh'||lang==='ja'?'。':lang==='ko'?'.':'.';
      return words.join('') + end;
    }

    function generateText() {
      const lang = document.getElementById('language').value;
      const paras = parseInt(document.getElementById('paragraphs').value) || 3;
      const sents = parseInt(document.getElementById('sentences').value) || 5;
      const result = [];
      for (let p = 0; p < paras; p++) {
        const paragraph = [];
        for (let s = 0; s < sents; s++) {
          paragraph.push(generateSentence(lang));
        }
        result.push(paragraph.join(''));
      }
      return result.join('\n\n');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
      const text = generateText();
      document.getElementById('output').textContent = text;
      const charCount = text.length;
      const paraCount = (text.match(/\n\n/g) || []).length + 1;
      document.getElementById('stats').textContent = charCount + ' characters, ' + paraCount + ' paragraphs';
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const text = document.getElementById('output').textContent;
      if (!text.trim() || text.includes('Click')) {
        showToast('Please generate text first');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard!');
      } catch {
        showToast('Copy failed, please select manually');
      }
    });

    window.addEventListener('DOMContentLoaded', () => document.getElementById('generateBtn').click());
  </script>
