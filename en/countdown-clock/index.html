    .preset-btn:hover, .preset-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.main-btn { background: var(--primary); color: #fff; border: none; padding: 14px 40px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: 600; transition: background .2s; }

 <main>
 <h1>⏱️ Countdown Clock</h1>
 <p class="desc">Set a target date and time to see remaining days, hours, minutes, and seconds. Plays a sound when countdown finishes.</p>
 <div class="card">
 <input type="datetime-local" id="targetInput">
 <div class="presets">
 <button class="preset-btn" data-minutes="5">5 min</button>
 <button class="preset-btn" data-minutes="30">30 min</button>
 <button class="preset-btn" data-hours="1">1 hour</button>
 <button class="preset-btn" data-hours="24">Tomorrow</button>
 <button class="preset-btn" data-days="7">7 days</button>
 </div>
 <button class="main-btn" id="startBtn">Start Countdown</button>
 <div class="countdown-display" id="countdownDisplay">
 <div class="time-block"><div class="num" id="days">0</div><div class="label">d</div></div>
 <div class="time-block"><div class="num" id="hours">0</div><div class="label">h</div></div>
 <div class="time-block"><div class="num" id="minutes">0</div><div class="label">m</div></div>
 <div class="time-block"><div class="num" id="seconds">0</div><div class="label">s</div></div>
 </div>
 <div class="finished" id="finishedMsg" style="display:none;">⏰ h to！</div>
 </div>
 </main>

 <script>
    let timer = null;
    let targetTime = null;
    const toast = document.getElementById('toast');
    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const finishedMsg = document.getElementById('finishedMsg');
    const startBtn = document.getElementById('startBtn');
    const targetInput = document.getElementById('targetInput');

    // Settingsdefaultvalueforbrightd
    const now = new Date();
    now.setDate(now.getDate() + 1);
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    targetInput.value = now.toISOString().slice(0, 16);

    function updateDisplay(diff) {
      if (diff <= 0) {
        daysEl.textContent = '0';
        hoursEl.textContent = '0';
        minutesEl.textContent = '0';
        secondsEl.textContent = '0';
        finishedMsg.style.display = 'block';
        clearInterval(timer);
        timer = null;
        startBtn.disabled = false;
        startBtn.textContent = 'Start Countdown';
        playBeep();
        return;
      }
      finishedMsg.style.display = 'none';
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      daysEl.textContent = d;
      hoursEl.textContent = h;
      minutesEl.textContent = m;
      secondsEl.textContent = s;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}
    }

    function startCountdown() {
      if (timer) { clearInterval(timer); timer = null; }
      const val = targetInput.value;
      if (!val) { showToast(''); return; }
      targetTime = new Date(val).getTime();
      const diff = targetTime - Date.now();
      if (diff <= 0) { showToast(''); return; }
      startBtn.disabled = true;
      startBtn.textContent = 'Counting down...';
      updateDisplay(diff);
      timer = setInterval(() => {
        const d = targetTime - Date.now();
        updateDisplay(d);
      }, 200);
    }

    startBtn.addEventListener('click', startCountdown);

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const now = new Date();
        if (btn.dataset.minutes) now.setMinutes(now.getMinutes() + parseInt(btn.dataset.minutes));
        if (btn.dataset.hours) now.setHours(now.getHours() + parseInt(btn.dataset.hours));
        if (btn.dataset.days) now.setDate(now.getDate() + parseInt(btn.dataset.days));
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        targetInput.value = now.toISOString().slice(0, 16);
      });
    });
  </script>
