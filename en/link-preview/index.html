<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:#06b6d4;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:0 16px}
header{background:#1e293b;border-bottom:1px solid #334155;padding:16px 0}
header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{font-size:1.3em;font-weight:700;color:#e2e8f0}
.back-link{color:#94a3b8;font-size:.9em}
main{padding:40px 0}
h1{font-size:2em;margin-bottom:8px;color:#f1f5f9}
.subtitle{color:#94a3b8;margin-bottom:32px}
.input-group{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.input-group input{flex:1;min-width:250px;padding:12px 16px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0;font-size:1em}
.input-group input:focus{outline:none;border-color:#06b6d4}
.btn{padding:12px 24px;background:#06b6d4;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1em;font-weight:600;white-space:nowrap}
.btn:hover{background:#0891b2}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.preview-card{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden;display:none}
.preview-card.show{display:block}
.preview-card .card-img{width:100%;height:200px;background:#334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:3em}
.preview-card .card-img img{width:100%;height:100%;object-fit:cover}
.preview-card .card-body{padding:20px}
.preview-card .card-title{font-size:1.3em;font-weight:700;color:#f1f5f9;margin-bottom:8px}
.preview-card .card-desc{color:#94a3b8;margin-bottom:12px;font-size:.95em}

.raw-data{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;margin-top:20px;display:none;overflow-x:auto}

<body>
<header><div class="container"><div class="header-left"><span class="logo">🔗 Free ToolBase</span><a href="/en/" class="back-link">← Back to Home</a></div></div></header>
<main><div class="container">
<h1>Link Preview Tool</h1>
<p class="subtitle">Enter a URL to preview the webpage's title, description and OG tags</p>
<div class="input-group">
  <input type="url" id="urlInput" placeholder="Enter URL, e.g. https://example.com" />
  <button class="btn" id="previewBtn">Preview</button>
</div>
<div id="error" class="error-msg"></div>
<div id="previewCard" class="preview-card">
  <div class="card-img" id="cardImg">🌐</div>
  <div class="card-body">
    <div class="card-title" id="cardTitle">-</div>
    <div class="card-desc" id="cardDesc">-</div>
    <div class="card-url" id="cardUrl">-</div>
    <div class="card-meta">
      <span id="cardSite">-</span>
      <span id="cardType">-</span>
    </div>
  </div>
</div>
<div class="raw-data" id="rawData">
  <h3>Raw OG Tag Data <button class="btn" id="copyBtn" style="padding:4px 12px;font-size:.8em;float:right">Copy</button></h3>
  <pre id="rawContent"></pre>
</div>
</div></main>
<footer><div class="container"><p>&copy; 2025 Free ToolBase. All tools are free to use.</p></div></footer>
<div id="toast"></div>
<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
function copyText(id){var el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.textContent||el.innerText).then(function(){showToast("Copied")})["catch"](function(){showToast("Copy failed")})}

document.getElementById('previewBtn').addEventListener('click', function(){
  var url = document.getElementById('urlInput').value.trim();
  var errEl = document.getElementById('error');
  var cardEl = document.getElementById('previewCard');
  var rawEl = document.getElementById('rawData');
  errEl.style.display = 'none';
  cardEl.classList.remove('show');
  rawEl.classList.remove('show');

  if(!url){ errEl.style.display='block'; errEl.textContent='Please enter a URL'; return; }
  if(!/^https?:\/\//i.test(url)){ url = 'https://' + url; document.getElementById('urlInput').value = url; }

  var btn = document.getElementById('previewBtn');
  btn.disabled = true; btn.textContent = 'Loading...';

  var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);

  fetch(proxyUrl, {signal: AbortSignal.timeout(10000)})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var title = (doc.querySelector('meta[property="og:title"]')||{}).content
        || (doc.querySelector('meta[name="twitter:title"]')||{}).content
        || doc.title || url;
      var desc = (doc.querySelector('meta[property="og:description"]')||{}).content
        || (doc.querySelector('meta[name="description"]')||{}).content
        || (doc.querySelector('meta[name="twitter:description"]')||{}).content
        || 'No description';
      var image = (doc.querySelector('meta[property="og:image"]')||{}).content
        || (doc.querySelector('meta[name="twitter:image"]')||{}).content
        || '';
      var siteName = (doc.querySelector('meta[property="og:site_name"]')||{}).content
        || new URL(url).hostname;
      var ogType = (doc.querySelector('meta[property="og:type"]')||{}).content || 'website';

      var ogTags = {};
      doc.querySelectorAll('meta[property^="og:"]').forEach(function(m){
        ogTags[m.getAttribute('property')] = m.getAttribute('content');
      });
      doc.querySelectorAll('meta[name^="twitter:"]').forEach(function(m){
        ogTags['twitter:'+m.getAttribute('name')] = m.getAttribute('content');
      });

      document.getElementById('cardTitle').textContent = title;
      document.getElementById('cardDesc').textContent = desc.length>200 ? desc.substring(0,200)+'...' : desc;
      document.getElementById('cardUrl').textContent = url;
      document.getElementById('cardSite').textContent = siteName;
      document.getElementById('cardType').textContent = ogType;

      var imgEl = document.getElementById('cardImg');
      if(image){
        imgEl.innerHTML = '<img src="'+image+'" alt="preview" onerror="this.parentElement.innerHTML=\'🌐\'">';
      } else {
        imgEl.innerHTML = '🌐';
      }

      document.getElementById('rawContent').textContent = JSON.stringify(ogTags, null, 2) || 'No OG tag data';
      cardEl.classList.add('show');
      rawEl.classList.add('show');
    })
    ["catch"](function(e){
      errEl.style.display='block';
      errEl.textContent = 'Failed to fetch link preview: ' + (e.message || 'Network error') + '. Tip: some sites may block cross-origin requests, please try another link.';
    })
    ["finally"](function(){
      btn.disabled = false; btn.textContent = 'Preview';
    });
});

document.getElementById('copyBtn').addEventListener('click', function(){ copyText('rawContent'); });

document.getElementById('urlInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('previewBtn').click();
});
</script>
</body>
</html>
