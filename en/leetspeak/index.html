    <div class="tool-panel">
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="basic">Basic</button>
        <button class="mode-btn" data-mode="advanced">Advanced</button>
        <button class="mode-btn" data-mode="ultra">Ultra</button>
      </div>
      <div class="label-row"><label for="inputText">Input Text</label><span id="charCount">0 chars</span></div>
      <textarea id="inputText" placeholder="Enter text here...&#10;Example: Hello World! I love coding.">Hello World! I love coding.</textarea>
      <div class="label-row"><label for="outputText">Leet Speak Output</label></div>
      <textarea id="outputText" readonly placeholder="Converted result will appear here..."></textarea>

        <button class="btn btn-primary" id="copyBtn">📋 Copy Result</button>
        <button class="btn btn-secondary" id="swapBtn">🔄 Swap</button>

  <script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const charCount = document.getElementById('charCount');
    const toastEl = document.getElementById('toast');
    let currentMode = 'basic';

    const leetMap = {
      basic: { 'a':'4', 'e':'3', 'i':'1', 'o':'0', 's':'5', 't':'7', 'l':'1' },
      advanced: { 'a':'4', 'b':'8', 'e':'3', 'g':'9', 'i':'1', 'l':'1', 'o':'0', 's':'5', 't':'7', 'z':'2', 'A':'4', 'E':'3', 'I':'1', 'O':'0', 'S':'5', 'T':'7' },
      ultra: { 'a':'@', 'b':'|3', 'c':'<', 'd':'|)', 'e':'3', 'f':'|=', 'g':'9', 'h':'#', 'i':'1', 'j':'_|', 'k':'|<', 'l':'1_', 'm':'|V|', 'n':'|\\|', 'o':'0', 'p':'|*', 'q':'()_', 'r':'|2', 's':'$', 't':'7', 'u':'|_|', 'v':'\\/', 'w':'\\/\\/', 'x':'><', 'y':'`/', 'z':'2', 'A':'@', 'B':'|3', 'C':'<', 'E':'3', 'H':'#', 'I':'1', 'M':'|V|', 'N':'|\\|', 'O':'0', 'S':'$', 'T':'7', 'W':'\\/\\/' }
    };

    function toLeet(text, mode) {
      const map = leetMap[mode];
      return text.split('').map(ch => map[ch] || ch).join('');
    }

    function updateOutput() {
      const text = inputText.value;
      outputText.value = toLeet(text, currentMode);
      charCount.textContent = text.length + ' chars';
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        updateOutput();
      });
    });

    inputText.addEventListener('input', updateOutput);
    document.getElementById('copyBtn').addEventListener('click', () => {
      if (!outputText.value) { showToast('Nothing to copy'); return; }
      navigator.clipboard.writeText(outputText.value).then(() => showToast('Copied!')).catch(() => showToast('Copy failed'));
    });
    document.getElementById('swapBtn').addEventListener('click', () => {
      const tmp = inputText.value;
      inputText.value = outputText.value;
      updateOutput();
    });
