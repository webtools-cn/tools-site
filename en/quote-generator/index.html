  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:700px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    .quote-box{background:linear-gradient(135deg,#eef2ff,#faf5ff);border-radius:16px;padding:40px 32px;text-align:center;margin:20px 0;min-height:160px;display:flex;flex-direction:column;justify-content:center;transition:all .3s}
    .quote-text{font-size:1.3rem;line-height:1.8;color:#1e293b;font-style:italic;margin-bottom:16px}
    .quote-author{font-size:1rem;font-weight:600;color:var(--primary)}
    .quote-category{font-size:.8rem;color:#94a3b8;margin-top:8px}
    .category-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .tag{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:.85rem;transition:all .2s;background:#fff}
    .tag:hover{background:#eef2ff;border-color:var(--primary)}
    .tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn-secondary{background:#e2e8f0;color:var(--text)}
    .btn-secondary:hover{background:#cbd5e1}
    .btn-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
    footer{text-align:center;padding:20px;color:var(--text-light);font-size:.85rem}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:9999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    @media(max-width:600px){
      .quote-text{font-size:1.1rem}
      .quote-box{padding:28px 20px}
    }
  </style>

<body>
  <header>
    <h1>💬 Quote Generator</h1>
    <p>Random inspiring quotes - get wisdom instantly</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>📂 Category</h2>
      <div class="category-tags" id="tags">
        <span class="tag active" data-cat="all">All</span>
        <span class="tag" data-cat="Motivation">Motivation</span>
        <span class="tag" data-cat="Philosophy">Philosophy</span>
        <span class="tag" data-cat="Business">Business</span>
        <span class="tag" data-cat="Literature">Literature</span>
        <span class="tag" data-cat="Technology">Technology</span>
        <span class="tag" data-cat="Life">Life</span>
      </div>
      <div class="quote-box" id="quoteBox">
        <div class="quote-text" id="quoteText">"The only way to do great work is to love what you do."</div>
        <div class="quote-author" id="quoteAuthor">— Steve Jobs</div>
        <div class="quote-category" id="quoteCat">#Motivation</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="generateQuote()">🎲 Random Quote</button>
        <button class="btn btn-secondary" onclick="copyQuote()">📋 Copy</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
    const quotes = [
      {text:'The only way to do great work is to love what you do.',author:'Steve Jobs',cat:'Motivation'},
      {text:'Stay hungry, stay foolish.',author:'Steve Jobs',cat:'Motivation'},
      {text:'The best time to plant a tree was 20 years ago. The second best time is now.',author:'Chinese Proverb',cat:'Motivation'},
      {text:'It does not matter how slowly you go as long as you do not stop.',author:'Confucius',cat:'Motivation'},
      {text:'Believe you can and you\'re halfway there.',author:'Theodore Roosevelt',cat:'Motivation'},
      {text:'I think, therefore I am.',author:'René Descartes',cat:'Philosophy'},
      {text:'The unexamined life is not worth living.',author:'Socrates',cat:'Philosophy'},
      {text:'He who has a why to live can bear almost any how.',author:'Friedrich Nietzsche',cat:'Philosophy'},
      {text:'Knowledge is power.',author:'Francis Bacon',cat:'Philosophy'},
      {text:'Simplicity is the ultimate sophistication.',author:'Leonardo da Vinci',cat:'Philosophy'},
      {text:'Innovation distinguishes between a leader and a follower.',author:'Steve Jobs',cat:'Business'},
      {text:'Your most unhappy customers are your greatest source of learning.',author:'Bill Gates',cat:'Business'},
      {text:'Quality is not an act, it is a habit.',author:'Aristotle',cat:'Business'},
      {text:'The secret of business is to know something that nobody else knows.',author:'Aristotle Onassis',cat:'Business'},
      {text:'Don\'t put all your eggs in one basket.',author:'Warren Buffett',cat:'Business'},
      {text:'To be, or not to be, that is the question.',author:'William Shakespeare',cat:'Literature'},
      {text:'All that glitters is not gold.',author:'William Shakespeare',cat:'Literature'},
      {text:'It was the best of times, it was the worst of times.',author:'Charles Dickens',cat:'Literature'},
      {text:'Not all those who wander are lost.',author:'J.R.R. Tolkien',cat:'Literature'},
      {text:'The journey of a thousand miles begins with one step.',author:'Lao Tzu',cat:'Literature'},
      {text:'The best way to predict the future is to invent it.',author:'Alan Kay',cat:'Technology'},
      {text:'Software is eating the world.',author:'Marc Andreessen',cat:'Technology'},
      {text:'Simplicity is prerequisite for reliability.',author:'Edsger Dijkstra',cat:'Technology'},
      {text:'First, solve the problem. Then, write the code.',author:'John Johnson',cat:'Technology'},
      {text:'Talk is cheap. Show me the code.',author:'Linus Torvalds',cat:'Technology'},
      {text:'Early to bed and early to rise makes a man healthy, wealthy, and wise.',author:'Benjamin Franklin',cat:'Life'},
      {text:'Health is wealth.',author:'Virgil',cat:'Life'},
      {text:'Do unto others as you would have them do unto you.',author:'The Bible',cat:'Life'},
      {text:'Happiness is not something ready made. It comes from your own actions.',author:'Dalai Lama',cat:'Life'},
      {text:'Life is what happens when you\'re busy making other plans.',author:'John Lennon',cat:'Life'},
      {text:'Failure is simply the opportunity to begin again, this time more intelligently.',author:'Henry Ford',cat:'Motivation'},
      {text:'Success is not final, failure is not fatal: it is the courage to continue that counts.',author:'Winston Churchill',cat:'Motivation'},
      {text:'What lies behind us and what lies before us are tiny matters compared to what lies within us.',author:'Ralph Waldo Emerson',cat:'Motivation'},
    ];
    let currentCat = 'all';
    document.getElementById('tags').addEventListener('click',e=>{
      if(e.target.classList.contains('tag')){
        document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
        e.target.classList.add('active');
        currentCat = e.target.dataset.cat;
        generateQuote();
      }
    });
    function generateQuote(){
      const filtered = currentCat==='all'?quotes:quotes.filter(q=>q.cat===currentCat);
      const q = filtered[Math.floor(Math.random()*filtered.length)];
      document.getElementById('quoteText').textContent = `"${q.text}"`;
      document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
      document.getElementById('quoteCat').textContent = `#${q.cat}`;
    }
    function copyQuote(){
      const text = document.getElementById('quoteText').textContent;
      const author = document.getElementById('quoteAuthor').textContent;
      navigator.clipboard.writeText(`${text}\n${author}`).then(()=>{
        const toast=document.getElementById('toast');
        toast.textContent='Quote copied!';
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),2000);
      });
    }
    generateQuote();
  </script>
