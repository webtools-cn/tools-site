<body>
<header><h1>🏦 Down Payment Calculator</h1><p>Calculate Home Down Payment · Compare Scenarios</p></header>
<div class="container">
  <div class="card">
    <h2>📋 Property Details</h2>
    <div class="row">
      <div class="form-group"><label>Home Price ($)</label><input type="number" id="housePrice" value="400000" min="0" step="1000"></div>
      <div class="form-group"><label>Down Payment (%)</label><input type="number" id="downPct" value="20" min="1" max="100" step="1"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>Interest Rate (%)</label><input type="number" id="interestRate" value="6.5" min="0" max="20" step="0.01"></div>
      <div class="form-group"><label>Loan Term</label><select id="loanTerm"><option value="10">10 years</option><option value="15">15 years</option><option value="20">20 years</option><option value="25">25 years</option><option value="30" selected>30 years</option></select></div>
    </div>
    <button class="btn" id="calcBtn">🔍 Calculate</button>
    <button class="btn-secondary" id="clearBtn" style="margin-left:8px">🗑 Clear</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 Results</h2>
    <div id="results"></div>
  </div>
</div>

<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

<script>
(function() {
  var calcBtn = document.getElementById('calcBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultsCard = document.getElementById('resultsCard');
  var resultsEl = document.getElementById('results');

  function formatMoney(num) {
    if (Math.abs(num) >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
    if (Math.abs(num) >= 1000) return '$' + (num / 1000).toFixed(1) + 'K';
    return '$' + num.toFixed(0);
  }

  function calcMonthly(principal, annualRate, years) {
    var mr = annualRate / 100 / 12;
    var n = years * 12;
    if (mr === 0) return principal / n;
    return principal * mr * Math.pow(1 + mr, n) / (Math.pow(1 + mr, n) - 1);
  }

  function calculate() {
    var price = parseFloat(document.getElementById('housePrice').value) || 0;
    var downPct = parseFloat(document.getElementById('downPct').value) || 20;
    var rate = parseFloat(document.getElementById('interestRate').value) || 6.5;
    var years = parseInt(document.getElementById('loanTerm').value) || 30;

    if (price <= 0) { resultsCard.style.display = 'block'; resultsEl.innerHTML = '<p style="text-align:center;color:#ef4444">⚠️ Please enter a valid home price</p>'; return; }

    var downPayment = price * (downPct / 100);
    var loanAmount = price - downPayment;
    var monthly = calcMonthly(loanAmount, rate, years);
    var totalPayment = monthly * years * 12;
    var totalInterest = totalPayment - loanAmount;

    var compareRates = [10, 15, 20, 25, 30, 40];
    var compareRows = '<tr><th>Down Pmt</th><th>Amount</th><th>Loan</th><th>Monthly</th><th>Interest</th></tr>';
    for (var i = 0; i < compareRates.length; i++) {
      var pct = compareRates[i];
      var dp = price * (pct / 100);
      var la = price - dp;
      var m = calcMonthly(la, rate, years);
      var ti = m * years * 12 - la;
      var cls = pct === downPct ? ' style="background:#f5f3ff;font-weight:700"' : '';
      compareRows += '<tr' + cls + '><td>' + pct + '%</td><td>$' + formatMoney(dp) + '</td><td>$' + formatMoney(la) + '</td><td>$' + m.toFixed(0) + '</td><td>$' + formatMoney(ti) + '</td></tr>';
    }

    resultsCard.style.display = 'block';
    resultsEl.innerHTML =
      '<div class="result-row"><span class="label">🏠 Home Price</span><span class="value">$' + formatMoney(price) + '</span></div>' +
      '<div class="result-row"><span class="label">💰 Down Payment (' + downPct + '%)</span><span class="value">$' + formatMoney(downPayment) + '</span></div>' +
      '<div class="result-row"><span class="label">🏦 Loan Amount</span><span class="value">$' + formatMoney(loanAmount) + '</span></div>' +
      '<div class="result-row"><span class="label">📅 Monthly Payment</span><span class="value">$' + monthly.toFixed(0) + '</span></div>' +
      '<div class="result-row"><span class="label">💵 Total Repayment</span><span class="value">$' + formatMoney(totalPayment) + '</span></div>' +
      '<div class="result-row"><span class="label">📈 Total Interest</span><span class="value">$' + formatMoney(totalInterest) + '</span></div>' +
      '<div class="highlight">🎯 Down Payment = $' + formatMoney(downPayment) + ' | Monthly = $' + monthly.toFixed(0) + '</div>' +
      '<h3 style="margin-top:16px;font-size:0.95rem;color:var(--primary)">📊 Down Payment Comparison</h3>' +
      '<table class="comparison-table">' + compareRows + '</table>';
  }

  function clearAll() {
    document.getElementById('housePrice').value = '400000';
    document.getElementById('downPct').value = '20';
    document.getElementById('interestRate').value = '6.5';
    document.getElementById('loanTerm').value = '30';
    resultsCard.style.display = 'none';
  }

  calcBtn.addEventListener('click', calculate);
  clearBtn.addEventListener('click', clearAll);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') calculate();
  });
})();
</script>
</body>
