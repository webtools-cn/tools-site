<style>:root{--primary:#4F46E5;--primary-dark:#3730a3;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text-secondary:#94a3b8;--border:#334155;--success:#10b981;--danger:#ef4444;--input-bg:#0f172a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
a{color:#06b6d4;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:24px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;color:#f1f5f9}
.lang-switch a{color:var(--text-secondary);font-size:.875rem;padding:4px 12px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.lang-switch a:hover{color:var(--text);border-color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.card h2{font-size:1.1rem;margin-bottom:16px;color:#f1f5f9}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.875rem;color:var(--text-secondary)}
.form-group input{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--primary)}
.input-row{display:flex;gap:12px}
.input-row .form-group{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#475569}
.btn-group{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.result-item{background:var(--bg);border-radius:8px;padding:16px;text-align:center}
.result-item .label{font-size:.75rem;color:var(--text-secondary);margin-bottom:4px}
.result-item .value{font-size:1.25rem;font-weight:700;color:var(--primary)}
.result-item .value.profit{color:var(--success)}
.result-item .value.loss{color:var(--danger)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:10px 24px;border-radius:8px;font-size:.875rem;border:1px solid var(--border);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.footer{margin-top:32px;text-align:center;color:var(--text-secondary);font-size:.75rem;padding:16px 0;border-top:1px solid var(--border)}
@media(max-width:480px){
  .input-row{flex-direction:column}
  .result-grid{grid-template-columns:1fr 1fr}
  .header h1{font-size:1.25rem}
}
</style>

<body>
<div class="container">
  <header class="header">
    <h1>📊 Stock Profit Calculator</h1>
    <div class="lang-switch"><a href="/stock-profit-calculator/">中文</a></div>
  </header>

  <div class="card">
    <h2>Trade Details</h2>
    <div class="input-row">
      <div class="form-group">
        <label>Buy Price ($)</label>
        <input type="number" id="buyPrice" placeholder="e.g. 10.50" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Sell Price ($)</label>
        <input type="number" id="sellPrice" placeholder="e.g. 12.80" min="0" step="0.01">
      </div>
    </div>
    <div class="input-row">
      <div class="form-group">
        <label>Number of Shares</label>
        <input type="number" id="shares" placeholder="e.g. 500" min="0" step="1">
      </div>
      <div class="form-group">
        <label>Fee Rate (%)</label>
        <input type="number" id="feeRate" placeholder="e.g. 0.03" min="0" max="10" step="0.001" value="0.03">
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="calculate()">📊 Calculate</button>
      <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>Profit Analysis</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="label">Total Buy Cost</div>
        <div class="value" id="totalBuy">$0</div>
      </div>
      <div class="result-item">
        <div class="label">Total Sell Revenue</div>
        <div class="value" id="totalSell">$0</div>
      </div>
      <div class="result-item">
        <div class="label">Profit / Loss</div>
        <div class="value" id="profitLoss">$0</div>
      </div>
      <div class="result-item">
        <div class="label">Return Rate</div>
        <div class="value" id="returnRate">0%</div>
      </div>
      <div class="result-item">
        <div class="label">Break-Even Price</div>
        <div class="value" id="breakEven">$0</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="copyResult()">📋 Copy Results</button>
    </div>
  </div>

  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

  <footer class="footer">
    <p>© 2025 Free ToolBase · Results are for reference only, not investment advice</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
function calculate(){
  const buyPrice=parseFloat(document.getElementById('buyPrice').value)||0;
  const sellPrice=parseFloat(document.getElementById('sellPrice').value)||0;
  const shares=parseFloat(document.getElementById('shares').value)||0;
  const feeRate=parseFloat(document.getElementById('feeRate').value)||0;

  if(buyPrice<=0||sellPrice<=0||shares<=0){showToast('Please enter buy price, sell price, and shares');return;}

  const buyCost=buyPrice*shares;
  const sellRevenue=sellPrice*shares;
  const buyFee=buyCost*(feeRate/100);
  const sellFee=sellRevenue*(feeRate/100);
  const totalBuyCost=buyCost+buyFee;
  const totalSellRevenue=sellRevenue-sellFee;
  const profit=totalSellRevenue-totalBuyCost;
  const returnRate=(profit/totalBuyCost*100);
  const breakEven=buyPrice*(1+feeRate/100)/(1-feeRate/100);

  document.getElementById('totalBuy').textContent='$'+totalBuyCost.toFixed(2);
  document.getElementById('totalSell').textContent='$'+totalSellRevenue.toFixed(2);

  const plEl=document.getElementById('profitLoss');
  plEl.textContent=(profit>=0?'+':'')+'$'+profit.toFixed(2);
  plEl.className='value '+(profit>=0?'profit':'loss');

  const rrEl=document.getElementById('returnRate');
  rrEl.textContent=(returnRate>=0?'+':'')+returnRate.toFixed(2)+'%';
  rrEl.className='value '+(returnRate>=0?'profit':'loss');

  document.getElementById('breakEven').textContent='$'+breakEven.toFixed(4);
  document.getElementById('resultCard').style.display='block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}

function clearAll(){
  document.getElementById('buyPrice').value='';
  document.getElementById('sellPrice').value='';
  document.getElementById('shares').value='';
  document.getElementById('feeRate').value='0.03';
  document.getElementById('resultCard').style.display='none';
}

function copyResult(){
  const lines=[
    '📊 Stock Profit Results',
    'Total Buy Cost: '+document.getElementById('totalBuy').textContent,
    'Total Sell Revenue: '+document.getElementById('totalSell').textContent,
    'Profit/Loss: '+document.getElementById('profitLoss').textContent,
    'Return Rate: '+document.getElementById('returnRate').textContent,
    'Break-Even Price: '+document.getElementById('breakEven').textContent
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard'));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
