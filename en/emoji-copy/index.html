    const searchInput = document.getElementById('searchInput');

    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

    let activeCategory = 'all';

    // Build category buttons
    let catHtml = '<button class="cat-btn active" data-cat="all">All</button>';
    for (const cat of Object.keys(emojiData)) {
      catHtml += `<button class="cat-btn" data-cat="${cat}">${cat.split(' ')[1] || cat}</button>`;
    }
    categoriesDiv.innerHTML = catHtml;

    function render(searchTerm = '') {
      let html = '';
      let hasResults = false;
      for (const [cat, emojis] of Object.entries(emojiData)) {
        if (activeCategory !== 'all' && cat !== activeCategory) continue;
        let filtered = emojis;
        if (searchTerm) {
          filtered = emojis.filter(e => {
            // Use a simple keyword map for search
            const kwMap = { '': '😀😃😄😁😆😅🤣😂🙂😊', '': '😢😭🥺', '': '❤🧡💛💚💙💜🤎🖤🤍💕💗💖💘💝💞💓', '': '🐱🐈', '': '🐶🐕', '': '🍕🍔🍟🌭🍿🍩', '': '☕🍵🧃🥤🍺🍻🥂🍷', '': '🌸💮🏵🌹🥀🌺🌻🌼🌷', '': '⭐🌟✨💫🌠', '': '🔥💥', '': '☀🌞🌤🌅🌄', '': '🌙🌛🌜🌝🌚', '': '💰💵💶💷💸🤑' };
            for (const [kw, matchEmojis] of Object.entries(kwMap)) {
              if (searchTerm.includes(kw)) return matchEmojis.includes(e);
            }
            // Direct search in category name
            if (cat.includes(searchTerm)) return true;
            return false;
          });
        }
        if (filtered.length === 0) continue;
        hasResults = true;
        html += `<div class="category-title">${cat}</div><div class="emoji-grid">`;
        filtered.forEach(e => {
          html += `<div class="emoji-item" data-emoji="${e}" title="Click to copy">${e}</div>`;
        });
        html += '</div>';
      }
      if (!hasResults) html = '<div class="no-results">😕 No matching emojis found. Try other keywords.</div>';
      container.innerHTML = html;

      // Bind click events
      container.querySelectorAll('.emoji-item').forEach(item => {
        item.addEventListener('click', () => {
          const emoji = item.dataset.emoji;
          navigator.clipboard.writeText(emoji).then(() => {
          item.classList.add('copied');
          showToast('Copied ' + emoji + ' to clipboard');
          setTimeout(() => item.classList.remove('copied'), 300);
          }).catch(() => showToast('Copy failed. Please copy manually.'));
        });
      });
    }

    // Category click
    categoriesDiv.addEventListener('click', e => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.dataset.cat;
        render(searchInput.value.trim());
      }
    });

    // Search
    searchInput.addEventListener('input', () => render(searchInput.value.trim()));

    // Initial render
    render();
  </script>
