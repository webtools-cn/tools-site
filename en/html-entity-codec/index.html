<script>
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1500);}
function encodeHTML(text){var d=document.createElement("div");d.textContent=text;return d.innerHTML;}
function decodeHTML(html){var d=document.createElement("div");d.innerHTML=html;return d.textContent;}
document.getElementById("encodeBtn").addEventListener("click",function(){var input=document.getElementById("inputText").value;document.getElementById("outputBox").textContent=encodeHTML(input);showToast("Encoded!");});
document.getElementById("decodeBtn").addEventListener("click",function(){var input=document.getElementById("inputText").value;document.getElementById("outputBox").textContent=decodeHTML(input);showToast("Decoded!");});
document.getElementById("copyBtn").addEventListener("click",function(){var t=document.getElementById("outputBox").textContent;if(!t){showToast("Nothing to copy");return;}navigator.clipboard.writeText(t).then(function(){showToast("Copied!");});});
document.getElementById("clearBtn").addEventListener("click",function(){document.getElementById("inputText").value="";document.getElementById("outputBox").textContent="";});
document.getElementById("inputText").addEventListener("input",function(){document.getElementById("outputBox").textContent=encodeHTML(this.value);});
</script>
