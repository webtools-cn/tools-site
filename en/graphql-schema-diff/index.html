<body>
<header><a href="/en/" class="logo">Free ToolBase</a><nav><a href="/en/">Home</a><a href="/">CN</a></nav></header>
<div class="container">
  <h1>GraphQL Schema Diff</h1>
  <p class="subtitle">Compare two GraphQL schemas (SDL format). Highlights added, removed, and modified types and fields.</p>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn btn-primary" onclick="compare()">Compare Schemas</button>
    <button class="btn" onclick="swapSchemas()">⇄ Swap</button>
    <button class="btn" onclick="clearAll()">Clear</button>
  </div>

  <div class="editor-wrap">
    <div class="panel">
      <div class="panel-label">Old Schema</div>
      <textarea id="oldSchema" placeholder="Paste old GraphQL Schema...
type User {
  id: ID!
  name: String!
  email: String!
  role: String
}"></textarea>
    </div>
    <div class="panel">
      <div class="panel-label">New Schema</div>
      <textarea id="newSchema" placeholder="Paste new GraphQL Schema...
type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole
  avatar: String
}

enum UserRole {
  ADMIN
  USER
}"></textarea>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat"><span class="stat-dot" style="background:var(--added);"></span> Added: <strong id="addedCount">0</strong></div>
    <div class="stat"><span class="stat-dot" style="background:var(--removed);"></span> Removed: <strong id="removedCount">0</strong></div>
    <div class="stat"><span class="stat-dot" style="background:var(--changed);"></span> Changed: <strong id="changedCount">0</strong></div>
  </div>

  <div class="diff-output" id="diffOutput" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>
<footer>Free ToolBase &copy; 2024 — Client-side only, no data upload</footer>

<script>
function parseSchema(text) {
  const types = {};
  const lines = text.split('\n');
  let currentType = null;
  let currentKind = null;
  
  for (let line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    
    const typeMatch = trimmed.match(/^(type|input|enum|interface|union|scalar)\s+(\w+)/);
    if (typeMatch) {
      currentType = typeMatch[2];
      currentKind = typeMatch[1];
      types[currentType] = { kind: currentKind, fields: [], interfaces: [] };
      continue;
    }
    
    if (currentType && (trimmed === '{' || trimmed === '}')) { if (trimmed === '}') { currentType = null; currentKind = null; } continue; }
    
    if (currentType) {
      const fieldMatch = trimmed.match(/^(\w+)\s*(\([^)]*\))?\s*:\s*(.+?)(!?)\s*$/);
      if (fieldMatch) {
        types[currentType].fields.push({ name: fieldMatch[1], type: fieldMatch[3].trim(), required: fieldMatch[4] === '!', args: fieldMatch[2] || '' });
      }
    }
  }
  return types;
}

function compare() {
  const oldText = document.getElementById('oldSchema').value.trim();
  const newText = document.getElementById('newSchema').value.trim();
  if (!oldText && !newText) { showToast('Please enter schemas'); return; }
  if (!oldText || !newText) { showToast('Both schemas are required'); return; }

  const oldSchema = parseSchema(oldText);
  const newSchema = parseSchema(newText);
  
  const oldTypes = Object.keys(oldSchema);
  const newTypes = Object.keys(newSchema);
  const added = newTypes.filter(t => !oldTypes.includes(t));
  const removed = oldTypes.filter(t => !newTypes.includes(t));
  const common = oldTypes.filter(t => newTypes.includes(t));
  
  let changed = [];
  common.forEach(typeName => {
    const oldFields = oldSchema[typeName].fields;
    const newFields = newSchema[typeName].fields;
    const oldNames = oldFields.map(f => f.name);
    const newNames = newFields.map(f => f.name);
    const addedF = newNames.filter(f => !oldNames.includes(f));
    const removedF = oldNames.filter(f => !newNames.includes(f));
    const modifiedF = newNames.filter(f => {
      if (!oldNames.includes(f)) return false;
      const of = oldFields.find(x => x.name === f);
      const nf = newFields.find(x => x.name === f);
      return of.type !== nf.type || of.required !== nf.required;
    });
    if (addedF.length > 0 || removedF.length > 0 || modifiedF.length > 0) {
      changed.push({ type: typeName, added: addedF, removed: removedF, modified: modifiedF });
    }
  });

  document.getElementById('addedCount').textContent = added.length;
  document.getElementById('removedCount').textContent = removed.length;
  document.getElementById('changedCount').textContent = changed.length;
  document.getElementById('stats').style.display = 'flex';
  
  let html = '';
  if (added.length > 0) {
    html += '<div class="diff-section added"><strong>🟢 Added Types (' + added.length + '):</strong><br>';
    added.forEach(t => {
      html += '  + ' + t;
      const fields = newSchema[t].fields;
      if (fields.length > 0) html += ' { ' + fields.map(f => f.name + ': ' + f.type + (f.required ? '!' : '')).join(', ') + ' }';
      html += '<br>';
    });
    html += '</div>';
  }
  if (removed.length > 0) {
    html += '<div class="diff-section removed"><strong>🔴 Removed Types (' + removed.length + '):</strong><br>';
    removed.forEach(t => {
      html += '  - ' + t;
      const fields = oldSchema[t].fields;
      if (fields.length > 0) html += ' { ' + fields.map(f => f.name + ': ' + f.type + (f.required ? '!' : '')).join(', ') + ' }';
      html += '<br>';
    });
    html += '</div>';
  }
  if (changed.length > 0) {
    html += '<div class="diff-section changed"><strong>🟡 Changed Types (' + changed.length + '):</strong><br>';
    changed.forEach(c => {
      html += '  ~ ' + c.type + '<br>';
      c.added.forEach(f => { html += '    <span class="diff-added">+ ' + f + '</span><br>'; });
      c.removed.forEach(f => { html += '    <span class="diff-removed">- ' + f + '</span><br>'; });
      c.modified.forEach(f => { html += '    <span class="diff-changed">~ ' + f + '</span><br>'; });
    });
    html += '</div>';
  }
  if (!html) html = '<div style="padding:12px;color:var(--text-secondary);">✅ Schemas are identical — no differences</div>';
  
  document.getElementById('diffOutput').innerHTML = html;
  document.getElementById('diffOutput').style.display = 'block';
  showToast('Comparison complete');
}

function swapSchemas() {
  const o = document.getElementById('oldSchema'); const n = document.getElementById('newSchema');
  const tmp = o.value; o.value = n.value; n.value = tmp;
}
function clearAll() {
  document.getElementById('oldSchema').value = '';
  document.getElementById('newSchema').value = '';
  document.getElementById('diffOutput').innerHTML = '';
  document.getElementById('diffOutput').style.display = 'none';
  document.getElementById('stats').style.display = 'none';
}
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2000); }
</script>
