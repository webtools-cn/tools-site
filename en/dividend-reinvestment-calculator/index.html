<div class="header"><h1>💎 Dividend Reinvestment Calculator (DRIP)</h1><div class="lang-switch"><a href="../../dividend-reinvestment-calculator/">中文</a><a href="index.html" class="active">EN</a></div></div>

<div class="hero"><p>See how automatic dividend reinvestment compounds your wealth over time. Enter your initial investment, dividend yield, and growth rates to project decades of passive income growth.</p><span class="badge">Zero Dependencies · Works Offline</span></div>

<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="initialInvestment">Initial Investment ($)</label><input type="number" id="initialInvestment" value="10000" min="0" step="100"><div class="hint">Lump sum or current portfolio value</div></div>
    <div class="input-group"><label for="stockPrice">Current Stock Price ($)</label><input type="number" id="stockPrice" value="100" min="0.01" step="0.01"><div class="hint">Price per share</div></div>
    <div class="input-group"><label for="dividendYield">Annual Dividend Yield (%)</label><input type="number" id="dividendYield" value="3.5" min="0" max="20" step="0.1"><div class="hint">Current yield (annual dividend/price)</div></div>
    <div class="input-group"><label for="dividendGrowth">Dividend Growth Rate (%)</label><input type="number" id="dividendGrowth" value="5" min="0" max="20" step="0.1"><div class="hint">Expected annual dividend increase (conservative: 2-5%)</div></div>
    <div class="input-group"><label for="priceGrowth">Stock Price Growth Rate (%)</label><input type="number" id="priceGrowth" value="6" min="0" max="20" step="0.1"><div class="hint">Expected annual price appreciation (S&P 500 ~7-10%)</div></div>
    <div class="input-group"><label for="years">Holding Period (Years)</label><input type="number" id="years" value="20" min="1" max="50" step="1"><div class="hint">Planned investment duration</div></div>
    <div class="input-group"><label for="annualContribution">Annual Contribution ($)</label><input type="number" id="annualContribution" value="6000" min="0" step="100"><div class="hint">Additional yearly investment (e.g. $500/mo = $6,000/yr)</div></div>
    <div class="input-group"><label for="taxRate">Dividend Tax Rate (%)</label><input type="number" id="taxRate" value="15" min="0" max="40" step="1"><div class="hint">Qualified dividend tax rate (US: 0/15/20%)</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn">🔍 Calculate</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-secondary" id="copyBtn">📋 Copy Results</button>
  </div>

<div class="info-section">
  <h2>📖 DRIP Investment Strategy</h2>
  <h3>Core DRIP Benefits</h3>
  <p>Automatic compounding: dividends buy more shares → produce more dividends → cycle continues. Commission-free: most brokers offer DRIP at no cost. Fractional shares: fully utilize every dollar of dividends.</p>
  <h3>Dividend Growth vs High Yield</h3>
  <p>High yield (4-6%) provides immediate cash flow but slower growth. Dividend growth (starting 2-3% but rising 8-10%/yr) delivers higher total returns long-term. Best strategy: moderate yield (2.5-3.5%) + consistent growth.</p>
  <h3>Tax Impact</h3>
  <p>Qualified dividend tax rates: 0%/15%/20% (US). DRIP inside IRA/401k defers taxes. In taxable accounts, annual tax drag on dividends significantly impacts long-term compounding.</p>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtNum(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
  const initial=+$('initialInvestment').value||0;
  const price=+$('stockPrice').value||0;
  const yieldPct=(+$('dividendYield').value||0)/100;
  const divGrowth=(+$('dividendGrowth').value||0)/100;
  const priceGrowth=(+$('priceGrowth').value||0)/100;
  const years=+$('years').value||0;
  const contrib=+$('annualContribution').value||0;
  const taxPct=(+$('taxRate').value||0)/100;
  let shares=price>0?initial/price:0;
  let curPrice=price;
  let totalDividends=0;
  const yrLabels=[],yrValues=[];
  for(let y=1;y<=years;y++){
    if(contrib>0&&curPrice>0)shares+=contrib/curPrice;
    const annualDiv=shares*curPrice*yieldPct;
    totalDividends+=annualDiv;
    const reinvestDiv=annualDiv*(1-taxPct);
    if(curPrice>0)shares+=reinvestDiv/curPrice;
    curPrice*=(1+priceGrowth);
    yrLabels.push('Yr '+y);
    yrValues.push(shares*curPrice);
  }
  const finalValue=shares*curPrice;
  const totalInvested=initial+contrib*years;
  const afterTaxGain=finalValue-(totalInvested+totalDividends*taxPct);
  $('finalValue').textContent=fmt(finalValue);
  $('finalShares').textContent=fmtNum(shares);
  $('annualDividend').textContent=fmt(shares*curPrice*yieldPct);
  $('totalInvested').textContent=fmt(totalInvested);
  $('totalDividends').textContent=fmt(totalDividends);
  $('afterTaxGain').textContent=fmt(afterTaxGain);
  drawChart(yrLabels,yrValues,totalInvested);
}
function drawChart(labels,values,invested){
  const canvas=$('dripChart'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.parentElement.clientWidth-32,h=260;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const maxVal=Math.max(...values,invested)*1.1;
  const barW=(w-60)/labels.length;
  ctx.fillStyle='rgba(34,211,238,.4)';
  labels.forEach((l,i)=>{
    const x=40+i*barW;
    const hBar=(values[i]/maxVal)*h;
    ctx.fillRect(x,h-hBar,barW-2,hBar);
  });
  ctx.strokeStyle='rgba(249,115,22,.7)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(40,h-(invested/maxVal)*h);
  ctx.lineTo(w-20,h-(invested/maxVal)*h);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f97316';
  ctx.font='11px sans-serif';
  ctx.fillText('Total Invested',w-100,h-(invested/maxVal)*h-5);
  ctx.fillStyle='#94a3b8';
  ctx.font='10px sans-serif';
  for(let i=0;i<labels.length;i+=Math.max(1,Math.floor(labels.length/8))){
    ctx.fillText(labels[i],40+i*barW,h-5);
  }
}
function reset(){
  $('initialInvestment').value=10000;$('stockPrice').value=100;
  $('dividendYield').value=3.5;$('dividendGrowth').value=5;
  $('priceGrowth').value=6;$('years').value=20;$('annualContribution').value=6000;
  $('taxRate').value=15;
  ['finalValue','finalShares','annualDividend','totalInvested','totalDividends','afterTaxGain'].forEach(function(id){$(id).textContent='-';});
  const canvas=$('dripChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
}
function copyResult(){
  const lines=['=== DRIP Investment Projection ===',
    'Final Portfolio Value: '+$('finalValue').textContent,
    'Final Share Count: '+$('finalShares').textContent,
    'Annual Dividend Income: '+$('annualDividend').textContent,
    'Total Invested: '+$('totalInvested').textContent,
    'Total Dividends Earned: '+$('totalDividends').textContent,
    'After-Tax Net Gain: '+$('afterTaxGain').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'));
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
