<body>
  <div class="container">
    <header>
      <h1>🔬 Density Calculator</h1>
      <p>Three modes: find density, mass, or volume — with built-in substance reference table</p>
    </header>

    <div class="card">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="density">Find Density ρ=m/V</button>
        <button class="mode-btn" data-mode="mass">Find Mass m=ρ×V</button>
        <button class="mode-btn" data-mode="volume">Find Volume V=m/ρ</button>
      </div>

      <div class="formula" id="formulaDisplay">ρ = m / V</div>

      <div class="input-group" id="massInputGroup">
        <label for="massInput">Mass</label>
        <div class="input-row" style="margin-bottom:0;">
          <input type="number" id="massInput" value="100" step="any" inputmode="decimal" placeholder="Enter mass">
          <select id="massUnit" style="max-width:140px;">
            <option value="kg">Kilograms (kg)</option>
            <option value="g" selected>Grams (g)</option>
            <option value="mg">Milligrams (mg)</option>
            <option value="lb">Pounds (lb)</option>
            <option value="oz">Ounces (oz)</option>
          </select>
        </div>
      </div>

      <div class="input-group" id="volumeInputGroup" style="margin-top:16px;">
        <label for="volumeInput">Volume</label>
        <div class="input-row" style="margin-bottom:0;">
          <input type="number" id="volumeInput" value="100" step="any" inputmode="decimal" placeholder="Enter volume">
          <select id="volumeUnit" style="max-width:140px;">
            <option value="m3">Cubic meters (m³)</option>
            <option value="cm3" selected>Cubic centimeters (cm³)</option>
            <option value="mL">Milliliters (mL)</option>
            <option value="L">Liters (L)</option>
            <option value="gal">Gallons (gal)</option>
          </select>
        </div>
      </div>

      <div class="input-group" id="densityInputGroup" style="display:none;margin-top:16px;">
        <label for="densityInput">Density</label>
        <div class="input-row" style="margin-bottom:0;">
          <input type="number" id="densityInput" value="1" step="any" inputmode="decimal" placeholder="Enter density">
          <select id="densityUnit" style="max-width:160px;">
            <option value="kg/m3">kg/m³</option>
            <option value="g/cm3" selected>g/cm³</option>
            <option value="g/mL">g/mL</option>
            <option value="kg/L">kg/L</option>
            <option value="lb/ft3">lb/ft³</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn" id="calcBtn">🔢 Calculate</button>
        <button class="btn btn-ghost btn-small" id="copyBtn">📋 Copy Result</button>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="card-title">📊 Result</div>
      <div class="result-box">
        <div class="result-value" id="resultValue">--</div>
        <div class="result-label" id="resultLabel"></div>
        <div class="result-extra" id="resultExtra"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📚 Common Substance Density Reference (Click to Fill)</div>
      <div class="ref-scroll">
        <table class="ref-table" id="refTable">
          <thead>
            <tr><th>Substance</th><th>Density (g/cm³)</th><th>Density (kg/m³)</th></tr>
          </thead>
          <tbody id="refBody"></tbody>
        </table>
      </div>
    </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._tid);
        t._tid = setTimeout(function(){ t.classList.remove('show'); }, 2000);
      }

      var $ = function(id) { return document.getElementById(id); };

      var massToKg = {
        'kg': 1, 'g': 0.001, 'mg': 0.000001,
        'lb': 0.453592, 'oz': 0.0283495
      };
      var volToM3 = {
        'm3': 1, 'cm3': 0.000001, 'mL': 0.000001,
        'L': 0.001, 'gal': 0.00378541
      };
      var densityToKgM3 = {
        'kg/m3': 1, 'g/cm3': 1000, 'g/mL': 1000,
        'kg/L': 1000, 'lb/ft3': 16.0185
      };

      var substances = [
        { name: 'Water (4°C)', densityGcm3: 1.000 },
        { name: 'Ice (0°C)', densityGcm3: 0.917 },
        { name: 'Seawater', densityGcm3: 1.025 },
        { name: 'Ethanol (Alcohol)', densityGcm3: 0.789 },
        { name: 'Glycerin', densityGcm3: 1.261 },
        { name: 'Olive Oil', densityGcm3: 0.918 },
        { name: 'Milk', densityGcm3: 1.030 },
        { name: 'Honey', densityGcm3: 1.420 },
        { name: 'Mercury', densityGcm3: 13.534 },
        { name: 'Gasoline', densityGcm3: 0.721 },
        { name: 'Acetone', densityGcm3: 0.784 },
        { name: 'Benzene', densityGcm3: 0.879 },
        { name: 'Aluminum', densityGcm3: 2.700 },
        { name: 'Iron', densityGcm3: 7.870 },
        { name: 'Copper', densityGcm3: 8.960 },
        { name: 'Gold', densityGcm3: 19.320 },
        { name: 'Silver', densityGcm3: 10.490 },
        { name: 'Lead', densityGcm3: 11.340 },
        { name: 'Zinc', densityGcm3: 7.140 },
        { name: 'Tin', densityGcm3: 7.310 },
        { name: 'Titanium', densityGcm3: 4.507 },
        { name: 'Platinum', densityGcm3: 21.450 },
        { name: 'Tungsten', densityGcm3: 19.250 },
        { name: 'Wood (Pine)', densityGcm3: 0.520 },
        { name: 'Wood (Oak)', densityGcm3: 0.750 },
        { name: 'Concrete', densityGcm3: 2.400 },
        { name: 'Glass', densityGcm3: 2.500 },
        { name: 'Rubber', densityGcm3: 1.200 },
        { name: 'Polyethylene (PE)', densityGcm3: 0.950 },
        { name: 'Polypropylene (PP)', densityGcm3: 0.900 },
        { name: 'PVC', densityGcm3: 1.380 },
        { name: 'Styrofoam', densityGcm3: 0.050 },
        { name: 'Air (20°C)', densityGcm3: 0.001225 },
        { name: 'Carbon Dioxide', densityGcm3: 0.001977 },
        { name: 'Helium', densityGcm3: 0.000179 }
      ];

      var state = { mode: 'density' };

      $('modeToggle').addEventListener('click', function(e) {
        var btn = e.target.closest('.mode-btn');
        if (!btn) return;
        state.mode = btn.getAttribute('data-mode');
        var all = $('modeToggle').querySelectorAll('.mode-btn');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
        btn.classList.add('active');

        $('massInputGroup').style.display = state.mode !== 'volume' ? '' : 'none';
        $('volumeInputGroup').style.display = state.mode !== 'mass' ? '' : 'none';
        $('densityInputGroup').style.display = state.mode !== 'density' ? '' : 'none';

        var formulas = {
          'density': 'ρ = m / V',
          'mass': 'm = ρ × V',
          'volume': 'V = m / ρ'
        };
        $('formulaDisplay').textContent = formulas[state.mode];
        $('resultCard').style.display = 'none';
      });

      function calculate() {
        var massKg, volM3, densKgM3;

        if (state.mode === 'density') {
          var mVal = parseFloat($('massInput').value);
          var vVal = parseFloat($('volumeInput').value);
          if (isNaN(mVal) || isNaN(vVal) || vVal === 0) {
            showToast('⚠️ Please enter valid values');
            return;
          }
          massKg = mVal * massToKg[$('massUnit').value];
          volM3 = vVal * volToM3[$('volumeUnit').value];
          densKgM3 = massKg / volM3;
          showResult(densKgM3, 'Density', 'kg/m³', formatDensity(densKgM3));
        } else if (state.mode === 'mass') {
          var dVal = parseFloat($('densityInput').value);
          var vVal2 = parseFloat($('volumeInput').value);
          if (isNaN(dVal) || isNaN(vVal2)) {
            showToast('⚠️ Please enter valid values');
            return;
          }
          densKgM3 = dVal * densityToKgM3[$('densityUnit').value];
          volM3 = vVal2 * volToM3[$('volumeUnit').value];
          massKg = densKgM3 * volM3;
          showResult(massKg, 'Mass', 'kg', formatMass(massKg));
        } else {
          var mVal2 = parseFloat($('massInput').value);
          var dVal2 = parseFloat($('densityInput').value);
          if (isNaN(mVal2) || isNaN(dVal2) || dVal2 === 0) {
            showToast('⚠️ Please enter valid values');
            return;
          }
          massKg = mVal2 * massToKg[$('massUnit').value];
          densKgM3 = dVal2 * densityToKgM3[$('densityUnit').value];
          volM3 = massKg / densKgM3;
          showResult(volM3, 'Volume', 'm³', formatVolume(volM3));
        }
      }

      function formatDensity(kgM3) {
        var gcm3 = kgM3 / 1000;
        var gL = gcm3 * 1000;
        var kgL = kgM3 / 1000;
        return [
          { val: kgM3.toFixed(4), unit: 'kg/m³' },
          { val: gcm3.toFixed(6), unit: 'g/cm³' },
          { val: gL.toFixed(4), unit: 'g/L' },
          { val: kgL.toFixed(6), unit: 'kg/L' }
        ];
      }

      function formatMass(kg) {
        return [
          { val: kg.toFixed(6), unit: 'kg' },
          { val: (kg * 1000).toFixed(4), unit: 'g' },
          { val: (kg * 1000000).toFixed(2), unit: 'mg' },
          { val: (kg / 0.453592).toFixed(6), unit: 'lb' },
          { val: (kg / 0.0283495).toFixed(4), unit: 'oz' }
        ];
      }

      function formatVolume(m3) {
        return [
          { val: m3.toFixed(8), unit: 'm³' },
          { val: (m3 * 1000000).toFixed(4), unit: 'cm³' },
          { val: (m3 * 1000000).toFixed(4), unit: 'mL' },
          { val: (m3 * 1000).toFixed(6), unit: 'L' },
          { val: (m3 / 0.00378541).toFixed(6), unit: 'gal' }
        ];
      }

      function showResult(value, label, unit, conversions) {
        $('resultCard').style.display = '';
        var primary = conversions[0];
        $('resultValue').textContent = primary.val + ' ' + primary.unit;
        $('resultLabel').textContent = label;

        var html = '';
        for (var i = 1; i < conversions.length; i++) {
          html += '<span class="result-chip">' + conversions[i].val + ' ' + conversions[i].unit + '</span>';
        }
        $('resultExtra').innerHTML = html;

        state.lastResult = label + ': ' + primary.val + ' ' + primary.unit;
        for (var j = 1; j < conversions.length; j++) {
          state.lastResult += ', ' + conversions[j].val + ' ' + conversions[j].unit;
        }
      }

      $('calcBtn').addEventListener('click', calculate);

      ['massInput', 'volumeInput', 'densityInput'].forEach(function(id) {
        $(id).addEventListener('keydown', function(e) {
          if (e.key === 'Enter') calculate();
        });
      });

      $('copyBtn').addEventListener('click', function() {
        if (!state.lastResult) {
          showToast('⚠️ Please calculate first');
          return;
        }
        navigator.clipboard.writeText(state.lastResult).then(function() {
          showToast('✅ Result copied to clipboard');
        }).catch(function() {
          showToast('❌ Copy failed');
        });
      });

      var refHtml = '';
      substances.forEach(function(s) {
        refHtml += '<tr data-density="' + s.densityGcm3 + '"><td>' + s.name + '</td><td>' + s.densityGcm3.toFixed(3) + '</td><td>' + (s.densityGcm3 * 1000).toFixed(1) + '</td></tr>';
      });
      $('refBody').innerHTML = refHtml;

      $('refBody').addEventListener('click', function(e) {
        var row = e.target.closest('tr');
        if (!row) return;
        var dens = parseFloat(row.getAttribute('data-density'));

        if (state.mode === 'mass' || state.mode === 'volume') {
          $('densityInput').value = dens;
          $('densityUnit').value = 'g/cm3';
          showToast('✅ Density filled: ' + dens + ' g/cm³');
        } else {
          showToast('💡 Switch to "Find Mass" or "Find Volume" mode to use reference values');
        }
      });

      calculate();
    })();
  </script>
</body>
</html>
