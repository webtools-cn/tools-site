quoise":"#48d1cc","mediumvioletred":"#c71585","midnightblue":"#191970","mintcream":"#f5fffa","mistyrose":"#ffe4e1","moccasin":"#ffe4b5","navajowhite":"#ffdead","navy":"#000080","oldlace":"#fdf5e6","olive":"#808000","olivedrab":"#6b8e23","orange":"#ffa500","orangered":"#ff4500","orchid":"#da70d6","palegoldenrod":"#eee8aa","palegreen":"#98fb98","paleturquoise":"#afeeee","palevioletred":"#db7093","papayawhip":"#ffefd5","peachpuff":"#ffdab9","peru":"#cd853f","pink":"#ffc0cb","plum":"#dda0dd","powderblue":"#b0e0e6","purple":"#800080","rebeccapurple":"#663399","red":"#ff0000","rosybrown":"#bc8f8f","royalblue":"#4169e1","saddlebrown":"#8b4513","salmon":"#fa8072","sandybrown":"#f4a460","seagreen":"#2e8b57","seashell":"#fff5ee","sienna":"#a0522d","silver":"#c0c0c0","skyblue":"#87ceeb","slateblue":"#6a5acd","slategray":"#708090","snow":"#fffafa","springgreen":"#00ff7f","steelblue":"#4682b4","tan":"#d2b48c","teal":"#008080","thistle":"#d8bfd8","tomato":"#ff6347","turquoise":"#40e0d0","violet":"#ee82ee","wheat":"#f5deb3","white":"#ffffff","whitesmoke":"#f5f5f5","yellow":"#ffff00","yellowgreen":"#9acd32"};
  const grid = document.getElementById('colorGrid');
  const search = document.getElementById('search');
  const selected = document.getElementById('selected');
  const bigSwatch = document.getElementById('bigSwatch');
  const selName = document.getElementById('selName');
  const selHex = document.getElementById('selHex');
  function render(filter) {
    const q = (filter || '').toLowerCase();
    grid.innerHTML = '';
    Object.entries(COLORS).forEach(([name, hex]) => {
      if (q && !name.includes(q) && !hex.includes(q)) return;
      const div = document.createElement('div');
      div.className = 'color-item';
      div.innerHTML = `<div class="color-swatch" style="background:${hex}"></div><div class="color-info"><div class="color-name">${name}</div><div class="color-hex">${hex}</div></div>`;
      div.addEventListener('click', () => selectColor(name, hex));
      grid.appendChild(div);
    });
  }
  function selectColor(name, hex) {
    bigSwatch.style.background = hex;
    selName.textContent = name;
    selHex.textContent = hex;
    selected.classList.add('show');
  }
  search.addEventListener('input', () => render(search.value));
  render();
  </script>
