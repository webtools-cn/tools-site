<body>
<header><h1>🏆 Domain Authority Checker</h1><p>Comprehensive website authority evaluation · 1-100 scale</p></header>
<div class="container">
  <div class="card">
    <h2>🔍 Enter Domain</h2>
    <div class="input-row">
      <div class="form-group"><label>Website Domain</label><input type="text" id="domainInput" placeholder="example.com" value="free-toolbase.com"></div>
      <div class="btn-wrap"><button class="btn" id="checkBtn">Check</button></div>
    </div>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 Authority Evaluation</h2>
    <div id="results"></div>
  </div>

<script>
(function() {
  const domainEl = document.getElementById('domainInput');
  const checkBtn = document.getElementById('checkBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');

  function hashScore(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
    return Math.abs(hash);
  }

  function check() {
    let domain = domainEl.value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '').toLowerCase();
    if (!domain) return;

    const h = hashScore(domain);
    const scores = {
      domainAge: Math.min(h % 40 + 20, 40),
      backlinks: Math.min(h % 30 + 10, 30),
      traffic: Math.min(h % 25 + 5, 25),
      content: Math.min(h % 20 + 10, 20),
      social: Math.min(h % 15 + 5, 15),
      technical: Math.min(h % 20 + 10, 20),
    };

    const total = Object.values(scores).reduce((a, b) => a + b, 0);
    const rating = total >= 80 ? 'Excellent' : total >= 60 ? 'Good' : total >= 40 ? 'Average' : 'Low';
    const color = total >= 80 ? '#10b981' : total >= 60 ? '#6366F1' : total >= 40 ? '#f59e0b' : '#ef4444';

    const metrics = [
      { name: 'Domain Age', value: scores.domainAge, max: 40, color: '#4F46E5' },
      { name: 'Backlinks', value: scores.backlinks, max: 30, color: '#6366F1' },
      { name: 'Traffic', value: scores.traffic, max: 25, color: '#8B5CF6' },
      { name: 'Content Quality', value: scores.content, max: 20, color: '#A78BFA' },
      { name: 'Social Signals', value: scores.social, max: 15, color: '#C4B5FD' },
      { name: 'Technical SEO', value: scores.technical, max: 20, color: '#7C3AED' },
    ];

    resultsEl.innerHTML = `
      <div class="score-circle" style="border-color:${color}">
        <div class="score-num" style="color:${color}">${total}</div>
        <div class="score-label">${rating}</div>
      </div>
      ${metrics.map(m => `
        <div class="metric">
          <span class="metric-name">${m.name}</span>
          <span class="metric-value">${m.value}/${m.max}</span>
        </div>
        <div class="metric-bar"><div class="metric-bar-fill" style="width:${m.value/m.max*100}%;background:${m.color}"></div></div>
      `).join('')}
      <p style="color:var(--text-secondary);font-size:0.8rem;margin-top:16px;text-align:center">⚠️ This is a simulated score for reference only. Actual authority requires multi-platform data.</p>
    `;
    resultsCard.style.display = 'block';
  }

  checkBtn.addEventListener('click', check);
  domainEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
  check();
})();
</script>
