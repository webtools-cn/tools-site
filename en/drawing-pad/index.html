<body>
<div class="container">
<div class="header"><h1>🎨 Online Drawing Pad</h1><div class="lang-switch"><a href="index.html" class="">中文</a><a href="../en/drawing-pad/">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Online画板</p>
<div class="toolbar">
<label>Brush</label>
<input type="color" id="colorPicker" value="#000000">
<label>Size</label>
<input type="range" id="sizeSlider" min="1" max="30" value="3">
<span class="size-val" id="sizeVal">3px</span>
<button class="btn btn-primary active" id="penBtn">✏️ Pen</button>
<button class="btn btn-primary" id="eraserBtn">🧹 Eraser</button>
<button class="btn btn-secondary" id="undoBtn">↩ Undo</button>
<button class="btn btn-secondary" id="redoBtn">↪ Redo</button>
<button class="btn btn-danger" id="clearBtn">🗑 Clear</button>
<button class="btn btn-success" id="exportBtn">💾 ExportPNG</button>
</div>
<canvas id="canvas" width="860" height="500"></canvas>
<div class="info-section">
<h2>About Online Drawing Pad</h2>
<p>Simple好用的Online绘画Tools，支持自由涂鸦、Pen记标注、Simple绘图。支持触屏操作，可在手机和平板上使用。</p>
</div>

</div>
<div class="toast" id="toast"></div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const toast = document.getElementById('toast');
let drawing = false, eraser = false;
let penColor = '#000000', penSize = 3;
let history = [], historyIndex = -1;
const MAX_HISTORY = 20;

function showToast(msg) { toast.textContent=msg; toast.classList.add('show'); setTimeout(function(){toast.classList.remove('show')},2000); }

function saveState() {
  history = history.slice(0, historyIndex+1);
  history.push(canvas.toDataURL());
  if (history.length > MAX_HISTORY) history.shift();
  else historyIndex++;
}

function restoreState(index) {
  const img = new Image();
  img.onload = function() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
  };
  img.src = history[index];
}

// Init white background
ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
saveState();

document.getElementById('colorPicker').addEventListener('input', function() {
  penColor = this.value; eraser = false;
  document.getElementById('penBtn').classList.add('active');
  document.getElementById('eraserBtn').classList.remove('active');
});
document.getElementById('sizeSlider').addEventListener('input', function() {
  penSize = parseInt(this.value);
  document.getElementById('sizeVal').textContent = penSize + 'px';
});
document.getElementById('penBtn').addEventListener('click', function() {
  eraser = false; this.classList.add('active');
  document.getElementById('eraserBtn').classList.remove('active');
  canvas.style.cursor = 'crosshair';
});
document.getElementById('eraserBtn').addEventListener('click', function() {
  eraser = true; this.classList.add('active');
  document.getElementById('penBtn').classList.remove('active');
  canvas.style.cursor = 'cell';
});
document.getElementById('undoBtn').addEventListener('click', function() {
  if (historyIndex > 0) { historyIndex--; restoreState(historyIndex); }
});
document.getElementById('redoBtn').addEventListener('click', function() {
  if (historyIndex < history.length-1) { historyIndex++; restoreState(historyIndex); }
});
document.getElementById('clearBtn').addEventListener('click', function() {
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); saveState();
  showToast('画布已Clear');
});
document.getElementById('exportBtn').addEventListener('click', function() {
  const link = document.createElement('a');
  link.download = 'drawing.png'; link.href = canvas.toDataURL(); link.click();
  showToast('PNG exported');
});

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function startDraw(e) {
  drawing = true;
  const pos = getPos(e.touches ? e.touches[0] : e);
  ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
  ctx.strokeStyle = eraser ? '#ffffff' : penColor;
  ctx.lineWidth = penSize;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e.touches ? e.touches[0] : e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}

function endDraw() {
  if (drawing) { drawing = false; saveState(); }
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); startDraw(e); });
canvas.addEventListener('touchmove', function(e) { e.preventDefault(); draw(e); });
canvas.addEventListener('touchend', endDraw);
</script>
