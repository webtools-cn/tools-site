  <style>
    :root { --primary: #4F46E5; --primary-light: #6366F1; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --success: #10b981; --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,.06); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    .container { max-width: 720px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 24px 0 8px; }
    header a { color: var(--primary); text-decoration: none; font-size: .9rem; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: var(--text-secondary); font-size: .9rem; margin-bottom: 20px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
    .form-row label { font-size: .85rem; color: var(--text-secondary); min-width: 120px; }
    input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; background: #fff; color: var(--text); }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    input[type="number"] { width: 150px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: .9rem; cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .result-item { background: var(--bg); padding: 16px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .result-item .val { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .result-item .lbl { font-size: .8rem; color: var(--text-secondary); margin-top: 4px; }
    .result-item.highlight { border-color: var(--success); background: rgba(16,185,129,.05); }
    .result-item.highlight .val { color: var(--success); }
    .tax-row { display: flex; gap: 8px; align-items: center; }
    .tax-row input { width: 100px; }
    footer { text-align: center; padding: 24px 0; color: var(--text-secondary); font-size: .82rem; border-top: 1px solid var(--border); margin-top: 20px; }
    footer a { color: var(--text-secondary); margin: 0 8px; text-decoration: none; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: .85rem; z-index: 1000; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media(max-width:640px) { h1{font-size:1.2rem} .container{padding:0 12px} .card{padding:16px} .results{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/en/">← Back to Home</a>
      <h1>💰 Salary to Hourly Calculator</h1>
      <p class="subtitle">Convert your annual salary to hourly, daily, weekly, and monthly rates</p>
    </header>

    <div class="card">
      <div class="form-row">
        <label>Annual Salary</label>
        <input type="number" id="salary" value="50000" min="0" step="0.01" placeholder="Annual salary">
        <span style="font-size:.8rem;color:var(--text-secondary)">$</span>
      </div>

      <div class="form-row">
        <label>Days Per Week</label>
        <input type="number" id="days-per-week" value="5" min="1" max="7" step="1">
      </div>

      <div class="form-row">
        <label>Hours Per Day</label>
        <input type="number" id="hours-per-day" value="8" min="1" max="24" step="0.5">
      </div>

      <div class="form-row">
        <label>Weeks Per Year</label>
        <input type="number" id="weeks-per-year" value="52" min="1" max="52" step="1">
      </div>

      <div class="form-row" id="tax-section" style="display:none">
        <label>Tax Rate</label>
        <div class="tax-row">
          <input type="number" id="tax-rate" value="20" min="0" max="60" step="0.1">
          <span style="font-size:.8rem;color:var(--text-secondary)">%</span>
          <button class="btn btn-secondary" onclick="toggleTax()" style="font-size:.8rem;padding:6px 12px">Hide After-Tax</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="calculate()">🔄 Calculate</button>
        <button class="btn btn-secondary" onclick="toggleTax()">📊 Show After-Tax</button>
        <button class="btn btn-secondary" onclick="resetAll()">↺ Reset</button>
      </div>
    </div>

    <div class="card" id="result-card" style="display:none">
      <div class="results" id="results"></div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn btn-primary" onclick="copyResults()">📋 Copy Results</button>
      </div>
    </div>

    <footer>
      <a href="/en/">Home</a>
      <a href="/en/privacy">Privacy</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <!-- AdSense -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-5998441792679372"
       data-ad-slot="auto"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <script>
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }

    function toggleTax() {
      var sec = document.getElementById('tax-section');
      sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
      calculate();
    }

    function calculate() {
      var salary = parseFloat(document.getElementById('salary').value) || 0;
      var daysPerWeek = parseInt(document.getElementById('days-per-week').value) || 5;
      var hoursPerDay = parseFloat(document.getElementById('hours-per-day').value) || 8;
      var weeksPerYear = parseInt(document.getElementById('weeks-per-year').value) || 52;
      var showTax = document.getElementById('tax-section').style.display !== 'none';
      var taxRate = showTax ? (parseFloat(document.getElementById('tax-rate').value) || 0) / 100 : 0;

      if (salary <= 0) { showToast('Please enter a valid salary'); return; }

      var hoursPerWeek = daysPerWeek * hoursPerDay;
      var hoursPerYear = hoursPerWeek * weeksPerYear;
      var hourly = salary / hoursPerYear;
      var daily = hourly * hoursPerDay;
      var weekly = hourly * hoursPerWeek;
      var monthly = salary / 12;
      var afterTaxHourly = hourly * (1 - taxRate);
      var afterTaxMonthly = monthly * (1 - taxRate);
      var afterTaxYearly = salary * (1 - taxRate);

      var html = '<div class="result-item highlight"><div class="val">$' + hourly.toFixed(2) + '</div><div class="lbl">Hourly (Pre-Tax)</div></div>' +
        '<div class="result-item"><div class="val">$' + daily.toFixed(2) + '</div><div class="lbl">Daily</div></div>' +
        '<div class="result-item"><div class="val">$' + weekly.toFixed(2) + '</div><div class="lbl">Weekly</div></div>' +
        '<div class="result-item"><div class="val">$' + monthly.toFixed(2) + '</div><div class="lbl">Monthly</div></div>';

      if (showTax) {
        html += '<div class="result-item highlight"><div class="val">$' + afterTaxHourly.toFixed(2) + '</div><div class="lbl">Hourly (After-Tax)</div></div>' +
          '<div class="result-item"><div class="val">$' + afterTaxMonthly.toFixed(2) + '</div><div class="lbl">Monthly (After-Tax)</div></div>' +
          '<div class="result-item"><div class="val">$' + afterTaxYearly.toFixed(2) + '</div><div class="lbl">Annual (After-Tax)</div></div>';
      }

      document.getElementById('results').innerHTML = html;
      document.getElementById('result-card').style.display = 'block';
    }

    function resetAll() {
      document.getElementById('salary').value = '50000';
      document.getElementById('days-per-week').value = '5';
      document.getElementById('hours-per-day').value = '8';
      document.getElementById('weeks-per-year').value = '52';
      document.getElementById('tax-rate').value = '20';
      document.getElementById('tax-section').style.display = 'none';
      document.getElementById('result-card').style.display = 'none';
    }

    function copyResults() {
      var items = document.querySelectorAll('#results .result-item');
      var text = 'Salary to Hourly Calculator Results\n';
      text += '='.repeat(38) + '\n';
      items.forEach(function(item) {
        var val = item.querySelector('.val').textContent;
        var lbl = item.querySelector('.lbl').textContent;
        text += '  ' + lbl + ': ' + val + '\n';
      });
      navigator.clipboard.writeText(text).then(function() {
        showToast('✅ Results copied to clipboard');
      }).catch(function() {
        showToast('❌ Copy failed');
      });
    }

    document.querySelectorAll('input').forEach(function(el) {
      el.addEventListener('input', calculate);
    });
    calculate();
  </script>
</body>
</html>
