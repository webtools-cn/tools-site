<body>
<div class="container">
<div class="header"><h1>🎓 College Cost Calculator</h1><div class="lang-switch"><a href="../../college-cost-calculator/">中文</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › College Cost Calculator</p>
<div class="hero"><p>Estimate 4-year college total costs including inflation. Plan your 529 education savings and prepare financially for your child's higher education journey.</p><span class="badge">Zero Dependencies · Works Offline</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="tuition">Annual Tuition ($)</label><input type="number" id="tuition" value="30000" min="0" step="1000"><div class="hint">Current annual tuition cost</div></div>
    <div class="input-group"><label for="roomBoard">Annual Room & Board ($)</label><input type="number" id="roomBoard" value="12000" min="0" step="500"><div class="hint">On-campus housing + meal plan</div></div>
    <div class="input-group"><label for="books">Annual Books & Supplies ($)</label><input type="number" id="books" value="1500" min="0" step="100"><div class="hint">Textbooks, laptop, stationery</div></div>
    <div class="input-group"><label for="living">Annual Living Expenses ($)</label><input type="number" id="living" value="5000" min="0" step="500"><div class="hint">Transportation, personal, entertainment</div></div>
    <div class="input-group"><label for="yearsUntil">Years Until Enrollment</label><input type="number" id="yearsUntil" value="5" min="0" max="18" step="1"><div class="hint">Years until child starts college</div></div>
    <div class="input-group"><label for="inflationRate">Cost Growth Rate (%)</label><input type="number" id="inflationRate" value="4" min="0" max="10" step="0.1"><div class="hint">Annual college cost inflation (~3-5%)</div></div>
    <div class="input-group"><label for="currentSavings">Current Savings ($)</label><input type="number" id="currentSavings" value="20000" min="0" step="1000"><div class="hint">Amount already saved (529 plan, etc.)</div></div>
    <div class="input-group"><label for="investmentReturn">Investment Return Rate (%)</label><input type="number" id="investmentReturn" value="6" min="0" max="12" step="0.1"><div class="hint">Expected annual return on savings</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn">🔍 Calculate</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-secondary" id="copyBtn">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">💰 4-Year Total Cost</div><div class="value" id="totalCost">-</div><div class="sub">With inflation adjustment</div></div>
  <div class="result-card"><div class="label">📅 Year 1 Cost</div><div class="value" id="year1Cost">-</div><div class="sub">Estimated enrollment year cost</div></div>
  <div class="result-card"><div class="label">🏦 Savings Future Value</div><div class="value" id="savingsFuture">-</div><div class="sub">Current savings by enrollment</div></div>
  <div class="result-card"><div class="label">📊 Funding Gap</div><div class="value" id="gap">-</div><div class="sub">Total cost - savings value</div></div>
  <div class="result-card"><div class="label">💵 Monthly Savings Needed</div><div class="value" id="monthlyNeed">-</div><div class="sub">Monthly contribution to close gap</div></div>
  <div class="result-card"><div class="label">📈 Average Annual Cost</div><div class="value" id="avgAnnual">-</div><div class="sub">4-year average annual cost</div></div>
</div>
<div class="calculator-section">
  <h2>📊 Yearly Cost Breakdown</h2>
  <table class="result-table" id="yearTable">
    <tr><th>Year</th><th>Tuition</th><th>Room & Board</th><th>Books</th><th>Living</th><th>Total</th></tr>
  </table>
</div>
<div class="info-section">
  <h2>📖 College Cost Planning</h2>
  <h3>US College Cost Reference</h3>
  <p>Public In-State: $25K-30K/yr | Public Out-of-State: $40K-50K/yr | Private: $55K-75K/yr | Community College: $10K-15K/yr</p>
  <h3>529 Plan Benefits</h3>
  <p>Tax-free investment growth for education; some states offer tax deductions; transferable to other family members; covers college + grad school + K-12.</p>
  <h3>Student Loan Reality</h3>
  <p>US student loan debt exceeds $1.7 trillion, with average debt of $37,000 per borrower. Early savings planning can significantly reduce loan dependence.</p>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  const tuition=+$('tuition').value||0;
  const room=+$('roomBoard').value||0;
  const books=+$('books').value||0;
  const living=+$('living').value||0;
  const yrs=+$('yearsUntil').value||0;
  const infl=(+$('inflationRate').value||0)/100;
  const savings=+$('currentSavings').value||0;
  const ret=(+$('investmentReturn').value||0)/100;
  const baseAnnual=tuition+room+books+living;
  let totalCost=0;
  let html='<tr><th>Year</th><th>Tuition</th><th>Room & Board</th><th>Books</th><th>Living</th><th>Total</th></tr>';
  for(let y=0;y<4;y++){
    const factor=Math.pow(1+infl,yrs+y);
    const yrTuition=Math.round(tuition*factor);
    const yrRoom=Math.round(room*factor);
    const yrBooks=Math.round(books*factor);
    const yrLiving=Math.round(living*factor);
    const yrTotal=yrTuition+yrRoom+yrBooks+yrLiving;
    totalCost+=yrTotal;
    html+='<tr><td>Year '+(y+1)+'</td><td>'+fmt(yrTuition)+'</td><td>'+fmt(yrRoom)+'</td><td>'+fmt(yrBooks)+'</td><td>'+fmt(yrLiving)+'</td><td><b>'+fmt(yrTotal)+'</b></td></tr>';
  }
  const savingsFuture=savings*Math.pow(1+ret,yrs);
  const gap=Math.max(0,totalCost-savingsFuture);
  const monthlyNeed=yrs>0?gap/(yrs*12):0;
  $('totalCost').textContent=fmt(totalCost);
  $('year1Cost').textContent=fmt(Math.round(baseAnnual*Math.pow(1+infl,yrs)));
  $('savingsFuture').textContent=fmt(Math.round(savingsFuture));
  $('gap').textContent=fmt(Math.round(gap));
  $('monthlyNeed').textContent=fmt(Math.round(monthlyNeed));
  $('avgAnnual').textContent=fmt(Math.round(totalCost/4));
  $('yearTable').innerHTML=html;
}
function reset(){
  $('tuition').value=30000;$('roomBoard').value=12000;$('books').value=1500;
  $('living').value=5000;$('yearsUntil').value=5;$('inflationRate').value=4;
  $('currentSavings').value=20000;$('investmentReturn').value=6;
  ['totalCost','year1Cost','savingsFuture','gap','monthlyNeed','avgAnnual'].forEach(function(id){$(id).textContent='-';});
  $('yearTable').innerHTML='<tr><th>Year</th><th>Tuition</th><th>Room & Board</th><th>Books</th><th>Living</th><th>Total</th></tr>';
}
function copyResult(){
  const lines=['=== College Cost Estimate ===',
    '4-Year Total: '+$('totalCost').textContent,
    'Year 1 Cost: '+$('year1Cost').textContent,
    'Savings Future Value: '+$('savingsFuture').textContent,
    'Funding Gap: '+$('gap').textContent,
    'Monthly Savings Needed: '+$('monthlyNeed').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'));
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
