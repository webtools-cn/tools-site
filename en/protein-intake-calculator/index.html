<body>
<header>
  <h1>🥩 Protein Intake Calculator</h1>

</header>
<main>
  <div class="section">
    <div class="form-row">
      <div class="form-group">
        <label>Weight</label>
        <div class="input-with-suffix"><input type="number" id="weight" placeholder="70" value="70"><span class="suffix">kg</span></div>
      </div>
      <div class="form-group">
        <label>Activity Level</label>
        <select id="activity">
          <option value="sedentary">Sedentary (little/no exercise)</option>
          <option value="light">Light (1-3 days/week)</option>
          <option value="moderate" selected>Moderate (3-5 days/week)</option>
          <option value="active">Active (5-7 days/week)</option>
          <option value="athlete">Athlete / Intense training</option>
        </select>
      </div>
      <div class="form-group">
        <label>Goal</label>
        <select id="goal">
          <option value="maintain">Maintain Weight</option>
          <option value="muscle" selected>Build Muscle</option>
          <option value="fat-loss">Fat Loss</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calculate()">📊 Calculate</button>
      <button class="btn-outline" onclick="clearForm()">🗑️ Reset</button>
    </div>
  </div>
  <div class="section" id="result-card" style="display:none">
    <h3 style="margin-bottom:12px;font-size:.95rem;color:#94a3b8">Daily Protein Requirements</h3>
    <div class="results" id="results"></div>
    <h4 style="margin-top:16px;margin-bottom:8px;font-size:.85rem;color:#94a3b8">Recommended Range</h4>
    <div style="display:flex;justify-content:space-between;font-size:.8rem;color:#94a3b8"><span id="range-min"></span><span id="range-max"></span></div>
    <div class="range-bar"><div class="range-fill" id="range-fill"></div></div>
    <h4 style="margin-top:16px;margin-bottom:8px;font-size:.9rem;color:#94a3b8">🥘 Common Food Protein Content</h4>
    <div class="food-examples" id="food-examples"></div>
  </div>
</main>

<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
const foodData=[{emoji:'🍗',name:'Chicken Breast (100g)',protein:31},{emoji:'🥩',name:'Beef Steak (100g)',protein:26},{emoji:'🐟',name:'Salmon (100g)',protein:22},{emoji:'🥚',name:'Egg (1 large)',protein:6},{emoji:'🥛',name:'Milk (250ml)',protein:8},{emoji:'🧀',name:'Cheese (30g)',protein:7},{emoji:'🫘',name:'Tofu (100g)',protein:8},{emoji:'🥜',name:'Peanuts (30g)',protein:8},{emoji:'🫛',name:'Lentils (100g cooked)',protein:9},{emoji:'🍚',name:'Protein Powder (1 scoop)',protein:24}];
function calculate(){
  const weight=parseFloat(document.getElementById('weight').value)||0;
  const activity=document.getElementById('activity').value;
  const goal=document.getElementById('goal').value;
  if(weight<=0){showToast('Please enter a valid weight');return}

  const factors={sedentary:[0.8,1.0],light:[1.0,1.2],moderate:[1.2,1.6],active:[1.6,2.0],athlete:[1.8,2.2]};
  let [low,high]=factors[activity]||[1.2,1.6];
  if(goal==='muscle'){low+=0.2;high+=0.4}
  else if(goal==='fat-loss'){low+=0.1;high+=0.2}

  const minProtein=weight*low;
  const maxProtein=weight*high;
  const midProtein=(minProtein+maxProtein)/2;

  document.getElementById('result-card').style.display='block';
  document.getElementById('results').innerHTML=`
    <div class="result-item"><div class="result-label">Minimum</div><div class="result-value">${minProtein.toFixed(0)}g</div></div>
    <div class="result-item"><div class="result-label">Recommended</div><div class="result-value">${midProtein.toFixed(0)}g</div></div>
    <div class="result-item"><div class="result-label">Maximum</div><div class="result-value">${maxProtein.toFixed(0)}g</div></div>
    <div class="result-item"><div class="result-label">Per kg Body Weight</div><div class="result-value">${low.toFixed(1)}-${high.toFixed(1)}g</div></div>
    <div class="result-item"><div class="result-label">Per Meal (4 meals)</div><div class="result-value">${(midProtein/4).toFixed(0)}g</div></div>
  `;
  document.getElementById('range-min').textContent=minProtein.toFixed(0)+'g';
  document.getElementById('range-max').textContent=maxProtein.toFixed(0)+'g';
  const pct=Math.min(100,(midProtein/200)*100);
  document.getElementById('range-fill').style.width=pct+'%';
  document.getElementById('food-examples').innerHTML=foodData.map(f=>{
    const servings=(midProtein/f.protein).toFixed(1);
    return '<div class="food-item"><span class="emoji">'+f.emoji+'</span><span class="name">'+f.name+'</span><span class="amount">≈'+servings+' servings ('+f.protein+'g protein)</span></div>';
  }).join('');
}
function clearForm(){document.getElementById('weight').value='70';document.getElementById('activity').value='moderate';document.getElementById('goal').value='muscle';document.getElementById('result-card').style.display='none'}
calculate();
</script>
<script>
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 Copy';
      btn.title = 'Copy results';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
