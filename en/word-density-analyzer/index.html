<h2>What Can the Word Density Analyzer Do?</h2>
<p>The Word Density Analyzer is a free online tool that helps SEO professionals, content creators, and text analysis researchers count word frequency, density percentage, and TF-IDF weight in any text. It supports automatic Chinese/English tokenization, stopword filtering, and multiple sorting methods — an essential tool for SEO keyword optimization and text content analysis.</p>
<h2>Core Features</h2>
<ul><li><strong>Mixed Language Tokenization</strong>: Auto-detect language, dictionary-based Chinese tokenization, space-based English tokenization</li><li><strong>Frequency Statistics</strong>: Precisely count occurrences of each word in the text</li><li><strong>Density Calculation</strong>: Calculate keyword density percentage for SEO optimization</li><li><strong>TF-IDF Analysis</strong>: Compute TF-IDF weights to identify core keywords</li><li><strong>Stopword Filtering</strong>: Built-in Chinese and English stopword lists</li><li><strong>Multi-dimensional Sorting</strong>: Sort by frequency, density, or TF-IDF weight</li><li><strong>Export</strong>: Copy results or download as CSV file</li></ul>
<h2>How to Use</h2>
<p>1. Enter or paste your article content in the text area</p><p>2. Adjust analysis settings (stopword filter, min word length, display count)</p><p>3. Choose sorting method (by frequency/density/TF-IDF)</p><p>4. Review the analysis table for keyword distribution</p><p>5. Click "Copy Results" or "Download CSV" to export data</p>
<h2>Use Cases</h2>
<h3>Case 1: SEO Keyword Optimization</h3><p>SEO professionals analyze keyword density to ensure core keywords fall within the ideal 1%-3% range, avoiding keyword stuffing penalties from search engines.</p>
<h3>Case 2: Content Quality Analysis</h3><p>Content editors analyze vocabulary distribution to evaluate whether content revolves around core topics, detecting off-topic or repetitive word usage.</p>
<h3>Case 3: Academic Text Research</h3><p>Researchers use TF-IDF analysis to identify core topic words in documents, aiding literature classification and topic modeling research.</p>
<h2>Extended Knowledge</h2>
<p>Keyword Density is a core SEO concept referring to the frequency of target keywords in page text. Early SEO relied heavily on keyword density for ranking, but modern search engines use more sophisticated semantic analysis. TF-IDF (Term Frequency-Inverse Document Frequency) is a classic information retrieval algorithm where TF measures word frequency in a document and IDF measures word rarity. Words with high TF-IDF values are typically the document's core keywords. Chinese tokenization is a fundamental NLP task, with common methods including dictionary-based matching and statistical sequence labeling (HMM, CRF).</p>

function tokenize(text){

        const word=remaining.substring(0,len);
        if(CN_DICT.includes(word)){tokens.push(word);remaining=remaining.substring(len);matched=true;break;}
      }
      if(!matched){remaining=remaining.substring(1);}
    }
  }
  return tokens;
}
function analyze(){
  const text=document.getElementById('input-text').value;
  if(!text.trim()){document.getElementById('result-body').innerHTML='\x3Ctr>\x3Ctd colspan="6" style="text-align:center;color:#64748b;padding:20px">Please enter text to analyze\x3C/td>\x3C/tr>';document.getElementById('summary').textContent='';return;}
  const filterStop=document.getElementById('filter-stopwords').checked;
  const minLen=parseInt(document.getElementById('min-length').value)||2;
  const showCount=parseInt(document.getElementById('show-count').value)||50;
  const tokens=tokenize(text);
  const filtered=filterStop?tokens.filter(w=>!CN_STOPWORDS.has(w)&&!EN_STOPWORDS.has(w)):tokens;
  const valid=filtered.filter(w=>w.length>=minLen);
  const total=valid.length;
  const freq={};
  valid.forEach(w=>{freq[w]=(freq[w]||0)+1;});
  const totalTypes=Object.keys(freq).length;
  const results=Object.entries(freq).map(([word,count])=>{
    const density=(count/total*100);
    const tf=count/total;
    const idf=Math.log(totalTypes/count+1);
    const tfidf=tf*idf;
    return{word,count,density,tfidf};
  });
  results.sort((a,b)=>b[currentSort]-a[currentSort]);
  lastResults=results.slice(0,showCount);
  const maxCount=results[0]?results[0].count:1;
  const tbody=document.getElementById('result-body');
  tbody.innerHTML=lastResults.map((r,i)=>{
    const barW=(r.count/maxCount*100).toFixed(1);
    const densityColor=r.density<0.5?'#ef4444':r.density<=3?'#10b981':r.density<=5?'#eab308':'#ef4444';
    return`\x3Ctr>\x3Ctd style="color:#64748b">${i+1}\x3C/td>\x3Ctd style="color:#e2e8f0;font-weight:500">${r.word}\x3C/td>\x3Ctd>${r.count}\x3C/td>\x3Ctd style="color:${densityColor}">${r.density.toFixed(2)}%\x3C/td>\x3Ctd>${r.tfidf.toFixed(4)}\x3C/td>\x3Ctd>\x3Cdiv class="density-bar">\x3Cdiv class="density-bar-fill" style="width:${barW}%">\x3C/div>\x3C/div>\x3C/td>\x3C/tr>`;
  }).join('');
  document.getElementById('summary').textContent=`Total words: ${total} | Unique words: ${totalTypes} | Vocabulary richness: ${(totalTypes/total*100).toFixed(1)}%`;
}
function setSort(type,btn){
  currentSort=type;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  analyze();
}

  document.getElementById('input-text').value='搜索引擎优化（SEO）是一种通过了解搜索引擎的运作规则来调整网站，以提升网站在有关搜索引擎内排名的方式。SEO的主要目标是提高网站在搜索Result中的可见性，从而获得More的自然流量。关键词研究是SEO的基础，通过分析用户搜索行为，找到有价值的关键词。页面优化包括标题标签、元描述、URL结构、内容质量等方面。外部链接建设是提升网站权威性的重要手段。技术SEO关注网站速度、移动端适配、结构化数据等技术因素。内容营销与SEO密不可分，高质量的内容是获得搜索排名的根本。Search engine optimization is the process of improving the quality and quantity of website traffic from search engines. SEO targets unpaid traffic rather than direct traffic or paid traffic.';
  analyze();
}
window.clearInput = clearInput; function clearInput(){document.getElementById('input-text').value='';analyze();}
function copyResults(){
  const text='排名\t词语\t频率\t密度\tTF-IDF\n'+lastResults.map((r,i)=>`${i+1}\t${r.word}\t${r.count}\t${r.density.toFixed(2)}%\t${r.tfidf.toFixed(4)}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>{const t=document.getElementById('copy-toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);});
}
function downloadCSV(){
  const csv='Rank,Word,Count,Density,TF-IDF\n'+lastResults.map((r,i)=>`${i+1},"${r.word}",${r.count},${r.density.toFixed(2)}%,${r.tfidf.toFixed(4)}`).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='word-density-analysis.csv';a.click();
}
function toggleFaq(el){el.parentElement.classList.toggle('open');}
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'){analyze();e.preventDefault();}if(e.ctrlKey&&e.shiftKey&&e.key==='C'){copyResults();e.preventDefault();}if(e.ctrlKey&&e.shiftKey&&e.key==='X'){clearInput();e.preventDefault();}});
analyze();
</script>
