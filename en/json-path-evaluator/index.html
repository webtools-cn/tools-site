  <main>
    <h1>JSON Path Evaluator</h1>
    <p class="subtitle">Enter JSON data and a JSONPath expression to extract values. Supports nested objects, array filtering, and wildcards.</p>
    <div class="input-row">
      <input type="text" id="pathInput" placeholder="e.g. $.store.book[*].author" value="$.store.book[*].author">
      <button class="btn btn-primary" id="evalBtn">Evaluate</button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>
    <div class="editor-panel">
      <div class="panel">
        <h3>JSON Input</h3>
        <textarea id="jsonInput" placeholder='{"store":{"book":[{"title":"Sayings","author":"Author1"},{"title":"Sword","author":"Author2"}]}}'>{"store":{"book":[{"title":"Sayings of the Century","author":"Nigel Rees","price":8.95},{"title":"Sword of Honour","author":"Evelyn Waugh","price":12.99},{"title":"Moby Dick","author":"Herman Melville","price":8.99}],"bicycle":{"color":"red","price":19.95}}}</textarea>
        <div class="examples">
          <span style="font-size:.75rem;color:var(--text-secondary)">Examples:</span>
          <button onclick="setExample('$.store.book[*].author')">All Authors</button>
          <button onclick="setExample('$.store.book[0].title')">First Book</button>
          <button onclick="setExample('$.store.book[?(@.price<10)].title')">Cheap Books</button>
          <button onclick="setExample('$.store.bicycle.color')">Bicycle Color</button>
        </div>
      </div>
      <div class="panel">
        <h3>Result</h3>
        <div class="output-area" id="output">Enter JSON and a path, then click "Evaluate"</div>
      </div>

  <script>
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error show' : 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }
  function evalPath(obj, path) {
    path = path.replace(/^\$\.?/, '');
    if (!path) return [obj];
    var tokens = [];
    var i = 0, ch;
    while (i < path.length) {
      ch = path[i];
      if (ch === '.') { i++; continue; }
      if (ch === '[') {
        var end = path.indexOf(']', i);
        if (end === -1) throw new Error('Unclosed bracket');
        var content = path.substring(i+1, end);
        tokens.push({ type: 'bracket', value: content });
        i = end + 1;
      } else {
        var j = i;
        while (j < path.length && path[j] !== '.' && path[j] !== '[') j++;
        tokens.push({ type: 'key', value: path.substring(i, j) });
        i = j;
      }
    }
    var results = [obj];
    for (var ti = 0; ti < tokens.length; ti++) {
      var token = tokens[ti];
      var nextResults = [];
      for (var ri = 0; ri < results.length; ri++) {
        var cur = results[ri];
        if (cur === null || cur === undefined) continue;
        if (token.type === 'key') {
          if (token.value === '*') {
            if (Array.isArray(cur)) { for (var a=0;a<cur.length;a++) nextResults.push(cur[a]); }
            else if (typeof cur === 'object') { for (var k in cur) if (cur.hasOwnProperty(k)) nextResults.push(cur[k]); }
          } else {
            if (cur.hasOwnProperty(token.value)) nextResults.push(cur[token.value]);
          }
        } else {
          var v = token.value;
          if (v === '*') {
            if (Array.isArray(cur)) { for (var a=0;a<cur.length;a++) nextResults.push(cur[a]); }
          } else if (/^\d+$/.test(v)) {
            var idx = parseInt(v);
            if (Array.isArray(cur) && idx < cur.length) nextResults.push(cur[idx]);
          } else if (v.startsWith('?(') && v.endsWith(')')) {
            var expr = v.slice(2, -1);
            if (Array.isArray(cur)) {
              for (var a=0;a<cur.length;a++) {
                var item = cur[a];
                try {
                  var cond = evalFilter(expr, item);
                  if (cond) nextResults.push(item);
                } catch(e) {}
              }
            }
          }
        }
      }
      results = nextResults;
    }
    return results;
  }
  function evalFilter(expr, item) {
    var m = expr.match(/@\.(\w+)\s*(<|>|<=|>=|==|!=)\s*(.+)/);
    if (!m) return false;
    var field = m[1], op = m[2], val = m[3].trim().replace(/['"]/g, '');
    var fv = item[field];
    var nv = isNaN(val) ? val : parseFloat(val);
    switch(op) {
      case '<': return fv < nv;
      case '>': return fv > nv;
      case '<=': return fv <= nv;
      case '>=': return fv >= nv;
      case '==': return fv == nv;
      case '!=': return fv != nv;
      default: return false;
    }
  }
  function formatResult(results) {
    if (results.length === 0) return '<span class="error">No matches found</span>';
    if (results.length === 1) return '<pre>' + JSON.stringify(results[0], null, 2) + '</pre>';
    var html = '<div>Found ' + results.length + ' results:</div>';
    for (var i=0;i<results.length;i++) {
      html += '<div class="result-item"><strong>[' + i + ']</strong> ' + JSON.stringify(results[i]) + '</div>';
    }
    return html;
  }
  document.getElementById('evalBtn').addEventListener('click', function(){
    var jsonStr = document.getElementById('jsonInput').value.trim();
    var path = document.getElementById('pathInput').value.trim();
    if (!jsonStr) { showToast('Please enter JSON data', true); return; }
    if (!path) { showToast('Please enter a JSONPath expression', true); return; }
    try {
      var obj = JSON.parse(jsonStr);
      var results = evalPath(obj, path);
      document.getElementById('output').innerHTML = formatResult(results);
    } catch(e) {
      document.getElementById('output').innerHTML = '<span class="error">Error: ' + e.message + '</span>';
      showToast('Parse failed: ' + e.message, true);
    }
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    document.getElementById('output').innerHTML = 'Enter JSON and a path, then click "Evaluate"';
    document.getElementById('pathInput').value = '';
  });
  function setExample(path) {
    document.getElementById('pathInput').value = path;
    document.getElementById('evalBtn').click();
  }
  document.getElementById('jsonInput').addEventListener('input', function(){
    var path = document.getElementById('pathInput').value.trim();
    if (path) document.getElementById('evalBtn').click();
  });
  </script>
