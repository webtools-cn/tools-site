  <style>
    :root{--primary:#4F46E5;--primary-hover:#4338CA;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px;--green:#10b981;--red:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

    .input-with-suffix{position:relative}
    .input-with-suffix input{padding-right:40px}
    .input-with-suffix .suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:.85rem}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}
    button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
    .btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:rgba(79,70,229,.05)}
    .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
    .result-item{background:linear-gradient(135deg,#f0f4ff,#e8ecff);border-radius:10px;padding:16px;text-align:center}

    .comparison-grid .col-header{font-weight:700;font-size:.85rem;padding:8px;text-align:center;background:#f1f5f9;border-radius:6px}
    .comparison-grid .col-cell{text-align:center;padding:6px;font-size:.85rem;border-bottom:1px solid var(--border)}
    .comparison-grid .col-cell.highlight{font-weight:700}
    .verdict{text-align:center;padding:16px;border-radius:10px;font-size:1.1rem;font-weight:700;margin-top:12px}
    .verdict.save{background:#d1fae5;color:#065f46}
    .verdict.keep{background:#fee2e2;color:#991b1b}
    .verdict.neutral{background:#e0e7ff;color:#3730a3}
    footer{background:var(--surface);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.8rem;color:var(--text-secondary)}
    @media(max-width:600px){main{padding:12px}.card{padding:16px}.results{grid-template-columns:1fr 1fr}.comparison-grid{font-size:.75rem}}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(6,182,212,.1);color:#22d3ee;border:1px solid rgba(6,182,212,.25);border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s;margin-left:8px;vertical-align:top}
.copy-btn:hover{background:rgba(6,182,212,.25)}

<body>
<header>
  <h1>🚗 Auto Refinance Calculator</h1>
  <a href="/en/">← Back to Home</a>
</header>
<main>
  <div class="card">
    <h2>📋 Current Loan</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Remaining Principal</label>
        <div class="input-with-suffix"><input type="number" id="current-principal" placeholder="150000" value="150000"><span class="suffix">¥</span></div>
      </div>
      <div class="form-group">
        <label>Remaining Term</label>
        <div class="input-with-suffix"><input type="number" id="current-months" placeholder="36" value="36"><span class="suffix">months</span></div>
      </div>
      <div class="form-group">
        <label>Current APR</label>
        <div class="input-with-suffix"><input type="number" id="current-rate" placeholder="6.5" value="6.5" step="0.01"><span class="suffix">%</span></div>
      </div>
      <div class="form-group">
        <label>Current Monthly</label>
        <div class="input-with-suffix"><input type="number" id="current-monthly" placeholder="4600" value="4600"><span class="suffix">¥/mo</span></div>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>🔄 Refinancing Option</h2>
    <div class="form-row">
      <div class="form-group">
        <label>New APR</label>
        <div class="input-with-suffix"><input type="number" id="new-rate" placeholder="4.5" value="4.5" step="0.01"><span class="suffix">%</span></div>
      </div>
      <div class="form-group">
        <label>New Term</label>
        <select id="new-months">
          <option value="24">2 years (24 mo)</option>
          <option value="36" selected>3 years (36 mo)</option>
          <option value="48">4 years (48 mo)</option>
          <option value="60">5 years (60 mo)</option>
          <option value="72">6 years (72 mo)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Refinancing Fee</label>
        <div class="input-with-suffix"><input type="number" id="refinance-fee" placeholder="2000" value="2000"><span class="suffix">¥</span></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calculate()">📊 Compare</button>
      <button class="btn-outline" onclick="clearForm()">🗑️ Reset</button>
    </div>
  </div>
  <div class="card" id="result-card" style="display:none">
    <h3 style="margin-bottom:12px;font-size:.95rem;color:var(--text-secondary)">Refinancing Comparison</h3>
    <div class="results" id="results"></div>
    <div id="verdict" class="verdict" style="margin-top:16px"></div>
    <h4 style="margin-top:20px;margin-bottom:8px;font-size:.9rem;color:var(--text-secondary)">Detailed Comparison</h4>
    <div class="comparison-grid" id="comparison"></div>
  </div>
</main>
<footer>© 2025 Free ToolBase · Free Online Tools</footer>
<script>
function showToast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .3s";document.body.appendChild(t);}t.textContent=m;t.style.opacity="1";setTimeout(function(){t.style.opacity="0"},2500);}
</script>
<script>
function formatMoney(n){return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function calcMonthlyPayment(principal,months,annualRate){
  const mr=annualRate/100/12;
  if(mr===0) return principal/months;
  return principal*mr*Math.pow(1+mr,months)/(Math.pow(1+mr,months)-1);
}
function calculate(){
  const curPrin=parseFloat(document.getElementById('current-principal').value)||0;
  const curMonths=parseInt(document.getElementById('current-months').value)||0;
  const curRate=parseFloat(document.getElementById('current-rate').value)||0;
  const curMonthly=parseFloat(document.getElementById('current-monthly').value)||0;
  const newRate=parseFloat(document.getElementById('new-rate').value)||0;
  const newMonths=parseInt(document.getElementById('new-months').value)||0;
  const fee=parseFloat(document.getElementById('refinance-fee').value)||0;
  if(curPrin<=0||curMonths<=0||newMonths<=0){showToast('Please enter valid values');return}

  const curTotal=curMonthly*curMonths;
  const curInterest=curTotal-curPrin;
  const newMonthly=calcMonthlyPayment(curPrin+fee,newMonths,newRate);
  const newTotal=newMonthly*newMonths;
  const newInterest=newTotal-curPrin-fee;
  const monthlyDiff=curMonthly-newMonthly;
  const totalDiff=curTotal-newTotal;
  const breakEven=fee/(curMonthly-newMonthly);

  document.getElementById('result-card').style.display='block';
  document.getElementById('results').innerHTML=`
    <div class="result-item"><div class="result-label">Current Monthly</div><div class="result-value">¥${formatMoney(curMonthly)}</div></div>
    <div class="result-item"><div class="result-label">New Monthly</div><div class="result-value">¥${formatMoney(newMonthly)}</div></div>
    <div class="result-item"><div class="result-label">Monthly Difference</div><div class="result-value ${monthlyDiff>0?'green':'red'}">${monthlyDiff>0?'-':'+'}¥${formatMoney(Math.abs(monthlyDiff))}</div></div>
    <div class="result-item"><div class="result-label">Remaining Interest</div><div class="result-value">¥${formatMoney(curInterest)}</div></div>
    <div class="result-item"><div class="result-label">New Total Interest</div><div class="result-value">¥${formatMoney(newInterest)}</div></div>
    <div class="result-item ${totalDiff>0?'savings':'cost'}"><div class="result-label">${totalDiff>0?'Total Savings':'Extra Cost'}</div><div class="result-value ${totalDiff>0?'green':'red'}">${totalDiff>0?'':'+'}¥${formatMoney(Math.abs(totalDiff))}</div></div>
  `;

  let verdictHtml='',verdictClass='';
  if(totalDiff>fee*2){verdictHtml='✅ <strong>Strongly recommended!</strong> Save ¥'+formatMoney(totalDiff)+', well above the ¥'+formatMoney(fee)+' refinancing fee';verdictClass='save'}
  else if(totalDiff>0 && totalDiff>=fee){verdictHtml='👍 <strong>Recommended</strong>, save ¥'+formatMoney(totalDiff)+' (including ¥'+formatMoney(fee)+' fee), break-even in ~'+Math.ceil(breakEven)+' months';verdictClass='save'}
  else if(totalDiff>0 && totalDiff<fee){verdictHtml='🤔 <strong>Marginal savings</strong>, save ¥'+formatMoney(totalDiff)+' but fee is ¥'+formatMoney(fee)+', break-even ~'+Math.ceil(breakEven)+' months';verdictClass='neutral'}
  else{verdictHtml='❌ <strong>Not recommended</strong>, the new plan costs ¥'+formatMoney(Math.abs(totalDiff))+' more overall';verdictClass='keep'}
  document.getElementById('verdict').innerHTML=verdictHtml;
  document.getElementById('verdict').className='verdict '+verdictClass;

  document.getElementById('comparison').innerHTML=`
    <div class="col-header">Item</div><div class="col-header">Current Loan</div><div class="col-header">New Plan</div>
    <div class="col-cell">Monthly Payment</div><div class="col-cell">¥${formatMoney(curMonthly)}</div><div class="col-cell highlight">¥${formatMoney(newMonthly)}</div>
    <div class="col-cell">Remaining Term</div><div class="col-cell">${curMonths} months</div><div class="col-cell">${newMonths} months</div>
    <div class="col-cell">APR</div><div class="col-cell">${curRate}%</div><div class="col-cell highlight">${newRate}%</div>
    <div class="col-cell">Total Remaining</div><div class="col-cell">¥${formatMoney(curTotal)}</div><div class="col-cell highlight">¥${formatMoney(newTotal)}</div>
    <div class="col-cell">Remaining Interest</div><div class="col-cell">¥${formatMoney(curInterest)}</div><div class="col-cell highlight">¥${formatMoney(newInterest)}</div>
    <div class="col-cell">Refinancing Fee</div><div class="col-cell">-</div><div class="col-cell">¥${formatMoney(fee)}</div>
  `;
}
function clearForm(){document.getElementById('current-principal').value='150000';document.getElementById('current-months').value='36';document.getElementById('current-rate').value='6.5';document.getElementById('current-monthly').value='4600';document.getElementById('new-rate').value='4.5';document.getElementById('new-months').value='36';document.getElementById('refinance-fee').value='2000';document.getElementById('result-card').style.display='none'}
calculate();
</script>
<script>
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 Copy';
      btn.title = 'Copy results';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
</body>
