<body>
<div class="container">
<div class="nav-back"><a href="/en/">← Back to Home</a></div>
<div class="header"><h1>HRA Calculator</h1><div class="lang-switch"><a href="https://free-toolbase.com/hra-calculator/">中文</a><a href="https://free-toolbase.com/en/hra-calculator/" class="active">English</a></div></div>
<div class="calc-section">
<h2>Parameters</h2>
<div class="input-grid" id="input-grid"></div>
<div class="btn-row">
<button class="btn btn-primary" onclick="calculate()">Calculate</button>
<button class="btn btn-secondary" onclick="clearAll()">Clear</button>
<button class="btn btn-secondary" onclick="copyResults()">📋 Copy Results</button>
</div>
<div class="result-section" id="result-section" style="display:none">
<h3>Results</h3>
<div class="result-grid" id="result-grid"></div>
<div class="note" id="note-text"></div>
</div>
</div>

<p><a href="/en/about/">About</a> · <a href="/en/terms/">Terms</a> · <a href="/en/privacy/">Privacy</a></p>
</footer>
</div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:12px 24px;border-radius:8px;border:1px solid rgba(6,182,212,.3);font-size:.9rem;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)"></div>
<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
function fmt(n,d){d=d||2;return Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
function copyResults(){const items=document.querySelectorAll('.result-item');let text='';items.forEach(function(item){const label=item.querySelector('.label').textContent;const value=item.querySelector('.value').textContent;text+=label+': '+value+'\n';});navigator.clipboard.writeText(text).then(function(){showToast('Copied to clipboard');});}
// == TOOL LOGIC ==

function initInputs() {
  document.getElementById('input-grid').innerHTML = `
    <div class="input-group"><label>Basic Salary</label><input type="number" id="basic" value="50000" min="1" step="1000"><div class="hint">Monthly basic salary</div></div>
    <div class="input-group"><label>HRA Received</label><input type="number" id="hraReceived" value="20000" min="0" step="500"></div>
    <div class="input-group"><label>Actual Rent Paid</label><input type="number" id="rentPaid" value="15000" min="0" step="500"></div>
    <div class="input-group"><label>City Type</label><select id="cityType"><option value="metro">Metro (50%)</option><option value="nonmetro">Non-Metro (40%)</option></select></div>
  `;
}
function calculate() {
  const basic = parseFloat(document.getElementById('basic').value) || 0;
  const hraReceived = parseFloat(document.getElementById('hraReceived').value) || 0;
  const rentPaid = parseFloat(document.getElementById('rentPaid').value) || 0;
  const cityType = document.getElementById('cityType').value;
  const pct = cityType === 'metro' ? 0.5 : 0.4;
  const option2 = rentPaid > 0 ? rentPaid - 0.1 * basic : 0;
  const option3 = basic * pct;
  const exemption = Math.max(0, Math.min(hraReceived, Math.max(0, option2), option3));
  const taxable = Math.max(0, hraReceived - exemption);
  document.getElementById('result-grid').innerHTML = `
    <div class="result-item"><div class="label">Monthly Exemption</div><div class="value">` + fmt(exemption) + `</div></div>
    <div class="result-item"><div class="label">Taxable HRA/Mo</div><div class="value">` + fmt(taxable) + `</div></div>
    <div class="result-item"><div class="label">Annual Exemption</div><div class="value">` + fmt(exemption * 12) + `</div></div>
    <div class="result-item"><div class="label">Taxable HRA/Yr</div><div class="value">` + fmt(taxable * 12) + `</div></div>
    <div class="result-item"><div class="label">City Multiplier</div><div class="value">` + (pct*100).toFixed(0) + `%</div></div>
  `;
  document.getElementById('note-text').textContent = 'HRA exemption = min(Actual HRA, Rent Paid - 10% Basic, 50%/40% of Basic for Metro/Non-Metro).';
  document.getElementById('result-section').style.display = 'block';
}
function clearAll() { document.getElementById('basic').value='50000';document.getElementById('hraReceived').value='20000';document.getElementById('rentPaid').value='15000';document.getElementById('cityType').value='metro';document.getElementById('result-section').style.display='none'; }

initInputs();
calculate();
</script>
