<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Code Converter - Free ToolBase</title>
  <meta name="description" content="Free online Tap Code encoder/decoder - convert text to/from the 5×5 grid tap code cipher, classic prisoner communication method.">
  <meta property="og:title" content="Tap Code Converter - Free ToolBase">
  <meta property="og:description" content="Free online Tap Code encoder/decoder - convert text to/from the 5×5 grid tap code cipher.">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Tap Code Converter","applicationCategory":"UtilityApplication","operatingSystem":"Web","description":"Free online tap code encoder/decoder"}</script>
  <style>
    :root{--primary:#4F46E5;--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}
    .lang-switch a{color:var(--sub);font-size:14px;text-decoration:none;padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
    .lang-switch a:hover{color:var(--primary);border-color:var(--primary)}
    main{flex:1;max-width:800px;margin:0 auto;padding:40px 20px;width:100%}
    h1{font-size:28px;margin-bottom:8px;text-align:center}
    .subtitle{text-align:center;color:var(--sub);margin-bottom:32px}
    .card{background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--border);margin-bottom:20px}
    textarea{width:100%;min-height:100px;border:2px solid var(--border);border-radius:8px;padding:12px;font-size:15px;font-family:monospace;resize:vertical}
    textarea:focus{outline:none;border-color:var(--primary)}
    .btn-row{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
    .btn{padding:10px 24px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
    .btn-outline:hover{background:var(--primary);color:#fff}
    .output-box{min-height:80px;padding:16px;background:#f1f5f9;border-radius:8px;font-family:monospace;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
    .grid-5x5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px;margin:12px auto}
    .grid-cell{background:#f1f5f9;padding:12px;text-align:center;font-weight:700;border-radius:6px;font-size:18px}
    .grid-cell.header{background:var(--primary);color:#fff;font-size:12px}
    footer{text-align:center;padding:24px;color:var(--sub);font-size:13px;border-top:1px solid var(--border)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:22px}}
  </style>
</head>
<body>
<header><a href="/en/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/tap-code/">intext</a></div></header>
<main>
  <h1>👆 Tap Code Converter</h1>
  <p class="subtitle">5×5 grid cipher — encode letters by tap counts (classic POW communication method)</p>
  <div class="card">
    <textarea id="input" placeholder="Enter text, e.g.: HELLO"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnEncode">➡️ Encode to Tap Code</button>
      <button class="btn btn-outline" id="btnDecode">⬅️ Decode Tap Code</button>
      <button class="btn btn-outline" id="btnCopy">📋 Copy Result</button>
      <button class="btn btn-outline" id="btnClear">🗑️ Clear</button>
    </div>
    <div class="output-box" id="output"></div>
  </div>
  <div class="card">
    <h3>📖 5×5 Tap Code Grid</h3>
    <div class="grid-5x5" id="tapGrid"></div>
  </div>
</main>
<footer>© 2024 Free ToolBase · Client-side only</footer>
<div class="toast" id="toast"></div>
<script>
const TAP={
  'A':'11','B':'12','C':'13','D':'14','E':'15',
  'F':'21','G':'22','H':'23','I':'24','J':'25',
  'L':'31','M':'32','N':'33','O':'34','P':'35',
  'Q':'41','R':'42','S':'43','T':'44','U':'45',
  'V':'51','W':'52','X':'53','Y':'54','Z':'55'
};
const REVERSE={};
for(const[k,v]of Object.entries(TAP))REVERSE[v]=k;
function encode(text){
  return [...text.toUpperCase().replace(/K/g,'C')].map(ch=>TAP[ch]||ch).join(' ');
}
function decode(code){
  return code.split(/\s+/).map(p=>{
    if(/^\d{2}$/.test(p))return REVERSE[p]||'?';
    return p;
  }).join('');
}
function renderGrid(){
  const letters='ABCDEFGHIJLMNOPQRSTUVWXYZ'.split('');
  let html='<div class="grid-cell header">#</div><div class="grid-cell header">1</div><div class="grid-cell header">2</div><div class="grid-cell header">3</div><div class="grid-cell header">4</div><div class="grid-cell header">5</div>';
  for(let r=1;r<=5;r++){
    html+=`<div class="grid-cell header">${r}</div>`;
    for(let c=1;c<=5;c++){
      const idx=(r-1)*5+(c-1);
      const ch=idx<24?letters[idx]:' ';
      html+=`<div class="grid-cell">${ch}<br><small>${r}${c}</small></div>`;
    }
  }
  document.getElementById('tapGrid').innerHTML=html;
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.getElementById('btnEncode').addEventListener('click',()=>{
  const input=document.getElementById('input').value.trim();
  if(!input){showToast('Please enter text first');return}
  document.getElementById('output').textContent=encode(input);
});
document.getElementById('btnDecode').addEventListener('click',()=>{
  const input=document.getElementById('input').value.trim();
  if(!input){showToast('Please enter tap codes first');return}
  document.getElementById('output').textContent=decode(input);
});
document.getElementById('btnCopy').addEventListener('click',()=>{
  const t=document.getElementById('output').textContent;
  if(!t){showToast('Nothing to copy');return}
  navigator.clipboard.writeText(t).then(()=>showToast('Copied'));
});
document.getElementById('btnClear').addEventListener('click',()=>{
  document.getElementById('input').value='';document.getElementById('output').textContent='';
});
renderGrid();
</script>
</body>
</html>
