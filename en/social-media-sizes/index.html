    .platform-section { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
    .platform-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 16px; border-bottom: 1px solid transparent; transition: background .2s; }
    .platform-header:hover { background: var(--bg); }
    .platform-header .arrow { transition: transform .2s; font-size: 12px; }
    .platform-header.open .arrow { transform: rotate(180deg); }
    .platform-header.open { border-bottom-color: var(--border); }
    .size-table { display: none; }
    .size-table.open { display: block; }
    .size-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .size-table th, .size-table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    .size-table th { background: var(--bg); font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); }
    .size-table td:first-child { font-weight: 500; }

<body>
 <header>

 <main>
 <h1>📱 Social Media Image Size Guide</h1>
 <p class="desc">Quickly look up image size specs for major social platforms. Click a platform to expand and see recommended dimensions and aspect ratios for avatars, covers, posts, and ads.</p>
 <div class="filters">
 <button class="filter-btn active" data-platform="all">All</button>
 <button class="filter-btn" data-platform="instagram">Instagram</button>
 <button class="filter-btn" data-platform="facebook">Facebook</button>
 <button class="filter-btn" data-platform="twitter">X/Twitter</button>
 <button class="filter-btn" data-platform="linkedin">LinkedIn</button>
 <button class="filter-btn" data-platform="youtube">YouTube</button>
 <button class="filter-btn" data-platform="tiktok">TikTok</button>
 <button class="filter-btn" data-platform="pinterest">Pinterest</button>
 </div>
 <div id="platformsContainer"></div>
 </main>

<ins class="adsbygoogle"

<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
 <footer>© 2025 FreeToolBase · All tools are free to use</footer>
 <script>
    const platformData = {
      instagram: {
        name: '📷 Instagram',
        sizes: [
          ['Avatar', '110×110 (mostsmall)', '1:1'],
          ['', '1080×1080', '1:1'],
          ['', '1080×1350', '4:5'],
          ['', '1080×566', '1.91:1'],
          ['Stories', '1080×1920', '9:16'],
          ['Reels', '1080×1920', '9:16'],
          ['', '420×654', '1:1.55'],
        ]
      },
      facebook: {
        name: '📘 Facebook',
        sizes: [
          ['Avatar', '', '1:1'],
          ['Cover Photo', '851×315', '2.7:1'],
          ['Post Image', '1200×630', '1.91:1'],
          ['Stories', '1080×1920', '9:16'],
          ['', '1920×1080', '16:9'],
          ['', '1640×856', '1.91:1'],
          ['Ad Image', '1200×628', '1.91:1'],
        ]
      },
      twitter: {
        name: '🐦 X / Twitter',
        sizes: [
          ['Avatar', '400×400', '1:1'],
          ['Cover Photo', '1500×500', '3:1'],
          ['Post Image', '1200×675', '16:9'],
          ['cardimage', '800×418', '1.91:1'],
          ['Ad Image', '800×428', '1.91:1'],
        ]
      },
      linkedin: {
        name: '💼 LinkedIn',
        sizes: [
          ['', '400×400 (mostsmall)', '1:1'],
          ['', '1584×396', '4:1'],
          ['', '300×300', '1:1'],
          ['', '1128×191', '5.9:1'],
          ['Post Image', '1200×627', '1.91:1'],
          ['Article Cover', '1200×644', '1.86:1'],
        ]
      },
      youtube: {
        name: '▶️ YouTube',
        sizes: [
          ['', '800×800', '1:1'],
          ['', '2560×1440', '16:9'],
          ['Video Thumbnail', '1280×720', '16:9'],
          ['Shorts', '1080×1920', '9:16'],
          ['', '150×150', '1:1'],
        ]
      },
      tiktok: {
        name: '🎵 TikTok',
        sizes: [
          ['Avatar', '200×200 (mostsmall)', '1:1'],
          ['video', '1080×1920', '9:16'],
          ['', '1920×1080', '16:9'],
          ['Ad Image', '720×1280', '9:16'],
        ]
      },
      pinterest: {
        name: '📌 Pinterest',
        sizes: [
          ['Avatar', '165×165', '1:1'],
          ['Pin (standard)', '1000×1500', '2:3'],
          ['', '1000×1000', '1:1'],
          ['Pin (longgraph)', '1000×2100', '1:2.1'],
          ['', '222×150', '1.48:1'],
          ['Story Pin', '1080×1920', '9:16'],
        ]
      }
    };

    const container = document.getElementById('platformsContainer');

    function renderPlatforms(filter) {
      let html = '';
      for (const [key, data] of Object.entries(platformData)) {
        if (filter !== 'all' && key !== filter) continue;
        html += `<div class="platform-section" data-platform="${key}">
          <div class="platform-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
            <span>${data.name}</span><span class="arrow">▼</span>
          </div>
          <div class="size-table">
            <table>
              <thead><tr><th>Type</th><th>Recommended Size</th><th>Aspect Ratio</th></tr></thead>
              <tbody>`;
        data.sizes.forEach(s => {
          html += `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td></tr>`;
        });
        html += '</tbody></table></div></div>';
      }
      container.innerHTML = html;
    }

    renderPlatforms('all');

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPlatforms(btn.dataset.platform);
      });
    });
  </script>
