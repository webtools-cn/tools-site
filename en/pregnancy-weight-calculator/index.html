<body>
<div class="toast" id="toast"></div>
<header><a href="/en/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/pregnancy-weight-calculator/">Chinese</a></div></header>
<main>
  <h1>🤰 Pregnancy Weight Calculator</h1>
<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">Online pregnancy weight gain calculator, calculate recommended weight gain based on pre-pregnancy BMI, track weekly weight changes, free online tool, no regi...</p>
  <p class="subtitle">Calculate recommended weight gain based on pre-pregnancy BMI</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>📏 Height (cm)</label><input type="number" id="height" value="160" min="100" max="220" step="0.1"></div>
      <div class="form-group"><label>⚖️ Pre-pregnancy Weight (kg)</label><input type="number" id="preWeight" value="55" min="30" max="200" step="0.1"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>⚖️ Current Weight (kg)</label><input type="number" id="currentWeight" value="62" min="30" max="250" step="0.1"></div>
      <div class="form-group"><label>📅 Current Week</label><input type="number" id="week" value="25" min="1" max="42"></div>
    </div>
    <button class="btn" id="btnCalc">🧮 Calculate</button>
    <button class="btn btn-secondary" id="btnClear">🔄 Clear</button>
    <div class="result" id="result" style="display:none">
      <div id="resultContent"></div>
    </div>
  </div>
</main>

<script>

<section class="related-tools" style="margin:2rem 0;padding:1rem;background:#f8fafc;border-radius:8px;"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#374151;">🔗 Related Tools</h2><div style="display:flex;flex-wrap:wrap;gap:4px;"><a href="/en/age-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">Age Calculator</a><a href="/en/body-shape-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">Body Shape Calculator</a><a href="/en/complaint-letter/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">Complaint Letter</a></div></section>
<footer>© 2024 Free ToolBase · Pure front-end tool, for reference only. Not medical advice.</footer>
<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
var weightGuidelines = [
  {bmiMax: 18.5, label: 'Underweight', rangeMin: 12.5, rangeMax: 18, weeklyRate: [0.44, 0.58]},
  {bmiMax: 24.9, label: 'Normal', rangeMin: 11.5, rangeMax: 16, weeklyRate: [0.35, 0.50]},
  {bmiMax: 29.9, label: 'Overweight', rangeMin: 7, rangeMax: 11.5, weeklyRate: [0.23, 0.33]},
  {bmiMax: 999, label: 'Obese', rangeMin: 5, rangeMax: 9, weeklyRate: [0.17, 0.27]}
];

document.getElementById('btnCalc').addEventListener('click',function(){
  var height = parseFloat(document.getElementById('height').value) / 100 || 1.6;
  var preWeight = parseFloat(document.getElementById('preWeight').value) || 55;
  var currentWeight = parseFloat(document.getElementById('currentWeight').value) || 62;
  var week = parseInt(document.getElementById('week').value) || 25;

  if(height <= 0 || preWeight <= 0){ showToast('Please enter valid height and pre-pregnancy weight'); return; }
  if(week < 1 || week > 42){ showToast('Please enter a week between 1 and 42'); return; }

  var bmi = preWeight / (height * height);
  var guideline = null;
  for(var i=0;i<weightGuidelines.length;i++){
    if(bmi < weightGuidelines[i].bmiMax){ guideline = weightGuidelines[i]; break; }
  }

  var gained = currentWeight - preWeight;
  var trimester = week <= 13 ? 1 : (week <= 26 ? 2 : 3);
  var progressPct = Math.min(Math.max(gained / guideline.rangeMax * 100, 0), 120);
  var barColor = gained < guideline.rangeMin ? '#f59e0b' : (gained > guideline.rangeMax ? '#ef4444' : '#22c55e');
  var status = gained < guideline.rangeMin ? '⚠️ Below Target' : (gained > guideline.rangeMax ? '⚠️ Above Target' : '✅ On Track');

  var trimesterNames = ['','1st Trimester','2nd Trimester','3rd Trimester'];
  var html = '<div>Weight Gain Status</div>';
  html += '<div class="final">' + status + '</div>';
  html += '<div class="detail">BMI: ' + bmi.toFixed(1) + ' (' + guideline.label + ') | Gained: ' + gained.toFixed(1) + ' kg</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progressPct + '%;background:' + barColor + '"></div></div>';
  html += '<div class="range-indicator"><span>Min ' + guideline.rangeMin + ' kg</span><span>Max ' + guideline.rangeMax + ' kg</span></div>';
  html += '<div class="detail" style="margin-top:12px">Recommended Total Gain: ' + guideline.rangeMin + ' - ' + guideline.rangeMax + ' kg<br>Current: Week ' + week + ' (' + trimesterNames[trimester] + ')<br>Estimated Remaining Gain: ~' + (guideline.rangeMax - gained).toFixed(1) + ' kg</div>';

  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('result').style.display = 'block';
});

document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('height').value = '160';
  document.getElementById('preWeight').value = '55';
  document.getElementById('currentWeight').value = '62';
  document.getElementById('week').value = '25';
  document.getElementById('result').style.display = 'none';
});
</script>

<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
(function(){
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 Copy';
      btn.title = 'Copy result';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  addCopyBtns();
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
