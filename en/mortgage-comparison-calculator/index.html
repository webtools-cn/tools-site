<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function formatMoney(n) { return '$' + Number(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function calcPayment(amount, rate, years) {
  if (rate === 0) return amount / (years * 12);
  var monthlyRate = rate / 100 / 12;
  var n = years * 12;
  return amount * monthlyRate * Math.pow(1 + monthlyRate, n) / (Math.pow(1 + monthlyRate, n) - 1);
}

function calculate() {
  var amount = parseFloat(document.getElementById('loanAmount').value) || 0;
  var years = parseInt(document.getElementById('loanTerm').value) || 30;
  var schemes = [
    { id: 'A', rate: parseFloat(document.getElementById('rateA').value)||0, down: parseFloat(document.getElementById('downA').value)||0 },
    { id: 'B', rate: parseFloat(document.getElementById('rateB').value)||0, down: parseFloat(document.getElementById('downB').value)||0 },
    { id: 'C', rate: parseFloat(document.getElementById('rateC').value)||0, down: parseFloat(document.getElementById('downC').value)||0 }
  ];

  var bestMonthly = Infinity, bestInterest = Infinity, bestTotal = Infinity;
  var bestSchemeMonthly = '', bestSchemeInterest = '', bestSchemeTotal = '';

  for (var i=0;i<schemes.length;i++) {
    var s = schemes[i];
    var loanAmt = amount * (1 - s.down / 100);
    var monthly = calcPayment(loanAmt, s.rate, years);
    var total = monthly * years * 12;
    var interest = total - loanAmt;

    document.getElementById('monthly'+s.id).textContent = formatMoney(monthly);
    document.getElementById('interest'+s.id).textContent = formatMoney(interest);
    document.getElementById('total'+s.id).textContent = formatMoney(total);

    if (monthly < bestMonthly) { bestMonthly = monthly; bestSchemeMonthly = s.id; }
    if (interest < bestInterest) { bestInterest = interest; bestSchemeInterest = s.id; }
    if (total < bestTotal) { bestTotal = total; bestSchemeTotal = s.id; }
  }

  ['A','B','C'].forEach(function(x){ document.getElementById('best'+x).style.display = 'none'; });
  if (bestSchemeMonthly === 'A' || bestSchemeInterest === 'A' || bestSchemeTotal === 'A') document.getElementById('bestA').style.display = 'inline';
  if (bestSchemeMonthly === 'B' || bestSchemeInterest === 'B' || bestSchemeTotal === 'B') document.getElementById('bestB').style.display = 'inline';
  if (bestSchemeMonthly === 'C' || bestSchemeInterest === 'C' || bestSchemeTotal === 'C') document.getElementById('bestC').style.display = 'inline';

  function getVal(id) { return parseFloat(document.getElementById(id).textContent.replace(/[^0-9]/g,'')) || 1; }
  var maxMonthly = Math.max(getVal('monthlyA'), getVal('monthlyB'), getVal('monthlyC'));
  var maxInterest = Math.max(getVal('interestA'), getVal('interestB'), getVal('interestC'));
  var maxTotal = Math.max(getVal('totalA'), getVal('totalB'), getVal('totalC'));

  ['Monthly','Interest','Total'].forEach(function(type){
    ['A','B','C'].forEach(function(s){
      document.getElementById('bar'+type+s).style.width = (getVal(type.toLowerCase()+s) / (type==='Monthly'?maxMonthly:type==='Interest'?maxInterest:maxTotal) * 100).toFixed(0) + '%';
      document.getElementById('bar'+type+s+'V').textContent = document.getElementById(type.toLowerCase()+s).textContent;
    });
  });

  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  var lines = ['Mortgage Comparison Results', '---',
    'Scenario A: Monthly ' + document.getElementById('monthlyA').textContent + ', Interest ' + document.getElementById('interestA').textContent + ', Total ' + document.getElementById('totalA').textContent,
    'Scenario B: Monthly ' + document.getElementById('monthlyB').textContent + ', Interest ' + document.getElementById('interestB').textContent + ', Total ' + document.getElementById('totalB').textContent,
    'Scenario C: Monthly ' + document.getElementById('monthlyC').textContent + ', Interest ' + document.getElementById('interestC').textContent + ', Total ' + document.getElementById('totalC').textContent
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    showToast('✅ Copied to clipboard');
  }, function(){
    showToast('❌ Copy failed');
  });
}

function clearAll() {
  document.getElementById('loanAmount').value = '300000';
  document.getElementById('loanTerm').value = '30';
  document.getElementById('rateA').value = '6.5';
  document.getElementById('downA').value = '20';
  document.getElementById('rateB').value = '6.0';
  document.getElementById('downB').value = '20';
  document.getElementById('rateC').value = '5.5';
  document.getElementById('downC').value = '30';
  ['A','B','C'].forEach(function(s){ document.getElementById('monthly'+s).textContent = '-'; document.getElementById('interest'+s).textContent = '-'; document.getElementById('total'+s).textContent = '-'; document.getElementById('best'+s).style.display = 'none'; });
  document.getElementById('resultSection').style.display = 'none';
  showToast('Reset complete';
})</script>
