<body>
<header><h1>🎁 Gift Tax Calculator</h1><p>Calculate Gift Tax · Wealth Transfer Planning</p></header>
<div class="container">
  <div class="card">
    <h2>📋 Gift Details</h2>
    <div class="row">
      <div class="form-group"><label>Gift Amount ($)</label><input type="number" id="giftAmount" value="100000" min="0" step="1000"></div>
      <div class="form-group"><label>Annual Exclusion ($)</label><input type="number" id="annualExemption" value="18000" min="0" step="1000"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>Relationship</label><select id="relationship"><option value="spouse">Spouse</option><option value="child">Child</option><option value="parent">Parent</option><option value="sibling">Sibling</option><option value="other">Other</option></select></div>
      <div class="form-group"><label>Lifetime Exemption Used ($)</label><input type="number" id="lifetimeUsed" value="0" min="0" step="1000"></div>
    </div>
    <button class="btn" id="calcBtn">🔍 Calculate Tax</button>
    <button class="btn-secondary" id="clearBtn" style="margin-left:8px">🗑 Clear</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 Results</h2>
    <div id="results"></div>
  </div>
</div>

<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

<script>
(function() {
  var calcBtn = document.getElementById('calcBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultsCard = document.getElementById('resultsCard');
  var resultsEl = document.getElementById('results');

  function formatMoney(num) {
    if (Math.abs(num) >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
    if (Math.abs(num) >= 1000) return '$' + (num / 1000).toFixed(1) + 'K';
    return '$' + num.toFixed(0);
  }

  var taxBrackets = [
    { min: 0, max: 50000, rate: 0.10, quick: 0 },
    { min: 50000, max: 100000, rate: 0.20, quick: 5000 },
    { min: 100000, max: 250000, rate: 0.30, quick: 15000 },
    { min: 250000, max: 500000, rate: 0.40, quick: 40000 },
    { min: 500000, max: Infinity, rate: 0.50, quick: 90000 }
  ];

  function calcTax(amount) {
    if (amount <= 0) return 0;
    for (var i = taxBrackets.length - 1; i >= 0; i--) {
      var b = taxBrackets[i];
      if (amount > b.min) return amount * b.rate - b.quick;
    }
    return 0;
  }

  function calculate() {
    var gift = parseFloat(document.getElementById('giftAmount').value) || 0;
    var annualEx = parseFloat(document.getElementById('annualExemption').value) || 0;
    var rel = document.getElementById('relationship').value;
    var lifetimeUsed = parseFloat(document.getElementById('lifetimeUsed').value) || 0;

    if (gift <= 0) { resultsCard.style.display = 'block'; resultsEl.innerHTML = '<p style="text-align:center;color:#ef4444">⚠️ Please enter a valid gift amount</p>'; return; }

    var spouseExempt = rel === 'spouse' ? gift : 0;
    var taxableBeforeAnnual = gift - spouseExempt;
    var afterAnnual = Math.max(0, taxableBeforeAnnual - annualEx);
    var lifetimeRemaining = Math.max(0, 1000000 - lifetimeUsed);
    var taxable = Math.max(0, afterAnnual - lifetimeRemaining);

    var tax = calcTax(taxable);
    var effectiveRate = gift > 0 ? (tax / gift * 100).toFixed(2) : '0.00';

    var tableRows = '<tr><th>Taxable Gift</th><th>Rate</th><th>Quick Deduction</th></tr>';
    for (var i = 0; i < taxBrackets.length; i++) {
      var b = taxBrackets[i];
      var range = b.max === Infinity ? 'Over $' + formatMoney(b.min) : '$' + formatMoney(b.min) + ' - $' + formatMoney(b.max);
      tableRows += '<tr><td>' + range + '</td><td>' + (b.rate * 100).toFixed(0) + '%</td><td>$' + formatMoney(b.quick) + '</td></tr>';
    }

    resultsCard.style.display = 'block';
    resultsEl.innerHTML =
      '<div class="result-row"><span class="label">🎁 Gift Amount</span><span class="value">$' + formatMoney(gift) + '</span></div>' +
      '<div class="result-row"><span class="label">💑 Spouse Exemption</span><span class="value">$' + formatMoney(spouseExempt) + '</span></div>' +
      '<div class="result-row"><span class="label">📅 Annual Exclusion</span><span class="value">$' + formatMoney(annualEx) + '</span></div>' +
      '<div class="result-row"><span class="label">🏦 Lifetime Exemption Remaining</span><span class="value">$' + formatMoney(lifetimeRemaining) + '</span></div>' +
      '<div class="result-row"><span class="label">📊 Taxable Gift</span><span class="value">$' + formatMoney(taxable) + '</span></div>' +
      '<div class="highlight">💰 Gift Tax Due: $' + formatMoney(tax) + ' (Effective Rate ' + effectiveRate + '%)</div>' +
      '<div class="result-row" style="border-top:2px solid var(--primary);margin-top:8px"><span class="label">💵 Net to Recipient</span><span class="value" style="font-size:1.1rem">$' + formatMoney(gift - tax) + '</span></div>' +
      '<h3 style="margin-top:16px;font-size:0.85rem;color:var(--primary)">📋 Progressive Tax Brackets (Sample)</h3>' +
      '<table class="tax-table">' + tableRows + '</table>' +
      '<p style="font-size:0.75rem;color:var(--text-secondary);margin-top:8px">* Sample progressive rates for reference only. Actual rates vary by jurisdiction.</p>';
  }

  function clearAll() {
    document.getElementById('giftAmount').value = '100000';
    document.getElementById('annualExemption').value = '18000';
    document.getElementById('relationship').value = 'child';
    document.getElementById('lifetimeUsed').value = '0';
    resultsCard.style.display = 'none';
  }

  calcBtn.addEventListener('click', calculate);
  clearBtn.addEventListener('click', clearAll);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') calculate();
  });
})();
</script>
</body>
