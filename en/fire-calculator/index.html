<body>
<div class=container>
<div class=header><h1>💰 FIRE Financial Independence Calculator</h1><div class=lang-switch><a href="index.html"></a><a href="../en/fire-calculator/" class=active>EN</a></div></div>
<p class=nav-back><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › FIRE Financial Independence Calculator</p>
<div class=hero><p>Calculate how long until you reach Financial Independence and can Retire Early (FIRE). Based on the 4% rule. Enter expenses, savings rate, and net worth to see your FIRE timeline.</p><span class=badge>FIRE Movement</span></div>
<div class=calculator-section>
 <h2>💰 Financial Data</h2>
 <div class=input-grid>
 <div class=input-group><label for=annualIncome>Annual Income ($)</label><input type="number" id=annualIncome value=100000 min=0 step=1000></div>
 <div class=input-group><label for=annualExpense>Annual Expenses ($)</label><input type="number" id=annualExpense value=40000 min=0 step=1000><div class=hint>All living expenses</div></div>
 <div class=input-group><label for=currentNetWorth>Current Net Worth ($)</label><input type="number" id=currentNetWorth value=50000 min=0 step=1000><div class=hint>All investments + savings</div></div>
 <div class=input-group><label for=currentAge>Current Age</label><input type="number" id=currentAge value=30 min=18 max=70></div>
 <div class=input-group><label for=annualReturn>Annual Return (%)</label><input type="number" id=annualReturn value=7 min=0 max=20 step=0.1><div class=hint>S&P 500 long-term avg ~7-10%</div></div>
 <div class=input-group><label for=withdrawalRate>Safe Withdrawal Rate (%)</label><input type="number" id=withdrawalRate value=4 min=1 max=10 step=0.1><div class=hint>Traditional 4% rule</div></div>
 </div>
 <div class=btn-row>
 <button class=btn btn-primary id=calcBtn>🔍 Calculate FIRE</button>
 <button class=btn btn-secondary id=resetBtn>🔄 Reset</button>
 <button class=btn btn-secondary id=copyBtn>📋 Copy Results</button>
 </div>
</div>
<div class=progress-bar>
 <div class=progress-label><span>FIRE Progress</span><span id=progressPct>0%</span></div>
 <div class=progress-track><div class=progress-fill id=progressFill style=width:0%></div></div>
</div>
<div class=results-grid>
 <div class=result-card highlight><div class=label>🎯 FIRE Number</div><div class=value id=fireNumber>-</div><div class=sub>Expenses × 25 (4% rule)</div></div>
 <div class=result-card><div class=label>📅 FIRE Age</div><div class=value id=fireAge>-</div><div class=sub id=fireYears>-</div></div>
 <div class=result-card><div class=label>💾 Annual Savings</div><div class=value id=annualSavings>-</div><div class=sub id=savingsRate>Savings Rate: -</div></div>
</div>
<div class=results-grid>
 <div class=result-card><div class=label>🌿 Coast FIRE Age</div><div class=value id=coastFireAge>-</div><div class=sub>No more saving needed to retire at 65</div></div>
 <div class=result-card><div class=label>🏖 Lean FIRE</div><div class=value id=leanFire>-</div><div class=sub>Expenses × 20 (frugal)</div></div>
 <div class=result-card><div class=label>🥂 Fat FIRE</div><div class=value id=fatFire>-</div><div class=sub>Expenses × 35 (abundant)</div></div>
</div>
<div class=chart-container><canvas id=fireChart></canvas></div>
<div class=info-section>
 <h2>📖 FIRE Levels Explained</h2>
 <h3>Lean FIRE (Frugal FI)</h3>
 <p>Expenses × 20. Minimalist lifestyle. For low spenders targeting <$40,000/yr.</p>
 <h3>Regular FIRE (Standard FI)</h3>
 <p>Expenses × 25 (4% rule). Maintain current lifestyle. Most common target.</p>
 <h3>Fat FIRE (Abundant FI)</h3>
 <p>Expenses × 35. Generous spending room. Targeting $100,000+/yr expenses.</p>
 <h3>Coast FIRE (Coasting FI)</h3>
 <p>Enough principal to reach FIRE by age 65 without additional saving.</p>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(v){return '$'+v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
const income=+$('annualIncome').value,expense=+$('annualExpense').value,
nw=+$('currentNetWorth').value,age=+$('currentAge').value,
ret=+$('annualReturn').value/100,swr=+$('withdrawalRate').value/100;
if(income<=0||expense<=0){showToast('Please enter valid values');return}
const savings=income-expense;
const fireNumber=expense/swr;
const leanFire=expense*20,fatFire=expense*35;
let years=0;let bal=nw;
while(bal<fireNumber&&years<100){bal=bal*(1+ret)+savings;years++}
const fireAge=age+years;
const coastBal=nw*Math.pow(1+ret,65-age);
const coastFire=(coastBal>=fireNumber)?age:65;
const pct=Math.min(100,(nw/fireNumber*100));
$('fireNumber').textContent=fmt(fireNumber);
$('fireAge').textContent=fireAge>age?fireAge+'':'Achieved!';
$('fireYears').textContent=fireAge>age?'in '+years+' yrs':'Congrats!';
$('annualSavings').textContent=fmt(savings);
$('savingsRate').textContent='Savings Rate: '+(savings/income*100).toFixed(1)+'%';
$('coastFireAge').textContent=(coastFire>=65||nw>=fireNumber)?'Coast!':(65-coastFire>0?'in'+(65-coastFire)+'yrs':'');
$('leanFire').textContent=fmt(leanFire);
$('fatFire').textContent=fmt(fatFire);
$('progressPct').textContent=pct.toFixed(1)+'%';
$('progressFill').style.width=pct+'%';
drawChart(nw,savings,fireNumber,years,ret);
}
function drawChart(start,savings,target,years,ret){
const canvas=$('fireChart'),ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const w=canvas.parentElement.clientWidth-32,h=280;
canvas.width=w*dpr;canvas.height=h*dpr;
canvas.style.width=w+'px';canvas.style.height=h+'px';
ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
const maxY=Math.max(target*1.1,start);
const scaleY=h/(maxY*1.05);
ctx.strokeStyle='rgba(148,163,184,.3)';ctx.fillStyle='#64748b';ctx.font='10px sans-serif';
for(let i=0;i<=5;i++){const y=h-(maxY/5*i*scaleY);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillText('$'+(maxY/5*i).toFixed(0),2,y+4)}
ctx.strokeStyle='rgba(239,68,68,.3)';ctx.setLineDash([5,5]);
const ty=h-target*scaleY;ctx.beginPath();ctx.moveTo(40,ty);ctx.lineTo(w-20,ty);ctx.stroke();
ctx.fillStyle='#f87171';ctx.fillText('FIRE Number',w-100,ty-5);
ctx.setLineDash([]);
ctx.beginPath();ctx.strokeStyle='#22c55e';ctx.lineWidth=2;
let bal=start;ctx.moveTo(40,h-bal*scaleY);
const pts=Math.min(years+10,50);
for(let i=0;i<=pts;i++){const x=40+(w-60)*(i/pts);const y=h-bal*scaleY;ctx.lineTo(x,y);bal=bal*(1+ret)+savings}
ctx.stroke();
}
function reset(){
$('annualIncome').value=100000;$('annualExpense').value=40000;
$('currentNetWorth').value=50000;$('currentAge').value=30;
$('annualReturn').value=7;$('withdrawalRate').value=4;
['fireNumber','fireAge','annualSavings','coastFireAge','leanFire','fatFire'].forEach(id=>$(id).textContent='-');
$('fireYears').textContent='-';$('savingsRate').textContent='Savings Rate: -';
$('progressPct').textContent='0%';$('progressFill').style.width='0%';
const c=$('fireChart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height)
}
function copyResult(){
navigator.clipboard.writeText(['=== FIRE Analysis Results ===',
'FIRE Number: '+$('fireNumber').textContent,'FIRE at: '+$('fireAge').textContent+' ('+$('fireYears').textContent+')',
'Annual Savings: '+$('annualSavings').textContent+' ('+$('savingsRate').textContent+')',
'Coast FIRE: '+$('coastFireAge').textContent,
'Lean FIRE: '+$('leanFire').textContent,'Fat FIRE: '+$('fatFire').textContent].join('\n'))
.then(()=>showToast('✅ Copied')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
