  <style>:root{--primary:#4F46E5;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--success:#22c55e;--danger:#ef4444}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px}header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}main{max-width:640px;margin:0 auto;padding:32px 16px 64px}h1{font-size:28px;margin-bottom:8px}.subtitle{color:var(--text2);margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:var(--text)}.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;transition:border-color .2s}.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}.input-row{display:flex;gap:12px}.input-row .form-group{flex:1}.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{opacity:.9}.btn-block{width:100%;justify-content:center}.result-card{text-align:center;padding:20px;background:var(--bg);border-radius:12px;margin-top:16px}.final-price{font-size:42px;font-weight:800;color:var(--danger);line-height:1.1}.original-price{font-size:16px;color:var(--text2);text-decoration:line-through;margin-bottom:4px}.saved{font-size:16px;color:var(--success);font-weight:600;margin-top:4px}.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid v <body>
  <header><a href="/en/">← Free ToolBase</a></header>
  <main>
    <h1>🛍️ Discount Calculator</h1>
    <p class="subtitle">Calculate discounted prices and compare which deal saves you more.</p>
    <div class="card">
      <div class="tab-row">
        <button class="tab-btn active" data-mode="percent">Percent Off</button>
        <button class="tab-btn" data-mode="fixed">Fixed Off</button>
        <button class="tab-btn" data-mode="buyget">Tiered</button>
      </div>
      <div id="modePercent">
        <div class="input-row">
          <div class="form-group"><label>Original Price ($)</label><input type="number" id="origPrice" placeholder="100" step="0.01" min="0"></div>
          <div class="form-group"><label>Discount (%)</label><input type="number" id="discountPct" placeholder="80" step="1" min="0" max="100"></div>
        </div>
        <button class="btn btn-primary btn-block" id="calcPercent">Calculate</button>
      </div>
      <div id="modeFixed" style="display:none">
        <div class="input-row">
          <div class="form-group"><label>Original Price ($)</label><input type="number" id="origPriceFixed" placeholder="100" step="0.01" min="0"></div>
          <div class="form-group"><label>Amount Off ($)</label><input type="number" id="fixedAmount" placeholder="20" step="0.01" min="0"></div>
        </div>
        <button class="btn btn-primary btn-block" id="calcFixed">Calculate</button>
      </div>
      <div id="modeBuyGet" style="display:none">
        <div class="input-row">
          <div class="form-group"><label>Original Price ($)</label><input type="number" id="origPriceBG" placeholder="200" step="0.01" min="0"></div>
          <div class="form-group"><label>Spend ($)</label><input type="number" id="bgThreshold" placeholder="200" step="0.01" min="0"></div>
        </div>
        <div class="input-row">
          <div class="form-group"><label>Save ($)</label><input type="number" id="bgReduce" placeholder="30" step="0.01" min="0"></div>
        </div>
        <button class="btn btn-primary btn-block" id="calcBuyGet">计算Tiered后价格</button>
      </div>
      <div id="resultArea" style="display:none">
        <div class="result-card">
          <div class="original-price" id="origDisplay"></div>
          <div class="final-price" id="finalDisplay"></div>
          <div class="saved" id="savedDisplay"></div>
        </div>
        <div style="margin-top:12px">
          <div class="detail-row"><span class="detail-label">Effective Rate</span><span class="detail-value" id="rateDisplay"></span></div>
          <div class="detail-row"><span class="detail-label">Equivalent To</span><span class="detail-value" id="equivDisplay"></span></div>
        </div>
      </div>
    </div>
  </main>
  <footer>© 2025 <a href="/en/">Free ToolBase</a> · All tools are free to use</footer>
  <div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>
  <script>
    var currentMode = 'percent';

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function displayResult(original, final, saved) {
      document.getElementById('origDisplay').textContent = 'Original $' + original.toFixed(2);
      document.getElementById('finalDisplay').textContent = '¥' + final.toFixed(2);
      document.getElementById('savedDisplay').textContent = 'You save $' + saved.toFixed(2);
      var rate = original > 0 ? Math.round((final / original) * 100) : 0;
      var off = original > 0 ? Math.round((1 - final / original) * 100) : 0;
      document.getElementById('rateDisplay').textContent = rate + '%（' + off + '% off）';
      document.getElementById('equivDisplay').textContent = off >= 100 ? 'Free!' : ('' + rate + '% of original');
      document.getElementById('resultArea').style.display = 'block';
    }

    // 打折模式
    document.getElementById('calcPercent').addEventListener('click', function() {
      var orig = parseFloat(document.getElementById('origPrice').value);
      var pct = parseFloat(document.getElementById('discountPct').value);
      if (isNaN(orig) || orig < 0) { showToast('Please enter a valid original price'); return; }
      if (isNaN(pct) || pct < 0 || pct > 100) { showToast('Please enter a discount between 0-100'); return; }
      var final = orig * pct / 100;
      displayResult(orig, final, orig - final);
    });

    // 立减模式
    document.getElementById('calcFixed').addEventListener('click', function() {
      var orig = parseFloat(document.getElementById('origPriceFixed').value);
      var amt = parseFloat(document.getElementById('fixedAmount').value);
      if (isNaN(orig) || orig < 0) { showToast('Please enter a valid original price'); return; }
      if (isNaN(amt) || amt < 0) { showToast('Please enter a valid discount amount'); return; }
      var final = Math.max(0, orig - amt);
      displayResult(orig, final, Math.min(amt, orig));
    });

    // Tiered模式
    document.getElementById('calcBuyGet').addEventListener('click', function() {
      var orig = parseFloat(document.getElementById('origPriceBG').value);
      var th = parseFloat(document.getElementById('bgThreshold').value);
      var reduce = parseFloat(document.getElementById('bgReduce').value);
      if (isNaN(orig) || orig < 0) { showToast('Please enter a valid original price'); return; }
      if (isNaN(th) || th < 0) { showToast('请输入有效的Tiered门槛'); return; }
      if (isNaN(reduce) || reduce < 0) { showToast('Please enter a valid discount amount'); return; }
      var times = th > 0 ? Math.floor(orig / th) : 0;
      var totalReduce = times * reduce;
      var final = Math.max(0, orig - totalReduce);
      displayResult(orig, final, Math.min(totalReduce, orig));
    });

    // Tab切换
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentMode = this.dataset.mode;
        document.getElementById('modePercent').style.display = currentMode === 'percent' ? 'block' : 'none';
        document.getElementById('modeFixed').style.display = currentMode === 'fixed' ? 'block' : 'none';
        document.getElementById('modeBuyGet').style.display = currentMode === 'buyget' ? 'block' : 'none';
        document.getElementById('resultArea').style.display = 'none';
      });
    });

    // 填入默认值
    document.getElementById('origPrice').value = 100;
    document.getElementById('discountPct').value = 80;
  </script>
</body>
</html>
