<body>
<main class="container">
<header>
  <h1>🏆 Certificate Generator</h1>
  <p>Create beautiful certificates online — no registration · no watermark · instant download</p>
</header>
<div class="tool-layout">
  <div class="control-panel">
    <div>
      <label>📋 Template</label>
      <div class="template-row" id="templateRow">
        <button class="template-btn active" data-tpl="classic">Classic</button>
        <button class="template-btn" data-tpl="modern">Modern</button>

    </div>
    <div>

    <div>

    </div>

        <input type="color" id="textColor" value="#1a1a2e">
        <span style="font-size:.8rem;color:#94a3b8">Click to pick</span>
      </div>
    </div>
    <div>
      <label>🔤 Font</label>
      <select id="fontSelect">
        <option value="serif">Serif (Georgia / Times)</option>
        <option value="sans-serif">Sans-serif (Arial / Helvetica)</option>
        <option value="cursive">Script (Brush Script / Cursive)</option>
      </select>
    </div>
    <button class="btn-download" id="btnDownload">📥 Download Certificate (PNG)</button>
  </div>
  <div class="preview-panel">
    <canvas id="certCanvas" width="1600" height="1200"></canvas>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1600, H = 1200;

  const templates = {
    classic: {
      bg: '#fffef5',
      borderColor: '#c9a84c',
      textColor: '#1a1a2e',
      borderStyle: 'double',
      accentColor: '#c9a84c'
    },
    modern: {
      bg: '#f8fafc',
      borderColor: '#3b82f6',
      textColor: '#1e293b',
      borderStyle: 'single',
      accentColor: '#3b82f6'
    },
    elegant: {
      bg: '#fff5f5',
      borderColor: '#dc2626',
      textColor: '#450a0a',
      borderStyle: 'ornate',
      accentColor: '#dc2626'
    },
    creative: {
      bg: '#f0fdf4',
      borderColor: '#16a34a',
      textColor: '#052e16',
      borderStyle: 'gradient',
      accentColor: '#16a34a'
    },
    formal: {
      bg: '#f8f7f4',
      borderColor: '#b8860b',
      textColor: '#1a1a2e',
      borderStyle: 'double',
      accentColor: '#b8860b'
    }
  };

  let currentTemplate = 'classic';

  function getFontFamily(fontKey) {
    const map = {
      'serif': 'Georgia, "Times New Roman", "Noto Serif", serif',
      'sans-serif': '"Helvetica Neue", Arial, "Noto Sans", sans-serif',
      'cursive': '"Brush Script MT", "Great Vibes", "Dancing Script", cursive'
    };
    return map[fontKey] || map['serif'];
  }

  function drawBorder(style, color) {
    const margin = 60;
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;

    if (style === 'double') {
      ctx.strokeRect(margin, margin, W - 2*margin, H - 2*margin);
      ctx.strokeRect(margin + 15, margin + 15, W - 2*(margin+15), H - 2*(margin+15));
      drawCornerOrnaments(margin + 15, color);
    } else if (style === 'single') {
      ctx.strokeRect(margin, margin, W - 2*margin, H - 2*margin);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(margin + 30, margin + 20);
      ctx.lineTo(W - margin - 30, margin + 20);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(margin + 30, H - margin - 20);
      ctx.lineTo(W - margin - 30, H - margin - 20);
      ctx.stroke();
    } else if (style === 'ornate') {
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, W - 2*margin, H - 2*margin);
      drawOrnateCorners(margin, color);
      ctx.lineWidth = 1;
      ctx.strokeRect(margin + 12, margin + 12, W - 2*(margin+12), H - 2*(margin+12));
    } else if (style === 'gradient') {
      ctx.lineWidth = 5;
      ctx.strokeRect(margin, margin, W - 2*margin, H - 2*margin);
      const grad = ctx.createLinearGradient(margin, 0, W - margin, 0);
      grad.addColorStop(0, color);
      grad.addColorStop(0.5, color + '88');
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.fillRect(margin, margin, W - 2*margin, 6);
      ctx.fillRect(margin, H - margin - 6, W - 2*margin, 6);
    }
  }

  function drawCornerOrnaments(margin, color) {
    const size = 30;
    const positions = [
      [margin, margin],
      [W - margin - size, margin],
      [margin, H - margin - size],
      [W - margin - size, H - margin - size]
    ];
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    positions.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.moveTo(x + size/2, y);
      ctx.lineTo(x + size, y + size/2);
      ctx.lineTo(x + size/2, y + size);
      ctx.lineTo(x, y + size/2);
      ctx.closePath();
      ctx.fill();
    });
  }

  function drawOrnateCorners(margin, color) {
    const r = 25;
    const positions = [
      [margin + 6, margin + 6],
      [W - margin - 6, margin + 6],
      [margin + 6, H - margin - 6],
      [W - margin - 6, H - margin - 6]
    ];
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    positions.forEach(([cx, cy]) => {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  function drawSeal(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.stroke();
    drawStar(0, 0, 5, 25, 10, color);
    ctx.restore();
  }

  function drawStar(cx, cy, spikes, outerR, innerR, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / spikes;
    for (let i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.closePath();
    ctx.fill();
  }

  function render() {
    const tpl = templates[currentTemplate];
    const borderColor = document.getElementById('borderColor').value;
    const textColor = document.getElementById('textColor').value;
    const title = document.getElementById('certTitle').value || 'Certificate';
    const recipient = document.getElementById('recipient').value || '';
    const description = document.getElementById('description').value || '';
    const dateVal = document.getElementById('certDate').value || new Date().toISOString().split('T')[0];
    const signature = document.getElementById('signature').value || '';
    const fontKey = document.getElementById('fontSelect').value;

    // Format date for display (US style)
    const d = new Date(dateVal + 'T00:00:00');
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dateStr = months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = tpl.bg;
    ctx.fillRect(0, 0, W, H);

    drawBorder(tpl.borderStyle, borderColor);

    // Subtle background pattern
    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = borderColor;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.arc(W * (i + 0.5) / 6, H/2, 200, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const fontFamily = getFontFamily(fontKey);

    // Title
    ctx.fillStyle = textColor;
    ctx.font = `bold 64px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.fillText(title, W/2, 280);

    // Decorative line under title
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W/2 - 200, 310);
    ctx.lineTo(W/2 + 200, 310);
    ctx.stroke();

    // "This is to certify that" line
    ctx.fillStyle = textColor;
    ctx.font = `italic 28px ${fontFamily}`;
    ctx.fillText('This is to certify that', W/2, 400);

    // Recipient name (large, prominent)
    ctx.fillStyle = borderColor;
    ctx.font = `bold 52px ${fontFamily}`;
    ctx.fillText(recipient, W/2, 500);

    // Description with word wrap
    ctx.fillStyle = textColor;
    ctx.font = `24px ${fontFamily}`;
    const maxWidth = 1000;
    const words = description.split(' ');
    let line = '';
    let y = 580;
    for (let i = 0; i < words.length; i++) {
      const testLine = line + (line ? ' ' : '') + words[i];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && line.length > 0) {
        ctx.fillText(line, W/2, y);
        line = words[i];
        y += 40;
      } else {
        line = testLine;
      }
    }
    if (line) {
      ctx.fillText(line, W/2, y);
    }
    y += 60;

    // Date
    ctx.font = `24px ${fontFamily}`;
    ctx.textAlign = 'left';
    ctx.fillText(dateStr, 360, H - 200);

    // Signature line
    ctx.textAlign = 'right';
    ctx.fillText(signature, W - 360, H - 200);

    // Line under signature
    ctx.strokeStyle = textColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W - 520, H - 185);
    ctx.lineTo(W - 360, H - 185);
    ctx.stroke();

    // Labels
    ctx.font = `18px ${fontFamily}`;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'left';
    ctx.fillText('Date', 360, H - 170);
    ctx.textAlign = 'right';
    ctx.fillText('Signature', W - 360, H - 170);
    ctx.textAlign = 'center';

    // Seal
    drawSeal(W - 220, H - 220, borderColor);
  }

  function updateTemplate(tplName) {
    currentTemplate = tplName;
    const tpl = templates[tplName];
    document.getElementById('borderColor').value = tpl.borderColor;
    document.getElementById('textColor').value = tpl.textColor;
    document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tpl="${tplName}"]`).classList.add('active');
    render();
  }

  document.getElementById('templateRow').addEventListener('click', function(e) {
    const btn = e.target.closest('.template-btn');
    if (!btn) return;
    updateTemplate(btn.dataset.tpl);
  });

  ['certTitle', 'recipient', 'description', 'certDate', 'signature', 'borderColor', 'textColor', 'fontSelect'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  document.getElementById('btnDownload').addEventListener('click', function() {
    const link = document.createElement('a');
    link.download = 'certificate.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('certDate').value = new Date().toISOString().split('T')[0];
  render();
})();
</script>
