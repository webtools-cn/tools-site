<style>
:root{--primary:#4F46E5;--primary-hover:#4338CA;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-size:1.25rem;font-weight:700}
header a{color:var(--primary);text-decoration:none;font-size:.9rem}
main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}
h2{font-size:1rem;margin-bottom:12px}
.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.model-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.model-chip{padding:8px 16px;border:1px solid var(--border);border-radius:24px;cursor:pointer;font-size:.85rem;transition:all .2s;background:var(--surface);user-select:none}
.model-chip:hover{border-color:var(--primary)}
.model-chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:rgba(79,70,229,.05)}
.compare-table-wrap{overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.compare-table th{background:#f1f5f9;padding:10px 12px;text-align:left;font-weight:600;font-size:.8rem;color:var(--text-secondary);position:sticky;left:0}
.compare-table th:first-child{min-width:120px}
.compare-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:center}
.compare-table td:first-child{text-align:left;font-weight:600;background:#fafbfc}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-blue{background:#e0e7ff;color:var(--primary)}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-orange{background:#fff7ed;color:#ea580c}
.highlight-row td{background:#fffbeb}
#results{display:none}
.chart-bar{height:8px;border-radius:4px;background:var(--primary);min-width:4px;transition:width .5s}
footer{background:var(--surface);border-top:1px solid var(--border);padding:16px 24px;text-align:center;font-size:.8rem;color:var(--text-secondary)}
@media(max-width:700px){main{padding:12px}.card{padding:16px}}
</style>

<body>
<header><h1>🤖 AI Model Compare</h1><a href="/en/">← Back to Home</a></header>
<main>
<div class="card">
  <h2>🔍 Select AI Models to Compare (max 6)</h2>
  <div class="model-select" id="modelChips"></div>
  <div id="selectionInfo" style="font-size:.8rem;color:var(--text-secondary);margin-top:8px">Selected 0/6 models</div>
  <div class="btn-row">
    <button class="btn-primary" onclick="runCompare()">📊 Compare</button>
    <button class="btn-outline" onclick="clearAll()">🔄 Clear All</button>
  
    <button class="btn-outline" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="card" id="results">
  <h2>📋 Comparison Results</h2>
  <div class="compare-table-wrap">
    <table class="compare-table"><thead id="compareHead"></thead><tbody id="compareBody"></tbody></table>
  </div>
</div>
</main>
<footer>© 2025 Free ToolBase · Data from public sources, for reference only</footer>
<script>
function showToast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;z-index:99999;font-size:14px;animation:toastIn .3s ease';document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2000)}
document.head.insertAdjacentHTML('beforeend','<style>@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}</style>');

const MODELS={
  'GPT-4o':{provider:'OpenAI',params:'Undisclosed',context:'128K',release:'2024-05',multimodal:'✅ Text+Image+Audio',api:'✅',openSource:'❌',license:'Proprietary',speed:'Fast',benchmark:'MMLU 88.7%'},
  'GPT-4 Turbo':{provider:'OpenAI',params:'~1.8T(est.)',context:'128K',release:'2023-11',multimodal:'✅ Text+Image',api:'✅',openSource:'❌',license:'Proprietary',speed:'Medium',benchmark:'MMLU 86.4%'},
  'Claude 3.5 Sonnet':{provider:'Anthropic',params:'Undisclosed',context:'200K',release:'2024-06',multimodal:'✅ Text+Image',api:'✅',openSource:'❌',license:'Proprietary',speed:'Fast',benchmark:'MMLU 88.7%'},
  'Claude 3 Opus':{provider:'Anthropic',params:'Undisclosed',context:'200K',release:'2024-03',multimodal:'✅ Text+Image',api:'✅',openSource:'❌',license:'Proprietary',speed:'Medium',benchmark:'MMLU 86.8%'},
  'Gemini 1.5 Pro':{provider:'Google',params:'Undisclosed',context:'2M',release:'2024-05',multimodal:'✅ Text+Image+Audio+Video',api:'✅',openSource:'❌',license:'Proprietary',speed:'Medium',benchmark:'MMLU 85.9%'},
  'Llama 3.1 405B':{provider:'Meta',params:'405B',context:'128K',release:'2024-07',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Llama 3.1',speed:'Slow(needs high-end GPU)',benchmark:'MMLU 88.6%'},
  'Llama 3.1 70B':{provider:'Meta',params:'70B',context:'128K',release:'2024-07',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Llama 3.1',speed:'Medium',benchmark:'MMLU 86.0%'},
  'Llama 3 8B':{provider:'Meta',params:'8B',context:'8K',release:'2024-04',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Llama 3',speed:'Fast',benchmark:'MMLU 68.4%'},
  'Mistral Large 2':{provider:'Mistral AI',params:'123B',context:'128K',release:'2024-07',multimodal:'❌ Text only',api:'✅',openSource:'✅(Research)',license:'Mistral Research',speed:'Medium',benchmark:'MMLU 84.0%'},
  'Mixtral 8x22B':{provider:'Mistral AI',params:'141B(39B active)',context:'64K',release:'2024-04',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Apache 2.0',speed:'Fast',benchmark:'MMLU 77.8%'},
  'Qwen2 72B':{provider:'Alibaba',params:'72B',context:'128K',release:'2024-06',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Apache 2.0',speed:'Medium',benchmark:'MMLU 84.2%'},
  'DeepSeek-V2':{provider:'DeepSeek',params:'236B(21B active)',context:'128K',release:'2024-05',multimodal:'❌ Text only',api:'✅',openSource:'✅',license:'MIT',speed:'Fast',benchmark:'MMLU 78.5%'},
  'Gemma 2 27B':{provider:'Google',params:'27B',context:'8K',release:'2024-06',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'Gemma',speed:'Fast',benchmark:'MMLU 75.2%'},
  'Phi-3 Medium':{provider:'Microsoft',params:'14B',context:'128K',release:'2024-05',multimodal:'❌ Text only',api:'✅(3rd party)',openSource:'✅',license:'MIT',speed:'Fast',benchmark:'MMLU 78.0%'},
  'Command R+':{provider:'Cohere',params:'104B',context:'128K',release:'2024-04',multimodal:'❌ Text only',api:'✅',openSource:'✅(Non-commercial)',license:'CC-BY-NC-4.0',speed:'Medium',benchmark:'MMLU 75.7%'}
};

const KEYS=['provider','params','context','release','multimodal','api','openSource','license','speed','benchmark'];
const KEY_LABELS={provider:'Provider',params:'Parameters',context:'Context Length',release:'Release Date',multimodal:'Multimodal',api:'API Available',openSource:'Open Source',license:'License',speed:'Inference Speed',benchmark:'Benchmark Score'};

let selected=new Set();

function renderChips(){
  const container=document.getElementById('modelChips');
  container.innerHTML=Object.keys(MODELS).map(name=>{
    const sel=selected.has(name);return`<div class="model-chip${sel?' selected':''}" data-name="${name}" onclick="toggleModel('${name}')">${name}${sel?' ✓':''}</div>`
  }).join('');
  document.getElementById('selectionInfo').textContent=`Selected ${selected.size}/6 models`;
}

function toggleModel(name){
  if(selected.has(name))selected.delete(name);
  else if(selected.size>=6){showToast('Max 6 models for comparison');return}
  else selected.add(name);
  renderChips();
}

function clearAll(){selected.clear();renderChips();document.getElementById('results').style.display='none'}

function runCompare(){
  if(selected.size===0){showToast('Please select at least 1 model');return}
  if(selected.size===1){showToast('Please select at least 2 models to compare');return}
  const names=[...selected];
  document.getElementById('results').style.display='block';
  
  document.getElementById('compareHead').innerHTML='<tr><th>Spec</th>'+names.map(n=>`<th style="font-size:.9rem">${n}</th>`).join('')+'</tr>';
  
  const rows=KEYS.map(key=>{
    const vals=names.map(n=>MODELS[n][key]);
    return`<tr${key==='benchmark'?' class="highlight-row"':''}><td>${KEY_LABELS[key]}</td>`+
      names.map((n,i)=>{
        const val=MODELS[n][key];
        const pct=key==='benchmark'?parseFloat(val):null;
        const bar=pct?`<div class="chart-bar" style="width:${pct}%"></div>`:'';
        return`<td>${val}${bar}</td>`
      }).join('')+'</tr>';
  }).join('');
  
  document.getElementById('compareBody').innerHTML=rows;
}

renderChips();

function copyResults(){
  const results=document.getElementById('results');
  if(!results||results.style.display==='none'){showToast('Please generate comparison results first');return}
  let text='';
  const table=results.querySelector('table');
  if(table){
    const rows=table.querySelectorAll('tr');
    rows.forEach(row=>{
      const cells=row.querySelectorAll('th,td');
      text+=Array.from(cells).map(c=>c.textContent.trim()).join('\t')+'\n';
    });
  }else{
    text=results.textContent.trim();
  }
  if(!text){showToast('Nothing to copy');return}
  navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>showToast('Copy failed'));
}

</script>
</body>
</html>
