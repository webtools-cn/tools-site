  <h2>📖 About Backdoor Roth IRA</h2>
  <h3>What is a Backdoor Roth?</h3>
  <p>The Backdoor Roth IRA is a legal strategy to bypass Roth IRA income limits: make a non-deductible contribution to a Traditional IRA, then immediately convert it to a Roth IRA. Since the contribution was after-tax, the conversion is typically tax-free — provided the pro-rata rule doesn't apply.</p>
  <h3>Pro-Rata Rule Explained</h3>
  <p>This is the biggest Backdoor Roth pitfall. If you have existing pre-tax IRA balances (deductible contributions + earnings), the IRS requires proportional taxation on conversions. Formula: taxable ratio = pre-tax IRA balance ÷ (pre-tax balance + after-tax contributions).</p>
  <h3>Common Ways to Avoid Pro-Rata</h3>
  <ul>
    <li>Roll existing pre-tax IRA balances into your employer 401(k) plan (if allowed)</li>
    <li>Convert all pre-tax IRA balances first, then start fresh with Backdoor</li>
    <li>If pre-tax balance is small, convert everything, pay the tax, and start clean</li>
  </ul>
  <h3>2024 Contribution Limits</h3>
  <p>Combined Traditional/Roth IRA annual contribution limit: $7,000 under age 50, $8,000 age 50+. The Backdoor strategy uses the Traditional IRA contribution limit; there is no additional limit on conversions.</p>

<script>
(function(){
const $=s=>document.getElementById(s);
const existingIraBalance=$('existingIraBalance'),contribution=$('contribution'),
convertAmount=$('convertAmount'),taxRate=$('taxRate'),annualReturn=$('annualReturn'),
yearsToRetire=$('yearsToRetire');
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n){return n.toFixed(1)+'%'}
function calc(){
const preTaxBal=+existingIraBalance.value||0;
const contrib=+contribution.value||0;
const convert=+convertAmount.value||0;
const taxR=+taxRate.value/100;
const ret=+annualReturn.value/100;
const years=+yearsToRetire.value||0;
if(convert<=0){showToast('Conversion amount must be greater than 0');return}
if(years<1){showToast('Years to retirement must be at least 1');return}
const totalIra=preTaxBal+contrib;
const aftertaxRatio=totalIra>0?contrib/totalIra:1;
const taxFree=convert*aftertaxRatio;
const taxable=convert-taxFree;
const taxDue=taxable*taxR;
const rothInvested=convert;
const rothFinal=rothInvested*Math.pow(1+ret,years);
const taxableInvested=convert-taxDue;
const taxablePreTax=taxableInvested*Math.pow(1+ret,years);
const taxableGain=taxablePreTax-taxableInvested;
const ltcRate=0.20;
const taxableFinal=taxablePreTax-taxableGain*ltcRate;
const advantage=rothFinal-taxableFinal;
let recommendation,cardClass;
if(aftertaxRatio>=0.95){
  recommendation='✅ Excellent for Backdoor';
  cardClass='good';
}else if(aftertaxRatio>=0.8){
  recommendation='⚠️ Good, some tax due';
  cardClass='warn';
}else if(aftertaxRatio>=0.5){
  recommendation='⚠️ Pro-rata impact significant';
  cardClass='warn';
}else{
  recommendation='❌ Pro-rata makes this unfavorable';
  cardClass='bad';
}
$('recommendation').textContent=recommendation;
$('aftertaxRatio').textContent=fmtPct(aftertaxRatio*100);
$('aftertaxSub').textContent='After-tax contribution ratio';
$('taxDue').textContent=fmt(taxDue);
$('taxFreePart').textContent=fmt(taxFree);
$('rothFinal').textContent=fmt(rothFinal);
$('vsTaxable').textContent=fmt(advantage);
if(preTaxBal>0){
  $('proRataSection').style.display='block';
  const taxPct=(taxable/convert)*100;
  const freePct=100-taxPct;
  $('proRataBar').innerHTML='<div class="nontaxable" style="width:'+freePct+'%"></div><div class="taxable" style="width:'+taxPct+'%"></div>';
  $('proRataDetail').textContent='Of $'+convert.toLocaleString()+' converted, $'+taxFree.toLocaleString()+' is tax-free, $'+taxable.toLocaleString()+' is taxable at '+fmtPct(taxR*100)+'. Total IRA: '+fmtPct((preTaxBal/totalIra)*100)+' pre-tax, '+fmtPct(aftertaxRatio*100)+' after-tax.';
}else{
  $('proRataSection').style.display='none';
}
const recCard=$('recommendation').parentElement;
recCard.className='result-card highlight '+cardClass;
}
function reset(){
existingIraBalance.value=50000;contribution.value=7000;convertAmount.value=7000;
taxRate.value=32;annualReturn.value=7;yearsToRetire.value=25;
$('recommendation').textContent='-';$('aftertaxRatio').textContent='-';
$('aftertaxSub').textContent='';$('taxDue').textContent='-';
$('taxFreePart').textContent='-';$('rothFinal').textContent='-';
$('vsTaxable').textContent='-';
$('recommendation').parentElement.className='result-card highlight';
$('proRataSection').style.display='none';
}
function copyResult(){
const lines=['=== Backdoor Roth IRA Analysis ===',
'Recommendation: '+$('recommendation').textContent,
'After-Tax Ratio: '+$('aftertaxRatio').textContent,
'Taxable on Conversion: '+$('taxDue').textContent,
'Tax-Free Portion: '+$('taxFreePart').textContent,
'Roth Future Value: '+$('rothFinal').textContent,
'vs Taxable Account Advantage: '+$('vsTaxable').textContent];
navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
