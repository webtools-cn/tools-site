<div class="container">
<div class="header"><h1>🤖 AI Prompt Template Builder</h1><div class="lang-switch"><a href="../../prompt-template-builder/" class="">intext</a><a href="index.html" class="active">EN</a></div></div>

<div class="panel">
<h2>📋 Fill Template Parameters</h2>

<div class="form-row">
<div class="form-group">
<label for="role">AI Role</label>
<select id="role">
<option value="">-- Select or customize --</option>
<option value="Senior Software Engineer">Senior Software Engineer</option>
<option value="Professional Copywriter">Professional Copywriter</option>
<option value="Data Analyst">Data Analyst</option>
<option value="Product Manager">Product Manager</option>
<option value="UI/UX Designer">UI/UX Designer</option>
<option value="Translation Expert">Translation Expert</option>
<option value="Legal Advisor">Legal Advisor</option>
<option value="Marketing Specialist">Marketing Specialist</option>
<option value="Academic Tutor">Academic Tutor</option>
<option value="Career Coach">Career Coach</option>
<option value="Creative Writer">Creative Writer</option>
<option value="SEO Specialist">SEO Specialist</option>
</select>
</div>
<div class="form-group">
<label for="customRole">Or Custom Role</label>
<input type="text" id="customRole" placeholder="e.g., Frontend Architect skilled in React and TypeScript">
</div>
</div>

<div class="form-row">
<div class="form-group">
<label for="tone">Tone</label>
<select id="tone">
<option value="Professional & Formal">Professional & Formal</option>
<option value="Friendly & Approachable">Friendly & Approachable</option>
<option value="Concise & Direct">Concise & Direct</option>
<option value="Humorous & Witty">Humorous & Witty</option>
<option value="Academic & Rigorous">Academic & Rigorous</option>
<option value="Encouraging & Motivational">Encouraging & Motivational</option>
</select>
</div>
<div class="form-group">
<label for="format">Output Format</label>
<select id="format">
<option value="Markdown">Markdown</option>
<option value="Plain Text">Plain Text</option>
<option value="JSON">JSON</option>
<option value="Table">Table</option>
<option value="Bullet List">Bullet List</option>
<option value="Code Block">Code Block</option>
</select>
</div>
</div>

<div class="form-group">
<label for="task">Task Description (Required)</label>
<textarea id="task" placeholder="Describe what you want the AI to do. e.g., Write a blog post about remote work productivity for tech company managers, 800-1000 words..."></textarea>
</div>

<div class="form-group">
<label for="context">Background / Context (Optional)</label>
<textarea id="context" placeholder="Provide additional background. e.g., Our product is a SaaS project management tool targeting small to medium teams..."></textarea>
</div>

<div class="form-group">
<label for="constraints">Constraints (Optional, one per line)</label>
<textarea id="constraints" placeholder="e.g., Avoid technical jargon&#10;No generic AI phrases&#10;Provide specific examples for each point" rows="3"></textarea>
</div>

<div class="form-group">
<label for="example">Example (Optional)</label>
<textarea id="example" placeholder="Provide input/output examples to help AI understand the desired format"></textarea>
</div>

<div class="btn-row">
<button class="btn btn-primary" id="btnGenerate">✨ Generate Prompt</button>
<button class="btn btn-secondary" id="btnClear">🔄 Clear All</button>
</div>
</div>

<div class="btn-row" style="margin-top:12px">

<script>
(function(){
var role=document.getElementById('role');
var customRole=document.getElementById('customRole');
var tone=document.getElementById('tone');
var format=document.getElementById('format');
var task=document.getElementById('task');
var context=document.getElementById('context');
var constraints=document.getElementById('constraints');
var example=document.getElementById('example');
var outputArea=document.getElementById('outputArea');
var preview=document.getElementById('preview');
var genTime=document.getElementById('genTime');
var charCount=document.getElementById('charCount');
var btnGenerate=document.getElementById('btnGenerate');
var btnClear=document.getElementById('btnClear');
var btnCopy=document.getElementById('btnCopy');
var btnCopyPlain=document.getElementById('btnCopyPlain');
var toast=document.getElementById('toast');

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){toast.classList.remove('show');},2000);
}

function getRole(){
  return customRole.value.trim() || role.value || '';
}

function buildPrompt(){
  var r=getRole();
  var t=task.value.trim();
  if(!t){showToast('Please fill in the task description');return;}

  var parts=[];
  if(r){parts.push('You are a ' + r + '.');}
  if(tone.value){parts.push('Respond in a ' + tone.value.toLowerCase() + ' tone.');}
  parts.push('Task: ' + t);
  if(context.value.trim()){parts.push('Context: ' + context.value.trim());}
  if(format.value){parts.push('Output format: Please output in ' + format.value + '.');}
  if(constraints.value.trim()){
    var cs=constraints.value.trim().split('\n').filter(function(l){return l.trim();});
    if(cs.length>0){
      parts.push('Constraints:');
      cs.forEach(function(c,i){parts.push((i+1)+'. '+c.trim());});
    }
  }
  if(example.value.trim()){
    parts.push('Reference example:\n' + example.value.trim());
  }
  return parts.join('\n\n');
}

btnGenerate.addEventListener('click',function(){
  var p=buildPrompt();
  if(!p)return;
  preview.textContent=p;
  var now=new Date();
  genTime.textContent=now.toLocaleTimeString('en-US');
  charCount.textContent=p.length + ' characters';
  outputArea.style.display='block';
  outputArea.scrollIntoView({behavior:'smooth'});
});

btnClear.addEventListener('click',function(){
  role.value='';
  customRole.value='';
  tone.value='Professional & Formal';
  format.value='Markdown';
  task.value='';
  context.value='';
  constraints.value='';
  example.value='';
  outputArea.style.display='none';
});

btnCopy.addEventListener('click',function(){
  var p=preview.textContent;
  if(!p)return;
  navigator.clipboard.writeText(p).then(function(){
    showToast('✅ Copied to clipboard');
  }).catch(function(){
    showToast('❌ Copy failed, please select manually');
  });
});

btnCopyPlain.addEventListener('click',function(){
  var p=preview.textContent;
  if(!p)return;
  var plain=p.replace(/\*\*/g,'').replace(/\*/g,'').replace(/`/g,'');
  navigator.clipboard.writeText(plain).then(function(){
    showToast('✅ Plain text copied');
  }).catch(function(){
    showToast('❌ Copy failed');
  });
});
})();
</script>
