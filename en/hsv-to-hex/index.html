<body>
<div class="container">
<nav class="nav-back"><a href="/en/">← Back to Home</a></nav>
<header class="header">
<h1>HSV to HEX Converter</h1>
<div class="lang-switch">
<a href="/hsv-to-hex/">CN</a>
<a href="/en/hsv-to-hex/" class="active">EN</a>
</div>
</header>
<div class="input-section" id="app">
<h2>HSV → HEX</h2>
<div class="row">
<div class="field"><label>H (Hue 0-360)</label><input type="range" id="h" min="0" max="360" value="180" style="width:100%;margin-bottom:4px"><div style="text-align:center;color:#94a3b8;font-size:.85rem"><span id="h-val">180</span>°</div></div>
<div class="field"><label>S (Saturation 0-100)</label><input type="range" id="s" min="0" max="100" value="80" style="width:100%;margin-bottom:4px"><div style="text-align:center;color:#94a3b8;font-size:.85rem"><span id="s-val">80</span>%</div></div>
<div class="field"><label>V (Value 0-100)</label><input type="range" id="v" min="0" max="100" value="80" style="width:100%;margin-bottom:4px"><div style="text-align:center;color:#94a3b8;font-size:.85rem"><span id="v-val">80</span>%</div></div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:12px 0">
<div class="color-preview" id="preview" style="width:64px;height:64px"></div>
<div>
<div class="info-row"><span>HEX:</span><strong id="hex-val" style="color:#22d3ee">#29cccc</strong></div>
<div class="info-row"><span>RGB:</span><strong id="rgb-val" style="color:#94a3b8">--</strong></div>
</div>
</div>
<div class="btn-row">
<button class="btn btn-success" id="btn-copy">Copy HEX</button>
</div>
</div>
<footer><p>© Free ToolBase · Pure client-side, no data uploaded · <a href="/en/privacy-policy/">Privacy</a> · <a href="/en/terms-of-service/">Terms</a></p></footer>
</div>
<div class="toast" id="toast"></div>
<script>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已Copy到剪贴板 / Copied!')}).catch(function(){showToast('CopyFailed / Copy failed')})}

function hsvToRgb(h,s,v){s/=100;v/=100;var c=v*s;var x=c*(1-Math.abs((h/60)%2-1));var m=v-c;var r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}r=Math.round((r+m)*255);g=Math.round((g+m)*255);b=Math.round((b+m)*255);return{r:r,g:g,b:b}}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){var h=x.toString(16);return h.length===1?'0'+h:h}).join('')}
function update(){
  var h=parseInt(document.getElementById('h').value);
  var s=parseInt(document.getElementById('s').value);
  var v=parseInt(document.getElementById('v').value);
  var rgb=hsvToRgb(h,s,v);
  var hex=rgbToHex(rgb.r,rgb.g,rgb.b);
  document.getElementById('h-val').textContent=h;
  document.getElementById('s-val').textContent=s;
  document.getElementById('v-val').textContent=v;
  document.getElementById('preview').style.backgroundColor=hex;
  document.getElementById('hex-val').textContent=hex;
  document.getElementById('rgb-val').textContent='rgb('+rgb.r+', '+rgb.g+', '+rgb.b+')';
}
document.getElementById('h').addEventListener('input',update);
document.getElementById('s').addEventListener('input',update);
document.getElementById('v').addEventListener('input',update);
document.getElementById('btn-copy').addEventListener('click',function(){copyText(document.getElementById('hex-val').textContent)});
update();

</script>
