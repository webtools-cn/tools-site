<style>

<body>
<header>
  <div class="nav">
    <a href="/en/" class="logo">🧰 Free ToolBase</a>

      <a href="/data-format-converter/">中文</a>

    </div>

</header>
<main class="container">
  <div class="hero">
    <h1>🔄 Data Format Converter</h1>
    <p>JSON / CSV / XML Interconversion · Client-side Processing · No Data Upload · Free No Registration</p>
  </div>
  <div class="tool-grid">
    <div class="panel">
      <div class="panel-header">
        <h2>📥 Input</h2>
        <select id="sourceFormat" aria-label="Source Format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="xml">XML</option>
        </select>
      </div>
      <div class="panel-body">
        <textarea id="inputText" placeholder="Paste or type your data here..." aria-label="Input data"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="convert()">🔄 Convert</button>
          <button class="btn btn-secondary" onclick="formatInput()">✨ Beautify</button>
          <button class="btn btn-secondary" onclick="clearInput()">🗑️ Clear</button>
        </div>
      </div>
    </div>
    <div class="swap-col">
      <button class="swap-btn" onclick="swapFormats()" title="Swap Formats" aria-label="Swap Formats">⇄</button>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2>📤 Output</h2>
        <select id="targetFormat" aria-label="Target Format">
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
        </select>
      </div>
      <div class="panel-body">
        <textarea id="outputText" placeholder="Conversion result will appear here..." readonly aria-label="Output result"></textarea>
        <div class="btn-row">
          <button class="btn btn-success" onclick="copyOutput()">📋 Copy</button>
          <button class="btn btn-secondary" onclick="downloadOutput()">💾 Download</button>
        </div>
      </div>
    </div>
  </div>
</main>
<footer>
  <p>Data Format Converter · All conversion happens locally in your browser · <a href="/en/">Back to Home</a></p>
</footer>

<script>
// Toast notification
function showToast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();}, 2500);
}

// Source/target format init
var sourceFormat = document.getElementById('sourceFormat');
var targetFormat = document.getElementById('targetFormat');
sourceFormat.addEventListener('change', function(){
  var sv = sourceFormat.value;
  var opts = targetFormat.options;
  for(var i=0;i<opts.length;i++){
    opts[i].disabled = (opts[i].value === sv);
  }
  if(targetFormat.value === sv){
    for(var i=0;i<opts.length;i++){
      if(opts[i].value !== sv){ targetFormat.value = opts[i].value; break; }
    }
  }
});
targetFormat.addEventListener('change', function(){
  var tv = targetFormat.value;
  var opts = sourceFormat.options;
  for(var i=0;i<opts.length;i++){
    opts[i].disabled = (opts[i].value === tv);
  }
  if(sourceFormat.value === tv){
    for(var i=0;i<opts.length;i++){
      if(opts[i].value !== tv){ sourceFormat.value = opts[i].value; break; }
    }
  }
});
(function(){
  var sv = sourceFormat.value;
  var opts = targetFormat.options;
  for(var i=0;i<opts.length;i++){
    opts[i].disabled = (opts[i].value === sv);
  }
})();

function swapFormats(){
  var sv = sourceFormat.value;
  var tv = targetFormat.value;
  var sopts = sourceFormat.options;
  var topts = targetFormat.options;
  for(var i=0;i<sopts.length;i++) sopts[i].disabled = false;
  for(var i=0;i<topts.length;i++) topts[i].disabled = false;
  sourceFormat.value = tv;
  targetFormat.value = sv;
  var nsv = sourceFormat.value;
  for(var i=0;i<topts.length;i++) topts[i].disabled = (topts[i].value === nsv);
}

function clearInput(){
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').value = '';
}

function formatInput(){
  var input = document.getElementById('inputText');
  var fmt = sourceFormat.value;
  try{
    if(fmt === 'json'){
      var obj = JSON.parse(input.value);
      input.value = JSON.stringify(obj, null, 2);
    }else if(fmt === 'xml'){
      input.value = formatXML(input.value);
    }else{
      input.value = input.value.trim();
    }
    showToast('Formatted successfully', 'success');
  }catch(e){
    showToast('Format error: ' + e.message, 'error');
  }
}

function formatXML(xml){
  var formatted = '';
  var reg = /(>)(<)(\/*)/g;
  xml = xml.replace(reg, '$1\n$2$3');
  var pad = 0;
  var nodes = xml.split('\n');
  for(var i=0;i<nodes.length;i++){
    var node = nodes[i].trim();
    if(!node) continue;
    var indent = 0;
    if(node.match(/^<\/\w/)){ pad = Math.max(0, pad-1); }
    else if(node.match(/^<\w[^>]*[^/]>.*$/)){ indent = 1; }
    for(var j=0;j<pad;j++) formatted += '  ';
    formatted += node + '\n';
    if(indent) pad++;
  }
  return formatted;
}

function convert(){
  var input = document.getElementById('inputText').value.trim();
  var output = document.getElementById('outputText');
  var src = sourceFormat.value;
  var tgt = targetFormat.value;
  var inputEl = document.getElementById('inputText');
  inputEl.classList.remove('error');
  if(!input){ showToast('Please enter data', 'error'); return; }
  try{
    var result = '';
    if(src === 'json' && tgt === 'csv'){ result = jsonToCSV(input); }
    else if(src === 'json' && tgt === 'xml'){ result = jsonToXML(input); }
    else if(src === 'csv' && tgt === 'json'){ result = csvToJSON(input); }
    else if(src === 'csv' && tgt === 'xml'){ result = csvToXML(input); }
    else if(src === 'xml' && tgt === 'json'){ result = xmlToJSON(input); }
    else if(src === 'xml' && tgt === 'csv'){ result = xmlToCSV(input); }
    output.value = result;
    showToast('Conversion successful!', 'success');
  }catch(e){
    inputEl.classList.add('error');
    showToast('Conversion failed: ' + e.message, 'error');
  }
}

function jsonToCSV(jsonStr){
  var data = JSON.parse(jsonStr);
  if(!Array.isArray(data)){
    if(typeof data === 'object' && data !== null){ data = [data]; }
    else{ throw new Error('JSON must be an array or object'); }
  }
  if(data.length === 0) return '';
  var keys = Object.keys(data[0]);
  var csv = keys.join(',') + '\n';
  for(var i=0;i<data.length;i++){
    var row = [];
    for(var j=0;j<keys.length;j++){
      var val = data[i][keys[j]];
      if(val === null || val === undefined) val = '';
      val = String(val);
      if(val.indexOf(',') !== -1 || val.indexOf('"') !== -1 || val.indexOf('\n') !== -1){
        val = '"' + val.replace(/"/g,'""') + '"';
      }
      row.push(val);
    }
    csv += row.join(',') + '\n';
  }
  return csv;
}

function jsonToXML(jsonStr){
  var data = JSON.parse(jsonStr);
  function toXML(obj, rootName){
    rootName = rootName || 'root';
    var xml = '';
    if(Array.isArray(obj)){
      for(var i=0;i<obj.length;i++){ xml += toXML(obj[i], 'item'); }
    }else if(typeof obj === 'object' && obj !== null){
      xml += '<' + rootName;
      var children = '';
      for(var key in obj){
        if(obj.hasOwnProperty(key)){
          var val = obj[key];
          if(key.indexOf('@') === 0){
            xml += ' ' + key.substring(1) + '="' + escapeXML(String(val)) + '"';
          }else if(Array.isArray(val)){
            for(var i=0;i<val.length;i++){ children += toXML(val[i], key); }
          }else if(typeof val === 'object' && val !== null){
            children += toXML(val, key);
          }else{
            children += '<' + key + '>' + escapeXML(String(val)) + '</' + key + '>';
          }
        }
      }
      if(children){ xml += '>' + children + '</' + rootName + '>'; }
      else{ xml += ' />'; }
    }else{
      xml += '<' + rootName + '>' + escapeXML(String(obj)) + '</' + rootName + '>';
    }
    return xml;
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + toXML(data);
}

function escapeXML(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function csvToJSON(csvStr){
  var lines = csvStr.trim().split(/\r?\n/);
  if(lines.length < 2) throw new Error('CSV needs at least a header row and one data row');
  var headers = parseCSVLine(lines[0]);
  var result = [];
  for(var i=1;i<lines.length;i++){
    var vals = parseCSVLine(lines[i]);
    var obj = {};
    for(var j=0;j<headers.length;j++){
      var val = vals[j] || '';
      if(val === 'true') val = true;
      else if(val === 'false') val = false;
      else if(val === 'null' || val === '') val = null;
      else if(!isNaN(val) && val !== '') val = Number(val);
      obj[headers[j]] = val;
    }
    result.push(obj);
  }
  return JSON.stringify(result, null, 2);
}

function parseCSVLine(line){
  var result = [];
  var current = '';
  var inQuotes = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(i+1 < line.length && line[i+1]==='"'){ current += '"'; i++; }
        else{ inQuotes = false; }
      }else{ current += ch; }
    }else{
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(current); current = ''; }
      else{ current += ch; }
    }
  }
  result.push(current);
  return result;
}

function csvToXML(csvStr){ var json = csvToJSON(csvStr); return jsonToXML(json); }

function xmlToJSON(xmlStr){
  var parser = new DOMParser();
  var doc = parser.parseFromString(xmlStr, 'text/xml');
  var errorNode = doc.querySelector('parsererror');
  if(errorNode) throw new Error('XML parse error: ' + errorNode.textContent);
  function parseNode(node){
    if(node.nodeType === 3){
      var txt = node.textContent.trim();
      if(txt === '') return null;
      if(!isNaN(txt) && txt !== '') return Number(txt);
      if(txt === 'true') return true;
      if(txt === 'false') return false;
      if(txt === 'null') return null;
      return txt;
    }
    if(node.nodeType !== 1) return null;
    var obj = {};
    if(node.attributes){
      for(var i=0;i<node.attributes.length;i++){
        obj['@'+node.attributes[i].name] = node.attributes[i].value;
      }
    }
    var childGroups = {};
    for(var i=0;i<node.childNodes.length;i++){
      var child = node.childNodes[i];
      var parsed = parseNode(child);
      if(parsed === null) continue;
      var tagName = child.nodeName;
      if(childGroups[tagName] === undefined){ childGroups[tagName] = []; }
      childGroups[tagName].push(parsed);
    }
    var keys = Object.keys(childGroups);
    if(keys.length === 0){
      var textContent = node.textContent.trim();
      if(Object.keys(obj).length === 0){
        if(!isNaN(textContent) && textContent !== '') return Number(textContent);
        if(textContent === 'true') return true;
        if(textContent === 'false') return false;
        if(textContent === 'null' || textContent === '') return null;
        return textContent;
      }
      if(textContent && Object.keys(obj).length > 0){ obj['#text'] = textContent; }
      return obj;
    }
    for(var key in childGroups){
      obj[key] = childGroups[key].length === 1 ? childGroups[key][0] : childGroups[key];
    }
    return obj;
  }
  var root = doc.documentElement;
  var result = parseNode(root);
  return JSON.stringify(result, null, 2);
}

function xmlToCSV(xmlStr){ var jsonStr = xmlToJSON(xmlStr); return jsonToCSV(jsonStr); }

function copyOutput(){
  var output = document.getElementById('outputText');
  if(!output.value){ showToast('Nothing to copy', 'error'); return; }
  if(navigator.clipboard){
    navigator.clipboard.writeText(output.value).then(function(){
      showToast('Copied to clipboard!', 'success');
    }).catch(function(){ fallbackCopy(output); });
  }else{ fallbackCopy(output); }
}

function fallbackCopy(el){
  el.removeAttribute('readonly');
  el.select();
  try{ document.execCommand('copy'); showToast('Copied to clipboard!', 'success'); }catch(e){ showToast('Copy failed, please select manually', 'error'); }
  el.setAttribute('readonly','');
}

function downloadOutput(){
  var output = document.getElementById('outputText');
  if(!output.value){ showToast('Nothing to download', 'error'); return; }
  var tgt = targetFormat.value;
  var extMap = {json:'json',csv:'csv',xml:'xml'};
  var mimeMap = {json:'application/json',csv:'text/csv',xml:'application/xml'};
  var blob = new Blob([output.value], {type:mimeMap[tgt]||'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'converted.' + (extMap[tgt]||'txt');
  a.click();
  URL.revokeObjectURL(url);
  showToast('Downloaded!', 'success');
}
</script>
