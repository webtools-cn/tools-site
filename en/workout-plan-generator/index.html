    (function(){
      const exercises = {
        build: {
          gym: [
            { name: 'Barbell Bench Press', sets: '4x8-10', rest: '90s' },
            { name: 'Barbell Squat', sets: '4x8-10', rest: '120s' },
            { name: 'Barbell Deadlift', sets: '3x6-8', rest: '120s' },

            { name: 'Pull-ups', sets: '3x8-12', rest: '90s' },
            { name: 'Bicep Curls', sets: '3x12-15', rest: '60s' },
            { name: 'Tricep Pushdowns', sets: '3x12-15', rest: '60s' },
            { name: 'Leg Press', sets: '3x10-12', rest: '90s' },
            { name: 'Seated Cable Row', sets: '3x10-12', rest: '90s' }
          ],
          home: [
            { name: 'Push-ups', sets: '4x12-20', rest: '60s' },
            { name: 'Jump Squats', sets: '3x15-20', rest: '60s' },
            { name: 'Bulgarian Split Squats', sets: '3x10-12/side', rest: '60s' },
            { name: 'Band Rows', sets: '3x12-15', rest: '60s' },
            { name: 'Band Shoulder Press', sets: '3x12-15', rest: '60s' },
            { name: 'Glute Bridges', sets: '3x15-20', rest: '60s' },
            { name: 'Diamond Push-ups', sets: '3x10-15', rest: '60s' },
            { name: 'Band Bicep Curls', sets: '3x15-20', rest: '45s' },
            { name: 'Bench Dips', sets: '3x12-15', rest: '60s' },
            { name: 'Lunges', sets: '3x12-15/side', rest: '60s' }
          ]
        },
        lose: {
          gym: [
            { name: 'Burpees', sets: '3x15', rest: '45s' },
            { name: 'Kettlebell Swings', sets: '3x20', rest: '45s' },
            { name: 'Battle Ropes', sets: '3x30s', rest: '30s' },
            { name: 'Rowing Machine', sets: '5 min', rest: '60s' },
            { name: 'Dumbbell Thrusters', sets: '3x12-15', rest: '45s' },
            { name: 'Squats', sets: '3x15-20', rest: '45s' },
            { name: 'Mountain Climbers', sets: '3x30s', rest: '30s' },
            { name: 'Jump Rope', sets: '3x1 min', rest: '30s' },
            { name: 'TRX Rows', sets: '3x15', rest: '45s' },
            { name: 'Box Jumps', sets: '3x10', rest: '45s' }
          ],
          home: [
            { name: 'Jumping Jacks', sets: '3x45s', rest: '30s' },
            { name: 'High Knees', sets: '3x30s', rest: '30s' },
            { name: 'Burpees', sets: '3x10', rest: '45s' },
            { name: 'Bodyweight Squats', sets: '3x20', rest: '45s' },
            { name: 'Mountain Climbers', sets: '3x30s', rest: '30s' },
            { name: 'Plank', sets: '3x45s', rest: '30s' },
            { name: 'Jump Lunges', sets: '3x12/side', rest: '45s' },
            { name: 'Push-ups', sets: '3x15', rest: '45s' },
            { name: 'Bear Crawls', sets: '3x20m', rest: '45s' },
            { name: 'Jump Rope (simulated)', sets: '3x1 min', rest: '30s' }
          ]
        },
        tone: {
          gym: [
            { name: 'Dumbbell Flyes', sets: '3x15', rest: '60s' },
            { name: 'Cable Crossovers', sets: '3x15', rest: '60s' },
            { name: 'Leg Curls', sets: '3x15', rest: '60s' },
            { name: 'Lateral Raises', sets: '3x15', rest: '45s' },
            { name: 'Seated Cable Row', sets: '3x15', rest: '60s' },
            { name: 'Hip Thrusts', sets: '3x15', rest: '60s' },
            { name: 'Crunches', sets: '3x20', rest: '45s' },
            { name: 'Dumbbell Curls', sets: '3x15', rest: '45s' },
            { name: 'Tricep Rope Pushdowns', sets: '3x15', rest: '45s' },
            { name: 'Plank', sets: '3x60s', rest: '30s' }
          ],
          home: [
            { name: 'Push-ups', sets: '3x15', rest: '45s' },
            { name: 'Squats', sets: '3x20', rest: '45s' },
            { name: 'Glute Bridges', sets: '3x20', rest: '45s' },
            { name: 'Band Lateral Raises', sets: '3x15', rest: '45s' },
            { name: 'Band Rows', sets: '3x15', rest: '45s' },
            { name: 'Dead Bugs', sets: '3x12/side', rest: '30s' },
            { name: 'Bird Dogs', sets: '3x10/side', rest: '30s' },
            { name: 'Bench Dips', sets: '3x15', rest: '45s' },
            { name: 'Supermans', sets: '3x15', rest: '30s' },
            { name: 'Side Planks', sets: '3x30s/side', rest: '30s' }
          ]
        },
        strength: {
          gym: [
            { name: 'Barbell Squat', sets: '5x5', rest: '180s' },
            { name: 'Barbell Bench Press', sets: '5x5', rest: '180s' },
            { name: 'Barbell Deadlift', sets: '3x5', rest: '180s' },
            { name: 'Barbell OHP', sets: '5x5', rest: '150s' },
            { name: 'Barbell Row', sets: '5x5', rest: '150s' },
            { name: 'Weighted Pull-ups', sets: '4x6-8', rest: '150s' },
            { name: 'Dips', sets: '4x8-10', rest: '120s' },
            { name: "Farmer's Walks", sets: '3x30m', rest: '120s' }
          ],
          home: [
            { name: 'Pistol Squats', sets: '4x5-8/side', rest: '120s' },
            { name: 'Handstand Push-ups', sets: '4x5-8', rest: '120s' },
            { name: 'Pull-ups', sets: '4x8-12', rest: '120s' },
            { name: 'Weighted Bulgarian Split Squats', sets: '4x8/side', rest: '120s' },
            { name: 'Dips', sets: '4x10', rest: '120s' },
            { name: 'Wide Push-ups', sets: '4x12-15', rest: '90s' },
            { name: 'Band Deadlifts', sets: '4x12-15', rest: '90s' }
          ]
        }
      };

      function shuffle(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

      function generatePlan() {
        const goal = document.getElementById('goal').value;
        const level = document.getElementById('level').value;
        const days = parseInt(document.getElementById('days').value);
        const equip = document.getElementById('equipment').value;

        let eqKey = equip === 'home' ? 'home' : 'gym';
        if (equip === 'mixed') eqKey = Math.random() > 0.5 ? 'gym' : 'home';

        const pool = [...(exercises[goal]?.[eqKey] || exercises.build.gym)];
        shuffle(pool);

        const perDay = level === 'beginner' ? 4 : level === 'intermediate' ? 5 : 6;
        const dayNamesEN = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
        const dayFocus = goal === 'build' ? ['Chest + Triceps','Back + Biceps','Legs + Shoulders'] :
                         goal === 'lose' ? ['Full Body HIIT','Full Body HIIT','Full Body HIIT','Full Body HIIT','Full Body HIIT'] :
                         goal === 'tone' ? ['Upper Body','Lower Body + Core','Full Body','Upper Body','Lower Body'] :
                         ['Squat Day','Bench Day','Deadlift Day','OHP Day','Accessory Day'];

        let html = '';
        for (let i = 0; i < days; i++) {
          const exs = pool.slice(i * perDay, (i + 1) * perDay);
          html += '<div class="plan-day"><div class="plan-day-header">📅 ' + dayNamesEN[i] + ' — ' + (dayFocus[i] || 'Training Day') + '</div><div class="plan-day-body">';
          exs.forEach(e => {
            html += '<div class="exercise-row"><span class="exercise-name">'+e.name+'</span><span class="exercise-detail">'+e.sets+' · Rest '+e.rest+'</span></div>';
          });
          html += '</div></div>';
        }

        const tips = {
          build: '💡 Muscle Building: Maintain a 300-500kcal surplus, 1.6-2.2g/kg protein, stop 1-2 reps before failure.',
          lose: '💡 Fat Loss: 300-500kcal deficit, refuel within 30 min post-workout, prioritize sleep.',
          tone: '💡 Toning: Focus on form over weight, 45-60 min sessions, pair with cardio for best results.',
          strength: '💡 Strength: Full rest between sets, progressive overload (+2.5-5kg/week), log your lifts.'
        };

        html += '<div class="plan-tips">'+tips[goal]+'</div>';
        document.getElementById('planContent').innerHTML = html;
      }

      document.getElementById('generateBtn').addEventListener('click', generatePlan);
    })(;</script>
