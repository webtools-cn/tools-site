<body>
<div class="container">
<div class="header">
<h1>🌀 Spirograph Generator</h1>
<div class="lang-switch">
<a href="/spirograph-generator/">中文</a>
<a href="/en/spirograph-generator/" class="active">English</a>
</div>
</div>
<div class="nav-back"><a href="/en/">← Back to Home</a></div>

<div class="main-layout">
<div class="controls">
<h2>⚙️ Parameters</h2>
<div class="control-group">
<label>Gear Ratio (outer/inner) <span class="val" id="val-ratio">5</span></label>
<input type="range" id="ratio" min="2" max="20" value="5" step="0.1">
</div>
<div class="control-group">
<label>Outer Radius <span class="val" id="val-outer">280</span></label>
<input type="range" id="outerR" min="100" max="400" value="280" step="1">
</div>
<div class="control-group">
<label>Inner Radius <span class="val" id="val-inner">56</span></label>
<input type="range" id="innerR" min="10" max="200" value="56" step="1">
</div>
<div class="control-group">
<label>Pen Offset <span class="val" id="val-pen">40</span></label>
<input type="range" id="penOffset" min="0" max="150" value="40" step="1">
</div>
<div class="control-group">
<label>Line Width <span class="val" id="val-width">1.5</span></label>
<input type="range" id="lineWidth" min="0.5" max="6" value="1.5" step="0.1">
</div>
<div class="control-group">
<label>Line Color</label>
<input type="color" id="lineColor" value="#8B5CF6">
</div>
<div class="control-group">
<label>Background Color</label>
<input type="color" id="bgColor" value="#ffffff">
</div>
<div class="control-group">
<label>Rotations <span class="val" id="val-rotations">15</span></label>
<input type="range" id="rotations" min="1" max="50" value="15" step="1">
</div>
<div class="btn-row">
<button class="btn btn-primary" onclick="generate()">🎨 Generate</button>
<button class="btn btn-secondary" onclick="downloadPNG()">📥 Download PNG</button>
</div>
<button class="btn btn-accent" style="margin-top:8px" onclick="randomize()">🎲 Randomize</button>
</div>
<div class="canvas-area">
<h2>📐 Preview</h2>
<canvas id="canvas" width="600" height="600"></canvas>
<div class="preview-stats" id="stats">Adjust parameters and click Generate</div>
</div>
</div>
<footer>
<p>🛡️ Pure frontend Canvas rendering · Images never uploaded · Data stays private</p>
<p>© 2026 <a href="/en/">Free ToolBase</a> · All tools free to use</p>
</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;
const SIZE = 600;

function initCanvas() {
  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  ctx.scale(DPR, DPR);
}

document.querySelectorAll('input[type="range"]').forEach(el => {
  el.addEventListener('input', function() {
    const valId = 'val-' + this.id.replace(/([A-Z])/g, '-$1').toLowerCase();
    const label = document.getElementById(valId);
    if (label) {
      if (this.id === 'ratio') label.textContent = parseFloat(this.value).toFixed(1);
      else if (this.id === 'lineWidth') label.textContent = parseFloat(this.value).toFixed(1);
      else label.textContent = this.value;
    }
  });
});

function spirographPoints(R, r, d, rotations) {
  const points = [];
  const steps = Math.floor(rotations * 360 * 2);
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * rotations * Math.PI * 2;
    const x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
    const y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
    points.push({x, y});
  }
  return points;
}

function generate() {
  initCanvas();
  
  const ratio = parseFloat(document.getElementById('ratio').value);
  const outerR = parseInt(document.getElementById('outerR').value);
  const innerR = parseInt(document.getElementById('innerR').value);
  const penOffset = parseInt(document.getElementById('penOffset').value);
  const lineWidth = parseFloat(document.getElementById('lineWidth').value);
  const lineColor = document.getElementById('lineColor').value;
  const bgColor = document.getElementById('bgColor').value;
  const rotations = parseInt(document.getElementById('rotations').value);
  
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, SIZE, SIZE);
  
  const centerX = SIZE / 2;
  const centerY = SIZE / 2;
  const maxExtent = outerR + penOffset;
  const scale = (SIZE * 0.42) / maxExtent;
  
  const points = spirographPoints(outerR * scale, innerR * scale, penOffset * scale, rotations);
  
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  ctx.beginPath();
  if (points.length > 0) {
    ctx.moveTo(centerX + points[0].x, centerY + points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(centerX + points[i].x, centerY + points[i].y);
    }
  }
  ctx.stroke();
  
  document.getElementById('stats').textContent =
    `Ratio ${ratio.toFixed(1)}:1 · ${points.length.toLocaleString()} points · ${rotations} rotations`;
  
  showToast('✅ Pattern generated!');
}

function downloadPNG() {
  const dataURL = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.download = 'spirograph-' + Date.now() + '.png';
  link.href = dataURL;
  link.click();
  showToast('📥 PNG downloaded!');
}

function randomize() {
  const ratios = [2, 2.5, 3, 3.5, 4, 5, 6, 7, 8, 9, 10, 11, 13, 15, 17, 20];
  document.getElementById('ratio').value = ratios[Math.floor(Math.random() * ratios.length)];
  document.getElementById('outerR').value = 200 + Math.floor(Math.random() * 200);
  document.getElementById('innerR').value = 20 + Math.floor(Math.random() * 160);
  document.getElementById('penOffset').value = 10 + Math.floor(Math.random() * 130);
  document.getElementById('rotations').value = 3 + Math.floor(Math.random() * 40);
  
  const hue = Math.floor(Math.random() * 360);
  document.getElementById('lineColor').value = `hsl(${hue},70%,55%)`;
  
  document.querySelectorAll('input[type="range"]').forEach(el => {
    el.dispatchEvent(new Event('input'));
  });
  
  generate();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

initCanvas();
generate();
</script>
</body>
</html>
