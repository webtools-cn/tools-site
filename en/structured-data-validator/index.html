<body>
<h1>Free Online Structured Data Validator</h1>
<div id="toast" class="toast"></div>

<div class="container">
  <p style="text-align:center;margin-bottom:24px;color:var(--text-secondary)">Paste your JSON-LD code to validate Schema.org structured data</p>
  <div style="background:var(--surface);border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:16px">
    <textarea id="jsonInput" style="width:100%;min-height:200px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.9rem;resize:vertical;background:var(--bg);color:var(--text)" placeholder='Paste JSON-LD code, e.g.:&#10;{"@context":"https://schema.org","@type":"Article","headline":"Title"}'></textarea>
    <button onclick="validateSD()" style="width:100%;margin-top:12px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600">🔍 Validate Structured Data</button>
    <button onclick="clearAll()" style="width:100%;margin-top:8px;padding:10px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.9rem">🗑️ Clear</button>
  </div>
  <div id="result" style="background:var(--surface);border-radius:12px;padding:20px;border:1px solid var(--border);display:none">
    <h3 style="margin-bottom:12px">Validation Result</h3>
    <div id="resultContent"></div>
  </div>
</div>

<div class="related-tools-section" id="related-tools-section"><div class="related-tools-loading">Loading related tools...</div></div>
<script>
(function(){
var s=document.getElementById('related-tools-section');
if(!s)return;
var p=window.location.pathname;
var en=p.indexOf('/en/')!==-1;
p=p.replace(/\/en\//g,'/');
var slug=p.split('/').filter(Boolean).pop()||'';
if(!slug){s.innerHTML='';return;}
var depth=en?'../../':'../';
var u=depth+'related-tools.json';
fetch(u).then(function(r){
  if(!r.ok)throw new Error('not found');
  return r.json();
}).then(function(d){
  var data=en?d.en:d.cn;
  var t=data[slug];
  if(!t||!t.related||!t.related.length){s.innerHTML='';return;}
  var h='<div class="related-tools-inner"><h3 class="related-tools-title">'+(en?'🔗 You May Also Like':'🔗 Tool')+'</h3><div class="related-tools-grid">';
  t.related.forEach(function(r){
    var link=en?'../../en/'+r.slug+'/':'../'+r.slug+'/';
    h+='<a href="'+link+'" class="related-tool-card"><span class="related-tool-icon">'+(r.icon||'🔧')+'</span><span class="related-tool-name">'+r.name+'</span></a>';
  });
  h+='</div></div>';
  s.innerHTML=h;
}).catch(function(){s.innerHTML='';});
})();
</script>

<script>
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}
function clearAll(){
  document.getElementById('jsonInput').value='';
  document.getElementById('result').style.display='none';
  document.getElementById('jsonInput').focus();
}
function validateSD(){
  var input=document.getElementById('jsonInput').value.trim();
  var resultEl=document.getElementById('result');
  var contentEl=document.getElementById('resultContent');
  if(!input){showToast('Please paste JSON-LD code');return;}
  var issues=[];
  try{
    var data=JSON.parse(input);
    if(!data['@context']||data['@context']!=='https://schema.org')issues.push('Missing or invalid @context (should be https://schema.org)');
    if(!data['@type'])issues.push('Missing @type field');
    else{
      var knownTypes=['Article','Product','FAQPage','BreadcrumbList','HowTo','LocalBusiness','Organization','Person','WebSite','WebPage','Recipe','Review','Event','VideoObject','ImageObject','SoftwareApplication','Book','Course','JobPosting','NewsArticle','BlogPosting','Service','CreativeWork'];
      if(knownTypes.indexOf(data['@type'])===-1)issues.push('@type "'+data['@type']+'" is not a common Schema type');
    }
    if(issues.length===0){
      contentEl.innerHTML='<p style="color:#22c55e;font-weight:600">✅ Valid JSON-LD!</p><p style="margin-top:8px;color:var(--text-secondary)">@type: '+data['@type']+'</p><p style="color:var(--text-secondary)">Use <a href="https://search.google.com/test/rich-results" target="_blank" style="color:var(--primary)">Google Rich Results Test</a> for final verification.</p>';
    }else{
      contentEl.innerHTML='<p style="color:#ef4444;font-weight:600">⚠️ Found '+issues.length+' issue(s):</p><ul style="margin-top:8px;padding-left:20px;color:var(--text-secondary)">'+issues.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><p style="margin-top:12px;color:var(--text-secondary)">JSON syntax is valid, but may be missing required Schema.org fields.</p>';
    }
  }catch(e){
    contentEl.innerHTML='<p style="color:#ef4444;font-weight:600">❌ JSON Syntax Error</p><p style="margin-top:8px;color:var(--text-secondary)">'+e.message+'</p>';
  }
  resultEl.style.display='block';
  // Copy result to clipboard for reuse
}
</script>
