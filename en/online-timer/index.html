<body>
<div class="container">
<nav class="nav-back"><a href="/en/">← Back to Home</a></nav>
<header class="header">
<h1>Online Timer</h1>
<div class="lang-switch">
<a href="/online-timer/">中文</a>
<a href="/en/online-timer/" class="active">EN</a>
</div>
</header>
<div class="input-section" id="app">
<h2>Online Countdown</h2>
<div style="text-align:center;font-size:4rem;font-weight:bold;font-family:monospace;color:#22d3ee;margin:16px 0" id="timer-display">00:00</div>
<div class="row">
<div class="field"><label>Hours</label><input type="number" id="hours" value="0" min="0" max="99"></div>
<div class="field"><label>Minutes</label><input type="number" id="minutes" value="5" min="0" max="59"></div>
<div class="field"><label>Seconds</label><input type="number" id="seconds" value="0" min="0" max="59"></div>
</div>
<div class="btn-row" style="justify-content:center">
<button class="btn btn-primary" id="btn-start" style="min-width:100px">Use Now</button>
<button class="btn btn-warning" id="btn-pause" style="min-width:80px">Pause</button>
<button class="btn" id="btn-reset" style="min-width:80px;background:rgba(148,163,184,.15);color:#94a3b8">Reset</button>
</div>
<div class="info-row" style="margin-top:16px;justify-content:center">⏰ Alert sound plays when timer ends</div>
</div>
<footer><p>© Free ToolBase · Pure client-side, no data uploaded · <a href="/en/privacy-policy/">Privacy</a> · <a href="/en/terms-of-service/">Terms</a></p></footer>
</div>
<div class="toast" id="toast"></div>
<script>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板 / Copied!')}).catch(function(){showToast('复制失败 / Copy failed')})}

var timerInterval=null,remaining=0,paused=false;
function fmt(n){return n<10?'0'+n:''+n}
function updateDisplay(){var h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;document.getElementById('timer-display').textContent=fmt(h)+':'+fmt(m)+':'+fmt(s)}
document.getElementById('btn-start').addEventListener('click',function(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  if(!paused){
    var h=parseInt(document.getElementById('hours').value)||0;
    var m=parseInt(document.getElementById('minutes').value)||0;
    var s=parseInt(document.getElementById('seconds').value)||0;
    remaining=h*3600+m*60+s;
    if(remaining<=0){showToast('请设置时间');return}
  }
  paused=false;
  document.getElementById('btn-start').textContent='使用中...';
  timerInterval=setInterval(function(){
    remaining--;
    updateDisplay();
    if(remaining<=0){
      clearInterval(timerInterval);timerInterval=null;
      document.getElementById('timer-display').textContent='00:00';
      document.getElementById('btn-start').textContent='立即使用';
      try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAf3l6fX59fHx7e3l5eHh3d3Z1dXl5eXp6e3x9fX5/gIGCg4SFhoeIiYqLjI2Oj5CRkpOUlZaXmJmam5ydnp+goaKjpKWmp6ipqqusra6vsLGys7S1tre4ubq7vL2+v8DBwsPExcbHyMnKy8zNzs/Q0dLT1NXW19jZ2tvc3d7f4OHi4+Tl5ufo6err7O3u7/Dx8vP09fb3+Pn6+/z9/v8AAAA=').play()}catch(e){}
    }
  },1000);
});
document.getElementById('btn-pause').addEventListener('click',function(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;paused=true;document.getElementById('btn-start').textContent='立即使用'}
});
document.getElementById('btn-reset').addEventListener('click',function(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  paused=false;remaining=0;
  document.getElementById('timer-display').textContent='00:00';
  document.getElementById('btn-start').textContent='立即使用';
});

</script>
</body>
