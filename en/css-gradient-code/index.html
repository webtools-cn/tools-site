<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Gradient Code Generator - Free ToolBase</title>
  <meta name="description" content="Free online CSS gradient code generator. Visually edit linear/radial/conic gradients with real-time preview and one-click CSS code copy. Multi-stop color support.">
  <meta property="og:title" content="CSS Gradient Code Generator - Free ToolBase">
  <meta property="og:description" content="Free online CSS gradient code generator. Visually edit linear/radial/conic gradients and copy CSS code.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CSS Gradient Code Generator",
    "description": "Free online CSS gradient code generator. Visually edit linear/radial/conic gradients and copy CSS code.",
    "applicationCategory": "WebApplication",
    "url": "https://free-toolbase.com/en/css-gradient-code/",
    "operatingSystem": "All"
  }
  </script>
  <style>
  :root { --primary: #4F46E5; --bg: #f8fafc; --card: #fff; --text: #1e293b; --text2: #64748b; --border: #e2e8f0; --radius: 12px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 18px; }
  header span { color: var(--text2); font-size: 14px; }
  main { flex: 1; max-width: 800px; margin: 0 auto; padding: 32px 16px; width: 100%; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: var(--text2); margin-bottom: 24px; font-size: 14px; }
  .tool-panel { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .preview-box { width: 100%; height: 200px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border); transition: background .3s; }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .control-group { flex: 1; min-width: 200px; }
  .control-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .control-group select, .control-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
  .stop-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .stop-row input[type="color"] { width: 40px; height: 36px; border: 1px solid var(--border); border-radius: 4px; padding: 2px; cursor: pointer; }
  .stop-row input[type="range"] { flex: 1; }
  .stop-row .stop-pos { width: 50px; text-align: center; font-size: 13px; }
  .stop-row button { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; }
  .code-output { margin-top: 16px; }
  .code-output label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .code-output .code-block { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; overflow-x: auto; position: relative; }
  .code-output .copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 12px; border: 1px solid #475569; border-radius: 4px; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 12px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .presets button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; transition: .2s; }
  .presets button:hover { border-color: var(--primary); }
  footer { text-align: center; padding: 20px; color: var(--text2); font-size: 13px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
<header><a href="/en/">Free ToolBase</a><span>/ CSS Gradient Code Generator</span></header>
<main>
  <h1>🎨 CSS Gradient Code Generator</h1>
  <p class="subtitle">Visually edit gradients with real-time preview and one-click CSS copy</p>
  <div class="tool-panel">
    <div class="presets" id="presets">
      <button data-preset="sunset">🌅 Sunset</button>
      <button data-preset="ocean">🌊 Ocean</button>
      <button data-preset="forest">🌲 Forest</button>
      <button data-preset="aurora">🌌 Aurora</button>
      <button data-preset="candy">🍬 Candy</button>
      <button data-preset="midnight">🌃 Midnight</button>
    </div>
    <div class="controls">
      <div class="control-group">
        <label>Gradient Type</label>
        <select id="gradientType">
          <option value="linear-gradient">Linear Gradient</option>
          <option value="radial-gradient">Radial Gradient</option>
          <option value="conic-gradient">Conic Gradient</option>
        </select>
      </div>
      <div class="control-group" id="angleGroup">
        <label>Angle</label>
        <input type="range" id="gradientAngle" min="0" max="360" value="135">
        <span style="font-size:13px;" id="angleVal">135°</span>
      </div>
    </div>
    <div class="preview-box" id="preview"></div>
    <div id="stopsContainer"></div>
    <button id="addStopBtn" style="padding:8px 16px;border:1px dashed var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;margin-top:8px;">+ Add Color Stop</button>
    <div class="code-output">
      <label>CSS Code</label>
      <div class="code-block">
        <button class="copy-btn" id="copyBtn">📋 Copy</button>
        <code id="cssCode"></code>
      </div>
    </div>
  </div>
</main>
<footer>© 2025 Free ToolBase - Free Online Tools</footer>
<script>
const PRESETS = {
  sunset: { type: 'linear-gradient', angle: 135, stops: [{color:'#ff6b6b',pos:0},{color:'#feca57',pos:50},{color:'#ff9ff3',pos:100}] },
  ocean: { type: 'linear-gradient', angle: 180, stops: [{color:'#0abde3',pos:0},{color:'#10ac84',pos:50},{color:'#1dd1a1',pos:100}] },
  forest: { type: 'linear-gradient', angle: 90, stops: [{color:'#2ecc71',pos:0},{color:'#27ae60',pos:50},{color:'#1e8449',pos:100}] },
  aurora: { type: 'linear-gradient', angle: 45, stops: [{color:'#6c5ce7',pos:0},{color:'#00cec9',pos:50},{color:'#55efc4',pos:100}] },
  candy: { type: 'linear-gradient', angle: 225, stops: [{color:'#fd79a8',pos:0},{color:'#e84393',pos:50},{color:'#b2bec3',pos:100}] },
  midnight: { type: 'linear-gradient', angle: 180, stops: [{color:'#2d3436',pos:0},{color:'#636e72',pos:50},{color:'#2d3436',pos:100}] },
};

let stops = [{color:'#6c5ce7',pos:0},{color:'#a29bfe',pos:50},{color:'#81ecec',pos:100}];
let gradientType = 'linear-gradient';
let gradientAngle = 135;

function renderStops() {
  const container = document.getElementById('stopsContainer');
  container.innerHTML = stops.map((s,i) => `
    <div class="stop-row">
      <input type="color" value="${s.color}" data-index="${i}" class="stop-color" style="width:40px;height:36px;">
      <input type="range" min="0" max="100" value="${s.pos}" data-index="${i}" class="stop-pos-range">
      <span class="stop-pos">${s.pos}%</span>
      <button data-index="${i}" class="remove-stop" ${stops.length<=2?'disabled':''}>✕</button>
    </div>
  `).join('');
  container.querySelectorAll('.stop-color').forEach(el => {
    el.addEventListener('input', function() { stops[this.dataset.index].color = this.value; updatePreview(); });
  });
  container.querySelectorAll('.stop-pos-range').forEach(el => {
    el.addEventListener('input', function() { stops[this.dataset.index].pos = parseInt(this.value); this.parentElement.querySelector('.stop-pos').textContent = this.value + '%'; updatePreview(); });
  });
  container.querySelectorAll('.remove-stop').forEach(el => {
    el.addEventListener('click', function() { if (stops.length <= 2) return; stops.splice(this.dataset.index, 1); renderStops(); updatePreview(); });
  });
}

function buildCSS() {
  const parts = stops.map(s => `${s.color} ${s.pos}%`).join(', ');
  if (gradientType === 'linear-gradient') return `background: ${gradientType}(${gradientAngle}deg, ${parts});`;
  if (gradientType === 'radial-gradient') return `background: ${gradientType}(circle, ${parts});`;
  return `background: ${gradientType}(from ${gradientAngle}deg, ${parts});`;
}

function updatePreview() {
  const css = buildCSS();
  document.getElementById('preview').style.background = css.replace('background: ', '');
  document.getElementById('cssCode').textContent = css;
}

document.getElementById('gradientType').addEventListener('change', function() {
  gradientType = this.value;
  document.getElementById('angleGroup').style.display = gradientType === 'radial-gradient' ? 'none' : '';
  updatePreview();
});
document.getElementById('gradientAngle').addEventListener('input', function() {
  gradientAngle = parseInt(this.value);
  document.getElementById('angleVal').textContent = gradientAngle + '°';
  updatePreview();
});
document.getElementById('addStopBtn').addEventListener('click', () => {
  stops.push({color:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'), pos:100});
  renderStops();
  updatePreview();
});
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(buildCSS()).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ Copied';
    setTimeout(() => btn.textContent = '📋 Copy', 2000);
  });
});
document.getElementById('presets').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.preset) return;
  const preset = PRESETS[btn.dataset.preset];
  gradientType = preset.type;
  gradientAngle = preset.angle;
  stops = JSON.parse(JSON.stringify(preset.stops));
  document.getElementById('gradientType').value = gradientType;
  document.getElementById('gradientAngle').value = gradientAngle;
  document.getElementById('angleVal').textContent = gradientAngle + '°';
  document.getElementById('angleGroup').style.display = gradientType === 'radial-gradient' ? 'none' : '';
  renderStops();
  updatePreview();
});

renderStops();
updatePreview();
</script>
</body>
</html>
