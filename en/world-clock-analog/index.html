<h2>What is Analog World Clock?</h2>
<p>Analog World Clock is a free online tool that displays real-time analog clocks for multiple cities worldwide. It supports timezone switching, dynamic dial animation, and lets you add or remove up to 8 clocks simultaneously.</p>
<h2>Key Features</h2>
<ul>
<li><strong>Real-time analog display:</strong> Smooth animated clock hands with hour, minute, and second indicators</li>
<li><strong>Multiple city support:</strong> Display up to 8 different timezone clocks at once</li>
<li><strong>Digital time:</strong> Each clock shows both analog dial and digital time with date</li>
<li><strong>Auto-sync:</strong> Uses browser API to keep all clocks synchronized in real-time</li>
<li><strong>One-click copy:</strong> Quickly copy any city's current time</li>
</ul>
<h2>How to Use</h2>
<p>1. On page load, 4 default clocks are displayed automatically.</p>
<p>2. Use the dropdown to select a city, then click "Add" to add a new clock.</p>
<p>3. Click the × button on any clock to remove it.</p>
<p>4. All times update automatically — no manual refresh needed.</p>

<script>
const cityNames={'Asia/Shanghai':'Shanghai','Asia/Tokyo':'Tokyo','Asia/Seoul':'Seoul','Asia/Singapore':'Singapore','Asia/Dubai':'Dubai','Asia/Kolkata':'Mumbai','Europe/London':'London','Europe/Paris':'Paris','Europe/Berlin':'Berlin','Europe/Moscow':'Moscow','America/New_York':'New York','America/Chicago':'Chicago','America/Denver':'Denver','America/Los_Angeles':'Los Angeles','America/Sao_Paulo':'São Paulo','Pacific/Auckland':'Auckland','Australia/Sydney':'Sydney','Africa/Cairo':'Cairo','Africa/Johannesburg':'Johannesburg','Pacific/Honolulu':'Honolulu'};
let clocks=['Asia/Shanghai','America/New_York','Europe/London','Asia/Tokyo'];
let animId=null;
function addCity(){const sel=document.getElementById('city-select');const tz=sel.value;if(clocks.includes(tz))return;if(clocks.length>=8){return}clocks.push(tz);renderClocks()}
function removeCity(tz){clocks=clocks.filter(c=>c!==tz);renderClocks()}
function renderClocks(){const grid=document.getElementById('clock-grid');grid.innerHTML='';clocks.forEach(tz=>{const name=cityNames[tz]||tz.split('/').pop();const card=document.createElement('div');card.className='clock-card';card.innerHTML=`<button class="remove-btn" onclick="removeCity('${tz}')">✕</button><div class="city-name">${name}</div><div class="digital-time" id="digital-${tz.replace(/\//g,'-')}"></div><div class="date-info" id="date-${tz.replace(/\//g,'-')}"></div><canvas class="clock-canvas" id="canvas-${tz.replace(/\//g,'-')}" width="180" height="180"></canvas><button class="btn btn-primary btn-sm copy-time-btn" onclick="copyCityTime('${tz}')">📋 Copy Time</button>`;grid.appendChild(card)});startAnimation()}
function getTimeInTZ(tz){const now=new Date();const str=now.toLocaleString('en-US',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});const parts=str.split(':');const dateStr=now.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric',weekday:'short'});return{h:parseInt(parts[0])%24,m:parseInt(parts[1]),s:parseInt(parts[2]),date:dateStr}}
function drawClock(canvasId,tz){const canvas=document.getElementById(canvasId);if(!canvas)return;const ctx=canvas.getContext('2d');const w=canvas.width,h=canvas.height;const cx=w/2,cy=h/2,r=Math.min(cx,cy)-10;const t=getTimeInTZ(tz);ctx.clearRect(0,0,w,h);
// Face
ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#1e293b';ctx.fill();ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.stroke();
// Hour marks
for(let i=0;i<12;i++){const angle=(i*30-90)*Math.PI/180;const x1=cx+Math.cos(angle)*(r-8);const y1=cy+Math.sin(angle)*(r-8);const x2=cx+Math.cos(angle)*(r-3);const y2=cy+Math.sin(angle)*(r-3);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='#94a3b8';ctx.lineWidth=i%3===0?3:1;ctx.stroke()}
// Minute marks
for(let i=0;i<60;i++){if(i%5===0)continue;const angle=(i*6-90)*Math.PI/180;const x1=cx+Math.cos(angle)*(r-4);const y1=cy+Math.sin(angle)*(r-4);const x2=cx+Math.cos(angle)*(r-2);const y2=cy+Math.sin(angle)*(r-2);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='#475569';ctx.lineWidth=1;ctx.stroke()}
// Hour hand
const hAngle=((t.h%12+t.m/60)*30-90)*Math.PI/180;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(hAngle)*(r*0.5),cy+Math.sin(hAngle)*(r*0.5));ctx.strokeStyle='#e2e8f0';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
// Minute hand
const mAngle=((t.m+t.s/60)*6-90)*Math.PI/180;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(mAngle)*(r*0.7),cy+Math.sin(mAngle)*(r*0.7));ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
// Second hand
const sAngle=(t.s*6-90)*Math.PI/180;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(sAngle)*(r*0.8),cy+Math.sin(sAngle)*(r*0.8));ctx.strokeStyle='#06b6d4';ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
// Center dot
ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#06b6d4';ctx.fill();
// Update digital
const digitalEl=document.getElementById('digital-'+tz.replace(/\//g,'-'));if(digitalEl){const hStr=String(t.h).padStart(2,'0');const mStr=String(t.m).padStart(2,'0');const sStr=String(t.s).padStart(2,'0');digitalEl.textContent=hStr+':'+mStr+':'+sStr}
const dateEl=document.getElementById('date-'+tz.replace(/\//g,'-'));if(dateEl){dateEl.textContent=t.date}}
function startAnimation(){if(animId)cancelAnimationFrame(animId);function tick(){clocks.forEach(tz=>{drawClock('canvas-'+tz.replace(/\//g,'-'),tz)});animId=requestAnimationFrame(tick)}tick()}
function showToast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#22d3ee;padding:10px 24px;border-radius:8px;border:1px solid rgba(6,182,212,.3);font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s';document.body.appendChild(t)}t.textContent=m;t.style.opacity='1';clearTimeout(window._tt);window._tt=setTimeout(()=>{t.style.opacity='0'},2000)}
function copyCityTime(tz){const t=getTimeInTZ(tz);const name=cityNames[tz]||tz;const txt=name+' '+String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0')+':'+String(t.s).padStart(2,'0')+' '+t.date;const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Copied: '+name)}catch(e){}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>showToast('Copied: '+name),fb)}else{fb()}}
window.addEventListener('load',function(){renderClocks()});
</script>
