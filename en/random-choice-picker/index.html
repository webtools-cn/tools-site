  <style>:root{--primary:#4F46E5;--primary-hover:#4338CA;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px}header nav{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:14px}main{max-width:900px;margin:0 auto;padding:32px 16px 64px;flex:1;width:100%}h1{font-size:clamp(1.5rem,4vw,2rem);word-break:break-word;margin-bottom:8px}.desc{color:var(--text-secondary);font-size:14px;margin-bottom:24px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}label{display:block;font-weight:600;margin-bottom:8px;font-size:14px}textarea{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:15px;font-family:'SF Mono','Fira Code',monospace;resize:vertical;min-height:100px}textarea:focus{outline:none;border-color:var(--primary)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}.row input[type=number]{width:80px;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:15px}.row input[type=number]:focus{outline:none;border-color:var(--primary)}.btn{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}.btn:hover{background:var(--primary-hover)}.btn-secondary{background:#e2e8f0;color:var(--text);margin-left:8px}.btn-secondary:hover{background:#cbd5e1}.result-box{background:var(--bg);padding:20px;border-radius:8px;min-height:60px;font-size:24px;text-align:center;font-weight:700;color:var(--primary);word-break:break-all;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}footer{text-align:center;padding:20px;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--border)}@media(max-width:600px){.btn{width:100%}.btn-secondary{width:100%;margin-left:0;margin-top:8px}}</style>

  <main>
    <h1>Random Choice Picker</h1>
    <p class="desc">Randomly select one or more items from a list. Perfect for raffles, decisions, and team assignments.</p>
    <div class="card">
      <label for="items">List Items (one per line)</label>
      <textarea id="items" placeholder="Item 1&#10;Item 2&#10;Item 3&#10;...">Apple&#10;Banana&#10;Orange&#10;Grape&#10;Watermelon&#10;Strawberry&#10;Blueberry&#10;Mango</textarea>
      <div class="row">
        <label>Pick Count:</label>
        <input type="number" id="count" value="1" min="1" max="100">
        <button class="btn" id="pickBtn">Pick Random</button>
      </div>
      <div class="result-box" id="result">Click button to pick randomly</div>
    </div>

  <footer><p>© 2024 Free ToolBase · Free Online Developer Tools</p></footer>
  <script>
  const itemsEl=document.getElementById('items'),countEl=document.getElementById('count'),pickBtn=document.getElementById('pickBtn'),result=document.getElementById('result'),toast=document.getElementById('toast');
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
  function pick(){const lines=itemsEl.value.split('\n').map(s=>s.trim()).filter(Boolean);if(lines.length===0){showToast('Please enter at least one item');return}let n=parseInt(countEl.value)||1;n=Math.min(n,lines.length);n=Math.max(1,n);const pool=[...lines];const picked=[];for(let i=0;i<n;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool.splice(idx,1)[0])}result.textContent=picked.join(' · ')}
  pickBtn.addEventListener('click',pick);
  </script>
