    <header>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>

    <main>
        <h1>Macro Nutrient Calculator</h1>
        <p class="subtitle">Calculate your daily protein, carb, and fat intake based on your calorie goal. Supports muscle gain, fat loss, and maintenance modes.</p>
        <div class="section">
            <h2>Calculator</h2>
            <div class="form-group">
                <label>Daily Calorie Target (kcal)</label>
                <input type="number" id="calories" placeholder="e.g. 2000" min="500" max="10000">
            </div>
            <div class="form-group">
                <label>Goal Mode</label>
                <select id="goal">
                    <option value="maintain">Maintain Weight (30/40/30)</option>
                    <option value="muscle">Muscle Gain (35/40/25)</option>
                    <option value="fatloss">Fat Loss (40/30/30)</option>
                    <option value="keto">Keto Diet (20/75/5)</option>
                    <option value="custom">Custom Ratio</option>
                </select>
            </div>
            <div class="form-group" id="customRatios" style="display:none">
                <label>Protein Ratio (%)</label>
                <input type="number" id="proteinPct" placeholder="e.g. 30" min="5" max="80" value="30">
                <label style="margin-top:8px">Carb Ratio (%)</label>
                <input type="number" id="carbPct" placeholder="e.g. 40" min="5" max="80" value="40">
                <label style="margin-top:8px">Fat Ratio (%)</label>
                <input type="number" id="fatPct" placeholder="e.g. 30" min="5" max="80" value="30">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">Calculate</button>
                <button class="btn btn-secondary" id="resetBtn">Reset</button>
            </div>
            <div class="result" id="result">
                <span class="result-label">Result:</span>
                <span id="resultValue"></span>
            </div>
        </div>
    </main>
    
<section class="related-tools" style="margin:2rem 0;padding:1rem;background:#f8fafc;border-radius:8px;"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#374151;">🔗 Related Tools</h2><div style="display:flex;flex-wrap:wrap;gap:4px;"><a href="/en/age-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:#0f172a;border-radius:6px;text-decoration:none;color:#22d3ee;font-size:14px;">Age Calculator</a><a href="/en/body-shape-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:#0f172a;border-radius:6px;text-decoration:none;color:#22d3ee;font-size:14px;">Body Shape Calculator</a><a href="/en/complaint-letter/" style="display:inline-block;padding:6px 12px;margin:4px;background:#0f172a;border-radius:6px;text-decoration:none;color:#22d3ee;font-size:14px;">Complaint Letter</a></div></section>

    <div class="toast" id="toast"></div>
    <script>
    
const toast = s => {{ const e = document.getElementById('toast'); e.textContent = s; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2000); }};
const copy = s => {{ navigator.clipboard.writeText(s).then(() => toast('Copied!')).catch(() => toast('Copy failed')); }};

const goals = {{
    maintain: [30, 40, 30],
    muscle: [35, 40, 25],
    fatloss: [40, 30, 30],
    keto: [20, 75, 5]
}};

document.getElementById('goal').addEventListener('change', function() {{
    document.getElementById('customRatios').style.display = this.value === 'custom' ? 'block' : 'none';
}});

document.getElementById('calcBtn').addEventListener('click', () => {{
    const cal = parseFloat(document.getElementById('calories').value);
    if (isNaN(cal) || cal <= 0) {{ toast('Please enter calorie target'); return; }}
    let p, c, f;
    const goal = document.getElementById('goal').value;
    if (goal === 'custom') {{
        p = parseFloat(document.getElementById('proteinPct').value);
        c = parseFloat(document.getElementById('carbPct').value);
        f = parseFloat(document.getElementById('fatPct').value);
        if (isNaN(p) || isNaN(c) || isNaN(f)) {{ toast('Please fill custom ratios'); return; }}
        if (Math.abs(p + c + f - 100) > 1) {{ toast('Ratios must sum to 100%'); return; }}
    }} else {{
        [p, c, f] = goals[goal];
    }}
    const proG = (cal * p / 100 / 4).toFixed(0);
    const carbG = (cal * c / 100 / 4).toFixed(0);
    const fatG = (cal * f / 100 / 9).toFixed(0);
    const msg = `Protein: ${{proG}}g (${{(cal*p/100).toFixed(0)}}kcal)  | Carbs: ${{carbG}}g (${{(cal*c/100).toFixed(0)}}kcal)  | Fat: ${{fatG}}g (${{(cal*f/100).toFixed(0)}}kcal)`;
    document.getElementById('resultValue').textContent = msg;
    document.getElementById('result').classList.add('show');
    document.getElementById('resultValue').onclick = () => copy(msg);
    document.getElementById('resultValue').style.cursor = 'pointer';
    document.getElementById('resultValue').title = 'Click to copy result';
}});

document.getElementById('resetBtn').addEventListener('click', () => {{
    document.getElementById('calories').value = '';
    document.getElementById('goal').value = 'maintain';
    document.getElementById('customRatios').style.display = 'none';
    document.getElementById('result').classList.remove('show');
}});

    </script>
