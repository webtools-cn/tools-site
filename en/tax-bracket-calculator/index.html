<body>
<header><h1>🧾 Tax Bracket Calculator</h1><p>Progressive income tax calculation · Salary & Bonus</p></header>
<div class="container">
  <div class="card">
    <h2>📋 Income Details</h2>
    <div class="row">
      <div class="form-group"><label>Calculation Type</label><select id="calcType"><option value="monthly">Monthly Salary</option><option value="bonus">Annual Bonus</option></select></div>
      <div class="form-group"><label>Pre-tax Income ($)</label><input type="number" id="income" value="80000" min="0"></div>
      <div class="form-group"><label>Deductions ($/mo)</label><input type="number" id="deduction" value="5000" min="0"></div>
      <div class="form-group"><label>Standard Deduction ($/mo)</label><input type="number" id="extraDeduction" value="12950" min="0"></div>
    </div>
    <button class="btn" id="calcBtn">🔍 Calculate Tax</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 Results</h2>
    <div id="results"></div>
  </div>
</div>

<script>
(function() {
  const calcBtn = document.getElementById('calcBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');

  const brackets = [
    { min: 0, max: 11000, rate: 0.10 },
    { min: 11000, max: 44725, rate: 0.12 },
    { min: 44725, max: 95375, rate: 0.22 },
    { min: 95375, max: 182100, rate: 0.24 },
    { min: 182100, max: 231250, rate: 0.32 },
    { min: 231250, max: 578125, rate: 0.35 },
    { min: 578125, max: Infinity, rate: 0.37 },
  ];

  function calcTax(amount) {
    let tax = 0;
    let remaining = amount;
    for (let i = 0; i < brackets.length - 1; i++) {
      const b = brackets[i];
      const taxable = Math.min(remaining, b.max - b.min);
      tax += taxable * b.rate;
      remaining -= taxable;
      if (remaining <= 0) break;
    }
    if (remaining > 0) tax += remaining * brackets[brackets.length-1].rate;
    return tax;
  }

  function calc() {
    const type = document.getElementById('calcType').value;
    const income = parseFloat(document.getElementById('income').value) || 0;
    const deduction = parseFloat(document.getElementById('deduction').value) || 0;
    const extraDeduction = parseFloat(document.getElementById('extraDeduction').value) || 0;
    if (!income) { resultsCard.style.display = 'none'; return; }

    const fmt = (n) => n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    let taxable, tax, afterTax;

    if (type === 'monthly') {
      taxable = Math.max(0, income - deduction - extraDeduction);
      tax = calcTax(taxable);
      afterTax = income - deduction - tax;
    } else {
      taxable = income;
      tax = calcTax(taxable);
      afterTax = income - tax;
    }

    const rate = taxable > 0 ? (tax / taxable * 100).toFixed(1) : 0;

    resultsEl.innerHTML = `
      <div class="result-box">
        <div class="result-row"><span class="label">${type==='monthly'?'Monthly Pre-tax':'Annual Bonus'}</span><span class="value">$${fmt(income)}</span></div>
        <div class="result-row"><span class="label">Deductions</span><span class="value">-$${fmt(deduction)}</span></div>
        ${type==='monthly'?`<div class="result-row"><span class="label">Standard Deduction</span><span class="value">-$${fmt(extraDeduction)}</span></div>`:''}
        <div class="result-row"><span class="label">Taxable Income</span><span class="value">$${fmt(taxable)}</span></div>
        <div class="result-row"><span class="label">Effective Tax Rate</span><span class="value">${rate}%</span></div>
        <div class="result-row"><span class="label">Tax Owed</span><span class="value" style="color:#ef4444">-$${fmt(tax)}</span></div>
        <div class="result-row"><span class="label" style="font-weight:700">Take-Home Pay</span><span class="value" style="font-size:1.2rem;color:var(--success)">$${fmt(afterTax)}</span></div>
      </div>
      <div class="highlight">
        ${type==='monthly'?`Monthly Take-Home: $${fmt(afterTax)} | Annual: $${fmt(afterTax*12)}`:`Bonus After Tax: $${fmt(afterTax)} | Tax: $${fmt(tax)}`}
      </div>
    `;
    resultsCard.style.display = 'block';
  }

  calcBtn.addEventListener('click', calc);
  document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calc));
  calc();
})();
</script>
