<script>
(function() {
  const textEl = document.getElementById('textInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const minLenEl = document.getElementById('minLen');
  const maxLenEl = document.getElementById('maxLen');
  const topNEl = document.getElementById('topN');
  const resultsCard = document.getElementById('resultsCard');
  const summaryStats = document.getElementById('summaryStats');
  const resultBody = document.getElementById('resultBody');

  function analyze() {
    const text = textEl.value.trim();
    if (!text) { resultsCard.style.display = 'none'; return; }

    const minLen = parseInt(minLenEl.value);
    const maxLen = parseInt(maxLenEl.value);
    const topN = parseInt(topNEl.value);

    if (minLen > maxLen) { showToast('Min length cannot exceed max length'); return; }

    const words = text.replace(/[^\w]/g, ' ').split(/\s+/).filter(w => w.length > 0);
    const totalWords = words.length;

    const freq = {};
    for (let i = 0; i <= words.length - minLen; i++) {
      for (let len = minLen; len <= Math.min(maxLen, words.length - i); len++) {
        const ngram = words.slice(i, i + len).join(' ').toLowerCase();
        freq[ngram] = (freq[ngram] || 0) + 1;
      }
    }

    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, topN);
    const uniqueWords = Object.keys(freq).length;

    summaryStats.innerHTML = `
      <div class="stat-box"><div class="num">${totalWords}</div><div class="lbl">Total Words</div></div>
      <div class="stat-box"><div class="num">${uniqueWords}</div><div class="lbl">Unique N-grams</div></div>
      <div class="stat-box"><div class="num">${sorted.length > 0 ? sorted[0][1] : 0}</div><div class="lbl">Max Frequency</div></div>
      <div class="stat-box"><div class="num">${sorted.length > 0 ? (sorted[0][1] / totalWords * 100).toFixed(2) : 0}%</div><div class="lbl">Max Density</div></div>
    `;

    const maxFreq = sorted.length > 0 ? sorted[0][1] : 1;
    resultBody.innerHTML = sorted.map(([word, count]) => {
      const density = (count / totalWords * 100).toFixed(2);
      const barWidth = (count / maxFreq * 100).toFixed(0);
      const cls = density > 5 ? 'high' : '';
      return `<tr class="${cls}"><td><strong>${word}</strong></td><td>${count}</td><td>${density}%</td><td><div class="bar-bg"><div class="bar-fill" style="width:${barWidth}%"></div></div></td></tr>`;
    }).join('');

    resultsCard.style.display = 'block';
  }

  analyzeBtn.addEventListener('click', analyze);
  textEl.addEventListener('input', function() { if (!textEl.value.trim()) resultsCard.style.display = 'none'; });
  analyze();
})();
</script>

<script>(function(){ // resultAddCopy var processed = new Set(); function addCopyBtns(){ var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]'); results.forEach(function(el){ if(processed.has(el)) return; if(el.querySelector('.copy-btn')) return; if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return; if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 Copy';
      btn.title = 'CopyResult';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 Copy';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
