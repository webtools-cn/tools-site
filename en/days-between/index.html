<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Days Between Dates - Free ToolBase</title>
  <meta name="description" content="Free online Days Between Dates calculator - calculate days, weeks, months and years between two dates, with weekend exclusion option.">
  <meta property="og:title" content="Days Between Dates - Free ToolBase">
  <meta property="og:description" content="Free online Days Between Dates calculator - calculate days, weeks, months and years between two dates.">
  <meta property="og:type" content="website">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Days Between Dates","applicationCategory":"UtilityApplication","operatingSystem":"Web","description":"Free online days between dates calculator"}</script>
  <style>
    :root{--primary:#4F46E5;--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}
    .lang-switch a{color:var(--sub);font-size:14px;text-decoration:none;padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
    .lang-switch a:hover{color:var(--primary);border-color:var(--primary)}
    main{flex:1;max-width:700px;margin:0 auto;padding:40px 20px;width:100%}
    h1{font-size:28px;margin-bottom:8px;text-align:center}
    .subtitle{text-align:center;color:var(--sub);margin-bottom:32px}
    .card{background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--border);margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
    .form-group input{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px}
    .form-group input:focus{outline:none;border-color:var(--primary)}
    .row{display:flex;gap:12px}.row>*{flex:1}
    label.checkbox{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
    label.checkbox input{width:auto}
    .btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600;background:var(--primary);color:#fff;transition:all .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result{background:#eef2ff;border-radius:8px;padding:20px;margin-top:20px;text-align:center}
    .result .days{font-size:36px;font-weight:700;color:var(--primary)}
    .result .detail{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.8}
    footer{text-align:center;padding:24px;color:var(--sub);font-size:13px;border-top:1px solid var(--border)}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:22px}.row{flex-direction:column}}
  </style>
</head>
<body>
<header><a href="/en/">🧰 Free ToolBase</a><div class="lang-switch"><a href="/days-between/">中文</a></div></header>
<main>
  <h1>📅 Days Between Dates</h1>
  <p class="subtitle">Calculate the exact gap between two dates</p>
  <div class="card">
    <div class="row">
      <div class="form-group"><label>📆 Start Date</label><input type="date" id="startDate"></div>
      <div class="form-group"><label>📆 End Date</label><input type="date" id="endDate"></div>
    </div>
    <label class="checkbox"><input type="checkbox" id="excludeWeekends"> Exclude weekends (business days only)</label>
    <button class="btn" id="btnCalc">🧮 Calculate Days</button>
    <div class="result" id="result" style="display:none">
      <div>Difference</div>
      <div class="days" id="daysDiff">0 days</div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</main>
<footer>© 2024 Free ToolBase · Client-side only</footer>
<script>
const today=new Date().toISOString().split('T')[0];
document.getElementById('startDate').value=today;
document.getElementById('endDate').value=today;
document.getElementById('btnCalc').addEventListener('click',()=>{
  const s=new Date(document.getElementById('startDate').value);
  const e=new Date(document.getElementById('endDate').value);
  if(isNaN(s)||isNaN(e)){alert('Please select valid dates');return}
  const exclude=document.getElementById('excludeWeekends').checked;
  let diffDays=0;
  if(exclude){
    let cur=new Date(s);
    while(cur<e){
      const dow=cur.getDay();
      if(dow!==0&&dow!==6)diffDays++;
      cur.setDate(cur.getDate()+1);
    }
  }else{
    diffDays=Math.round((e-s)/(1000*60*60*24));
  }
  const weeks=(diffDays/7).toFixed(1);
  const months=(diffDays/30.44).toFixed(1);
  const years=(diffDays/365.25).toFixed(2);
  document.getElementById('daysDiff').textContent=diffDays+' days';
  document.getElementById('detail').innerHTML=`~${weeks} weeks | ~${months} months | ~${years} years${exclude?' (business days)':''}`;
  document.getElementById('result').style.display='block';
});
</script>
</body>
</html>
