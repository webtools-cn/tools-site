  <header>
    <a href="/en/" class="logo">Free ToolBase</a>

  <main>
    <h1>Body Measurement Calculator</h1>
    <p class="subtitle">BMI, waist-hip ratio, ideal weight, BSA, BMR all-in-one calculator</p>
    <div class="tool-area">
      <div class="row">
        <div><label for="height">Height (cm)</label><input type="number" id="height" placeholder="170" min="50" max="250" step="0.1"></div>
        <div><label for="weight">Weight (kg)</label><input type="number" id="weight" placeholder="65" min="20" max="300" step="0.1"></div>
      </div>
      <div class="row">
        <div><label for="waist">Waist (cm)</label><input type="number" id="waist" placeholder="80" min="30" max="200" step="0.1"></div>
        <div><label for="hip">Hip (cm)</label><input type="number" id="hip" placeholder="95" min="30" max="200" step="0.1"></div>
      </div>
      <div class="row">
        <div><label for="gender">Gender</label>
          <select id="gender"><option value="male">Male</option><option value="female">Female</option></select>
        </div>
        <div><label for="age">Age</label><input type="number" id="age" placeholder="25" min="1" max="120"></div>
      </div>
      <button class="btn" id="calcBtn">Calculate All</button>
      <div id="bodyResult" class="output"></div>
      <script>
      document.getElementById('calcBtn').addEventListener('click', function() {
        var h = parseFloat(document.getElementById('height').value);
        var w = parseFloat(document.getElementById('weight').value);
        var waist = parseFloat(document.getElementById('waist').value);
        var hip = parseFloat(document.getElementById('hip').value);
        var gender = document.getElementById('gender').value;
        var age = parseInt(document.getElementById('age').value);
        if (!h || !w) { showToast('Enter height and weight'); return; }
        var bmi = w / ((h/100) * (h/100));
        var bmiCat = bmi < 18.5 ? 'Underweight' : bmi < 24 ? 'Normal' : bmi < 28 ? 'Overweight' : 'Obese';
        var idealW = gender === 'male' ? (h - 100) * 0.9 : (h - 100) * 0.85;
        var whr = waist && hip ? waist / hip : null;
        var whrRisk = '';
        if (whr) { whrRisk = (gender === 'male' ? (whr > 0.9 ? 'High Risk' : 'Normal') : (whr > 0.85 ? 'High Risk' : 'Normal')); }
        var bsa = Math.sqrt((h * w) / 3600);
        var bmr = gender === 'male' ? (10 * w + 6.25 * h - 5 * age + 5) : (10 * w + 6.25 * h - 5 * age - 161);
        var html = '<div style="background:#fff;padding:20px;border-radius:8px;border:1px solid #e2e8f0">';
        html += '<div class="result-item"><strong>BMI:</strong> ' + bmi.toFixed(1) + ' (' + bmiCat + ')</div>';
        html += '<div class="result-item"><strong>Ideal Weight:</strong> ' + idealW.toFixed(1) + ' kg</div>';
        if (whr) html += '<div class="result-item"><strong>Waist-Hip Ratio:</strong> ' + whr.toFixed(2) + ' (' + whrRisk + ')</div>';
        html += '<div class="result-item"><strong>Body Surface Area:</strong> ' + bsa.toFixed(2) + ' m\u00b2</div>';
        html += '<div class="result-item"><strong>BMR (Basal Metabolic Rate):</strong> ' + Math.round(bmr) + ' kcal/day</div>';
        html += '</div>';
        document.getElementById('bodyResult').innerHTML = html;
      });
      </script>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('Copied!')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  }
  </script>
