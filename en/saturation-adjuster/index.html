<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Saturation Adjuster - Free ToolBase</title>
  <meta name="description" content="Online image saturation adjustment tool. Upload, adjust from grayscale to vivid. Slider control, download result.">
  <meta property="og:title" content="Adjust Image Saturation Online - Free ToolBase">
  <meta property="og:description" content="Online image saturation adjustment tool. Upload, adjust from grayscale to vivid. Slider control, download result.">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name": "Image Saturation Adjuster","applicationCategory":"MultimediaApplication","operatingSystem":"Any","description": "Online image saturation adjustment tool. Upload, adjust from grayscale to vivid. Slider control, download result."}</script>
  <style>
    :root { --primary: #4F46E5; --bg: #f8fafc; --card: #fff; --text: #1e293b; --text2: #64748b; --border: #e2e8f0; --radius: 12px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--primary); color: #fff; padding: 16px 24px; text-align: center; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 24px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 16px; }
    .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); }
    .upload-zone p { color: var(--text2); font-size: 14px; }
    .upload-zone input { display: none; }
    .preview-area { text-align: center; display: none; }
    .preview-area canvas { max-width: 100%; max-height: 400px; border-radius: 8px; }
    .controls { display: none; margin-top: 16px; }
    .slider-group { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .slider-group label { font-size: 14px; font-weight: 600; min-width: 56px; }
    .slider-group input[type="range"] { flex: 1; }
    .slider-group .value { font-size: 14px; color: var(--text2); min-width: 40px; text-align: right; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; }
    .btn:hover { opacity: .9; }
    .btn-reset { background: #fff; color: var(--primary); border: 1px solid var(--primary); margin-left: 8px; }
    .btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    @media (max-width: 375px) { main { padding: 16px 12px; } .upload-zone { padding: 24px; } }
  </style>
</head>
<body>
<header><a href="/">Free ToolBase</a></header>
<main>
  <h1>Image Saturation Adjuster</h1>
  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <p>📁 点击或拖拽上传图片</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="preview-area" id="previewArea">
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls" id="controls">
      <div class="slider-group">
        <label>饱和度</label>
        <input type="range" id="saturate" min="-100" max="200" value="0">
        <span class="value" id="saturateVal">0</span>
      </div>
      <div class="btn-row">
        <button class="btn" id="downloadBtn">📥 下载图片</button>
        <button class="btn btn-reset" id="resetBtn">↺ 重置</button>
      </div>
    </div>
  </div>
</main>
<footer style="text-align:center;padding:16px;color:var(--text2);font-size:12px">Free ToolBase © 2025</footer>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:9999"></div>
<script>
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const previewArea = document.getElementById('previewArea');
const canvas = document.getElementById('canvas');
const controls = document.getElementById('controls');
const saturateSlider = document.getElementById('saturate');
const saturateVal = document.getElementById('saturateVal');
const ctx = canvas.getContext('2d');

let originalImage = null;
let currentSaturate = 0;

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
});
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadImage(file);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      originalImage = img;
      const maxW = 700, maxH = 400;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      canvas.width = w;
      canvas.height = h;
      currentSaturate = 0;
      saturateSlider.value = 0;
      saturateVal.textContent = '0';
      applyFilter();
      previewArea.style.display = 'block';
      controls.style.display = 'block';
      uploadZone.style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyFilter() {
  if (!originalImage) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const s = currentSaturate / 100;
  ctx.filter = 'saturate(' + (1 + s) + ')';
  ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';
}

saturateSlider.addEventListener('input', function() {
  currentSaturate = parseInt(this.value);
  saturateVal.textContent = currentSaturate;
  applyFilter();
});

document.getElementById('resetBtn').addEventListener('click', function() {
  currentSaturate = 0;
  saturateSlider.value = 0;
  saturateVal.textContent = '0';
  applyFilter();
  showToast('已重置');
});

document.getElementById('downloadBtn').addEventListener('click', function() {
  const link = document.createElement('a');
  link.download = 'saturation-adjusted.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('下载中...');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}
</script>
</body>
</html>
