<main>
 <h1>D-Day Counter</h1>
 <div class="card">
 <div class="mode-toggle" id="modeToggle">
 <div class="mode-btn active" data-mode="countdown">⏳ countwhen</div>
 <div class="mode-btn" data-mode="countup">📆 normalcountwhen</div>
 </div>
 <label for="titleInput">eventname（optional）</label>
 <input type="text" id="titleInput" placeholder="examplesuch as： day、 、 row...">
 <label for="dateInput">targetDate</label>
 <input type="date" id="dateInput">
 <div class="presets" id="presets">
 <span class="preset" data-days="1">tomorrow</span>
 <span class="preset" data-days="7"> weekafter</span>
 <span class="preset" data-days="30">30dayafter</span>
 <span class="preset" data-days="100">100dayafter</span>
 <span class="preset" data-days="365"> yearafter</span>
 </div>
 <button class="btn" id="calcBtn">Calculate countwhen</button>
 </div>
 <div class="card result" id="result" style="display:none">
 <div class="days" id="daysNum">0</div>
 <div class="label" id="daysLabel">day</div>

 </div>

<script>
const dateInput = document.getElementById('dateInput');
const titleInput = document.getElementById('titleInput');
const calcBtn = document.getElementById('calcBtn');
const result = document.getElementById('result');
const daysNum = document.getElementById('daysNum');
const daysLabel = document.getElementById('daysLabel');
const detail = document.getElementById('detail');
const modeToggle = document.getElementById('modeToggle');
const presets = document.getElementById('presets');

let mode = 'countdown';
let timer = null;

// Set today as default
const today = new Date().toISOString().split('T')[0];
dateInput.value = today;

// Mode toggle
modeToggle.addEventListener('click', function(e) {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  if (dateInput.value) calculate();
});

// Presets
presets.addEventListener('click', function(e) {
  const p = e.target.closest('.preset');
  if (!p) return;
  const days = parseInt(p.dataset.days);
  const d = new Date();
  d.setDate(d.getDate() + days);
  dateInput.value = d.toISOString().split('T')[0];
  calculate();
});

// Calculate
calcBtn.addEventListener('click', calculate);

function calculate() {
  if (!dateInput.value) return;
  if (timer) clearInterval(timer);

  const target = new Date(dateInput.value + 'T00:00:00');
  const title = titleInput.value || 'targetDate';

  function update() {
    const now = new Date();
    const diffMs = mode === 'countdown' ? target - now : now - target;
    const diffDaysTotal = diffMs / (1000 * 60 * 60 * 24);
    const absDays = Math.abs(Math.floor(diffDaysTotal));

    daysNum.textContent = absDays;
    if (mode === 'countdown') {
      daysLabel.textContent = diffMs > 0 ? 'dayafter' : 'daybefore（Alreadythrough）';
    } else {
      daysLabel.textContent = diffMs > 0 ? 'day' : 'dayafter''countdown' ? (diffMs > 0 ? '' : 'Alreadythroughgo') : (diffMs > 0 ? 'Alreadythroughgo' : '');
    document.title = `${prefix} ${absDays} day - ${title}`;
  }

  update();
  result.style.display = 'block';
  timer = setInterval(update, 1000);
}

// Auto-calc on date change
dateInput.addEventListener('change', calculate);
if (dateInput.value) calculate();
</script>
