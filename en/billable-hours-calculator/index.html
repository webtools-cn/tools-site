<body>
<div class="container">
<div class="header"><h1>⏱️ Billable Hours Calculator</h1><div class="lang-switch"><a href="../../billable-hours-calculator/">Chinese</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Billable Hours Calculator</p>
<div class="hero"><p>Quickly estimate hourly billing income. Enter your rate and daily hours to see daily, weekly, monthly, and annual revenue projections. Compare multiple rate scenarios.</p><span class="badge">Zero Dependencies · Works Offline</span></div>
<div class="ad-slot"></div>
<div class="calculator-section">
  <h2>🔢 Input Parameters</h2>
  <div class="input-grid">
    <div class="input-group"><label for="hourlyRate">Hourly Rate ($)</label><input type="number" id="hourlyRate" value="150" min="0" step="1"><div class="hint">Your standard billing rate</div></div>
    <div class="input-group"><label for="hoursPerDay">Billable Hours per Day</label><input type="number" id="hoursPerDay" value="6" min="0" max="16" step="0.5"><div class="hint">Actual billable time after breaks/admin</div></div>
    <div class="input-group"><label for="daysPerWeek">Working Days per Week</label><input type="number" id="daysPerWeek" value="5" min="1" max="7" step="1"><div class="hint">Days actually working for clients</div></div>
    <div class="input-group"><label for="weeksPerYear">Working Weeks per Year</label><input type="number" id="weeksPerYear" value="48" min="1" max="52" step="1"><div class="hint">After vacation/training/sick leave</div></div>
    <div class="input-group"><label for="nonBillablePct">Non-Billable Time (%)</label><input type="number" id="nonBillablePct" value="25" min="0" max="80" step="1"><div class="hint">Admin/marketing/learning time</div></div>
    <div class="input-group"><label for="targetHours">Target Annual Billable Hours</label><input type="number" id="targetHours" value="1800" min="0" step="100"><div class="hint">Common law firm annual target</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn">🔍 Calculate</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-secondary" id="copyBtn">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">📅 Daily Income</div><div class="value" id="dailyIncome">-</div><div class="sub">Per day billable income</div></div>
  <div class="result-card"><div class="label">📆 Weekly Income</div><div class="value" id="weeklyIncome">-</div><div class="sub">Per week billable income</div></div>
  <div class="result-card"><div class="label">📊 Monthly Income</div><div class="value" id="monthlyIncome">-</div><div class="sub">Average monthly income</div></div>
  <div class="result-card"><div class="label">💰 Annual Income</div><div class="value" id="annualIncome">-</div><div class="sub">Estimated annual billable income</div></div>
  <div class="result-card"><div class="label">📈 Annual Billable Hours</div><div class="value" id="annualHours">-</div><div class="sub">Actual billable hours</div></div>
  <div class="result-card"><div class="label">🎯 Target Achievement</div><div class="value" id="targetRate">-</div><div class="sub">vs target annual hours</div></div>
</div>
<div class="info-section">
  <h2>📖 Billable Hours Management</h2>
  <h3>Billable vs Non-Billable</h3>
  <p>Billable: time directly working for clients. Non-billable: admin, emails, training, marketing, lunch, commuting. Top performers maintain 70-80% billable rate.</p>
  <h3>Industry Standards</h3>
  <p>Big Law: 1800-2200 hrs/yr (~36-44/week) | Mid-size: 1500-1800 | Consulting: 1400-1700 | Freelance: 1200-1600</p>
  <h3>Efficiency Tips</h3>
  <p>Use time-tracking software for every task; batch non-billable activities; set daily billable hour targets; regularly analyze time allocation.</p>
</div>

  <p>© 2024 Free ToolBase · <a href="../about/">About</a> · <a href="../index.html">All Tools</a></p>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  const rate=+$('hourlyRate').value||0;
  const hpd=+$('hoursPerDay').value||0;
  const dpw=+$('daysPerWeek').value||0;
  const wpy=+$('weeksPerYear').value||0;
  const nonPct=(+$('nonBillablePct').value||0)/100;
  const target=+$('targetHours').value||0;
  const daily=hpd*rate;
  const weekly=daily*dpw;
  const annualHours=hpd*dpw*wpy*(1-nonPct);
  const annualIncome=annualHours*rate;
  const monthlyIncome=annualIncome/12;
  const targetAchievement=target>0?(annualHours/target*100):0;
  $('dailyIncome').textContent=fmt(daily);
  $('weeklyIncome').textContent=fmt(weekly);
  $('monthlyIncome').textContent=fmt(monthlyIncome);
  $('annualIncome').textContent=fmt(annualIncome);
  $('annualHours').textContent=Math.round(annualHours)+' hrs';
  $('targetRate').textContent=targetAchievement.toFixed(1)+'%';
}
function reset(){
  $('hourlyRate').value=150;$('hoursPerDay').value=6;$('daysPerWeek').value=5;
  $('weeksPerYear').value=48;$('nonBillablePct').value=25;$('targetHours').value=1800;
  ['dailyIncome','weeklyIncome','monthlyIncome','annualIncome','annualHours','targetRate'].forEach(function(id){$(id).textContent='-';});
}
function copyResult(){
  const lines=['=== Billable Hours Income ===',
    'Daily: '+$('dailyIncome').textContent,
    'Weekly: '+$('weeklyIncome').textContent,
    'Monthly: '+$('monthlyIncome').textContent,
    'Annual: '+$('annualIncome').textContent,
    'Annual Hours: '+$('annualHours').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'));
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
