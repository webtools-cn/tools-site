<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
var DIGITS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function convert(num, fromBase, toBase){
  try {
    var dec = parseInt(num, fromBase);
    if (isNaN(dec)) return 'Invalid input';
    if (dec < 0) { dec = Math.abs(dec); return '-' + dec.toString(toBase).toUpperCase(); }
    return dec.toString(toBase).toUpperCase();
  } catch(e) { return 'Error'; }
}
function updateAll(){
  var num = document.getElementById('numInput').value.trim();
  var base = parseInt(document.getElementById('inputBase').value) || 10;
  if (!num) { document.querySelectorAll('.value').forEach(function(el){el.textContent='-'}); return; }
  var bases = [2,8,10,16,32,36];
  bases.forEach(function(b){
    document.getElementById('r'+b).textContent = convert(num, base, b);
  });
}
document.getElementById('numInput').addEventListener('input', updateAll);
document.getElementById('inputBase').addEventListener('change', updateAll);
</script>
