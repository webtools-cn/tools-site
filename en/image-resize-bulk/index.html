  <header>
    <a href="/en/" class="logo">Free ToolBase</a>

  <main>
    <h1>Bulk Image Resizer</h1>
    <p class="subtitle">Resize multiple images at once, percentage or pixel scaling, private & client-side</p>
    <div class="tool-area">
      <label for="imageInput">Select Images</label>
      <input type="file" id="imageInput" accept="image/*" multiple>
      <div class="row">
        <div><label for="resizeMode">Mode</label>
          <select id="resizeMode">
            <option value="percent">Percentage</option>
            <option value="width">Fixed Width</option>
            <option value="height">Fixed Height</option>
            <option value="max">Max Dimension</option>
          </select>
        </div>
        <div><label for="resizeValue">Value</label><input type="number" id="resizeValue" value="50" min="1"></div>
      </div>
      <div class="row">
        <button class="btn" id="resizeBtn">Resize All</button>
        <button class="btn btn-secondary" id="downloadAllBtn">Download All</button>
      </div>
      <div id="previewArea" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px"></div>
      <script>
      var resizedImages = [];
      document.getElementById('resizeBtn').addEventListener('click', function() {
        var files = document.getElementById('imageInput').files;
        if (!files.length) { showToast('Please select images first'); return; }
        var mode = document.getElementById('resizeMode').value;
        var val = parseFloat(document.getElementById('resizeValue').value);
        resizedImages = [];
        var preview = document.getElementById('previewArea');
        preview.innerHTML = '';
        var count = 0;
        Array.from(files).forEach(function(file, i) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
              var c = document.createElement('canvas');
              var w = img.width, h = img.height;
              if (mode === 'percent') { w *= val/100; h *= val/100; }
              else if (mode === 'width') { h = h * (val/w); w = val; }
              else if (mode === 'height') { w = w * (val/h); h = val; }
              else if (mode === 'max') {
                if (w > h) { if (w > val) { h = h*(val/w); w = val; } }
                else { if (h > val) { w = w*(val/h); h = val; } }
              }
              c.width = Math.round(w); c.height = Math.round(h);
              var ctx2 = c.getContext('2d');
              ctx2.drawImage(img, 0, 0, c.width, c.height);
              resizedImages.push({name:file.name, canvas:c});
              var wrapper = document.createElement('div');
              wrapper.style.cssText = 'text-align:center;width:140px';
              var thumb = document.createElement('canvas');
              thumb.width = 120;
              thumb.height = 120 * (c.height/c.width) || 120;
              var tctx = thumb.getContext('2d');
              tctx.drawImage(c, 0, 0, thumb.width, thumb.height);
              wrapper.appendChild(thumb);
              var label = document.createElement('div');
              label.textContent = Math.round(c.width) + 'x' + Math.round(c.height);
              label.style.cssText = 'font-size:.75rem;margin-top:4px;color:#666';
              wrapper.appendChild(label);
              preview.appendChild(wrapper);
              count++;
              if (count === files.length) showToast(count + ' images resized');
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      });
      document.getElementById('downloadAllBtn').addEventListener('click', function() {
        if (!resizedImages.length) { showToast('Resize images first'); return; }
        resizedImages.forEach(function(item) {
          var link = document.createElement('a');
          link.download = 'resized_' + item.name;
          link.href = item.canvas.toDataURL('image/png');
          link.click();
        });
        showToast(resizedImages.length + ' downloaded');
      });
      </script>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')}, 2000);
  }
  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){showToast('Copied!')});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  }
  </script>
