<body>
<div class="container">
<div class="header"><h1>🔥 Calorie Burn Calculator</h1><div class="lang-switch"><a href="../../calorie-burn-calculator/" class="">中文</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Calorie Burn Calculator</p>
<div class="hero"><p>Select an activity, enter your weight and duration to calculate calories burned. Based on MET (Metabolic Equivalent of Task) standards, supporting 60+ activities.</p><span class="badge">Zero Dependency · Works Offline</span></div>
<div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5998441792679372" data-ad-slot="9876543210" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
<div class="calculator-section">
  <h2>🔢 Your Information</h2>
  <div class="met-search"><input type="text" id="metSearch" placeholder="🔍 Search activities (e.g., running, swimming, yoga...)" oninput="filterMet()"></div>
  <div class="input-grid">
    <div class="input-group"><label for="activity">Activity</label><select id="activity" size="8" style="height:auto;overflow-y:auto;"></select><div class="hint">Select the activity to calculate</div></div>
    <div>
      <div class="input-group"><label for="weight">Weight (kg)</label><input type="number" id="weight" value="70" min="30" max="200" step="0.1"><div class="hint">Your weight in kilograms</div></div>
      <div class="input-group"><label for="duration">Duration (minutes)</label><input type="number" id="duration" value="30" min="1" max="600" step="1"><div class="hint">Exercise duration</div></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()" id="calcBtn">🔥 Calculate Calories</button>
    <button class="btn btn-secondary" onclick="copyResult()" id="copyBtn" style="display:none">📋 Copy Results</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Reset</button>
  </div>
</div>
<div class="calculator-section" id="resultSection" style="display:none">
  <h2>📈 Results</h2>
  <div class="results-grid">
    <div class="result-card highlight"><div class="label">Calories Burned</div><div class="value" id="calories">0 kcal</div><div class="sub">Total burned</div></div>
    <div class="result-card"><div class="label">Per Minute</div><div class="value" id="perMin">0 kcal</div><div class="sub">Burned per minute</div></div>
    <div class="result-card"><div class="label">MET Value</div><div class="value" id="metVal">0</div><div class="sub">Metabolic equivalent</div></div>
  </div>
  <div class="breakdown">
    <h3>📊 Detailed Breakdown</h3>
    <div class="item"><span>Activity</span><span class="val" id="detailActivity">-</span></div>
    <div class="item"><span>MET Value</span><span class="val" id="detailMET">-</span></div>
    <div class="item"><span>Weight</span><span class="val" id="detailWeight">-</span></div>
    <div class="item"><span>Duration</span><span class="val" id="detailDuration">-</span></div>
    <div class="item"><span style="font-weight:600;color:#22d3ee">Total Calories Burned</span><span class="val" style="font-weight:600;color:#22d3ee" id="detailTotal">-</span></div>
  </div>
</div>
<div class="footer"><p>© 2024 Free ToolBase · <a href="../about/">About</a> · <a href="../privacy/">Privacy</a></p><p style="font-size:.75rem;margin-top:8px">All calculations are performed in your browser. Your health data is never uploaded.</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
var activities = [
  { name: 'Running (5 mph / 8 km/h)', met: 8.3 }, { name: 'Running (6.2 mph / 10 km/h)', met: 10.0 }, { name: 'Running (7.5 mph / 12 km/h)', met: 12.5 },
  { name: 'Jogging (3.7 mph / 6 km/h)', met: 6.0 }, { name: 'Brisk Walking (4 mph / 6.5 km/h)', met: 5.0 }, { name: 'Walking (2.5 mph / 4 km/h)', met: 3.5 },
  { name: 'Stair Climbing', met: 8.0 }, { name: 'Jumping Rope (Slow)', met: 8.8 }, { name: 'Jumping Rope (Fast)', met: 12.3 },
  { name: 'Cycling (10-12 mph)', met: 6.8 }, { name: 'Cycling (12-14 mph)', met: 8.0 }, { name: 'Cycling (14-16 mph)', met: 10.0 },
  { name: 'Swimming (Freestyle, Slow)', met: 5.8 }, { name: 'Swimming (Breaststroke)', met: 7.0 }, { name: 'Swimming (Butterfly)', met: 13.8 },
  { name: 'Yoga (Hatha)', met: 3.0 }, { name: 'Yoga (Power)', met: 4.0 }, { name: 'Pilates', met: 3.5 },
  { name: 'Weightlifting (Moderate)', met: 4.0 }, { name: 'Weightlifting (Intense)', met: 6.0 }, { name: 'Push-ups/Sit-ups', met: 8.0 },
  { name: 'Basketball (Game)', met: 8.0 }, { name: 'Basketball (Shooting)', met: 4.5 }, { name: 'Soccer (Game)', met: 10.0 },
  { name: 'Soccer (Practice)', met: 7.0 }, { name: 'Badminton', met: 5.5 }, { name: 'Table Tennis', met: 4.0 },
  { name: 'Tennis (Singles)', met: 8.0 }, { name: 'Tennis (Doubles)', met: 6.0 }, { name: 'Volleyball', met: 4.0 },
  { name: 'Golf (Walking)', met: 4.8 }, { name: 'Golf (Cart)', met: 3.5 }, { name: 'Bowling', met: 3.0 },
  { name: 'Skiing (Downhill)', met: 7.0 }, { name: 'Skiing (Cross-country)', met: 9.0 }, { name: 'Ice Skating', met: 7.0 },
  { name: 'Rock Climbing', met: 8.8 }, { name: 'Hiking (Incline)', met: 6.5 }, { name: 'Martial Arts (Judo/Karate)', met: 10.3 },
  { name: 'Boxing (Heavy Bag)', met: 5.5 }, { name: 'Boxing (Sparring)', met: 10.0 }, { name: 'Aerobics', met: 7.3 },
  { name: 'Aerobics (High Impact)', met: 10.0 }, { name: 'Spinning', met: 8.5 }, { name: 'HIIT Training', met: 12.0 },
  { name: 'Rowing Machine (Moderate)', met: 7.0 }, { name: 'Rowing Machine (Intense)', met: 12.0 }, { name: 'Elliptical', met: 5.0 },
  { name: 'Stair Stepper', met: 5.5 }, { name: 'Housework (Cleaning)', met: 3.3 }, { name: 'Gardening', met: 4.0 },
  { name: 'Moving / Heavy Lifting', met: 6.0 }, { name: 'Tai Chi', met: 3.0 }, { name: 'Dance (Ballroom)', met: 4.5 },
  { name: 'Dance (Hip Hop)', met: 6.5 }, { name: 'Dance (Ballet)', met: 6.0 }
];

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function populateSelect(filter) {
  var sel = document.getElementById('activity');
  sel.innerHTML = '';
  var f = (filter || '').toLowerCase();
  activities.forEach(function(a, i){
    if (!f || a.name.toLowerCase().indexOf(f) >= 0) {
      var opt = document.createElement('option');
      opt.value = i; opt.textContent = a.name + ' (MET ' + a.met + ')';
      sel.appendChild(opt);
    }
  });
  if (sel.options.length === 0) {
    var opt = document.createElement('option');
    opt.disabled = true; opt.textContent = 'No matching activities found';
    sel.appendChild(opt);
  }
  if (sel.options.length > 0) sel.selectedIndex = 0;
}

function filterMet() {
  var q = document.getElementById('metSearch').value;
  populateSelect(q);
}

function calculate() {
  var sel = document.getElementById('activity');
  if (sel.selectedIndex < 0 || !sel.options[sel.selectedIndex].value) { showToast('Please select an activity'); return; }
  var idx = parseInt(sel.options[sel.selectedIndex].value);
  var act = activities[idx];
  var weight = parseFloat(document.getElementById('weight').value) || 0;
  var duration = parseFloat(document.getElementById('duration').value) || 0;

  if (weight < 30 || weight > 200) { showToast('Weight must be between 30-200 kg'); return; }
  if (duration < 1 || duration > 600) { showToast('Duration must be between 1-600 minutes'); return; }

  var calories = (act.met * weight * 3.5 / 200) * duration;
  var perMin = calories / duration;

  document.getElementById('calories').textContent = Math.round(calories) + ' kcal';
  document.getElementById('perMin').textContent = perMin.toFixed(1) + ' kcal';
  document.getElementById('metVal').textContent = act.met;
  document.getElementById('detailActivity').textContent = act.name;
  document.getElementById('detailMET').textContent = act.met + ' MET';
  document.getElementById('detailWeight').textContent = weight + ' kg';
  document.getElementById('detailDuration').textContent = duration + ' min';
  document.getElementById('detailTotal').textContent = Math.round(calories) + ' kcal';
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  var lines = ['Calorie Burn Calculation Results', '---'];
  var items = document.querySelectorAll('#resultSection .item');
  items.forEach(function(i){
    lines.push(i.children[0].textContent + ': ' + i.children[1].textContent);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    showToast('✅ Copied to clipboard');
  }, function(){
    showToast('❌ Copy failed, please select manually');
  });
}

function clearAll() {
  document.getElementById('weight').value = '70';
  document.getElementById('duration').value = '30';
  document.getElementById('metSearch').value = '';
  populateSelect('');
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  showToast('Reset complete');
}

populateSelect('');
</script>
