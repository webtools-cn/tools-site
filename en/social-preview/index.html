<body>
<header>
  <a href="/en/">🏠 Free ToolBase</a>
  <span>Social Preview</span>
</header>
<div class="container">
  <h1>🔗 Social Share Previewer</h1>
  <p class="subtitle">Enter a URL to preview how it appears on Twitter, Facebook, and detect Open Graph metadata</p>

  <div class="input-row">
    <input type="url" id="urlInput" placeholder="Enter webpage URL, e.g., https://example.com" value="https://free-toolbase.com">
    <button class="btn" id="fetchBtn">🔍 Detect & Preview</button>
  </div>

  <div class="previews" id="previews" style="display:none;">
    <div class="preview-card">
      <h3><span class="icon">🐦</span> Twitter / X</h3>
      <div class="twitter-preview">
        <div class="card-img" id="twImg"></div>
        <div class="card-title" id="twTitle"></div>
        <div class="card-desc" id="twDesc"></div>
        <div class="card-url" id="twUrl"></div>
      </div>
    </div>
    <div class="preview-card">
      <h3><span class="icon">📘</span> Facebook</h3>
      <div class="fb-preview">
        <div class="fb-img" id="fbImg"></div>
        <div class="fb-body">
          <div class="fb-url" id="fbUrl"></div>
          <div class="fb-title" id="fbTitle"></div>
          <div class="fb-desc" id="fbDesc"></div>
        </div>
      </div>
    </div>
  </div>

  <table class="meta-table" id="metaTable" style="display:none;">
    <thead><tr><th>Meta Tag</th><th>Content</th><th>Status</th></tr></thead>
    <tbody id="metaBody"></tbody>
  </table>
</div>
<div class="toast" id="toast"></div>
<footer>
  <p>&copy; 2026 <a href="/en/">Free ToolBase</a> · All processing happens locally in your browser</p>
</footer>
<script>
(function(){
  const urlInput = document.getElementById('urlInput');
  const fetchBtn = document.getElementById('fetchBtn');
  const previews = document.getElementById('previews');
  const metaTable = document.getElementById('metaTable');
  const metaBody = document.getElementById('metaBody');
  const toastEl = document.getElementById('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  async function fetchMeta() {
    const url = urlInput.value.trim();
    if (!url) { showToast('Please enter a URL'); return; }
    try { new URL(url); } catch(e) { showToast('Please enter a valid URL'); return; }

    showToast('⏳ Fetching page metadata...');
    fetchBtn.disabled = true;

    try {
      const resp = await fetch(url, {mode: 'cors', redirect: 'follow'});
      if (!resp.ok && resp.status !== 0) {
        showToast('⚠️ Cannot fetch page (CORS may block). Using manual mode.');
        showManualFallback();
        fetchBtn.disabled = false;
        return;
      }
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      renderMeta(doc, url);
    } catch(e) {
      showToast('⚠️ Cannot auto-detect due to CORS. Using manual mode.');
      showManualFallback();
    }
    fetchBtn.disabled = false;
  }

  function showManualFallback() {
    const url = urlInput.value;
    const meta = {
      'og:title': 'Free ToolBase - Free Online Tools',
      'og:description': '2500+ free online tools',
      'og:image': '',
      'og:url': url,
      'twitter:card': 'summary_large_image',
      'twitter:title': 'Free ToolBase',
      'twitter:description': '2500+ free online tools',
      'twitter:image': ''
    };
    renderFromData(meta, url);
  }

  function renderMeta(doc, url) {
    const metaTags = doc.querySelectorAll('meta[property], meta[name]');
    const og = {}, twitter = {};
    let title = doc.querySelector('title')?.textContent || '';
    let desc = '';

    metaTags.forEach(m => {
      const prop = m.getAttribute('property') || m.getAttribute('name');
      const content = m.getAttribute('content') || '';
      if (prop && prop.startsWith('og:')) og[prop] = content;
      if (prop && prop.startsWith('twitter:')) twitter[prop] = content;
      if (prop === 'description' && !desc) desc = content;
    });

    if (!og['og:title']) og['og:title'] = title;
    if (!og['og:description']) og['og:description'] = desc;
    if (!og['og:url']) og['og:url'] = url;

    const data = { ...og };
    for (const [k, v] of Object.entries(twitter)) data[k] = v;

    renderFromData(data, url);

    metaBody.innerHTML = '';
    const checkList = ['og:title','og:description','og:image','og:url','og:type','twitter:card','twitter:title','twitter:description','twitter:image'];
    checkList.forEach(key => {
      const val = data[key] || '';
      const status = val ? '<span class="status-badge status-ok">✓ Set</span>' : '<span class="status-badge status-missing">⚠ Missing</span>';
      metaBody.innerHTML += `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(val || '—')}</td><td>${status}</td></tr>`;
    });
    metaTable.style.display = '';
  }

  function renderFromData(data, url) {
    const ogTitle = data['og:title'] || data['twitter:title'] || '';
    const ogDesc = data['og:description'] || data['twitter:description'] || '';
    const ogImage = data['og:image'] || data['twitter:image'] || '';
    const twCard = data['twitter:card'] || 'summary';

    document.getElementById('twTitle').textContent = ogTitle || '(No Title)';
    document.getElementById('twDesc').textContent = ogDesc || '(No Description)';
    document.getElementById('twUrl').textContent = url;

    const twImg = document.getElementById('twImg');
    if (ogImage) {
      twImg.innerHTML = `<img src="${escapeHtml(ogImage)}" alt="OG Image" onerror="this.parentElement.textContent='Image load failed'">`;
    } else {
      twImg.innerHTML = twCard === 'summary_large_image' ? '📷 Large Image Card (no image)' : '📝 Summary Card';
    }

    document.getElementById('fbTitle').textContent = ogTitle || '(No Title)';
    document.getElementById('fbDesc').textContent = ogDesc || '(No Description)';
    try { document.getElementById('fbUrl').textContent = new URL(url).hostname.toUpperCase(); } catch(e) { document.getElementById('fbUrl').textContent = url; }

    const fbImg = document.getElementById('fbImg');
    if (ogImage) {
      fbImg.innerHTML = `<img src="${escapeHtml(ogImage)}" alt="OG Image" onerror="this.parentElement.textContent='Image load failed'">`;
    } else {
      fbImg.textContent = '📷 No OG Image';
    }

    previews.style.display = 'flex';
  }

  fetchBtn.addEventListener('click', fetchMeta);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fetchMeta();
  });
})();
</script>
</body>
