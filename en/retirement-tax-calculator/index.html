  <p>Single: 10%($0-$11,600) | 12%($11,601-$47,150) | 22%($47,151-$100,525) | 24%($100,526-$191,950) | 32%($191,951-$243,725) | 35%($243,726-$609,350) | 37%($609,351+)</p>

<script>
(function(){
const $=s=>document.getElementById(s);
const filingStatus=$('filingStatus'),tradWithdrawal=$('tradWithdrawal'),
socialSecurity=$('socialSecurity'),pensionIncome=$('pensionIncome'),
otherIncome=$('otherIncome'),stateTaxRate=$('stateTaxRate'),
rothConversion=$('rothConversion'),deductions=$('deductions'),
age=$('age'),capGains=$('capGains');

function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtPct(n){return n.toFixed(1)+'%'}

const BRACKETS={
  single:[
    {rate:0.10,upTo:11600},{rate:0.12,upTo:47150},{rate:0.22,upTo:100525},
    {rate:0.24,upTo:191950},{rate:0.32,upTo:243725},{rate:0.35,upTo:609350},{rate:0.37,upTo:Infinity}
  ],
  married:[
    {rate:0.10,upTo:23200},{rate:0.12,upTo:94300},{rate:0.22,upTo:201050},
    {rate:0.24,upTo:383900},{rate:0.32,upTo:487450},{rate:0.35,upTo:731200},{rate:0.37,upTo:Infinity}
  ],
  head:[
    {rate:0.10,upTo:16550},{rate:0.12,upTo:63100},{rate:0.22,upTo:100500},
    {rate:0.24,upTo:191950},{rate:0.32,upTo:243700},{rate:0.35,upTo:609350},{rate:0.37,upTo:Infinity}
  ]
};

const CAPGAINS_BRACKETS={
  single:[{rate:0,upTo:47025},{rate:0.15,upTo:518900},{rate:0.20,upTo:Infinity}],
  married:[{rate:0,upTo:94050},{rate:0.15,upTo:583750},{rate:0.20,upTo:Infinity}],
  head:[{rate:0,upTo:63000},{rate:0.15,upTo:551350},{rate:0.20,upTo:Infinity}]
};

const STD_DEDUCTION={single:14600,married:29200,head:21900};

function calcTax(income,brackets){
  let tax=0,remaining=income;
  for(let b of brackets){
    if(remaining<=0)break;
    let taxable=Math.min(remaining,b.upTo-(tax===0?0:(brackets[brackets.indexOf(b)-1]?.upTo||0)));
    if(b===brackets[0])taxable=Math.min(remaining,b.upTo);
    else taxable=Math.min(remaining,b.upTo-brackets[brackets.indexOf(b)-1].upTo);
    tax+=taxable*b.rate;
    remaining-=taxable;
  }
  return tax;
}

function calcMarginalRate(income,brackets){
  for(let b of brackets){
    if(income<=b.upTo)return b.rate*100;
  }
  return brackets[brackets.length-1].rate*100;
}

function calc(){
  const status=filingStatus.value;
  const trad=+tradWithdrawal.value||0;
  const ss=+socialSecurity.value||0;
  const pension=+pensionIncome.value||0;
  const other=+otherIncome.value||0;
  const roth=+rothConversion.value||0;
  const ded=+deductions.value||0;
  const capg=+capGains.value||0;
  const statePct=(+stateTaxRate.value||0)/100;
  const ag=+age.value||65;

  let stdDed=STD_DEDUCTION[status];
  if(ag>=65)stdDed+=status==='married'?1950:1550;

  const combinedIncome=ss+trad+roth+pension+other;
  let ssTaxable=0;
  const base=status==='single'?25000:32000;
  const mid=status==='single'?34000:44000;
  if(combinedIncome>base){
    if(combinedIncome<=mid){
      ssTaxable=Math.min((combinedIncome-base)*0.5,ss*0.5);
    }else{
      ssTaxable=Math.min(ss*0.5+(combinedIncome-mid)*0.85,ss*0.85);
    }
  }

  const ordinaryIncome=trad+roth+pension+other+ssTaxable;
  const totalDed=stdDed+ded;
  const taxableOrdinary=Math.max(0,ordinaryIncome-totalDed);

  const brackets=BRACKETS[status];
  const federalOrdinaryTax=calcTax(taxableOrdinary,brackets);

  let capGainsTax=0;
  if(capg>0){
    const cgBrackets=CAPGAINS_BRACKETS[status];
    const cgThreshold=taxableOrdinary;
    let remaining=cgThreshold+capg;
    for(let b of cgBrackets){
      if(remaining<=0)break;
      let taxable=Math.min(remaining,b.upTo)-Math.max(0,cgThreshold);
      if(taxable>0){
        capGainsTax+=taxable*b.rate;
      }
      remaining-=b.upTo-Math.max(0,cgThreshold-(b===cgBrackets[0]?0:cgBrackets[cgBrackets.indexOf(b)-1].upTo));
    }
  }

  const federalTax=federalOrdinaryTax+capGainsTax;
  const stateTax=(taxableOrdinary+capg)*statePct;
  const totalTax=federalTax+stateTax;
  const totalIncome=trad+ss+pension+other+roth+capg;
  const effectiveRate=totalIncome>0?(totalTax/totalIncome*100):0;
  const marginalRate=calcMarginalRate(taxableOrdinary,brackets);
  const afterTax=totalIncome-totalTax;

  $('federalTax').textContent=fmt(federalTax);
  $('stateTax').textContent=fmt(stateTax);
  $('totalTax').textContent=fmt(totalTax);
  $('effectiveRate').textContent=fmtPct(effectiveRate);
  $('marginalRate').textContent=fmtPct(marginalRate);
  $('afterTaxIncome').textContent=fmt(afterTax);
  drawChart(federalTax,stateTax,afterTax);
}

function drawChart(fed,st,after){
  const canvas=$('taxChart'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.parentElement.clientWidth-32,h=260;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const total=fed+st+after;
  if(total<=0)return;
  const data=[
    {label:'Federal Tax',value:fed/total*100,color:'rgba(239,68,68,.7)'},
    {label:'State Tax',value:st/total*100,color:'rgba(249,115,22,.7)'},
    {label:'After-Tax',value:after/total*100,color:'rgba(34,211,238,.7)'}
  ];
  const cx=w/2,cy=h/2,radius=Math.min(cx,cy)-20;
  let startAngle=-Math.PI/2;
  data.forEach(d=>{
    const sliceAngle=(d.value/100)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,startAngle,startAngle+sliceAngle);
    ctx.closePath();
    ctx.fillStyle=d.color;
    ctx.fill();
    ctx.strokeStyle='#0f172a';
    ctx.lineWidth=2;
    ctx.stroke();
    const midAngle=startAngle+sliceAngle/2;
    const tx=cx+Math.cos(midAngle)*radius*0.65;
    const ty=cy+Math.sin(midAngle)*radius*0.65;
    ctx.fillStyle='#fff';
    ctx.font='11px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(d.label+' '+d.value.toFixed(1)+'%',tx,ty);
    startAngle+=sliceAngle;
  });
}

function reset(){
  filingStatus.value='married';tradWithdrawal.value=60000;socialSecurity.value=24000;
  pensionIncome.value=0;otherIncome.value=5000;stateTaxRate.value=5;
  rothConversion.value=0;deductions.value=0;age.value=65;capGains.value=0;
  $('federalTax').textContent='-';$('stateTax').textContent='-';
  $('totalTax').textContent='-';$('effectiveRate').textContent='-';
  $('marginalRate').textContent='-';$('afterTaxIncome').textContent='-';
  const canvas=$('taxChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
}

function copyResult(){
  const lines=['=== Retirement Tax Estimate ===',
    'Federal Tax: '+$('federalTax').textContent,
    'State Tax: '+$('stateTax').textContent,
    'Total Tax: '+$('totalTax').textContent,
    'Effective Rate: '+$('effectiveRate').textContent,
    'Marginal Rate: '+$('marginalRate').textContent,
    'After-Tax Income: '+$('afterTaxIncome').textContent];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('✅ Copied to clipboard')).catch(()=>showToast('Copy failed'));
}
