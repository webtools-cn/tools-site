<body>
<div class=container>
<div class=header><h1>💰 Debt-to-Income (DTI) Ratio Calculator</h1><div class=lang-switch><a href="index.html"></a><a href="../en/debt-to-income-calculator/" class=active>EN</a></div></div>
<p class=nav-back><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Debt-to-Income (DTI) Calculator</p>
<div class=hero><p>Quickly calculate your debt-to-income (DTI) ratio and understand your loan eligibility. A key metric banks use for mortgage and auto loan approvals.</p><span class=badge>Zero Dependencies Offline Ready</span></div>
<div class=calculator-section>
 <h2>💵 Monthly Income</h2>
 <div class=input-grid>
 <div class=input-group><label for=monthlyIncome>Monthly Gross Income ($)</label><input type="number" id=monthlyIncome value=8000 min=0 step=100><div class=hint>Pre-tax monthly income (salary, bonus, other)</div></div>
 </div>
</div>
<div class=calculator-section>
 <h2>💳 Monthly Debt Payments</h2>
 <div class=input-grid>
 <div class=input-group><label for=mortgage>Mortgage/Rent ($)</label><input type="number" id=mortgage value=1800 min=0 step=10></div>
 <div class=input-group><label for=carLoan>Auto Loan ($)</label><input type="number" id=carLoan value=400 min=0 step=10></div>
 <div class=input-group><label for=studentLoan>Student Loan ($)</label><input type="number" id=studentLoan value=300 min=0 step=10></div>
 <div class=input-group><label for=creditCard>Credit Card Min Payment ($)</label><input type="number" id=creditCard value=200 min=0 step=10></div>
 <div class=input-group><label for=personalLoan>Personal Loan ($)</label><input type="number" id=personalLoan value=0 min=0 step=10></div>
 <div class=input-group><label for=otherDebt>Other Debt ($)</label><input type="number" id=otherDebt value=0 min=0 step=10><div class=hint>Child support, alimony, etc.</div></div>
 </div>
 <div class=btn-row>
 <button class=btn btn-primary id=calcBtn>🔍 Calculate DTI</button>
 <button class=btn btn-secondary id=resetBtn>🔄 Reset</button>
 <button class=btn btn-secondary id=copyBtn>📋 Copy Results</button>
 </div>
</div>
<div class=results-grid>
 <div class=result-card highlight><div class=label>📊 Backend DTI (All Debts)</div><div class=value id=backendDti>-</div><div class=sub id=backendStatus>Enter data to calculate</div></div>
 <div class=result-card><div class=label>🏠 Frontend DTI (Housing Only)</div><div class=value id=frontendDti>-</div><div class=sub id=frontendStatus>Enter data to calculate</div></div>
 <div class=result-card><div class=label>💵 Monthly Disposable</div><div class=value id=remaining>-</div><div class=sub>Income - All Debts</div></div>
 <div class=result-card><div class=label>📋 Total Monthly Debt</div><div class=value id=totalDebt>-</div><div class=sub>Sum of all monthly payments</div></div>
</div>
<div class=info-section>
 <h2>📖 DTI Rating Standards</h2>
 <h3>Backend DTI (All Debts / Income)</h3>
 <ul>
 <li>≤ 36% — 🟢 Excellent: easiest loan approval</li>
 <li>36-43% — 🟡 Acceptable: most banks approve</li>
 <li>43-50% — 🟠 High: some lenders may approve</li>
 <li>≥ 50% — 🔴 High Risk: very difficult to qualify</li>
 </ul>
 <h3>Frontend DTI (Housing / Income)</h3>
 <ul>
 <li>≤ 28% — 🟢 Ideal</li>
 <li>28-36% — 🟡 Acceptable</li>
 <li>≥ 36% — 🔴 Housing burden is high</li>
 </ul>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
function fmt(v){return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
const income=+$('monthlyIncome').value||0;
const debts=[
+$('mortgage').value||0,+$('carLoan').value||0,
+$('studentLoan').value||0,+$('creditCard').value||0,
+$('personalLoan').value||0,+$('otherDebt').value||0
];
const totalDebt=debts.reduce((a,b)=>a+b,0);
const housing=debts[0];
if(income<=0){showToast('Please enter monthly income');return}
const backendDti=(totalDebt/income)*100;
const frontendDti=(housing/income)*100;
const remaining=income-totalDebt;
$('backendDti').textContent=backendDti.toFixed(1)+'%';
$('frontendDti').textContent=frontendDti.toFixed(1)+'%';
$('remaining').textContent='$'+fmt(remaining);
$('totalDebt').textContent='$'+fmt(totalDebt);
let bStatus,fStatus,bCard=$('backendDti').parentElement,
fCard=$('frontendDti').parentElement;
if(backendDti<=36){bStatus='🟢 Excellent - Easy approval';bCard.className='result-card good'}
else if(backendDti<=43){bStatus='🟡 Acceptable - Most banks approve';bCard.className='result-card highlight'}
else if(backendDti<=50){bStatus='🟠 High - Some lenders approve';bCard.className='result-card warn'}
else{bStatus='🔴 High Risk - Difficult to qualify';bCard.className='result-card bad'}
if(frontendDti<=28){fStatus='🟢 Ideal';fCard.className='result-card good'}
else if(frontendDti<=36){fStatus='🟡 Acceptable';fCard.className='result-card highlight'}
else{fStatus='🔴 Housing heavy';fCard.className='result-card bad'}
$('backendStatus').textContent=bStatus;
$('frontendStatus').textContent=fStatus;
}
function reset(){
['monthlyIncome','mortgage','carLoan','studentLoan','creditCard','personalLoan','otherDebt'].forEach(id=>$(id).value=(id==='monthlyIncome'?'8000':id==='mortgage'?'1800':id==='carLoan'?'400':id==='studentLoan'?'300':id==='creditCard'?'200':'0'));
['backendDti','frontendDti','remaining','totalDebt'].forEach(id=>$(id).textContent='-');
['backendStatus','frontendStatus'].forEach(id=>$(id).textContent='Enter data to calculate');
['backendDti','frontendDti'].forEach(id=>$(id).parentElement.className='result-card')
}
function copyResult(){
navigator.clipboard.writeText(['=== DTI Calculation Results ===',
'Backend DTI (All): '+$('backendDti').textContent+' - '+$('backendStatus').textContent,
'Frontend DTI (Housing): '+$('frontendDti').textContent+' - '+$('frontendStatus').textContent,
'Total Monthly Debt: '+$('totalDebt').textContent,'Monthly Remaining: '+$('remaining').textContent].join('\n'))
.then(()=>showToast('✅ Copied')).catch(()=>showToast('Copy failed'))
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
$('calcBtn').addEventListener('click',calc);
$('resetBtn').addEventListener('click',reset);
$('copyBtn').addEventListener('click',copyResult);
calc();
})();
</script>
