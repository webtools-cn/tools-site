var currentPlanText = '';

  function generatePlan() {
    var goal = document.getElementById('goal').value;
    var level = document.getElementById('level').value;
    var days = parseInt(document.getElementById('daysPerWeek').value);
  
    var fullPlan = plans[goal][level];
    var restDays = ['Rest/Stretch','Rest','Rest Day'];
    var workoutDays = fullPlan.filter(function(d) { return restDays.indexOf(d.type) === -1 || d.type === 'Rest/Stretch'; });
    var pureRest = fullPlan.filter(function(d) { return d.type === 'Rest' || d.type === 'Rest Day'; });
  
    var planDays = [];
    var dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    var wi = 0, ri = 0;
  
    for (var i = 0; i < 7; i++) {
      if (wi < days && wi < workoutDays.length) {
        planDays.push(workoutDays[wi]);
        wi++;
      } else if (ri < pureRest.length) {
        planDays.push(pureRest[ri]);
        ri++;
      } else {
        planDays.push({day: dayNames[i], type: "Rest", detail: "Rest day"});
      }
    }
  
    for (var j = 0; j < planDays.length; j++) {
      planDays[j].day = dayNames[j];
    }
  
    var html = '';
    currentPlanText = '🏋️ Workout Plan (' + document.getElementById('goal').options[document.getElementById('goal').selectedIndex].text + ' - ' + document.getElementById('level').options[document.getElementById('level').selectedIndex].text + ')\n\n';
  
    for (var k = 0; k < planDays.length; k++) {
      var d = planDays[k];
      html += '<div class="plan-day"><h3>' + d.day + ' - ' + d.type + '</h3><p>' + d.detail + '</p></div>';
      currentPlanText += d.day + ' - ' + d.type + ': ' + d.detail + '\n';
    }
  
    document.getElementById('planContainer').innerHTML = html;
  
    var tipsHtml = '';
    var tips = tipsMap[goal];
    for (var t = 0; t < tips.length; t++) {
      tipsHtml += '<li>' + tips[t] + '</li>';
    }
    document.getElementById('tipsList').innerHTML = tipsHtml;
    document.getElementById('results').style.display = 'block';
  
    showToast('Plan generated');
  }

  function copyPlan() {
    if (!currentPlanText) return;
    navigator.clipboard.writeText(currentPlanText).then(function() {
      showToast('Copied to clipboard');
    }).catch(function() {
      showToast('Copy failed, please copy manually');
    });
  }

  function clearAll() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('goal').value = 'fat-loss';
    document.getElementById('level').value = 'beginner';
    document.getElementById('daysPerWeek').value = '4';
    currentPlanText = '';
    showToast('Reset');
  }

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}
</script>
</body>
</html>
