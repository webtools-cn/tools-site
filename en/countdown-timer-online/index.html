  <style>:root{--primary:#4F46E5;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#22c55e}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px}header a{color:var(--primary);text-decoration:none;font-weight:600;font-size:18px}main{max-width:640px;margin:0 auto;padding:32px 16px 64px}h1{font-size:28px;margin-bottom:8px;color:var(--text)}.subtitle{color:var(--text2);margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:var(--text)}.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;transition:border-color .2s}.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{opacity:.9}.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}.btn-block{width:100%;justify-content:center;margin-top:4px}.countdown-display{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;text-align:center}.countdown-box{background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:16px 8px}.countdown-value{font-size:36px;font-weight:700;color:var(--primary);line-height:1.2}.countdown-label{font-size:12px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-s <body>
  <header><a href="/en/">← Free ToolBase</a></header>
  <main>
    <h1>⏱️ Countdown Timer</h1>
    <p class="subtitle">Set your target date and time to track remaining days, hours, minutes, and seconds.</p>
    <div class="card">
      <div class="form-group">
        <label>Countdown Title (optional)</label>
        <input type="text" id="titleInput" placeholder="e.g. New Year Countdown">
      </div>
      <div class="form-group">
        <label>Target Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>Target Time</label>
        <input type="time" id="timeInput" value="00:00">
      </div>
      <button class="btn btn-primary btn-block" id="startBtn">Start Countdown</button>
    </div>
    <div class="preset-buttons">
      <span style="font-size:13px;color:var(--text2);margin-right:4px">Quick: </span>
      <button class="preset-btn" data-days="1">Tomorrow</button>
      <button class="preset-btn" data-days="7">1 Week</button>
      <button class="preset-btn" data-days="30">30 Days</button>
      <button class="preset-btn" data-days="100">100 Days</button>
      <button class="preset-btn" data-days="365">1 Year</button>
    </div>
    <div id="resultArea" style="display:none">
      <div class="card">
        <div class="countdown-title" id="displayTitle"></div>
        <div class="countdown-display">
          <div class="countdown-box"><div class="countdown-value" id="days">0</div><div class="countdown-label">Days</div></div>
          <div class="countdown-box"><div class="countdown-value" id="hours">0</div><div class="countdown-label">Hrs</div></div>
          <div class="countdown-box"><div class="countdown-value" id="minutes">0</div><div class="countdown-label">Min</div></div>
          <div class="countdown-box"><div class="countdown-value" id="seconds">0</div><div class="countdown-label">Sec</div></div>
        </div>
        <div class="expired" id="expiredMsg" style="display:none">⏰ Hrs间到！</div>
        <button class="btn btn-danger btn-block" id="stopBtn" style="margin-top:16px">停止倒计Hrs</button>
      </div>
    </div>
  </main>
  <footer>© 2025 <a href="/en/">Free ToolBase</a> · All tools are free to use</footer>
  <div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>
  <script>
    let countdownInterval = null;
    let targetDate = null;

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function updateCountdown() {
      if (!targetDate) return;
      var now = new Date().getTime();
      var dist = targetDate.getTime() - now;
      if (dist <= 0) {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '0';
        document.getElementById('minutes').textContent = '0';
        document.getElementById('seconds').textContent = '0';
        document.getElementById('expiredMsg').style.display = 'block';
        clearInterval(countdownInterval);
        countdownInterval = null;
        return;
      }
      document.getElementById('expiredMsg').style.display = 'none';
      var d = Math.floor(dist / (1000 * 60 * 60 * 24));
      var h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
      var s = Math.floor((dist % (1000 * 60)) / 1000);
      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = h;
      document.getElementById('minutes').textContent = m;
      document.getElementById('seconds').textContent = s;
    }

    function startCountdown(dateObj, title) {
      if (countdownInterval) clearInterval(countdownInterval);
      targetDate = dateObj;
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('displayTitle').textContent = title || '倒计Hrs';
    }

    document.getElementById('startBtn').addEventListener('click', function() {
      var dateVal = document.getElementById('dateInput').value;
      var timeVal = document.getElementById('timeInput').value || '00:00';
      if (!dateVal) {
        showToast('请选择Target Date');
        return;
      }
      var target = new Date(dateVal + 'T' + timeVal);
      if (target.getTime() <= Date.now()) {
        showToast('Target Time已过，请选择未来的Hrs间');
        return;
      }
      var title = document.getElementById('titleInput').value.trim();
      startCountdown(target, title);
      showToast('倒计Hrs已启动');
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = null;
      document.getElementById('resultArea').style.display = 'none';
      targetDate = null;
      showToast('倒计Hrs已停止');
    });

    document.querySelectorAll('.preset-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var days = parseInt(this.dataset.days);
        var d = new Date();
        d.setDate(d.getDate() + days);
        d.setHours(0, 0, 0, 0);
        var dateStr = d.toISOString().split('T')[0];
        document.getElementById('dateInput').value = dateStr;
        document.getElementById('timeInput').value = '00:00';
      });
    });

    // 默认设为Tomorrow
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('dateInput').value = tomorrow.toISOString().split('T')[0];
  </script>
</body>
</html>
