            --primary: #4F46E5;

        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
        header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 0;position:sticky;top:0;z-index:100}
        .header-inner{max-width:800px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}

        .lang-switch{color:var(--text-light);text-decoration:none;font-size:.9rem;font-weight:500}

<body>
    <header>
        <div class="header-inner">
            <a href="/en/" class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Free ToolBase
            </a>
            <a href="https://free-toolbase.com/bac-calculator/" class="lang-switch">CN</a>
        </div>
    </header>
    <main>
        <h1>BAC Calculator (Blood Alcohol Content)</h1>
        <p class="subtitle">Estimate your Blood Alcohol Content (BAC) after drinking. Uses the Widmark formula — enter weight, gender, drinks, and time to calculate BAC and estimated sobriety time.</p>
        <div class="card">
            <h2>Calculator</h2>
            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 70" min="30" max="300">
            </div>
            <div class="form-group">
                <label>Drinks (standard, 1 drink ≈ 14g alcohol)</label>
                <input type="number" id="drinks" placeholder="e.g. 3" min="0" max="50" step="0.5">
            </div>
            <div class="form-group">
                <label>Hours Since Drinking</label>
                <input type="number" id="hours" placeholder="e.g. 1.5" min="0" max="48" step="0.1" value="0">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">Calculate</button>
                <button class="btn btn-secondary" id="resetBtn">Reset</button>
            </div>
            <div class="result" id="result">
                <span class="result-label">Result:</span>
                <span id="resultValue"></span>
            </div>
        </div>
    </main>
    <footer>
        <a href="/en/">Home</a>
        <a href="/en/privacy">Privacy</a>
    </footer>
    <div class="toast" id="toast"></div>
    <script>
    
const toast = s => {{ const e = document.getElementById('toast'); e.textContent = s; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2000); }};
const copy = s => {{ navigator.clipboard.writeText(s).then(() => toast('Copied!')).catch(() => toast('Copy failed')); }};

document.getElementById('calcBtn').addEventListener('click', () => {{
    const gender = document.getElementById('gender').value;
    const weight = parseFloat(document.getElementById('weight').value);
    const drinks = parseFloat(document.getElementById('drinks').value);
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    if (isNaN(weight) || isNaN(drinks)) {{ toast('Please fill required fields'); return; }}
    // Widmark formula
    const r = gender === 'male' ? 0.68 : 0.55;
    const alcoholGrams = drinks * 14;
    const bac = Math.max(0, (alcoholGrams / (weight * 1000 * r) * 100 - hours * 0.015));
    const bacPct = (bac * 100).toFixed(3);
    const toZero = bac > 0 ? (bac / 0.015).toFixed(1) : "0";
    let level;
    if (bac === 0) level = 'No Alcohol';
    else if (bac < 0.03) level = 'Mostly Sober';
    else if (bac < 0.05) level = 'Slightly Affected';
    else if (bac < 0.08) level = 'Clearly Impaired (DUI limit in most countries)';
    else if (bac < 0.15) level = 'Significantly Intoxicated';
    else level = 'Severely Intoxicated';
    const msg = `BAC: ${{bacPct}}%  | Status: ${{level}}  | Est. time to sober: ${{toZero}} hours`;
    document.getElementById('resultValue').textContent = msg;
    document.getElementById('result').classList.add('show');
    document.getElementById('resultValue').onclick = () => copy(msg);
    document.getElementById('resultValue').style.cursor = 'pointer';
    document.getElementById('resultValue').title = 'Click to copy result';
}});

document.getElementById('resetBtn').addEventListener('click', () => {{
    document.getElementById('weight').value = '';
    document.getElementById('drinks').value = '';
    document.getElementById('hours').value = '0';
    document.getElementById('result').classList.remove('show');
}});

    </script>
