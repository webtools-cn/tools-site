<body>
  <header>
    <a href="/en/" class="logo">Free ToolBase</a>
    <nav><a href="/">中文</a><a href="/en/">Home</a></nav>
  </header>
  <main>
    <h1>📐 Unit Converter</h1>
    <p class="desc">Convert between length, weight, temperature, area, volume, speed, and data storage units instantly. Real-time conversion with formula display.</p>
    <div class="tool-panel">
      <div class="category-tabs" id="tabs">
        <button class="tab active" data-cat="length">📏 Length</button>
        <button class="tab" data-cat="weight">⚖️ Weight</button>
        <button class="tab" data-cat="temperature">🌡️ Temp</button>
        <button class="tab" data-cat="area">📐 Area</button>
        <button class="tab" data-cat="volume">🧪 Volume</button>
        <button class="tab" data-cat="speed">🚀 Speed</button>
        <button class="tab" data-cat="data">💾 Data</button>
      </div>
      <div class="converter-row">
        <div class="input-group">
          <label for="inputValue">Value</label>
          <input type="number" id="inputValue" value="1" step="any">
        </div>
        <div class="input-group">
          <label for="fromUnit">From</label>
          <select id="fromUnit"></select>
        </div>
        <button class="swap-btn" id="swapBtn" title="Swap">⇄</button>
        <div class="input-group">
          <label for="toUnit">To</label>
          <select id="toUnit"></select>
        </div>
      </div>
      <div class="result-area" id="result">
        <div class="result-value" id="resultValue">--</div>
        <div class="formula" id="formula"></div>
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-secondary" id="copyResultBtn">📋 Copy Result</button>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2025 Free ToolBase. All tools are free to use.</p></footer>
  <div class="toast" id="toast"></div>
  <script>
    const categories = {
      length: {
        units: { 'Meter (m)':1, 'Kilometer (km)':1000, 'Centimeter (cm)':0.01, 'Millimeter (mm)':0.001, 'Mile (mi)':1609.344, 'Yard (yd)':0.9144, 'Foot (ft)':0.3048, 'Inch (in)':0.0254, 'Nautical mile (nmi)':1852 }
      },
      weight: {
        units: { 'Kilogram (kg)':1, 'Gram (g)':0.001, 'Milligram (mg)':1e-6, 'Ton (t)':1000, 'Pound (lb)':0.453592, 'Ounce (oz)':0.0283495, 'Stone (st)':6.35029 }
      },
      temperature: {
        units: { 'Celsius (°C)':'C', 'Fahrenheit (°F)':'F', 'Kelvin (K)':'K' },
        isSpecial: true
      },
      area: {
        units: { 'Square meter (m²)':1, 'Square km (km²)':1e6, 'Hectare (ha)':10000, 'Acre':4046.86, 'Square foot (ft²)':0.092903, 'Square inch (in²)':0.00064516 }
      },
      volume: {
        units: { 'Liter (L)':1, 'Milliliter (mL)':0.001, 'Cubic meter (m³)':1000, 'Gallon (gal)':3.78541, 'Quart (qt)':0.946353, 'Pint (pt)':0.473176, 'Cup':0.236588 }
      },
      speed: {
        units: { 'Meter/sec (m/s)':1, 'Km/hour (km/h)':0.277778, 'Miles/hour (mph)':0.44704, 'Knot (kn)':0.514444, 'Mach (M)':343 }
      },
      data: {
        units: { 'Byte (B)':1, 'KB':1024, 'MB':1048576, 'GB':1073741824, 'TB':1099511627776, 'PB':1125899906842624 }
      }
    };

    let currentCat = 'length';
    const inputValue = document.getElementById('inputValue');
    const fromUnit = document.getElementById('fromUnit');
    const toUnit = document.getElementById('toUnit');
    const resultValue = document.getElementById('resultValue');
    const formulaEl = document.getElementById('formula');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function populateUnits(cat) {
      const catData = categories[cat];
      fromUnit.innerHTML = '';
      toUnit.innerHTML = '';
      const keys = Object.keys(catData.units);
      keys.forEach((k, i) => {
        fromUnit.add(new Option(k, k));
        toUnit.add(new Option(k, k, false, i === 1));
      });
      fromUnit.selectedIndex = 0;
      toUnit.selectedIndex = 1;
      convert();
    }

    function tempConvert(value, from, to) {
      let celsius;
      if (from === 'C') celsius = value;
      else if (from === 'F') celsius = (value - 32) * 5 / 9;
      else if (from === 'K') celsius = value - 273.15;
      if (to === 'C') return celsius;
      if (to === 'F') return celsius * 9 / 5 + 32;
      if (to === 'K') return celsius + 273.15;
    }

    function convert() {
      const val = parseFloat(inputValue.value) || 0;
      const catData = categories[currentCat];
      const from = fromUnit.value;
      const to = toUnit.value;

      let result;
      if (catData.isSpecial) {
        const fu = catData.units[from];
        const tu = catData.units[to];
        result = tempConvert(val, fu, tu);
        formulaEl.textContent = 'Formula: convert to Celsius first';
      } else {
        const fromFactor = catData.units[from];
        const toFactor = catData.units[to];
        const baseVal = val * fromFactor;
        result = baseVal / toFactor;
        formulaEl.textContent = val + ' ' + from + ' × ' + fromFactor + ' ÷ ' + toFactor + ' = ' + result + ' ' + to;
      }

      resultValue.textContent = parseFloat(result.toPrecision(12)) + ' ' + to;
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCat = tab.dataset.cat;
        populateUnits(currentCat);
      });
    });

    inputValue.addEventListener('input', convert);
    fromUnit.addEventListener('change', convert);
    toUnit.addEventListener('change', convert);

    document.getElementById('swapBtn').addEventListener('click', () => {
      const tmp = fromUnit.value;
      fromUnit.value = toUnit.value;
      toUnit.value = tmp;
      convert();
    });

    document.getElementById('copyResultBtn').addEventListener('click', () => {
      const text = resultValue.textContent;
      if (text === '--') { showToast('Nothing to copy'); return; }
      navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => showToast('Copy failed'));
    });

    populateUnits('length');
  </script>
</body>
