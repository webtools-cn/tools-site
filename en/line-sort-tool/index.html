<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

document.getElementById('sortBtn').addEventListener('click', function(){
  var text = document.getElementById('input').value;
  if (!text.trim()) { toast('Please enter text'); return; }
  var lines = text.split('\n');
  var sortType = document.getElementById('sortType').value;
  var unique = document.getElementById('unique').value;

  if (unique === 'true') {
    var seen = {};
    lines = lines.filter(function(l){ var key = l; if (seen[key]) return false; seen[key] = true; return true; });
  } else if (unique === 'dup-only') {
    var counts = {};
    lines.forEach(function(l){ counts[l] = (counts[l]||0)+1; });
    var seen2 = {};
    lines = lines.filter(function(l){
      if (counts[l] > 1 && !seen2[l]) { seen2[l] = true; return true; }
      return false;
    });
  } else if (unique === 'unique-only') {
    var counts2 = {};
    lines.forEach(function(l){ counts2[l] = (counts2[l]||0)+1; });
    lines = lines.filter(function(l){ return counts2[l] === 1; });
  }

  switch(sortType) {
    case 'asc':
      lines.sort(function(a,b){ return a.localeCompare(b); });
      break;
    case 'desc':
      lines.sort(function(a,b){ return b.localeCompare(a); });
      break;
    case 'num-asc':
      lines.sort(function(a,b){
        var na = parseFloat(a), nb = parseFloat(b);
        if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
        if (isNaN(na)) return 1;
        if (isNaN(nb)) return -1;
        return na - nb;
      });
      break;
    case 'num-desc':
      lines.sort(function(a,b){
        var na = parseFloat(a), nb = parseFloat(b);
        if (isNaN(na) && isNaN(nb)) return b.localeCompare(a);
        if (isNaN(na)) return 1;
        if (isNaN(nb)) return -1;
        return nb - na;
      });
      break;
    case 'random':
      for (var i = lines.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = lines[i]; lines[i] = lines[j]; lines[j] = tmp;
      }
      break;
    case 'reverse':
      lines.reverse();
      break;
    case 'length-asc':
      lines.sort(function(a,b){ return a.length - b.length || a.localeCompare(b); });
      break;
    case 'length-desc':
      lines.sort(function(a,b){ return b.length - a.length || a.localeCompare(b); });
      break;
  }

  var output = lines.join('\n');
  document.getElementById('outputSection').innerHTML =
    '<div class="stats"><div class="stat">📄 Lines: <strong>' + lines.length + '</strong></div>' +
    '<div class="stat">📏 Chars: <strong>' + output.length + '</strong></div></div>' +
    '<div class="output-area">' + output.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') + '</div>' +
    '<button class="btn btn-sm" id="copyBtn" style="margin-top:8px;">📋 Copy Result</button>';
  document.getElementById('copyBtn').addEventListener('click', function(){
    navigator.clipboard.writeText(output).then(function(){ toast('Copied!'); });
  });
});
</script>
