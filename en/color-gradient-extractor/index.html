<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Color Extractor - Free ToolBase</title>
  <meta name="description" content="Free online Image Color Extractor. Upload an image to automatically extract dominant colors and gradient color schemes. Generate CSS code for UI design inspiration.">
  <meta property="og:title" content="Image Color Extractor - Online Palette Generator">
  <meta property="og:description" content="Upload an image to extract dominant colors and gradient schemes">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Image Color Extractor","applicationCategory":"UtilitiesApplication","operatingSystem":"Any"}</script>
  <style>
    :root { --primary: #4F46E5; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --text2: #94a3b8; --border: rgba(148,163,184,.1); --accent: #06b6d4; --radius: 12px }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px }
    header h1 { font-size: 1.25rem; color: #f1f5f9 }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 32px 16px; width: 100% }
    .card { background: var(--card); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border) }
    .card + .card { margin-top: 16px }
    h2 { font-size: 1.1rem; color: #f1f5f9; margin-bottom: 16px }
    .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s }
    .upload-area:hover { border-color: var(--accent) }
    .upload-area input { display: none }
    #previewImg { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 16px 0; display: none }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
    .color-block { flex: 1; min-width: 60px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px; font-size: 0.75rem; cursor: pointer; position: relative }
    .color-block span { background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 4px }
    .gradient-preview { height: 80px; border-radius: 8px; margin-top: 8px }
    .css-code { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #e2e8f0; margin-top: 8px }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s }
    .btn-secondary { background: #334155; color: var(--text) }
    .btn-secondary:hover { background: #475569 }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #334155; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none }
    .toast.show { opacity: 1 }
    footer { background: var(--card); border-top: 1px solid var(--border); padding: 16px 24px; text-align: center; color: var(--text2); font-size: 0.8rem }
    @media (max-width: 375px) { main { padding: 16px 8px } .card { padding: 16px } }
  </style>
</head>
<body>
<header><h1>🎨 Image Color Extractor</h1></header>
<main>
  <div class="card">
    <h2>Upload Image</h2>
    <div class="upload-area" id="uploadArea">
      <p style="color:var(--text2)">Click or drag an image here</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="previewImg" alt="Preview">
  </div>
  <div class="card" id="resultCard" style="display:none">
    <h2>Extracted Colors</h2>
    <div class="colors" id="colorBlocks"></div>
    <h2 style="margin-top:16px">Gradient Preview</h2>
    <div class="gradient-preview" id="gradientPreview"></div>
    <div class="css-code" id="cssCode"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCopy">📋 Copy CSS</button>
    </div>
  </div>
</main>
<footer>Free ToolBase &copy; 2026</footer>
<div class="toast" id="toast"></div>
<script>
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const previewImg = document.getElementById('previewImg');
const resultCard = document.getElementById('resultCard');
const colorBlocks = document.getElementById('colorBlocks');
const gradientPreview = document.getElementById('gradientPreview');
const cssCode = document.getElementById('cssCode');
const toast = document.getElementById('toast');

function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = 'var(--border)');
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = 'var(--border)';
  if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) processImage(fileInput.files[0]);
});

function processImage(file) {
  if (!file.type.startsWith('image/')) { showToast('Please select an image file'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      previewImg.src = e.target.result;
      previewImg.style.display = 'block';
      extractColors(img);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function extractColors(img) {
  const canvas = document.createElement('canvas');
  const size = 100;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, size, size);
  const data = ctx.getImageData(0, 0, size, size).data;
  const colorMap = {};
  for (let i = 0; i < data.length; i += 16) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const key = `${Math.round(r/32)*32},${Math.round(g/32)*32},${Math.round(b/32)*32}`;
    colorMap[key] = (colorMap[key] || 0) + 1;
  }
  const sorted = Object.entries(colorMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const colors = sorted.map(([key]) => {
    const [r, g, b] = key.split(',').map(Number);
    return { hex: `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`, r, g, b };
  });
  displayColors(colors);
}

function displayColors(colors) {
  colorBlocks.innerHTML = colors.map(c =>
    `<div class="color-block" style="background:${c.hex}" data-hex="${c.hex}" title="Click to copy ${c.hex}">
      <span>${c.hex}</span>
    </div>`
  ).join('');
  const gradColors = colors.map(c => c.hex).join(', ');
  gradientPreview.style.background = `linear-gradient(135deg, ${gradColors})`;
  cssCode.textContent = `background: linear-gradient(135deg, ${gradColors});`;
  resultCard.style.display = 'block';
  colorBlocks.querySelectorAll('.color-block').forEach(block => {
    block.addEventListener('click', () => {
      navigator.clipboard.writeText(block.dataset.hex).then(() => showToast('Copied ' + block.dataset.hex)).catch(() => showToast('Copy failed'));
    });
  });
}

document.getElementById('btnCopy').addEventListener('click', () => {
  navigator.clipboard.writeText(cssCode.textContent).then(() => showToast('CSS copied')).catch(() => showToast('Copy failed'));
});
</script>
</body>
</html>
