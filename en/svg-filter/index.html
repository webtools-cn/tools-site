    <div class="card">
      <h2>🔧 Filter Settings</h2>
      <div class="row">
        <div class="form-group"><label>Blur <span class="range-val" id="blurVal">0px</span></label><input type="range" id="blur" min="0" max="20" value="0" step="0.5" oninput="updateFilter()"></div>
        <div class="form-group"><label>Brightness <span class="range-val" id="brightVal">100%</span></label><input type="range" id="bright" min="0" max="200" value="100" oninput="updateFilter()"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Contrast <span class="range-val" id="contrastVal">100%</span></label><input type="range" id="contrast" min="0" max="200" value="100" oninput="updateFilter()"></div>
        <div class="form-group"><label>Saturate <span class="range-val" id="saturateVal">100%</span></label><input type="range" id="saturate" min="0" max="200" value="100" oninput="updateFilter()"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Hue Rotate <span class="range-val" id="hueVal">0deg</span></label><input type="range" id="hue" min="0" max="360" value="0" oninput="updateFilter()"></div>
        <div class="form-group"><label>Opacity <span class="range-val" id="opacityVal">100%</span></label><input type="range" id="opacity" min="0" max="100" value="100" oninput="updateFilter()"></div>
      </div>
      <div class="form-group"><label>Drop Shadow (comma separated: x,y,blur,color)</label><input type="text" id="shadow" value="5,5,10,rgba(0,0,0,0.3)" oninput="updateFilter()"></div>

    </div>

      <h2>📋 Generated CSS</h2>
      <div class="code-block" id="cssOutput">filter: none;</div>
    </div>

  <script>
    function updateFilter(){
      const blur = document.getElementById('blur').value;
      const bright = document.getElementById('bright').value;
      const contrast = document.getElementById('contrast').value;
      const saturate = document.getElementById('saturate').value;
      const hue = document.getElementById('hue').value;
      const opacity = document.getElementById('opacity').value;
      const shadow = document.getElementById('shadow').value;
      let filters = [];
      if(blur>0) filters.push(`blur(${blur}px)`);
      if(bright!=100) filters.push(`brightness(${bright}%)`);
      if(contrast!=100) filters.push(`contrast(${contrast}%)`);
      if(saturate!=100) filters.push(`saturate(${saturate}%)`);
      if(hue!=0) filters.push(`hue-rotate(${hue}deg)`);
      if(opacity!=100) filters.push(`opacity(${opacity}%)`);
      if(shadow.trim()){
        const parts = shadow.split(',').map(s=>s.trim());
        if(parts.length>=4) filters.push(`drop-shadow(${parts[0]}px ${parts[1]}px ${parts[2]}px ${parts[3]})`);
      }
      const filterStr = filters.length?filters.join(' '):'none';
      document.getElementById('previewBox').style.filter = filterStr;
      document.getElementById('cssOutput').textContent = `filter: ${filterStr};`;
      document.getElementById('blurVal').textContent = blur+'px';
      document.getElementById('brightVal').textContent = bright+'%';
      document.getElementById('contrastVal').textContent = contrast+'%';
      document.getElementById('saturateVal').textContent = saturate+'%';
      document.getElementById('hueVal').textContent = hue+'deg';
      document.getElementById('opacityVal').textContent = opacity+'%';
    }
    function resetFilters(){
      document.getElementById('blur').value=0;document.getElementById('bright').value=100;
      document.getElementById('contrast').value=100;document.getElementById('saturate').value=100;
      document.getElementById('hue').value=0;document.getElementById('opacity').value=100;
      document.getElementById('shadow').value='5,5,10,rgba(0,0,0,0.3)';
      updateFilter();
    }
    function copyCSS(){
      const css = document.getElementById('cssOutput').textContent;
      navigator.clipboard.writeText(css).then(()=>{
        const toast=document.getElementById('toast');
        toast.textContent='CSS copied!';
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),2000);
      });
    }
    updateFilter();
  </script>
