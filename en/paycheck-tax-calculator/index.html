<body>
<div class="container">
<div class="nav-back"><a href="/">🏠 Home</a> › <a href="/#tools">Tools</a> › <span>Paycheck Tax Calculator</span></div>
<div class="hero">
  <span style="font-size:2rem">💵</span>
  <div><h1 style="font-size:1.5rem;color:#f1f5f9;margin-bottom:4px">Paycheck Tax Calculator</h1>
  <p>Calculate your actual take-home pay after all deductions</p></div>
  <span class="badge">🛡️ Client-side Only</span>
</div>
<div class="calculator-section">
  <h2>📊 Income Info</h2>
  <div class="input-grid">
    <div class="input-group"><label>Annual Gross Salary ($)</label><input type="number" id="annualSalary" value="80000" min="0" step="1000"><span class="hint">Pre-tax annual income</span></div>
    <div class="input-group"><label>Filing Status</label><select id="filingStatus"><option value="single">Single</option><option value="married">Married Filing Jointly</option><option value="head">Head of Household</option></select></div>
    <div class="input-group"><label>401k/IRA Contribution ($/yr)</label><input type="number" id="retirement" value="0" min="0" step="100"><span class="hint">Pre-tax retirement contribution</span></div>
    <div class="input-group"><label>State Tax Rate (%)</label><input type="number" id="stateTax" value="5" min="0" max="15" step="0.1"><span class="hint">CA~9.3%, TX 0%</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">🔍 Calculate Take-Home Pay</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear & Reset</button>
    <button class="btn btn-danger" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">💰 Take-Home Pay (Annual)</div><div class="value" id="takeHome">$0</div><div class="sub" id="takeHomeMonthly"></div></div>
  <div class="result-card"><div class="label">📊 Gross Income</div><div class="value" id="gross">$0</div><div class="sub">Inc. retirement contrib.</div></div>
  <div class="result-card warning"><div class="label">🧾 Total Taxes</div><div class="value" id="totalTax">$0</div><div class="sub" id="taxRate"></div></div>
</div>
<div class="calculator-section" id="breakdownSection" style="display:none">
  <h2>📋 Tax Breakdown</h2>
  <table class="breakdown-table">
    <thead><tr><th>Tax Type</th><th>Annual</th><th>Monthly</th><th>Share of Income</th></tr></thead>
    <tbody id="breakdownBody"></tbody>
  </table>
</div>
<div class="info-section">
  <h2>📘 2024 US Tax Brackets</h2>
  <h3>Federal Income Tax (Single)</h3>
  <p>$0-$11,600: 10% | $11,601-$47,150: 12% | $47,151-$100,525: 22% | $100,526-$191,950: 24% | $191,951-$243,725: 32% | $243,726-$609,350: 35% | $609,351+: 37%</p>
  <h3>社保与Medicare Tax</h3>
  <p>Social Security Tax (OASDI): 6.2% (2024 wage cap $168,600) | Medicare Tax: 1.45% (no cap, +0.9% surtax above $200,000)</p>
  <h3>Data Security</h3>
  <p>All calculations are done locally in your browser. Your data is never uploaded. Works offline.</p>
</div>
<div class="footer">
  <p>© 2024 <a href="/">Free ToolBase</a> · Client-side only, no data upload · <a href="/about/">About</a> · <a href="/privacy/">Privacy</a></p>
</div>

<div class="toast" id="toast"></div>
<script>
function formatCurrency(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function calcFederalTax(income,status){
  var brackets;
  if(status==='single') brackets=[[11600,0.1],[47150,0.12],[100525,0.22],[191950,0.24],[243725,0.32],[609350,0.35],[Infinity,0.37]];
  else if(status==='married') brackets=[[23200,0.1],[94300,0.12],[201050,0.22],[383900,0.24],[487450,0.32],[731200,0.35],[Infinity,0.37]];
  else brackets=[[16550,0.1],[63100,0.12],[100500,0.22],[191950,0.24],[243700,0.32],[609350,0.35],[Infinity,0.37]];
  var tax=0,prev=0;
  for(var i=0;i<brackets.length;i++){
    if(income>prev){
      var taxable=Math.min(income,brackets[i][0])-prev;
      tax+=taxable*brackets[i][1];
      prev=brackets[i][0];
    }else break;
  }
  return tax;
}
function calculate(){
  var salary=parseFloat(document.getElementById('annualSalary').value)||0;
  var status=document.getElementById('filingStatus').value;
  var retirement=parseFloat(document.getElementById('retirement').value)||0;
  var stateRate=parseFloat(document.getElementById('stateTax').value)||0;
  if(salary<0){showToast('Please enter valid salary');return}
  var taxableIncome=Math.max(0,salary-retirement);
  var fedTax=calcFederalTax(taxableIncome,status);
  var ssWageBase=168600;
  var ssTax=Math.min(taxableIncome,ssWageBase)*0.062;
  var medicareTax=taxableIncome*0.0145+(taxableIncome>200000?(taxableIncome-200000)*0.009:0);
  var stateTaxAmt=taxableIncome*stateRate/100;
  var totalTax=fedTax+ssTax+medicareTax+stateTaxAmt;
  var takeHome=taxableIncome-totalTax;
  document.getElementById('takeHome').textContent=formatCurrency(takeHome);
  document.getElementById('takeHomeMonthly').textContent='Monthly: '+formatCurrency(takeHome/12);
  document.getElementById('gross').textContent=formatCurrency(salary);
  document.getElementById('totalTax').textContent=formatCurrency(totalTax);
  document.getElementById('taxRate').textContent='Effective Rate: '+(totalTax/salary*100).toFixed(1)+'%';
  var items=[
    {name:'Federal Income Tax',amt:fedTax},{name:'Social Security Tax (6.2%)',amt:ssTax},{name:'Medicare Tax (1.45%)',amt:medicareTax},{name:'State Income Tax',amt:stateTaxAmt}
  ];
  var tbody=document.getElementById('breakdownBody');
  tbody.innerHTML='';
  items.forEach(function(item){
    tbody.innerHTML+='<tr><td>'+item.name+'</td><td>'+formatCurrency(item.amt)+'</td><td>'+formatCurrency(item.amt/12)+'</td><td>'+(salary>0?(item.amt/salary*100).toFixed(1):'0.0')+'%</td></tr>';
  });
  tbody.innerHTML+='<tr><td>Total</td><td>'+formatCurrency(totalTax)+'</td><td>'+formatCurrency(totalTax/12)+'</td><td>'+(salary>0?(totalTax/salary*100).toFixed(1):'0.0')+'%</td></tr>';
  document.getElementById('breakdownSection').style.display='block';
  showToast('✅ Calculation Complete');
}
function clearAll(){
  document.getElementById('annualSalary').value='80000';
  document.getElementById('filingStatus').value='single';
  document.getElementById('retirement').value='0';
  document.getElementById('stateTax').value='5';
  document.getElementById('takeHome').textContent='$0';
  document.getElementById('takeHomeMonthly').textContent='';
  document.getElementById('gross').textContent='$0';
  document.getElementById('totalTax').textContent='$0';
  document.getElementById('taxRate').textContent='';
  document.getElementById('breakdownSection').style.display='none';
  showToast('🔄 Reset Complete');
}
function copyResults(){
  var lines=['Paycheck Tax Results','---',
    'Gross: '+document.getElementById('gross').textContent,
    'Total Tax: '+document.getElementById('totalTax').textContent+' ('+document.getElementById('taxRate').textContent+')',
    'Take-Home: '+document.getElementById('takeHome').textContent+' ('+document.getElementById('takeHomeMonthly').textContent+')'
  ];
  var rows=document.querySelectorAll('#breakdownBody tr');
  rows.forEach(function(r){lines.push(r.cells[0]?r.cells[0].textContent+': '+r.cells[1].textContent+'/yr':'')});
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('📋 Copied')}).catch(function(){showToast('Copy failed')});
}
calculate();
</script>
