  header a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 18px; }
  header span { color: var(--text2); font-size: 14px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

  .toolbar input[type="color"] { width: 36px; height: 36px; border: 2px solid var(--border); border-radius: 6px; cursor: pointer; padding: 2px; }
  .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

  #dotCanvas .dot { width: 24px; height: 24px; background: #fff; border-radius: 2px; cursor: pointer; transition: background .1s; }
  #dotCanvas .dot:hover { opacity: .8; }
  .color-palette { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

<body>
<header><a href="/en/">Free ToolBase</a><span>/ Dot Art Generator</span></header>
<main>
  <h1>🎨 Dot Art Generator</h1>
  <p class="subtitle">Click on the grid to draw pixel dot patterns. Export to PNG image.</p>
  <div class="tool-panel">
    <div class="toolbar">
      <select id="gridSize">
        <option value="16">16×16</option>
        <option value="24" selected>24×24</option>
        <option value="32">32×32</option>
        <option value="48">48×48</option>
      </select>
      <input type="color" id="paintColor" value="#4F46E5">
      <button id="fillBtn">🎨 Fill</button>
      <button id="eraseBtn">🧹 Erase</button>
      <button id="clearBtn">🗑 Clear</button>
      <button id="invertBtn">🔄 Invert</button>
      <button id="exportBtn" style="background:var(--primary);color:#fff;border-color:var(--primary);">📥 Export PNG</button>
    </div>
    <div class="color-palette" id="palette"></div>
    <div class="canvas-wrap"><div id="dotCanvas"></div></div>
  </div>
</main>
<footer>© 2025 Free ToolBase - Free Online Tools</footer>
<script>
const PALETTE_COLORS = ['#4F46E5','#ef4444','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899','#f97316','#84cc16','#14b8a6','#3b82f6','#6366f1','#000000','#ffffff','#94a3b8','#334155'];
let gridSize = 24;
let paintColor = '#4F46E5';
let mode = 'paint';
let grid = [];

function buildPalette() {
  const p = document.getElementById('palette');
  p.innerHTML = PALETTE_COLORS.map(c => 
    `<div class="swatch${c===paintColor?' selected':''}" style="background:${c}" data-color="${c}"></div>`
  ).join('');
  p.addEventListener('click', (e) => {
    const swatch = e.target.closest('.swatch');
    if (!swatch) return;
    paintColor = swatch.dataset.color;
    document.getElementById('paintColor').value = paintColor;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    swatch.classList.add('selected');
    mode = 'paint';
    document.getElementById('fillBtn').classList.remove('active');
    document.getElementById('eraseBtn').classList.remove('active');
  });
}

function buildGrid() {
  gridSize = parseInt(document.getElementById('gridSize').value);
  grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill('#ffffff'));
  const canvas = document.getElementById('dotCanvas');
  canvas.style.gridTemplateColumns = `repeat(${gridSize}, 24px)`;
  canvas.innerHTML = '';
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.dataset.row = r;
      dot.dataset.col = c;
      dot.addEventListener('mousedown', () => paintDot(r, c));
      dot.addEventListener('mouseenter', (e) => {
        if (e.buttons === 1) paintDot(r, c);
      });
      canvas.appendChild(dot);
    }
  }
}

function paintDot(r, c) {
  grid[r][c] = mode === 'erase' ? '#ffffff' : paintColor;
  updateDot(r, c);
}

function updateDot(r, c) {
  const canvas = document.getElementById('dotCanvas');
  canvas.children[r * gridSize + c].style.background = grid[r][c];
}

function updateAllDots() {
  const canvas = document.getElementById('dotCanvas');
  for (let r = 0; r < gridSize; r++)
    for (let c = 0; c < gridSize; c++)
      canvas.children[r * gridSize + c].style.background = grid[r][c];
}

document.getElementById('gridSize').addEventListener('change', buildGrid);
document.getElementById('paintColor').addEventListener('input', (e) => { paintColor = e.target.value; mode = 'paint'; document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected')); document.getElementById('fillBtn').classList.remove('active'); document.getElementById('eraseBtn').classList.remove('active'); });
document.getElementById('fillBtn').addEventListener('click', () => { mode = 'paint'; document.getElementById('fillBtn').classList.add('active'); document.getElementById('eraseBtn').classList.remove('active'); });
document.getElementById('eraseBtn').addEventListener('click', () => { mode = 'erase'; document.getElementById('eraseBtn').classList.add('active'); document.getElementById('fillBtn').classList.remove('active'); });
document.getElementById('clearBtn').addEventListener('click', () => { grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill('#ffffff')); updateAllDots(); });
document.getElementById('invertBtn').addEventListener('click', () => {
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (grid[r][c] !== '#ffffff') {
        const hex = grid[r][c].replace('#','');
        const r2 = 255 - parseInt(hex.substring(0,2), 16);
        const g = 255 - parseInt(hex.substring(2,4), 16);
        const b = 255 - parseInt(hex.substring(4,6), 16);
        grid[r][c] = '#' + [r2,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
      }
    }
  }
  updateAllDots();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const size = gridSize * 24;
  const offCanvas = document.createElement('canvas');
  offCanvas.width = size;
  offCanvas.height = size;
  const ctx = offCanvas.getContext('2d');
  for (let r = 0; r < gridSize; r++)
    for (let c = 0; c < gridSize; c++) {
      ctx.fillStyle = grid[r][c];
      ctx.fillRect(c * 24, r * 24, 24, 24);
    }
  const link = document.createElement('a');
  link.download = `dot-art-${gridSize}x${gridSize}.png`;
  link.href = offCanvas.toDataURL();
  link.click();
});

buildPalette();
buildGrid();
</script>
</body>
