var currentCategory = 'all';
var history = [];
var MAX_HISTORY = 10;

function getRandomMotto(cat){
  if(cat === 'all'){
    var all = [];
    Object.keys(mottoes).forEach(function(k){all = all.concat(mottoes[k])});
    return all[Math.floor(Math.random()*all.length)];
  }
  var list = mottoes[cat];
  return list[Math.floor(Math.random()*list.length)];
}

function getCategoryName(cat){
  var map = {all:'All',inspiration:'Inspiration',life:'Life',success:'Success',wisdom:'Wisdom',english:'Chinese Wisdom'};
  return map[cat] || cat;
}

function displayMotto(motto, cat){
  document.getElementById('mottoText').textContent = motto.zh;
  document.getElementById('mottoText').className = 'motto-text en';
  document.getElementById('mottoAuthor').textContent = '— ' + (motto.author || 'Unknown');
  document.getElementById('mottoCat').textContent = getCategoryName(cat);
}

function addHistory(motto, cat){
  var entry = {text:motto.zh, author:motto.author, cat:cat, time:new Date().toLocaleTimeString()};
  history.unshift(entry);
  if(history.length > MAX_HISTORY) history.pop();
  renderHistory();
}

function renderHistory(){
  var section = document.getElementById('historySection');
  var list = document.getElementById('historyList');
  if(history.length === 0){
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  var html = '';
  history.forEach(function(h,i){
    html += '<div class="history-item">';
    html += '<span class="text">'+h.text+'</span>';
    html += '<button class="copy-btn" onclick="copyHistory('+i+')">Copy</button>';
    html += '</div>';
  });
  list.innerHTML = html;
}

function generateMotto(){
  var motto = getRandomMotto(currentCategory);
  displayMotto(motto, currentCategory);
  addHistory(motto, currentCategory);
  var el = document.getElementById('mottoText');
  el.style.opacity = '0';
  el.style.transform = 'translateY(10px)';
  setTimeout(function(){
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  },50);
}

function showToast(msg, type){
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){toast.className='toast'},2000);
}

function copyHistory(i){
  var entry = history[i];
  var text = entry.text + (entry.author ? ' — '+entry.author : '');
  copyToClipboard(text);
}

function copyToClipboard(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){showToast('Copied!','success')});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied!','success');
  }
}

document.getElementById('btnGenerate').addEventListener('click', generateMotto);
document.getElementById('btnCopy').addEventListener('click', function(){
  var text = document.getElementById('mottoText').textContent;
  var author = document.getElementById('mottoAuthor').textContent.replace('— ','');
  copyToClipboard(text + (author ? ' — '+author : ''));
});
document.getElementById('btnShare').addEventListener('click', function(){
  var text = document.getElementById('mottoText').textContent;
  var author = document.getElementById('mottoAuthor').textContent.replace('— ','');
  var shareText = '💎 '+text + (author ? ' — '+author : '') + '\n\n— via Free ToolBase Motto Generator';
  if(navigator.share){
    navigator.share({title:'Motto',text:shareText}).catch(function(){});
  } else {
    copyToClipboard(shareText);
    showToast('Share text copied!','success');
  }
});
document.getElementById('catTabs').addEventListener('click', function(e){
  if(e.target.classList.contains('cat-chip')){
    var chips = document.querySelectorAll('.cat-chip');
    chips.forEach(function(c){c.classList.remove('active')});
    e.target.classList.add('active');
    currentCategory = e.target.dataset.cat;
    generateMotto();
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === ' ' && e.target === document.body){
    e.preventDefault();
    generateMotto();
  }
});

generateMotto();
</script>
