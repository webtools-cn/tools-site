 let currentMode = 'decode';

 function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

 const inputArea = document.getElementById('inputArea');
 const outputBox = document.getElementById('outputBox');
 const convertBtn = document.getElementById('convertBtn');
 const copyBtn = document.getElementById('copyBtn');
 const clearBtn = document.getElementById('clearBtn');

 document.querySelectorAll('.mode-btn').forEach(btn => {
 btn.addEventListener('click', () => {
 document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 currentMode = btn.dataset.mode;
 if (currentMode === 'decode') inputArea.placeholder = '';
 else if (currentMode === 'encode') inputArea.placeholder = 'Enter plain text, e.g. Hello World';
 else inputArea.placeholder = 'Enter a single character, e.g. 😀';
 });
 });

 function decodeUnicode(str) {
 // Match: \uXXXX, U+XXXX, &#xXXXX;, &#XXXX;, %uXXXX
 return str
 .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
 .replace(/\\u\{([0-9a-fA-F]+)\}/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
 .replace(/U\+([0-9a-fA-F]{4,6})/gi, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
 .replace(/&#x([0-9a-fA-F]+);/gi, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
 .replace(/&#(\d+);/g, (_, dec) => String.fromCodePoint(parseInt(dec, 10)))
 .replace(/%u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)));
 }

 function encodeUnicode(str) {
 let result = '';
 for (const ch of str) {
 const cp = ch.codePointAt(0);
 if (cp > 127) {
 result += '\\u' + cp.toString(16).toUpperCase().padStart(4, '0');
 } else {
 result += ch;
 }
 }
 return result;
 }

 function encodeFullUnicode(str) {
 let result = '';
 for (const ch of str) {
 const cp = ch.codePointAt(0);
 result += 'U+' + cp.toString(16).toUpperCase().padStart(4, '0') + ' ';
 }
 return result.trim();
 }

 if (ch.length === 0) return 'PleaseInputcharacter''0''0')}\n`;

 info += `UTF-8byte: `;

 bytes.forEach(b => info += b.toString(16).toUpperCase().padStart(2, '0') + ' ');
 try { info += `\ncharactername: ${require ? '''bigwritecharcharacter', Ll: '', Lt: 'first letterbigwrite', Lm: '', Lo: '',

 if (cp >= 0x3040 && cp <= 0x309F) return '';
 if (cp >= 0x30A0 && cp <= 0x30FF) return '';

 if (cp >= 0x1F300 && cp <= 0x1F5FF) return '';
 if (cp >= 0x1F680 && cp <= 0x1F6FF) return '';
 return '';
 }

 function convert() {
 const text = inputArea.value.trim();
 if (!text) { outputBox.textContent = 'PleaseInput Text'; return; }
 let result;
 if (currentMode === 'decode') {
 result = decodeUnicode(text);
 } else if (currentMode === 'encode') {
 result = encodeUnicode(text) + '\n\n--- U+ Format ---\n' + encodeFullUnicode(text);
 } else {
 result = charInfo(text[0] || '');
 }
 outputBox.textContent = result;
 }
