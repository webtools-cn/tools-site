  <style>
    :root {
      --primary: #4F46E5; --primary-light: #EEF2FF; --bg: #f8fafc; --surface: #fff;
      --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
      --error: #ef4444; --success: #22c55e; --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav a { color: var(--text-secondary); text-decoration: none; margin-left: 16px; font-size: .9rem; }
    header nav a:hover { color: var(--primary); }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--text-secondary); font-size: .9rem; margin-bottom: 20px; }
    .config-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .config-section h3 { font-size: 1rem; margin-bottom: 12px; color: var(--primary); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: .8rem; font-weight: 600; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .85rem; font-family: inherit;
    }
    .endpoint-card { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; position: relative; }
    .endpoint-card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .endpoint-card .row select, .endpoint-card .row input { flex: 1; min-width: 100px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: .82rem; }
    .endpoint-card .row select { flex: 0 0 auto; width: 100px; }
    .endpoint-card .remove-btn { position: absolute; top: 8px; right: 8px; background: var(--error); color: #fff; border: none; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-size: .75rem; display: flex; align-items: center; justify-content: center; }
    .btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: .85rem; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 500; }
    .btn-primary:hover { opacity: .9; }
    .btn:hover { background: var(--primary-light); }
    .output-area { margin-top: 12px; }
    .output-area textarea { width: 100%; min-height: 300px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Fira Code', monospace; font-size: .8rem; background: #1e1e2e; color: #cdd6f4; resize: vertical; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: var(--radius); font-size: .85rem; opacity: 0; transform: translateY(10px); transition: all .3s; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }
    footer { text-align: center; padding: 20px; color: var(--text-secondary); font-size: .8rem; border-top: 1px solid var(--border); margin-top: 30px; }

</style>
<link rel="canonical" href="https://free-toolbase.com/en/postman-collection-generator/">
<meta property="og:image" content="https://free-toolbase.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="zh" href="https://free-toolbase.com/postman-collection-generator/">
<link rel="alternate" hreflang="en" href="https://free-toolbase.com/en/postman-collection-generator/">
<link rel="alternate" hreflang="x-default" href="https://free-toolbase.com/en/postman-collection-generator/">

</head>
<body>
<header>
  <a href="/en/" class="logo">Free ToolBase</a>
  <nav><a href="/en/">Home</a><a href="/">中文</a></nav>
</header>
<div class="container">
  <h1>Postman Collection Generator</h1>
  <p class="subtitle">Visually configure API endpoints and generate standard Postman Collection v2.1 JSON instantly.</p>

  <div class="config-section">
    <h3>Collection Info</h3>
    <div class="form-grid">
      <div class="form-group"><label>Collection Name</label><input id="colName" value="My API" placeholder="My API"></div>
      <div class="form-group"><label>Version</label><input id="colVersion" value="1.0.0" placeholder="1.0.0"></div>
      <div class="form-group"><label>Description</label><input id="colDesc" value="API Collection" placeholder="Description"></div>
      <div class="form-group"><label>Base URL</label><input id="baseUrl" value="https://api.example.com" placeholder="https://api.example.com"></div>
    </div>
  </div>

  <div class="config-section">
    <h3>Global Headers <button class="btn" onclick="addHeader()" style="margin-left:8px;font-size:.75rem;">+ Add</button></h3>
    <div id="headersList"></div>
  </div>

  <div class="config-section">
    <h3>API Endpoints <button class="btn btn-primary" onclick="addEndpoint()" style="margin-left:8px;">+ Add Endpoint</button></h3>
    <div id="endpointsList"></div>
  </div>

  <div style="display:flex;gap:8px;margin:12px 0;">
    <button class="btn btn-primary" onclick="generate()">Generate JSON</button>
    <button class="btn" onclick="copyOutput()">Copy</button>
    <button class="btn" onclick="downloadJSON()">Download .json</button>
  </div>

  <div class="output-area">
    <textarea id="output" placeholder='Click "Generate JSON" to see result...' readonly></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>
<footer>Free ToolBase &copy; 2024 — All processing is client-side</footer>

<script>
let endpointId = 0;
let headerId = 0;

function addHeader() {
  const container = document.getElementById('headersList');
  const id = headerId++;
  container.insertAdjacentHTML('beforeend', `<div class="row" style="margin-bottom:4px;gap:6px;" id="hdr-${id}">
    <input placeholder="Key (e.g. Authorization)" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:.82rem;">
    <input placeholder="Value (e.g. Bearer token)" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:.82rem;">
    <button class="btn" onclick="document.getElementById('hdr-${id}').remove()" style="padding:4px 8px;font-size:.7rem;color:var(--error);">✕</button>
  </div>`);
}

function addEndpoint() {
  const container = document.getElementById('endpointsList');
  const id = endpointId++;
  container.insertAdjacentHTML('beforeend', `<div class="endpoint-card" id="ep-${id}">
    <button class="remove-btn" onclick="document.getElementById('ep-${id}').remove()">✕</button>
    <div class="row">
      <select><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select>
      <input placeholder="Path (e.g. /users)" value="/users" style="flex:2;">
      <input placeholder="Name (e.g. Get Users)" value="Get Users" style="flex:2;">
    </div>
    <div style="display:flex;gap:6px;margin-top:6px;">
      <input placeholder="Description (optional)" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:.8rem;">
    </div>
  </div>`);
}

function getHeaders() {
  const headers = [];
  document.querySelectorAll('#headersList > div').forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value.trim()) {
      headers.push({ key: inputs[0].value.trim(), value: inputs[1].value.trim() });
    }
  });
  return headers;
}

function getEndpoints() {
  const endpoints = [];
  document.querySelectorAll('#endpointsList > div').forEach(card => {
    const selects = card.querySelectorAll('select');
    const inputs = card.querySelectorAll('input');
    endpoints.push({
      method: selects[0].value,
      path: inputs[0].value.trim(),
      name: inputs[1].value.trim(),
      description: inputs.length > 2 ? inputs[2].value.trim() : ''
    });
  });
  return endpoints;
}

function generate() {
  const colName = document.getElementById('colName').value || 'My API';
  const version = document.getElementById('colVersion').value || '1.0.0';
  const desc = document.getElementById('colDesc').value || '';
  const baseUrl = document.getElementById('baseUrl').value || 'https://api.example.com';
  const headers = getHeaders();
  const endpoints = getEndpoints();

  const items = endpoints.map((ep, i) => {
    const url = baseUrl.replace(/\/$/, '') + (ep.path.startsWith('/') ? ep.path : '/' + ep.path);
    return {
      name: ep.name || 'Request ' + (i + 1),
      request: {
        method: ep.method,
        header: [
          ...headers.map(h => ({ key: h.key, value: h.value, type: 'text' })),
          { key: 'Accept', value: 'application/json', type: 'text' }
        ],
        url: {
          raw: url,
          protocol: url.startsWith('https') ? 'https' : 'http',
          host: [url.replace(/https?:\/\//, '').split('/')[0]],
          path: url.replace(/https?:\/\/[^/]+/, '').split('/').filter(Boolean)
        },
        description: ep.description || ''
      },
      response: []
    };
  });

  const collection = {
    info: {
      name: colName,
      description: desc,
      schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json',
      version: { major: parseInt(version.split('.')[0]) || 1, minor: parseInt(version.split('.')[1]) || 0, patch: parseInt(version.split('.')[2]) || 0 }
    },
    item: items
  };

  document.getElementById('output').value = JSON.stringify(collection, null, 2);
  showToast('Generated! Collection has ' + items.length + ' endpoints');
}

function copyOutput() {
  const output = document.getElementById('output').value;
  if (!output) { showToast('Generate first'); return; }
  navigator.clipboard.writeText(output).then(() => showToast('Copied!'));
}

function downloadJSON() {
  const output = document.getElementById('output').value;
  if (!output) { showToast('Generate first'); return; }
  const blob = new Blob([output], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'postman-collection.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('Downloaded!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

addHeader();
document.querySelector('#headersList input[placeholder*="Key"]').value = 'Authorization';
document.querySelector('#headersList input[placeholder*="Value"]').value = 'Bearer YOUR_TOKEN';
addEndpoint();
addEndpoint();
document.querySelectorAll('#endpointsList input[placeholder="Path"]')[1].value = '/users/:id';
document.querySelectorAll('#endpointsList input[placeholder="Name"]')[1].value = 'Get Single User';
document.querySelectorAll('#endpointsList select')[1].value = 'GET';
</script>
</body>
</html>
