var allEmojis = [];
var catNames = Object.keys(categories);

catNames.forEach(function(cat){
  categories[cat].forEach(function(emoji){
    allEmojis.push({emoji: emoji, category: cat});
  });
});

var tabsEl = document.getElementById('categoryTabs');
tabsEl.innerHTML = '<button class="active" data-cat="all">All</button>';
catNames.forEach(function(cat){
  tabsEl.innerHTML += '<button data-cat="'+cat+'">'+cat+'</button>';
});

var recent = [];
try { recent = JSON.parse(localStorage.getItem('emoji_recent') || '[]'); } catch(e){ recent = []; }
function updateRecent(){
  var el = document.getElementById('recentEmojis');
  if(recent.length === 0){ el.innerHTML = 'None'; return; }
  el.innerHTML = recent.slice(0, 12).map(function(e){
    return '<span class="emoji-item" style="display:inline-flex;margin:2px" onclick="copyEmoji(\''+e+'\')">'+e+'</span>';
  }).join('');
}
updateRecent();

function addRecent(emoji){
  recent = recent.filter(function(e){ return e !== emoji; });
  recent.unshift(emoji);
  if(recent.length > 20) recent = recent.slice(0, 20);
  try { localStorage.setItem('emoji_recent', JSON.stringify(recent)); } catch(e){}
  updateRecent();
}

function copyEmoji(emoji){
  navigator.clipboard.writeText(emoji).then(function(){
    var toast = document.getElementById('copiedToast');
    toast.textContent = emoji + ' Copied!';
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 800);
    addRecent(emoji);
  })["catch"](function(){
    var ta = document.createElement('textarea');
    ta.value = emoji;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    var toast = document.getElementById('copiedToast');
    toast.textContent = emoji + ' Copied!';
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 800);
    addRecent(emoji);
  });
}

var currentCat = 'all';
var currentSearch = '';

function renderGrid(){
  var grid = document.getElementById('emojiGrid');
  var noRes = document.getElementById('noResults');
  var filtered = allEmojis;

  if(currentCat !== 'all'){
    filtered = filtered.filter(function(e){ return e.category === currentCat; });
  }
  if(currentSearch){
    var q = currentSearch.toLowerCase();
    filtered = filtered.filter(function(e){
      return e.emoji.includes(q) || e.category.toLowerCase().includes(q);
    });
  }

  if(filtered.length === 0){
    grid.innerHTML = '';
    noRes.style.display = 'block';
  } else {
    noRes.style.display = 'none';
    grid.innerHTML = filtered.map(function(e){
      return '<div class="emoji-item" onclick="copyEmoji(\''+e.emoji+'\')" title="'+e.category+'">'+e.emoji+'</div>';
    }).join('');
  }
}

renderGrid();

tabsEl.addEventListener('click', function(e){
  if(e.target.tagName === 'BUTTON'){
    document.querySelectorAll('#categoryTabs button').forEach(function(b){ b.classList.remove('active'); });
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderGrid();
  }
});

document.getElementById('searchInput').addEventListener('input', function(){
  currentSearch = this.value;
  renderGrid();
});
