<div class="container">

</header>
<div class="input-section" id="app">
<h2>HEX → HSV</h2>
<label>HEX Color Value</label>
<div style="display:flex;gap:8px;align-items:flex-end">
<input type="text" id="hex-input" placeholder="#06b6d4" style="flex:1">
<input type="color" id="color-picker" value="#06b6d4" style="width:42px;height:42px;padding:2px;background:#0f172a;border:1px solid rgba(148,163,184,.2);border-radius:8px;cursor:pointer;margin-bottom:12px">
</div>

<button class="btn btn-primary" id="btn-convert">Use Now</button>
</div>

<div>
<div class="info-row"><span>HSV:</span><strong id="hsv-val" style="color:#22d3ee">H:191 S:97% V:83%</strong></div>
<div class="info-row"><span>H:</span><strong id="h-only" style="color:#94a3b8">191°</strong> <span>S:</span><strong id="s-only" style="color:#94a3b8">97%</strong> <span>V:</span><strong id="v-only" style="color:#94a3b8">83%</strong></div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板 / Copied!')}).catch(function(){showToast('复制失败 / Copy failed')})}

function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];var r=parseInt(hex.substring(0,2),16);var g=parseInt(hex.substring(2,4),16);var b=parseInt(hex.substring(4,6),16);return{r:r,g:g,b:b}}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b);var d=max-min;var h=0;if(d===0)h=0;else if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;var s=max===0?0:(d/max)*100;var v=max*100;return{h:h,s:Math.round(s),v:Math.round(v)}}
function convert(hex){
  if(!/^#?[0-9a-fA-F]{3,6}$/.test(hex)){showToast('请输入有效的HEX颜色值');return}
  var rgb=hexToRgb(hex);
  var hsv=rgbToHsv(rgb.r,rgb.g,rgb.b);
  var fullHex='#'+[rgb.r,rgb.g,rgb.b].map(function(x){var h=x.toString(16);return h.length===1?'0'+h:h}).join('');
  document.getElementById('preview').style.backgroundColor=fullHex;
  document.getElementById('hex-input').value=fullHex;
  document.getElementById('color-picker').value=fullHex;
  document.getElementById('hsv-val').textContent='H:'+hsv.h+' S:'+hsv.s+'% V:'+hsv.v+'%';
  document.getElementById('h-only').textContent=hsv.h+'°';
  document.getElementById('s-only').textContent=hsv.s+'%';
  document.getElementById('v-only').textContent=hsv.v+'%';
}
document.getElementById('btn-convert').addEventListener('click',function(){convert(document.getElementById('hex-input').value)});
document.getElementById('hex-input').addEventListener('keydown',function(e){if(e.key==='Enter')convert(this.value)});
document.getElementById('color-picker').addEventListener('input',function(){document.getElementById('hex-input').value=this.value;convert(this.value)});
document.getElementById('btn-copy-hsv').addEventListener('click',function(){copyText(document.getElementById('hsv-val').textContent)});
convert('#06b6d4');

</script>
