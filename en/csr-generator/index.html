<script>
(function(){
var toast=document.getElementById('toast');
function showToast(msg){
toast.textContent=msg;toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show');},2000);
}

var btnGenerate=document.getElementById('btnGenerate');
var outputSection=document.getElementById('outputSection');
var warningBox=document.getElementById('warningBox');
var csrOutput=document.getElementById('csrOutput');
var keyOutput=document.getElementById('keyOutput');
var privateKeyPem=null;

function arrayBufferToBase64(buffer){
var binary='';
var bytes=new Uint8Array(buffer);
for(var i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
return btoa(binary);
}

function pemEncode(der,label){
var b64=arrayBufferToBase64(der);
var lines=[];
lines.push('-----BEGIN '+label+'-----');
for(var i=0;i<b64.length;i+=64)lines.push(b64.substring(i,i+64));
lines.push('-----END '+label+'-----');
return lines.join('\n');
}

function generateSubject(){
var fields=[];
var cn=document.getElementById('cn').value.trim();
if(cn)fields.push({type:'commonName',value:cn});
var c=document.getElementById('country').value.trim().toUpperCase();
if(c)fields.push({type:'countryName',value:c});
var st=document.getElementById('state').value.trim();
if(st)fields.push({type:'stateOrProvinceName',value:st});
var city=document.getElementById('city').value.trim();
if(city)fields.push({type:'localityName',value:city});
var org=document.getElementById('org').value.trim();
if(org)fields.push({type:'organizationName',value:org});
var ou=document.getElementById('orgUnit').value.trim();
if(ou)fields.push({type:'organizationalUnitName',value:ou});
var email=document.getElementById('email').value.trim();
if(email)fields.push({type:'emailAddress',value:email});
return fields;
}

function encodeDERLength(len){
if(len<128)return new Uint8Array([len]);
var temp=[];
var l=len;
while(l>0){temp.unshift(l&0xFF);l>>>=8;}
var result=new Uint8Array(temp.length+1);
result[0]=0x80|temp.length;
result.set(temp,1);
return result;
}

function encodeOID(oid){
var parts=oid.split('.').map(Number);
var result=[40*parts[0]+parts[1]];
for(var i=2;i<parts.length;i++){
var v=parts[i];
if(v<128){result.push(v);continue;}
var bytes=[];
while(v>0){bytes.unshift(v&0x7F);v>>>=7;}
for(var j=0;j<bytes.length-1;j++)bytes[j]|=0x80;
result=result.concat(bytes);
}
return new Uint8Array(result);
}

function encodeDER(tag,value){
var header=new Uint8Array(2);
header[0]=tag;
var len=encodeDERLength(value.length);
var result=new Uint8Array(2+len.length+value.length);
result[0]=tag;
result.set(len,1);
result.set(value,1+len.length);
return result;
}

function encodeName(fields){
var rdns=[];
for(var i=0;i<fields.length;i++){
var f=fields[i];
var oidMap={commonName:'2.5.4.3',countryName:'2.5.4.6',stateOrProvinceName:'2.5.4.8',localityName:'2.5.4.7',organizationName:'2.5.4.10',organizationalUnitName:'2.5.4.11',emailAddress:'1.2.840.113549.1.9.1'};
var oid=oidMap[f.type];
var oidEncoded=encodeOID(oid);
var oidDER=encodeDER(0x06,oidEncoded);
var valueBytes=new TextEncoder().encode(f.value);
var valueDER;
if(f.type==='emailAddress'){
valueDER=encodeDER(0x16,valueBytes);
}else{
var utf8Tag=new Uint8Array([0x0C]);
var utf8DER=encodeDER(0x0C,valueBytes);
valueDER=utf8DER;
}
var setContent=new Uint8Array(oidDER.length+valueDER.length);
setContent.set(oidDER,0);
setContent.set(valueDER,oidDER.length);
var setDER=encodeDER(0x31,setContent);
rdns.push(setDER);
}
var totalLen=rdns.reduce(function(sum,r){return sum+r.length;},0);
var seq=new Uint8Array(totalLen);
var offset=0;
for(var j=0;j<rdns.length;j++){seq.set(rdns[j],offset);offset+=rdns[j].length;}
return encodeDER(0x30,seq);
}

function generateCSR(){
var cn=document.getElementById('cn').value.trim();
if(!cn){showToast('');return;}
btnGenerate.disabled=true;
btnGenerate.textContent='';

var keySize=parseInt(document.getElementById('keySize').value);
var subtle=window.crypto.subtle;

subtle.generateKey({name:'RSASSA-PKCS1-v1_5',modulusLength:keySize,publicExponent:new Uint8Array([0x01,0x00,0x01]),hash:'SHA-256'},true,['sign','verify'])
.then(function(keyPair){
return subtle.exportKey('pkcs8',keyPair.privateKey).then(function(pkcs8){
var pkcs8Bytes=new Uint8Array(pkcs8);
privateKeyPem=pemEncode(pkcs8Bytes,'PRIVATE KEY');

return subtle.exportKey('spki',keyPair.publicKey).then(function(spki){
var spkiBytes=new Uint8Array(spki);

var subjectFields=generateSubject();
var nameDER=encodeName(subjectFields);

var spkiSeq=parseDER(spkiBytes);
var infoContent=new Uint8Array(4+nameDER.length+spkiSeq.length);
infoContent[0]=0x02;infoContent[1]=0x01;infoContent[2]=0x00;
infoContent.set(nameDER,3);
var spkiOffset=3+nameDER.length;
infoContent.set(spkiSeq,spkiOffset);

var infoDER=encodeDER(0x30,infoContent);
var sigAlgoDER=encodeDER(0x30,new Uint8Array([0x06,0x09,0x2A,0x86,0x48,0x86,0xF7,0x0D,0x01,0x01,0x0B,0x05,0x00]));

var tbsData=infoContent;
var signAlgo={name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'};
return subtle.sign(signAlgo,keyPair.privateKey,tbsData).then(function(signature){
var sigBytes=new Uint8Array(signature);
var sigBitString=new Uint8Array(sigBytes.length+1);
sigBitString[0]=0x00;
sigBitString.set(sigBytes,1);
var sigDER=encodeDER(0x03,sigBitString);

var csrContent=new Uint8Array(infoDER.length+sigAlgoDER.length+sigDER.length);
csrContent.set(infoDER,0);
csrContent.set(sigAlgoDER,infoDER.length);
csrContent.set(sigDER,infoDER.length+sigAlgoDER.length);

var csrDER=encodeDER(0x30,csrContent);
csrOutput.value=pemEncode(csrDER,'CERTIFICATE REQUEST');
keyOutput.value=privateKeyPem;
outputSection.style.display='block';
warningBox.style.display='block';
showToast('CSR generated successfully!');
btnGenerate.disabled=false;
btnGenerate.textContent='Generate CSR';
}).catch(function(err){
showToast('Signing failed: '+err.message);
btnGenerate.disabled=false;
btnGenerate.textContent='Generate CSR';
});
});
});
}).catch(function(err){
showToast('Generation failed: '+err.message);
btnGenerate.disabled=false;
btnGenerate.textContent='Generate CSR';
});
}

function parseDER(bytes){
var offset=0;
function readLength(){
var len=bytes[offset++];
if(len<128)return len;
var numBytes=len&0x7F;
var result=0;
for(var i=0;i<numBytes;i++)result=(result<<8)|bytes[offset++];
return result;
}
var tag=bytes[offset++];
var len=readLength();
return bytes.slice(offset,offset+len);
}

btnGenerate.addEventListener('click',generateCSR);

document.getElementById('btnCopyCSR').addEventListener('click',function(){
if(!csrOutput.value){showToast('Please generate CSR first');return;}
navigator.clipboard.writeText(csrOutput.value).then(function(){showToast('CSR copied');})
.catch(function(){csrOutput.select();document.execCommand('copy');showToast('CSR copied');});
});

document.getElementById('btnCopyKey').addEventListener('click',function(){
if(!keyOutput.value){showToast('Please generate CSR first');return;}
navigator.clipboard.writeText(keyOutput.value).then(function(){showToast('Private key copied');})
.catch(function(){keyOutput.select();document.execCommand('copy');showToast('Private key copied');});
});

document.getElementById('btnDownload').addEventListener('click',function(){
if(!privateKeyPem){showToast('Please generate CSR first');return;}
var blob=new Blob([privateKeyPem],{type:'text/plain'});
var cn=document.getElementById('cn').value.trim()||'key';
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download=cn+'.key';
document.body.appendChild(a);a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
showToast('Private key downloaded');
});
})();
</script>
