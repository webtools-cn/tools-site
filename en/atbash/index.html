<script>
function atbash(text) {
  return [...text].map(ch => {
    if (ch >= 'A' && ch <= 'Z') return String.fromCharCode(90 - (ch.charCodeAt(0) - 65));
    if (ch >= 'a' && ch <= 'z') return String.fromCharCode(122 - (ch.charCodeAt(0) - 97));
    return ch;
  }).join('');
}

function showMapping() {
  const uppers = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const reversed = [...uppers].reverse();
  let html = 'A-Z → Z-A mapping:<br><strong>';
  for (let i = 0; i < 26; i++) {
    html += uppers[i] + '↔' + reversed[i] + ' ';
    if ((i+1) % 9 === 0) html += '</strong><br><strong>';
  }
  html += '</strong>';
  document.getElementById('mapping').innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('btnConvert').addEventListener('click', () => {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('Please enter text first'); return; }
  document.getElementById('output').textContent = atbash(input);
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('output').textContent;
  if (!text) { showToast('Nothing to copy'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '';
});

showMapping();
</script>
