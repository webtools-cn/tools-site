<style>:root{--primary:#4F46E5;--primary-dark:#3730a3;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text-secondary:#94a3b8;--border:#334155;--success:#10b981;--danger:#ef4444;--input-bg:#0f172a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;min-height:100vh}
a{color:#06b6d4;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:24px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;color:#f1f5f9}
.lang-switch a{color:var(--text-secondary);font-size:.875rem;padding:4px 12px;border:1px solid var(--border);border-radius:6px;transition:all .2s}

.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.card h2{font-size:1.1rem;margin-bottom:16px;color:#f1f5f9}

.form-group input{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--primary)}
.form-group select{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;transition:border-color .2s;appearance:none;cursor:pointer}
.form-group select:focus{outline:none;border-color:var(--primary)}
.input-row{display:flex;gap:12px;align-items:flex-end}
.input-row .form-group{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}

.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:.8rem}

<body>
<div class="container">
  <header class="header">
    <h1>🚗 Mileage Reimbursement Calculator</h1>
    <div class="lang-switch"><a href="/mileage-reimbursement-calculator/">中文</a></div>
  </header>

  <div class="card">
    <h2>Trip Records</h2>
    <div class="input-row">
      <div class="form-group">
        <label>Unit</label>
        <select id="unit"><option value="km">Kilometers (KM)</option><option value="mile">Miles</option></select>
      </div>
    </div>
    <div id="tripContainer">
      <div class="trip-row">
        <div class="trip-field"><label>From</label><input type="text" class="trip-from" placeholder="e.g. New York"></div>
        <div class="trip-field"><label>To</label><input type="text" class="trip-to" placeholder="e.g. Boston"></div>
        <div class="trip-field"><label>Distance</label><input type="number" class="trip-distance" placeholder="0" min="0" step="0.1"></div>
        <div class="trip-field"><label>Rate ($)</label><input type="number" class="trip-rate" placeholder="0.67" min="0" step="0.01" value="0.67"></div>
        <div class="trip-remove"></div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="addTrip()">➕ Add Trip</button>
      <button class="btn btn-primary" onclick="calculate()">📊 Calculate</button>
      <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>Reimbursement Summary</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="label">Trips</div>
        <div class="value" id="tripCount">0</div>
      </div>
      <div class="result-item">
        <div class="label">Total Distance</div>
        <div class="value" id="totalDistance">0</div>
      </div>
      <div class="result-item">
        <div class="label">Total Reimbursement</div>
        <div class="value highlight" id="totalAmount">$0.00</div>
      </div>
    </div>
    <div class="trip-detail" id="tripDetail"></div>
    <div class="btn-group">
      <button class="btn btn-secondary btn-sm" onclick="copyResult()">📋 Copy Results</button>
    </div>
  </div>

  <footer class="footer">
    &copy; 2024 Free ToolBase - All tools free to use
  </footer>
</div>
<div class="toast" id="toast"></div>
<script>
let tripCounter = 1;

function addTrip(){
  tripCounter++;
  const container = document.getElementById('tripContainer');
  const row = document.createElement('div');
  row.className = 'trip-row';
  row.innerHTML = `
    <div class="trip-field"><label>From</label><input type="text" class="trip-from" placeholder="e.g. New York"></div>
    <div class="trip-field"><label>To</label><input type="text" class="trip-to" placeholder="e.g. Boston"></div>
    <div class="trip-field"><label>Distance</label><input type="number" class="trip-distance" placeholder="0" min="0" step="0.1"></div>
    <div class="trip-field"><label>Rate ($)</label><input type="number" class="trip-rate" placeholder="0.67" min="0" step="0.01" value="0.67"></div>
    <div class="trip-remove"><button class="btn btn-danger btn-sm" onclick="this.closest('.trip-row').remove()">✕</button></div>
  `;
  container.appendChild(row);
}

function calculate(){
  const unit = document.getElementById('unit').value;
  const unitLabel = unit === 'km' ? 'km' : 'mi';
  let totalDistance = 0, totalAmount = 0;
  const rows = document.querySelectorAll('#tripContainer .trip-row');
  const details = [];
  let count = 0;

  rows.forEach((row) => {
    const from = row.querySelector('.trip-from').value || '-';
    const to = row.querySelector('.trip-to').value || '-';
    const dist = parseFloat(row.querySelector('.trip-distance').value) || 0;
    const rate = parseFloat(row.querySelector('.trip-rate').value) || 0;
    if(dist > 0){
      count++;
      const amount = dist * rate;
      totalDistance += dist;
      totalAmount += amount;
      details.push({from, to, dist, rate, amount});
    }
  });

  document.getElementById('tripCount').textContent = count;
  document.getElementById('totalDistance').textContent = totalDistance.toFixed(1) + ' ' + unitLabel;
  document.getElementById('totalAmount').textContent = '$' + totalAmount.toFixed(2);

  let detailHTML = '<table><thead><tr><th>From</th><th>To</th><th>Dist ('+unitLabel+')</th><th>Rate</th><th>Amount</th></tr></thead><tbody>';
  details.forEach(d => {
    detailHTML += '<tr><td>'+d.from+'</td><td>'+d.to+'</td><td>'+d.dist.toFixed(1)+'</td><td>$'+d.rate.toFixed(2)+'</td><td>$'+d.amount.toFixed(2)+'</td></tr>';
  });
  detailHTML += '</tbody></table>';
  document.getElementById('tripDetail').innerHTML = detailHTML;
  document.getElementById('resultCard').style.display = 'block';
}

function clearAll(){
  document.getElementById('tripContainer').innerHTML = `
    <div class="trip-row">
      <div class="trip-field"><label>From</label><input type="text" class="trip-from" placeholder="e.g. New York"></div>
      <div class="trip-field"><label>To</label><input type="text" class="trip-to" placeholder="e.g. Boston"></div>
      <div class="trip-field"><label>Distance</label><input type="number" class="trip-distance" placeholder="0" min="0" step="0.1"></div>
      <div class="trip-field"><label>Rate ($)</label><input type="number" class="trip-rate" placeholder="0.67" min="0" step="0.01" value="0.67"></div>
      <div class="trip-remove"></div>
    </div>
  `;
  document.getElementById('resultCard').style.display = 'none';
  tripCounter = 1;
}

function copyResult(){
  const total = document.getElementById('totalAmount').textContent;
  const dist = document.getElementById('totalDistance').textContent;
  const count = document.getElementById('tripCount').textContent;
  const text = 'Mileage Reimbursement Summary\nTrips: '+count+'\nTotal Distance: '+dist+'\nTotal: '+total;
  navigator.clipboard.writeText(text).then(() => showToast('✅ Copied to clipboard'));
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
</script>
</body>
</html>
