<body>
<div class="container">
  <div class="header"><h1>🔍 User Agent Parser</h1><div class="lang-switch"><a href="/user-agent/">CN</a><a href="/en/user-agent/" class="active">EN</a></div></div>
  <div class="nav-back"><a href="/en/">← Back to Home</a></div>
  <div class="hero"><p>Analyze browser UA strings — identify browser, OS, device</p><span class="badge">Dev Tool</span></div>
  <div class="section">
    <div class="form-group"><label for="uaInput">UA String (auto-filled with your current UA)</label><textarea id="uaInput"></textarea></div>
    <button class="btn" onclick="parse()">🔍 Analyze</button>
    <div class="result-grid" id="results"></div>
    <div class="current-ua" id="currentUa"></div>
  </div>
  <div class="footer">Free ToolBase © 2024 | Client-side only</div>
</div>
<script>
const ua=navigator.userAgent;document.getElementById('uaInput').value=ua;document.getElementById('currentUa').textContent='Your UA: '+ua;
function parse(){const u=document.getElementById('uaInput').value.trim();if(!u)return;
const info={};info['Browser']='Unknown';if(u.includes('Edg/')){info['Browser']='Edge '+((u.match(/Edg\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Firefox/')&&!u.includes('Seamonkey/')){info['Browser']='Firefox '+((u.match(/Firefox\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Chrome/')&&!u.includes('Edg/')&&!u.includes('OPR/')){info['Browser']='Chrome '+((u.match(/Chrome\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Safari/')&&!u.includes('Chrome/')){info['Browser']='Safari '+((u.match(/Version\/([\d.]+)/)||[])[1]||'')}else if(u.includes('OPR/')||u.includes('Opera/')){info['Browser']='Opera'}
info['OS']='Unknown';if(u.includes('Windows NT 10.0'))info['OS']='Windows 10/11';else if(u.includes('Windows NT 6.3'))info['OS']='Windows 8.1';else if(u.includes('Windows NT 6.1'))info['OS']='Windows 7';else if(u.includes('Mac OS X')){const m=u.match(/Mac OS X ([_\d]+)/);info['OS']='macOS '+(m?m[1].replace(/_/g,'.'):'')}else if(u.includes('Linux')&&u.includes('Android')){info['OS']='Android '+(u.match(/Android ([\d.]+)/)||[])[1]||''}else if(u.includes('Linux'))info['OS']='Linux';else if(u.includes('iPhone')||u.includes('iPad')){info['OS']='iOS'+(u.match(/OS ([\d_]+)/)?(u.match(/OS ([\d_]+)/)||[])[1].replace(/_/g,'.'):'')}
info['Device']='Desktop';if(u.includes('Mobile'))info['Device']='Mobile';else if(u.includes('Tablet')||u.includes('iPad'))info['Device']='Tablet';
info['Engine']='Unknown';if(u.includes('AppleWebKit'))info['Engine']='WebKit '+(u.match(/AppleWebKit\/([\d.]+)/)||[])[1]||'';else if(u.includes('Gecko/'))info['Engine']='Gecko '+(u.match(/Gecko\/([\d.]+)/)||[])[1]||'';
info['Arch']='Unknown';if(u.includes('x64')||u.includes('Win64')||u.includes('x86_64'))info['Arch']='x86_64';else if(u.includes('WOW64'))info['Arch']='x86 (32-bit)';else if(u.includes('arm64')||u.includes('aarch64'))info['Arch']='ARM64';
info['Language']=navigator.language||'Unknown';
let html='';for(const[k,v]of Object.entries(info)){html+=`<div class="result-item"><div class="label">${k}</div><div class="value">${v}</div></div>`}document.getElementById('results').innerHTML=html}
parse();
</script>

<script>
(function(){
  // 为所有result区域添加复制按钮
  var processed = new Set();
  function addCopyBtns(){
    var results = document.querySelectorAll('[id*="result"],[id*="Result"],[id*="output"],[id*="Output"],[class*="result"],[class*="output"]');
    results.forEach(function(el){
      if(processed.has(el)) return;
      if(el.querySelector('.copy-btn')) return;
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') return;
      if(el.children.length===0 && el.textContent.trim().length<5) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '📋 复制';
      btn.title = '复制结果';
      btn.onclick = function(e){
        e.stopPropagation();
        var text = el.textContent || el.value || '';
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') text = el.value;
        navigator.clipboard.writeText(text.trim()).then(function(){
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        }).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = text.trim();
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.innerHTML = '✅ 已复制';
          btn.classList.add('copied');
          setTimeout(function(){btn.innerHTML='📋 复制';btn.classList.remove('copied');},2000);
        });
      };
      el.appendChild(btn);
      processed.add(el);
    });
  }
  // Run initially
  addCopyBtns();
  // Re-run after button clicks (most tools update results on click)
  document.addEventListener('click', function(){setTimeout(addCopyBtns,100);});
  // Observe DOM changes
  if(window.MutationObserver){
    var obs = new MutationObserver(function(){addCopyBtns();});
    obs.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
