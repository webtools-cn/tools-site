<body>
<main class="container">
<div class="nav-back"><a href="/">🏠 Home</a> › <a href="/#tools">Tools</a> › <span>Insulin Dosage Calculator</span></div>
<div class="hero">
  <span style="font-size:2rem">💉</span>
  <div><h1 style="font-size:1.5rem;color:#f1f5f9;margin-bottom:4px">Insulin Dosage Calculator</h1>
  <p>Calculate insulin dose from carb intake and blood glucose</p></div>
  <span class="badge">🛡️ Client-side Only</span>
</div>
<div class="disclaimer">⚠️ <strong>Medical Disclaimer:</strong> This calculator is for reference only. Not a substitute for professional medical advice. Insulin adjustments must be supervised by a doctor.</div>
<div class="calculator-section">
  <h2>🍽️ Meal Info</h2>
  <div class="input-grid">
    <div class="input-group"><label>Meal Carbs (grams)</label><input type="number" id="carbs" value="60" min="0" step="1"><span class="hint">Planned carb intake in grams</span></div>
    <div class="input-group"><label>Insulin-to-Carb Ratio</label><input type="number" id="icr" value="15" min="1" step="1"><span class="hint">Grams of carbs per unit of insulin</span></div>
  </div>
</div>
<div class="calculator-section">
  <h2>🩸 Blood Glucose Data</h2>
  <div class="unit-toggle">
    <button class="active" id="unitMgdl" onclick="setUnit('mgdl')">mg/dL</button>
    <button id="unitMmol" onclick="setUnit('mmol')">mmol/L</button>
  </div>
  <div class="input-grid">
    <div class="input-group"><label>Current BG</label><input type="number" id="currentBg" value="180" min="0" step="1"><span class="hint" id="currentBgHint">Normal fasting: 70-100 mg/dL</span></div>
    <div class="input-group"><label>Target BG</label><input type="number" id="targetBg" value="100" min="0" step="1"><span class="hint" id="targetBgHint">Typical target: 80-130 mg/dL</span></div>
    <div class="input-group"><label>Insulin Sensitivity Factor</label><input type="number" id="isf" value="50" min="1" step="1"><span class="hint" id="isfHint">mg/dL drop per unit of insulin</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">🔍 Calculate Dose</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear & Reset</button>
    <button class="btn btn-danger" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid">
  <div class="result-card highlight"><div class="label">💉 Total Insulin Dose</div><div class="value" id="totalDose">0</div><div class="sub">units (U)</div></div>
  <div class="result-card"><div class="label">🍚 Meal Dose</div><div class="value" id="mealDose">0</div><div class="sub" id="mealDetail">To cover carbs</div></div>
  <div class="result-card"><div class="label">⚡ Correction Dose</div><div class="value" id="correctionDose">0</div><div class="sub" id="correctionDetail">To correct high BG</div></div>
</div>
<div class="calculator-section" id="breakdownSection" style="display:none">
  <h2>📋 Dose Details</h2>
  <table class="breakdown-table">
    <thead><tr><th>Item</th><th>Value</th><th>Formula</th></tr></thead>
    <tbody id="breakdownBody"></tbody>
  </table>
</div>
<div class="info-section">
  <h2>📘 Insulin Dosing Guide</h2>
  <h3>Meal insulin = Carbs ÷ ICR</h3><p>Example: 60g carbs ÷ ICR 15 = 4 units</p>
  <h3>Correction insulin = (Current BG - Target BG) ÷ ISF</h3><p>Example: (180 - 100) ÷ 50 = 1.6 units</p>
  <h3>Total Dose = Meal + Correction</h3><p>If BG is below target, correction is negative and total dose is reduced.</p>
  <h3>Important Notes</h3><p>ICR and ISF vary by individual and must be determined by a doctor. Monitor BG regularly and adjust parameters under medical guidance.</p>
</div>

<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a> · <a href="/privacy/">Privacy</a></p>

<script>
var currentUnit='mgdl';
function setUnit(u){
  currentUnit=u;
  document.getElementById('unitMgdl').classList.toggle('active',u==='mgdl');
  document.getElementById('unitMmol').classList.toggle('active',u==='mmol');
  var bgInput=document.getElementById('currentBg');
  var targetInput=document.getElementById('targetBg');
  var isfInput=document.getElementById('isf');
  if(u==='mmol'){
    if(parseFloat(bgInput.value)>50)bgInput.value=(parseFloat(bgInput.value)/18.018).toFixed(1);
    if(parseFloat(targetInput.value)>20)targetInput.value=(parseFloat(targetInput.value)/18.018).toFixed(1);
    if(parseFloat(isfInput.value)>10)isfInput.value=(parseFloat(isfInput.value)/18.018).toFixed(1);
    document.getElementById('currentBgHint').textContent='Normal fasting: 3.9-5.6 mmol/L';
    document.getElementById('targetBgHint').textContent='Typical target: 4.4-7.2 mmol/L';
    document.getElementById('isfHint').textContent='mmol/L drop per unit of insulin';
  }else{
    bgInput.value=(parseFloat(bgInput.value)*18.018).toFixed(0);
    targetInput.value=(parseFloat(targetInput.value)*18.018).toFixed(0);
    isfInput.value=(parseFloat(isfInput.value)*18.018).toFixed(0);
    document.getElementById('currentBgHint').textContent='Normal fasting: 70-100 mg/dL';
    document.getElementById('targetBgHint').textContent='Typical target: 80-130 mg/dL';
    document.getElementById('isfHint').textContent='mg/dL drop per unit of insulin';
  }
  calculate();
}
function formatDose(n){return Number(n).toFixed(1)+' U'}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function calculate(){
  var carbs=parseFloat(document.getElementById('carbs').value)||0;
  var icr=parseFloat(document.getElementById('icr').value)||15;
  var currentBg=parseFloat(document.getElementById('currentBg').value)||0;
  var targetBg=parseFloat(document.getElementById('targetBg').value)||0;
  var isf=parseFloat(document.getElementById('isf').value)||50;
  if(icr<=0||isf<=0){showToast('ICR and ISF must be greater than 0');return}
  var mealDose=carbs/icr;
  var correctionDose=(currentBg-targetBg)/isf;
  var totalDose=mealDose+correctionDose;
  if(totalDose<0)totalDose=0;
  document.getElementById('totalDose').textContent=formatDose(totalDose);
  document.getElementById('mealDose').textContent=formatDose(mealDose);
  document.getElementById('mealDetail').textContent=carbs+'g ÷ ICR '+icr;
  document.getElementById('correctionDose').textContent=formatDose(correctionDose);
  var unitLabel=currentUnit==='mgdl'?'mg/dL':'mmol/L';
  document.getElementById('correctionDetail').textContent='('+currentBg+' - '+targetBg+') ÷ '+isf;
  var tbody=document.getElementById('breakdownBody');
  tbody.innerHTML='<tr><td>Carbohydrates</td><td>'+carbs+' g</td><td>Planned Intake</td></tr>'+
    '<tr><td>Insulin-to-Carb Ratio</td><td>1:'+icr+'</td><td>Doctor Determined</td></tr>'+
    '<tr><td>Meal Dose</td><td>'+formatDose(mealDose)+'</td><td>'+carbs+' ÷ '+icr+'</td></tr>'+
    '<tr><td>Current BG</td><td>'+currentBg+' '+unitLabel+'</td><td>Measured</td></tr>'+
    '<tr><td>Target BG</td><td>'+targetBg+' '+unitLabel+'</td><td>Target</td></tr>'+
    '<tr><td>Insulin Sensitivity Factor</td><td>1:'+isf+'</td><td>Doctor Determined</td></tr>'+
    '<tr><td>Correction Dose</td><td>'+formatDose(correctionDose)+'</td><td>('+currentBg+' - '+targetBg+') ÷ '+isf+'</td></tr>'+
    '<tr><td>Total Dose</td><td>'+formatDose(totalDose)+'</td><td>Meal + Correction</td></tr>';
  document.getElementById('breakdownSection').style.display='block';
  showToast('✅ Calculation Complete');
}
function clearAll(){
  document.getElementById('carbs').value='60';
  document.getElementById('icr').value='15';
  document.getElementById('currentBg').value='180';
  document.getElementById('targetBg').value='100';
  document.getElementById('isf').value='50';
  document.getElementById('totalDose').textContent='0';
  document.getElementById('mealDose').textContent='0';
  document.getElementById('mealDetail').textContent='To cover carbs';
  document.getElementById('correctionDose').textContent='0';
  document.getElementById('correctionDetail').textContent='To correct high BG';
  document.getElementById('breakdownSection').style.display='none';
  if(currentUnit==='mmol')setUnit('mgdl');
  showToast('🔄 Reset Complete');
}
function copyResults(){
  var lines=['Insulin Dosage Results','---',
    'Total Dose: '+document.getElementById('totalDose').textContent,
    'Meal Dose: '+document.getElementById('mealDose').textContent+' ('+document.getElementById('mealDetail').textContent+')',
    'Correction Dose: '+document.getElementById('correctionDose').textContent+' ('+document.getElementById('correctionDetail').textContent+')'
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('📋 Copied')}).catch(function(){showToast('Copy failed')});
}
calculate();
</script>
