<body>
<div class="container">
<div class="nav-back"><a href="/">🏠 Home</a> › <a href="/#tools">Tools</a> › <span>Retirement Income Calculator</span></div>
<div class="hero">
  <span style="font-size:2rem">🏖️</span>
  <div><h1 style="font-size:1.5rem;color:#f1f5f9;margin-bottom:4px">Retirement Income Calculator</h1>
  <p>Plan multiple income streams and estimate monthly retirement income</p></div>
  <span class="badge">🛡️ Client-side Only</span>
</div>
<div class="calculator-section">
  <h2>📊 Retirement Savings & Investments</h2>
  <div class="input-grid">
    <div class="input-group"><label>Total Retirement Savings ($)</label><input type="number" id="savings" value="500000" min="0" step="10000"><span class="hint">Total balance across 401k, IRA accounts</span></div>
    <div class="input-group"><label>Expected Annual Return (%)</label><input type="number" id="returnRate" value="5" min="0" max="20" step="0.1"><span class="hint">Conservative estimate 4-6%</span></div>
    <div class="input-group"><label>Expected Withdrawal Period</label><input type="number" id="withdrawYears" value="30" min="5" max="50"><span class="hint">Planned withdrawal years after retirement</span></div>
    <div class="input-group"><label>Expected Inflation Rate (%)</label><input type="number" id="inflationRate" value="3" min="0" max="10" step="0.1"><span class="hint">Historical average ~3%</span></div>
  </div>
</div>
<div class="calculator-section">
  <h2>💰 Monthly Income Sources</h2>
  <div class="input-grid">
    <div class="input-group"><label>Social Security ($/mo)</label><input type="number" id="socialSecurity" value="1800" min="0" step="100"><span class="hint">Check SSA.gov for estimate</span></div>
    <div class="input-group"><label>Employer Pension ($/mo)</label><input type="number" id="pension" value="500" min="0" step="100"><span class="hint">If you have a pension plan</span></div>
    <div class="input-group"><label>Rental Income ($/mo)</label><input type="number" id="rental" value="0" min="0" step="100"><span class="hint">Monthly net rental income</span></div>
    <div class="input-group"><label>Other Income ($/mo)</label><input type="number" id="otherIncome" value="0" min="0" step="100"><span class="hint">Part-time, dividends, annuities</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">🔍 Calculate Retirement Income</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Clear & Reset</button>
    <button class="btn btn-danger" onclick="copyResults()">📋 Copy Results</button>
  </div>
</div>
<div class="results-grid" id="resultsGrid">
  <div class="result-card highlight"><div class="label">📅 Monthly Total Income</div><div class="value" id="totalMonthly">$0</div><div class="sub" id="totalYearly"></div></div>
  <div class="result-card"><div class="label">🏦 Monthly Withdrawal</div><div class="value" id="monthlyWithdraw">$0</div><div class="sub" id="withdrawRate"></div></div>
  <div class="result-card"><div class="label">📈 Other IncomeTotal</div><div class="value" id="otherTotal">$0</div><div class="sub">SS + Pension + Rental + Other</div></div>
</div>
<div class="calculator-section" id="breakdownSection" style="display:none">
  <h2>📋 Income Breakdown</h2>
  <table class="breakdown-table">
    <thead><tr><th>Income Source</th><th>Monthly</th><th>Annual</th><th>Share</th></tr></thead>
    <tbody id="breakdownBody"></tbody>
  </table>
</div>
<div class="info-section">
  <h2>📘 Retirement Income Planning Guide</h2>
  <h3>4% Safe Withdrawal Rule</h3>
  <p>The 4% rule is the gold standard for retirement planning：Extract 4% of savings annually, inflation-adjusted, to last 30 years. E.g., $500,000 savings = $20,000/year ($1,667/month).</p>
  <h3>Diversified Income Sources</h3>
  <p>Ideal retirement income comes from multiple channels: Social Security (base), retirement account withdrawals (primary), pensions (if any), investment dividends, and rental income (supplemental).</p>
  <h3>Inflation Protection</h3>
  <p>At 3% inflation, purchasing power drops ~60% over 30 years。Consider inflation-resistant assets (stocks, real estate) and adjust withdrawals periodically.</p>
</div>
<div class="footer">

<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a> · <a href="/privacy/">Privacy</a></p>

<div class="toast" id="toast"></div>
<script>
function formatCurrency(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function calculate(){
  var savings=parseFloat(document.getElementById('savings').value)||0;
  var returnRate=parseFloat(document.getElementById('returnRate').value)||0;
  var withdrawYears=parseInt(document.getElementById('withdrawYears').value)||30;
  var inflationRate=parseFloat(document.getElementById('inflationRate').value)||0;
  var socialSecurity=parseFloat(document.getElementById('socialSecurity').value)||0;
  var pension=parseFloat(document.getElementById('pension').value)||0;
  var rental=parseFloat(document.getElementById('rental').value)||0;
  var otherIncome=parseFloat(document.getElementById('otherIncome').value)||0;
  if(savings<0||withdrawYears<1){showToast('Please enter valid numbers');return}
  var r=returnRate/100;
  var annualWithdraw;
  if(r===0){annualWithdraw=savings/withdrawYears}
  else{annualWithdraw=savings*r*Math.pow(1+r,withdrawYears)/(Math.pow(1+r,withdrawYears)-1)}
  var monthlyWithdraw=annualWithdraw/12;
  var otherTotal=socialSecurity+pension+rental+otherIncome;
  var totalMonthly=monthlyWithdraw+otherTotal;
  var totalYearly=totalMonthly*12;
  var realTotalMonthly=totalMonthly/Math.pow(1+inflationRate/100,withdrawYears);
  document.getElementById('totalMonthly').textContent=formatCurrency(totalMonthly);
  document.getElementById('totalYearly').textContent='Annual: '+formatCurrency(totalYearly);
  document.getElementById('monthlyWithdraw').textContent=formatCurrency(monthlyWithdraw);
  document.getElementById('withdrawRate').textContent='Withdrawal Rate: '+(annualWithdraw/savings*100).toFixed(1)+'%/yr';
  document.getElementById('otherTotal').textContent=formatCurrency(otherTotal);
  var breakdown=[{name:'Savings Withdrawal',monthly:monthlyWithdraw},{name:'Social Security',monthly:socialSecurity},{name:'Employer Pension',monthly:pension},{name:'Rental Income',monthly:rental},{name:'Other Income',monthly:otherIncome}];
  var tbody=document.getElementById('breakdownBody');
  tbody.innerHTML='';
  breakdown.forEach(function(item){
    var pct=totalMonthly>0?(item.monthly/totalMonthly*100).toFixed(1):'0.0';
    tbody.innerHTML+='<tr><td>'+item.name+'</td><td>'+formatCurrency(item.monthly)+'</td><td>'+formatCurrency(item.monthly*12)+'</td><td>'+pct+'%</td></tr>';
  });
  tbody.innerHTML+='<tr><td>Total</td><td>'+formatCurrency(totalMonthly)+'</td><td>'+formatCurrency(totalYearly)+'</td><td>100%</td></tr>';
  document.getElementById('breakdownSection').style.display='block';
  document.getElementById('breakdownSection').scrollIntoView({behavior:'smooth'});
  showToast('✅ Calculation Complete');
}
function clearAll(){
  document.getElementById('savings').value='500000';
  document.getElementById('returnRate').value='5';
  document.getElementById('withdrawYears').value='30';
  document.getElementById('inflationRate').value='3';
  document.getElementById('socialSecurity').value='1800';
  document.getElementById('pension').value='500';
  document.getElementById('rental').value='0';
  document.getElementById('otherIncome').value='0';
  document.getElementById('totalMonthly').textContent='$0';
  document.getElementById('totalYearly').textContent='';
  document.getElementById('monthlyWithdraw').textContent='$0';
  document.getElementById('withdrawRate').textContent='';
  document.getElementById('otherTotal').textContent='$0';
  document.getElementById('breakdownSection').style.display='none';
  showToast('🔄 Reset Complete');
}
function copyResults(){
  var lines=['Retirement Income Results','---',
    'Total Monthly: '+document.getElementById('totalMonthly').textContent,
    'Annual: '+document.getElementById('totalYearly').textContent.replace('Annual: ',''),
    'Monthly Withdrawal: '+document.getElementById('monthlyWithdraw').textContent,
    document.getElementById('withdrawRate').textContent,
    'Other IncomeTotal: '+document.getElementById('otherTotal').textContent
  ];
  var rows=document.querySelectorAll('#breakdownBody tr');
  rows.forEach(function(r){lines.push(r.cells[0]?r.cells[0].textContent+': '+r.cells[1].textContent:'')});
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('📋 Copied to clipboard')}).catch(function(){showToast('Copy failed')});
}
calculate();
</script>
