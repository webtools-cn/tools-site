<div class="toast" id="toast"></div>
<script>
function base64UrlDecode(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4)str+='=';
  try{return JSON.parse(atob(str));}catch(e){return null;}
}
function formatTime(ts){
  if(!ts)return 'N/A';
  const d=new Date(ts*1000);
  return d.toISOString().replace('T',' ').substring(0,19)+' ('+ts+')';
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.getElementById('btnDecode').addEventListener('click',()=>{
  const token=document.getElementById('jwtInput').value.trim();
  if(!token){showToast('Please paste a JWT token');return}
  const parts=token.split('.');
  if(parts.length!==3){showToast('Invalid JWT format: expected 3 parts separated by dots');return}
  const header=base64UrlDecode(parts[0]);
  const payload=base64UrlDecode(parts[1]);
  const signature=parts[2];
  let status='',statusClass='';
  if(!header||!payload){status='❌ Invalid JWT';statusClass='status-invalid'}
  else{
    const now=Math.floor(Date.now()/1000);
    if(payload.exp&&payload.exp<now){status='⚠️ JWT Expired';statusClass='status-warning'}
    else if(payload.nbf&&payload.nbf>now){status='⚠️ JWT Not Yet Valid';statusClass='status-warning'}
    else{status='✅ JWT Valid';statusClass='status-valid'}
  }
  document.getElementById('statusBadge').innerHTML=`<span class="status-badge ${statusClass}">${status}</span>`;
  document.getElementById('headerBlock').textContent=header?JSON.stringify(header,null,2):'(Failed to decode)';
  document.getElementById('payloadBlock').textContent=payload?JSON.stringify(payload,null,2):'(Failed to decode)';
  document.getElementById('signatureBlock').textContent=signature;
  if(payload){
    const claims=[];
    const keys={sub:'Subject',name:'Name',iss:'Issuer',aud:'Audience',iat:'Issued At',exp:'Expiration',nbf:'Not Before',jti:'JWT ID'};
    for(const[k,v]of Object.entries(payload)){
      const label=keys[k]||k;
      let val=v;
      if(['iat','exp','nbf'].includes(k)&&typeof v==='number')val=formatTime(v);
      else if(typeof v==='object')val=JSON.stringify(v);
      claims.push(`<tr><td>${label}</td><td>${val}</td></tr>`);
    }
    document.getElementById('claimsTable').innerHTML='<table class="claims-table">'+claims.join('')+'</table>';
  }
  document.getElementById('resultSection').classList.add('show');
});
document.getElementById('btnCopy').addEventListener('click',()=>{
  const h=document.getElementById('headerBlock').textContent;
  const p=document.getElementById('payloadBlock').textContent;
  if(!h||!p){showToast('Please decode a JWT first');return}
  navigator.clipboard.writeText('Header:\n'+h+'\n\nPayload:\n'+p).then(()=>showToast('Copied'));
});
document.getElementById('btnClear').addEventListener('click',()=>{
  document.getElementById('jwtInput').value='';
  document.getElementById('resultSection').classList.remove('show');
});
</script>
