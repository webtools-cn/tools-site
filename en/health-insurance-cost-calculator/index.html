<body>
<div class="container">
<div class="header"><h1>🏥 Health Insurance Cost Calculator</h1><div class="lang-switch"><a href="../../health-insurance-cost-calculator/" class="">中文</a><a href="index.html" class="active">EN</a></div></div>
<p class="nav-back"><a href="../index.html">Home</a> › <a href="../index.html#tools">Tools</a> › Health Insurance Cost Calculator</p>
<div class="hero"><p>Enter your insurance plan parameters to estimate annual out-of-pocket costs including premiums, deductibles, copays, and out-of-pocket maximum.</p><span class="badge">Zero Dependency · Works Offline</span></div>
<div class="ad-slot"></div>

<div class="calculator-section">
  <h2>📋 Insurance Plan Details</h2>
  <div class="input-grid">
    <div class="input-group"><label for="planType">Plan Type</label><select id="planType"><option value="individual" selected>Individual</option><option value="family">Family</option></select><div class="hint">Select your coverage type</div></div>
    <div class="input-group"><label for="monthlyPremium">Monthly Premium ($)</label><input type="number" id="monthlyPremium" value="450" min="0" step="10"><div class="hint">Monthly insurance payment</div></div>
    <div class="input-group"><label for="deductible">Annual Deductible ($)</label><input type="number" id="deductible" value="2000" min="0" step="100"><div class="hint">Amount you pay before insurance kicks in</div></div>
    <div class="input-group"><label for="oopMax">Out-of-Pocket Maximum ($)</label><input type="number" id="oopMax" value="8000" min="0" step="100"><div class="hint">Annual cap on your out-of-pocket costs</div></div>
    <div class="input-group"><label for="coinsurance">Coinsurance (%)</label><input type="number" id="coinsurance" value="20" min="0" max="100" step="1"><div class="hint">Your share after deductible is met</div></div>
    <div class="input-group"><label for="copay">Copay per Visit ($)</label><input type="number" id="copay" value="30" min="0" step="5"><div class="hint">Fixed fee per doctor visit</div></div>
  </div>
</div>

<div class="calculator-section">
  <h2>🏥 Expected Healthcare Usage</h2>
  <div class="input-grid">
    <div class="input-group"><label for="visits">Expected Doctor Visits/Year</label><input type="number" id="visits" value="6" min="0" max="100" step="1"><div class="hint">Primary care + specialists</div></div>
    <div class="input-group"><label for="medsPerMonth">Monthly Prescription Cost ($)</label><input type="number" id="medsPerMonth" value="50" min="0" step="10"><div class="hint">Monthly out-of-pocket for prescriptions</div></div>
    <div class="input-group"><label for="procedureCost">Expected Procedure/Surgery ($)</label><input type="number" id="procedureCost" value="0" min="0" step="1000"><div class="hint">If you have planned procedures</div></div>
    <div class="input-group"><label for="erVisits">Expected ER Visits</label><input type="number" id="erVisits" value="0" min="0" max="10" step="1"><div class="hint">ER visits typically have higher copay ($250-500)</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">📊 Calculate Annual Cost</button>
    <button class="btn btn-secondary" onclick="copyResult()" id="copyBtn" style="display:none">📋 Copy Results</button>
    <button class="btn btn-secondary" onclick="clearAll()">🔄 Reset</button>
  </div>
</div>

<div id="resultSection" style="display:none">
  <div class="calculator-section">
    <h2>📈 Annual Cost Estimate</h2>
    <div class="results-grid">
      <div class="result-card"><div class="label">Annual Premium</div><div class="value" id="annualPremium">$0</div><div class="sub">Monthly × 12</div></div>
      <div class="result-card"><div class="label">OOP Medical Costs</div><div class="value" id="oopCost">$0</div><div class="sub">Deductible + coinsurance</div></div>
      <div class="result-card highlight"><div class="label">Total Annual Cost</div><div class="value" id="totalCost">$0</div><div class="sub">Premium + OOP</div></div>
    </div>
    <div class="breakdown">
      <h3>📊 Cost Breakdown</h3>
      <div class="item"><span>Monthly Premium</span><span class="val" id="detailPremium">-</span></div>
      <div class="item"><span>Annual Premium Total</span><span class="val" id="detailAnnual">-</span></div>
      <div class="item"><span>Deductible</span><span class="val" id="detailDeduct">-</span></div>
      <div class="item"><span>Visit Copays</span><span class="val" id="detailCopay">-</span></div>
      <div class="item"><span>Prescription Costs</span><span class="val" id="detailMeds">-</span></div>
      <div class="item"><span>Procedure Coinsurance</span><span class="val" id="detailProc">-</span></div>
      <div class="item"><span>ER Copays</span><span class="val" id="detailER">-</span></div>
      <div class="item"><span>OOP Maximum</span><span class="val" id="detailOOPMax">-</span></div>
      <div class="item"><span style="font-weight:600;color:#4ade80">Total Annual Cost</span><span class="val" style="font-weight:600;color:#4ade80" id="detailTotal">-</span></div>
    </div>
  </div>
</div>

<div class="footer"><p>© 2024 Free ToolBase · <a href="../about/">About</a>
<a href="https://github.com/webtools-cn/tools-site" target="_blank" rel="noopener">GitHub</a> · <a href="../privacy/">Privacy</a></p><p style="font-size:.75rem;margin-top:8px">All calculations are performed in your browser. Your health data is never uploaded.</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function formatMoney(n) { return '$' + Number(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function calculate() {
  var monthlyPremium = parseFloat(document.getElementById('monthlyPremium').value) || 0;
  var deductible = parseFloat(document.getElementById('deductible').value) || 0;
  var oopMax = parseFloat(document.getElementById('oopMax').value) || 0;
  var coinsurance = parseFloat(document.getElementById('coinsurance').value) / 100 || 0;
  var copay = parseFloat(document.getElementById('copay').value) || 0;
  var visits = parseInt(document.getElementById('visits').value) || 0;
  var medsPerMonth = parseFloat(document.getElementById('medsPerMonth').value) || 0;
  var procedureCost = parseFloat(document.getElementById('procedureCost').value) || 0;
  var erVisits = parseInt(document.getElementById('erVisits').value) || 0;

  var annualPremium = monthlyPremium * 12;
  var totalMedical = copay * visits + medsPerMonth * 12 + procedureCost + erVisits * 300;
  var oopBeforeLimit = Math.min(deductible, totalMedical);
  var remaining = Math.max(0, totalMedical - deductible);
  var coinsuranceAmount = remaining * coinsurance;
  var totalOOP = Math.min(oopBeforeLimit + coinsuranceAmount, oopMax);
  var totalCost = annualPremium + totalOOP;

  document.getElementById('annualPremium').textContent = formatMoney(annualPremium);
  document.getElementById('oopCost').textContent = formatMoney(totalOOP);
  document.getElementById('totalCost').textContent = formatMoney(totalCost);
  document.getElementById('detailPremium').textContent = formatMoney(monthlyPremium) + '/month';
  document.getElementById('detailAnnual').textContent = formatMoney(annualPremium);
  document.getElementById('detailDeduct').textContent = formatMoney(deductible);
  document.getElementById('detailCopay').textContent = formatMoney(copay * visits);
  document.getElementById('detailMeds').textContent = formatMoney(medsPerMonth * 12);
  document.getElementById('detailProc').textContent = formatMoney(procedureCost * coinsurance);
  document.getElementById('detailER').textContent = formatMoney(erVisits * 300);
  document.getElementById('detailOOPMax').textContent = formatMoney(oopMax);
  document.getElementById('detailTotal').textContent = formatMoney(totalCost);
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  var lines = ['Health Insurance Cost Estimate', '---'];
  var items = document.querySelectorAll('#resultSection .item');
  items.forEach(function(i){
    lines.push(i.children[0].textContent + ': ' + i.children[1].textContent);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    showToast('✅ Copied to clipboard');
  }, function(){
    showToast('❌ Copy failed');
  });
}

function clearAll() {
  document.getElementById('monthlyPremium').value = '450';
  document.getElementById('deductible').value = '2000';
  document.getElementById('oopMax').value = '8000';
  document.getElementById('coinsurance').value = '20';
  document.getElementById('copay').value = '30';
  document.getElementById('visits').value = '6';
  document.getElementById('medsPerMonth').value = '50';
  document.getElementById('procedureCost').value = '0';
  document.getElementById('erVisits').value = '0';
  document.getElementById('planType').value = 'individual';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  showToast('Reset complete');
}</script>
