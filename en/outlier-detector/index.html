  <div id="results" class="section" style="display:none">

    <h2 style="margin-top:16px">⚠️ Threshold & Detection Results</h2>
    <div class="threshold-info" id="thresholdInfo"></div>

    <div class="boxplot" id="boxplot"></div>

<script>
let currentMethod = 'iqr';

function switchMethod(method) {
  currentMethod = method;
  document.querySelectorAll('.method-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.method === method);
  });
  document.getElementById('zscoreOptions').style.display = method === 'zscore' ? 'flex' : 'none';
}

function parseData() {
  const raw = document.getElementById('dataInput').value.trim();
  if (!raw) return [];
  const nums = raw.split(/[,\s\n]+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
  return nums;
}

function detectOutliers() {
  const errorEl = document.getElementById('errorMsg');
  const resultsEl = document.getElementById('results');
  errorEl.style.display = 'none';
  resultsEl.style.display = 'none';

  const data = parseData();
  if (data.length < 3) {
    errorEl.textContent = '⚠️ Please enter at least 3 values for outlier detection';
    errorEl.style.display = 'block';
    return;
  }

  const sorted = [...data].sort((a, b) => a - b);
  const n = sorted.length;
  const min = sorted[0];
  const max = sorted[n - 1];
  const mean = sorted.reduce((a, b) => a + b, 0) / n;
  const variance = sorted.reduce((a, b) => a + (b - mean) ** 2, 0) / n;
  const std = Math.sqrt(variance);

  function percentile(arr, p) {
    const idx = (arr.length - 1) * p;
    const lo = Math.floor(idx);
    const hi = Math.ceil(idx);
    if (lo === hi) return arr[lo];
    return arr[lo] + (idx - lo) * (arr[hi] - arr[lo]);
  }
  const q1 = percentile(sorted, 0.25);
  const median = percentile(sorted, 0.50);
  const q3 = percentile(sorted, 0.75);
  const iqr = q3 - q1;

  let outliers = [];
  let lowerBound, upperBound, methodLabel;

  if (currentMethod === 'iqr') {
    const factor = 1.5;
    lowerBound = q1 - factor * iqr;
    upperBound = q3 + factor * iqr;
    methodLabel = `IQR Method (1.5×IQR)`;
    outliers = data.filter(v => v < lowerBound || v > upperBound);
  } else {
    const threshold = parseFloat(document.getElementById('zThreshold').value) || 2;
    lowerBound = mean - threshold * std;
    upperBound = mean + threshold * std;
    methodLabel = `Z-Score Method (threshold=${threshold})`;
    outliers = data.filter(v => Math.abs((v - mean) / std) > threshold);
  }

  const stats = [
    {label: 'Sample Size (n)', value: n, isOutlier: false},
    {label: 'Minimum', value: min.toFixed(4), isOutlier: false},
    {label: 'Q1 (25th)', value: q1.toFixed(4), isOutlier: false},
    {label: 'Median', value: median.toFixed(4), isOutlier: false},
    {label: 'Q3 (75th)', value: q3.toFixed(4), isOutlier: false},
    {label: 'Maximum', value: max.toFixed(4), isOutlier: false},
    {label: 'IQR', value: iqr.toFixed(4), isOutlier: false},
    {label: 'Mean', value: mean.toFixed(4), isOutlier: false},
    {label: 'Std Dev', value: std.toFixed(4), isOutlier: false},
    {label: 'Outlier Count', value: outliers.length, isOutlier: outliers.length > 0},
  ];

  const statGrid = document.getElementById('statGrid');
  statGrid.innerHTML = stats.map(s => `
    <div class="stat-card${s.isOutlier ? ' outlier' : ''}">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');

  document.getElementById('thresholdInfo').innerHTML = `
    Detection Method: <strong>${methodLabel}</strong><br>
    Normal Range: <code>${lowerBound.toFixed(4)}</code> ~ <code>${upperBound.toFixed(4)}</code><br>
    ${outliers.length > 0 ? `Found <strong style="color:var(--danger)">${outliers.length}</strong> outlier(s)` : '✅ No outliers detected (all data within normal range)'}
  `;

  const outlierDisplay = document.getElementById('outlierDisplay');
  if (outliers.length > 0) {
    const unique = [...new Set(outliers)];
    outlierDisplay.innerHTML = `
      <div class="outlier-list">
        ${unique.map(v => `<span class="outlier-item">${v}</span>`).join('')}
      </div>
      <p style="margin-top:8px;font-size:.82rem;color:var(--text-secondary)">
        ${outliers.length > unique.length ? `(${outliers.length - unique.length} duplicate outlier(s) merged)` : ''}
      </p>
    `;
  } else {
    outlierDisplay.innerHTML = '<div class="no-outlier">✅ All data points are within normal range — no outliers detected</div>';
  }

  drawBoxplot(min, q1, median, q3, max, lowerBound, upperBound, data);

  resultsEl.style.display = 'block';
  showToast('Detection complete');
}

function drawBoxplot(min, q1, median, q3, max, lowerBound, upperBound, data) {
  const container = document.getElementById('boxplot');
  const margin = {top: 10, right: 20, bottom: 20, left: 20};
  const w = container.clientWidth - margin.left - margin.right;
  const h = 80 - margin.top - margin.bottom;
  if (w <= 0) return;

  const range = Math.max(max - min, 1);
  const scale = (v) => margin.left + ((v - min) / range) * w;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${container.clientWidth} 80">`;

  svg += `<line x1="${scale(min)}" y1="40" x2="${scale(max)}" y2="40" stroke="#94a3b8" stroke-width="1.5"/>`;
  svg += `<rect x="${scale(q1)}" y="22" width="${scale(q3)-scale(q1)}" height="36" fill="rgba(99,102,241,0.25)" stroke="#6366f1" stroke-width="1.5" rx="2"/>`;
  svg += `<line x1="${scale(median)}" y1="22" x2="${scale(median)}" y2="58" stroke="#818cf8" stroke-width="2"/>`;
  svg += `<line x1="${scale(min)}" y1="32" x2="${scale(min)}" y2="48" stroke="#94a3b8" stroke-width="1.5"/>`;
  svg += `<line x1="${scale(max)}" y1="32" x2="${scale(max)}" y2="48" stroke="#94a3b8" stroke-width="1.5"/>`;

  if (lowerBound > min) {
    svg += `<line x1="${scale(lowerBound)}" y1="14" x2="${scale(lowerBound)}" y2="66" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>`;
    svg += `<text x="${scale(lowerBound)}" y="76" text-anchor="middle" font-size="9" fill="#ef4444">Lower</text>`;
  }
  if (upperBound < max) {
    svg += `<line x1="${scale(upperBound)}" y1="14" x2="${scale(upperBound)}" y2="66" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>`;
    svg += `<text x="${scale(upperBound)}" y="76" text-anchor="middle" font-size="9" fill="#ef4444">Upper</text>`;
  }

  data.forEach(v => {
    if (v < lowerBound || v > upperBound) {
      svg += `<circle cx="${scale(v)}" cy="40" r="4" fill="#ef4444"/>`;
    }
  });

  svg += '</svg>';
  container.innerHTML = svg;
}

function loadSample() {
  document.getElementById('dataInput').value = '12, 15, 18, 22, 25, 28, 30, 32, 35, 38, 40, 42, 45, 48, 50, 55, 60, 65, 70, 200';
  document.getElementById('errorMsg').style.display = 'none';
  detectOutliers();
}

function clearAll() {
  document.getElementById('dataInput').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  loadSample();
});

window.addEventListener('resize', () => {
  if (document.getElementById('results').style.display !== 'none') {
    detectOutliers();
  }
});
</script>
