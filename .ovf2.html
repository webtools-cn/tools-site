<!DOCTYPE html><html><head><meta charset="utf-8"><title>ovf2</title></head>
<body style="background:#111"><div id="out">waiting</div>
<script>
var pages=["en/compass-online/index.html","en/compatibility-test/index.html","en/complaint-letter/index.html","en/composting-calculator/index.html","en/compound-interest-calc/index.html","en/compound-interest-monthly/index.html","en/concrete-calculator/index.html","en/concrete-slab-calculator/index.html"];
var results=[];
function run(i){
 if(i>=pages.length){document.getElementById("out").textContent="RESULTS:"+JSON.stringify(results);return;}
 fetch("/"+pages[i]).then(r=>r.text()).then(function(html){
   var f=document.createElement("iframe");f.style.width="375px";f.style.height="200px";
   document.body.appendChild(f);
   f.contentWindow.document.open();f.contentWindow.document.write(html);f.contentWindow.document.close();
   setTimeout(function(){
     try{
       var d=f.contentWindow.document;
       results.push({p:pages[i],sw:d.documentElement.scrollWidth,cw:375,overflow:d.documentElement.scrollWidth>375});
     }catch(e){results.push({p:pages[i],err:e.message});}
     document.body.removeChild(f);run(i+1);
   },700);
 });
}
run(0);
</script></body></html>
