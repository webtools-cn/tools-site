<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"旅行费用计算器","description":"免费在线旅行费用计算器，分类计算交通、住宿、餐饮、景点门票等各项费用，自动汇总。","applicationCategory":"TravelApplication","operatingSystem":"Web","url":"https://free-toolbase.com/trip-cost-calculator/"}</script>
  <style>
    :root { --primary: #F59E0B; --primary-dark: #D97706; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav a { color: var(--text-light); text-decoration: none; margin-left: 20px; font-size: 14px; }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 30px 20px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-light); margin-bottom: 24px; font-size: 15px; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    .expense-row { display: grid; grid-template-columns: 2fr 1fr 1fr 40px; gap: 8px; margin-bottom: 8px; align-items: center; }
    @media (max-width: 500px) { .expense-row { grid-template-columns: 1fr 1fr 1fr; } }
    .expense-row input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .expense-row select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-danger { background: #ef4444; color: #fff; font-size: 16px; line-height: 1; padding: 6px 10px; }
    .del-btn { background: #fee2e2; color: #ef4444; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .summary-item { text-align: center; padding: 16px; background: var(--bg); border-radius: var(--radius); }
    .summary-value { font-size: 24px; font-weight: 700; color: var(--primary); }
    .summary-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .total-row { background: #fffbeb; padding: 12px 16px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 18px; font-weight: 700; }
    footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 13px; border-top: 1px solid var(--border); }
    .toast { position: fixed; top: 20px; right: 20px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(-10px); transition: all .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
<link rel="canonical" href="https://free-toolbase.com/trip-cost-calculator/">
<meta property="og:image" content="https://free-toolbase.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="zh" href="https://free-toolbase.com/trip-cost-calculator/">
<link rel="alternate" hreflang="en" href="https://free-toolbase.com/en/trip-cost-calculator/">
<link rel="alternate" hreflang="x-default" href="https://free-toolbase.com/trip-cost-calculator/">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <header>
    <a href="/" class="logo">Free ToolBase</a>
    <nav><a href="/">首页</a><a href="/en/">EN</a></nav>
  </header>
  <main>
    <h1>💰 旅行费用计算器</h1>
    <p class="subtitle">分类记录交通、住宿、餐饮等各项费用，自动汇总旅行预算</p>

    <div class="card">
      <div class="form-group" style="margin-bottom:12px">
        <label>旅行目的地</label>
        <input type="text" id="destination" placeholder="例：东京">
      </div>
      <div style="display:flex;gap:12px;margin-bottom:12px">
        <div class="form-group" style="flex:1"><label>天数</label><input type="number" id="days" value="5" min="1"></div>
        <div class="form-group" style="flex:1"><label>人数</label><input type="number" id="people" value="1" min="1"></div>
      </div>
      <div id="expenseList">
        <div class="expense-row">
          <select class="cat-select"><option>交通</option><option>住宿</option><option>餐饮</option><option>景点门票</option><option>购物</option><option>其他</option></select>
          <input type="text" placeholder="项目名称" class="item-name">
          <input type="number" placeholder="金额" class="item-amount" min="0">
          <button class="del-btn" onclick="removeRow(this)">×</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addRow()" style="margin-top:8px">+ 添加费用项</button>
      <button class="btn btn-primary" onclick="calculate()" style="margin-top:8px;margin-left:8px">计算汇总</button>

      <div class="total-row" style="margin-top:16px">
        <span>💰 总费用</span>
        <span id="totalCost">¥0</span>
      </div>
    </div>

    <div class="card" id="summaryCard" style="display:none">
      <h3 style="margin-bottom:16px">📊 费用明细</h3>
      <div class="summary">
        <div class="summary-item"><div class="summary-value" id="sumTransport">¥0</div><div class="summary-label">交通</div></div>
        <div class="summary-item"><div class="summary-value" id="sumLodging">¥0</div><div class="summary-label">住宿</div></div>
        <div class="summary-item"><div class="summary-value" id="sumFood">¥0</div><div class="summary-label">餐饮</div></div>
        <div class="summary-item"><div class="summary-value" id="sumAttractions">¥0</div><div class="summary-label">景点</div></div>
        <div class="summary-item"><div class="summary-value" id="sumShopping">¥0</div><div class="summary-label">购物</div></div>
        <div class="summary-item"><div class="summary-value" id="sumOther">¥0</div><div class="summary-label">其他</div></div>
      </div>
      <div style="margin-top:12px;color:var(--text-light);font-size:13px">
        人均：<strong id="perPerson">¥0</strong> · 日均：<strong id="perDay">¥0</strong>
      </div>
      <button class="btn btn-secondary" onclick="exportReport()" style="margin-top:12px">📄 导出报告</button>
    </div>
  </main>
  <footer>© 2025 Free ToolBase · 所有工具免费使用</footer>
  <div class="toast" id="toast"></div>

  <script>
    function addRow() {
      const row = document.createElement('div');
      row.className = 'expense-row';
      row.innerHTML = '<select class="cat-select"><option>交通</option><option>住宿</option><option>餐饮</option><option>景点门票</option><option>购物</option><option>其他</option></select><input type="text" placeholder="项目名称" class="item-name"><input type="number" placeholder="金额" class="item-amount" min="0"><button class="del-btn" onclick="removeRow(this)">×</button>';
      document.getElementById('expenseList').appendChild(row);
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('#expenseList .expense-row');
      if (rows.length <= 1) return;
      btn.closest('.expense-row').remove();
    }

    function calculate() {
      const cats = { '交通': 0, '住宿': 0, '餐饮': 0, '景点门票': 0, '购物': 0, '其他': 0 };
      const rows = document.querySelectorAll('#expenseList .expense-row');
      let total = 0;
      rows.forEach(row => {
        const cat = row.querySelector('.cat-select').value;
        const amt = parseFloat(row.querySelector('.item-amount').value) || 0;
        cats[cat] = (cats[cat] || 0) + amt;
        total += amt;
      });
      const days = parseInt(document.getElementById('days').value) || 1;
      const people = parseInt(document.getElementById('people').value) || 1;

      document.getElementById('totalCost').textContent = '¥' + total.toLocaleString();
      document.getElementById('sumTransport').textContent = '¥' + cats['交通'].toLocaleString();
      document.getElementById('sumLodging').textContent = '¥' + cats['住宿'].toLocaleString();
      document.getElementById('sumFood').textContent = '¥' + cats['餐饮'].toLocaleString();
      document.getElementById('sumAttractions').textContent = '¥' + cats['景点门票'].toLocaleString();
      document.getElementById('sumShopping').textContent = '¥' + cats['购物'].toLocaleString();
      document.getElementById('sumOther').textContent = '¥' + cats['其他'].toLocaleString();
      document.getElementById('perPerson').textContent = '¥' + Math.round(total / people).toLocaleString();
      document.getElementById('perDay').textContent = '¥' + Math.round(total / days).toLocaleString();
      document.getElementById('summaryCard').style.display = 'block';
      showToast('计算完成！总费用 ¥' + total.toLocaleString());
    }

    function exportReport() {
      const dest = document.getElementById('destination').value || '旅行';
      let text = dest + ' 旅行费用报告\n' + '='.repeat(40) + '\n\n';
      const rows = document.querySelectorAll('#expenseList .expense-row');
      rows.forEach(row => {
        const cat = row.querySelector('.cat-select').value;
        const name = row.querySelector('.item-name').value || '-';
        const amt = parseFloat(row.querySelector('.item-amount').value) || 0;
        text += cat + ' | ' + name + ' | ¥' + amt.toLocaleString() + '\n';
      });
      text += '\n总费用: ' + document.getElementById('totalCost').textContent;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'trip-cost-report.txt'; a.click();
    }

    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
  </script>
</body>
</html>
