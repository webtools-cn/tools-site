<script>
var currentEmoji='🌟';
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
document.querySelectorAll('.emoji-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.emoji-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    currentEmoji=btn.dataset.emoji;
  });
});
document.getElementById('emojiSize').addEventListener('input',function(){
  document.getElementById('sizeVal').textContent=this.value+'px';
});
document.getElementById('spacing').addEventListener('input',function(){
  document.getElementById('spaceVal').textContent=this.value+'px';
});
document.getElementById('btnGen').addEventListener('click',function(){
  var size=parseInt(document.getElementById('emojiSize').value);
  var gap=parseInt(document.getElementById('spacing').value);
  var bg=document.getElementById('bgColor').value;
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=size+'px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  var step=size+gap;
  for(var y=step/2;y<canvas.height;y+=step){
    for(var x=step/2;x<canvas.width;x+=step){
      ctx.fillText(currentEmoji,x,y);
    }
  }
  document.getElementById('previewWrap').style.display='block';
});
document.getElementById('btnDownload').addEventListener('click',function(){
  var link=document.createElement('a');
  link.download='emoji-background.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
});
document.getElementById('btnResize').addEventListener('click',function(){
  canvas.width=1920;
  canvas.height=1080;
  document.getElementById('btnGen').click();
});
</script>
