<header><h1>📜 遗产税计算器</h1><p>估算遗产税 · 辅助财富传承规划</p></header>
<div class="container">
  <div class="card">
    <h2>📋 遗产信息</h2>
    <div class="row">
      <div class="form-group"><label>遗产总额 (元)</label><input type="number" id="totalEstate" value="5000000" min="0" step="10000"></div>
      <div class="form-group"><label>免税额 (元)</label><input type="number" id="exemption" value="2000000" min="0" step="10000"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>扣除债务 (元)</label><input type="number" id="debts" value="0" min="0" step="1000"></div>
      <div class="form-group"><label>丧葬费用 (元)</label><input type="number" id="funeralCost" value="50000" min="0" step="1000"></div>
    </div>
    <button class="btn" id="calcBtn">🔍 计算遗产税</button>
    <button class="btn-secondary" id="clearBtn" style="margin-left:8px">🗑 清空</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <h2>📊 计算结果</h2>
    <div id="results"></div>
  </div>
</div>

<script>
(function() {
  var calcBtn = document.getElementById('calcBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultsCard = document.getElementById('resultsCard');
  var resultsEl = document.getElementById('results');

  function formatMoney(num) {
    if (Math.abs(num) >= 10000) return (num / 10000).toFixed(2) + ' 万';
    return num.toFixed(0);
  }

  // 模拟累进税率表
  var taxBrackets = [
    { min: 0, max: 1000000, rate: 0.10, quick: 0 },
    { min: 1000000, max: 3000000, rate: 0.20, quick: 100000 },
    { min: 3000000, max: 5000000, rate: 0.30, quick: 400000 },
    { min: 5000000, max: 10000000, rate: 0.40, quick: 900000 },
    { min: 10000000, max: Infinity, rate: 0.50, quick: 1900000 }
  ];

  function calcTax(amount) {
    if (amount <= 0) return 0;
    for (var i = taxBrackets.length - 1; i >= 0; i--) {
      var b = taxBrackets[i];
      if (amount > b.min) {
        return amount * b.rate - b.quick;
      }
    }
    return 0;
  }

  function calculate() {
    var total = parseFloat(document.getElementById('totalEstate').value) || 0;
    var exemption = parseFloat(document.getElementById('exemption').value) || 0;
    var debts = parseFloat(document.getElementById('debts').value) || 0;
    var funeral = parseFloat(document.getElementById('funeralCost').value) || 0;

    if (total <= 0) { resultsCard.style.display = 'block'; resultsEl.innerHTML = '<p style="text-align:center;color:#ef4444">⚠️ 请输入有效的遗产总额</p>'; return; }

    var netEstate = total - debts - funeral - exemption;
    if (netEstate < 0) netEstate = 0;
    var tax = calcTax(netEstate);
    var afterTax = total - debts - funeral - tax;
    var effectiveRate = netEstate > 0 ? (tax / total * 100).toFixed(2) : '0.00';

    // 税率表
    var tableRows = '<tr><th>应纳税遗产</th><th>税率</th><th>速算扣除</th></tr>';
    for (var i = 0; i < taxBrackets.length; i++) {
      var b = taxBrackets[i];
      var range = b.max === Infinity ? '超过 ' + formatMoney(b.min) : formatMoney(b.min) + ' - ' + formatMoney(b.max);
      tableRows += '<tr><td>' + range + '</td><td>' + (b.rate * 100).toFixed(0) + '%</td><td>¥' + formatMoney(b.quick) + '</td></tr>';
    }

    resultsCard.style.display = 'block';
    resultsEl.innerHTML =
      '<div class="result-row"><span class="label">📦 遗产总额</span><span class="value">¥' + formatMoney(total) + '</span></div>' +
      '<div class="result-row"><span class="label">🛡️ 免税额</span><span class="value">¥' + formatMoney(exemption) + '</span></div>' +
      '<div class="result-row"><span class="label">💳 扣除债务</span><span class="value">¥' + formatMoney(debts) + '</span></div>' +
      '<div class="result-row"><span class="label">🕯️ 丧葬费用</span><span class="value">¥' + formatMoney(funeral) + '</span></div>' +
      '<div class="result-row"><span class="label">📊 应纳税遗产</span><span class="value">¥' + formatMoney(netEstate) + '</span></div>' +
      '<div class="highlight">💰 应缴遗产税: ¥' + formatMoney(tax) + ' (有效税率 ' + effectiveRate + '%)</div>' +
      '<div class="result-row" style="border-top:2px solid var(--primary);margin-top:8px"><span class="label">💵 税后遗产</span><span class="value" style="font-size:1.1rem">¥' + formatMoney(afterTax) + '</span></div>' +
      '<h3 style="margin-top:16px;font-size:0.85rem;color:var(--primary)">📋 累进税率表（参考）</h3>' +
      '<table class="tax-table">' + tableRows + '</table>' +
      '<p style="font-size:0.75rem;color:var(--text-secondary);margin-top:8px">* 以上为模拟累进税率，仅供参考。实际税率因国家/地区而异。</p>';
  }

  function clearAll() {
    document.getElementById('totalEstate').value = '5000000';
    document.getElementById('exemption').value = '2000000';
    document.getElementById('debts').value = '0';
    document.getElementById('funeralCost').value = '50000';
    resultsCard.style.display = 'none';
  }

  calcBtn.addEventListener('click', calculate);
  clearBtn.addEventListener('click', clearAll);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') calculate();
  });
})();
</script>
