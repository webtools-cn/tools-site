<body>
  <header>

  <main>
    <h1>测试邮箱生成器</h1>
    <p class="subtitle">快速生成随机测试邮箱地址，支持自定义域名、前缀格式和批量生成。适用于开发测试、注册验证等场景。</p>
    <div class="form-row">
      <div class="form-group">
        <label>生成数量</label>
        <input type="number" id="count" min="1" max="100" value="10">
      </div>
      <div class="form-group">
        <label>邮箱域名</label>
        <input type="text" id="domain" placeholder="example.com" value="testmail.com">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>前缀格式</label>
        <select id="prefixType">
          <option value="random">随机字母数字</option>
          <option value="name">随机人名</option>
          <option value="timestamp">时间戳</option>
          <option value="uuid">UUID风格</option>
        </select>
      </div>
      <div class="form-group">
        <label>前缀长度</label>
        <input type="number" id="prefixLen" min="4" max="20" value="8">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="generateBtn">生成邮箱</button>
      <button class="btn btn-secondary" id="copyAllBtn">复制全部</button>
      <button class="btn btn-secondary" id="clearBtn">清空</button>
    </div>
    <div class="result-card" id="resultCard" style="display:none;">
      <h3>
        <span>生成的邮箱</span>
        <span style="font-weight:400;font-size:.75rem;" id="resultCount"></span>
      </h3>
      <div class="email-list" id="emailList"></div>
    </div>
  </main>

  <div id="toast"></div>
  <script>
  var names = ['alex','jordan','taylor','morgan','casey','riley','jamie','quinn','avery','blake','drew','jesse','skyler','finley','harper','parker','sawyer','reese','rowan','ellis','dakota','remy','arden','charlie','sam','max','leo','zoe','mia','ava','liam','noah','emma','olivia','sophia','jackson','aiden','lucas','ethan','mason','logan','james','ben','eli','owen','dylan','nathan','caleb','ryan'];
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error show' : 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }
  function randomStr(len) {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    for (var i=0;i<len;i++) result += chars.charAt(Math.floor(Math.random()*chars.length));
    return result;
  }
  function uuidStyle() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  }
  function generateEmails() {
    var count = parseInt(document.getElementById('count').value) || 10;
    var domain = document.getElementById('domain').value.trim() || 'testmail.com';
    var prefixType = document.getElementById('prefixType').value;
    var prefixLen = parseInt(document.getElementById('prefixLen').value) || 8;
    if (count < 1) count = 1;
    if (count > 100) count = 100;
    if (prefixLen < 4) prefixLen = 4;
    if (prefixLen > 20) prefixLen = 20;
    var emails = [];
    var used = {};
    for (var i=0;i<count;i++) {
      var prefix;
      var attempts = 0;
      do {
        switch(prefixType) {
          case 'name':
            prefix = names[Math.floor(Math.random()*names.length)] + (Math.random()>0.5 ? Math.floor(Math.random()*9999) : '');
            break;
          case 'timestamp':
            prefix = 'user' + Date.now().toString(36) + Math.floor(Math.random()*99);
            break;
          case 'uuid':
            prefix = uuidStyle().substring(0, prefixLen);
            break;
          default:
            prefix = randomStr(prefixLen);
        }
        attempts++;
      } while (used[prefix] && attempts < 100);
      used[prefix] = true;
      emails.push(prefix + '@' + domain);
    }
    var list = document.getElementById('emailList');
    list.innerHTML = '';
    for (var i=0;i<emails.length;i++) {
      var div = document.createElement('div');
      div.className = 'email-item';
      div.innerHTML = '<span>' + emails[i] + '</span><button onclick="copyOne(\'' + emails[i] + '\',this)">复制</button>';
      list.appendChild(div);
    }
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('resultCount').textContent = emails.length + ' 个邮箱';
    showToast('已生成 ' + emails.length + ' 个邮箱');
  }
  function copyOne(email, btn) {
    var ta = document.createElement('textarea');
    ta.value = email;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = '复制'; }, 1500);
    showToast('已复制: ' + email);
  }
  document.getElementById('generateBtn').addEventListener('click', generateEmails);
  document.getElementById('copyAllBtn').addEventListener('click', function() {
    var items = document.querySelectorAll('.email-item span');
    if (items.length === 0) { showToast('请先生成邮箱', true); return; }
    var all = [];
    for (var i=0;i<items.length;i++) all.push(items[i].textContent);
    var ta = document.createElement('textarea');
    ta.value = all.join('\n');
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制 ' + all.length + ' 个邮箱');
  });
  document.getElementById('clearBtn').addEventListener('click', function() {
    document.getElementById('emailList').innerHTML = '';
    document.getElementById('resultCard').style.display = 'none';
  });
  </script>
