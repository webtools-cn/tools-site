<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面包屑导航生成器 - Free ToolBase</title>
  <meta name="description" content="在线面包屑导航生成器。生成BreadcrumbList Schema结构化数据与HTML面包屑导航代码，支持多层级，一键复制JSON-LD和HTML。">
  <meta property="og:title" content="面包屑导航生成器 - Free ToolBase">
  <meta property="og:description" content="生成BreadcrumbList Schema + HTML面包屑导航，一键复制。">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"面包屑导航生成器","applicationCategory":"DeveloperApplication","operatingSystem":"Web Browser","description":"在线面包屑导航生成器，生成BreadcrumbList Schema和HTML代码。"}</script>
  <style>
    :root { --primary: #4F46E5; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --radius: 12px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    header .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    header nav { display: flex; gap: 16px; }
    header nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
    header nav a:hover { color: var(--primary); }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: var(--text-secondary); margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
    .field input, .field textarea { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .field textarea { min-height: 80px; resize: vertical; font-family: monospace; }
    button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-sm { padding: 6px 14px; font-size: 0.85rem; }
    .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 0.85rem; }
    .item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .item-row input { flex: 1; min-width: 100px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    .item-row input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .item-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
    pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
    .output-section { margin-bottom: 16px; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .preview-box { border: 1px solid var(--border); border-radius: 8px; padding: 16px; background: #fff; margin-top: 8px; }
    .breadcrumb-preview { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 0.9rem; }
    .breadcrumb-preview a { color: var(--primary); text-decoration: none; }
    .breadcrumb-preview a:hover { text-decoration: underline; }
    .breadcrumb-preview .sep { color: var(--text-secondary); }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
    .tab-btn { padding: 8px 16px; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; background: none; border-radius: 0; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    footer { text-align: center; padding: 32px 16px; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 16px; }
    footer a { color: var(--primary); text-decoration: none; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 640px) {
      main { padding: 16px 12px; }
      h1 { font-size: 1.4rem; }
      .item-row { flex-direction: row; }
    }
  </style>
</head>
<body>
<header>
  <a href="/" class="logo">Free ToolBase</a>
  <nav>
    <a href="/">首页</a>
    <a href="/en/">English</a>
  </nav>
</header>
<main>
  <h1>面包屑导航生成器</h1>
  <p class="subtitle">快速生成 BreadcrumbList Schema 结构化数据 + HTML 面包屑导航代码，支持多层级，一键复制。</p>

  <div class="card">
    <h2>添加面包屑层级</h2>
    <div id="itemsContainer">
      <div class="item-row">
        <span class="item-num">1</span>
        <input type="text" placeholder="名称 (如: 首页)" value="首页" class="item-name">
        <input type="text" placeholder="URL (如: / 或留空)" value="/" class="item-url">
        <button class="btn-danger item-remove" style="display:none;">×</button>
      </div>
      <div class="item-row">
        <span class="item-num">2</span>
        <input type="text" placeholder="名称" value="产品" class="item-name">
        <input type="text" placeholder="URL" value="/products/" class="item-url">
        <button class="btn-danger item-remove">×</button>
      </div>
      <div class="item-row">
        <span class="item-num">3</span>
        <input type="text" placeholder="名称" value="产品详情" class="item-name">
        <input type="text" placeholder="URL" value="/products/item1/" class="item-url">
        <button class="btn-danger item-remove">×</button>
      </div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button class="btn-secondary btn-sm" id="addItemBtn">+ 添加层级</button>
      <button class="btn-primary btn-sm" id="generateBtn">生成代码</button>
    </div>
  </div>

  <div class="card" id="outputCard" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="schema">JSON-LD Schema</button>
      <button class="tab-btn" data-tab="html">HTML 代码</button>
      <button class="tab-btn" data-tab="preview">实时预览</button>
    </div>

    <div class="output-section" id="tab-schema" style="display:block;">
      <div class="output-header">
        <h2>JSON-LD 结构化数据</h2>
        <button class="btn-secondary btn-sm" id="copySchemaBtn">📋 复制</button>
      </div>
      <pre id="schemaOutput"></pre>
    </div>

    <div class="output-section" id="tab-html" style="display:none;">
      <div class="output-header">
        <h2>HTML 面包屑导航</h2>
        <button class="btn-secondary btn-sm" id="copyHtmlBtn">📋 复制</button>
      </div>
      <pre id="htmlOutput"></pre>
    </div>

    <div class="output-section" id="tab-preview" style="display:none;">
      <h2>预览</h2>
      <div class="preview-box">
        <nav class="breadcrumb-preview" id="breadcrumbPreview" aria-label="面包屑"></nav>
      </div>
    </div>
  </div>
</main>
<footer>
  <p>Free ToolBase © 2024 — <a href="/">更多免费工具</a></p>
</footer>
<div class="toast" id="toast"></div>
<script>
(function() {
  var container = document.getElementById('itemsContainer');
  var addBtn = document.getElementById('addItemBtn');
  var generateBtn = document.getElementById('generateBtn');
  var outputCard = document.getElementById('outputCard');

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

  function updateItemNumbers() {
    var items = container.querySelectorAll('.item-row');
    items.forEach(function(row, i) {
      row.querySelector('.item-num').textContent = i + 1;
      var removeBtn = row.querySelector('.item-remove');
      if (items.length <= 1) {
        removeBtn.style.display = 'none';
      } else {
        removeBtn.style.display = '';
      }
    });
  }

  container.addEventListener('click', function(e) {
    if (e.target.closest('.item-remove')) {
      var row = e.target.closest('.item-row');
      if (container.querySelectorAll('.item-row').length > 1) {
        row.remove();
        updateItemNumbers();
      }
    }
  });

  addBtn.addEventListener('click', function() {
    var count = container.querySelectorAll('.item-row').length;
    var row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = '<span class="item-num">' + (count + 1) + '</span>' +
      '<input type="text" placeholder="名称" class="item-name">' +
      '<input type="text" placeholder="URL (可选)" class="item-url">' +
      '<button class="btn-danger item-remove">×</button>';
    container.appendChild(row);
    updateItemNumbers();
  });

  // Tab switching
  document.querySelector('#outputCard .tabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    var tab = btn.dataset.tab;
    document.querySelectorAll('#outputCard .tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('#outputCard .output-section').forEach(function(s) { s.style.display = 'none'; });
    btn.classList.add('active');
    document.getElementById('tab-' + tab).style.display = 'block';
  });

  generateBtn.addEventListener('click', function() {
    var items = [];
    container.querySelectorAll('.item-row').forEach(function(row) {
      var name = row.querySelector('.item-name').value.trim();
      var url = row.querySelector('.item-url').value.trim();
      if (name) {
        items.push({ name: name, url: url });
      }
    });

    if (items.length === 0) {
      showToast('请至少添加一个面包屑层级。');
      return;
    }

    // Build JSON-LD
    var schemaItems = items.map(function(item, i) {
      var obj = { "@type": "ListItem", "position": i + 1, "name": item.name };
      if (item.url) obj.item = item.url;
      return obj;
    });

    var schema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": schemaItems
    };

    document.getElementById('schemaOutput').textContent = JSON.stringify(schema, null, 2);

    // Build HTML
    var htmlItems = [];
    items.forEach(function(item, i) {
      if (i < items.length - 1 && item.url) {
        htmlItems.push('<a href="' + escapeHtml(item.url) + '">' + escapeHtml(item.name) + '</a>');
      } else {
        htmlItems.push('<span aria-current="page">' + escapeHtml(item.name) + '</span>');
      }
    });

    var html = '<nav aria-label="Breadcrumb">\n  <ol>\n';
    items.forEach(function(item, i) {
      html += '    <li>';
      if (i < items.length - 1 && item.url) {
        html += '<a href="' + escapeHtml(item.url) + '">' + escapeHtml(item.name) + '</a>';
      } else {
        html += '<span aria-current="page">' + escapeHtml(item.name) + '</span>';
      }
      html += '</li>\n';
    });
    html += '  </ol>\n</nav>';

    // Also generate simple div version
    var simpleHtml = '<div class="breadcrumb">\n';
    var parts = htmlItems.join(' <span class="sep">›</span> ');
    simpleHtml += '  ' + parts + '\n</div>';

    document.getElementById('htmlOutput').textContent = html + '\n\n<!-- 或者简单版本 -->\n' + simpleHtml;

    // Preview
    var previewHtml = '<a href="/">🏠 首页</a>';
    items.forEach(function(item, i) {
      if (i === 0) return; // skip first if it's home
      previewHtml += '<span class="sep">›</span>';
      if (item.url && i < items.length - 1) {
        previewHtml += '<a href="' + escapeHtml(item.url) + '">' + escapeHtml(item.name) + '</a>';
      } else {
        previewHtml += '<span>' + escapeHtml(item.name) + '</span>';
      }
    });
    document.getElementById('breadcrumbPreview').innerHTML = previewHtml;

    outputCard.style.display = 'block';
  });

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('copySchemaBtn').addEventListener('click', function() {
    var code = document.getElementById('schemaOutput').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function() { showToast('已复制 Schema 代码！'); });
    }
  });

  document.getElementById('copyHtmlBtn').addEventListener('click', function() {
    var code = document.getElementById('htmlOutput').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function() { showToast('已复制 HTML 代码！'); });
    }
  });

  // Initial generate
  generateBtn.click();
})();
</script>
</body>
</html>
