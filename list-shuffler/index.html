  <script>
  const input=document.getElementById('input'),output=document.getElementById('output'),shuffleBtn=document.getElementById('shuffleBtn'),copyBtn=document.getElementById('copyBtn'),toast=document.getElementById('toast');
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
  function shuffle(){const lines=input.value.split('\n').map(s=>s.trim()).filter(Boolean);if(lines.length<2){showToast('请至少输入2个不同的项目');return}const arr=[...lines];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}output.value=arr.join('\n')}
  copyBtn.addEventListener('click',()=>{if(!output.value){showToast('没有可复制的内容');return}navigator.clipboard.writeText(output.value).then(()=>showToast('已复制')).catch(()=>{output.select();document.execCommand('copy');showToast('已复制')})})
  shuffleBtn.addEventListener('click',shuffle);shuffle();
