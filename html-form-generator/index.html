<script>
// 字段类型定义
var FIELD_TYPES = [
  { type: 'text', label: '文本输入', icon: 'Aa', desc: '单行文本', defaultLabel: '文本字段', placeholder: '请输入文本' },
  { type: 'email', label: '邮箱', icon: '✉', desc: '电子邮箱地址', defaultLabel: '邮箱地址', placeholder: 'example@email.com' },
  { type: 'password', label: '密码', icon: '🔒', desc: '密码输入', defaultLabel: '密码', placeholder: '请输入密码' },
  { type: 'number', label: '数字', icon: '#', desc: '数值输入', defaultLabel: '数量', placeholder: '请输入数字' },
  { type: 'tel', label: '电话', icon: '📞', desc: '电话号码', defaultLabel: '联系电话', placeholder: '请输入电话号码' },
  { type: 'url', label: '网址', icon: '🔗', desc: 'URL地址', defaultLabel: '网址', placeholder: 'https://' },
  { type: 'textarea', label: '文本域', icon: '📝', desc: '多行文本', defaultLabel: '详细说明', placeholder: '请输入详细内容' },
  { type: 'select', label: '下拉选择', icon: '📋', desc: '单选下拉', defaultLabel: '选择选项', options: '选项1,选项2,选项3' },
  { type: 'radio', label: '单选框', icon: '⚪', desc: '单选按钮组', defaultLabel: '请选择', options: '选项A,选项B,选项C' },
  { type: 'checkbox', label: '复选框', icon: '☑', desc: '多选框组', defaultLabel: '选择项目', options: '选项1,选项2,选项3' },
  { type: 'date', label: '日期', icon: '📅', desc: '日期选择', defaultLabel: '日期', placeholder: '' },
  { type: 'file', label: '文件上传', icon: '📁', desc: '文件选择', defaultLabel: '上传文件', placeholder: '' },
  { type: 'color', label: '颜色选择', icon: '🎨', desc: '颜色拾取', defaultLabel: '选择颜色', placeholder: '' },
  { type: 'hidden', label: '隐藏字段', icon: '👻', desc: '不可见字段', defaultLabel: '', placeholder: '', value: '' },
  { type: 'submit', label: '提交按钮', icon: '✅', desc: '表单提交', defaultLabel: '提交', placeholder: '' },
  { type: 'reset', label: '重置按钮', icon: '🔄', desc: '重置表单', defaultLabel: '重置', placeholder: '' }
];

var fields = [];
var editingIndex = -1;
var nextId = 0;

// 渲染字段库
function renderFieldLibrary() {
  var html = '';
  FIELD_TYPES.forEach(function(ft) {
    html += '<div class="field-item" onclick="addField(\'' + ft.type + '\')" draggable="true" data-type="' + ft.type + '">';
    html += '<div class="icon">' + ft.icon + '</div>';
    html += '<div><strong>' + ft.label + '</strong><div class="desc">' + ft.desc + '</div></div>';
    html += '</div>';
  });
  document.getElementById('fieldList').innerHTML = html;

  // 拖拽事件
  var items = document.querySelectorAll('#fieldList .field-item');
  items.forEach(function(item) {
    item.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', item.getAttribute('data-type'));
    });
  });
}

// 添加字段
function addField(type) {
  var ft = FIELD_TYPES.find(function(f) { return f.type === type; });
  if (!ft) return;

  var field = {
    id: nextId++,
    type: ft.type,
    label: ft.defaultLabel,
    placeholder: ft.placeholder || '',
    required: false,
    options: ft.options || '',
    value: ft.value || '',
    name: 'field_' + nextId
  };
  fields.push(field);
  editingIndex = -1;
  renderAll();
  showToast('已添加: ' + ft.label, 'success');
}

// 删除字段
function removeField(index) {
  var label = fields[index].label || '字段';
  fields.splice(index, 1);
  editingIndex = -1;
  renderAll();
  showToast('已删除: ' + label);
}

// 编辑字段
function editField(index) {
  editingIndex = editingIndex === index ? -1 : index;
  renderAll();
}

// 保存字段配置
function saveFieldConfig(index) {
  var cfg = document.getElementById('fieldConfig_' + index);
  var field = fields[index];

  field.label = cfg.querySelector('[data-prop="label"]').value || field.label;
  field.name = cfg.querySelector('[data-prop="name"]').value || field.name;
  field.placeholder = cfg.querySelector('[data-prop="placeholder"]') ? cfg.querySelector('[data-prop="placeholder"]').value : field.placeholder;
  field.required = cfg.querySelector('[data-prop="required"]') ? cfg.querySelector('[data-prop="required"]').checked : false;
  if (cfg.querySelector('[data-prop="options"]')) {
    field.options = cfg.querySelector('[data-prop="options"]').value;
  }
  if (cfg.querySelector('[data-prop="value"]')) {
    field.value = cfg.querySelector('[data-prop="value"]').value;
  }

  editingIndex = -1;
  renderAll();
  showToast('已更新: ' + field.label, 'success');
}

// 移动字段
function moveField(index, direction) {
  var newIndex = index + direction;
  if (newIndex < 0 || newIndex >= fields.length) return;
  var tmp = fields[index];
  fields[index] = fields[newIndex];
  fields[newIndex] = tmp;
  editingIndex = -1;
  renderAll();
}

// 清空全部
function clearAllFields() {
  if (fields.length === 0) return;
  if (!confirm('确定要清空所有字段吗？此操作不可撤销。')) return;
  fields = [];
  editingIndex = -1;
  renderAll();
  showToast('已清空全部字段');
}

// 生成HTML代码
function generateHTML() {
  var title = document.getElementById('formTitle').value || '表单';
  var action = document.getElementById('formAction').value || '#';
  var method = document.getElementById('formMethod').value || 'POST';

  var html = '<form action="' + escapeHTML(action) + '" method="' + method + '">\n';
  if (title) {
    html += '  <h2>' + escapeHTML(title) + '</h2>\n';
  }
  html += '\n';

  fields.forEach(function(f) {
    var ft = FIELD_TYPES.find(function(ft) { return ft.type === f.type; });

    if (f.type === 'hidden') {
      html += '  <input type="hidden" name="' + escapeHTML(f.name) + '" value="' + escapeHTML(f.value || '') + '">\n';
      return;
    }

    if (f.type === 'submit' || f.type === 'reset') {
      html += '  <button type="' + f.type + '">' + escapeHTML(f.label || f.type) + '</button>\n';
      return;
    }

    html += '  <div>\n';
    if (f.label && f.type !== 'hidden') {
      html += '    <label for="' + escapeHTML(f.name) + '">' + escapeHTML(f.label);
      if (f.required) html += ' <span style="color:red">*</span>';
      html += '</label>\n';
    }

    if (f.type === 'textarea') {
      html += '    <textarea id="' + escapeHTML(f.name) + '" name="' + escapeHTML(f.name) + '"';
      if (f.placeholder) html += ' placeholder="' + escapeHTML(f.placeholder) + '"';
      if (f.required) html += ' required';
      html += '></textarea>\n';

    } else if (f.type === 'select') {
      html += '    <select id="' + escapeHTML(f.name) + '" name="' + escapeHTML(f.name) + '"';
      if (f.required) html += ' required';
      html += '>\n';
      var opts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      opts.forEach(function(opt) {
        html += '      <option value="' + escapeHTML(opt.trim()) + '">' + escapeHTML(opt.trim()) + '</option>\n';
      });
      html += '    </select>\n';

    } else if (f.type === 'radio') {
      var ropts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      ropts.forEach(function(opt, i) {
        html += '    <label><input type="radio" name="' + escapeHTML(f.name) + '" value="' + escapeHTML(opt.trim()) + '"';
        if (f.required && i === 0) html += ' required';
        html += '> ' + escapeHTML(opt.trim()) + '</label>\n';
      });

    } else if (f.type === 'checkbox') {
      var copts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      copts.forEach(function(opt) {
        html += '    <label><input type="checkbox" name="' + escapeHTML(f.name) + '" value="' + escapeHTML(opt.trim()) + '"> ' + escapeHTML(opt.trim()) + '</label>\n';
      });

    } else if (f.type === 'file') {
      html += '    <input type="file" id="' + escapeHTML(f.name) + '" name="' + escapeHTML(f.name) + '"';
      if (f.required) html += ' required';
      html += '>\n';

    } else {
      html += '    <input type="' + f.type + '" id="' + escapeHTML(f.name) + '" name="' + escapeHTML(f.name) + '"';
      if (f.placeholder && f.type !== 'date' && f.type !== 'color') html += ' placeholder="' + escapeHTML(f.placeholder) + '"';
      if (f.required) html += ' required';
      if (f.value && f.type === 'hidden') html += ' value="' + escapeHTML(f.value) + '"';
      html += '>\n';
    }

    html += '  </div>\n';
  });

  html += '</form>';
  return html;
}

// 生成预览HTML
function generatePreview() {
  var title = document.getElementById('formTitle').value || '表单';
  var html = '<h3>' + escapeHTML(title) + '</h3>';

  fields.forEach(function(f) {
    if (f.type === 'hidden') return;

    html += '<div class="preview-field">';
    if (f.label && f.type !== 'submit' && f.type !== 'reset') {
      html += '<label>' + escapeHTML(f.label);
      if (f.required) html += '<span class="required-mark">*</span>';
      html += '</label>';
    }

    if (f.type === 'textarea') {
      html += '<textarea placeholder="' + escapeHTML(f.placeholder) + '"></textarea>';
    } else if (f.type === 'select') {
      html += '<select><option value="">-- 请选择 --</option>';
      var opts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      opts.forEach(function(opt) {
        html += '<option>' + escapeHTML(opt.trim()) + '</option>';
      });
      html += '</select>';
    } else if (f.type === 'radio') {
      html += '<div class="radio-group">';
      var ropts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      ropts.forEach(function(opt) {
        html += '<label><input type="radio" name="preview_' + f.id + '"> ' + escapeHTML(opt.trim()) + '</label>';
      });
      html += '</div>';
    } else if (f.type === 'checkbox') {
      html += '<div class="checkbox-group">';
      var copts = (f.options || '').split(',').filter(function(o) { return o.trim(); });
      copts.forEach(function(opt) {
        html += '<label><input type="checkbox"> ' + escapeHTML(opt.trim()) + '</label>';
      });
      html += '</div>';
    } else if (f.type === 'submit') {
      html += '<button class="preview-btn preview-submit" type="button">' + escapeHTML(f.label || '提交') + '</button>';
      return;
    } else if (f.type === 'reset') {
      html += '<button class="preview-btn preview-reset" type="button">' + escapeHTML(f.label || '重置') + '</button>';
      return;
    } else {
      html += '<input type="' + f.type + '" placeholder="' + escapeHTML(f.placeholder) + '">';
    }
    html += '</div>';
  });

  return html;
}

// 渲染配置面板
function renderConfigPanel(index) {
  if (editingIndex !== index) return '';
  var f = fields[index];
  var html = '<div class="config-panel active" id="fieldConfig_' + index + '">';

  html += '<label>字段标签</label>';
  html += '<input type="text" data-prop="label" value="' + escapeHTML(f.label) + '">';

  html += '<label>字段名称 (name)</label>';
  html += '<input type="text" data-prop="name" value="' + escapeHTML(f.name) + '">';

  if (f.type !== 'submit' && f.type !== 'reset' && f.type !== 'hidden' && f.type !== 'radio' && f.type !== 'checkbox' && f.type !== 'select' && f.type !== 'date' && f.type !== 'color' && f.type !== 'file') {
    html += '<label>占位符 (placeholder)</label>';
    html += '<input type="text" data-prop="placeholder" value="' + escapeHTML(f.placeholder) + '">';
  }

  if (f.type === 'select' || f.type === 'radio' || f.type === 'checkbox') {
    html += '<label>选项 (逗号分隔)</label>';
    html += '<input type="text" data-prop="options" value="' + escapeHTML(f.options || '') + '">';
  }

  if (f.type === 'hidden') {
    html += '<label>默认值</label>';
    html += '<input type="text" data-prop="value" value="' + escapeHTML(f.value || '') + '">';
  }

  if (f.type !== 'submit' && f.type !== 'reset' && f.type !== 'hidden') {
    html += '<div class="checkbox-row">';
    html += '<input type="checkbox" data-prop="required" id="req_' + index + '"' + (f.required ? ' checked' : '') + '>';
    html += '<label for="req_' + index + '" style="margin:0">必填字段</label>';
    html += '</div>';
  }

  html += '<button class="btn-sm btn-save" onclick="saveFieldConfig(' + index + ')">保存</button>';
  html += '<button class="btn-sm btn-cancel" onclick="editField(' + index + ')">取消</button>';
  html += '</div>';
  return html;
}

// 渲染全部
function renderAll() {
  renderBuilder();
  renderPreview();
  renderCode();
}

// 渲染构建区
function renderBuilder() {
  var area = document.getElementById('builderArea');
  var emptyState = document.getElementById('emptyState');

  if (fields.length === 0) {
    area.innerHTML = '';
    area.appendChild(emptyState);
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  var html = '';

  fields.forEach(function(f, index) {
    var ft = FIELD_TYPES.find(function(ft) { return ft.type === f.type; });
    html += '<div class="form-field-card" draggable="true" data-index="' + index + '">';
    html += '<div class="field-icon">' + (ft ? ft.icon : '?') + '</div>';
    html += '<div class="field-info">';
    html += '<div class="field-label-display">' + escapeHTML(f.label || f.type) + '</div>';
    html += '<div class="field-type-display">' + (ft ? ft.label : f.type) + '</div>';
    html += '</div>';
    html += '<div class="field-actions">';
    if (index > 0) html += '<button class="btn-icon" onclick="moveField(' + index + ',-1)" title="上移">↑</button>';
    if (index < fields.length - 1) html += '<button class="btn-icon" onclick="moveField(' + index + ',1)" title="下移">↓</button>';
    html += '<button class="btn-icon config" onclick="editField(' + index + ')" title="配置">⚙</button>';
    html += '<button class="btn-icon" onclick="removeField(' + index + ')" title="删除">✕</button>';
    html += '</div>';
    html += '</div>';
    html += renderConfigPanel(index);
  });

  area.innerHTML = html;

  // 拖拽排序
  var cards = area.querySelectorAll('.form-field-card');
  cards.forEach(function(card) {
    card.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', card.getAttribute('data-index'));
      card.style.opacity = '0.5';
    });
    card.addEventListener('dragend', function(e) {
      card.style.opacity = '1';
    });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      card.style.borderTop = '2px solid var(--primary)';
    });
    card.addEventListener('dragleave', function(e) {
      card.style.borderTop = '';
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      card.style.borderTop = '';
      var fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
      var toIndex = parseInt(card.getAttribute('data-index'));
      if (fromIndex !== toIndex && !isNaN(fromIndex) && !isNaN(toIndex)) {
        var moved = fields.splice(fromIndex, 1)[0];
        fields.splice(toIndex, 0, moved);
        editingIndex = -1;
        renderAll();
      }
    });
  });
}

// 渲染预览
function renderPreview() {
  document.getElementById('previewFrame').innerHTML = generatePreview();
}

// 渲染代码
function renderCode() {
  var raw = generateHTML();
  var highlighted = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/&lt;form\b/g, '<span class="tag">&lt;form</span>')
    .replace(/&lt;\/form&gt;/g, '<span class="tag">&lt;/form&gt;</span>')
    .replace(/&lt;input\b/g, '<span class="tag">&lt;input</span>')
    .replace(/&lt;label\b/g, '<span class="tag">&lt;label</span>')
    .replace(/&lt;\/label&gt;/g, '<span class="tag">&lt;/label&gt;</span>')
    .replace(/&lt;select\b/g, '<span class="tag">&lt;select</span>')
    .replace(/&lt;\/select&gt;/g, '<span class="tag">&lt;/select&gt;</span>')
    .replace(/&lt;option\b/g, '<span class="tag">&lt;option</span>')
    .replace(/&lt;\/option&gt;/g, '<span class="tag">&lt;/option&gt;</span>')
    .replace(/&lt;textarea\b/g, '<span class="tag">&lt;textarea</span>')
    .replace(/&lt;\/textarea&gt;/g, '<span class="tag">&lt;/textarea&gt;</span>')
    .replace(/&lt;button\b/g, '<span class="tag">&lt;button</span>')
    .replace(/&lt;\/button&gt;/g, '<span class="tag">&lt;/button&gt;</span>')
    .replace(/&lt;div\b/g, '<span class="tag">&lt;div</span>')
    .replace(/&lt;\/div&gt;/g, '<span class="tag">&lt;/div&gt;</span>')
    .replace(/&lt;h2\b/g, '<span class="tag">&lt;h2</span>')
    .replace(/&lt;\/h2&gt;/g, '<span class="tag">&lt;/h2&gt;</span>')
    .replace(/\b(name|type|id|placeholder|required|value|action|method|for|style|href)="/g, '<span class="attr">$1</span>="')
    .replace(/"([^"]*)"(?=[\s>])/g, '"<span class="val">$1</span>"')
    .replace(/&lt;span\b/g, '<span class="tag">&lt;span</span>')
    .replace(/&lt;\/span&gt;/g, '<span class="tag">&lt;/span&gt;</span>');

  document.getElementById('codeOutput').innerHTML = highlighted;
}

// 复制代码
function copyCode() {
  var raw = generateHTML();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(raw).then(function() {
      showToast('✅ 代码已复制到剪贴板', 'success');
    }).catch(function() {
      fallbackCopy(raw);
    });
  } else {
    fallbackCopy(raw);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('✅ 代码已复制到剪贴板', 'success');
  } catch(e) {
    showToast('复制失败，请手动选择代码', 'error');
  }
  document.body.removeChild(ta);
}

// 下载代码
function downloadCode() {
  var raw = generateHTML();
  var blob = new Blob(['<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>表单</title>\n<meta property="og:image" content="https://free-toolbase.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>\n<body>\n' + raw + '\n</body>\n</html>'], {type: 'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'form.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ 已下载 form.html', 'success');
}

// 辅助函数
function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Toast
function showToast(msg, type) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + (type || '');
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(function() {
    toast.classList.remove('show');
  }, 2000);
}

// 构建区接受拖放
var builderArea = document.getElementById('builderArea');
builderArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  builderArea.classList.add('drag-over');
});
builderArea.addEventListener('dragleave', function(e) {
  builderArea.classList.remove('drag-over');
});
builderArea.addEventListener('drop', function(e) {
  e.preventDefault();
  builderArea.classList.remove('drag-over');
  var type = e.dataTransfer.getData('text/plain');
  if (type) addField(type);
});

// 初始化
renderFieldLibrary();
renderAll();

// 监听表单配置变化
document.getElementById('formTitle').addEventListener('input', function() {
  renderPreview();
  renderCode();
});
document.getElementById('formAction').addEventListener('input', renderCode);
document.getElementById('formMethod').addEventListener('change', renderCode);)</script>
