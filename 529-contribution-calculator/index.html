<div id="toast" class="toast"></div>
<script>
(function(){
var el=function(id){return document.getElementById(id);};
var toastTimer=null;
function showToast(msg){var t=el('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.opacity='0';},2000);}
function fm(n){return parseFloat(n)||0;}
function fmtCur(n){return '$'+fm(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}

var inputHTML='<div class="row2"><div class="form-group"><label>👶 孩子当前年龄</label><input type="number" id="childAge" placeholder="如：5" min="0" max="18" step="1" value="5"></div><div class="form-group"><label>🎓 上大学年龄</label><input type="number" id="collegeAge" placeholder="如：18" min="17" max="25" step="1" value="18"></div></div>';
inputHTML+='<div class="row2"><div class="form-group"><label>🏫 目前每年大学费用 ($)</label><input type="number" id="annualCost" placeholder="如：25000" min="0" step="1000" value="25000"></div><div class="form-group"><label>📈 大学教育通胀率 (%)</label><input type="number" id="inflationRate" placeholder="如：5" min="0" max="15" step="0.1" value="5"></div></div>';
inputHTML+='<div class="row2"><div class="form-group"><label>💵 当前已存金额 ($)</label><input type="number" id="currentSavings" placeholder="如：5000" min="0" step="100" value="5000"></div><div class="form-group"><label>📊 预期年化收益率 (%)</label><input type="number" id="returnRate" placeholder="如：6" min="0" max="15" step="0.1" value="6"></div></div>';
inputHTML+='<div class="row2"><div class="form-group"><label>📚 大学年数</label><input type="number" id="collegeYears" placeholder="如：4" min="1" max="8" step="1" value="4"></div><div class="form-group"><label>💡 每月可存金额 ($)</label><input type="number" id="monthlyContribution" placeholder="如：300" min="0" step="10" value="300"></div></div>';
el('inputFields').innerHTML=inputHTML;

function calculate(){
  var childAge=fm(el('childAge').value);
  var collegeAge=fm(el('collegeAge').value);
  var annualCost=fm(el('annualCost').value);
  var inflation=fm(el('inflationRate').value)/100;
  var currentSavings=fm(el('currentSavings').value);
  var returnRate=fm(el('returnRate').value)/100;
  var collegeYears=fm(el('collegeYears').value);
  var monthlyContribution=fm(el('monthlyContribution').value);

  var yearsToCollege=collegeAge-childAge;
  var monthsToCollege=yearsToCollege*12;
  var monthlyRate=returnRate/12;

  // Future cost per year
  var futureAnnualCost=annualCost*Math.pow(1+inflation,yearsToCollege);

  // Total college cost (4 years, each year inflated separately)
  var totalFutureCost=0;
  for(var i=0;i<collegeYears;i++){
    totalFutureCost+=annualCost*Math.pow(1+inflation,yearsToCollege+i);
  }

  // Future value of current savings
  var fvCurrentSavings=currentSavings*Math.pow(1+returnRate,yearsToCollege);

  // Future value of monthly contributions
  var fvMonthly=0;
  if(monthlyRate>0){
    fvMonthly=monthlyContribution*((Math.pow(1+monthlyRate,monthsToCollege)-1)/monthlyRate)*(1+monthlyRate);
  } else {
    fvMonthly=monthlyContribution*monthsToCollege;
  }

  var totalProjected=fvCurrentSavings+fvMonthly;
  var shortfall=totalFutureCost-totalProjected;
  var coveredPct=totalFutureCost>0?(totalProjected/totalFutureCost)*100:0;

  // Required monthly to meet goal
  var neededMonthly=0;
  if(monthlyRate>0 && monthsToCollege>0){
    var neededFv=totalFutureCost-fvCurrentSavings;
    if(neededFv>0){
      neededMonthly=neededFv/(((Math.pow(1+monthlyRate,monthsToCollege)-1)/monthlyRate)*(1+monthlyRate));
    }
  }

  var html='<div class="result-item"><span class="result-label">⏰ 距上大学还有</span><span class="result-value">'+yearsToCollege+' 年</span></div>';
  html+='<div class="result-item"><span class="result-label">🏫 上大学时每年费用</span><span class="result-value">'+fmtCur(futureAnnualCost)+'</span></div>';
  html+='<div class="result-item"><span class="result-label">📚 大学总费用（'+collegeYears+'年）</span><span class="result-value">'+fmtCur(totalFutureCost)+'</span></div>';
  html+='<div class="result-item"><span class="result-label">💰 当前储蓄增长后</span><span class="result-value">'+fmtCur(fvCurrentSavings)+'</span></div>';
  html+='<div class="result-item"><span class="result-label">📈 每月供款累积</span><span class="result-value">'+fmtCur(fvMonthly)+'</span></div>';
  html+='<div class="result-item"><span class="result-label">🎯 预计总储蓄</span><span class="result-value">'+fmtCur(totalProjected)+'</span></div>';
  html+='<div class="result-item"><span class="result-label">📊 覆盖比例</span><span class="result-value '+(coveredPct>=100?'good':'warn')+'">'+coveredPct.toFixed(1)+'%</span></div>';
  if(shortfall>0){
    html+='<div class="result-item"><span class="result-label">⚠️ 缺口</span><span class="result-value warn">-'+fmtCur(shortfall)+'</span></div>';
    html+='<div class="result-item"><span class="result-label">💡 建议每月增加至</span><span class="result-value good">'+fmtCur(neededMonthly)+'</span></div>';
  } else {
    html+='<div class="result-item"><span class="result-label">✅ 超额</span><span class="result-value good">+'+fmtCur(Math.abs(shortfall))+'</span></div>';
  }

  el('resultContent').innerHTML=html;
  el('resultSection').style.display='block';
  el('explanationContent').innerHTML='<p style="color:#94a3b8;line-height:1.7;">📌 <b>529计划优势</b>：存入资金免税增长，用于合格教育费用时提取也免税。<br>📌 大学费用通常以每年5-8%的速度增长，远超普通通胀。<br>📌 建议尽早开始储蓄，利用复利效应最大化收益。<br>📌 从2024年起，未用完的529资金最多$35,000可转入受益人的Roth IRA。</p>';
}

el('calcBtn').addEventListener('click',calculate);
el('clearBtn').addEventListener('click',function(){
  el('childAge').value=5;el('collegeAge').value=18;el('annualCost').value=25000;
  el('inflationRate').value=5;el('currentSavings').value=5000;el('returnRate').value=6;
  el('collegeYears').value=4;el('monthlyContribution').value=300;
  el('resultSection').style.display='none';el('explanationContent').innerHTML='';
});
el('copyBtn').addEventListener('click',function(){
  var results=document.querySelectorAll('#resultContent .result-item');
  if(!results.length){showToast('请先计算');return;}
  var text='529教育储蓄计划计算器 - 结果\n';
  results.forEach(function(r){text+=r.querySelector('.result-label').textContent+': '+r.querySelector('.result-value').textContent+'\n';});
  navigator.clipboard.writeText(text).then(function(){showToast('结果已复制');}).catch(function(){showToast('复制失败');});
});

var relatedTools=[{icon:"🎓",name:"大学费用计算器",url:"college-cost-calculator/"},{icon:"💰",name:"复利计算器",url:"compound-interest-calculator/"},{icon:"🏦",name:"储蓄目标计算器",url:"savings-goal-calculator/"},{icon:"📈",name:"投资回报计算器",url:"roi-calculator/"}];
var rg=el('relatedGrid');
relatedTools.forEach(function(rt){var d=document.createElement('div');d.className='related-item';d.innerHTML='<a href="../'+rt.url+'">'+rt.icon+' '+rt.name+'</a>';rg.appendChild(d);});
})();
</script>
