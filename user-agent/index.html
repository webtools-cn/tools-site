<div class="container">
  <div class="header"><h1>🔍 User Agent 解析器</h1><div class="lang-switch"><a href="/user-agent/" class="active">中文</a><a href="/en/user-agent/">EN</a></div></div>

  <div class="hero"><p>解析浏览器UA字符串，识别浏览器、系统和设备信息</p><span class="badge">开发工具</span></div>
  <div class="section">
    <div class="form-group"><label for="uaInput">UA字符串（自动填入当前浏览器UA）</label><textarea id="uaInput"></textarea></div>
    <button class="btn" onclick="parse()">🔍 解析</button>
    <div class="result-grid" id="results"></div>
    <div class="current-ua" id="currentUa"></div>
  </div>
  <div class="footer">Free ToolBase © 2024 | 纯前端解析</div>
</div>
<script>
const ua=navigator.userAgent;document.getElementById('uaInput').value=ua;document.getElementById('currentUa').textContent='当前UA: '+ua;
function parse(){const u=document.getElementById('uaInput').value.trim();if(!u)return;
const info={};info['浏览器']='未知';if(u.includes('Edg/')){info['浏览器']='Edge '+((u.match(/Edg\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Firefox/')&&!u.includes('Seamonkey/')){info['浏览器']='Firefox '+((u.match(/Firefox\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Chrome/')&&!u.includes('Edg/')&&!u.includes('OPR/')){info['浏览器']='Chrome '+((u.match(/Chrome\/([\d.]+)/)||[])[1]||'')}else if(u.includes('Safari/')&&!u.includes('Chrome/')){info['浏览器']='Safari '+((u.match(/Version\/([\d.]+)/)||[])[1]||'')}else if(u.includes('OPR/')||u.includes('Opera/')){info['浏览器']='Opera'}
info['操作系统']='未知';if(u.includes('Windows NT 10.0'))info['操作系统']='Windows 10/11';else if(u.includes('Windows NT 6.3'))info['操作系统']='Windows 8.1';else if(u.includes('Windows NT 6.1'))info['操作系统']='Windows 7';else if(u.includes('Mac OS X')){const m=u.match(/Mac OS X ([_\d]+)/);info['操作系统']='macOS '+(m?m[1].replace(/_/g,'.'):'')}else if(u.includes('Linux')&&u.includes('Android')){const m=u.match(/Android ([\d.]+)/);info['操作系统']='Android '+(m?m[1]:'')}else if(u.includes('Linux'))info['操作系统']='Linux';else if(u.includes('iPhone')||u.includes('iPad')){info['操作系统']='iOS'+(u.match(/OS ([\d_]+)/)?(u.match(/OS ([\d_]+)/)||[])[1].replace(/_/g,'.'):'')}
info['设备']='桌面';if(u.includes('Mobile'))info['设备']='手机';else if(u.includes('Tablet')||u.includes('iPad'))info['设备']='平板';
info['渲染引擎']='未知';if(u.includes('AppleWebKit'))info['渲染引擎']='WebKit '+(u.match(/AppleWebKit\/([\d.]+)/)||[])[1]||'';else if(u.includes('Gecko/'))info['渲染引擎']='Gecko '+(u.match(/Gecko\/([\d.]+)/)||[])[1]||'';
info['CPU架构']='未知';if(u.includes('x64')||u.includes('Win64')||u.includes('x86_64'))info['CPU架构']='x86_64';else if(u.includes('WOW64'))info['CPU架构']='x86 (32-bit)';else if(u.includes('arm64')||u.includes('aarch64'))info['CPU架构']='ARM64';
info['语言']=navigator.language||'未知';
let html='';for(const[k,v]of Object.entries(info)){html+=`<div class="result-item"><div class="label">${k}</div><div class="value">${v}</div></div>`}document.getElementById('results').innerHTML=html}
parse();
</script>
