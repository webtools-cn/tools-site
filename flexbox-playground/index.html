<header><h1>📐 Flexbox 可视化练习</h1>
<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">在线Flexbox可视化练习工具，实时调整flex属性查看效果，理解justify-content/align-items/flex-wrap等CSS布局</p></header>
<main>
  <div class="card">
    <h2>Flex 容器</h2>
    <div id="playground">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <div class="controls">
      <div class="control-group">
        <label>flex-direction</label>
        <select id="flexDirection">
          <option value="row">row</option>
          <option value="row-reverse">row-reverse</option>
          <option value="column">column</option>
          <option value="column-reverse">column-reverse</option>
        </select>
      </div>
      <div class="control-group">
        <label>justify-content</label>
        <select id="justifyContent">
          <option value="flex-start">flex-start</option>
          <option value="flex-end">flex-end</option>
          <option value="center">center</option>
          <option value="space-between">space-between</option>
          <option value="space-around">space-around</option>
          <option value="space-evenly">space-evenly</option>
        </select>
      </div>
      <div class="control-group">
        <label>align-items</label>
        <select id="alignItems">
          <option value="stretch">stretch</option>
          <option value="flex-start">flex-start</option>
          <option value="flex-end">flex-end</option>
          <option value="center">center</option>
          <option value="baseline">baseline</option>
        </select>
      </div>
      <div class="control-group">
        <label>flex-wrap</label>
        <select id="flexWrap">
          <option value="nowrap">nowrap</option>
          <option value="wrap">wrap</option>
          <option value="wrap-reverse">wrap-reverse</option>
        </select>
      </div>
      <div class="control-group">
        <label>gap</label>
        <select id="flexGap">
          <option value="0px">0px</option>
          <option value="8px" selected>8px</option>
          <option value="16px">16px</option>
          <option value="24px">24px</option>
          <option value="32px">32px</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="btnAddItem">+ 添加项目</button>
      <button class="btn btn-outline" id="btnRemoveItem">- 移除项目</button>
    </div>
    <div class="css-code" id="cssCode">display: flex;</div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script>
const playground = document.getElementById('playground');
const cssCode = document.getElementById('cssCode');
const toast = document.getElementById('toast');
const selects = ['flexDirection','justifyContent','alignItems','flexWrap','flexGap'];

function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

function updatePlayground() {
  const fd = document.getElementById('flexDirection').value;
  const jc = document.getElementById('justifyContent').value;
  const ai = document.getElementById('alignItems').value;
  const fw = document.getElementById('flexWrap').value;
  const gap = document.getElementById('flexGap').value;
  playground.style.flexDirection = fd;
  playground.style.justifyContent = jc;
  playground.style.alignItems = ai;
  playground.style.flexWrap = fw;
  playground.style.gap = gap;
  cssCode.textContent = `display: flex;\nflex-direction: ${fd};\njustify-content: ${jc};\nalign-items: ${ai};\nflex-wrap: ${fw};\ngap: ${gap};`;
}

selects.forEach(id => document.getElementById(id).addEventListener('change', updatePlayground));

document.getElementById('btnAddItem').addEventListener('click', () => {
  if (playground.children.length >= 8) { showToast('最多8个项目'); return; }
  const div = document.createElement('div');
  div.className = 'flex-item';
  div.textContent = playground.children.length + 1;
  playground.appendChild(div);
});

document.getElementById('btnRemoveItem').addEventListener('click', () => {
  if (playground.children.length <= 1) { showToast('至少保留1个项目'); return; }
  playground.lastChild.remove();
});
</script>
