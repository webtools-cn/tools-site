<body>
<header><div class="container"><div class="header-left"><span class="logo">⏱️ Free ToolBase</span><a href="/" class="back-link">← 返回首页</a></div></div></header>
<main><div class="container">
<h1>Unix时间戳转换工具</h1>
<p class="subtitle">实时Unix时间戳显示，支持时间戳与日期互转</p>
<div class="card">
  <h3>当前时间戳</h3>
  <div class="current-ts" id="currentTs">-</div>
  <div class="ts-controls">
    <button class="btn-sm" onclick="copyTextById('currentTs')">复制秒级</button>
    <button class="btn-sm" onclick="copyTextById('currentMs')">复制毫秒级</button>
    <div style="display:none"><span id="currentMs"></span></div>
  </div>
</div>
<div class="card">
  <h3>时间戳 → 日期</h3>
  <div class="input-group">
    <div style="flex:1"><label>输入时间戳</label><input type="number" id="tsInput" placeholder="如 1700000000" /></div>
    <div style="flex:1"><label>精度</label><select id="tsUnit"><option value="s">秒 (10位)</option><option value="ms">毫秒 (13位)</option></select></div>
    <button class="btn" id="tsToDateBtn">转换</button>
  </div>
  <div class="result-grid">
    <div class="result-item"><div class="label">UTC</div><div class="value" id="utcResult">-</div></div>
    <div class="result-item"><div class="label">本地时间</div><div class="value" id="localResult">-</div></div>
    <div class="result-item"><div class="label">ISO 8601</div><div class="value" id="isoResult">-</div></div>
    <div class="result-item"><div class="label">星期</div><div class="value" id="dayResult">-</div></div>
  </div>
</div>
<div class="card">
  <h3>日期 → 时间戳</h3>
  <div class="input-group">
    <div style="flex:1"><label>选择日期时间</label><input type="datetime-local" id="dateInput" /></div>
    <button class="btn" id="dateToTsBtn">转换</button>
  </div>
  <div class="result" id="dateToTsResult" style="display:none"></div>
</div>
</div></main>
<footer><div class="container"><p>&copy; 2025 Free ToolBase. 所有工具均免费使用。</p></div></footer>
<div id="toast"></div>
<script>
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
function copyTextById(id){var el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.textContent||el.innerText).then(function(){showToast("已复制")})["catch"](function(){showToast("复制失败")})}

function updateCurrentTs(){
  var now = Date.now();
  document.getElementById('currentTs').textContent = Math.floor(now/1000);
  document.getElementById('currentMs').textContent = now;
}
updateCurrentTs();
setInterval(updateCurrentTs, 1000);

document.getElementById('tsToDateBtn').addEventListener('click', function(){
  var val = document.getElementById('tsInput').value.trim();
  if(!val){ showToast('请输入时间戳'); return; }
  var ts = parseInt(val);
  if(document.getElementById('tsUnit').value === 's') ts *= 1000;
  var d = new Date(ts);
  if(isNaN(d.getTime())){ showToast('无效的时间戳'); return; }
  document.getElementById('utcResult').textContent = d.toUTCString();
  document.getElementById('localResult').textContent = d.toString();
  document.getElementById('isoResult').textContent = d.toISOString();
  var days = ['日','一','二','三','四','五','六'];
  document.getElementById('dayResult').textContent = '星期'+days[d.getDay()];
});

document.getElementById('dateToTsBtn').addEventListener('click', function(){
  var val = document.getElementById('dateInput').value;
  if(!val){ showToast('请选择日期时间'); return; }
  var d = new Date(val);
  var sec = Math.floor(d.getTime()/1000);
  var ms = d.getTime();
  var el = document.getElementById('dateToTsResult');
  el.style.display = 'block';
  el.innerHTML = '秒级: <b>'+sec+'</b><br>毫秒级: <b>'+ms+'</b>';
});
</script>
