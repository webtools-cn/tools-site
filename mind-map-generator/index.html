  <style>
    :root{--primary:#4F46E5;--primary-dark:#3730A3;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:20px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
    header p{font-size:.9rem;opacity:.85;margin-top:4px}
    .container{max-width:900px;margin:0 auto;padding:24px 16px 60px}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
    h2{font-size:1.25rem;font-weight:600;margin-bottom:16px;color:var(--primary-dark)}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--text-light)}
    input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .row{display:flex;gap:12px;flex-wrap:wrap}

    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn-secondary{background:#e2e8f0;color:var(--text)}
    .btn-secondary:hover{background:#cbd5e1}
    .btn-danger{background:#fee2e2;color:#dc2626}
    .btn-danger:hover{background:#fecaca}
    .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .mindmap-area{min-height:400px;border:2px dashed var(--border);border-radius:12px;overflow:auto;background:#fff;position:relative}
    .node{position:absolute;padding:10px 16px;border-radius:8px;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}

<body>
  <header>
    <h1>🧠 思维导图生成器</h1>
    <p>快速创建可视化思维导图</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>📝 编辑节点</h2>
      <div class="row">
        <div class="form-group"><label>中心主题</label><input type="text" id="rootText" value="我的项目" oninput="drawMindMap()"></div>
        <div class="form-group"><label>添加子节点</label><input type="text" id="childInput" placeholder="输入子节点内容"></div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addChild()">+ 添加子节点</button>
        <button class="btn btn-secondary" onclick="removeSelected()">🗑️ 删除选中</button>
        <button class="btn btn-secondary" onclick="clearAll()">🔄 清空</button>
        <button class="btn btn-primary" onclick="downloadMindMap()">⬇️ 导出PNG</button>
      </div>
    </div>
    <div class="mindmap-area" id="mindmapArea">
      <canvas id="mindmapCanvas"></canvas>
    </div>
  </div>
  <footer>Free ToolBase - 免费在线工具</footer>
  <div class="toast" id="toast"></div>
  <script>
    let children = ['需求分析','设计','开发','测试','部署'];
    let selectedNode = -1;
    const colors = ['#4F46E5','#7C3AED','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444','#8B5CF6'];
    function drawMindMap(){
      const canvas = document.getElementById('mindmapCanvas');
      const container = document.getElementById('mindmapArea');
      canvas.width = container.clientWidth;
      canvas.height = Math.max(400, children.length*70+120);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const cx = canvas.width/2, cy = 80;
      const rootText = document.getElementById('rootText').value||'中心主题';
      // Draw root node
      ctx.fillStyle = '#4F46E5';
      ctx.beginPath();
      ctx.roundRect(cx-70,cy-22,140,44,12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(rootText, cx, cy+6);
      // Draw children in a circle layout
      const numChildren = children.length;
      if(numChildren>0){
        const r = Math.min(200, numChildren*35);
        const angleStep = Math.min(Math.PI/(numChildren+1)*2, 2*Math.PI/numChildren);
        const startAngle = -Math.PI/2 - (numChildren-1)*angleStep/2;
        children.forEach((child,i)=>{
          const angle = startAngle + i*angleStep;
          const nx = cx + r*Math.cos(angle);
          const ny = cy + 120 + r*Math.sin(angle);
          // Draw line
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy+22);
          ctx.quadraticCurveTo(cx, cy+70, nx, ny);
          ctx.stroke();
          // Draw child node
          const color = colors[i%colors.length];
          ctx.fillStyle = i===selectedNode?'#fbbf24':color;
          ctx.beginPath();
          const tw = ctx.measureText(child).width + 30;
          ctx.roundRect(nx-tw/2, ny-18, tw, 36, 8);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '14px -apple-system,BlinkMacSystemFont,sans-serif';
          ctx.fillText(child, nx, ny+5);
        });
      }
    }
    function addChild(){
      const input = document.getElementById('childInput');
      const text = input.value.trim();
      if(text && !children.includes(text)){
        children.push(text);
        input.value = '';
        drawMindMap();
      }
    }
    function removeSelected(){
      if(selectedNode>=0){
        children.splice(selectedNode,1);
        selectedNode = -1;
        drawMindMap();
      }
    }
    function clearAll(){
      children = [];
      selectedNode = -1;
      drawMindMap();
    }
    function downloadMindMap(){
      const canvas = document.getElementById('mindmapCanvas');
      const link = document.createElement('a');
      link.download = 'mindmap.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    // Click to select node
    document.getElementById('mindmapCanvas').addEventListener('click',e=>{
      const canvas = document.getElementById('mindmapCanvas');
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const cx = canvas.width/2, cy = 80;
      const r = Math.min(200, children.length*35);
      const angleStep = Math.min(Math.PI/(children.length+1)*2, 2*Math.PI/children.length);
      const startAngle = -Math.PI/2 - (children.length-1)*angleStep/2;
      let found = false;
      children.forEach((child,i)=>{
        const angle = startAngle + i*angleStep;
        const nx = cx + r*Math.cos(angle);
        const ny = cy + 120 + r*Math.sin(angle);
        const tw = canvas.getContext('2d').measureText(child).width + 30;
        if(x>nx-tw/2 && x<nx+tw/2 && y>ny-18 && y<ny+18){
          selectedNode = i;
          found = true;
        }
      });
      if(!found) selectedNode = -1;
      drawMindMap();
    });
    window.addEventListener('resize', drawMindMap);
    drawMindMap();
  </script>
</body>
</html>
