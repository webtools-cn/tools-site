    <h1>列提取器</h1>
<p class="tool-description" style="color:#6b7280;font-size:0.95rem;line-height:1.6;margin:0.5rem 0 1rem;">在线CSV/TSV列提取器，粘贴表格数据指定列号或列名，一键提取所需列。支持逗号、制表符等分隔符，免费在线工具，无需注册</p>
    <p class="subtitle">从CSV/TSV表格中提取指定列。粘贴数据，选择分隔符和列，一键提取。</p>
    <div class="control-row">
      <label>分隔符:</label>
      <select id="delimiter">
        <option value=",">逗号 (,)</option>
        <option value="\t">制表符 (Tab)</option>
        <option value=";">分号 (;)</option>
        <option value="|">竖线 (|)</option>
      </select>
      <label>提取列:</label>
      <input type="text" id="columnsInput" placeholder="如: 1,3,5 或 name,email" value="1,3">
      <button class="btn btn-primary" id="extractBtn">提取</button>
      <button class="btn btn-secondary" id="copyBtn">复制结果</button>
    </div>
    <div class="split-panel">
      <div class="panel">
        <h3>原始数据</h3>
        <textarea id="inputData" placeholder="粘贴CSV/TSV数据...">姓名,年龄,城市,职业,薪资
张三,28,北京,工程师,15000
李四,32,上海,设计师,18000
王五,25,深圳,产品经理,20000
赵六,30,广州,运营,12000</textarea>
        <div class="stats" id="inputStats"></div>
      </div>
      <div class="panel">
        <h3>提取结果</h3>
        <textarea id="outputArea" readonly placeholder="提取结果将显示在这里..."></textarea>
        <div class="stats" id="outputStats"></div>
      </div>
    </div>

<section class="related-tools" style="margin:2rem 0;padding:1rem;background:#f8fafc;border-radius:8px;"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#374151;">🔗 相关工具推荐</h2><div style="display:flex;flex-wrap:wrap;gap:4px;"><a href="/character-unicode-finder/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">字符Unicode查询器</a><a href="/css-gradient-border-animation/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">🌈 CSS渐变边框动画生成器</a><a href="/css-specificity-calculator/" style="display:inline-block;padding:6px 12px;margin:4px;background:var(--bg,#f0f0f0);border-radius:6px;text-decoration:none;color:var(--primary,#4F46E5);font-size:14px;">🎨 CSS选择器优先级计算器</a></div></section>

  <div id="toast"></div>
  <script>
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error show' : 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }
  function parseDelimiter(val) {
    if (val === '\\t') return '\t';
    return val;
  }
  function extractColumns() {
    var input = document.getElementById('inputData').value;
    var delim = parseDelimiter(document.getElementById('delimiter').value);
    var colsInput = document.getElementById('columnsInput').value.trim();
    var outputArea = document.getElementById('outputArea');
    if (!input) { outputArea.value = ''; showToast('请先输入数据', true); return; }
    if (!colsInput) { outputArea.value = ''; showToast('请指定要提取的列', true); return; }
    var lines = input.split('\n').filter(function(l){ return l.trim() !== ''; });
    if (lines.length === 0) { outputArea.value = ''; showToast('没有有效数据行', true); return; }
    var header = lines[0].split(delim).map(function(h){ return h.trim(); });
    var colIndices = [];
    var colParts = colsInput.split(',').map(function(c){ return c.trim(); });
    for (var i = 0; i < colParts.length; i++) {
      var part = colParts[i];
      if (/^\d+$/.test(part)) {
        var idx = parseInt(part) - 1;
        if (idx >= 0 && idx < header.length) colIndices.push(idx);
      } else {
        var found = header.indexOf(part);
        if (found !== -1) colIndices.push(found);
      }
    }
    if (colIndices.length === 0) { outputArea.value = ''; showToast('未找到匹配的列，请检查列名或列号', true); return; }
    var result = [];
    for (var r = 0; r < lines.length; r++) {
      var cells = lines[r].split(delim);
      var row = [];
      for (var c = 0; c < colIndices.length; c++) {
        var ci = colIndices[c];
        row.push(ci < cells.length ? cells[ci].trim() : '');
      }
      result.push(row.join(delim));
    }
    outputArea.value = result.join('\n');
    document.getElementById('inputStats').textContent = lines.length + ' 行, ' + header.length + ' 列';
    document.getElementById('outputStats').textContent = result.length + ' 行, ' + colIndices.length + ' 列';
    showToast('成功提取 ' + colIndices.length + ' 列');
  }
  document.getElementById('extractBtn').addEventListener('click', extractColumns);
  document.getElementById('inputData').addEventListener('input', function() {
    var lines = this.value.split('\n').filter(function(l){ return l.trim(); });
    var delim = parseDelimiter(document.getElementById('delimiter').value);
    var cols = lines.length > 0 ? lines[0].split(delim).length : 0;
    document.getElementById('inputStats').textContent = lines.length + ' 行, ' + cols + ' 列';
  });
  document.getElementById('delimiter').addEventListener('change', extractColumns);
  document.getElementById('copyBtn').addEventListener('click', function() {
    var output = document.getElementById('outputArea');
    if (!output.value) { showToast('没有可复制的内容', true); return; }
    output.select();
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  });
  extractColumns();
  </script>
