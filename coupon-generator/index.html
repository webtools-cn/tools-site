<div class="container">
<nav class="nav-back"><a href="/">← 返回首页</a></nav>
<header class="header">
<h1>优惠码生成器</h1>
<div class="lang-switch">
<a href="/coupon-generator/" class="active">中文</a>
<a href="/en/coupon-generator/">EN</a>
</div>
</header>
<div class="input-section" id="app">
<h2>优惠码批量生成</h2>
<div class="row">
<div class="field"><label>前缀 (可选)</label><input type="text" id="prefix" placeholder="VIP-"></div>
<div class="field"><label>后缀 (可选)</label><input type="text" id="suffix" placeholder="-2024"></div>
</div>
<div class="row">
<div class="field"><label>每组长度</label><input type="number" id="seg-len" value="4" min="1" max="20"></div>
<div class="field"><label>分段数</label><input type="number" id="seg-count" value="3" min="1" max="10"></div>
<div class="field"><label>生成数量</label><input type="number" id="count" value="10" min="1" max="500"></div>
</div>
<div class="row"><div class="field"><label>字符集</label><select id="charset" style="width:100%;padding:10px 12px;background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.2);border-radius:8px;font-size:.9rem;margin-bottom:12px"><option value="upper">大写字母</option><option value="upper-num">大写+数字</option><option value="upper-num-safe">大写+数字(去除易混淆字符)</option><option value="all">大小写+数字</option></select></div></div>
<div class="btn-row">
<button class="btn btn-primary" id="btn-generate">立即使用</button>
<button class="btn btn-success" id="btn-copy-all">复制全部</button>
<button class="btn btn-warning" id="btn-clear">清除</button>
</div>
<div class="output-box" id="output" style="margin-top:12px;white-space:pre-wrap;font-family:monospace;min-height:120px;"></div>
</div>
<footer><p>© Free ToolBase · 纯前端处理，数据不上传 · <a href="/privacy-policy/">隐私政策</a> · <a href="/terms-of-service/">服务条款</a></p></footer>
</div>
<div class="toast" id="toast"></div>
<script>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板 / Copied!')}).catch(function(){showToast('复制失败 / Copy failed')})}

var charsets={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',"upper-num":'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',"upper-num-safe":'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',all:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'};
function randomChar(set){return set[Math.floor(Math.random()*set.length)]}
function genSegment(len,set){var s='';for(var i=0;i<len;i++)s+=randomChar(set);return s}
document.getElementById('btn-generate').addEventListener('click',function(){
  var prefix=document.getElementById('prefix').value;
  var suffix=document.getElementById('suffix').value;
  var segLen=parseInt(document.getElementById('seg-len').value)||4;
  var segCount=parseInt(document.getElementById('seg-count').value)||3;
  var count=parseInt(document.getElementById('count').value)||10;
  var charsetName=document.getElementById('charset').value;
  var set=charsets[charsetName]||charsets['upper-num'];
  var codes=[];
  for(var i=0;i<count;i++){
    var code='';
    for(var j=0;j<segCount;j++){code+=(j>0?'-':'')+genSegment(segLen,set)}
    codes.push(prefix+code+suffix);
  }
  document.getElementById('output').textContent=codes.join('\n');
});
document.getElementById('btn-copy-all').addEventListener('click',function(){var v=document.getElementById('output').textContent;if(v)copyText(v);else showToast('无内容可复制')});
document.getElementById('btn-clear').addEventListener('click',function(){document.getElementById('output').textContent=''});

</script>
